<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Contact — Kerem Özdemir</title>
<meta name="description" content="One address, answered.">
<meta name="color-scheme" content="light">
<link rel="canonical" href="https://keremozdemirra.github.io/contact.html">
<meta property="og:title" content="Contact — Kerem Özdemir">
<meta property="og:description" content="One address, answered.">
<meta property="og:type" content="profile">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400&family=Instrument+Sans:wght@400;500&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --serif:"Fraunces",Georgia,serif;
  --sans:"Instrument Sans",-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --display:var(--serif);
  --paper:#f2efe6;
  --paper2:#eae6da;
  --fg:#221e17;
  --ink:var(--fg);
  --dim:#6f6759;
  --line:#d8d2c2;
  --raised:#faf8f1;
  --field:#ffffff;
  --accent:#8a5a24;
  --accent-text:#8a5a24;
  --amber:#b06a24;
  --petrol:#1d2b26;
  --danger:#9c3a1e;
  --ease:cubic-bezier(.23,1,.32,1);
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{background:var(--paper);color:var(--fg);font-family:var(--sans);line-height:1.6}
::selection{background:#e3c893;color:#221e17}
.vh{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
a{color:inherit}
.wrap{max-width:1060px;margin:0 auto;padding:0 clamp(1.2rem,5vw,3rem)}

/* ---------- top bar ---------- */
.bar{position:sticky;top:0;z-index:30;background:color-mix(in srgb,var(--paper) 86%,transparent);
  backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.bar .wrap{display:flex;align-items:center;justify-content:space-between;height:58px}
.bar .home{font-family:var(--serif);font-weight:400;font-size:1.05rem;text-decoration:none;letter-spacing:.01em}
.bar nav{display:flex;gap:clamp(.9rem,2.5vw,1.8rem);align-items:center}
.bar nav a{font-size:.78rem;letter-spacing:.14em;text-transform:uppercase;text-decoration:none;color:var(--dim);
  padding:.3rem 0;border-bottom:1px solid transparent;transition:color .18s var(--ease),border-color .18s var(--ease)}
.bar nav a:hover{color:var(--fg)}
.bar nav a[aria-current]{color:var(--fg);border-bottom-color:var(--accent)}
.langs{display:flex;gap:.1rem;margin-left:.6rem}
.langs button{font-family:var(--mono);font-size:.64rem;letter-spacing:.05em;padding:.3em .45em;
  border:0;background:none;color:var(--dim);cursor:pointer;border-radius:2px}
.langs button:hover{color:var(--fg)}
.langs button[aria-pressed="true"]{color:var(--accent);text-decoration:underline;text-underline-offset:3px}

/* ---------- page head ---------- */
.crown{padding:clamp(3.4rem,9vh,6rem) 0 clamp(2rem,5vh,3rem)}
.crown .no{font-family:var(--mono);font-size:.7rem;letter-spacing:.3em;color:var(--accent);display:block;margin-bottom:1rem}
h1{font-family:var(--serif);font-weight:300;font-size:clamp(2.4rem,6vw,4.2rem);line-height:1.05;letter-spacing:.005em}
.crown p.lede{margin-top:1.2rem;max-width:58ch;font-size:1.05rem;color:var(--dim)}

h2{font-family:var(--serif);font-weight:400;font-size:clamp(1.5rem,3vw,2.1rem);letter-spacing:.005em;margin:0 0 1.2rem}
section{padding:clamp(2.2rem,6vh,4rem) 0}
section + section{border-top:1px solid var(--line)}

/* ---------- profile pieces ---------- */
.story{max-width:62ch;font-size:1.02rem}
.story p+p{margin-top:1em}
.tl{margin-top:.6rem}
.tl .row{display:grid;grid-template-columns:74px 1fr;gap:1.2rem;padding:1.1rem 0;border-top:1px solid var(--line)}
.tl .yr{font-family:var(--mono);font-size:.78rem;color:var(--accent);padding-top:.25rem}
.tl h3{font-family:var(--sans);font-weight:500;font-size:1rem}
.tl .role{display:block;font-family:var(--mono);font-size:.72rem;color:var(--dim);margin:.15rem 0 .4rem}
.tl p{font-size:.92rem;color:#4c463b;max-width:64ch}
.badge{display:inline-block;font-family:var(--mono);font-size:.66rem;letter-spacing:.06em;color:var(--accent);
  border:1px solid var(--line);border-radius:2px;padding:.15em .5em;margin-top:.5rem}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:clamp(1.2rem,4vw,3rem)}
dl .item{display:flex;justify-content:space-between;gap:1rem;padding:.55rem 0;border-bottom:1px solid var(--line);font-size:.9rem}
dl .item .v{color:var(--dim);text-align:right;font-family:var(--mono);font-size:.76rem;padding-top:.15rem;flex-shrink:0}
h3.sub{font-family:var(--sans);font-weight:500;font-size:.85rem;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);margin:0 0 .5rem}
.cv-btn{display:inline-flex;align-items:center;gap:.6rem;margin-top:1.6rem;padding:.7rem 1.2rem;
  border:1px solid var(--fg);border-radius:2px;text-decoration:none;font-size:.82rem;letter-spacing:.1em;text-transform:uppercase;
  transition:background .18s var(--ease),color .18s var(--ease)}
.cv-btn:hover{background:var(--fg);color:var(--paper)}

/* ---------- projects pieces ---------- */
.feature{border:1px solid var(--line);background:var(--raised);padding:clamp(1.4rem,4vw,2.4rem);
  display:grid;grid-template-columns:1fr auto;gap:1rem;align-items:start}
.feature h3{font-family:var(--serif);font-weight:400;font-size:1.6rem}
.feature p{max-width:58ch;font-size:.95rem;color:#4c463b;margin-top:.5rem}
.feature .go{font-family:var(--mono);font-size:.74rem;color:var(--accent);text-decoration:none;white-space:nowrap;
  border-bottom:1px solid var(--line)}
.feature .go:hover{border-bottom-color:var(--accent)}
.repo-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:1px;background:var(--line);
  border:1px solid var(--line);margin-top:.4rem}
.repo{background:var(--paper);padding:1rem 1.1rem;text-decoration:none;transition:background .16s var(--ease)}
.repo:hover{background:var(--raised)}
.repo h3{font-family:var(--sans);font-weight:500;font-size:.95rem}
.repo .t{font-family:var(--mono);font-size:.64rem;letter-spacing:.08em;color:var(--accent);text-transform:uppercase}
.repo p{font-size:.84rem;color:#4c463b;margin-top:.35rem;line-height:1.45}

/* ---------- contact ---------- */
.mail-line{display:flex;flex-wrap:wrap;align-items:center;gap:1rem;margin-top:1rem}
.mail-line a.addr{font-family:var(--serif);font-weight:300;font-size:clamp(1.4rem,4vw,2.6rem);text-decoration:none;
  border-bottom:1px solid var(--line)}
.mail-line a.addr:hover{border-bottom-color:var(--accent)}
.copy{font-family:var(--mono);font-size:.7rem;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);
  background:none;border:1px solid var(--line);border-radius:2px;padding:.5em .9em;cursor:pointer;
  transition:color .15s var(--ease),border-color .15s var(--ease)}
.copy:hover{color:var(--fg);border-color:var(--fg)}
.copy.done{color:var(--accent);border-color:var(--accent)}
.socials{display:flex;gap:1.6rem;margin-top:2rem}
.socials a{font-size:.82rem;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);text-decoration:none;
  border-bottom:1px solid transparent}
.socials a:hover{color:var(--fg);border-bottom-color:var(--fg)}

/* ---------- footer ---------- */
footer{border-top:1px solid var(--line);margin-top:clamp(2rem,6vh,4rem)}
footer .wrap{display:flex;justify-content:space-between;align-items:center;padding-top:1.1rem;padding-bottom:1.4rem;
  font-size:.74rem;color:var(--dim)}
footer a{text-decoration:none;color:var(--dim)}
footer a:hover{color:var(--fg)}

/* ---------- a leaf, falling once ---------- */
.leaf-mark{position:fixed;top:-30px;pointer-events:none;z-index:5;opacity:.85}
@media (prefers-reduced-motion:reduce){.leaf-mark{display:none}}

@media (max-width:640px){
  .tl .row{grid-template-columns:1fr;gap:.2rem}
  .feature{grid-template-columns:1fr}
}
@media print{
  .bar,footer,.leaf-mark,.cv-btn,.langs{display:none!important}
  body{background:#fff;color:#000}
  section{padding:1rem 0}
}
</style>
</head>
<body>
<header class="bar">
  <div class="wrap">
    <a class="home" href="index.html">Kerem Özdemir</a>
    <nav aria-label="Site"><a href="profile.html" data-i="nav-p">Profile</a><a href="projects.html" data-i="nav-j">Projects</a><a href="contact.html" aria-current="page" data-i="nav-c">Contact</a>
      <div class="langs" role="group" aria-label="Language">
        <button type="button" data-lang="en" aria-pressed="true">EN</button>
        <button type="button" data-lang="tr" aria-pressed="false">TR</button>
        <button type="button" data-lang="de" aria-pressed="false">DE</button>
      </div>
    </nav>
  </div>
</header>
<main class="wrap">

<div class="crown">
  <span class="no">03</span>
  <h1 data-i="c-h1">Contact</h1>
  <p class="lede" data-i="c-lede">One address, answered. English, Turkish or German — whichever is yours.</p>
</div>

<section aria-label="Email">
  <div class="mail-line">
    <a class="addr" href="mailto:kozdemir3523@gmail.com">kozdemir3523@gmail.com</a>
    <button type="button" class="copy" data-copy="kozdemir3523@gmail.com" data-label="copy" data-done="copied" data-i="cp">copy</button>
  </div>
  <div class="socials">
    <a href="https://github.com/Keremozdemirra" rel="noopener noreferrer">GitHub</a>
    <a href="https://colaunch.app" rel="noopener noreferrer">CoLaunch</a>
  </div>
  <p style="margin-top:2.4rem;color:var(--dim);font-size:.9rem" data-i="c-note">Based in Munich. I read everything; short and concrete gets the fastest reply.</p>
</section>

</main>
<footer><div class="wrap">
  <span>© 2026 Kerem Özdemir</span>
  <a href="https://github.com/Keremozdemirra" rel="noopener noreferrer">GitHub</a>
</div></footer>
<script>
window.I18N = {"tr": {"nav-p": "Profil", "nav-j": "Projeler", "nav-c": "İletişim", "c-h1": "İletişim", "c-lede": "Tek adres, cevaplanır. İngilizce, Türkçe ya da Almanca — hangisi seninse.", "cp": "kopyala", "c-note": "Münih'teyim. Her şeyi okurum; kısa ve somut olan en hızlı cevabı alır."}, "de": {"nav-p": "Profil", "nav-j": "Projekte", "nav-c": "Kontakt", "c-h1": "Kontakt", "c-lede": "Eine Adresse, beantwortet. Englisch, Türkisch oder Deutsch — was immer Ihres ist.", "cp": "kopieren", "c-note": "In München. Ich lese alles; kurz und konkret bekommt die schnellste Antwort."}};

(function(){
  "use strict";
  /* language: the same dictionaries drive every inner page */
  var lang = "en";
  try { lang = localStorage.getItem("lang") || "en"; } catch(e){}
  var base = {};
  function apply(l){
    var dict = (window.I18N && window.I18N[l]) || {};
    document.querySelectorAll("[data-i]").forEach(function(el){
      var k = el.getAttribute("data-i");
      if(!(k in base)) base[k] = el.innerHTML;
      if(l === "en"){ el.innerHTML = base[k]; return; }
      if(dict[k] !== undefined) el.innerHTML = dict[k];
    });
    document.documentElement.setAttribute("lang", l);
    document.querySelectorAll(".langs button").forEach(function(b){
      b.setAttribute("aria-pressed", b.getAttribute("data-lang") === l ? "true":"false");
    });
    try { localStorage.setItem("lang", l); } catch(e){}
  }
  document.querySelectorAll(".langs button").forEach(function(b){
    b.addEventListener("click", function(){ apply(b.getAttribute("data-lang")); });
  });
  if(lang !== "en") apply(lang);

  /* copy buttons */
  document.querySelectorAll(".copy[data-copy]").forEach(function(b){
    b.addEventListener("click", function(){
      var t = b.getAttribute("data-copy");
      (navigator.clipboard ? navigator.clipboard.writeText(t) : Promise.reject())
        .then(function(){ b.classList.add("done"); b.textContent = b.getAttribute("data-done") || "copied";
          setTimeout(function(){ b.classList.remove("done"); b.textContent = b.getAttribute("data-label") || "copy"; }, 1600); })
        .catch(function(){});
    });
  });

  /* one leaf falls when the page opens — a signature, not a show */
  if(!window.matchMedia("(prefers-reduced-motion: reduce)").matches){
    var leaf = document.createElement("div");
    leaf.className = "leaf-mark";
    leaf.innerHTML = '<svg width="18" height="26" viewBox="0 0 18 26"><path d="M9 1 Q16 9 9 25 Q2 9 9 1Z" fill="#b06a24" opacity=".9"/><path d="M9 3 L9 23" stroke="rgba(0,0,0,.25)" stroke-width=".8"/></svg>';
    document.body.appendChild(leaf);
    var x = 12 + Math.random() * 70, t0 = null, dur = 7000 + Math.random() * 4000;
    function fall(ts){
      if(!t0) t0 = ts;
      var p = (ts - t0) / dur;
      if(p >= 1){ leaf.remove(); return; }
      leaf.style.left = "calc(" + x + "vw + " + (Math.sin(p * 9) * 40) + "px)";
      leaf.style.top = (p * 108) + "vh";
      leaf.style.transform = "rotate(" + (p * 500) + "deg)";
      leaf.style.opacity = p > .85 ? (1 - p) / .15 : 1;
      requestAnimationFrame(fall);
    }
    setTimeout(function(){ requestAnimationFrame(fall); }, 1200);
  }
})();


</script>
</body>
