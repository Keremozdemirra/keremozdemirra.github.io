<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lost underground, Kerem Özdemir</title>
<meta name="author" content="Kerem Özdemir">
<meta name="robots" content="noindex">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22%3E%3Crect width=%2232%22 height=%2232%22 rx=%226%22 fill=%22%231d1610%22/%3E%3Cpath d=%22M16 26V14M16 14C16 14 10 13 8 7C14 8 16 11 16 11M16 14C16 14 22 13 24 7C18 8 16 11 16 11M16 11V6%22 stroke=%22%23e0a050%22 stroke-width=%222%22 stroke-linecap=%22round%22 fill=%22none%22/%3E%3C/svg%3E">
<link rel="stylesheet" href="fonts/fonts.css">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{min-height:100vh;background:radial-gradient(ellipse 60% 45% at 50% 42%, #2c2115 0%, #1b140d 55%, #120d07 100%);
  display:flex;align-items:center;justify-content:center;color:#e9e2d2;
  font-family:"Newsreader",Georgia,serif}
.hole{text-align:center;padding:2rem}
.lantern{width:54px;margin:0 auto 1.8rem;animation:sway 4.5s ease-in-out infinite;transform-origin:top center}
@keyframes sway{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
.lantern .glow{animation:flick 2.8s ease-in-out infinite}
@keyframes flick{0%,100%{opacity:.75}45%{opacity:1}60%{opacity:.68}}
h1{font-family:"Fraunces",Georgia,serif;font-weight:300;font-size:clamp(1.8rem,5vw,2.8rem);letter-spacing:.01em}
p{font-style:italic;color:rgba(233,226,210,.6);margin-top:.8rem;font-size:1.05rem}
a{display:inline-flex;align-items:center;justify-content:center;min-height:48px;
  margin-top:2rem;color:#e0a050;text-decoration:none;font-family:"Fraunces",Georgia,serif;
  border:1px solid rgba(224,160,80,.4);border-radius:3px;padding:.7rem 1.5rem;transition:border-color .2s,background .2s}
a:hover{border-color:rgba(224,160,80,.8);background:rgba(224,160,80,.07)}
a:focus-visible{outline:2px solid #e0a050;outline-offset:3px}
/* the four doors that are usually the one that was wanted */
.ways{display:flex;flex-wrap:wrap;gap:.2rem 1.4rem;justify-content:center;margin-top:1.9rem}
.ways a{margin-top:0;border:0;border-radius:0;padding:.72rem 0;min-height:44px;
  font-size:.92rem;color:rgba(233,226,210,.62);
  border-bottom:1px solid rgba(224,160,80,.22)}
.ways a:hover{background:none;color:#e0a050;border-bottom-color:rgba(224,160,80,.7)}
.langs{display:flex;gap:.4rem;justify-content:center;margin-top:2.2rem}
.langs button{background:none;border:0;cursor:pointer;color:rgba(233,226,210,.55);
  font-family:"Fraunces",Georgia,serif;font-size:.78rem;letter-spacing:.08em;
  min-width:44px;min-height:44px;display:inline-flex;align-items:center;justify-content:center;
  border-radius:2px;transition:color .2s cubic-bezier(.22,1,.36,1)}
.langs button:hover{color:#e9e2d2}
.langs button[aria-pressed="true"]{color:#e0a050;border-bottom:1px solid rgba(224,160,80,.5)}
.langs button:focus-visible{outline:2px solid #e0a050;outline-offset:2px}
@media (prefers-reduced-motion:reduce){.lantern,.lantern .glow{animation:none}}
</style>
</head>
<body>
<main class="hole">
  <svg class="lantern" viewBox="0 0 54 80" aria-hidden="true">
    <line x1="27" y1="0" x2="27" y2="14" stroke="#5a4630" stroke-width="2"/>
    <circle class="glow" cx="27" cy="44" r="26" fill="rgba(224,160,80,.12)"/>
    <rect x="17" y="16" width="20" height="6" rx="2" fill="#3a2c1a"/>
    <path d="M17 22h20l3 30a8 8 0 0 1-8 8H22a8 8 0 0 1-8-8z" fill="#241a10" stroke="#4a3822"/>
    <ellipse class="glow" cx="27" cy="40" rx="7" ry="10" fill="#e8b054"/>
  </svg>
  <h1 data-i="h">Nothing grows here.</h1>
  <p data-i="p">The page you dug for does not exist, or it was never planted.</p>
  <a href="/" data-i="back">Back to the tree</a>
  <nav class="ways" aria-label="Rest of the site" data-ia="a-ways">
    <a href="/profile.html" data-i="w-p">Profile</a>
    <a href="/projects.html" data-i="w-j">Projects</a>
    <a href="/tools.html" data-i="w-t">Tools</a>
    <a href="/contact.html" data-i="w-c">Contact</a>
  </nav>
  <nav class="langs" aria-label="Language" data-ia="a-lang">
    <button type="button" data-lang="en" aria-pressed="true">EN</button>
    <button type="button" data-lang="tr" aria-pressed="false">TR</button>
    <button type="button" data-lang="de" aria-pressed="false">DE</button>
  </nav>
</main>

<script>
/* even the empty room speaks three languages, and it remembers the choice
   made anywhere else on the site */
(function(){
  "use strict";
  var D = {
    tr: { h: "Burada bir şey yetişmiyor.",
          p: "Kazdığın sayfa yok, ya da hiç ekilmedi.",
          back: "Ağaca dön", "a-lang": "Dil", "a-ways": "Sitenin geri kalanı",
          "w-p": "Profil", "w-j": "Projeler", "w-t": "Araçlar", "w-c": "İletişim" },
    de: { h: "Hier wächst nichts.",
          p: "Die Seite, nach der Sie gegraben haben, gibt es nicht, oder sie wurde nie gepflanzt.",
          back: "Zurück zum Baum", "a-lang": "Sprache", "a-ways": "Der Rest der Seite",
          "w-p": "Profil", "w-j": "Projekte", "w-t": "Werkzeuge", "w-c": "Kontakt" }
  };
  var base = {}, baseA = {};
  function apply(l){
    var d = D[l] || {};
    document.querySelectorAll("[data-i]").forEach(function(el){
      var k = el.getAttribute("data-i");
      if(!(k in base)) base[k] = el.textContent;
      el.textContent = (l === "en" || d[k] === undefined) ? base[k] : d[k];
    });
    document.querySelectorAll("[data-ia]").forEach(function(el){
      var k = el.getAttribute("data-ia");
      if(!(k in baseA)) baseA[k] = el.getAttribute("aria-label") || "";
      el.setAttribute("aria-label", (l === "en" || d[k] === undefined) ? baseA[k] : d[k]);
    });
    document.documentElement.setAttribute("lang", l);
    document.querySelectorAll(".langs button").forEach(function(b){
      b.setAttribute("aria-pressed", b.getAttribute("data-lang") === l ? "true" : "false");
    });
    document.title = { tr: "Yeraltında kayboldun, Kerem Özdemir",
                       de: "Unter der Erde verlaufen, Kerem Özdemir" }[l] ||
                     "Lost underground, Kerem Özdemir";
    try { localStorage.setItem("lang", l); } catch(e){}
  }
  document.querySelectorAll(".langs button").forEach(function(b){
    b.addEventListener("click", function(){ apply(b.getAttribute("data-lang")); });
  });
  var start = "en";
  try { start = localStorage.getItem("lang") || "en"; } catch(e){}
  apply(start);
})();
</script>
</body>
</html>
