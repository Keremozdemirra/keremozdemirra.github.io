<style>
/* ============================================================
   The painted world, shared by the games under game/
   The Long Game was written before this file existed and keeps
   its own copy of these rules inside its own source; every game
   built after it takes them from here, so that five pages stay
   one world instead of five.
   ============================================================ */

:root{
  --soil:#2c2115; --timber:#67503a; --terracotta:#8a4a2c;
  --accent:#e0a050; --ink:#2b2620; --paper:#f2efe6; --verdigris:#5e7a6a;
  --ink-soft:#4b443b; --dim:#6f6558; --faint:#6f6759;
  --rule:rgba(103,80,58,.32); --rule-firm:rgba(103,80,58,.55);
  --display:"Fraunces","Iowan Old Style",Georgia,serif;
  --serif:"Newsreader",Georgia,"Times New Roman",serif;
  --mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --card:rgba(242,239,230,.955);
  --card-sunk:rgba(232,227,214,.9);
}

*{box-sizing:border-box}
html,body{margin:0;padding:0;overflow-x:hidden;max-width:100%}
html{-webkit-text-size-adjust:100%}
body{
  font-family:var(--serif); color:var(--ink); background:#c8c4b6;
  min-height:calc(100dvh - var(--barh, 0px)); overscroll-behavior-y:none;
}
canvas#world{
  position:fixed; inset:0; width:100%; height:100%; display:block; z-index:0;
}

.vh{position:absolute;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;
    clip:rect(0 0 0 0);clip-path:inset(50%);white-space:nowrap;border:0}

.skip{position:absolute;left:-9999px;top:0;z-index:60;background:var(--paper);
  color:var(--ink);padding:.6rem .9rem;font-family:var(--mono);font-size:.72rem;
  border:1px solid var(--rule-firm)}
.skip:focus{left:.6rem;top:.6rem}

#shell{
  /* the viewport, less whatever the site bar above it is taking. Asking for
     the whole of it put the start button below the fold on a laptop. */
  position:relative; z-index:2; min-height:calc(100dvh - var(--barh, 0px));
  display:flex; flex-direction:column; justify-content:space-between;
  padding:clamp(.6rem,2vw,1.1rem);
  padding-bottom:calc(clamp(.6rem,2vw,1.1rem) + env(safe-area-inset-bottom,0px));
  gap:.7rem;
}

#topbar{
  display:flex; flex-wrap:wrap; align-items:baseline; gap:.4rem .9rem;
  background:var(--card); border:1px solid var(--rule-firm);
  padding:.5rem .8rem; max-width:64rem; width:100%; margin:0 auto; flex:none;
  box-shadow:0 1px 0 rgba(44,33,21,.14);
}
#topbar .ch{font-family:var(--display);font-weight:400;font-size:.98rem;
  letter-spacing:-.01em;margin:0}
#topbar .meta{font-family:var(--mono);font-size:.63rem;letter-spacing:.12em;
  text-transform:uppercase;color:var(--dim);margin:0}
#topbar .spacer{flex:1 1 auto}
#topbar button{flex:none}

#panel{
  background:var(--card); border:1px solid var(--rule-firm);
  padding:clamp(.85rem,2.4vw,1.25rem);
  max-width:64rem; width:100%; margin:0 auto; flex:none;
  box-shadow:0 2px 0 rgba(44,33,21,.16);
  max-height:74dvh; overflow-y:auto; overscroll-behavior:contain;
}
#panel.read{max-width:49rem}
@media (max-width:900px){ #panel.read{max-width:64rem} }
#panel h2{font-family:var(--display);font-weight:400;font-size:clamp(1.18rem,3.4vw,1.5rem);
  letter-spacing:-.02em;margin:0 0 .45rem;line-height:1.2}
#panel h3{font-family:var(--display);font-weight:400;font-size:1.02rem;margin:1.1rem 0 .35rem}
#panel p{margin:0 0 .6rem;font-size:clamp(.95rem,2.6vw,1.02rem);line-height:1.62;
  max-width:60ch;color:var(--ink-soft)}
#panel p.say{color:var(--ink);font-style:italic}
#panel p.tight{margin-bottom:.35rem}
#panel ul{margin:0 0 .7rem;padding-left:1.1rem;max-width:60ch}
#panel li{font-size:.95rem;line-height:1.6;margin-bottom:.3rem;color:var(--ink-soft)}
#panel a{color:var(--terracotta);text-underline-offset:.2em}
#panel a:hover{color:var(--accent)}

.kicker{font-family:var(--mono);font-size:.63rem;letter-spacing:.14em;
  text-transform:uppercase;color:var(--faint);margin:0 0 .3rem}

.row{display:flex;flex-wrap:wrap;gap:.55rem;margin-top:.75rem;align-items:stretch}
button{
  font-family:var(--serif); font-size:1rem; color:var(--ink);
  background:rgba(253,252,248,.96); border:1px solid var(--rule-firm);
  padding:.6rem 1rem; cursor:pointer; line-height:1.3;
  transition:background-color .13s ease,border-color .13s ease,transform .08s ease;
  min-height:2.75rem;
}
button:hover{background:#fffdf7;border-color:var(--terracotta)}
button:active{transform:translateY(1px)}
button:focus-visible{outline:2px solid var(--terracotta);outline-offset:2px}
button[disabled]{opacity:.45;cursor:default}
button .k{display:block;font-family:var(--mono);font-size:.6rem;letter-spacing:.13em;
  text-transform:uppercase;color:var(--faint);margin-top:.18rem}
button.big{font-family:var(--display);font-size:1.06rem;padding:.7rem 1.25rem;flex:1 1 11rem}
button.share{border-color:rgba(94,122,106,.75);background:rgba(232,238,231,.96)}
button.share:hover{background:#e9f0e7;border-color:var(--verdigris)}
button.keep{border-color:rgba(138,74,44,.7);background:rgba(244,232,224,.96)}
button.keep:hover{background:#f7e9e0;border-color:var(--terracotta)}
button.quiet{font-family:var(--mono);font-size:.65rem;letter-spacing:.12em;
  text-transform:uppercase;padding:.42rem .7rem;min-height:2.1rem;color:var(--dim);
  background:transparent;border-color:var(--rule)}
button.quiet:hover{color:var(--ink);background:rgba(253,252,248,.8)}

.tally{display:flex;flex-wrap:wrap;gap:.35rem 1.4rem;font-family:var(--mono);
  font-size:.72rem;letter-spacing:.04em;color:var(--dim);
  border-top:1px solid var(--rule);padding-top:.55rem;margin-top:.75rem}
.tally b{color:var(--ink);font-weight:500;font-variant-numeric:tabular-nums}

.tblwrap{overflow-x:auto;margin:.4rem 0 .9rem;max-width:100%}
table.pay{border-collapse:collapse;font-family:var(--mono);font-size:.76rem;min-width:20rem}
table.pay th,table.pay td{border:1px solid var(--rule-firm);padding:.42rem .6rem;text-align:center}
table.pay th{font-size:.6rem;letter-spacing:.1em;text-transform:uppercase;
  color:var(--dim);font-weight:500;background:var(--card-sunk)}
table.pay td{background:rgba(253,252,248,.8);min-width:7rem}
table.pay td b{color:var(--terracotta);font-weight:500;font-size:.95rem}
table.pay td span{color:var(--dim)}
table.pay td.win{background:rgba(232,238,231,.9)}

/* ---------- a measured quantity, drawn as a strip ---------- */
.meter{display:grid;grid-template-columns:9.5rem 1fr auto;gap:.6rem;align-items:center;
  font-family:var(--mono);font-size:.7rem;color:var(--dim);margin:.3rem 0}
.meter .bar{height:.7rem;background:rgba(103,80,58,.16);position:relative}
.meter .bar i{position:absolute;inset:0 auto 0 0;display:block;background:var(--terracotta)}
.meter .bar i.good{background:var(--verdigris)}
.meter .n{font-variant-numeric:tabular-nums;color:var(--ink);min-width:3.4rem;text-align:right}
@media (max-width:640px){.meter{grid-template-columns:7.2rem 1fr auto;font-size:.66rem}}

/* ---------- a run of past rounds, as glyphs ---------- */
.glyphs{font-family:var(--mono);font-size:.95rem;letter-spacing:.16em;color:var(--ink);
  word-break:break-all;margin:.2rem 0 .5rem;max-width:60ch}
.glyphs .lose{color:var(--terracotta)}
.glyphs .win{color:var(--verdigris)}

/* ---------- fields ---------- */
.fields{display:grid;gap:.6rem .9rem;grid-template-columns:repeat(auto-fit,minmax(8.5rem,1fr));
  max-width:46rem;margin:.5rem 0 .3rem}
.fields label{display:block;font-family:var(--mono);font-size:.6rem;letter-spacing:.1em;
  text-transform:uppercase;color:var(--dim);margin-bottom:.2rem}
.fields input,.fields select{
  width:100%;font-family:var(--mono);font-size:.85rem;padding:.4rem .5rem;
  background:rgba(253,252,248,.96);border:1px solid var(--rule-firm);color:var(--ink)}
.fields input:focus-visible,.fields select:focus-visible{
  outline:2px solid var(--terracotta);outline-offset:1px}
input[type="range"]{width:100%;max-width:22rem;accent-color:#8a4a2c}
.bignum{font-family:var(--display);font-size:clamp(2rem,9vw,3rem);color:var(--ink);
  line-height:1;margin:.2rem 0 .3rem;font-variant-numeric:tabular-nums}

/* ---------- the source lines at the foot of a game ---------- */
.sources{border-top:1px solid var(--rule);margin-top:1rem;padding-top:.6rem}
.sources li{font-family:var(--mono);font-size:.68rem;line-height:1.65;color:var(--dim);
  margin-bottom:.45rem;word-break:break-word}
.sources li b{color:var(--ink);font-weight:500}
.sources a{color:var(--terracotta);word-break:break-all}

@media (max-width:640px){
  #panel{max-height:62dvh}
  #topbar{padding:.45rem .6rem;gap:.3rem .6rem}
  #topbar .ch{font-size:.92rem}
  button.big{flex:1 1 100%}
  .tally{gap:.25rem .9rem;font-size:.68rem}
}
@media (prefers-reduced-motion:reduce){
  button:active{transform:none}
  button{transition:none}
}

/* ---------- the pasture's own few rules ---------- */
.herd{display:flex;flex-wrap:wrap;gap:.4rem;margin:.5rem 0 .2rem}
.herd button{min-width:2.9rem;font-family:var(--mono);font-size:.95rem;padding:.55rem .5rem}
.herd button[aria-pressed="true"]{background:#e9f0e7;border-color:var(--verdigris);color:var(--ink)}
.book{font-family:var(--mono);font-size:.72rem;color:var(--dim);line-height:1.9;margin:.3rem 0 .2rem}
.book b{color:var(--ink);font-weight:500}
.book .over{color:var(--terracotta)}
.rulecard{border:1px solid var(--rule);padding:.7rem .85rem;margin:.5rem 0;max-width:44rem;
  background:rgba(253,252,248,.55)}
.rulecard h3{margin:0 0 .25rem;font-size:1rem}
.rulecard p{margin:0 0 .4rem;font-size:.95rem}

/* ---------- the site's clothes, worn by an instrument ---------- */
.bar,footer.site-foot,.leaf-mark{
  --serif:"Fraunces",Georgia,serif;
  --sans:"Instrument Sans",-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --paper:#f2efe6;
  --fg:#221e17;
  --dim:#6f6759;
  --line:#d8d2c2;
  --accent:#8a5a24;
  --ease:cubic-bezier(.23,1,.32,1);
}
.bar,footer.site-foot{color:var(--fg)}
footer.site-foot{background:var(--paper)}
.bar .wrap,footer.site-foot .wrap{max-width:calc(64rem + 2 * clamp(.6rem,2vw,1.1rem));
  padding-inline:clamp(.6rem,2vw,1.1rem)}
/* the village is a fixed canvas lying under the whole document, so
   the bar and the footer have to be lifted over it; and the game's
   own overflow rule stops a sticky bar from sticking, so it stands
   still at the top of the page instead of following the scroll */
.bar{position:relative;z-index:3}
footer.site-foot{position:relative;z-index:3}

.wrap{max-width:1180px;margin:0 auto;padding:0 clamp(1.2rem,5vw,3rem)}

/* ---------- top bar ---------- */
.bar{position:sticky;top:0;z-index:30;font-family:var(--sans);background:color-mix(in srgb,var(--paper) 86%,transparent);
  backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.bar .wrap{display:flex;align-items:center;justify-content:space-between;height:58px}
.bar .home{font-family:var(--serif);font-weight:400;font-size:1.05rem;text-decoration:none;letter-spacing:.01em;
  border-bottom:0;color:var(--fg)}
.bar nav:not(.langs){margin-left:auto}
.bar nav{display:flex;gap:clamp(.55rem,1.5vw,1.1rem);align-items:center;flex-wrap:wrap;
  justify-content:flex-end;row-gap:.15rem}
.bar nav a{font-size:.82rem;letter-spacing:.015em;white-space:nowrap;text-decoration:none;color:var(--dim);font-weight:500;
  padding:.3rem 0;border-bottom:1px solid transparent;transition:color .18s var(--ease),border-color .18s var(--ease)}
.bar nav a:hover{color:var(--fg)}
.bar nav a[aria-current]{color:var(--fg);border-bottom-color:var(--accent)}
/* clear of the last nav name by more than the names are clear of each
   other, so the languages read as their own control and not as a tenth
   link in the row */
.langs{display:flex;gap:.1rem;margin-left:clamp(1rem,2.2vw,1.8rem)}
.langs button{font-family:var(--mono);font-size:.64rem;letter-spacing:.05em;padding:.3em .45em;
  border:0;background:none;color:var(--dim);cursor:pointer;border-radius:2px}
.langs button:hover{color:var(--fg)}
.langs button[aria-pressed="true"]{color:var(--accent);text-decoration:underline;text-underline-offset:3px}

/* ---------- footer ---------- */
footer{border-top:1px solid var(--line);margin-top:clamp(2rem,6vh,4rem);
  background:none;font-family:var(--sans);line-height:1.6}
footer .foot-links{display:flex;gap:clamp(.9rem,2.4vw,1.6rem);align-items:center;flex-wrap:wrap}
footer .wrap{display:flex;justify-content:space-between;align-items:center;padding-top:1.1rem;padding-bottom:1.4rem;
  font-size:.74rem;color:var(--dim)}
footer a{text-decoration:none;color:var(--dim);border-bottom:0}
footer a:hover{color:var(--fg)}

/* ---------- a leaf, falling once ---------- */
.leaf-mark{position:fixed;top:-30px;pointer-events:none;z-index:5;opacity:.45}
@media (prefers-reduced-motion:reduce){.leaf-mark{display:none}}

/* ---------- the bar and the footer, narrowed ---------- */
@media (max-width:640px){
  /* the bar gives the pages a line of their own instead of crowding them */
  .bar .wrap{flex-wrap:wrap;height:auto;column-gap:.7rem;row-gap:.1rem;
    padding-top:.5rem;padding-bottom:.15rem}
  .bar .home{white-space:nowrap;font-size:1rem}
  .bar nav{order:3;flex:1 0 100%;margin-top:.05rem;flex-wrap:nowrap;
    justify-content:flex-start;gap:clamp(.7rem,3.4vw,1.2rem);
    overflow-x:auto;overscroll-behavior-x:contain;-webkit-overflow-scrolling:touch;
    scrollbar-width:none;
    /* the last name fades rather than being cut, which is what says there
       is more of it to the right */
    -webkit-mask-image:linear-gradient(90deg,#000 calc(100% - 2.2rem),transparent);
    mask-image:linear-gradient(90deg,#000 calc(100% - 2.2rem),transparent);
    padding-right:2.2rem}
  .bar nav::-webkit-scrollbar{display:none}
  .bar nav a{font-size:.8rem;padding:.55rem 0;flex:0 0 auto}
  /* the name of the page you are on is brought into view on load, so a
     reader arriving deep in the site is not looking at a row that starts
     somewhere else */
  .bar nav a[aria-current]{scroll-margin-inline:1.5rem}
  /* the three languages take the right end of the name's own line: a third
     row of bar would eat a fifth of the screen */
  .bar .wrap{position:relative}
  .langs{position:absolute;top:.1rem;right:clamp(1.2rem,5vw,3rem);margin:0;gap:.15rem}
  .langs button{font-size:.7rem;padding:.2em .4em}
  footer .wrap{gap:1rem;flex-wrap:wrap;padding-bottom:calc(1.4rem + env(safe-area-inset-bottom,0px))}
}

/* nine nav names on a narrow phone: the row takes a second and a third
   line rather than push the page sideways, and the words are set tighter
   so that most phones only need two */
@media (max-width:430px){
  .bar nav{gap:.3rem .5rem}
  .bar nav a{font-size:.74rem;letter-spacing:.005em;padding:.42rem 0}
}

/* a finger, not a cursor: every control a thumb has to find is at least a
   thumb wide, in either orientation */
@media (pointer:coarse){
  .bar .home{display:inline-flex;align-items:center;min-height:44px}
  .bar nav a{min-height:44px;min-width:44px;display:inline-flex;align-items:center;
    justify-content:center;padding:.3rem .3rem}
  .langs{gap:.05rem}
  .langs button{min-width:44px;min-height:44px;padding:.3em .35em;
    display:inline-flex;align-items:center;justify-content:center}
  footer .wrap a{min-width:44px;min-height:44px;display:inline-flex;
    align-items:center;justify-content:flex-end}
}

/* the same thumb, on the page itself */
@media (pointer:coarse){
  .cv-btn{min-height:44px;padding:.8rem 1.25rem}
  .copy,.share-link{min-height:44px;min-width:44px;
    display:inline-flex;align-items:center;justify-content:center}
  .socials a{min-height:44px;display:inline-flex;align-items:center}
  .mail-line a.addr{display:inline-flex;align-items:center;min-height:44px}
  .note-read{min-height:44px;min-width:44px;display:inline-flex;align-items:center;justify-content:center}
  .feature .go{min-height:44px;display:inline-flex;align-items:center}
  .gcard .go{min-height:44px;display:inline-flex;align-items:center}
  .go-block{min-height:44px;display:inline-flex;align-items:center}
  .k-btn,.k-skip,.skip{min-height:44px;display:inline-flex;align-items:center}
  input[type=range]{height:44px}
  select{min-height:44px}
  /* a link sitting inside a sentence: the line opens up so the link can be
     a thumb tall without the paragraph closing over it */
  .quiet-line{line-height:2.1}
  .quiet-line a{display:inline-block;padding:.78rem 0;line-height:1.25}
  .note-item h2 a{display:inline-block;padding:.5rem 0;border-bottom:0;
    text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:5px}
  .note-item h2 a:hover{text-decoration-color:var(--accent)}
  /* fields and their kin: 16px so the phone does not zoom, 44 so it can be hit */
  body input[type="text"],body input[type="email"],body input[type="number"],
  body select,body textarea{font-size:16px;min-height:44px}
  body .frow textarea{min-height:8rem}
  /* a 4px tall slider is not a control: the whole strip takes the touch */
  input[type="range"]{height:44px;margin:0;padding:0}
  /* and a sixteen pixel box is not one either */
  input[type="checkbox"],input[type="radio"]{width:22px;height:22px}
  input[type="checkbox"]+label,input[type="radio"]+label{
    display:inline-flex;align-items:center;min-height:44px}
  .demo-src a{display:inline-flex;align-items:center;min-height:44px}
}

/* ---------- the crown, on a page whose interior is its own ---------- */
.k-crown-no{
  display:flex;align-items:center;gap:.55rem;margin-bottom:.85rem;
  font-family:"Fraunces",Georgia,serif;font-style:italic;font-size:1rem;
  color:var(--accent);
}
.k-crown-no svg{flex:none}
.k-lede h1{margin-top:0}

<body>

<a class="skip" href="#panel" data-i="cm-skip">Skip to the choices</a>

<h1 class="vh" data-i="cm-h1">The Commons</h1>

<canvas id="world" aria-hidden="true"></canvas>

<div id="shell">

  <div id="topbar">
    <p class="ch" id="chLabel">The Commons</p>
    <p class="meta" id="whenLabel">one pasture, four households</p>
    <span class="spacer"></span>
    <button type="button" class="quiet" id="menuBtn" hidden data-i="cm-restart">Start over</button>
  </div>

  <main id="panel" tabindex="-1"></main>

</div>

<p class="vh" id="live" role="status" aria-live="polite" aria-atomic="true"></p>

<script>
/* ============================================================
   The painted world, shared by the games under game/
   ------------------------------------------------------------
   Sky, hills, soil, grass, a house with a lit window, a tree, a
   fence, the people and the things they carry. Everything is
   drawn with canvas primitives. Nothing is loaded, no library is
   used, and once the fonts have arrived no game on this site
   makes a network call.

   The Long Game was written before this file and carries its own
   copy of the same painting inside its own source. Every game
   built after it takes the world from here, and adds only the
   creatures its own subject needs.

   window.KW is the whole surface:
     KW.M            live metrics {W,H,GY,CX,DX,small}
     KW.ctx          the 2d context, after KW.start()
     KW.world        {season, prev, mix, day, dayT, t}
     KW.season(i)    move the year on, with a crossfade
     KW.daylight(v)  0 morning, .55 afternoon, 1 night
     KW.sky()        the current sky pair and how dark it is
     KW.land(t)      sky, hills, the far village, soil and grass
     KW.house(t) .tree(t) .fence(t)
     KW.figure(x,y,t,opts) .basket(x,y,sc,full,spill)

function drawTree(t, ux, scale) {
  if (!treeCanvas) return;
  var W = M.W, GY = M.GY, small = M.small;
  var sk = skyPair();
  var s = (small ? 0.74 : 0.98) * (scale || 1);
  var tx = ux == null ? (small ? W * 0.82 : W * 0.83) : ux, ty = GY;
  ctx.save();
  ctx.translate(tx, ty);
  ctx.scale(s, s);
  shadow(0, treeW * 0.24, 0.26 * (1 - sk.night * 0.5));
  ctx.drawImage(treeCanvas, -treeW / 2, -treeH);
  var gust = reduced ? 0 : (0.5 + Math.sin(t * 0.5) * 0.5);
  var win = sw(3), aut = sw(2), spr = sw(0);
  for (var i = 0; i < leaves.length; i++) {
    var L = leaves[i];
    if (win > 0.5 && L.keep > 1 - (win - 0.5) * 1.6) continue;
    var col = GREENS[L.gi];
    if (aut > 0) col = mix(col, AUTUMN[L.ai], aut * 0.92);
    if (spr > 0 && L.gi % 3 === 0) col = mix(col, BLOSSOM[L.bi], spr * 0.9);
    if (win > 0) col = mix(col, FROST[0], win * 0.7);
    if (sk.night > 0) col = mix(col, [30, 34, 46], sk.night * 0.62);
    var sway = reduced ? 0 : Math.sin(t * 1.6 + L.ph) * (1.2 + L.sway * 5) * (0.4 + gust * 0.6);
    ctx.save();
    ctx.translate(-treeW / 2 + L.x + sway, -treeH + L.y);
    ctx.rotate(L.tilt + sway * 0.03);
    ctx.fillStyle = rgb(col);
    ctx.beginPath();
    ctx.moveTo(0, -L.sz);
    ctx.quadraticCurveTo(L.sz * 0.7, -L.sz * 0.2, 0, L.sz);
    ctx.quadraticCurveTo(-L.sz * 0.7, -L.sz * 0.2, 0, -L.sz);
    ctx.fill();
    ctx.restore();
  }
  ctx.restore();
}

function drawFence(t, ux) {
  var GY = M.GY, small = M.small;
  var sk = skyPair();
  var n = 6;
  var cx = ux == null ? M.CX : ux;
  var bx = cx, by = GY + (small ? 22 : 34);
  var tx = cx + (small ? 16 : 26), ty = GY - (small ? 34 : 54);
  var pts = [];
  for (var i = 0; i < n; i++) {
    var u = i / (n - 1);
    pts.push({ x: lerp(bx, tx, u), y: lerp(by, ty, u), h: lerp(small ? 34 : 52, small ? 13 : 20, u), w: lerp(4.4, 1.8, u) });
  }
  var dark = sk.night;
  var post = mix([103, 80, 58], [34, 32, 44], dark * 0.7);
  var rail = mix([120, 96, 68], [40, 38, 50], dark * 0.7);
  var levels = [0.74, 0.5, 0.26];
  for (var r = 0; r < levels.length; r++) {
    ctx.fillStyle = rgb(rail, 0.95);
    ctx.beginPath();
    for (var j = 0; j < n; j++) {
      var p = pts[j], th = lerp(4.2, 1.6, j / (n - 1));
      var yy = p.y - p.h * levels[r];
      if (j === 0) ctx.moveTo(p.x, yy - th / 2); else ctx.lineTo(p.x, yy - th / 2);
    }
    for (var j2 = n - 1; j2 >= 0; j2--) {
      var p2 = pts[j2], th2 = lerp(4.2, 1.6, j2 / (n - 1));
      ctx.lineTo(p2.x, p2.y - p2.h * levels[r] + th2 / 2);
    }
    ctx.closePath(); ctx.fill();
  }
  for (var k = 0; k < n; k++) {
    var q = pts[k];
    ctx.fillStyle = rgb(post, 0.98);
    ctx.fillRect(q.x - q.w / 2, q.y - q.h, q.w, q.h);
    ctx.fillStyle = "rgba(20,14,8,.32)";
    ctx.fillRect(q.x - q.w / 2, q.y - q.h, q.w * 0.34, q.h);
    ctx.fillStyle = rgb(mix(post, [180, 156, 120], 0.35), 0.95);
    ctx.fillRect(q.x - q.w / 2, q.y - q.h, q.w, 1.4);
  }
  return pts[0];
}

/* ---------- the people ---------- */

function drawFigure(x, y, t, o) {

  ctx.scale(s, s);

  ctx.beginPath(); ctx.moveTo(0, -20); ctx.lineTo(-2 + step * 3.4, -10 + Math.abs(step)); ctx.lineTo(-2 + step * 4.4, 0); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(0, -20); ctx.lineTo(2 - step * 3.4, -10 + Math.abs(step)); ctx.lineTo(2 - step * 4.4, 0); ctx.stroke();
  ctx.strokeStyle = dk("#17110c"); ctx.lineWidth = 2.2;
  ctx.beginPath(); ctx.moveTo(-2 + step * 4.4, 0); ctx.lineTo(1.2 + step * 4.4, 0); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(2 - step * 4.4, 0); ctx.lineTo(5.2 - step * 4.4, 0); ctx.stroke();

  ctx.strokeStyle = coat; ctx.lineWidth = o.stout ? 6.2 : 5;

  ctx.strokeStyle = armCol; ctx.lineWidth = 2.6;
  if (o.pose === "offer") {

  } else if (o.pose === "withhold") {

  } else if (o.pose === "wave") {

    ctx.beginPath(); ctx.moveTo(0, -29); ctx.lineTo(-4, -24); ctx.lineTo(-5, -20); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(0, -29); ctx.lineTo(6, -33); ctx.lineTo(9 + wa * 2, -39 + Math.abs(wa)); ctx.stroke();
    ctx.fillStyle = skin;
    ctx.beginPath(); ctx.arc(9.6 + wa * 2, -40 + Math.abs(wa), 1.7, 0, 6.283); ctx.fill();
  } else if (o.pose === "hold") {

    ctx.beginPath(); ctx.moveTo(0, -29); ctx.lineTo(4, -27); ctx.lineTo(6, -31); ctx.stroke();

    ctx.beginPath(); ctx.moveTo(0, -27); ctx.lineTo(3, -23); ctx.lineTo(6, -24); ctx.stroke();
  } else if (o.pose === "sit") {
    ctx.beginPath(); ctx.moveTo(0, -29); ctx.lineTo(5, -26); ctx.lineTo(8, -24); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(0, -28); ctx.lineTo(-4, -25); ctx.lineTo(-2, -22); ctx.stroke();
  } else {
    var swing = step * 2.4;
    ctx.beginPath(); ctx.moveTo(0, -29); ctx.lineTo(-2 - swing, -24); ctx.lineTo(-2.5 - swing, -19); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(0, -29); ctx.lineTo(2 + swing, -24); ctx.lineTo(2.5 + swing, -19); ctx.stroke();
  }

  if (o.scarf) {
    ctx.strokeStyle = dk(o.scarf); ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(-3.4, -30.5); ctx.lineTo(3.4, -30.5); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(2.4, -30); ctx.lineTo(3.4, -24); ctx.stroke();

  ctx.save();
  ctx.translate(0, -36);

    ctx.fillRect(-5, -1.2, 10, 1.6);
    ctx.strokeStyle = hair; ctx.lineWidth = 2.2; ctx.lineCap = "round";

  } else if (hs === "crop") {
    ctx.beginPath(); ctx.arc(0, -1, 4.9, Math.PI * 1.02, -0.02); ctx.fill();

  } else if (hs === "cap") {

    ctx.fillStyle = dk(o.capCol || "#5b7d8a");

    ctx.fillRect(-7.4, -1.6, 9, 1.5);
  } else if (hs === "hat") {
    ctx.beginPath(); ctx.arc(0, -0.6, 4.9, Math.PI, 0); ctx.fill();
    ctx.fillStyle = dk(o.capCol || "#6b5334");

    ctx.fillRect(-4.2, -10, 8.4, 5.6);

  } else if (o.prop === "spear") {
    ctx.strokeStyle = dk("#6b5334"); ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(9, -30); ctx.lineTo(11, 1); ctx.stroke();
    ctx.fillStyle = dk("#6f6759");
    ctx.beginPath(); ctx.moveTo(9, -30); ctx.lineTo(11.4, -36); ctx.lineTo(11.6, -29.6); ctx.closePath(); ctx.fill();
  } else if (o.prop === "dog") {
    ctx.save();
    ctx.translate(-13, 0);
    ctx.fillStyle = dk("#5a4a34");
    ctx.beginPath(); ctx.ellipse(0, -5, 5.4, 3.2, 0, 0, 6.283); ctx.fill();
    ctx.beginPath(); ctx.arc(5, -8.4, 2.8, 0, 6.283); ctx.fill();
    ctx.strokeStyle = dk("#5a4a34"); ctx.lineWidth = 1.6; ctx.lineCap = "round";
    ctx.beginPath(); ctx.moveTo(-3, -3); ctx.lineTo(-3.4, 0); ctx.moveTo(3, -3); ctx.lineTo(3.4, 0); ctx.stroke();
    var tw = reduced ? 0 : Math.sin(t * 6) * 2.4;
    ctx.beginPath(); ctx.moveTo(-5, -6); ctx.lineTo(-8, -9 + tw); ctx.stroke();
    ctx.restore();

  ctx.restore();
}

function drawBasket(x, y, sc, full, spill) {

/* ---------- weather ---------- */

var motes = [];
function stepMotes(t, dt) {
  var win = sw(3), spr = sw(0), aut = sw(2);
  var want = reduced ? 0 : Math.round(win * (M.small ? 30 : 60) + spr * (M.small ? 12 : 22) + aut * (M.small ? 14 : 26));
  while (motes.length < want) {
    motes.push({ x: Math.random() * M.W, y: Math.random() * M.GY, vx: (Math.random() - 0.5) * 12,
                 vy: 12 + Math.random() * 26, r: 1 + Math.random() * 2.2, ph: Math.random() * 6.28 });
  }
  while (motes.length > want) motes.pop();
  for (var i = 0; i < motes.length; i++) {
    var m = motes[i];
    m.y += m.vy * dt;
    m.x += (m.vx + Math.sin(t * 1.4 + m.ph) * 14) * dt;
    if (m.y > M.GY - 2) { m.y = -6; m.x = Math.random() * M.W; }
    if (m.x < -10) m.x = M.W + 8; else if (m.x > M.W + 10) m.x = -8;
  }
}
function drawMotes() {
  var win = sw(3), spr = sw(0), aut = sw(2);
  var col = win > Math.max(spr, aut) ? [236, 240, 240] : spr > aut ? [238, 196, 214] : [196, 120, 52];
  var sk = skyPair();
  ctx.fillStyle = rgb(mix(col, [60, 62, 80], sk.night * 0.5), 0.7);
  for (var i = 0; i < motes.length; i++) {
    var m = motes[i];
    ctx.beginPath(); ctx.arc(m.x, m.y, m.r, 0, 6.283); ctx.fill();
  }
}

/* ---------- the loop ---------- */

var lastT = 0;
function paint(t) {
  ctx.setTransform(M.DPR, 0, 0, M.DPR, 0, 0);
  drawSky(t);
  drawLand(t);
  if (drawGame) drawGame(t);
  drawMotes();
  var v = ctx.createRadialGradient(M.W / 2, M.GY * 0.55, M.GY * 0.4, M.W / 2, M.GY * 0.6, Math.max(M.W, M.H) * 0.8);
  v.addColorStop(0, "rgba(0,0,0,0)");
  v.addColorStop(1, "rgba(10,10,16,.26)");
  ctx.fillStyle = v;
  ctx.fillRect(0, 0, M.W, M.H);
}
function frameOnce() { paint(world.t); }
function frame(now) {
  var tt = now / 1000;
  var dt = Math.min(0.05, tt - lastT || 0.016);
  lastT = tt;
  if (!reduced) world.t = tt;
  if (world.mix < 1) world.mix = Math.min(1, world.mix + dt * (reduced ? 4 : 0.9));
  world.dayT += (world.day - world.dayT) * (reduced ? 1 : Math.min(1, dt * 1.6));
  stepMotes(world.t, dt);
  paint(world.t);
  requestAnimationFrame(frame);
}

/* ---------- the interface, in ordinary HTML ---------- */

var ui = {
  panel: null, live: null,
  say: function (msg) { if (ui.live) ui.live.textContent = msg; },
  top: function (title, when) {
    var a = $("chLabel"), b = $("whenLabel");
    if (a) a.textContent = title;
    if (b) b.textContent = when;
  },
  clear: function () { while (ui.panel.firstChild) ui.panel.removeChild(ui.panel.firstChild); },
  para: function (txt, cls) { var p = el("p", cls || null, txt); ui.panel.appendChild(p); return p; },
  head: function (txt) { var h = el("h2", null, txt); ui.panel.appendChild(h); return h; },
  sub: function (txt) { var h = el("h3", null, txt); ui.panel.appendChild(h); return h; },
  kick: function (txt) { var k = el("p", "kicker", txt); ui.panel.appendChild(k); return k; },
  list: function (items, cls) {
    var u = el("ul", cls || null);
    items.forEach(function (s) { u.appendChild(el("li", null, s)); });
    ui.panel.appendChild(u);
    return u;
  },
  actions: function () { var r = el("div", "row"); ui.panel.appendChild(r); return r; },
  btn: function (row, label, key, fn, cls) {
    var b = el("button", cls || null);
    b.appendChild(document.createTextNode(label));
    if (key) b.appendChild(el("span", "k", key));
    b.addEventListener("click", function () { ui.acted = true; fn(); });
    row.appendChild(b);
    return b;
  },
  meter: function (label, u, value, good) {
    var d = el("div", "meter");
    d.appendChild(el("span", null, label));
    var bar = el("div", "bar"), fill = el("i", good ? "good" : null);
    fill.style.width = clamp(u, 0, 1) * 100 + "%";
    bar.appendChild(fill);
    d.appendChild(bar);
    d.appendChild(el("span", "n", value));
    ui.panel.appendChild(d);
    return d;
  },
  glyphs: function (parts) {
    var d = el("p", "glyphs");
    parts.forEach(function (p) {
      var s = el("span", p.cls || null, p.txt);
      d.appendChild(s);
    });
    ui.panel.appendChild(d);
    return d;
  },
  sources: function (items) {
    var u = el("ul", "sources");
    items.forEach(function (it) {
      var li = el("li");
      li.appendChild(el("b", null, it.what));
      li.appendChild(document.createTextNode(" " + it.cite + " "));
      var a = el("a", null, it.url);
      a.href = it.url; a.rel = "noopener noreferrer";
      li.appendChild(a);
      if (it.tail) li.appendChild(document.createTextNode(" " + it.tail));
      u.appendChild(li);
    });
    ui.panel.appendChild(u);
    return u;
  },
  acted: false,
  reading: {},
  focusFirst: function (viewName) {
    ui.panel.scrollTop = 0;
    if (!ui.acted) return;
    if (ui.reading[viewName]) { ui.panel.focus({ preventScroll: true }); return; }
    var b = ui.panel.querySelector("button:not([disabled])");
    if (b) b.focus({ preventScroll: true });
  }
};

function store(key) {
  return {
    save: function (o) { try { localStorage.setItem(key, JSON.stringify(o)); } catch (e) {} },
    load: function () {
      try {
        var raw = localStorage.getItem(key);
        return raw ? JSON.parse(raw) : null;
      } catch (e) { return null; }
    },
    wipe: function () { try { localStorage.removeItem(key); } catch (e) {} }
  };
}

function keys(fn) {
  document.addEventListener("keydown", function (e) {
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    var tag = (e.target && e.target.tagName) || "";
    if (tag === "INPUT" || tag === "SELECT" || tag === "TEXTAREA") return;
    fn(String(e.key || "").toLowerCase(), e);
  });
}

function start(opts) {
  opts = opts || {};
  cv = $("world"); ctx = cv.getContext("2d");
  api.ctx = ctx;
  ui.panel = $("panel"); ui.live = $("live");
  anchorSel = opts.anchor || "#panel";
  groundLift = opts.lift || 0;
  drawGame = opts.draw || null;
  onResize = opts.resize || null;
  var rsz;
  window.addEventListener("resize", function () {
    clearTimeout(rsz);
    rsz = setTimeout(resize, 120);
  }, { passive: true });
  /* the game gets its first screen before the first paint, so that the
     panel it writes is what the ground line is measured against */
  if (opts.ready) opts.ready();
  resize();
  requestAnimationFrame(frame);
}

var api = {
  reduced: reduced, FAST: FAST,
  $: $, el: el, clamp: clamp, lerp: lerp, smooth: smooth, rgb: rgb, mix: mix, mulberry: mulberry,
  M: M, ctx: null, world: world, SEASONS: SEASON_NAMES,
  sw: sw, sky: skyPair, shadow: shadow,
  land: drawLand, house: drawHouse, tree: drawTree, fence: drawFence,
  figure: drawFigure, basket: drawBasket, coin: drawCoin, slate: drawSlate,
  hill: hill,
  season: function (i, immediate) {
    world.prev = world.season;
    world.season = ((i % 4) + 4) % 4;
    world.mix = (immediate || world.season === world.prev) ? 1 : 0;
  },
  daylight: function (v, immediate) {
    world.day = clamp(v, 0, 1);
    if (immediate) world.dayT = world.day;
  },
  green: function (v) { greenLoss = clamp(v, 0, 1); },
  villages: function (v) { showVillage = !!v; },
  lift: function (v) { groundLift = v || 0; layout(); },
  layout: layout,
  ui: ui, store: store, keys: keys, start: start
};
return api;
})();
</script>

1e-h": "Nerede durdu", "cm-p1e-p1": "Mera sonsuza kadar {n} hayvan besleyebilir; bu da dört haneye aşağı yukarı üçer eder. {p} hayvanda ot, büyüdüğünden hızlı yeniyordu ve büyüdüğünden hızlı yenen ot bir yerde durmaz. Düşer.", "cm-p1e-p2": "Yukarıda kimse mantıksız bir şey yapmıyordu. Fazladan bir hayvan, sahibi olan haneye koca bir teker peynir eder; o hayvanın ota verdiği zararsa dört hane arasında bölüşülür. Yani kararının maliyetinin dörtte üçünü başkası öder. Bu aritmetikle herkes yüz yüze, o yüzden herkes bir hayvan ekliyor ve hepsinin bedelini mera ödüyor.", "cm-p1e-coll": "Ot {y}. yılda tükendi. {m} tekerle bitirdin.", "cm-p1e-ok": "{m} tekerle ve {b} üzerinden {a} durumda bir merayla bitirdin.", "cm-p1e-cmp": " Dört hane, {y} yılın hepsinde üçer hayvan tutsaydı her biri yaklaşık {q} ile bitirirdi.", "cm-p1e-better": "Demek ondan iyi yaptın; bu da oyunun kusuru değil, işin zorluğunun kendisi. Ot olduğu sürece bir fazla hayvan tutan hane, bir eksik tutandan iyi durumdadır; başkaları ne yaparsa yapsın. Fatura, kimsenin saymadığı son yıldan sonra gelir.", "cm-p1e-after": "Onun yerine bundan sonraki yıla bak. {e} seviyesinde tutulan bir mera, orada tutulduğu sürece her haneye yılda yaklaşık {p} teker ödemeye devam eder. Seninki {a} durumda ve üstünde hiçbir şey olmadan tamamen kendi hâline bırakılsa yarıya dönmesi yaklaşık {y} yıl alır.", "cm-p1e-stop": "Hikâye genelde burada, insan doğası üzerine bir kıssayla durdurulur. Durulacak yanlış yer, çünkü dördünüzün konuşmasına hiç izin verilmedi.", "cm-b-agree": "Şimdi bir şeyde anlaşın", "cm-s-p1e": "Birinci kısmın sonu. Mera sonsuza kadar toplam yaklaşık {n} hayvan taşır.", "cm-r-kick": "İkinci kısım", "cm-r-h": "Dördünüz oturuyorsunuz", "cm-r-p1": "Aynı mera, yeniden gücünde; aynı dört hane, sonsuza kadar taşıyabildiği aynı on iki civarı hayvan. Bu kez önce bir şeyde anlaşmanıza izin var. Birini seç, sonra on dört yıl boyunca onun içinde yaşa.", "cm-b-live": "Bu kuralda yaşa", "cm-r-p2": "Üçü de bir hayvanın değer ıların kendileri ya da onlara hesap veren biri tarafından yürütülmesi. Kademeli yaptırımlar: ilk ihlalde hafif, tekrarlandıkça sertleşen. Kullanıcıların katıldığı karar süreçleri. Ve dış otoritelerin, kullanıcıların kendi kendilerini örgütleme hakkını tanıması.", "cm-e-sub3": "Bunun göstermediği", "cm-e-m1": "Buradaki komşular üç kısa kural ve ikinci kısımda anlaşmaya çoğunlukla model öyle dediği için uyuyorlar. Asıl soru, insanların kendi yaptıkları anlaşmaya uyup uymadığı; bu oyun onu göstermek yerine varsayıyor.", "cm-e-m2": "Ot, ders kitabındaki bir büyüme eğrisini izleyen tek bir sayı; her yıl kenarlardan bir miktar tohum savrulsun ki çıplak bir tarla geri gelebilsin. İkisi de modele yazılmış varsayımlar. Gerçek bir merada toprak, hava, hastalık ve kimsenin hayvanıyla ilgisi olmayan kötü bir yıl vardır.", "cm-e-m3": "Ostrom'un vakaları çoğunlukla uzun ortak geçmişi ve net sınırları olan küçük gruplardı. Onun çalışmasında her ortak varlığın kullanıcıları tarafından yönetilebileceği yazmaz ve başarısız vakalar da kaydın parçasıdır.", "cm-e-m4": "Ünlü müştereklerin trajedisi savı, kuralsız açık erişimde ne olacağı konusunda yanlış değildir. Yanlış olduğu yer, bunu yalnızca özel mülkiyetin ya da dışarıdan bir otoritenin önleyebileceği şeklinde okunmasıdır.", "cm-e-m5": "Dört hane ve tek mera kolay durumdur. Ne koca bir denizin balıkçılığı ne de atmosfer; kayıttaki başarılı vakaların sınırlarına, küçük sayılarına ve ortak geçmişine sahiptir.", "cm-e-src": "Kaynaklar", "cm-src1": "Bulgu.", "cm-src2": "Tasarım ilkeleri ve Hardin okuması.", "cm-src-tail": "Okundu: 2026 08 21. Almanca ve Türkçe aktarımlar bana ait.", "cm-fam": "Ailenin geri kalanı; tehlikenin açgözlülük değil şüphe olduğu bir av da dahil: ", "cm-fam-a": "bütün oyunlar burada", "cm-b-another": "Başka bir kural dene", "cm-b-gateagain": "Kapıyı yeniden aç", "cm-s-end": "Son. Trajedi, kullanıcıların anlaşıp uygulatabildiği kurallara bağlıdır.", "cm-k-return": "enter", "cm-k-start": "başla", "cm-k-begin": "başla", "cm-k-go": "devam", "cm-k-again": "tekrar", "cm-k-enter": "enter", "pg-title": "Ortak Otlak"}, "de": {"pg-desc": "Eine Weide, vier Haushalte und jedes Jahr eine Entscheidung darüber, wie viele Tiere aufgetrieben werden. Sehen Sie das Gras verschwinden und versuchen Sie dieselbe Weide dann noch einmal unter einer Regel, die Sie vier gemeinsam wählen.", "cm-h1": "Die Allmende", "cm-skip": "Zu den Entscheidungen springen", "cm-restart": "Von vorn beginnen", "cm-name": "Die Allmende", "cm-when-one": "eine Weide, vier Haushalte", "cm-when-first": "das erste Jahr", "cm-when-spring": "Frühjahr des Jahres {a} von {b}", "cm-when-autumn": "Herbst des Jahres {n}", "cm-when-what": "was dort oben geschah", "cm-when-rule": "eine eigene Regel", "cm-when-arg": "das Argument, schlicht gesagt", "cm-you": "Sie", "cm-rn-none": "Gar keine Regel", "cm-rn-quota": "Eine Quote von drei", "cm-rn-watched": "Eine Quote, und alle Zahlen an der Tür", "cm-rn-fined": "Eine Quote, die Zahlen an der Tür und eine gestufte Strafe", "cm-rl-none": "Jeder treibt aus, was er für richtig hält.", "cm-rl-quota": "Jeder Haushalt verpflichtet sich auf drei Tiere auf der Weide. Niemand zählt irgendwen.", "cm-rl-watched": "Dieselben drei, und am Ende jedes Jahres wird die Zahl jedes Haushalts mit Kreide an die Tür des Versammlungshauses geschrieben, wo alle vier sie lesen können.", "cm-rl-fined": "Dieselben drei und dieselbe Tür; ein Haushalt über seiner Zahl verliert beim ersten Mal einen Tag Weide und beim zweiten den Wert eines ganzen Tieres.", "cm-t-p1": "Die Weide über dem Dorf gehört allen vier Haushalten und keinem. Jedes Frühjahr entscheidet jeder Haushalt, wie viele Tiere er auftreibt. Niemand bittet um Erlaubnis, denn es gibt niemanden, den man fragen könnte.", "cm-t-p2": "Gras wächst nach. Am schnellsten, wenn es halb abgefressen ist, und kaum noch, wenn nichts mehr da ist; und die Tiere aller vier Haushalte fressen vom selben Feld.", "cm-b-resume": "Weiter ab Jahr {n}", "cm-b-gate": "Das Gatter öffnen", "cm-s-title": "Die Allmende. Eine Weide, vier Haushalte, und jedes Frühjahr eine Entscheidung.", "cm-m-pasture": "Die Weide", "cm-m-worth": "Was ein Tier wert ist", "cm-m-offull": "{a} von {b}", "cm-m-wheel": "{q} Laib", "cm-led-a": "Ihre Käse ", "cm-led-b": "Jahr ", "cm-oi-kick": "Teil eins", "cm-oi-h": "Niemand hat etwas vereinbart", "cm-oi-p1": "Ana, Bruno und Deniz halten ihre Tiere auf derselben Weide wie Sie. Es gibt keine Vereinbarung zwischen Ihnen vieren und keinen Weg, eine zu treffen: In diesem Teil des Spiels wird nicht geredet.", "cm-oi-p2": "Jedes Frühjahr wählen Sie, wie viele Tiere Sie auftreiben, von eins bis sechs, und sie auch. Im Herbst wird das Gras gezählt.", "cm-b-firstspring": "Das erste Frühjahr", "cm-s-oi": "Teil eins. Wählen Sie, wie viele Tiere Sie auftreiben.", "cm-y-kick": "Jahr {n}", "cm-y-h-bare": "Dort oben ist fast nichts mehr", "cm-y-h": "Wie viele treiben Sie auf", "cm-y-p0": "Die Weide ist bei Kräften. Jedes Tier, das Sie den Sommer über darauf halten, kommt im Herbst einen Laib Käse wert zurück, oder weniger, wenn das Gras dünn war.", "cm-y-quota": "Vereinbart sind {q} Tiere je Haushalt. Sie können trotzdem mehr auftreiben. Ob es jemand erfährt, hängt davon ab, welche Regel Sie vier gewählt haben.", "cm-ly-a": "Im letzten Jahr hatten Sie vier zusammen {t} Tiere draußen. ", "cm-ly-fat": "Die Tiere kamen fett zurück.", "cm-ly-light": "Die Tiere kamen leichter zurück, als sie hinausgingen.", "cm-ly-thin": "Die Tiere kamen mager zurück, und der Boden scheint durch.", "cm-ly-bare": "Die Weide ist kahl, und was zurückkam, war das Halten kaum wert.", "cm-b-turnout": "{c} auftreiben", "cm-anim1": "{n} Tier", "cm-animN": "{n} Tiere", "cm-s-year": "Jahr {n}. Die Weide steht bei {a} von {b}. Wählen Sie mit den Zifferntasten eins bis sechs Tiere und treiben Sie sie auf.", "cm-h-h-gone": "Die Weide ist dahin", "cm-h-h-showing": "Der Boden scheint durch", "cm-h-h-count": "Die Zählung", "cm-h-line": "Sie trieben {a} auf. Ana {b}, Bruno {c}, Deniz {d}. {t} Tiere auf einer Weide.", "cm-h-p2": "Das Gras stand im Frühjahr bei {a} und steht jetzt bei {b}. Sie holten {e} Laibe Käse aus dem Jahr.", "cm-h-bare": "Dort oben ist nichts Grünes mehr. Es kommt zurück, aber langsam, denn Gras wächst aus Gras, und es ist fast keines mehr da, aus dem es wachsen könnte.", "cm-over-1": "{w} lag über der vereinbarten Zahl, und am Morgen stand es an der Tür.", "cm-over-n": "{w} lagen über der vereinbarten Zahl, und am Morgen stand es an der Tür.", "cm-and": " und ", "cm-b-what1": "Was dort oben geschah", "cm-b-what2": "Was die Regel getan hat", "cm-b-nextspring": "Das nächste Frühjahr", "cm-s-harvest": "{line} Die Weide steht bei {a} von {b}.", "cm-p1e-kick": "Ende von Teil eins", "cm-p1e-h-coll": "Es ging dahin, und es ging schnell", "cm-p1e-h": "Wo es endete", "cm-p1e-p1": "Die Weide kann für immer {n} Tiere ernähren, etwa drei je Haushalt. Bei {p} Tieren wurde das Gras schneller gefressen, als es wuchs, und Gras, das schneller gefressen wird, als es wächst, pendelt sich nicht ein. Es fällt.", "cm-p1e-p2": "Niemand dort oben tat etwas Unvernünftiges. Ein weiteres Tier ist dem Haushalt, dem es gehört, einen ganzen Laib Käse wert, und der Schaden, den es dem Gras zufügt, verteilt sich auf vier Haushalte; drei Viertel der Kosten Ihrer Entscheidung zahlt also jemand anderes. Vor dieser Arithmetik stehen alle, also legt jeder ein Tier zu, und die Weide bezahlt alles.", "cm-p1e-coll": "Das Gras gab im Jahr {y} auf. Sie schlossen mit {m} Laiben ab.", "cm-p1e-ok": "Sie schlossen mit {m} Laiben und einer Weide bei {a} von {b} ab.", "cm-p1e-cmp": " Vier Haushalte mit je drei Tieren, alle {y} Jahre lang, hätten jeder mit etwa {q} abgeschlossen.", "cm-p1e-better": "Sie schnitten also besser ab, und das ist die Schwierigkeit, kein Fehler des Spiels. Solange Gras da ist, steht der Haushalt mit einem Tier mehr besser da als der mit einem weniger, was auch immer die anderen tun. Die Rechnung kommt nach dem letzten Jahr, das noch irgendwer zählt.", "cm-p1e-after": "Sehen Sie stattdessen auf das Jahr danach. Eine bei {e} gehaltene Weide zahlt jedem Haushalt etwa {p} Laibe im Jahr, solange sie dort gehalten wird. Ihre steht bei {a}, und ganz sich selbst überlassen, mit gar nichts darauf, bräuchte sie etwa {y} Jahre, um auf die Hälfte zurückzukommen.", "cm-p1e-stop": "Hier hört die Geschichte gewöhnlich auf, mit einer Moral über die menschliche Natur. Es ist die falsche Stelle zum Aufhören, denn Sie vier durften nie miteinander reden.", "cm-b-agree": "Jetzt etwas vereinbaren", "cm-s-p1e": "Ende von Teil eins. Die Weide trägt für immer insgesamt etwa {n} Tiere.", "cm-r-kick": "Teil zwei", "cm-r-h": "Sie vier setzen sich zusammen", "cm-r-p1": "Dieselbe Weide, wieder bei Kräften, dieselben vier Haushalte, dieselben rund zwölf Tiere, die sie für immer tragen kann. Diesmal dürfen Sie zuerst etwas vereinbaren. Wählen Sie eine Regel, und leben Sie dann vierzehn Jahre darin.", "cm-b-live": "In dieser Regel leben", "cm-r-p2": "Keine der drei ändert, was ein Tier wert ist oder wie schnell Gras wächst. Sie ändern nur, was Sie vier voneinander wissen und was daraus folgt.", "cm-s-rules": "Wählen Sie eine Regel: eine Quote, eine Quote mit allen Zahlen an der Tür, oder eine Quote mit den Zahlen und einer gestuften Strafe.", "cm-e-kick": "Das Ende", "cm-e-h": "Die Tragik ist ein Ergebnis über Regeln, nicht über Menschen", "cm-e-p1": "Unter der Regel {r} endete die Weide bei {a} von {b}, und Sie schlossen mit {m} Laiben ab. Teil eins endete bei {a2} mit {m2}.", "cm-e-p2": "Am Gras änderte sich zwischen den beiden Teilen nichts. Am Wert eines Tieres änderte sich nichts. Was sich änderte, war, ob Sie vier die Zahlen der anderen sehen konnten und was geschah, wenn jemand darüber lag.", "cm-e-sub1": "Warum Zählen wichtiger ist als Vereinbaren", "cm-e-p3": "Eine Quote, die niemand prüft, ist ein Wunsch. Sie funktioniert, solange alle sie halten, und sie rutscht in dem Moment, in dem ein Haushalt darüber liegt und nichts folgt, denn die anderen sind keine Narren und sehen das Gras schwinden. Die Zahlen an die Tür zu schreiben bestraft niemanden. Es bedeutet nur, dass Überschreiten etwas ist, das die anderen wissen, und das erweist sich als der größte Teil der Arbeit.", "cm-e-p4": "Die Strafe in diesem Spiel ist mit Absicht klein. Ein Tag Weide, dann ein Tier. Keine Strafe, an der jemand zugrunde ginge, und das muss sie auch nicht sein, denn es geht ihr nicht ums Geld.", "cm-e-sub2": "Was die Bilanz sagt", "cm-e-p5": "Elinor Ostrom verbrachte eine Laufbahn damit, Feldstudien über Weiden, Wälder, Fischgründe und Grundwasserbecken zu lesen, in denen die Nutzer sich selbst regierten. Das Nobelkomitee fasste den Befund bei der Bekanntgabe des Preises 2009 zusammen. In seinen Worten kann Gemeinschaftseigentum \u201evon Nutzervereinigungen erfolgreich verwaltet werden\u201c, und die Ergebnisse seien \u201eöfter besser, als die Standardtheorien vorhersagen\u201c, weil Ressourcennutzer \u201ehäufig ausgefeilte Mechanismen für Entscheidungen und Regeldurchsetzung entwickeln, um Interessenkonflikte zu bewältigen\u201c.", "cm-e-p6": "Die Ordnungen, die hielten, hatten Gemeinsamkeiten. Regeln, die klar sagen, wem was zusteht. Beobachtung und Sanktionierung durch die Nutzer selbst oder durch jemanden, der ihnen Rechenschaft schuldet. Gestufte Sanktionen, mild beim ersten Verstoß und strenger bei Wiederholung. Entscheidungsverfahren, an denen die Nutzer teilhaben. Und die Anerkennung äußerer Autoritäten, dass die Nutzer sich überhaupt selbst organisieren dürfen.", "cm-e-sub3": "Was das nicht zeigt", "cm-e-m1": "Die Nachbarn hier sind drei kurze Regeln, und in Teil zwei halten sie die Vereinbarung meist, weil das Modell es so sagt. Die eigentliche Frage, ob Menschen eine selbst getroffene Vereinbarung halten, wird hier vorausgesetzt statt gezeigt.", "cm-e-m2": "Das Gras ist eine einzige Zahl auf einer Lehrbuch-Wachstumskurve, mit etwas Samenflug von den Rändern in jedem Jahr, damit ein kahles Feld überhaupt zurückkommen kann. Beides sind ins Modell geschriebene Annahmen. Eine echte Weide hat Boden, Wetter, Krankheit und ein schlechtes Jahr, das mit niemandes Tieren zu tun hat.", "cm-e-m3": "Ostroms Fälle waren meist kleine Gruppen mit langer gemeinsamer Geschichte und klaren Grenzen. Nirgends in ihrer Arbeit steht, dass jede Allmende von ihren Nutzern regiert werden kann, und die gescheiterten Fälle gehören ebenfalls zur Bilanz.", "cm-e-m4": "Das berühmte Argument von der Tragik der Allmende irrt nicht darüber, was bei offenem Zugang ohne Regeln geschieht. Es irrt, wenn man es so liest, als könne nur Privateigentum oder eine äußere Autorität das verhindern.", "cm-e-m5": "Vier Haushalte und eine Weide sind der leichte Fall. Weder die Fischerei eines ganzen Meeres noch die Atmosphäre hat die Grenzen, die kleinen Zahlen oder die gemeinsame Geschichte, die die erfolgreichen Fälle der Bilanz hatten.", "cm-e-src": "Quellen", "cm-src1": "Der Befund.", "cm-src2": "Die Gestaltungsprinzipien und die Hardin-Lesart.", "cm-src-tail": "Gelesen: 2026 08 21. Deutsche und türkische Übertragung von mir.", "cm-fam": "Der Rest der Familie, darunter eine Jagd, in der die Gefahr der Zweifel ist und nicht die Gier: ", "cm-fam-a": "alle Spiele sind hier", "cm-b-another": "Eine andere Regel versuchen", "cm-b-gateagain": "Das Gatter wieder öffnen", "cm-s-end": "Das Ende. Die Tragik hängt an den Regeln, die die Nutzer vereinbaren und durchsetzen können.", "cm-k-return": "Enter", "cm-k-start": "Start", "cm-k-begin": "Start", "cm-k-go": "weiter", "cm-k-again": "erneut", "cm-k-enter": "Enter", "pg-title": "Die Allmende"}};
function T(k, en, v) {
  var s = window.__t ? window.__t(k, en) : en;
  if (v) for (var n in v) s = s.split("{" + n + "}").join(String(v[n]));
  return s;
}
var RULE_KEY = { none: "cm-rn-none", quota: "cm-rn-quota", watched: "cm-rn-watched", fined: "cm-rn-fined" };
function ruleName(key) { return T(RULE_KEY[key], RULES[key].name); }
function hName(i) { return i === 0 ? T("cm-you", "You") : HOUSES[i].name; }
function animalsW(n) { return n === 1 ? T("cm-anim1", "{n} animal", {n: n}) : T("cm-animN", "{n} animals", {n: n}); }

var ui = KW.ui, ctx = null;
var store = KW.store("kw.commons.v1");

/* ============================================================
   1. the pasture
   One number is the whole model: how much grass there is. It
   grows fastest when it is half gone and not at all when it is
   full, and every animal turned out on it takes a bite.
   ============================================================ */

var FULL = 100;     /* the pasture in good heart */
var GROW = 0.5;     /* how fast it comes back */
var BITE = 1.0;     /* what one animal takes in a year */
var MAXH = 6;       /* the most animals one household can keep */
var BARE = 8;       /* below this there is nothing worth calling grass */

/* Grass grows from grass, fastest when the field is half eaten and not at
   all when it is full.  The second term is the seed that blows in from the
   verges and the lanes: it is small, it only matters when the pasture is
   nearly bare, and without it a field eaten to the ground would stay bare
   for ever, which is not what happens to a real one. */
var SEED = 0.6, SEED_UNDER = 30;

function regrowth(S) {
  return GROW * S * (1 - S / FULL) + (S < SEED_UNDER ? SEED : 0);
}

/* one year: the grass grows, then the animals eat.
   Returns the pasture next spring. */
function stepYear(S, totalAnimals) {
  var next = S + regrowth(S) - BITE * totalAnimals;
  return clamp(next, 0, FULL);
}

/* how long a pasture left completely alone takes to come back to half */
function yearsToHalf(S) {
  var y = 0;
  while (S < FULL / 2 && y < 200) { S = stepYear(S, 0); y++; }
  return y;
}

/* what one animal is worth in a year: thin grass, thin animals */
function quality(S) { return clamp(S / FULL, 0, 1); }
function cheeses(animals, S) { return animals * quality(S); }

/* the total the pasture can carry for ever is where growth meets
   the bite: GROW*K/4 divided by BITE, which is 12.5 animals here */
var SUSTAINABLE = GROW * FULL / 4 / BITE;

/* ============================================================
   2. the households
   ============================================================ */

var HOUSES = [
  { key: "you",   name: "You",   color: "#8a4a2c", fig: { coat: "#8a4a2c", hairStyle: "curly", hair: "#241a12", skin: "#c99a72" } },
  { key: "ana",   name: "Ana",   color: "#40566e", fig: { coat: "#40566e", hairStyle: "braid", hair: "#4a3218", skin: "#d0a37c" } },
  { key: "bruno", name: "Bruno", color: "#6b5334", fig: { coat: "#6b5334", hairStyle: "hat", capCol: "#4a3826", hair: "#3a2a18", stout: true } },
  { key: "deniz", name: "Deniz", color: "#5e7a6a", fig: { coat: "#5e7a6a", hairStyle: "bun", hair: "#2a1c10", skin: "#b98a62" } }
];

/* The three neighbours are rules. Without an agreement they read the
   grass and their own last year, and one of them always leans up. */
function neighbourWish(h, prev, S, lastQuality) {
  var want = prev;
  if (lastQuality >= 0.75) want = prev + 1;
  else if (lastQuality < 0.5) want = prev - 1;
  if (h.key === "bruno") want = Math.max(want, prev + 1);
  if (h.key === "deniz" && lastQuality < 0.35) want = prev - 1;
  return clamp(want, 1, MAXH);
}

/* ============================================================
   3. rules the four of you can agree
   ============================================================ */

var QUOTA = 3;

var RULES = {
  none: {
    name: "No rule at all",
    line: "Everyone turns out whatever they think best."
  },
  quota: {
    name: "A quota of three",
    line: "Each household agrees to keep three animals on the pasture. Nobody counts anybody.",
    quota: QUOTA, watched: false, penalty: false,
    slip: 0.34
  },
  watched: {
    name: "A quota, and everyone's count on the door",
    line: "The same three each, and at the end of every year each household's number is chalked on the door of the meeting house where all four can read it.",
    quota: QUOTA, watched: true, penalty: false,
    slip: 0.28
  },
  fined: {
    name: "A quota, the numbers on the door, and a graduated penalty",
    line: "The same three each and the same door, and a household over its number loses a day of grazing the first time and a whole animal's worth the second.",
    quota: QUOTA, watched: true, penalty: true,
    slip: 0.28
  }
};

/* ============================================================
   4. state
   ============================================================ */

var G = {
  view: "title", phase: 1, year: 0, S: FULL,
  rule: "none",
  mine: 3, cheeses: 0,
  herd: [3, 3, 3, 3],
  strikes: [0, 0, 0, 0],
  lastQ: 1, lastTakes: null, lastS: FULL, collapsed: false, collapseYear: 0,
  history: [], run1: null
};

var rnd = KW.mulberry(80231);

var scene = { sheep: [], t0: -99 };

function save() {
  store.save({ view: G.view, phase: G.phase, year: G.year, S: G.S, rule: G.rule,
               cheeses: G.cheeses, herd: G.herd, strikes: G.strikes, history: G.history,
               run1: G.run1, collapsed: G.collapsed });
}

/* ============================================================
   5. the pasture, painted
   ============================================================ */

function drawSheep(x, y, s, t, thin, i) {
  var sk = KW.sky();
  var body = KW.rgb(KW.mix(thin ? [188, 182, 166] : [226, 222, 208], [46, 48, 62], sk.night * 0.7));
  var face = KW.rgb(KW.mix([92, 80, 66], [30, 32, 44], sk.night * 0.7));
  var bob = KW.reduced ? 0 : Math.sin(t * 1.1 + i) * 0.6;
  ctx.save();
  ctx.translate(x, y + bob);
  ctx.scale(s, s);
  KW.shadow(0, 9, 0.16);
  ctx.fillStyle = body;
  ctx.beginPath();
  ctx.ellipse(0, -7, thin ? 6.4 : 7.6, thin ? 4 : 5, 0, 0, 6.283);
  ctx.fill();
  if (!thin) {
    ctx.beginPath(); ctx.arc(-4, -10, 2.6, 0, 6.283); ctx.fill();
    ctx.beginPath(); ctx.arc(1, -11, 2.4, 0, 6.283); ctx.fill();
    ctx.beginPath(); ctx.arc(5, -10, 2.2, 0, 6.283); ctx.fill();
  }
  ctx.strokeStyle = face; ctx.lineWidth = 1.4; ctx.lineCap = "round";
  ctx.beginPath(); ctx.moveTo(-3.4, -3.4); ctx.lineTo(-3.6, 0); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(3, -3.4); ctx.lineTo(3.2, 0); ctx.stroke();
  ctx.fillStyle = face;
  ctx.beginPath(); ctx.ellipse(7.4, -6.4, 2.8, 2.2, 0.3, 0, 6.283); ctx.fill();
  ctx.beginPath(); ctx.ellipse(6, -9, 1.6, 1, -0.4, 0, 6.283); ctx.fill();
  ctx.restore();
}

function layoutSheep() {
  var takes = G.lastTakes || G.herd;
  var total = 0, i, j;
  var list = [];
  for (i = 0; i < 4; i++) {
    for (j = 0; j < takes[i]; j++) list.push(i);
    total += takes[i];
  }
  scene.sheep = list;
}

function drawWorld(t) {
  var M = KW.M;
  var q = quality(G.S);
  KW.green(1 - q);
  KW.house(t, M.small ? M.W * 0.11 : M.W * 0.1);
  KW.tree(t, M.small ? M.W * 0.93 : M.W * 0.91, 0.8);

  /* the flock, in rows across the pasture, thin when the grass is thin */
  var list = scene.sheep, n = list.length;
  var cols = M.small ? 6 : 9;
  for (var i = 0; i < n; i++) {
    var row = (i / cols) | 0, col = i % cols;
    var rows = Math.ceil(n / cols) || 1;
    var pad = M.W * (M.small ? 0.1 : 0.14);
    var span = M.W - pad * 2;
    var x = pad + (col + (row % 2 ? 0.5 : 0)) * (span / cols) + ((i * 29) % 11) - 5;
    var y = M.GY - 6 - row * (M.small ? 15 : 20);
    var s = (M.small ? 0.62 : 0.82) * (1 - row * 0.07);
    drawSheep(x, y, s, t, q < 0.42, i);
  }

  /* the four households, standing at the edge of their own pasture */
  var base = M.small ? M.W * 0.3 : M.W * 0.36;
  var gap = M.small ? M.W * 0.13 : M.W * 0.1;
  for (var h = 0; h < 4; h++) {
    var hx = base + h * gap;
    KW.shadow(hx, 13, 0.2);
    KW.figure(hx, M.GY + (M.small ? 16 : 22), t + h * 0.7, Object.assign({}, HOUSES[h].fig, {
      face: h === 0 ? 1 : -1, scale: 0.8, pose: "stand"
    }));
  }
}

function setMine(n) {

function lastYearWords() {
  var h = G.history[G.history.length - 1];
  if (!h) return "";
  var words = T("cm-ly-a", "Last year the four of you had {t} animals out. ", {t: h.total});

  else if (h.q >= 0.25) words += T("cm-ly-thin", "The animals came back thin and the ground is showing through.");
  else words += T("cm-ly-bare", "The pasture is bare and what came back was hardly worth the keeping.");
  if (h.notes) words += " " + h.notes;
  return words;
}

/* ---- one year, for everybody ---- */

function neighbourTakes() {
  var takes = [];
  for (var i = 1; i < 4; i++) {
    var h = HOUSES[i], prev = G.herd[i], want;
    var rule = RULES[G.rule];
    if (G.phase === 1) {
      want = neighbourWish(h, prev, G.S, G.lastQ);
    } else if (!rule.watched) {
      /* nobody counts anybody. A household that went over last year and
         heard nothing about it has no reason to come back down, and next
         year it may as well be one more. */
      want = prev > rule.quota
        ? prev + (rnd() < 0.45 ? 1 : 0)
        : (rnd() < rule.slip ? rule.quota + 1 : rule.quota);
    } else {
      /* the numbers are on the door. Being over is a thing the other three
         know about, so it is a thing that ends. */
      if (prev > rule.quota) {
        want = rule.quota;
      } else {
        var slips = rnd() < rule.slip;
        if (rule.penalty && G.strikes[i] >= 1) slips = slips && rnd() < 0.25;
        want = slips ? rule.quota + 1 : rule.quota;
      }
      if (rule.penalty && G.strikes[i] >= 2) want = Math.max(1, rule.quota - 1);
    }
    takes.push(clamp(want, 1, MAXH));
  }
  return takes;
}

function runYear(mine) {
  var rule = RULES[G.rule];
  var others = neighbourTakes();
  var takes = [clamp(mine, 1, MAXH)].concat(others);
  var total = takes.reduce(function (a, b) { return a + b; }, 0);

  var qBefore = quality(G.S);
  var earned = cheeses(takes[0], G.S);

  /* the rule bites here, on everybody including you */
  var notes = "";
  if (G.phase === 2 && rule.quota) {
    for (var i = 0; i < 4; i++) {
      if (takes[i] > rule.quota) {
        G.strikes[i]++;
        if (rule.penalty) {
          var fine = G.strikes[i] === 1 ? 0.25 : 1.0;
          if (i === 0) earned = Math.max(0, earned - fine);
        }
      }
    }
    if (rule.watched) {
      var over = [];
      for (var j = 0; j < 4; j++) if (takes[j] > rule.quota) over.push(hName(j));
      if (over.length) {
        notes = (over.length === 1 ? T("cm-over-1", "{w} was over the agreed number and it was on the door in the morning.", {w: over[0]})
                                   : T("cm-over-n", "{w} were over the agreed number and it was on the door in the morning.", {w: over.join(T("cm-and", " and "))}));
      }
    }
  }

  G.cheeses += earned;
  var before = G.S;
  G.S = stepYear(G.S, total);
  G.lastQ = quality(G.S);
  G.lastTakes = takes; G.herd = takes; G.lastS = before;
  if (G.S <= BARE && !G.collapsed) { G.collapsed = true; G.collapseYear = G.year + 1; }

  G.history.push({ year: G.year + 1, takes: takes, total: total, before: before,
                   after: G.S, q: quality(G.S), earned: earned, notes: notes });
  G.year++;
  layoutSheep();
  scene.t0 = KW.world.t;
  save();
  view("harvest");
};

  }
  ui.para(T("cm-p1e-after", "Look at the year after this one instead. A pasture held at {e} keeps paying about {p} wheels a year to each household for as long as it is held there. Yours stands at {a}, and left completely alone, with nothing on it at all, it would need about {y} years to come back to half.",
          {e: q.end, p: q.perYear, a: Math.round(G.S), y: yearsToHalf(G.S)}));
  ui.para(T("cm-p1e-stop", "This is usually where the story stops, with a moral about human nature. It is the wrong place to stop, because the four of you were never allowed to speak."));
  var r = ui.actions();

  ui.say(T("cm-s-p1e", "End of part one. The pasture carries about {n} animals in total for ever.", {n: SUSTAINABLE}));

/* what a household would end up with under the quota, for comparison, and
   where that pasture settles if the quota is kept for a long time */
function expectedQuota() {
  var S = FULL, tot = 0, y;
  for (y = 0; y < YEARS_1; y++) {
    tot += cheeses(QUOTA, S);
    S = stepYear(S, QUOTA * 4);
  }
  var L = FULL;
  for (y = 0; y < 60; y++) L = stepYear(L, QUOTA * 4);
  return { total: Math.round(tot * 10) / 10,
           end: Math.round(L),
           perYear: Math.round(cheeses(QUOTA, L) * 10) / 10 };
}

  ui.para(T("cm-e-p3", "A quota nobody checks is a wish. It works while everybody is keeping it and it drifts the moment one household is over and nothing follows, because the others are not fools and they can see the grass going. Writing the numbers on the door does not punish anybody. It only means that going over is a thing that other people know about, and that turns out to be most of the work."));

  ui.sub(T("cm-e-sub2", "What the record says"));
  ui.para(T("cm-e-p5", "Elinor Ostrom spent a career reading field studies of pastures, forests, fisheries and groundwater basins where the users governed themselves. The Nobel committee summarised the finding when it announced the 2009 prize. In its words, common property \u201ccan be successfully managed by user associations\u201d, and the outcomes \u201care, more often than not, better than predicted by standard theories\u201d, because resource users \u201cfrequently develop sophisticated mechanisms for decision-making and rule enforcement to handle conflicts of interest\u201d."));

  ui.sub(T("cm-e-sub3", "What this does not show"));
  ui.list([

    T("cm-e-m4", "The famous tragedy of the commons argument is not wrong about what happens under open access with no rules. It is wrong when it is read as saying that only private property or an outside authority can prevent it."),

      tail: T("cm-src-tail", "Read 2026 08 21. The German and Turkish renderings are my own.") }
  ]);

  var p = el("p");
  p.appendChild(document.createTextNode(T("cm-fam", "The rest of the family, including a hunt where the danger is doubt rather than greed: ")));
