<style>
/* Passcard — a list of people onto badge stock.
 *
 * The badge on screen is set in Helvetica/Arial, not in the interface face,
 * because Helvetica is what the PDF actually writes and Arial is metrically
 * identical to it. What you see wrapping is what wraps on the card. Everything
 * around the badge is Red Hat — a family drawn for infrastructure interfaces,
 * which is what an access-control tool is.
 *
 * Accent is Radix Violet 9, used only for selection and the primary action. */

:root {
  --paper:      #ffffff;
  --paper-edge: #dcdce2;
  --rail:       #f4f4f7;
  --rail-2:     #ebebf0;
  --bench:      #d7d7de;
  --field:      #ffffff;
  --edge:       #e4e4ea;
  --edge-firm:  #bebec8;
  --ink:        #16161c;
  --ink-2:      #5b5b68;
  --ink-3:      #8a8a97;

  --accent:      #6e56cf;
  --accent-hi:   #5b45b0;
  --accent-soft: #f1eefe;

  function unwritable(str) {
    var out = [];
    for (var i = 0; i < String(str).length; i++) {
      var c = String(str).charAt(i);
      if (winAnsi(c.charCodeAt(0)) === null && out.indexOf(c) === -1) out.push(c);
    }
    return out;
  }

  function textWidth(str, size, bold) {
    var t = 0;
    for (var i = 0; i < String(str).length; i++) {
      t += charWidth(String(str).charCodeAt(i), bold);
    }
    return t * size / 1000;
  }

  /* ── fitting a name ────────────────────────────────────────────────────
     Try the largest size first, then smaller, then two lines split at a space.
     What it will not do is shrink past the floor: a badge nobody can read
     across a room is not a badge, and saying so beats printing it. */
  function fitText(text, maxWidth, opts) {
    var o = opts || {};
    var sizes = o.sizes || [18, 16, 14, 12, 11, 10];
    var bold = o.bold !== false;
    var allowTwo = o.lines !== 1;
    var s = String(text).trim();
    if (!s) return { lines: [], size: sizes[0], fits: true, empty: true };

    for (var i = 0; i < sizes.length; i++) {
      if (textWidth(s, sizes[i], bold) <= maxWidth) {
        return { lines: [s], size: sizes[i], fits: true, shrunk: i > 0 };
      }
    }
    if (allowTwo) {
      var split = bestSplit(s);
      if (split) {
        for (i = 0; i < sizes.length; i++) {
          if (textWidth(split[0], sizes[i], bold) <= maxWidth &&
              textWidth(split[1], sizes[i], bold) <= maxWidth) {
            return { lines: split, size: sizes[i], fits: true, wrapped: true, shrunk: i > 0 };
          }
        }
      }
    }
    /* Nothing fits. Report the overflow at the smallest size so the message can
       say how far past the edge it goes. */
    var last = sizes[sizes.length - 1];
    return { lines: [s], size: last, fits: false,
             over: textWidth(s, last, bold) - maxWidth };
  }

  /* Split at the space that leaves the two halves closest in length — a name
     broken after the first of three words looks like a mistake. */
  function bestSplit(s) {
    var parts = s.split(/\s+/);
    if (parts.length < 2) return null;
    var best = null, bestDiff = Infinity;
    for (var i = 1; i < parts.length; i++) {
      var a = parts.slice(0, i).join(" "), b = parts.slice(i).join(" ");
      var diff = Math.abs(a.length - b.length);
      if (diff < bestDiff) { bestDiff = diff; best = [a, b]; }
    }
    return best;
  }

  /* ── the list ──────────────────────────────────────────────────────────── */

  function readPeople(text) {
    var rows = grid(text);
    if (!rows.length) return { people: [], headers: [] };
    var headers = rows[0].map(function (h) { return h.trim(); });
    var people = rows.slice(1).map(function (r, i) {
      return {
        index: i,
        name: (r[0] || "").trim(),
        role: (r[1] || "").trim(),
        org:  (r[2] || "").trim(),
        id:   (r[3] || "").trim()
      };
    }).filter(function (p) { return p.name || p.role || p.id; });
    return { people: people, headers: headers };
  }

  function grid(text) {
    var d = detectDelimiter(text);
    var rows = [], row = [], field = "", inQ = false;
    var s = String(text).replace(/\r\n?/g, "\n");
    for (var i = 0; i < s.length; i++) {
      var c = s[i];
      if (inQ) {
        if (c === '"') { if (s[i + 1] === '"') { field += '"'; i++; } else inQ = false; }
        else field += c;
      } else if (c === '"') inQ = true;
      else if (c === d) { row.push(field); field = ""; }
      else if (c === "\n") { row.push(field); rows.push(row); row = []; field = ""; }
      else field += c;
    }
    if (field !== "" || row.length) { row.push(field); rows.push(row); }
    return rows
      .filter(function (r) { return r.some(function (v) { return v.trim() !== ""; }); })
      .filter(function (r) { return r[0].charAt(0) !== "#"; });
  }

  function detectDelimiter(text) {
    var head = String(text).split(/\r?\n/).slice(0, 5).join("\n");
    var counts = { ",": 0, "\t": 0, ";": 0 }, inQ = false;
    for (var i = 0; i < head.length; i++) {
      var c = head[i];
      if (c === '"') inQ = !inQ;
      else if (!inQ && counts[c] !== undefined) counts[c]++;
    }
    var best = ",", n = -1;
    Object.keys(counts).forEach(function (k) { if (counts[k] > n) { n = counts[k]; best = k; } });
    return n > 0 ? best : ",";
  }

  /* ── Code 128 ──────────────────────────────────────────────────────────
     Subset B throughout, with the modulo-103 check. A badge scanned at a gate
     is read once and has to be right the first time. */
  var PATTERNS = (
    "212222 222122 222221 121223 121322 131222 122213 122312 132212 221213 " +
    "221312 231212 112232 122132 122231 113222 123122 123221 223211 221132 " +
    "221231 213212 223112 312131 311222 321122 321221 312212 322112 322211 " +
    "212123 212321 232121 111323 131123 131321 112313 132113 132311 211313 " +
    "231113 231311 112133 112331 132131 113123 113321 133121 313121 211331 " +
    "231131 213113 213311 213131 311123 311321 331121 312113 312311 332111 " +
    "314111 221411 431111 111224 111422 121124 121421 141122 141221 112214 " +
    "112412 122114 122411 142112 142211 241211 221114 413111 241112 134111 " +
    "111242 121142 121241 114212 124112 124211 411212 421112 421211 212141 " +
    "214121 412121 111143 111341 131141 114113 114311 411113 411311 113141 " +
    "114131 311141 411131 211412 211214 211232 2331112"
  ).split(" ");

  function encode128(text) {
    var s = String(text), values = [104], i;      /* Start B */
    for (i = 0; i < s.length; i++) {
      var c = s.charCodeAt(i);
      if (c < 32 || c > 126) return null;         /* outside subset B */
      values.push(c - 32);
    }
    var sum = values[0];
    for (i = 1; i < values.length; i++) sum += values[i] * i;
    values.push(sum % 103);
    values.push(106);                             /* Stop */
    return values;
  }

  /* Bar widths in modules, ready to draw. */
  function bars128(text) {
    var values = encode128(text);
    if (!values) return null;
    var out = [];
    values.forEach(function (v) {
      PATTERNS[v].split("").forEach(function (w) { out.push(+w); });
    });
    return out;
  }

  function modules128(text) {
    var b = bars128(text);
    if (!b) return 0;
    return b.reduce(function (n, w) { return n + w; }, 0) + 20;   /* both quiet zones */
  }

  /* ── JPEG ──────────────────────────────────────────────────────────────
     Only the frame header is read. The bytes go into the PDF untouched. */
  function jpegSize(bytes) {
    if (bytes[0] !== 0xFF || bytes[1] !== 0xD8) return null;
    var i = 2;
    while (i < bytes.length - 9) {
      if (bytes[i] !== 0xFF) { i++; continue; }
      var marker = bytes[i + 1];
      /* SOF0..SOF15, excluding DHT (C4), JPG (C8) and DAC (CC) */
      if (marker >= 0xC0 && marker <= 0xCF &&
          marker !== 0xC4 && marker !== 0xC8 && marker !== 0xCC) {
        return {
          height: (bytes[i + 5] << 8) | bytes[i + 6],
          width: (bytes[i + 7] << 8) | bytes[i + 8],
          components: bytes[i + 9]
        };
      }
      i += 2 + ((bytes[i + 2] << 8) | bytes[i + 3]);
    }
    return null;
  }

  /* ── the card ──────────────────────────────────────────────────────────
     Sizes are the real ones. A 4 x 3 inch insert is what goes in a lanyard
     pouch; CR80 is a plastic card. */
  var STOCK = {
    "insert-4x3":  { w: 101.6, h: 76.2,  cols: 2, rows: 3, name: "4 x 3 in insert, 6 to a sheet" },
    "insert-3x4":  { w: 76.2,  h: 101.6, cols: 2, rows: 2, name: "3 x 4 in portrait, 4 to a sheet" },
    "cr80":        { w: 85.6,  h: 54,    cols: 2, rows: 5, name: "CR80 card, 10 to a sheet" }
  };

  function layout(person, stock, opts) {
    var o = opts || {};
    var pad = o.pad === undefined ? 6 : o.pad;
    var photo = o.photo !== false && stock.h >= 70;
    var photoW = photo ? Math.min(28, stock.w * 0.3) : 0;
    var textX = pad + (photo ? photoW + 5 : 0);
    var textW = stock.w - textX - pad;

    var barH = o.barHeight === undefined ? 9 : o.barHeight;
    var barTop = stock.h - pad - barH - (person.id ? 4 : 0);

    /* The column is in millimetres and the metrics are in points. Passing one
       for the other understates the card by a factor of 2.835 and shrinks every
       name to fit a column a third of its real width — which is exactly what
       this did until the browser showed a nine-character name set at 12 pt. */
    var textPt = textW * MM;
    var name = fitText(person.name, textPt, { sizes: [17, 15, 13, 12, 11, 10], bold: true });
    var role = fitText(person.role, textPt, { sizes: [10, 9, 8.5, 8], bold: false, lines: 1 });
    var org  = fitText(person.org,  textPt, { sizes: [8.5, 8, 7.5, 7], bold: false, lines: 1 });

    return {
      stock: stock, pad: pad,
      photo: photo ? { x: pad, y: pad, w: photoW, h: photoW * 1.25 } : null,
      textX: textX, textW: textW, textPt: textPt,
      name: name, role: role, org: org,
      barcode: person.id ? { x: pad, y: barTop, w: stock.w - pad * 2, h: barH } : null
    };
  }

  /* ── what cannot be printed ────────────────────────────────────────────── */
  function check(people, stock, opts) {
    var o = opts || {};
    var dpi = o.dpi || 300;
    var problems = [];
    var seen = {};

    people.forEach(function (p) {
      var l = layout(p, stock, o);

      var bad = unwritable(p.name + " " + p.role + " " + p.org);
      if (bad.length) {
        problems.push({ kind: "cannot be printed", who: p.name, chars: bad,
          text: "The badge for " + p.name + " contains " + bad.join(" ") +
            ", which the built-in PDF fonts cannot write — Helvetica is limited to " +
            "Windows-1252, and Turkish s-cedilla, g-breve and dotted capital I are " +
            "outside it. The name is not transliterated: a badge somebody wears all " +
            "week should not spell their name wrong." });
      }

      if (!l.name.fits) {
        problems.push({ kind: "name too long", who: p.name,
          text: "“" + p.name + "” is " + (l.name.over / MM).toFixed(1) +
            " mm too wide for this card even at the smallest size it can carry. " +
            "Shorten it, or use a larger stock — it will not be squeezed." });
      }
      if (p.role && !l.role.fits) {
        problems.push({ kind: "role too long", who: p.name,
          text: "The role for " + p.name + " does not fit on one line and roles are " +
            "not wrapped. Shorten it." });
      }
      if (p.id) {
        var mods = modules128(p.id);
        if (!mods) {
          problems.push({ kind: "unencodable", who: p.name,
            text: "The ID for " + p.name + " has a character Code 128 subset B " +
              "cannot carry. Printable ASCII only." });
        } else {
          var narrow = l.barcode ? l.barcode.w / mods : 0;
          var floor = 25.4 / dpi * 2;      /* two printer dots is the practical floor */
          if (narrow < floor) {
            problems.push({ kind: "barcode too dense", who: p.name,
              text: "The barcode for " + p.name + " puts its narrowest bar at " +
                narrow.toFixed(3) + " mm. At " + dpi + " dpi that is under " +
                floor.toFixed(3) + " mm and scanners will miss it. Use a shorter ID " +
                "or a wider card." });
          }
        }
      }
      /* Two identical badges is a security problem on a site, not a cosmetic one. */
      var key = (p.name + "|" + p.role + "|" + p.org).toLowerCase();
      if (p.name) {
        if (seen[key]) {
          problems.push({ kind: "indistinguishable", who: p.name,
            text: "Two badges for “" + p.name + "” would be identical. " +
              "Whoever checks them at the gate cannot tell which is which — " +
              "give them different IDs." });
        }
        seen[key] = true;
      }
    });
    return problems;
  }

  /* ── PDF ───────────────────────────────────────────────────────────────── */
  function PDF(page) {
    this.objects = [null];
    this.pages = [];
    this.images = [];
    this.page = page;
  }
  PDF.prototype.add = function (body) { this.objects.push(body); return this.objects.length - 1; };
  PDF.prototype.addImage = function (bytes, size) {
    var head = "<< /Type /XObject /Subtype /Image /Width " + size.width +
      " /Height " + size.height + " /ColorSpace " +
      (size.components === 1 ? "/DeviceGray" : "/DeviceRGB") +
      " /BitsPerComponent 8 /Filter /DCTDecode /Length " + bytes.length + " >>";
    var id = this.add({ head: head, raw: bytes });
    this.images.push(id);
    return id;
  };
  PDF.prototype.addPage = function (content, imageIds) {
    this.pages.push({ content: this.add(
      "<< /Length " + content.length + " >>\nstream\n" + content + "\nendstream"),
      images: imageIds || [] });
  };

  PDF.prototype.build = function () {
    var self = this;
    var fontR = this.add("<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>");
    var fontB = this.add("<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold /Encoding /WinAnsiEncoding >>");
    var pagesId = this.objects.length + this.pages.length;
    var ids = this.pages.map(function (p) {
      var xo = p.images.length
        ? " /XObject << " + p.images.map(function (i, n) { return "/Im" + n + " " + i + " 0 R"; }).join(" ") + " >>"
        : "";
      return self.add("<< /Type /Page /Parent " + pagesId + " 0 R /MediaBox [0 0 " +
        round(self.page.w * MM) + " " + round(self.page.h * MM) + "] /Resources << /Font << /F1 " +
        fontR + " 0 R /F2 " + fontB + " 0 R >>" + xo + " >> /Contents " + p.content + " 0 R >>");
    });
    var tree = this.add("<< /Type /Pages /Kids [" +
      ids.map(function (i) { return i + " 0 R"; }).join(" ") + "] /Count " + ids.length + " >>");
    var catalog = this.add("<< /Type /Catalog /Pages " + tree + " 0 R >>");

    /* Built as bytes rather than a string, because a JPEG is not text and
       putting it through a string is how it arrives corrupted. */
    var chunks = [], length = 0;
    function push(s) {
      if (typeof s === "string") {
        var b = new Uint8Array(s.length);
        for (var i = 0; i < s.length; i++) b[i] = s.charCodeAt(i) & 0xFF;
        chunks.push(b); length += b.length;
      } else { chunks.push(s); length += s.length; }
    }

    push("%PDF-1.4\n");
    var offsets = [0];
    for (var i = 1; i < this.objects.length; i++) {
      offsets[i] = length;
      var o = this.objects[i];
      if (o && o.raw) {
        push(i + " 0 obj\n" + o.head + "\nstream\n");
        push(o.raw);
        push("\nendstream\nendobj\n");
      } else {
        push(i + " 0 obj\n" + o + "\nendobj\n");
      }
    }
    var xref = length;
    var tail = "xref\n0 " + this.objects.length + "\n0000000000 65535 f \n";
    for (i = 1; i < this.objects.length; i++) tail += pad10(offsets[i]) + " 00000 n \n";
    tail += "trailer\n<< /Size " + this.objects.length + " /Root " + catalog +
      " 0 R >>\nstartxref\n" + xref + "\n%%EOF\n";
    push(tail);

    var out = new Uint8Array(length), at = 0;
    chunks.forEach(function (c) { out.set(c, at); at += c.length; });
    return out;
  };

  function pad10(n) { var s = String(n); while (s.length < 10) s = "0" + s; return s; }
  function round(n) { return Math.round(n * 1000) / 1000; }

  function sheet(stock, page, opts) {
    var o = opts || {};
    var gapX = o.gapX === undefined ? 0 : o.gapX;
    var gapY = o.gapY === undefined ? 0 : o.gapY;
    var w = stock.cols * stock.w + (stock.cols - 1) * gapX;
    var h = stock.rows * stock.h + (stock.rows - 1) * gapY;
    if (w > page.w || h > page.h) return null;
    var left = (page.w - w) / 2, top = (page.h - h) / 2;
    var cells = [];
    for (var r = 0; r < stock.rows; r++) {
      for (var c = 0; c < stock.cols; c++) {
        cells.push({ row: r, col: c,
          x: left + c * (stock.w + gapX),
          y: top + r * (stock.h + gapY) });
      }
    }
    return { cells: cells, perSheet: cells.length, left: left, top: top, w: w, h: h };
  }

  /* A PDF literal string is bytes, not characters, and the byte a built-in font
     wants is the Windows-1252 one. An em-dash is U+2014 and WinAnsi 0x97; taking
     the low byte of the code point would write 0x14, a control character. Above
     ASCII everything goes out as an octal escape, which no reader can
     misinterpret. Anything with no WinAnsi byte at all is dropped — `check` has
     already reported it by name rather than letting it through silently. */
  function escapePdf(str) {
    var out = "";
    for (var i = 0; i < String(str).length; i++) {
      var b = winAnsi(String(str).charCodeAt(i));
      if (b === null) continue;
      if (b === 0x5C || b === 0x28 || b === 0x29) out += "\\" + String.fromCharCode(b);
      else if (b < 0x20 || b > 0x7E) out += "\\" + ("00" + b.toString(8)).slice(-3);
      else out += String.fromCharCode(b);
    }
    return out;
  }

  return {
    MM: MM, STOCK: STOCK, W: W, WB: WB,
    textWidth: textWidth, charWidth: charWidth, fitText: fitText, bestSplit: bestSplit,
    winAnsi: winAnsi, unwritable: unwritable,
    readPeople: readPeople, detectDelimiter: detectDelimiter,
    encode128: encode128, bars128: bars128, modules128: modules128, PATTERNS: PATTERNS,
    jpegSize: jpegSize, layout: layout, check: check, sheet: sheet,
    PDF: PDF, escapePdf: escapePdf, round: round
  };
})();
/* ENGINE:END */
</script>

<script>
"use strict";
var $ = function (id) { return document.getElementById(id); };

var SAMPLE = [
"Name,Role,Organisation,ID",
"Ana Silva,Site fitter,Meridian Contracts,MC-0142",
"Kerem Özdemir,Site engineer,Meridian Contracts,MC-0143",
"Ben Yates,Foreman,Meridian Contracts,MC-0144",
"Marta Kowalska,Electrician,Voltek,VK-0071",
"Jonas Weber,Scaffolder,Höhenbau GmbH,HB-2210",
"Aoife Ní Bhraonáin,Safety officer,Meridian Contracts,MC-0145",
"Kwame Mensah,Plant operator,Meridian Contracts,MC-0146",
"Rui Alves,Visitor,—,VIS-0009"
].join("\n");

var state = { view: "card", at: 0, photos: {}, people: [], problems: [] };

function esc(s) {
  return String(s).replace(/[&<>"']/g, function (c) {
    return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
  });
}
function stock() { return Badges.STOCK[$("stock").value]; }
function dpi() { return +$("dpi").value || 300; }

/* ── one badge, drawn at the card's real proportions ──────────────────
   Everything inside is positioned in millimetres and expressed in cqw, so the
   card scales as one piece and the type keeps its real relationship to the
   card edge. 1 mm = 100/width cqw. */
function cardHtml(person, sizePx) {
  var st = stock();
  var l = Badges.layout(person, st);
  var mm = function (v) { return (v * 100 / st.w).toFixed(3) + "cqw"; };
  var pt = function (v) { return (v * 0.352778 * 100 / st.w).toFixed(3) + "cqw"; };
  var bad = state.problems.some(function (p) { return p.who === person.name; });

  var out = ['<div class="card' + (bad ? " bad" : "") + '" style="width:' + sizePx +
    "px;aspect-ratio:" + st.w + "/" + st.h + '"><div class="in">'];

  if (l.photo) {
    var img = state.photos[(person.id || "").toLowerCase()];
    out.push('<div class="photo" style="left:' + mm(l.photo.x) + ";top:" + mm(l.photo.y) +
      ";width:" + mm(l.photo.w) + ";height:" + mm(l.photo.h) + '">' +
      (img ? '<img src="' + img.url + '" alt="">'
           : "<span>no photo<br>" + esc(person.id || "—") + "</span>") + "</div>");
  }

  var y = l.pad + 1;
  l.name.lines.forEach(function (line, i) {
    out.push('<div class="nm" style="left:' + mm(l.textX) + ";top:" +
      mm(y + i * (l.name.size * 0.352778 * 1.12)) + ";width:" + mm(l.textW) +
      ";font-size:" + pt(l.name.size) + '">' + esc(line) + "</div>");
  });
  y += l.name.lines.length * (l.name.size * 0.352778 * 1.12) + 1.5;

  if (person.role) {
    out.push('<div class="rl" style="left:' + mm(l.textX) + ";top:" + mm(y) +
      ";width:" + mm(l.textW) + ";font-size:" + pt(l.role.size) + '">' +
      esc(person.role) + "</div>");
    y += l.role.size * 0.352778 * 1.3;
  }
  if (person.org) {
    out.push('<div class="og" style="left:' + mm(l.textX) + ";top:" + mm(y) +
      ";width:" + mm(l.textW) + ";font-size:" + pt(l.org.size) + '">' +
      esc(person.org) + "</div>");
  }

  if (l.barcode && person.id) {
    var bars = Badges.bars128(person.id);
    if (bars) {
      var total = bars.reduce(function (n, w) { return n + w; }, 0) + 20;
      var strip = ['<div class="bc" style="left:' + mm(l.barcode.x) + ";top:" +
        mm(l.barcode.y) + ";width:" + mm(l.barcode.w) + ";height:" + mm(l.barcode.h) + '">'];
      strip.push('<i class="w" style="width:' + (10 / total * 100) + '%"></i>');
      var dark = true;
      bars.forEach(function (w) {
        strip.push('<i class="' + (dark ? "" : "w") + '" style="width:' +
          (w / total * 100) + '%"></i>');
        dark = !dark;
      });
      strip.push('<i class="w" style="width:' + (10 / total * 100) + '%"></i>');
      strip.push("</div>");
      out.push(strip.join(""));
      out.push('<div class="idt" style="left:' + mm(l.barcode.x) + ";top:" +
        mm(l.barcode.y + l.barcode.h + 0.6) + ";font-size:" + pt(6) + '">' +
        esc(person.id) + "</div>");
    }
  }
  out.push("</div></div>");
  return out.join("");
}

function sheetHtml() {
  var st = stock();
  var s = Badges.sheet(st, { w: 210, h: 297 });
  if (!s) return '<div class="note stop">That stock does not fit on A4.</div>';
  var pct = function (v, of) { return (v / of * 100).toFixed(3) + "%"; };
  var perSheet = s.perSheet;
  var page = Math.floor(state.at / perSheet);
  var slice = state.people.slice(page * perSheet, page * perSheet + perSheet);
  var cells = s.cells.map(function (c, i) {
    var p = slice[i];
    return '<div class="cell' + (p ? "" : " empty") + '" style="left:' + pct(c.x, 210) +
      ";top:" + pct(c.y, 297) + ";width:" + pct(st.w, 210) + ";height:" + pct(st.h, 297) +
      '">' + (p ? "<b>" + esc(p.name) + "</b>" : "") + "</div>";
  }).join("");
  return '<div class="sheetpaper">' + cells + "</div>" +
    '<div class="realsize" style="text-align:center;margin-top:12px">Sheet ' +
    (page + 1) + " of " + Math.ceil(state.people.length / perSheet) + " &middot; A4 &middot; " +
    st.name + "</div>";
}

/* ── refresh ───────────────────────────────────────────────────────────── */
function refresh() {
  var r = Badges.readPeople($("people").value);
  state.people = r.people;
  var st = stock();
  state.problems = Badges.check(r.people, st, { dpi: dpi() });

  if (state.at >= r.people.length) state.at = Math.max(0, r.people.length - 1);

  var s = Badges.sheet(st, { w: 210, h: 297 });
  var sheets = s ? Math.ceil(r.people.length / s.perSheet) : 0;

  $("s-people").textContent = r.people.length;
  $("s-photos").textContent = Object.keys(state.photos).length;
  $("s-sheets").textContent = sheets;
  $("s-card").textContent = st.w + " x " + st.h + " mm";
  $("s-prob").textContent = state.problems.length;
  $("s-prob").className = "v" + (state.problems.length ? " stop" : " ok");
  $("pstat").textContent = r.people.length + " people";
  $("lstat").textContent = state.problems.length
    ? state.problems.length + " to fix" : "all printable";
  $("fstat").textContent = Object.keys(state.photos).length
    ? Object.keys(state.photos).length + " matched" : "none";
  $("go").disabled = !r.people.length;

  /* people list */
  $("plist").innerHTML = r.people.map(function (p, i) {
    var mine = state.problems.filter(function (x) { return x.who === p.name; });
    return '<button data-i="' + i + '" data-cur="' + (i === state.at ? 1 : 0) + '">' +
      '<span class="n">' + (i + 1) + "</span><span>" + esc(p.name || "—") + "</span>" +
      '<span class="tag ' + (mine.length ? "stop" : "ok") + '">' +
      (mine.length ? esc(mine[0].kind) : (state.photos[(p.id || "").toLowerCase()] ? "photo" : "")) +
      "</span></button>";
  }).join("");

  /* verdict */
  var v = [];
  var byKind = {};
  state.problems.forEach(function (p) { (byKind[p.kind] || (byKind[p.kind] = [])).push(p); });
  Object.keys(byKind).forEach(function (k) {
    v.push('<div class="note stop"><b>' + esc(k) + ".</b> " +
      esc(byKind[k][0].text) +
      (byKind[k].length > 1 ? " <b>And " + (byKind[k].length - 1) + " more like it.</b>" : "") +
      "</div>");
  });
  if (!state.problems.length && r.people.length) {
    v.push('<div class="note ok">All ' + r.people.length +
      " badges fit the card, and every barcode will scan at " + dpi() +
      " dpi. " + sheets + " sheet" + (sheets === 1 ? "" : "s") + " to print.</div>");
  }
  var missing = r.people.filter(function (p) {
    return p.id && !state.photos[(p.id || "").toLowerCase()];
  }).length;
  if (Object.keys(state.photos).length && missing) {
    v.push('<div class="note warn">' + missing + " badge" + (missing === 1 ? "" : "s") +
      " still have no photograph. The frame is left empty rather than filled with " +
      "somebody else's face.</div>");
  }
  if (!r.people.length) {
    v.push('<div class="note">No people yet. Paste a list into the panel on the left.</div>');
  }
  $("verdict").innerHTML = v.join("");

  /* stage */
  if (!r.people.length) { $("stage").innerHTML = ""; return; }
  if (state.view === "sheet") {
    $("stage").innerHTML = sheetHtml();
  } else {
    var p = r.people[state.at];
    /* 3.78 px per mm is a 96 dpi screen; the caption says so, because "real
       size" on screen depends on a monitor nobody measured. */
    var px = Math.min(520, Math.max(300, ($("stage").clientWidth || 520) * 0.72));
    $("stage").innerHTML =
      '<div class="nav">' +
      '<button id="prev" aria-label="Previous"' + (state.at ? "" : " disabled") + '>' +
      '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg></button>' +
      '<div class="who"><b>' + esc(p.name) + "</b> <em>" + (state.at + 1) + "/" +
      r.people.length + "</em></div>" +
      '<button id="next" aria-label="Next"' + (state.at < r.people.length - 1 ? "" : " disabled") + '>' +
      '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg></button>' +
      "</div>" +
      '<div class="cardwrap">' + cardHtml(p, px) +
      '<div class="realsize">' + stock().w + " &times; " + stock().h +
      " mm, drawn to proportion. Set in Helvetica, which is what the PDF writes.</div></div>";
    if ($("prev")) $("prev").onclick = function () { state.at--; refresh(); };
    if ($("next")) $("next").onclick = function () { state.at++; refresh(); };
  }
}

/* ── building the PDF ──────────────────────────────────────────────────── */
function buildPdf() {
  var MM = Badges.MM;
  var st = stock();
  var page = { w: 210, h: 297 };
  var s = Badges.sheet(st, page);
  var pdf = new Badges.PDF(page);
  var perSheet = s.perSheet;

  for (var start = 0; start < state.people.length; start += perSheet) {
    var slice = state.people.slice(start, start + perSheet);
    var c = [], images = [], map = {};

    slice.forEach(function (p, i) {
      var cell = s.cells[i];
      var l = Badges.layout(p, st);
      var X = function (x) { return Badges.round((cell.x + x) * MM); };
      var Y = function (y) { return Badges.round((page.h - cell.y - y) * MM); };

      /* the card outline, as a cut guide */
      c.push("0.25 w 0.78 0.78 0.82 RG");
      c.push(X(0) + " " + Y(st.h) + " " + Badges.round(st.w * MM) + " " +
             Badges.round(st.h * MM) + " re S");

      var photo = state.photos[(p.id || "").toLowerCase()];
      if (l.photo && photo) {
        var id = map[photo.key];
        if (id === undefined) {
          id = pdf.addImage(photo.bytes, photo.size);
          map[photo.key] = id;
          images.push(id);
        }
        var n = images.indexOf(id);
        c.push("q " + Badges.round(l.photo.w * MM) + " 0 0 " +
               Badges.round(l.photo.h * MM) + " " + X(l.photo.x) + " " +
               Y(l.photo.y + l.photo.h) + " cm /Im" + n + " Do Q");
        c.push("0.25 w 0.78 0.78 0.82 RG");
        c.push(X(l.photo.x) + " " + Y(l.photo.y + l.photo.h) + " " +
               Badges.round(l.photo.w * MM) + " " + Badges.round(l.photo.h * MM) + " re S");
      }

      var y = l.pad + 1;
      c.push("0.08 0.08 0.10 rg");
      l.name.lines.forEach(function (line, k) {
        c.push("BT /F2 " + l.name.size + " Tf " + X(l.textX) + " " +
               Y(y + k * (l.name.size * 0.352778 * 1.12) + l.name.size * 0.28) +
               " Td (" + Badges.escapePdf(line) + ") Tj ET");
      });
      y += l.name.lines.length * (l.name.size * 0.352778 * 1.12) + 1.5;

      if (p.role) {
        c.push("0.29 0.29 0.34 rg");
        c.push("BT /F1 " + l.role.size + " Tf " + X(l.textX) + " " +
               Y(y + l.role.size * 0.28) + " Td (" + Badges.escapePdf(p.role) + ") Tj ET");
        y += l.role.size * 0.352778 * 1.3;
      }
      if (p.org) {
        c.push("0.45 0.45 0.54 rg");
        c.push("BT /F1 " + l.org.size + " Tf " + X(l.textX) + " " +
               Y(y + l.org.size * 0.28) + " Td (" + Badges.escapePdf(p.org) + ") Tj ET");
      }

      if (l.barcode && p.id) {
        var bars = Badges.bars128(p.id);
        if (bars) {
          var total = bars.reduce(function (n2, w) { return n2 + w; }, 0) + 20;
          var unit = l.barcode.w / total;
          var x = l.barcode.x + unit * 10;
          c.push("0.08 0.08 0.10 rg");
          var dark = true;
          bars.forEach(function (w) {
            if (dark) {
              c.push(X(x) + " " + Y(l.barcode.y + l.barcode.h) + " " +
                     Badges.round(unit * w * MM) + " " +
                     Badges.round(l.barcode.h * MM) + " re f");
            }
            x += unit * w;
            dark = !dark;
          });
          c.push("0.29 0.29 0.34 rg");
          c.push("BT /F1 6 Tf " + X(l.barcode.x) + " " +
                 Y(l.barcode.y + l.barcode.h + 2.4) + " Td (" +
                 Badges.escapePdf(p.id) + ") Tj ET");
        }
      }
    });

    pdf.addPage(c.join("\n"), images);
  }
  return pdf.build();
}

/* ── wiring ────────────────────────────────────────────────────────────── */
["people", "stock", "dpi"].forEach(function (id) {
  $(id).addEventListener("input", refresh);
  $(id).addEventListener("change", refresh);
});
[["v-card", "card"], ["v-sheet", "sheet"]].forEach(function (p) {
  $(p[0]).addEventListener("click", function () {
    state.view = p[1];
    ["v-card", "v-sheet"].forEach(function (id) {
      $(id).setAttribute("aria-pressed", String(id === p[0]));
    });
    refresh();
  });
});
$("plist").addEventListener("click", function (e) {
  var b = e.target.closest("button[data-i]");
  if (!b) return;
  state.at = +b.getAttribute("data-i");
  if (state.view === "sheet") state.view = "card";
  ["v-card", "v-sheet"].forEach(function (id) {
    $(id).setAttribute("aria-pressed", String(id === "v-card"));
  });
  refresh();
});

/* Photographs are matched to the ID by file name, the way a badge bureau
   already names them. Nothing is uploaded; the bytes stay in this tab. */
function takeFiles(list) {
  var files = [].slice.call(list).filter(function (f) { return /\.jpe?g$/i.test(f.name); });
  var left = files.length;
  if (!left) return;
  files.forEach(function (f) {
    var rd = new FileReader();
    rd.onload = function () {
      var bytes = new Uint8Array(rd.result);
      var size = Badges.jpegSize(bytes);
      if (size) {
        var key = f.name.replace(/\.[^.]+$/, "").toLowerCase();
        state.photos[key] = {
          key: key, bytes: bytes, size: size,
          url: URL.createObjectURL(new Blob([bytes], { type: "image/jpeg" }))
        };
      }
      if (--left === 0) refresh();
    };
    rd.readAsArrayBuffer(f);
  });
}
$("files").addEventListener("change", function () { takeFiles(this.files); this.value = ""; });
$("drop").addEventListener("click", function () { $("files").click(); });
$("drop").addEventListener("keydown", function (e) {
  if (e.key === "Enter" || e.key === " ") { e.preventDefault(); $("files").click(); }
});
["dragenter", "dragover"].forEach(function (ev) {
  $("drop").addEventListener(ev, function (e) { e.preventDefault(); this.classList.add("over"); });
});
["dragleave", "drop"].forEach(function (ev) {
  $("drop").addEventListener(ev, function (e) { e.preventDefault(); this.classList.remove("over"); });
});
$("drop").addEventListener("drop", function (e) { takeFiles(e.dataTransfer.files); });

function save(blob, filename) {
  /* The build this came from also ran inside a host that offered its own
     download service, and this function asked for it first. There is no such
     host here and never will be, so the branch was dead code naming another
     platform on a page that is not on it. What is left is the path that
     always ran. */
  var url = URL.createObjectURL(blob);
  var a = document.createElement("a");
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(function () { URL.revokeObjectURL(url); }, 4000);
}
function savePdf() {
  if (!state.people.length) return;
  var b = $("go"), was = b.textContent;
  b.disabled = true; b.textContent = "Building";
  setTimeout(function () {
    try {
      save(new Blob([buildPdf()], { type: "application/pdf" }), "badges.pdf");
    } finally { b.disabled = false; b.textContent = was; refresh(); }
  }, 20);
}
$("go").addEventListener("click", savePdf);
$("pdf").addEventListener("click", savePdf);

$("sample").addEventListener("click", function () {
  $("people").value = SAMPLE;
  $("stock").value = "insert-4x3";
  $("dpi").value = "300";
  state.at = 0;
  refresh();
});

var reflow;
addEventListener("resize", function () { clearTimeout(reflow); reflow = setTimeout(refresh, 140); });

/* Never open empty: a real site induction list, already laid out. */
$("people").value = SAMPLE;
refresh();
</script>
