:root { --paper: #fcfcfb; --ink: #16171a; --ink-soft: #5b5f66; --accent: #c2371c; --rule: #dcdde0; --mark: #f0f0ee; }
html, body { margin: 0; height: 100%; background: var(--paper); color: var(--ink);

#stage { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
/* The canvas is the first tab stop, so the first Tab has to show something. Only for keyboard focus: a click focuses it too, and a ring around the whole viewport on every click would be noise. */
#stage:focus-visible { outline: 2px solid var(--accent); outline-offset: -3px; }
.hud { position: fixed; left: 24px; top: 20px; max-width: 26rem; pointer-events: none; }

/* How much of the world has been seen: seven rooms, counted like a game's levels. */
.hud #progress { position: static; margin: 6px 0 0; padding: 0; font-family: 'IBM Plex Mono', ui-monospace, Menlo, monospace; font-variant-numeric: tabular-nums; font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--ink-soft, #6b6a66); background: none; border: 0; box-shadow: none; min-height: 0; max-width: none; }

.hud p strong { font-weight: 600; }
#labels { position: fixed; inset: 0; pointer-events: none; overflow: hidden; }
.label { position: absolute; left: 0; top: 0; font-size: 15px; font-weight: 500; white-space: nowrap; will-change: transform; }
#list { position: fixed; left: 24px; bottom: 12px; margin: 0; font-size: 13px; display: flex; flex-wrap: wrap; align-items: center; gap: 0 14px; }
#list a, #list button { display: inline-flex; align-items: center; min-height: 44px; }
#list button { font: inherit; color: var(--accent); background: none; border: 0; padding: 0; cursor: pointer; }
#list button:hover { text-decoration: underline; }
#list .legal { color: var(--ink-soft); }
/* The way to the plain site stands apart from the legal pair: heavier, and with a rule before the two. */
#showList { font-weight: 600; }
#list .legal:first-of-type { border-left: 1px solid var(--rule); padding-left: 14px; }
#live { position: absolute; left: -9999px; }
/* Letterbox bars for the second the camera passes through a door. */
#bars::before, #bars::after { content: ''; position: fixed; left: 0; right: 0; height: 0; background: var(--ink); transition: height .5s ease; pointer-events: none; }
#bars::before { top: 0; } #bars::after { bottom: 0; }
body.letterbox #bars::before, body.letterbox #bars::after { height: 9vh; }
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }
/* A faint vignette gives the void an edge without a render pass. */
#vignette { position: fixed; inset: 0; pointer-events: none; background: radial-gradient(ellipse at center, transparent 62%, rgba(22,23,26,0.10) 100%); }
/* The page opens inside the world, in a frame; the world waits behind it. */
#overlay { position: fixed; inset: 6vh 8vw; background: var(--paper); border: 1px solid var(--rule); box-shadow: 0 30px 80px rgba(22,23,26,0.25); display: flex; flex-direction: column; z-index: 5;
  opacity: 0; transform: translateY(18px) scale(0.985); transition: opacity .32s ease, transform .5s cubic-bezier(.2,.8,.2,1); pointer-events: none; }
#overlay.open { opacity: 1; transform: none; pointer-events: auto; }
#overlay[hidden] { display: none; }
/* The hint re-enters each time its text changes. */
.hud p { transition: opacity .25s ease, transform .35s cubic-bezier(.2,.8,.2,1); }
.hud p.swap { opacity: 0; transform: translateY(6px); transition: none; }
@media (prefers-reduced-motion: reduce) { #overlay, .hud p, #veil, #bars::before, #bars::after { transition: none; } }
#overlay-bar { display: flex; justify-content: space-between; align-items: center; padding: 8px 14px; border-bottom: 1px solid var(--rule); font-size: 13px; }
#overlay-bar button { font: inherit; color: var(--accent); background: none; border: 0; cursor: pointer; min-height: 44px; padding: 0 12px; margin-right: -12px; }
#page { flex: 1; border: 0; width: 100%; }
#veil { position: fixed; inset: 0; background: #f3f2ee; opacity: 1; pointer-events: none; transition: opacity .6s ease; }
#veil.on { opacity: 1; pointer-events: auto; }
#veil.off { opacity: 0; }

/* The same seven links as plain HTML: crawlers, screen readers, and anyone without WebGL get this. */
#doors { position: fixed; left: -9999px; top: 0; }
/* Past the seventh door, Tab lands on these seven links. Parked off screen they were seven invisible stops, so the list comes in under the name while it holds focus; z-index keeps the door labels from drawing across it, and the height cap lets it scroll inside the short embedded frame. In flat mode the list is the page and stays as it is. */
body:not(.flat) #doors:focus-within { left: 24px; top: 76px; max-height: calc(100vh - 76px); overflow-y: auto; box-sizing: border-box; padding: 8px 14px; background: rgba(255,255,255,.85); border-left: 2px solid var(--accent); z-index: 1; }
body.flat #stage, body.flat #list, body.flat .hud p, body.flat #veil, body.flat #labels { display: none; }
body.embed #list .legal { display: none; }
body.flat #doors { position: static; padding: 4.5rem 24px 24px; }
#doors ol { list-style: none; margin: 0; padding: 0; max-width: 26rem; }
#doors li { border-top: 1px solid var(--rule); padding: 0; }
#doors li a { display: inline-flex; align-items: center; min-height: 44px; }
#doors li:last-child { border-bottom: 1px solid var(--rule); }
#doors a { display: block; font-size: 17px; }

<!-- The whole graph, named. A module runs only once everything it imports has arrived,
     and the browser learns what that is one level at a time: main.js, then three and the
     eight modules beside it, then the core and the loaders, then the two under those.
     Four round trips before the first line executes, and the character and the ring font
     start only after that. Named here, the nineteen files are asked for at once.

     After the import map, because the browser may follow a preloaded module's own
     imports, and those are written as bare specifiers the map has to resolve.

     FBXLoader is deliberately absent: character.js imports it inside a branch the xbot
     mannequin never takes, so preloading it would fetch a file this page never runs. -->
