<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- A constructed K on the site's own blue.

       Three earlier candidates were drawn and looked at on both grounds at 16,
       20, 32, 64 and 128px, and in the circle a search result crops it to. An
       ink tile vanishes into a dark tab bar and a paper tile vanishes into a
       light one; only the blue holds its shape on both, and it is the accent
       this site already uses rather than a colour invented for a logo.

       The letter is built from three straight strokes rather than set from a
       font, so it stays a K at 16px where a serif would silt up. The upper arm
       is lighter than the leg, which is what a drawn K does.

       KÖ was considered and refused: two dots over a 16px letter are a smudge,
       and an unreadable detail is not worth spending a readable letter on. -->
  <rect width="32" height="32" rx="7" fill="#1f4f8f"/>
  <path d="M11.3 7.4 V24.6" stroke="#fcfcfb" stroke-width="3.9"/>
  <path d="M12.4 16.6 L21.9 7.6" stroke="#fcfcfb" stroke-width="2.9"/>
  <path d="M12.4 15.4 L22.4 24.6" stroke="#fcfcfb" stroke-width="3.3"/>
</svg>
