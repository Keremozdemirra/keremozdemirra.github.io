<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- A constructed K: one stem, one two-segment arm, built from straight strokes
       rather than borrowed from a font, so it survives being shrunk to a tab. -->
  <style>
    .paper { fill: #fcfcfb; }
    .ink { stroke: #16171a; }
    @media (prefers-color-scheme: dark) {
      .paper { fill: #111214; }
      .ink { stroke: #e9eaec; }
    }
  </style>
  <rect class="paper" width="32" height="32" />
  <path class="ink" d="M11 5 L11 27" fill="none" stroke-width="4.6" stroke-linecap="square" />
  <path class="ink" d="M25 5 L11 16 L25 27" fill="none" stroke-width="4.6" stroke-linecap="square" stroke-linejoin="round" />
</svg>
