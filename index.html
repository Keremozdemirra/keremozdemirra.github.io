<style>
:root{
  --serif:"Fraunces",Georgia,serif;
  --sans:"Instrument Sans",-apple-system,"Segoe UI",sans-serif;
  --ink:#211d16;
  --paper:#eceade;
  --night:#e8e4da;
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{background:#16192a;color:var(--ink);font-family:var(--sans)}

/* ---------- the film ---------- */
#filmScroll{height:495vh;position:relative}
#stage{position:sticky;top:0;height:100vh;height:100svh;overflow:hidden}
#film{position:absolute;inset:0;display:block;touch-action:pan-y pinch-zoom;
  -webkit-touch-callout:none;-webkit-user-select:none;user-select:none}

#theName{
  position:absolute;left:0;right:0;top:20%;text-align:center;
  font-family:var(--serif);font-weight:300;
  font-size:clamp(2.6rem,9vw,7.5rem);letter-spacing:.01em;line-height:1;
  color:var(--ink);white-space:nowrap;cursor:default;
  text-shadow:0 1px 0 rgba(255,255,255,.25);
  will-change:opacity,transform,filter;
  /* the signature is decorative: it must not stand between the cursor and
     the world it floats over, least of all the museum, far below it */
  pointer-events:none;
}
#theName i{font-style:italic;font-weight:400}
#theName .srname{position:absolute;width:1px;height:1px;overflow:hidden;
  clip:rect(0 0 0 0);white-space:nowrap}
#sig{width:min(720px,74vw);display:block;margin:0 auto;overflow:visible}
#sig .sg{fill:none;stroke:currentColor;stroke-width:1.22;
  stroke-linecap:round;stroke-linejoin:round}
#sig .sgdot{fill:currentColor;opacity:0;transform:scale(.3);transform-origin:center;
  transition:opacity .3s ease,transform .35s cubic-bezier(.34,1.5,.64,1)}
#sig.done .sgdot{opacity:1;transform:scale(1)}
@media (prefers-reduced-motion:reduce){
  #sig .sg{stroke-dasharray:none!important;stroke-dashoffset:0!important;transition:none!important}
  #sig .sgdot{opacity:1;transform:none;transition:none}
}

#hint{
  position:absolute;left:50%;top:33%;transform:translateX(-50%);
  font-family:var(--serif);font-style:italic;font-size:.92rem;letter-spacing:.06em;
  color:#b06a24;text-shadow:0 0 8px rgba(240,235,220,.75), 0 1px 2px rgba(240,235,220,.9);
  transition:opacity .4s ease;
  animation:breathe 3s ease-in-out infinite;
  pointer-events:none;
}
#hint::after{content:"";display:block;width:1px;height:26px;margin:6px auto 0;
  background:linear-gradient(rgba(176,106,36,.7),transparent)}
#hint.off{animation:none;opacity:0}
#hint.nudge::after{animation:stemNudge .8s cubic-bezier(.22,1,.36,1) 2;transform-origin:top center}
@keyframes stemNudge{0%,100%{transform:scaleY(1)}50%{transform:scaleY(1.7)}}
@keyframes breathe{0%,100%{opacity:.4}50%{opacity:.9}}

/* ---------- the doors ---------- */
#portal{
  position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  width:min(1060px,92vw);
  display:grid;grid-template-columns:repeat(4,1fr);gap:clamp(.9rem,2vw,2rem);
  opacity:0;pointer-events:none;transition:opacity .8s ease;
}
@media (max-width:980px){#portal{grid-template-columns:repeat(2,1fr)}}
@media (max-width:520px){#portal{grid-template-columns:1fr;top:52%}}
#portal.live{opacity:1;pointer-events:auto}
.door{
  width:auto;min-height:188px;
  display:flex;flex-direction:column;justify-content:flex-start;
  text-decoration:none;text-align:center;
  padding:2rem 1.2rem 1.3rem;border-radius:3px;
  color:#e9e2d2;
  background:rgba(26,19,11,.46);
  border:1px solid rgba(224,170,96,.22);
  box-shadow:0 0 40px rgba(224,160,80,.05), inset 0 0 30px rgba(0,0,0,.3);
  backdrop-filter:blur(6px);
  transform:translateY(28px);opacity:0;
  transition:transform .8s cubic-bezier(.22,1,.36,1), opacity .8s ease,
             border-color .3s ease, box-shadow .3s ease, background .3s ease;
}
.door:hover{transform:translateY(-4px)!important}
#portal.live .door{transform:none;opacity:1}
#portal.live .door:nth-child(2){transition-delay:.12s}
#portal.live .door:nth-child(3){transition-delay:.24s}
.door:hover{border-color:rgba(224,170,96,.55);background:rgba(30,22,13,.6);box-shadow:0 0 60px rgba(224,160,80,.12), inset 0 0 30px rgba(0,0,0,.3)}

.door h2{
  font-family:var(--serif);font-weight:300;font-size:clamp(1.4rem,2.6vw,2rem);
  letter-spacing:.01em;
}
.door .peek{height:52px;margin-top:.8rem;opacity:0;transform:translateY(6px);
  transition:opacity .4s ease,transform .45s cubic-bezier(.22,1,.36,1)}
.door:hover .peek,.door:focus-visible .peek{opacity:1;transform:none}
.peek .pg{width:76px;height:48px;margin:0 auto;border:1px solid rgba(224,170,96,.35);border-radius:2px;
  background:rgba(238,233,222,.07);padding:5px 6px;display:flex;flex-direction:column;gap:3px;align-items:flex-start}
.peek .ln{height:3px;border-radius:1px;background:rgba(233,226,210,.5)}
.peek .ln.a{width:60%;background:rgba(224,170,96,.75)}
.peek .ln.b{width:88%}.peek .ln.c{width:74%}.peek .ln.d{width:40%}
.peek .blk{width:100%;height:10px;border-radius:1px;background:rgba(224,170,96,.22)}
@media (hover:none){.door .peek{display:none}}
.door p{margin-top:.55rem;min-height:3em;font-family:"Newsreader",Georgia,serif;font-style:italic;font-size:.92rem;line-height:1.5;color:rgba(233,226,210,.62)}

/* ---------- after the film ---------- */
footer{
  background:#12151f;color:rgba(232,228,218,.5);
  font-size:.72rem;letter-spacing:.06em;
  display:flex;justify-content:space-between;align-items:center;
  gap:1rem;padding:.65rem 6vw calc(.65rem + env(safe-area-inset-bottom,0px));
}
footer a{color:rgba(232,228,218,.75);text-decoration:none}
footer a:hover{color:#fff}
.langs{display:flex;gap:.4rem}
.langs button{background:none;border:0;cursor:pointer;font:inherit;color:rgba(232,228,218,.6);
  min-width:44px;min-height:44px;display:inline-flex;align-items:center;justify-content:center;
  padding:.2em .35em;border-radius:2px}
.langs button:hover{color:#fff}
.langs button[aria-pressed="true"]{color:#fff;border-bottom:1px solid rgba(232,228,218,.5)}

@media (prefers-reduced-motion:reduce){
  #filmScroll{height:100vh}
  #hint{display:none}
}
@media (max-width:700px){
  #portal{align-content:center}
  .door{width:78vw;padding:1.4rem 1rem 1.2rem}
  #theName{top:34%}
}
/* a phone held sideways: the sky is a strip, so the name comes up out of
   the canopy and the invitation with it */
@media (max-height:520px) and (orientation:landscape){
  #theName{top:7%;font-size:clamp(2rem,5vw,3.4rem)}
  #sig{width:min(430px,52vw)}
  #hint{top:29%;font-size:.82rem}
  #hint::after{height:15px;margin-top:4px}
  /* two rows of doors do not fit under a strip of sky: put them in one */
  #portal{grid-template-columns:repeat(4,1fr);top:52%}
  .door{min-height:0;width:auto;padding:.9rem .75rem .85rem}
  .door h2{font-size:clamp(1.05rem,2.2vw,1.45rem)}
  .door p{margin-top:.35rem;min-height:0;font-size:.8rem;line-height:1.4}
  .door .peek{display:none}
  footer{padding-top:.5rem;padding-bottom:calc(.5rem + env(safe-area-inset-bottom,0px))}
}

#fadeout{position:fixed;inset:0;background:#17110a;opacity:0;pointer-events:none;transition:opacity .42s ease;z-index:90}
#fadeout.on{opacity:1}
.door.leaving{transform:translateY(2px) scale(.985)!important;border-color:rgba(224,170,96,.7);
  transition:transform .3s ease,border-color .3s ease,filter .3s ease;filter:brightness(.82)}
#portal.leaving .door:not(.leaving){opacity:.3;transform:scale(.97)!important;
  filter:blur(1px) brightness(.7);transition:opacity .4s ease,transform .4s ease,filter .4s ease}
#iris{position:fixed;left:0;top:0;width:40px;height:40px;border-radius:50%;background:#17110a;
  transform:translate(-50%,-50%) scale(0);pointer-events:none;z-index:91}
#iris.go{transition:transform .52s cubic-bezier(.22,1,.36,1);transform:translate(-50%,-50%) scale(var(--irs,80))}
.edgeNav{position:fixed;top:50%;transform:translateY(-50%);z-index:58;background:none;border:0;cursor:pointer;
  color:#8a7a5e;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:.15rem;padding:.7rem .55rem;min-width:44px;min-height:64px;
  opacity:0;pointer-events:none;transition:opacity .6s ease;
  -webkit-touch-callout:none;-webkit-user-select:none;user-select:none;touch-action:manipulation}
.edgeNav span{font-size:2rem;line-height:1;font-family:var(--serif)}
.edgeNav i{font-style:italic;font-family:var(--serif);font-size:.72rem;letter-spacing:.04em;
  opacity:0;transition:opacity .3s cubic-bezier(.22,1,.36,1)}
.edgeNav:hover i,.edgeNav:focus i,.edgeNav:focus-visible i{opacity:.95;transition-delay:.15s}
#edgeL{left:.35rem} #edgeR{right:.35rem}
body.atCover .edgeNav{opacity:.45;pointer-events:auto}
body.atCover .edgeNav:hover{opacity:1}
.edgeNav:focus-visible{outline:2px solid #e0a050;outline-offset:2px;opacity:1}
body.atL #edgeL,body.atR #edgeR{opacity:0!important;pointer-events:none!important}
@keyframes dawn{from{opacity:1}to{opacity:0}}
#dawn{position:fixed;inset:0;background:#17110a;pointer-events:none;z-index:92;animation:dawn .8s ease .1s forwards}
@media (prefers-reduced-motion:reduce){#dawn{display:none}}

.door:focus-visible,.langs button:focus-visible,#sndBtn:focus-visible{outline:2px solid #e0a050;outline-offset:3px}
#seasonDial{position:fixed;left:1.1rem;bottom:calc(1.1rem + env(safe-area-inset-bottom,0px));
  z-index:60;width:52px;height:52px;border-radius:50%;
  border:1px solid rgba(224,170,96,.35);background:rgba(20,16,10,.78);cursor:pointer;
  padding:0;transition:border-color .2s ease,transform .18s ease;
  touch-action:none;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
#seasonDial:hover{border-color:rgba(224,170,96,.7)}
#seasonDial:active{transform:scale(.94)}
#seasonDial .glyph{opacity:0;transform:translate(26px,26px) scale(.55);
  transition:opacity .4s ease,transform .55s cubic-bezier(.22,1,.36,1);pointer-events:none}
#seasonDial .glyph.on{opacity:1;transform:translate(26px,26px) scale(1.5)}
#dialOrbit{transform-origin:26px 26px;transition:transform .85s cubic-bezier(.3,1.25,.4,1)}
#seasonDial .lbl{position:absolute;left:60px;top:50%;transform:translateY(-50%);
  font-family:var(--serif);font-style:italic;font-size:.85rem;color:rgba(224,200,160,.9);
  white-space:nowrap;opacity:0;transition:opacity .3s ease;pointer-events:none;
  text-shadow:0 1px 3px rgba(10,7,4,.7)}
#seasonDial:hover .lbl,#seasonDial.fresh .lbl{opacity:1}
#sndWrap{position:fixed;right:1.1rem;bottom:calc(1.1rem + env(safe-area-inset-bottom,0px));
  z-index:60;display:flex;align-items:center;gap:.5rem}
#sndBtn{width:44px;height:44px;border-radius:50%;flex:none;
  border:1px solid rgba(224,170,96,.35);background:rgba(20,16,10,.78);color:#e0c9a2;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  transition:border-color .2s ease,color .2s ease}
#sndBtn:hover{border-color:rgba(224,170,96,.7);color:#f4e3c6}
#sndBtn svg{width:19px;height:19px}
#sndPanel{width:0;opacity:0;overflow:hidden;height:44px;display:flex;align-items:center;
  border:1px solid transparent;border-radius:22px;background:rgba(20,16,10,.78);
  transition:width .4s cubic-bezier(.22,1,.36,1),opacity .32s ease,padding .4s cubic-bezier(.22,1,.36,1),border-color .3s ease}
#sndWrap.open #sndPanel{width:116px;opacity:1;padding:0 14px;border-color:rgba(224,170,96,.35)}
#sndVol{-webkit-appearance:none;appearance:none;width:100%;height:40px;padding:19px 0;
  border-radius:1px;cursor:pointer;touch-action:none;background-clip:content-box;
  background-color:transparent;
  background-image:linear-gradient(90deg,#e0a050 0%,#e0a050 65%,rgba(224,170,96,.22) 65%);outline:none}
#sndVol::-webkit-slider-thumb{-webkit-appearance:none;width:13px;height:13px;border-radius:50%;
  background:#e8d5b0;border:1px solid rgba(120,84,40,.8);box-shadow:0 1px 3px rgba(0,0,0,.5)}
#sndVol::-moz-range-thumb{width:13px;height:13px;border-radius:50%;background:#e8d5b0;
  border:1px solid rgba(120,84,40,.8);box-shadow:0 1px 3px rgba(0,0,0,.5)}
#sndVol:focus-visible{outline:2px solid #e0a050;outline-offset:4px}

/* the film is over once the footer is on screen: its two corner controls and
   the side chevrons stand down so the language row and the line under it are
   never sat on. Same courtesy while a DOM overlay is open. */
#seasonDial,#sndWrap{transition:opacity .5s cubic-bezier(.22,1,.36,1),
  border-color .2s ease,transform .18s ease}
.edgeNav{transition:opacity .5s cubic-bezier(.22,1,.36,1)}
body.atFooter #seasonDial,body.atFooter #sndWrap,
body.overlayOpen #seasonDial,body.overlayOpen #sndWrap{
  opacity:0!important;pointer-events:none!important}
body.atFooter .edgeNav,body.overlayOpen .edgeNav{
  opacity:0!important;pointer-events:none!important}
@media (max-width:720px){
  .langs button{padding:.9em .8em}
  .edgeNav{padding:.9rem .7rem}
  #sndWrap.open #sndPanel{width:140px}
  /* four doors in a column, short enough that the stack stands in one screen */
  .door{min-height:0}
  .door p{min-height:2.4em}
  /* the two fixed corners fade out over the footer, so this only needs the
     room the row itself asks for */
  footer{flex-direction:column;align-items:center;gap:.5rem;
    padding:1.1rem 6vw calc(1.1rem + env(safe-area-inset-bottom,0px))}
}
</style>
</head>

<script>
/* ============================================================ THE TREE
   A scroll-scrubbed film, computed rather than filmed.

   Every leaf's flight is a pure function of scroll progress: leaf i detaches
   at its own threshold, follows a path seeded from its index, lands, and at
   the end glides to one of the three doors. Because nothing depends on wall
   time except a light idle sway, scrubbing backwards runs the film backwards:
   leaves rise from the ground and reattach. That reversibility is the
   whole trick, and it is why this is drawn live instead of played from
   frames: a frame sequence of this length would cost megabytes and still
   blur on a retina screen.

   Structure: trunk and branches are grown once with a seeded recursive
   generator and pre-rendered to an offscreen canvas per theme phase; leaves
   are particles drawn each frame; sky, haze, hills and grain are cheap
   gradients over the top. Reduced motion collapses the film to its final
   still with the doors open. */

(function () {
  "use strict";

  var canvas = document.getElementById("film");
  if (!canvas) return;
  var ctx = canvas.getContext("2d");
  var stage = document.getElementById("stage");
  var nameEl = document.getElementById("theName");
  var hintEl = document.getElementById("hint");
  var portal = document.getElementById("portal");
  var doors = portal ? [].slice.call(portal.querySelectorAll(".door")) : [];

  var reduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  var DPR = Math.min(1.5, window.devicePixelRatio || 1);

  /* eggs share this; the film reads it every frame */
  var EGG = window.__EGG = { blossom: 0, burst: null, moleRect: null };
  var _mon = new Date().getMonth();            // real season starts the dial
  var _d = new Date();
  var FESTIVE = (_mon === 11 && _d.getDate() >= 26) || (_mon === 0 && _d.getDate() <= 6);
  /* 0 spring · 1 summer · 2 autumn · 3 winter */
  var seasonCur = (_mon === 11 || _mon <= 1) ? 3 : _mon <= 4 ? 0 : _mon <= 7 ? 1 : 2;
  try {
    var _sv = localStorage.getItem("season");
    if (_sv !== null && +_sv >= 0 && +_sv < 4) seasonCur = +_sv;   // the tree remembers you
  } catch (e) {}
  /* the shown season is a crossfade between exactly two seasons, so a jump
     from summer to winter never wanders through a false autumn */
  var seasonPrev = seasonCur, seasonNext = seasonCur, seasonMix = 1;
  EGG.regrow = function () {
    var seed = (Math.random() * 1e9) | 0;
    rnd = mulberry(seed);
    branches.length = 0; tips.length = 0;
    var baseY = H * 0.92;
    var unit = Math.min(H, W * 1.1);
    grow(W * 0.5, baseY, -Math.PI / 2 + 0.03, unit * 0.155, unit * 0.030, 0, 0);
    renderTrunk();
    buildAntPath();
    renderRoots();
    buildLeaves();
    treeGrowT = performance.now();
    // the branches this tree had are gone; nothing may keep sitting on them
    bird.state = 0; bird.next = performance.now() / 1000 + 12;
    perchIdx = -1; perch = null;
    OWL.on = false; OWL.tipIdx = -1;
    SWING.ax = 0;
  };
  EGG.setSeason = function (i) {
    if (i !== seasonCur || seasonNext !== i) {
      // whatever dominates the blend right now becomes the fade-out side
      seasonPrev = seasonMix > 0.5 ? seasonNext : seasonPrev;
      seasonNext = i;
      seasonMix = seasonPrev === seasonNext ? 1 : 0;
    }
    seasonCur = i;
    try { localStorage.setItem("season", String(i)); } catch (e) {}
    if (window.__dialPaint) window.__dialPaint();
  };
  var DRAG = { held: false, px: 0, py: 0, vx: 0, vy: 0, lastX: 0, lastY: 0, lastT: 0, rot: 0 };
  EGG.grab = function (x, y) {
    if (GUY.state === "ride" || GUY.state === "rideBack" || GUY.state === "home") return false;
    DRAG.held = true; DRAG.px = x; DRAG.py = y;
    DRAG.lastX = x; DRAG.lastY = y; DRAG.lastT = performance.now();
    DRAG.vx = 0; DRAG.vy = 0;
    GUY.state = "held";
    return true;
  };
  EGG.dragTo = function (x, y) {
    if (!DRAG.held) return;
    var n2 = performance.now(), dt3 = Math.max(8, n2 - DRAG.lastT);
    DRAG.vx = DRAG.vx * 0.6 + ((x - DRAG.lastX) / dt3 * 1000) * 0.4;
    DRAG.vy = DRAG.vy * 0.6 + ((y - DRAG.lastY) / dt3 * 1000) * 0.4;
    DRAG.lastX = x; DRAG.lastY = y; DRAG.lastT = n2;
    DRAG.px = x; DRAG.py = y;
  };
  EGG.release = function () {
    if (!DRAG.held) return;
    DRAG.held = false;
    // released into the canopy: he grabs the nearest branch and hangs on
    if (DRAG.py < H * 0.62 && lastP < 0.3) {
      var best = null, bd = 1e9;
      for (var ti2 = 0; ti2 < tips.length; ti2++) {
        var tp2 = tips[ti2];
        var dd2 = (tp2.x - DRAG.px) * (tp2.x - DRAG.px) + (tp2.y - DRAG.py) * (tp2.y - DRAG.py);
        if (dd2 < bd) { bd = dd2; best = tp2; }
      }
      if (best && bd < 4900) {                       // only if a branch is truly at hand
        GUY.hangTip = best;
        GUY.swing = clamp(DRAG.vx * 0.004, -0.8, 0.8);
        GUY.state = "hang"; GUY.t0 = performance.now() / 1000;
        return;
      }
    }
    GUY.state = "falling";
    GUY.fx = DRAG.px; GUY.fy = DRAG.py;
    GUY.fvx = clamp(DRAG.vx, -900, 900);
    GUY.fvy = clamp(DRAG.vy, -900, 900);
    DRAG.rot = 0;
  };
  EGG.dragging = function () { return DRAG.held; };
  EGG.tap = function () {
    DRAG.held = false;
    GUY.state = "wave"; GUY.t0 = performance.now() / 1000;
    GUY.mode2 = "wave";
    GUY.bubble = GUY.t0 + 2.2;
  };
  EGG.rideRequest = function () {
    if (GUY.state === "ride" || GUY.state === "rideBack" || !BIKE.present) return;
    if (GUY.state === "away" || GUY.state === "home") { GUY.state = "toBike"; GUY.x = -30; }
    else GUY.state = "toBike";
  };
  EGG.plantRequest = function () {
    if (!ACORN || !ACORN.landed || GUY.state === "ride" || GUY.state === "rideBack") return;
    GUY.targetX = ACORN.x;
    if (GUY.state === "away" || GUY.state === "home") GUY.x = -30;
    GUY.state = "toPlant";
  };
  EGG.snowRequest = function () {
    if (GUY.state === "ride" || GUY.state === "rideBack" || GUY.state === "building") return;
    if (GUY.state === "away" || GUY.state === "home") GUY.x = -30;
    GUY.state = "toSnow";
  };
  EGG.swingRequest = function () {
    // only if he is free: no interrupting a ride, a build, or being carried
    var free = GUY.state === "wave" || GUY.state === "stand" ||
               GUY.state === "walkin" || GUY.state === "walkout" ||
               GUY.state === "away" || GUY.state === "home";
    if (!free || GUY.state === "swinging" || GUY.state === "toSwing") return;
    if (GUY.state === "away" || GUY.state === "home") GUY.x = -30;
    GUY.state = "toSwing";
  };
  EGG.squirrelRequest = function () {
    if (SQUIRREL.state === 0) { SQUIRREL.state = 1; SQUIRREL.t0 = performance.now() / 1000; }
  };
  EGG.owlRequest = function () { OWL.on = false; };
  EGG.eclipseRequest = function () { ECLIPSE = 1; };
  EGG.catchLeaf = function (x, y) {
    if (CAUGHT) return false;
    for (var i = 0; i < N; i++) {
      var L2 = LEAVES[i];
      var f2 = (lastP - L2.detach) / L2.dur;
      if (f2 <= 0.05 || f2 >= 0.95) continue;
      // where is it right now? cheap re-derivation of the draw position
      var fe2 = ease(Math.max(0, Math.min(1, f2)));
      var lx = lerp(L2.ax, L2.gx, fe2 * 0.55) + L2.driftA * 90 * fe2
             + Math.sin(f2 * 9 + L2.driftB) * 22 * (1 - f2 * 0.4);   // the flutter, same as drawn
      var ly = lerp(L2.ay, L2.gy, f2 * f2 * (3 - 2 * f2));
      if ((lx - x) * (lx - x) + (ly - y) * (ly - y) < 500) {
        CAUGHT = { i: i, t0: performance.now() / 1000, x: lx, y: ly };
        L2.detach = 9;   // it leaves the film; it is his now
        return true;
      }
    }
    return false;
  };
  EGG.soakRequest = function () {
    if (RAIN.on > 0.2) GUY.wet = true;
  };
  EGG.rainRequest = function () {
    RAIN.on = 1; RAIN.until = performance.now() / 1000 + 12;
  };
  EGG.wishRequest = function () { STAR.wished = performance.now() / 1000; };
  EGG.antRequest = function () { antPause = performance.now() / 1000; };
  var antPause = 0;
  EGG.getSeason = function () { return seasonCur; };
  function sw(k) {                                                        // season weight
    return (k === seasonPrev ? (1 - seasonMix) : 0) + (k === seasonNext ? seasonMix : 0);
  }
  var gNightIdle = 0;
  var _hr = new Date().getHours() + new Date().getMinutes() / 60;
  // sun path: -1 at 07:00 (shadows west), 0 at 13:00, +1 at 19:00
  var SUN = Math.max(-1, Math.min(1, (_hr - 13) / 6));
  function groundShadow(x, w2, al) {
    ctx.save();
    ctx.translate(x + SUN * w2 * 0.9, H * 0.889);
    ctx.scale(1, 0.18);
    var sg2 = ctx.createRadialGradient(0, 0, 0, 0, 0, w2 * (1 + Math.abs(SUN) * 0.6));
    sg2.addColorStop(0, "rgba(20,14,8," + al + ")");
    sg2.addColorStop(1, "rgba(20,14,8,0)");
    ctx.fillStyle = sg2;
    ctx.beginPath(); ctx.arc(0, 0, w2 * (1 + Math.abs(SUN) * 0.6), 0, 6.284); ctx.fill();
    ctx.restore();
  }
  try { if (new URLSearchParams(location.search).get("night") === "1") gNightIdle = 1; } catch (e) {}
  var FORCE_NIGHT = gNightIdle === 1;
  var W = 0, H = 0, small = false;

  /* ------------------------------------------------ seeded randomness
     One seed, one tree. The same visitor sees the same tree twice. */
  function mulberry(seed) {
    return function () {
      seed |= 0; seed = (seed + 0x6D2B79F5) | 0;
      var t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  var rnd = mulberry(20260820);

  var lerp = function (a, b, t) { return a + (b - a) * t; };
  var clamp = function (v, a, b) { return v < a ? a : v > b ? b : v; };
  var smooth = function (t) { t = clamp(t, 0, 1); return t * t * (3 - 2 * t); };
  var ease = function (t) { return 1 - Math.pow(1 - clamp(t, 0, 1), 3); };

  /* ------------------------------------------------------- the skeleton */
  var branches = [];   // {x1,y1,x2,y2,w,depth,sway}
  var tips = [];       // leaf anchor points {x,y,depth,sway}

  function grow(x, y, angle, len, width, depth, swayAmp) {
    if (depth > 9 || len < 4.5) { tips.push({ x: x, y: y, d: depth, s: swayAmp }); return; }
    var segs = 4;
    var px = x, py = y, a = angle;
    for (var s = 0; s < segs; s++) {
      a += (rnd() - 0.5) * 0.22;                       // organic wobble
      a = lerp(a, -Math.PI / 2, 0.03);                 // faint phototropism
      var sl = len / segs;
      var nx = px + Math.cos(a) * sl;
      var ny = py + Math.sin(a) * sl;
      var bow = (rnd() - 0.5) * sl * 0.5;
      branches.push({ x1: px, y1: py, x2: nx, y2: ny,
        cx: (px + nx) / 2 - Math.sin(a) * bow, cy: (py + ny) / 2 + Math.cos(a) * bow,
        w: width * (1 - s / segs * 0.12), d: depth, s: swayAmp });
      px = nx; py = ny;
    }
    if (depth >= 2 && rnd() < 0.75) tips.push({ x: px, y: py, d: depth, s: swayAmp });
    if (depth >= 4) tips.push({ x: (x + px) / 2, y: (y + py) / 2, d: depth, s: swayAmp * 0.8 });
    var kids = depth < 3 ? 3 : 2;
    for (var k = 0; k < kids; k++) {
      var spread = lerp(0.35, 0.85, rnd());
      var na = a + (k - (kids - 1) / 2) * spread + (rnd() - 0.5) * 0.3;
      // droop: outer branches relax toward horizontal, like weight does
      na = lerp(na, na > -Math.PI / 2 ? -0.15 : -Math.PI + 0.15, depth * 0.02);
      grow(px, py, na, len * lerp(0.62, 0.74, rnd()), width * 0.66, depth + 1,
           swayAmp + len * 0.0022);
    }
  }

  /* ------------------------------------------------------------ leaves */
  var LEAVES = [];
  var aoBlobs = [];
  var aoCanvas = null;
  function bakeAO() {
    aoCanvas = document.createElement("canvas");
    aoCanvas.width = W; aoCanvas.height = H;
    var a2 = aoCanvas.getContext("2d");
    aoBlobs.forEach(function (B) {
      var g2 = a2.createRadialGradient(B.x, B.y, 0, B.x, B.y, B.r);
      g2.addColorStop(0, "rgba(26,36,20,0.10)");
      g2.addColorStop(1, "rgba(26,36,20,0)");
      a2.fillStyle = g2;
      a2.beginPath(); a2.arc(B.x, B.y, B.r, 0, 6.284); a2.fill();
    });
  }
  var N = 0;

  var GREENS = ["#5a7d4a", "#6b8f54", "#4c7040", "#7da05f", "#87a86a", "#5f8a4e"];
  var BLOSSOM = ["#e8b4c8", "#f2d2dd", "#f7e8ee", "#dfa0b8", "#f0c6d4", "#f5dde6", "#e5aabf"];
  var AUTUMN = ["#c8842e", "#b25b28", "#d99a3c", "#a34a22", "#c26a24", "#dca94e", "#8f3f1e"];

  function hex(h) {
    return [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
  }
  var GREENS_RGB = GREENS.map(hex), AUTUMN_RGB = AUTUMN.map(hex), BLOSSOM_RGB = BLOSSOM.map(hex);
  var WINTER_RGB = [200, 204, 196];

  function buildLeaves() {
    LEAVES.length = 0;
    N = small ? 950 : 2000;
    for (var i = 0; i < N; i++) {
      var tip = tips[(rnd() * tips.length) | 0];
      var spread = lerp(8, 46, rnd());
      var la = rnd() * Math.PI * 2;
      var ax = tip.x + Math.cos(la) * spread;
      var ay = tip.y + Math.sin(la) * spread * 0.8 - 6;
      LEAVES.push({
        ax: ax, ay: ay,                              // attach point
        depth: tip.d, sway: tip.s,
        size: lerp(3.4, 7.2, rnd()) * (small ? 0.85 : 1),
        tilt: rnd() * Math.PI * 2,
        spin: (rnd() - 0.5) * 9,
        gi: (rnd() * GREENS_RGB.length) | 0,
        ai: (rnd() * AUTUMN_RGB.length) | 0,
        turn: 0.10 + rnd() * 0.5,                    // when this leaf turns colour
        detach: 0.14 + Math.pow(rnd(), 0.85) * 0.46,  // when it lets go (max .72)
        dur: 0.10 + rnd() * 0.08,                    // how much progress a fall takes
        driftA: (rnd() - 0.5) * 2,                   // horizontal drift direction
        driftB: rnd() * Math.PI * 2,                 // flutter phase
        door: (rnd() * 3) | 0,                       // which pile it joins
        gx: 0, gy: 0,                                // ground position, set on resize
        phase: rnd() * Math.PI * 2
      });
    }
    // ground positions: banked drifts, weighted under the tree
    LEAVES.forEach(function (L) {
      var bank = (rnd() - 0.5);
      L.gx = W * 0.5 + bank * W * 0.46 + (rnd() - 0.5) * 40;
      L.gy = H * 0.885 - 3 - Math.abs((rnd() + rnd() - 1)) * 15 + rnd() * 9 + Math.abs(bank) * 5;
      // its place in the pile: a gaussian heap, not a strip
      var gsx = (rnd() + rnd() + rnd() - 1.5) / 1.5;
      L.px = gsx * 82;
      L.py = 10 - Math.abs((rnd() + rnd() - 1)) * 20 - (1 - Math.abs(gsx)) * 8;
    });
    aoBlobs.length = 0;
    for (var ab = 0; ab < 16; ab++) {
      var tp = tips[(rnd() * tips.length) | 0];
      aoBlobs.push({ x: tp.x, y: tp.y - 6, r: lerp(28, 56, rnd()) });
    }
    bakeAO();
    bakeSky();
  }

  /* -------------------------------------------------- trunk pre-render */
  var trunkCanvas = document.createElement("canvas");
  var rootCanvas = document.createElement("canvas");   // the underground
  var rootBranches = [];

  function growRoot(x, y, angle, len, width, depth) {
    if (depth > 7 || len < 6 || width < 0.7) return;
    // one long, gently bowed limb per call: fewer joints, calmer line
    var a = lerp(angle, Math.PI / 2, 0.10) + (rnd() - 0.5) * 0.18;
    var nx = x + Math.cos(a) * len;
    var ny = y + Math.sin(a) * len;
    var bow = (rnd() - 0.5) * len * 0.35;
    rootBranches.push({ x1: x, y1: y, x2: nx, y2: ny,
      cx: (x + nx) / 2 - Math.sin(a) * bow, cy: (y + ny) / 2 + Math.cos(a) * bow,
      w: width, w2: width * 0.55, d: depth });
    var kids = depth < 2 ? 3 : 2;
    for (var k = 0; k < kids; k++) {
      var na = a + (k - (kids - 1) / 2) * lerp(0.45, 0.95, rnd()) + (rnd() - 0.5) * 0.3;
      growRoot(nx, ny, na, len * lerp(0.62, 0.8, rnd()), width * 0.55, depth + 1);
    }
  }

  /* ---- the twelve, drawn with the same few materials ----
     brass for what was won, chalky limestone in darker rock for what was
     made, and for the two cities their own stuff: brass, paper, card. */
  function drawMuseObj(t, k, x, y, sc) {
    t.save();
    t.translate(x, y);
    t.scale(sc, sc);
    t.lineJoin = "round";

    function brass(y1, y2) {
      var g = t.createLinearGradient(0, y1, 0, y2);
      g.addColorStop(0, "rgba(234,206,150,.95)");
      g.addColorStop(0.45, "rgba(196,156,90,.95)");
      g.addColorStop(1, "rgba(122,94,48,.95)");
