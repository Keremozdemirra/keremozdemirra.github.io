        }
        case "splat":
          drawGuy(GUY.x, gy4, t, "flat", GUY.outfit, null);
          if (t - GUY.t0 > 1.6) { GUY.state = "getup"; GUY.t0 = t; }
          break;
        case "getup":
          drawGuy(GUY.x, gy4, t, "crouch", GUY.outfit, null);
          if (t - GUY.t0 > 0.7) {
            GUY.state = "stand"; GUY.t0 = t;
            GUY.throwCount = (GUY.throwCount || 0) + 1;
            GUY.line = GUY.throwCount >= 3 ? pick("hattrick") : pick("thrown");
            GUY.bubble = t + 2.6;
          }
          break;
        case "goDoze":
          var dirD = houseX() - 38 > GUY.x ? 1 : -1;
          GUY.x += dirD * 46 * spd;
          drawGuy(GUY.x, gy4, t, "walk", GUY.outfit, GUY.prop, dirD);
          if (Math.abs(GUY.x - (houseX() - 38)) < 6) { GUY.state = "doze"; GUY.t0 = t; }

        case "doze":
          // seated on the doorstep, chin down

        case "hang": {

          var sx6 = GUY.hangTip.x + Math.sin(t * 3.1) * 18 * GUY.swing;
          drawGuy(sx6, GUY.hangTip.y + 46 + Math.cos(t * 3.1) * 4 * Math.abs(GUY.swing) + Math.sin(t * 2.2) * 3,
                  t, "held", GUY.outfit, null);
          if (t - GUY.t0 > 2.2) {

        }
        case "goHome":
          var dirH = GUY.x < houseX() - 16 ? 1 : -1;

          drawGuy(GUY.x, gy4, t, "walk", GUY.outfit, GUY.prop, dirH);

        case "enterHouse":
          drawGuy(lerp(GUY.x, houseX() - 8, (t - GUY.t0) / 0.7), gy4, t, "walk", GUY.outfit, null);
          if (t - GUY.t0 > 0.7) { GUY.state = "home"; GUY.t0 = t; GUY.outfit = seasonCur; }
          break;
        case "home":
          if (gNightIdle < 0.5 && t - GUY.t0 > 1.6) { GUY.state = "exitHouse"; GUY.t0 = t; }
          break;
        case "exitHouse":
          GUY.x = lerp(houseX() - 8, houseX() - 40, (t - GUY.t0) / 0.7);
          drawGuy(GUY.x, gy4, t, "walk", GUY.outfit, GUY.prop, -1);
          if (t - GUY.t0 > 0.7) { GUY.state = "wave"; GUY.t0 = t; GUY.mode2 = "wave"; }
          break;
        case "toSnow":
          var dirS = GUY.x < W * 0.24 + 20 ? 1 : -1;
          GUY.x += dirS * 52 * spd;
          drawGuy(GUY.x, gy4, t, "walk", GUY.outfit, GUY.prop, dirS);
          if (Math.abs(GUY.x - (W * 0.24 + 20)) < 8) { GUY.state = "building"; GUY.t0 = t; SNOWMAN.x = W * 0.24; }
          break;
        case "building": {
          drawGuy(W * 0.24 + 22, gy4, t, "crouch", GUY.outfit, null);
          var bt2 = t - GUY.t0;
          SNOWMAN.stage = bt2 > 5.4 ? 3 : bt2 > 3.4 ? 2 : bt2 > 1.6 ? 1 : 0;
          if (bt2 > 6.2) { GUY.state = "stand"; GUY.t0 = t; }
          break;
        }
        case "toSwing":
          var swTx = SWING.ax + 2;
          var dirW2 = GUY.x < swTx ? 1 : -1;
          GUY.x += dirW2 * 52 * spd;
          drawGuy(GUY.x, gy4, t, "walk", GUY.outfit, GUY.prop, dirW2);
          if (Math.abs(GUY.x - swTx) < 8) { GUY.state = "swinging"; GUY.t0 = t; }
          break;
        case "swinging":
          // he is drawn at the seat, up with the swing; after eight seconds he lets go
          if (t - GUY.t0 > 8.4) { GUY.state = "stand"; GUY.t0 = t; GUY.x = SWING.ax + 16; }
          break;
        case "toPlant":
          var dirP = GUY.x < GUY.targetX ? 1 : -1;
          GUY.x += dirP * 52 * spd;
          drawGuy(GUY.x, gy4, t, "walk", GUY.outfit, GUY.prop, dirP);
          if (Math.abs(GUY.x - GUY.targetX) < 8) { GUY.state = "planting"; GUY.t0 = t; }
          break;
        case "planting":
          drawGuy(GUY.targetX - 14, gy4, t, "crouch", GUY.outfit, null);
          if (t - GUY.t0 > 2.2) {
            SAPLING.push({ x: GUY.targetX, t0: t });

            GUY.state = "stand"; GUY.t0 = t;
          }
          break;
      }
      if (GUY.bubble > t && GUY.line &&
          (GUY.state === "wave" || GUY.state === "stand" || GUY.state === "walkout" ||
           GUY.state === "walkin" || GUY.state === "getup")) {
        drawBubble(GUY.x, gy4 - 66, GUY.line);

      if (sw(3) > 0.6 && guyVis > 0.2 &&
          (GUY.state === "wave" || GUY.state === "stand" || GUY.state === "walkin" ||
           GUY.state === "walkout" || GUY.state === "toBike" || GUY.state === "goHome")) {
        var brPh = (t % 2.8) / 2.8;
        if (brPh < 0.35) {
          var brA = Math.sin((brPh / 0.35) * Math.PI) * 0.22 * guyVis;
          ctx.fillStyle = "rgba(238,240,238," + brA + ")";
          ctx.beginPath();
          ctx.ellipse(GUY.x + 9 + brPh * 12, gy4 - 54 - brPh * 7, 2.2 + brPh * 5, 1.6 + brPh * 3, 0, 0, 6.284);
          ctx.fill();
        }
      }
      if (!BIKE.present && !BIKE.back && t - BIKE.gone > 16 && GUY.state === "away") {
        BIKE.back = true; GUY.state = "rideBack"; GUY.t0 = t;   // he brings it back himself

      if (GUY.notes > t) {
        ctx.fillStyle = "rgba(60,48,36," + (0.7 * (GUY.notes - t) / 1.8) + ")";
        ctx.font = "13px Georgia";
        ctx.fillText("\u266a", GUY.x + 12, gy4 - 70 - (1.8 - (GUY.notes - t)) * 14);
        ctx.fillText("\u266b", GUY.x + 24, gy4 - 60 - (1.8 - (GUY.notes - t)) * 10);

      ctx.globalAlpha = 1;
      EGG.guyRect = (guyVis > 0.3 && GUY.state !== "away" && GUY.state !== "ride" &&
                     GUY.state !== "rideBack" && GUY.state !== "home" &&

    /* a caught leaf drifts to his hand, and he shows it off */

      if (GUY.state === "away" || GUY.state === "home") { CAUGHT = null; }
      else if (ct2 < 1.2) {

        var bx = lerp(-40, pp.x, smooth(bt));

      } else if (bird.state === 4) {

        var headY = guyGround() - 58;

                 lerp(p4.y - 6, headY, smooth(bt4)) - Math.sin(bt4 * 3.14) * 24, t, bt4 < 1);
        if (t - bird.t0 > 4.4) { bird.state = 3; perch = { x: GUY.x, y: headY }; perchIdx = -1; bird.t0 = t; }

        drawBird(lerp(pp3.x, W + 50, smooth(lt)),
                 lerp(pp3.y - 6, H * 0.12, smooth(lt)) - Math.sin(lt * 3.14) * 40, t, true);
      } else if (bird.state === 5 && pp) {
        // the errand, part one: it heard you, and it knows where the secrets are
        var et = (t - bird.t0) / 1.9;

        else drawBird(lerp(pp.x, W + 60, smooth(et)),
                      lerp(pp.y - 6, H * 0.10, smooth(et)) - Math.sin(et * 3.14) * 40, t, true);
      } else if (bird.state === 6) {
        if (t - bird.t0 > 2.5) { bird.state = 7; bird.t0 = t; }
      } else if (bird.state === 7) {
        // part two: back with a rolled parchment, left at the tree's feet
        var rt = Math.min(1, (t - bird.t0) / 3.0);
        var lx7 = lerp(W + 60, W * 0.5 + 26, smooth(rt));
        var ly7 = lerp(H * 0.10, guyGround() - 5, smooth(rt)) - Math.sin(rt * 3.14) * 46;
        drawBird(lx7, ly7, t, rt < 1);
        ctx.save();
        ctx.translate(lx7 + 11, ly7 + 3);
        ctx.rotate(0.18);
        drawScrollShape(0.75);
        ctx.restore();

        }
      }
    } else if (bird.state !== 0) { bird.state = 0; bird.next = t + 20; EGG.birdRect = null; }

      ctx.globalAlpha = groundVis;

      else {

        });

    var petalAmt = Math.max(EGG.blossom, sw(0) * 0.55 * (p < 0.35 ? 1 : 0));
    if (petalAmt > 0.05) {

      for (var pt2 = 0; pt2 < 26; pt2++) {

        var pyy = ((pt2 * 97.3 + t * (34 + pt2 % 7 * 8)) % (H + 30)) - 15;
        ctx.save(); ctx.translate(pxx, pyy); ctx.rotate(t * 2 + pt2);
        ctx.beginPath(); ctx.ellipse(0, 0, 2.6, 1.6, 0, 0, 6.284); ctx.fill(); ctx.restore();
      }
    }
  }

  /* ------------------------------------------------ what he has to say */
  var SAY = {
    generic: ["Hello. I was already waving.","You scrolled here on purpose, I hope.","Nice cursor. Very pointy.","I live here. Someone has to.","The grass grew a bit today. Progress.","That cloud has been there all week.","The mole says hello. From below.","The squirrel owes me three acorns.","The bird thinks my head is furniture.","I painted the door. Nobody noticed.","The bicycle is red. It was on sale.","Keep scrolling. I will manage the seasons.","You control the weather. No pressure.","I saw you hovering. Everyone does.","The tree is older than me. Barely.","Quiet day. My favorite kind.","The sky is doing its thing again.","I would offer tea. Small house though.","Somewhere a squirrel is judging us.","Try not to click anything important.","The owl works nights. We rarely talk.","You can pan, you know. Sideways.","This is all drawn by hand. Even me.","The tree and I were just talking.","Waving is my main responsibility here.","There is more, left and right. Allegedly."],

  function pick(pool) {
    var arr = SAY[pool] || SAY.generic;
    if (!sayBag[pool] || !sayBag[pool].length) {
      sayBag[pool] = arr.map(function (_, i) { return i; });
      for (var si = sayBag[pool].length - 1; si > 0; si--) {
        var sj = (Math.random() * (si + 1)) | 0;
        var tmp = sayBag[pool][si]; sayBag[pool][si] = sayBag[pool][sj]; sayBag[pool][sj] = tmp;

/* the season dial: turn the wheel, the year turns with it */
(function(){

  if (!dial || !EGG.getSeason) return;
  var NAMES = ["Spring", "Summer", "Autumn", "Winter"];
  function seasonName(i){ return (window.__t ? window.__t("s" + i, NAMES[i]) : NAMES[i]); }
  var ROT = [90, 0, -90, -180];      // which glyph sits at three o'clock? bring active to top
  var turns = 0, cur = EGG.getSeason();
  var orbit = document.getElementById("dialOrbit");
  /* the film calls this whenever the season changes, from any door:
     dial click, console, restore. One source of truth: EGG.getSeason(). */
  window.__dialPaint = function () {
    var next = EGG.getSeason();
    if (next === cur) { paint(); return; }
    if (next === 0 && cur === 3) turns++;     // the year wraps forward, the orbit keeps going
    cur = next;
    paint();
  };
  function paint() {
    if (orbit) orbit.style.transform = "rotate(" + (90 * cur + turns * 360) + "deg)";
    dial.querySelectorAll(".glyph").forEach(function(g, i){
      g.classList.toggle("on", i === cur);
    });
    lbl.textContent = seasonName(cur);
    dial.classList.add("fresh");
    setTimeout(function(){ dial.classList.remove("fresh"); }, 1600);

  /* the season keeps its name in whatever language is being read */
  document.addEventListener("langchange", function(){ lbl.textContent = seasonName(cur); });
  var pressT = 0, longFired = false;
  dial.addEventListener("contextmenu", function(e){ e.preventDefault(); });
  dial.addEventListener("pointerdown", function(){ pressT = performance.now(); longFired = false; });
  dial.addEventListener("pointerup", function(){
    if (performance.now() - pressT > 550) {
      longFired = true;
      if (EGG.rainRequest) EGG.rainRequest();

  });
  var clickTimer = null;
  dial.addEventListener("dblclick", function(){
    if (clickTimer) { clearTimeout(clickTimer); clickTimer = null; }
    if (EGG.regrow) EGG.regrow();

      clickTimer = null;

  function bookNoMotion() {
    return window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  }
  function bookShort() { return innerHeight < 480; }
  /* two pages side by side need both a width to hold them and a height to

  function bookWantsSingle() { return innerWidth < 640 || innerHeight < 340; }

  function bookTight() { return innerWidth < 940; }

       the text stops above them instead of running under them */
    var foot = (BOOK.single || bookTight()) ? "2.7rem" : (bookShort() ? "1.6rem" : "2.2rem");
    return bookShort() ? "1.05rem 1.15rem " + foot : "1.7rem 1.6rem " + foot;
  }
  function bookPageHTML(i) {
    var P = BOOK_PAGES[i];
    var s = "";

      if (P.title) {
        s += '<div style="font-style:italic;font-size:1.02rem;color:#6b573c;margin:0 0 ' +
             (sv ? ".6rem" : "1.1rem") + ';">' + P.title + "</div>";
      }
      s += '<h3 style="font-weight:400;font-size:.78rem;letter-spacing:.22em;text-transform:uppercase;' +
           'color:#8a6d48;margin:0 0 ' + (sv ? ".55rem" : ".95rem") + ';">' + P.h + "</h3>";
      for (var k = 0; k < P.ps.length; k++) {
        s += '<p style="margin:' + (sv ? ".42em" : ".55em") + ' 0;font-size:' +
             (sv ? ".76rem" : ".84rem") + ';line-height:' + (sv ? "1.42" : "1.5") +
             ';font-style:italic;color:#4a3c2b">' + P.ps[k] + "</p>";
      }
    }
    if (i < BOOK_PAGES.length - 1 || P) {
      s += '<span style="position:absolute;bottom:' + ((BOOK.single || bookTight()) ? ".95rem" : ".7rem") + ';' +
           (BOOK.single || bookTight() ? "left:50%;transform:translateX(-50%)"
                        : (i % 2 === 0 ? "left:1.3rem" : "right:1.3rem")) +
           ';font-size:.7rem;color:#9a8668;">' + (i + 1) + "</span>";
    }

  }
  function bookMaxSpread() {
    return BOOK.single ? BOOK_PAGES.length - 2 : Math.ceil(BOOK_PAGES.length / 2) - 1;

  function bookRender() {
    BOOK.pgL.style.padding = bookPad();
    BOOK.pgR.style.padding = bookPad();
    if (BOOK.single) {
      BOOK.pgL.style.display = "none";
      BOOK.pgR.style.left = "0"; BOOK.pgR.style.width = "100%";
      BOOK.pgR.style.borderRadius = "7px";
      BOOK.pgR.innerHTML = bookPageHTML(BOOK.spread);
    } else {
      BOOK.pgL.style.display = "";
      BOOK.pgR.style.left = "50%"; BOOK.pgR.style.width = "50%";
      BOOK.pgR.style.borderRadius = "2px 9px 9px 2px";
      BOOK.pgL.innerHTML = bookPageHTML(BOOK.spread * 2);
      BOOK.pgR.innerHTML = bookPageHTML(BOOK.spread * 2 + 1);
    }
    // arrows: outside the covers on wide screens, tucked into the
    // bottom corners of the single page on small ones
    function placeArrow(b, dirRight) {
      if (BOOK.single || bookTight()) {
        // no margin outside the covers: the arrows take the bottom corners,
        // where the page number used to sit, and the number moves to the middle
        b.style.top = "auto"; b.style.bottom = "-0.1rem";
        b.style.transform = "none";
        b.style.color = "#8a6d48"; b.style.fontSize = "1.6rem";
        if (dirRight) { b.style.right = ".4rem"; b.style.left = "auto"; }
        else { b.style.left = ".4rem"; b.style.right = "auto"; }
      } else {
        b.style.top = "50%"; b.style.bottom = "auto";
        b.style.transform = "translateY(-50%)";
        b.style.color = "#e8dfc8"; b.style.fontSize = "2.1rem";
        if (dirRight) { b.style.right = "-2.4rem"; b.style.left = "auto"; }
        else { b.style.left = "-2.4rem"; b.style.right = "auto"; }
      }
    }
    placeArrow(BOOK.btnPrev, false);
    placeArrow(BOOK.btnNext, true);
    if (BOOK.xBtn) {
      // the clasp sits above the covers while there is room above them,
      // and steps onto the page itself when there is not
      var gapAbove = (innerHeight - Math.min(540, innerHeight * 0.84)) / 2;
      var inside = gapAbove < 48;

      BOOK.xBtn.style.right = inside ? ".25rem" : "-.7rem";
      BOOK.xBtn.style.color = inside ? "#8a6d48" : "#e8dfc8";

  function bookFace(html, back) {
    var f = document.createElement("div");
    f.className = "bkFace";

      "position:absolute;inset:0;background:#efe7d2;padding:" + bookPad() + ";overflow:hidden;" +
      "backface-visibility:hidden;-webkit-backface-visibility:hidden;" +
      (back ? "transform:rotateY(180deg);" : "");
    f.innerHTML = html;
    var shade = document.createElement("div");
    shade.style.cssText = "position:absolute;inset:0;pointer-events:none;background:linear-gradient(" +
      (back ? "90deg" : "270deg") + ",rgba(70,52,30,.16),rgba(70,52,30,0) 30%);";
    f.appendChild(shade);
    return f;
  }
  function bookTurn(dir) {
    if (BOOK.busy) return;
    var target = BOOK.spread + dir;
    if (target < 0 || target > bookMaxSpread()) return;
    if (bookNoMotion()) { BOOK.spread = target; bookRender(); return; }
    BOOK.busy = true;
    var fwd = dir > 0;
    var turner = document.createElement("div");
    var frontHTML, backHTML, startDeg = 0, endDeg, leftCss, widthCss, originCss;
    var fadeOutEnd = false, fadeIn = false;
    if (BOOK.single) {
      leftCss = "0"; widthCss = "100%"; originCss = "left center";
      if (fwd) {
        frontHTML = bookPageHTML(BOOK.spread); backHTML = "";
        endDeg = -180; fadeOutEnd = true;          // the leaf leaves the book
      } else {
        frontHTML = bookPageHTML(target); backHTML = bookPageHTML(BOOK.spread);
        startDeg = -180; endDeg = 0; fadeIn = true; // the leaf returns from the left
      }
    } else if (fwd) {
      leftCss = "50%"; widthCss = "50%"; originCss = "left center";
      frontHTML = bookPageHTML(BOOK.spread * 2 + 1);
      backHTML = bookPageHTML(target * 2);
      endDeg = -180;
    } else {
      leftCss = "0"; widthCss = "50%"; originCss = "right center";
      frontHTML = bookPageHTML(BOOK.spread * 2);
      backHTML = bookPageHTML(target * 2 + 1);
      endDeg = 180;
    }
    turner.style.cssText =
      "position:absolute;top:0;height:100%;left:" + leftCss + ";width:" + widthCss + ";" +
      "transform-style:preserve-3d;z-index:3;transform-origin:" + originCss + ";" +
      "transform:rotateY(" + startDeg + "deg)" + (fadeIn ? ";opacity:0" : "") + ";" +
      "transition:transform .6s cubic-bezier(.35,.1,.25,1)" +
      (fadeOutEnd ? ",opacity .16s ease .44s" : (fadeIn ? ",opacity .14s ease" : "")) + ";" +
      "box-shadow:0 6px 26px rgba(20,14,8,.28);";
    turner.appendChild(bookFace(frontHTML, false));
    turner.appendChild(bookFace(backHTML, true));
    BOOK.inner.appendChild(turner);
    // beneath the turning leaf, the incoming page already waits
    BOOK.spread = target;
    if (BOOK.single) {
      if (fwd) BOOK.pgR.innerHTML = bookPageHTML(target);
      // going back, the old page stays beneath until the leaf covers it
    } else if (fwd) {
      BOOK.pgR.innerHTML = bookPageHTML(target * 2 + 1);
    } else {
      BOOK.pgL.innerHTML = bookPageHTML(target * 2);
    }
    requestAnimationFrame(function(){ requestAnimationFrame(function(){
      turner.style.transform = "rotateY(" + endDeg + "deg)";
      if (fadeOutEnd) turner.style.opacity = "0";
      if (fadeIn) turner.style.opacity = "1";
    }); });
    setTimeout(function(){
      turner.remove();
      bookRender();
      BOOK.busy = false;
    }, 640);
  }
  function closeSecrets() {
    if (secretsEl) { secretsEl.style.display = "none"; }
    if (secretsBack) { secretsBack.style.display = "none"; }
    document.body.classList.remove("overlayOpen");
  }
  function openSecrets() {

    if (!secretsEl) {

      function makePage(leftSide) {

          "border-radius:" + (leftSide ? "9px 2px 2px 9px" : "2px 9px 9px 2px") + ";" +

        var spine = document.createElement("div");
        spine.style.cssText =
          "position:absolute;top:0;bottom:0;width:34px;pointer-events:none;" +
          (leftSide ? "right:0;background:linear-gradient(270deg,rgba(70,52,30,.20),rgba(70,52,30,0));"

        pgg.appendChild(spine);

      }

      BOOK.pgL = makePage(true);

      inner.appendChild(BOOK.pgR);

/* travel: the iris closes over any point in the world, then the page turns */
(function(){
  var f = document.getElementById("fadeout");
  window.__travel = function (href, cx3, cy3) {
    var ir = document.getElementById("iris");
    if (ir) {
      cx3 = Math.max(0, Math.min(innerWidth, cx3));
      cy3 = Math.max(0, Math.min(innerHeight, cy3));
      var rr = Math.sqrt(Math.pow(Math.max(cx3, innerWidth - cx3), 2) +
                         Math.pow(Math.max(cy3, innerHeight - cy3), 2));
      ir.style.left = cx3 + "px"; ir.style.top = cy3 + "px";
      ir.style.setProperty("--irs", (rr * 2 / 40 + 0.5).toFixed(2));
      requestAnimationFrame(function(){ ir.classList.add("go"); });
    }
    if (f) f.classList.add("on");
    setTimeout(function(){ location.href = href; }, 520);
  };
  document.querySelectorAll(".door").forEach(function(a){
    a.addEventListener("click", function(e){
      if (e.metaKey || e.ctrlKey) return;
      e.preventDefault();
      a.classList.add("leaving");
      var portal2 = document.getElementById("portal");
      if (portal2) portal2.classList.add("leaving");
      var dr = a.getBoundingClientRect();
      window.__travel(a.getAttribute("href"), dr.left + dr.width / 2, dr.top + dr.height / 2);
    });
  });
})();
