<style>
:root{
  --serif:"Fraunces",Georgia,serif;
  --sans:"Instrument Sans",-apple-system,"Segoe UI",sans-serif;
  --ink:#211d16;
  --paper:#eceade;
  --night:#e8e4da;
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{background:#16192a;color:var(--ink);font-family:var(--sans)}

/* ---------- the film ---------- */
#filmScroll{height:430vh;position:relative}
#stage{position:sticky;top:0;height:100vh;height:100svh;overflow:hidden}
#film{position:absolute;inset:0;display:block}

#theName{
  position:absolute;left:0;right:0;top:20%;text-align:center;
  font-family:var(--serif);font-weight:300;
  font-size:clamp(2.6rem,9vw,7.5rem);letter-spacing:.01em;line-height:1;
  color:var(--ink);white-space:nowrap;cursor:default;
  text-shadow:0 1px 0 rgba(255,255,255,.25);
  will-change:opacity,transform,filter;
}
#theName i{font-style:italic;font-weight:400}
@keyframes inkIn{from{clip-path:inset(-20% 100% -20% 0)}to{clip-path:inset(-20% -2% -20% 0)}}
#theName{animation:inkIn 1.4s cubic-bezier(.6,.02,.3,1) .5s backwards}
@media (prefers-reduced-motion:reduce){#theName{animation:none}}

#hint{
  position:absolute;left:50%;top:33%;transform:translateX(-50%);
  font-family:var(--serif);font-style:italic;font-size:.92rem;letter-spacing:.06em;
  color:rgba(90,80,66,.9);
  transition:opacity .4s ease;
  animation:breathe 3s ease-in-out infinite;
}
#hint::after{content:"";display:block;width:1px;height:26px;margin:6px auto 0;
  background:linear-gradient(rgba(90,80,66,.6),transparent)}
#hint.off{animation:none;opacity:0}
@keyframes breathe{0%,100%{opacity:.4}50%{opacity:.9}}

/* ---------- the doors ---------- */
#portal{
  position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  width:min(1060px,92vw);
  display:grid;grid-template-columns:repeat(4,1fr);gap:clamp(.9rem,2vw,2rem);
  opacity:0;pointer-events:none;transition:opacity .8s ease;
}
@media (max-width:980px){#portal{grid-template-columns:repeat(2,1fr)}}
@media (max-width:520px){#portal{grid-template-columns:1fr;top:52%}}
#portal.live{opacity:1;pointer-events:auto}
.door{
  width:auto;min-height:188px;
  display:flex;flex-direction:column;justify-content:center;
  text-decoration:none;text-align:center;
  padding:1.6rem 1.2rem;border-radius:3px;
  color:#e9e2d2;
  background:rgba(26,19,11,.46);
  border:1px solid rgba(224,170,96,.22);
  box-shadow:0 0 40px rgba(224,160,80,.05), inset 0 0 30px rgba(0,0,0,.3);
  backdrop-filter:blur(6px);
  transform:translateY(28px);opacity:0;
  transition:transform .8s cubic-bezier(.23,1,.32,1), opacity .8s ease,
             border-color .3s ease, box-shadow .3s ease, background .3s ease;
}
.door:hover{transform:translateY(-4px)!important}
#portal.live .door{transform:none;opacity:1}
#portal.live .door:nth-child(2){transition-delay:.12s}
#portal.live .door:nth-child(3){transition-delay:.24s}
.door:hover{border-color:rgba(224,170,96,.55);background:rgba(30,22,13,.6);box-shadow:0 0 60px rgba(224,160,80,.12), inset 0 0 30px rgba(0,0,0,.3)}

.door h2{
  font-family:var(--serif);font-weight:300;font-size:clamp(1.4rem,2.6vw,2rem);
  letter-spacing:.01em;
}
.door .peek{height:0;overflow:hidden;opacity:0;transition:height .45s cubic-bezier(.23,1,.32,1),opacity .4s ease .05s;margin-top:0}
.door:hover .peek,.door:focus-visible .peek{height:52px;opacity:1;margin-top:.7rem}
.peek .pg{width:76px;height:48px;margin:0 auto;border:1px solid rgba(224,170,96,.35);border-radius:2px;
  background:rgba(238,233,222,.07);padding:5px 6px;display:flex;flex-direction:column;gap:3px;align-items:flex-start}
.peek .ln{height:3px;border-radius:1px;background:rgba(233,226,210,.5)}
.peek .ln.a{width:60%;background:rgba(224,170,96,.75)}
.peek .ln.b{width:88%}.peek .ln.c{width:74%}.peek .ln.d{width:40%}
.peek .blk{width:100%;height:10px;border-radius:1px;background:rgba(224,170,96,.22)}
@media (hover:none){.door .peek{display:none}}
.door p{margin-top:.55rem;font-family:"Newsreader",Georgia,serif;font-style:italic;font-size:.92rem;line-height:1.5;color:rgba(233,226,210,.62)}

/* ---------- after the film ---------- */
footer{
  background:#12151f;color:rgba(232,228,218,.5);
  font-size:.72rem;letter-spacing:.06em;
  display:flex;justify-content:space-between;align-items:center;
  padding:1.1rem 6vw;
}
footer a{color:rgba(232,228,218,.75);text-decoration:none}
footer a:hover{color:#fff}
.langs{display:flex;gap:.6rem}
.langs button{background:none;border:0;cursor:pointer;font:inherit;color:rgba(232,228,218,.6);padding:.2em .1em}
.langs button:hover{color:#fff}
.langs button[aria-pressed="true"]{color:#fff;border-bottom:1px solid rgba(232,228,218,.5)}

@media (prefers-reduced-motion:reduce){
  #filmScroll{height:100vh}
  #hint{display:none}
}
@media (max-width:700px){
  #portal{align-content:center}
  .door{width:78vw;padding:1.4rem 1rem 1.2rem}
  #theName{top:34%}
}

#fadeout{position:fixed;inset:0;background:#17110a;opacity:0;pointer-events:none;transition:opacity .34s ease;z-index:90}
#fadeout.on{opacity:1}
#fadeout .runner{position:absolute;bottom:18vh;left:-60px;opacity:0}
#fadeout.on .runner{animation:runAcross .62s linear forwards;opacity:1}
@keyframes runAcross{from{left:-60px}to{left:calc(50% - 20px)}}
#fadeout .runner svg{animation:runBob .16s ease-in-out infinite alternate}
@keyframes runBob{from{transform:translateY(0)}to{transform:translateY(-4px)}}
@keyframes dawn{from{opacity:1}to{opacity:0}}
#dawn{position:fixed;inset:0;background:#17110a;pointer-events:none;z-index:92;animation:dawn .8s ease .1s forwards}
@media (prefers-reduced-motion:reduce){#dawn{display:none}}

.door:focus-visible,.langs button:focus-visible,#sndBtn:focus-visible{outline:2px solid #e0a050;outline-offset:3px}
#seasonDial{position:fixed;left:1.1rem;bottom:1.1rem;z-index:60;width:52px;height:52px;border-radius:50%;
  border:1px solid rgba(224,170,96,.35);background:rgba(20,16,10,.78);cursor:pointer;
  padding:0;transition:border-color .2s ease,transform .18s ease}
#seasonDial:hover{border-color:rgba(224,170,96,.7)}
#seasonDial:active{transform:scale(.94)}
#seasonDial .wheel{transition:transform .9s cubic-bezier(.23,1,.32,1);transform-origin:50% 50%}
#seasonDial .glyph{opacity:.28;transition:opacity .4s ease}
#seasonDial .glyph.on{opacity:1}
#seasonDial .lbl{position:absolute;left:60px;top:50%;transform:translateY(-50%);
  font-family:var(--serif);font-style:italic;font-size:.85rem;color:rgba(224,200,160,.9);
  white-space:nowrap;opacity:0;transition:opacity .3s ease;pointer-events:none;
  text-shadow:0 1px 3px rgba(10,7,4,.7)}
#seasonDial:hover .lbl,#seasonDial.fresh .lbl{opacity:1}
#sndBtn{position:fixed;right:1.1rem;bottom:1.1rem;z-index:60;width:42px;height:42px;border-radius:50%;
  border:1px solid rgba(224,170,96,.35);background:rgba(20,16,10,.78);color:#e0c9a2;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  transition:border-color .2s ease,color .2s ease}
#sndBtn:hover{border-color:rgba(224,170,96,.7);color:#f4e3c6}
#sndBtn svg{width:19px;height:19px}
</style>

<script>
/* ============================================================ THE TREE
   A scroll-scrubbed film, computed rather than filmed.

   Every leaf's flight is a pure function of scroll progress: leaf i detaches
   at its own threshold, follows a path seeded from its index, lands, and at
   the end glides to one of the three doors. Because nothing depends on wall
   time except a light idle sway, scrubbing backwards runs the film backwards:
   leaves rise from the ground and reattach. That reversibility is the
   whole trick, and it is why this is drawn live instead of played from
   frames: a frame sequence of this length would cost megabytes and still
   blur on a retina screen.

   Structure: trunk and branches are grown once with a seeded recursive
   generator and pre-rendered to an offscreen canvas per theme phase; leaves
   are particles drawn each frame; sky, haze, hills and grain are cheap
   gradients over the top. Reduced motion collapses the film to its final
   still with the doors open. */

(function () {
  "use strict";

  var canvas = document.getElementById("film");
  if (!canvas) return;
  var ctx = canvas.getContext("2d");
  var stage = document.getElementById("stage");
  var nameEl = document.getElementById("theName");
  var hintEl = document.getElementById("hint");
  var portal = document.getElementById("portal");
  var doors = portal ? [].slice.call(portal.querySelectorAll(".door")) : [];

  var reduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  var DPR = Math.min(1.5, window.devicePixelRatio || 1);

  /* eggs share this; the film reads it every frame */
  var EGG = window.__EGG = { blossom: 0, burst: null, moleRect: null, moleBurst: 0 };
  var _mon = new Date().getMonth();            // real season starts the dial
  var _d = new Date();
  var FESTIVE = (_mon === 11 && _d.getDate() >= 26) || (_mon === 0 && _d.getDate() <= 6);
  /* 0 spring · 1 summer · 2 autumn · 3 winter */
  var seasonCur = (_mon === 11 || _mon <= 1) ? 3 : _mon <= 4 ? 0 : _mon <= 7 ? 1 : 2;
  try {
    var _sv = localStorage.getItem("season");
    if (_sv !== null && +_sv >= 0 && +_sv < 4) seasonCur = +_sv;   // the tree remembers you
  } catch (e) {}
  var seasonShow = seasonCur;
  EGG.regrow = function () {
    var seed = (Math.random() * 1e9) | 0;
    rnd = mulberry(seed);
    branches.length = 0; tips.length = 0;
    var baseY = H * 0.92;
    var unit = Math.min(H, W * 1.1);
    grow(W * 0.5, baseY, -Math.PI / 2 + 0.03, unit * 0.155, unit * 0.030, 0, 0);
    renderTrunk();
    buildAntPath();
    renderRoots();
    buildLeaves();
    treeGrowT = performance.now();
  };
  EGG.setSeason = function (i) {
    seasonCur = i;
    try { localStorage.setItem("season", String(i)); } catch (e) {}
  };
  var DRAG = { held: false, px: 0, py: 0, vx: 0, vy: 0, lastX: 0, lastY: 0, lastT: 0, rot: 0 };
  EGG.grab = function (x, y) {
    if (GUY.state === "ride" || GUY.state === "rideBack" || GUY.state === "home") return false;
    DRAG.held = true; DRAG.px = x; DRAG.py = y;
    DRAG.lastX = x; DRAG.lastY = y; DRAG.lastT = performance.now();
    DRAG.vx = 0; DRAG.vy = 0;
    GUY.state = "held";
    return true;
  };
  EGG.dragTo = function (x, y) {
    if (!DRAG.held) return;
    var n2 = performance.now(), dt3 = Math.max(8, n2 - DRAG.lastT);
    DRAG.vx = DRAG.vx * 0.6 + ((x - DRAG.lastX) / dt3 * 1000) * 0.4;
    DRAG.vy = DRAG.vy * 0.6 + ((y - DRAG.lastY) / dt3 * 1000) * 0.4;
    DRAG.lastX = x; DRAG.lastY = y; DRAG.lastT = n2;
    DRAG.px = x; DRAG.py = y;
  };
  EGG.release = function () {
    if (!DRAG.held) return;
    DRAG.held = false;
    // released into the canopy: he grabs the nearest branch and hangs on
    if (DRAG.py < H * 0.62 && Math.abs(DRAG.px - W / 2) < W * 0.2 && lastP < 0.3) {
      var best = null, bd = 1e9;
      for (var ti2 = 0; ti2 < tips.length; ti2 += 4) {
        var tp2 = tips[ti2];
        var dd2 = (tp2.x - DRAG.px) * (tp2.x - DRAG.px) + (tp2.y - DRAG.py) * (tp2.y - DRAG.py);
        if (dd2 < bd) { bd = dd2; best = tp2; }
      }
      if (best) {
        GUY.hangTip = best;
        GUY.state = "hang"; GUY.t0 = performance.now() / 1000;
        return;
      }
    }
    GUY.state = "falling";
    GUY.fx = DRAG.px; GUY.fy = DRAG.py;
    GUY.fvx = clamp(DRAG.vx, -900, 900);
    GUY.fvy = clamp(DRAG.vy, -900, 900);
    DRAG.rot = 0;
  };
  EGG.dragging = function () { return DRAG.held; };
  EGG.tap = function () {
    DRAG.held = false;
    GUY.state = "wave"; GUY.t0 = performance.now() / 1000;
    GUY.mode2 = "wave";
    GUY.bubble = GUY.t0 + 2.2;
  };
  EGG.rideRequest = function () {
    if (GUY.state === "ride" || GUY.state === "rideBack" || !BIKE.present) return;
    if (GUY.state === "away" || GUY.state === "home") { GUY.state = "toBike"; GUY.x = -30; }
    else GUY.state = "toBike";
  };
  EGG.plantRequest = function () {
    if (!ACORN || !ACORN.landed || GUY.state === "ride" || GUY.state === "rideBack") return;
    GUY.targetX = ACORN.x;
    if (GUY.state === "away" || GUY.state === "home") GUY.x = -30;
    GUY.state = "toPlant";
  };
  EGG.snowRequest = function () {
    if (GUY.state === "ride" || GUY.state === "rideBack" || GUY.state === "building") return;
    if (GUY.state === "away" || GUY.state === "home") GUY.x = -30;
    GUY.state = "toSnow";
  };
  EGG.squirrelRequest = function () {
    if (SQUIRREL.state === 0) { SQUIRREL.state = 1; SQUIRREL.t0 = performance.now() / 1000; }
  };
  EGG.owlRequest = function () { OWL.on = false; };
  EGG.eclipseRequest = function () { ECLIPSE = 1; };
  EGG.catchLeaf = function (x, y) {
    if (CAUGHT) return false;
    for (var i = 0; i < N; i++) {
      var L2 = LEAVES[i];
      var f2 = (lastP - L2.detach) / L2.dur;
      if (f2 <= 0.05 || f2 >= 0.95) continue;
      // where is it right now? cheap re-derivation of the draw position
      var fe2 = ease(Math.max(0, Math.min(1, f2)));
      var lx = lerp(L2.ax, L2.gx, fe2 * 0.55) + L2.driftA * 90 * fe2;
      var ly = lerp(L2.ay, L2.gy, f2 * f2 * (3 - 2 * f2));
      if ((lx - x) * (lx - x) + (ly - y) * (ly - y) < 500) {
        CAUGHT = { i: i, t0: performance.now() / 1000, x: lx, y: ly };
        L2.detach = 9;   // it leaves the film; it is his now
        return true;
      }
    }

    if (owlNight > 0.5 && p < 0.8 && !OWL.on && (t % 30) < 0.05) {
      OWL.on = true; OWL.t0 = t;
      OWL.tip = tips[(tips.length * 0.62) | 0];
    }
    if (OWL.on && OWL.tip) {
      var ox = OWL.tip.x, oy = OWL.tip.y - 8;
      ctx.fillStyle = "rgba(52,42,32,.95)";
      ctx.beginPath(); ctx.ellipse(ox, oy, 5.4, 7, 0, 0, 6.284); ctx.fill();
      ctx.beginPath(); ctx.arc(ox, oy - 7, 4.2, 0, 6.284); ctx.fill();
      var blink = (t * 0.7) % 4 < 3.82;
      ctx.fillStyle = blink ? "#e8c860" : "#342a20";
      ctx.beginPath(); ctx.arc(ox - 1.8, oy - 7.6, 1.1, 0, 6.284); ctx.fill();
      ctx.beginPath(); ctx.arc(ox + 1.8, oy - 7.6, 1.1, 0, 6.284); ctx.fill();
      EGG.owlRect = { x: ox - 10, y: oy - 16, w: 20, h: 26 };
      if (owlNight < 0.3) { OWL.on = false; EGG.owlRect = null; }
    } else EGG.owlRect = null;

    /* a shooting star, rarely, for the patient */
    if (owlNight > 0.5 && t - STAR.t0 > 34 && ((t * 7) % 13) < 0.03) {
      STAR.t0 = t; STAR.x = W * (0.2 + (t % 5) / 10); STAR.y = H * 0.12; STAR.wished = 0;
    }
    var stp = (t - STAR.t0) / 0.8;
    if (stp > 0 && stp < 1) {
      var sx5 = STAR.x + stp * 200, sy5 = STAR.y + stp * 70;
      var tr2 = ctx.createLinearGradient(sx5 - 60, sy5 - 21, sx5, sy5);
      tr2.addColorStop(0, "rgba(240,238,224,0)");
      tr2.addColorStop(1, "rgba(240,238,224," + (0.9 * owlNight) + ")");
      ctx.strokeStyle = tr2; ctx.lineWidth = 1.6;
      ctx.beginPath(); ctx.moveTo(sx5 - 60, sy5 - 21); ctx.lineTo(sx5, sy5); ctx.stroke();
      EGG.starLive = true;
      if (GUY.state === "wave" || GUY.state === "stand") GUY.lookUp = t + 2;
    } else EGG.starLive = false;
    if (STAR.wished > 0 && t - STAR.wished < 3) {
      ctx.fillStyle = "rgba(224,200,160," + (1 - (t - STAR.wished) / 3) + ")";
      ctx.font = "italic 15px Georgia";
      ctx.fillText("wish received", W - 150, H - 30);
    }

    /* eclipse: the moon answers a click */
    if (ECLIPSE > 0) {
      ECLIPSE -= 0.005;
      ctx.fillStyle = "rgba(6,5,8," + (0.5 * Math.min(1, ECLIPSE * 3)) + ")";
      ctx.fillRect(0, 0, W, H);
    }
    EGG.moonRect = (gNightIdle > 0.4 && p < 0.3) ? { x: W * 0.82 - 26, y: H * 0.16 - 26, w: 52, h: 52 } : null;

    /* birthday: the tree celebrates its planter */
    if (BIRTHDAY && p < 0.3) {
      for (var cf = 0; cf < 18; cf++) {
        var cfx = ((cf * 197.3 + t * (30 + cf % 5 * 14)) % (W + 20)) - 10;
        var cfy = ((cf * 83.7 + t * (46 + cf % 7 * 16)) % (H * 0.8));
        ctx.fillStyle = ["#e0b050", "#b03a2a", "#7da05f", "#e8b4c8"][cf % 4];
        ctx.save(); ctx.translate(cfx, cfy); ctx.rotate(t * 3 + cf);
        ctx.fillRect(-2.4, -1.2, 4.8, 2.4); ctx.restore();
      }
    }

    /* the man: his life runs whether you watch or not; only the drawing fades */
    {
      var gy4 = guyGround();
      var guyVis = groundVis;
      ctx.globalAlpha = guyVis;
      if (GUY.state !== "away" && GUY.state !== "home" && GUY.state !== "held" && GUY.state !== "falling")
        groundShadow(GUY.x, 22, 0.20);
      if (GUY.outfit === null) GUY.outfit = seasonCur;
      var wantsChange = GUY.outfit !== seasonCur;
      var rainingHere = RAIN.on > 0.3;
      GUY.prop = null;
      if (rainingHere && !GUY.wet && GUY.state !== "enterHouse" && GUY.state !== "home") GUY.prop = "umbrella";
      if (RAIN.on < 0.1) GUY.wet = false;
      if (ECLIPSE > 0.1) GUY.prop = "lantern";
      if (BIRTHDAY) GUY.prop = GUY.prop || "party";

      // watchdog: no state may hold him hostage
      if (GUY.state !== "away" && GUY.state !== "home" && GUY.state !== "held") {
        if (!GUY.stateT || GUY.lastState !== GUY.state) { GUY.stateT = t; GUY.lastState = GUY.state; }
        else if (t - GUY.stateT > 26) { GUY.state = "walkout"; GUY.stateT = t; }
      }
      var stillFor = (performance.now() - idleSince) / 1000;
      if (stillFor > 120 && gNightIdle < 0.4 &&
          (GUY.state === "wave" || GUY.state === "stand" || GUY.state === "walkout" || GUY.state === "walkin")) {
        GUY.state = "goDoze";
      }
      if (GUY.state === "away" && t > GUY.next && gNightIdle < 0.5) {
        GUY.state = "walkin"; GUY.x = -30;
        var windy2 = Math.abs(wind) > 0.45 && gust > 0.2;
        GUY.mode2 = windy2 ? "kite" : "wave";
        GUY.targetX = W * (0.30 + (t % 7) / 35);
      }
      if (gNightIdle > 0.6 && GUY.state !== "away" && GUY.state !== "home" &&
          GUY.state !== "enterHouse" && GUY.state !== "ride") {
        GUY.state = "goHome";                     // the night sends him in
      }
      if (wantsChange && (GUY.state === "wave" || GUY.state === "stand")) GUY.state = "goHome";

      var spd = 0.0165;
      if (!GUY.lastT) GUY.lastT = t;
      var dt2 = Math.min(0.05, t - GUY.lastT);
      GUY.lastT = t;
      spd = dt2;
      switch (GUY.state) {
        case "walkin":
          GUY.x += 42 * spd;
          if (GUY.x >= GUY.targetX) { GUY.state = "wave"; GUY.t0 = t; GUY.bubble = t + 2.6; }
          drawGuy(GUY.x, gy4, t, "walk", GUY.outfit, GUY.prop);
          break;
        case "wave":
          drawGuy(GUY.x, gy4, t, GUY.mode2 === "kite" ? "stand" : "wave", GUY.outfit,
                  GUY.mode2 === "kite" ? "kite" : GUY.prop);
          if (t > GUY.whistleAt && GUY.mode2 !== "kite" && RAIN.on < 0.2) {
            GUY.whistleAt = t + 24 + (t % 11);
            GUY.notes = t + 1.8;
            if (window.__whistle) window.__whistle();
          }
          if (GUY.bubble > t && GUY.mode2 !== "kite") drawBubble(GUY.x, gy4 - 66, bubbleText());
          if (t - GUY.t0 > (GUY.mode2 === "kite" ? 7 : 3.4)) GUY.state = "walkout";
          break;
        case "stand":
          drawGuy(GUY.x, gy4, t, "stand", GUY.outfit, GUY.prop);
          if (t - GUY.t0 > 2) GUY.state = "walkout";
          break;
        case "walkout":
          GUY.x += 46 * spd;
          drawGuy(GUY.x, gy4, t, "walk", GUY.outfit, GUY.prop);
          if (GUY.x > W + 40) { GUY.state = "away"; GUY.next = t + 10 + (t % 9); }
          break;
        case "toBike":
          GUY.x += (BIKE.x > GUY.x ? 1 : -1) * 78 * spd;
          drawGuy(GUY.x, gy4, t, "walk", GUY.outfit, GUY.prop);
          if (BIKE.present && Math.abs(GUY.x - BIKE.x) < 6) {
            GUY.state = "ride"; GUY.t0 = t;
            BIKE.present = false;               // it leaves with him, obviously
          } else if (!BIKE.present) GUY.state = "walkout";
          break;
        case "ride": {
          var rx = BIKE.x + (t - GUY.t0) * 130;
          var roll = (t - GUY.t0) * 12;
          drawBike(rx, gy4 - 10, 0, roll, 1);
          drawGuy(rx - 2, gy4, t, "ride", GUY.outfit, null);
          if (rx > W + 60) {
            GUY.state = "away"; GUY.next = t + 26;
            BIKE.gone = t;
          }
          break;
        }
        case "rideBack": {
          var rbx = W + 40 - (t - GUY.t0) * 120;
          drawBike(rbx, gy4 - 10, 0, -(t - GUY.t0) * 11, 1);
          drawGuy(rbx + 2, gy4, t, "ride", GUY.outfit, null);
          if (rbx <= BIKE.x) {
            BIKE.present = true; BIKE.back = false;
            GUY.state = "stand"; GUY.t0 = t; GUY.x = rbx - 14;
          }

        }
        case "held":
          ctx.globalAlpha = 1;
          GUY.x = DRAG.px;
          ctx.save();
          ctx.translate(0, 0);
          drawGuy(DRAG.px, DRAG.py + 42, t, "held", GUY.outfit, null);
          ctx.restore();
          break;
        case "falling": {
          ctx.globalAlpha = 1;
          GUY.fvy += 2400 * dt2;
          GUY.fx += GUY.fvx * dt2;
          GUY.fvx *= (1 - 0.4 * dt2);
          GUY.fy += GUY.fvy * dt2;
          DRAG.rot += GUY.fvx * dt2 * 0.004;
          if (GUY.fx < 14) { GUY.fx = 14; GUY.fvx = Math.abs(GUY.fvx) * 0.5; }
          if (GUY.fx > W - 14) { GUY.fx = W - 14; GUY.fvx = -Math.abs(GUY.fvx) * 0.5; }
          var landY = gy4;
          if (GUY.fy >= landY) {
            GUY.fy = landY;
            if (Math.abs(GUY.fvy) > 520) {
              GUY.fvy = -Math.abs(GUY.fvy) * 0.38;          // a real bounce
              GUY.fvx *= 0.7;
              if (window.__thud) window.__thud();
            } else if (Math.abs(GUY.fvy) > 210) {
              GUY.state = "splat"; GUY.t0 = t; GUY.x = GUY.fx;
              if (window.__thud) window.__thud();
              if (sw(3) > 0.5) puff(GUY.fx, gy4, "snow");
              else if (p > 0.42) puff(GUY.fx, gy4, "leaves");
            } else {
              GUY.state = "stand"; GUY.t0 = t; GUY.x = GUY.fx;
            }
            // dropped onto the mole's hill: the mole objects
            var mR = EGG.moleRect;
            if (mR && GUY.fx > mR.x - 20 && GUY.fx < mR.x + mR.w + 20) {
              GUY.fvx = 260; GUY.state = "splat"; GUY.t0 = t; GUY.x = GUY.fx + 26;

          ctx.translate(GUY.fx, GUY.fy);
          ctx.rotate(clamp(DRAG.rot, -0.9, 0.9));

          break;
        case "getup":
          drawGuy(GUY.x, gy4, t, "crouch", GUY.outfit, null);
          if (t - GUY.t0 > 0.7) { GUY.state = "stand"; GUY.t0 = t; GUY.bubble = 0; }
          break;
        case "goDoze":
          GUY.x += (houseX() - 38 > GUY.x ? 1 : -1) * 46 * spd;
          drawGuy(GUY.x, gy4, t, "walk", GUY.outfit, GUY.prop);
          if (Math.abs(GUY.x - (houseX() - 38)) < 6) { GUY.state = "doze"; GUY.t0 = t; }
          break;
        case "doze":
          // seated on the doorstep, chin down
          drawGuy(houseX() - 38, gy4 - 4, t, "crouch", GUY.outfit, null);
          if (stillFor < 3) { GUY.state = "stand"; GUY.t0 = t; }
          break;
        case "hang":
          drawGuy(GUY.hangTip.x, GUY.hangTip.y + 46 + Math.sin(t * 2.2) * 5, t, "held", GUY.outfit, null);
          if (t - GUY.t0 > 2.2) {

          }
          break;
        case "goHome":
          GUY.x += (houseX() - 16 - GUY.x) * 0.02 + 40 * spd * (GUY.x < houseX() - 18 ? 1 : 0);
          drawGuy(GUY.x, gy4, t, "walk", GUY.outfit, GUY.prop);
          if (GUY.x >= houseX() - 30) { GUY.state = "enterHouse"; GUY.t0 = t; }

        case "enterHouse":
          drawGuy(lerp(GUY.x, houseX() - 8, (t - GUY.t0) / 0.7), gy4, t, "walk", GUY.outfit, null);

          if (t - GUY.t0 > 0.7) { GUY.state = "wave"; GUY.t0 = t; GUY.mode2 = "wave"; }

          drawGuy(GUY.x, gy4, t, "walk", GUY.outfit, GUY.prop);
          if (Math.abs(GUY.x - GUY.targetX) < 8) { GUY.state = "planting"; GUY.t0 = t; }

          drawGuy(GUY.targetX - 14, gy4, t, "crouch", GUY.outfit, null);

            GUY.state = "stand"; GUY.t0 = t;

      }

        ctx.font = "13px Georgia";
        ctx.fillText("\u266a", GUY.x + 12, gy4 - 70 - (1.8 - (GUY.notes - t)) * 14);
        ctx.fillText("\u266b", GUY.x + 24, gy4 - 60 - (1.8 - (GUY.notes - t)) * 10);

      if (GUY.state === "doze") {
        var zt = (t % 2.4) / 2.4;
        ctx.fillStyle = "rgba(60,48,36," + (0.65 * (1 - zt)) + ")";
        ctx.font = "italic " + (11 + zt * 6) + "px Georgia";
        ctx.fillText("z", houseX() - 44 + zt * 12, gy4 - 62 - zt * 22);

      ctx.globalAlpha = 1;
      EGG.guyRect = (guyVis > 0.3 && GUY.state !== "away" && GUY.state !== "ride" &&
                     GUY.state !== "rideBack" && GUY.state !== "home" &&
                     GUY.state !== "falling" && GUY.state !== "held")
        ? { x: GUY.x - 18, y: gy4 - 62, w: 36, h: 64 } : null;
    }

    /* a caught leaf drifts to his hand, and he shows it off */
    if (CAUGHT) {
      var ct2 = t - CAUGHT.t0;
      if (GUY.state === "away" || GUY.state === "home") { CAUGHT = null; }
      else if (ct2 < 1.2) {
        var tx2 = GUY.x + 12, ty2 = guyGround() - 40;
        var cx2 = lerp(CAUGHT.x, tx2, smooth(ct2 / 1.2));
        var cy2 = lerp(CAUGHT.y, ty2, smooth(ct2 / 1.2));
        ctx.fillStyle = "#c8842e";
        ctx.save(); ctx.translate(cx2, cy2); ctx.rotate(ct2 * 5);
        ctx.beginPath(); ctx.moveTo(0, -5); ctx.quadraticCurveTo(3.4, -1, 0, 6);
        ctx.quadraticCurveTo(-3.4, -1, 0, -5); ctx.fill(); ctx.restore();
      } else if (ct2 < 3.2) {
        GUY.lookUp = t + 0.1;
        ctx.fillStyle = "#c8842e";
        ctx.save(); ctx.translate(GUY.x + 13, guyGround() - 54);
        ctx.rotate(Math.sin(t * 3) * 0.2);
        ctx.beginPath(); ctx.moveTo(0, -5); ctx.quadraticCurveTo(3.4, -1, 0, 6);
        ctx.quadraticCurveTo(-3.4, -1, 0, -5); ctx.fill(); ctx.restore();

    for (var pu = puffs.length - 1; pu >= 0; pu--) {

      var pa2 = t - P2.t0;
      if (pa2 > 1.4) { puffs.splice(pu, 1); continue; }
      var px4 = P2.x + P2.vx * pa2;
      var py4 = P2.y + P2.vy * pa2 + 320 * pa2 * pa2;
      var fade = 1 - pa2 / 1.4;
      if (P2.kind === "snow") {
        ctx.fillStyle = "rgba(240,242,246," + (0.8 * fade) + ")";
        ctx.beginPath(); ctx.arc(px4, py4, 2 + pa2 * 2, 0, 6.284); ctx.fill();
      } else {
        ctx.fillStyle = "rgba(" + (170 + (pu % 3) * 20) + "," + (100 + (pu % 4) * 12) + ",40," + (0.85 * fade) + ")";
        ctx.save(); ctx.translate(px4, py4); ctx.rotate(pa2 * 6 + P2.ph);
        ctx.beginPath(); ctx.moveTo(0, -3.4); ctx.quadraticCurveTo(2.4, -0.6, 0, 4);
        ctx.quadraticCurveTo(-2.4, -0.6, 0, -3.4); ctx.fill(); ctx.restore();
      }
    }

    /* the bird: arrives now and then while the canopy is full */
    if (p < 0.18) {
      if (bird.state === 0 && t > bird.next) {
        bird.state = 1; bird.t0 = t;
        perch = tips[(tips.length * 0.3 | 0)];
      }
      if (bird.state === 1 && perch) {
        var bt = (t - bird.t0) / 3.2;
        if (bt >= 1) { bird.state = 2; bird.t0 = t; }
        var bx = lerp(-40, perch.x, smooth(bt));
        var by = lerp(H * 0.25, perch.y - 6, smooth(bt)) - Math.sin(bt * 3.14) * 60;
        drawBird(bx, by, t, true);
      } else if (bird.state === 2 && perch) {
        var nearGuy = (GUY.state === "wave" || GUY.state === "stand") && Math.abs(GUY.x - perch.x) < 46;
        if (nearGuy && t - bird.t0 > 1.2) { bird.state = 4; bird.t0 = t; }
        var hop = Math.abs(Math.sin(t * 3)) * 1.5;
        drawBird(perch.x, perch.y - 6 - hop, t, false);
        if (t - bird.t0 > 4.5 && bird.state === 2) { bird.state = 3; bird.t0 = t; }
      } else if (bird.state === 4) {
        // it likes him: a landing on the curls
        var bt4 = Math.min(1, (t - bird.t0) / 1.1);
        var hx4 = GUY.x + 2, hy4 = gy4 !== undefined ? 0 : 0;
        var headY = guyGround() - 58;
        drawBird(lerp(perch.x, hx4, smooth(bt4)),
                 lerp(perch.y - 6, headY, smooth(bt4)) - Math.sin(bt4 * 3.14) * 24, t, bt4 < 1);
        if (t - bird.t0 > 4.4) { bird.state = 3; perch = { x: GUY.x, y: headY }; bird.t0 = t; }
        if (GUY.state !== "wave" && GUY.state !== "stand") { bird.state = 3; bird.t0 = t; }
      } else if (bird.state === 3 && perch) {
        var lt = (t - bird.t0) / 2.6;
        if (lt >= 1) { bird.state = 0; bird.next = t + 34 + (t % 17); }
        drawBird(lerp(perch.x, W + 50, smooth(lt)),
                 lerp(perch.y - 6, H * 0.12, smooth(lt)) - Math.sin(lt * 3.14) * 40, t, true);
      }
    } else if (bird.state !== 0) { bird.state = 0; bird.next = t + 20; }

    /* a leaf shadow trails the cursor over the canopy */
    if (pointer.x > 0 && p < 0.25 &&
        pointer.y > H * 0.30 && pointer.y < H * 0.75 &&
        Math.abs(pointer.x - W / 2) < W * 0.24) {
      ctx.save();
      ctx.translate(pointer.x + 12, pointer.y + 14);
      ctx.rotate(Math.sin(t * 2) * 0.4);
      ctx.globalAlpha = 0.45;
      ctx.fillStyle = "#5f8a4e";
      ctx.beginPath(); ctx.moveTo(0, -5); ctx.quadraticCurveTo(3.6, -1, 0, 6);
      ctx.quadraticCurveTo(-3.6, -1, 0, -5); ctx.fill();
      ctx.restore();
      ctx.globalAlpha = 1;
    }

    /* the idle moon */
    if (gNightIdle > 0.25 && p < 0.3 && moonSprite) {
      ctx.globalAlpha = (gNightIdle - 0.25) / 0.75;
      ctx.drawImage(moonSprite, W * 0.82 - 100, H * 0.16 - 100);
      ctx.globalAlpha = 1;
    }

    /* fireflies: ten still seconds in the dusk, and they come to the cursor */
    var nightish = (p > 0.45 && p < 0.92 && descend < 0.6) || (gNightIdle > 0.5 && p < 0.25);
    if (nightish && performance.now() - idleSince > 10000) {
      if (flies.length === 0) {
        for (var fl = 0; fl < 12; fl++) {
          flies.push({ x: Math.random() * W, y: Math.random() * H * 0.7,
                       vx: 0, vy: 0, ph: Math.random() * 6.28 });
        }
      }
      flies.forEach(function (F) {
        var tx = pointer.x > 0 ? pointer.x : W / 2;
        var ty = pointer.y > 0 ? pointer.y : H * 0.4;
        F.vx += ((tx - F.x) * 0.0004 + Math.sin(t * 1.3 + F.ph) * 0.02);
        F.vy += ((ty - F.y) * 0.0004 + Math.cos(t * 1.1 + F.ph) * 0.02);
        F.vx *= 0.96; F.vy *= 0.96;
        F.x += F.vx; F.y += F.vy;
        var glow = 0.35 + 0.65 * Math.abs(Math.sin(t * 1.7 + F.ph));
        ctx.globalAlpha = glow;
        ctx.drawImage(flySprite, F.x - 12, F.y - 12);
        ctx.globalAlpha = 1;
      });
    } else if (flies.length && !nightish) flies.length = 0;

    /* the K burst, when the name has been clicked five times */
    if (EGG.burst) {
      var B = EGG.burst, bp = (t - B.t0) / 2.6;
      if (nameEl) nameEl.style.opacity = bp < 0.9 ? 0 : "";
      if (bp >= 1) { EGG.burst = null; if (nameEl) nameEl.style.opacity = ""; }
      else {
        B.pts.forEach(function (P, i) {
          var e2 = smooth(Math.min(1, bp * 2.2 - P.d * 0.4));
          var fade = bp > 0.75 ? (1 - bp) / 0.25 : 1;
          var px2 = lerp(P.sx, P.tx, e2), py2 = lerp(P.sy, P.ty, e2);
          ctx.fillStyle = "rgba(" + P.c + "," + (0.9 * fade) + ")";
          ctx.save(); ctx.translate(px2, py2); ctx.rotate(bp * P.r);
          ctx.beginPath(); ctx.moveTo(0, -4); ctx.quadraticCurveTo(2.8, -0.8, 0, 4);
          ctx.quadraticCurveTo(-2.8, -0.8, 0, -4); ctx.fill(); ctx.restore();
        });
      }
    }

    /* petals while the 3523 spring holds */
    var petalAmt = Math.max(EGG.blossom, sw(0) * 0.55 * (p < 0.35 ? 1 : 0));
    if (petalAmt > 0.05) {
      ctx.fillStyle = "rgba(242,210,221," + (0.8 * petalAmt) + ")";
      for (var pt2 = 0; pt2 < 26; pt2++) {
        var pxx = ((pt2 * 193.7 + t * (18 + pt2 % 5 * 6)) % (W + 30)) - 15;
        var pyy = ((pt2 * 97.3 + t * (34 + pt2 % 7 * 8)) % (H + 30)) - 15;
        ctx.save(); ctx.translate(pxx, pyy); ctx.rotate(t * 2 + pt2);
        ctx.beginPath(); ctx.ellipse(0, 0, 2.6, 1.6, 0, 0, 6.284); ctx.fill(); ctx.restore();

  function bubbleText() {
    var l2 = document.documentElement.getAttribute("lang");
    return l2 === "tr" ? "Selam, ben Kerem." : l2 === "de" ? "Hi, ich bin Kerem." : "Hi, I\u2019m Kerem.";
  }
  function drawBubble(x, y, text) {
    ctx.save();
    ctx.font = "italic 13px Georgia";
    var w2 = ctx.measureText(text).width + 16;
    ctx.fillStyle = "rgba(246,242,232,.94)";
    ctx.strokeStyle = "rgba(60,48,36,.35)";
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.roundRect(x - w2 / 2, y - 24, w2, 22, 6);
    ctx.fill(); ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(x - 4, y - 3); ctx.lineTo(x + 4, y - 3); ctx.lineTo(x, y + 4); ctx.closePath();
    ctx.fill();
    ctx.fillStyle = "#33291e";
    ctx.fillText(text, x - w2 / 2 + 8, y - 9);
    ctx.restore();
  }

  function drawBird(x, y, t, flying) {
    ctx.save();
    ctx.translate(x, y);
    ctx.fillStyle = "#2a2019";
    ctx.beginPath(); ctx.ellipse(0, 0, 7, 4.5, -0.15, 0, 6.284); ctx.fill();   // body
    ctx.beginPath(); ctx.arc(6, -3, 3, 0, 6.284); ctx.fill();                  // head
    ctx.fillStyle = "#c98a3c";
    ctx.beginPath(); ctx.moveTo(8.6, -3.4); ctx.lineTo(12, -2.6); ctx.lineTo(8.6, -1.8); ctx.fill();  // beak
    ctx.fillStyle = "#2a2019";
    ctx.beginPath(); ctx.moveTo(-6, -1); ctx.lineTo(-13, 1.5); ctx.lineTo(-6, 2.4); ctx.fill();       // tail
    if (flying) {
      var w2 = Math.sin(t * 18) * 8;
      ctx.beginPath(); ctx.moveTo(-1, -1);
      ctx.quadraticCurveTo(-3, -8 - w2, -10, -6 - w2);
      ctx.quadraticCurveTo(-4, -1, -1, 0); ctx.fill();
    } else {
      ctx.beginPath(); ctx.ellipse(-1, -0.5, 4.5, 2.6, -0.3, 0, 6.284); ctx.fill();
    }
    ctx.restore();
  }

  /* ------------------------------------------------------ scroll wiring */
  var film = document.getElementById("filmScroll");
  var progress = 0;

  function readScroll() {
    var r = film.getBoundingClientRect();
    var span = r.height - window.innerHeight;
    progress = span > 0 ? clamp(-r.top / span, 0, 1) : 1;
  }

  function placeHint() {
    if (!hintEl || !nameEl) return;
    var nr = nameEl.getBoundingClientRect();
    var sr2 = stage.getBoundingClientRect();
    hintEl.style.top = (nr.bottom - sr2.top + 22) + "px";
  }
  window.addEventListener("resize", placeHint);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(placeHint);
  setTimeout(placeHint, 60);

  function ui(p) {
    if (nameEl) {
      var fade = smooth((p - 0.07) / 0.18);
      nameEl.style.color = gNightIdle > 0.35 ? "#e8e1d0" : "";
      nameEl.style.opacity = 1 - fade;
      nameEl.style.transform = "translateY(" + (-fade * 40) + "px)";
      nameEl.style.filter = "blur(" + fade * 6 + "px)";
    }
    if (hintEl) hintEl.classList.toggle("off", p > 0.03);
    if (portal) {
      var on = p > 0.87;
      portal.classList.toggle("live", on);
    }
    document.documentElement.style.setProperty("--filmp", p.toFixed(3));
  }

  var raf = null;
  var shown = 0;   // the displayed progress eases toward the scroll target
  var perfFrames = 0, perfT0 = 0, perfChecked = false;
  function loop(now) {
    if (!perfChecked) {
      if (!perfT0) perfT0 = now;
      perfFrames++;
      if (now - perfT0 > 3000) {
        perfChecked = true;
        if (perfFrames / 3 < 38 && N > 1200) {   // struggling: thin the canopy, keep the film
          N = (N * 0.6) | 0;
          LEAVES.length = N;
        }
      }
    }
    seasonShow += (seasonCur - seasonShow) * 0.045;
    var wantNight = FORCE_NIGHT || (progress < 0.25 && (performance.now() - idleSince > 12000));
    gNightIdle += ((wantNight ? 1 : 0) - gNightIdle) * (wantNight ? 0.012 : 0.05);
    shown += (progress - shown) * 0.16;
    if (Math.abs(progress - shown) < 0.0004) shown = progress;
    draw(shown, now);
    ui(shown);
    raf = requestAnimationFrame(loop);
  }

  if (reduced) {
    // the final still, doors open, no film
    resize();
    readScroll();
    draw(1, 0); ui(1);
    if (portal) portal.classList.add("live");
    window.addEventListener("resize", function () { resize(); draw(1, 0); });
  } else {
    window.addEventListener("scroll", readScroll, { passive: true });
    window.addEventListener("resize", resize);
    var autoPlay = false, autoRaf = null;
    function autoStep() {
      if (!autoPlay) return;
      window.scrollBy(0, Math.max(2, window.innerHeight * 0.004));
      if (progress >= 1) autoPlay = false;
      else autoRaf = requestAnimationFrame(autoStep);
    }
    window.addEventListener("keydown", function(e){
      if (e.target !== document.body || e.metaKey || e.ctrlKey || e.altKey) return;
      if (e.key === "ArrowRight") { e.preventDefault(); window.scrollBy({ top: window.innerHeight * 0.35, behavior: "smooth" }); }
      else if (e.key === "ArrowLeft") { e.preventDefault(); window.scrollBy({ top: -window.innerHeight * 0.35, behavior: "smooth" }); }
      else if (e.key === " ") {
        e.preventDefault();
        autoPlay = !autoPlay;
        if (autoPlay) autoRaf = requestAnimationFrame(autoStep);
      }
    });
    window.addEventListener("pageshow", function(e){
      if (e.persisted) { resize(); readScroll(); shown = progress; }
    });
    resize();
    readScroll();
    raf = requestAnimationFrame(loop);
    // spare the battery when the film is off-screen
    new IntersectionObserver(function (es) {
      if (es[0].isIntersecting) { if (!raf) raf = requestAnimationFrame(loop); }
      else if (raf) { cancelAnimationFrame(raf); raf = null; }
    }).observe(stage);
  }
})();

(function(){

  var ROT = [90, 0, -90, -180];      // which glyph sits at three o'clock? bring active to top
  var turns = 0, cur = EGG.getSeason();
  function paint() {
    wheel.style.transform = "rotate(" + (-90 * cur + turns * -360) + "deg)";
    wheel.querySelectorAll(".glyph").forEach(function(g, i){
      g.classList.toggle("on", i === cur);
      // counter-rotate the glyphs so they stay upright

    });

/* sound: wind, leaves and night crickets, synthesised, off until asked */
(function(){
  var btn = document.getElementById("sndBtn");
  if (!btn) return;
  var on = false, actx = null, wind = null, windGain = null, cricketTimer = null;

  function makeNoise(ac) {
    var len = ac.sampleRate * 2;
    var buf = ac.createBuffer(1, len, ac.sampleRate);
    var d = buf.getChannelData(0);
    var last = 0;
    for (var i = 0; i < len; i++) {                 // brown-ish noise = wind
      last = (last + (Math.random() * 2 - 1) * 0.03) * 0.985;
      d[i] = last * 4;
    }
    var src = ac.createBufferSource();
    src.buffer = buf; src.loop = true;
    return src;
  }
  function chirp(ac, when) {
    // a cricket, not a geiger counter: low, soft, rounded edges
    var o = ac.createOscillator(), g = ac.createGain();
    o.type = "sine"; o.frequency.value = 2300 + Math.random() * 300;
    g.gain.setValueAtTime(0, when);
    for (var k = 0; k < 3; k++) {
      var s2 = when + k * 0.09;
      g.gain.linearRampToValueAtTime(0.006, s2 + 0.02);
      g.gain.linearRampToValueAtTime(0, s2 + 0.07);
    }
    o.connect(g); g.connect(ac.destination);
    o.start(when); o.stop(when + 0.5);
  }
  function start() {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    actx.resume();
    var lp = actx.createBiquadFilter();
    lp.type = "lowpass"; lp.frequency.value = 420; lp.Q.value = 0.4;
    windGain = actx.createGain(); windGain.gain.value = 0.05;
    wind = makeNoise(actx);
    wind.connect(lp); lp.connect(windGain); windGain.connect(actx.destination);
    wind.start();
    // wind follows the film; crickets only at dusk
    cricketTimer = setInterval(function(){
      if (!actx) return;
      var p = parseFloat(getComputedStyle(document.documentElement).getPropertyValue("--filmp")) || 0;
      if (windGain) windGain.gain.value = 0.03 + p * 0.06 * (p < 0.7 ? 1 : (1 - p) * 3);
      if (p > 0.45 && p < 0.9 && Math.random() < 0.5) chirp(actx, actx.currentTime + Math.random() * 1.5);
    }, 1800);
  }
  window.__whistle = function(){
    if (!actx || !on) return;
    [[0, 880], [0.22, 1046], [0.44, 988]].forEach(function(nn){
      var o = actx.createOscillator(), g = actx.createGain();
      o.type = "sine"; o.frequency.value = nn[1];
      g.gain.setValueAtTime(0.0001, actx.currentTime + nn[0]);
      g.gain.linearRampToValueAtTime(0.018, actx.currentTime + nn[0] + 0.05);
      g.gain.linearRampToValueAtTime(0.0001, actx.currentTime + nn[0] + 0.2);
      o.connect(g); g.connect(actx.destination);
      o.start(actx.currentTime + nn[0]); o.stop(actx.currentTime + nn[0] + 0.25);
    });
  };
  window.__thud = function(){
    if (!actx || !on) return;
    var o = actx.createOscillator(), g = actx.createGain();
    o.type = "sine";
    o.frequency.setValueAtTime(110, actx.currentTime);
    o.frequency.exponentialRampToValueAtTime(48, actx.currentTime + 0.16);
    g.gain.setValueAtTime(0.11, actx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, actx.currentTime + 0.2);
    o.connect(g); g.connect(actx.destination);
    o.start(); o.stop(actx.currentTime + 0.25);
  };
  window.__hoot = function(){
    if (!actx || !on) return;
    [0, 0.28].forEach(function(d){
      var o = actx.createOscillator(), g = actx.createGain();
      o.type = "sine"; o.frequency.setValueAtTime(392, actx.currentTime + d);
      o.frequency.exponentialRampToValueAtTime(300, actx.currentTime + d + 0.22);
      g.gain.setValueAtTime(0.05, actx.currentTime + d);
      g.gain.exponentialRampToValueAtTime(0.001, actx.currentTime + d + 0.3);
      o.connect(g); g.connect(actx.destination);
      o.start(actx.currentTime + d); o.stop(actx.currentTime + d + 0.35);
    });
  };
  window.__bell = function(){
    if (!actx || !on) return;
    [0, 0.12].forEach(function(d){
      var o = actx.createOscillator(), g = actx.createGain();
      o.type = "sine"; o.frequency.value = 1244;
      g.gain.setValueAtTime(0.035, actx.currentTime + d);
      g.gain.exponentialRampToValueAtTime(0.001, actx.currentTime + d + 0.25);
      o.connect(g); g.connect(actx.destination);
      o.start(actx.currentTime + d); o.stop(actx.currentTime + d + 0.3);
    });
  };
  function stop() {
    if (cricketTimer) clearInterval(cricketTimer);
    if (wind) { try { wind.stop(); } catch(e){} wind = null; }
    if (actx) actx.suspend();
  }
  function paint() {
    document.getElementById("sndOff").style.display = on ? "none" : "";
    document.getElementById("sndOn").style.display = on ? "" : "none";
    btn.setAttribute("aria-pressed", on ? "true" : "false");
  }
  btn.addEventListener("click", function(){
    on = !on;
    if (on) start(); else stop();
    paint();
    try { localStorage.setItem("snd", on ? "1" : "0"); } catch(e){}
  });
})();
