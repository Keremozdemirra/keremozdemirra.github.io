    g.lineTo(w * 0.66, gy + 7.6);
    g.quadraticCurveTo(w * 0.43, gy + 8.4, w * 0.21, gy + 7.8);
    g.quadraticCurveTo(w * 0.11, gy + 7.4, 0, gy + 7.2);
    g.closePath(); g.fill();
    g.fillStyle = "rgba(140,112,74,.20)";
    g.beginPath(); g.ellipse(w * 0.31, gy + 6, 12, 2.8, 0, 0, 6.284); g.fill();
    g.beginPath(); g.ellipse(w * 0.52, gy + 6, 9, 2.6, 0, 0, 6.284); g.fill();
    // meadow grass thickens toward the seam
    var seamGrass2 = winter ? "rgba(150,148,132,.5)" : (autumn ? "rgba(150,116,60,.6)" : "rgba(95,138,78,.6)");
    g.strokeStyle = seamGrass2; g.lineWidth = 1.3; g.lineCap = "round";
    for (var sg3i = 0; sg3i < 22; sg3i++) {
      var su3 = sg3i / 22;
      var sgx2 = w * (0.20 - su3 * 0.20) + Math.sin(sg3i * 5.3) * 6;
      if (sgx2 < 2) sgx2 = 2 + (sg3i % 5);
      var sgh2 = (3.5 + Math.sin(sg3i * 2.1) * 1.5) * (0.45 + (1 - su3) * 0.55);
      g.beginPath(); g.moveTo(sgx2, gy + 2);
      g.quadraticCurveTo(sgx2 + 1.4, gy - sgh2 * 0.6, sgx2 + Math.sin(sg3i * 1.9) * 3, gy - sgh2);
      g.stroke();
    }

    /* ---- Eisbach: the stream with the standing wave (surfer is live) ---- */
    var eL = w * 0.05, eR = w * 0.26, eY = gy + 3;
    var eg = g.createLinearGradient(0, eY, 0, eY + 14);
    eg.addColorStop(0, winter ? "rgba(120,132,132,.85)" : "rgba(96,118,112,.85)");
    eg.addColorStop(1, "rgba(58,72,68,.9)");
    g.fillStyle = eg;
    g.beginPath();
    g.moveTo(eL - 8, eY);
    g.quadraticCurveTo(w * 0.155, eY - 2, eR + 8, eY);
    g.lineTo(eR + 4, eY + 14); g.lineTo(eL - 4, eY + 14);
    g.closePath(); g.fill();
    g.strokeStyle = "rgba(40,32,20,.6)"; g.lineWidth = 2;
    g.beginPath(); g.moveTo(eL - 8, eY); g.lineTo(eR + 8, eY); g.stroke();
    // stone banks
    g.fillStyle = "rgba(110,98,82,.6)";
    [eL - 10, eR + 6].forEach(function (bx3) {
      g.beginPath(); g.ellipse(bx3, eY + 2, 7, 3, 0, 0, 6.284); g.fill();
    });
    // a small arched footbridge carries the path across
    var brx = w * 0.21, brw = w * 0.055;
    g.strokeStyle = "#4a3826"; g.lineWidth = 3.4; g.lineCap = "round";
    g.beginPath();
    g.moveTo(brx - brw, eY + 2);
    g.quadraticCurveTo(brx, eY - 7, brx + brw, eY + 2);
    g.stroke();
    g.strokeStyle = "#5d4730"; g.lineWidth = 1.2;
    for (var bp = 0; bp <= 8; bp++) {
      var bu2 = bp / 8;
      var bpx = brx - brw + bu2 * brw * 2;
      var bpy = eY + 2 - (1 - Math.pow(2 * bu2 - 1, 2)) * 9;
      g.beginPath(); g.moveTo(bpx, bpy - 1.4); g.lineTo(bpx, bpy + 1.4); g.stroke();
    }
    // handrail
    g.strokeStyle = "#3f2f1d"; g.lineWidth = 1.4;
    g.beginPath();
    g.moveTo(brx - brw, eY - 4);
    g.quadraticCurveTo(brx, eY - 13, brx + brw, eY - 4);
    g.stroke();
    [brx - brw, brx, brx + brw].forEach(function (rp) {
      var rpy = rp === brx ? eY - 12.6 : eY - 3.6;
      g.beginPath(); g.moveTo(rp, rpy); g.lineTo(rp, rpy + (rp === brx ? 5.6 : 5)); g.stroke();
    });

    /* ---- biergarten under its chestnut ---- */
    var bx = w * 0.39, ty = gy - 20;
    // the chestnut: a taller trunk + three broad canopy blobs
    g.strokeStyle = "#4a3826"; g.lineWidth = 6.5; g.lineCap = "round";
    g.beginPath(); g.moveTo(bx + 2, gy); g.quadraticCurveTo(bx + 5, gy - 38, bx - 2, gy - 66); g.stroke();
    var can = winter ? "rgba(120,116,104,.35)" : (autumn ? "rgba(160,110,52,.7)" : "rgba(92,116,66,.75)");
    if (!winter) {
      g.fillStyle = can;
      g.beginPath(); g.ellipse(bx - 19, gy - 74, 26, 18, 0.2, 0, 6.284); g.fill();
      g.beginPath(); g.ellipse(bx + 16, gy - 79, 28, 19, -0.15, 0, 6.284); g.fill();
      g.beginPath(); g.ellipse(bx - 1, gy - 92, 23, 15, 0, 0, 6.284); g.fill();
      g.fillStyle = "rgba(0,0,0,.10)";
      g.beginPath(); g.ellipse(bx - 8, gy - 69, 28, 11, 0.1, 0, 6.284); g.fill();
    } else {
      g.strokeStyle = "rgba(90,76,60,.8)"; g.lineWidth = 2.4;
      for (i = 0; i < 5; i++) {
        g.beginPath(); g.moveTo(bx - 2, gy - 58 - i * 4);
        g.quadraticCurveTo(bx - 2 + Math.sin(i * 2.6) * 20, gy - 72 - i * 5,
                           bx + Math.sin(i * 1.9) * 33, gy - 82 - i * 6);
        g.stroke();
      }
    }
    // the long table with its checkered cloth
    g.strokeStyle = "#523d29"; g.lineWidth = 3.6;
    g.beginPath();
    g.moveTo(bx - 18, ty + 3); g.lineTo(bx - 22, gy + 2);
    g.moveTo(bx + 18, ty + 3); g.lineTo(bx + 22, gy + 2);
    g.stroke();
    g.fillStyle = "#e8e0cc";
    g.fillRect(bx - 28, ty - 3, 56, 8);
    g.fillStyle = "rgba(106,118,132,.55)";
    for (i = 0; i < 19; i++) if (i % 2 === 0) g.fillRect(bx - 28 + i * 3, ty - 3, 3, 4);
    for (i = 0; i < 19; i++) if (i % 2 === 1) g.fillRect(bx - 28 + i * 3, ty + 1, 3, 4);
    if (winter) {
      g.fillStyle = "rgba(238,236,228,0.8)";
      g.fillRect(bx - 28, ty - 5.4, 56, 3);
    }
    // two mugs, big enough to clink
    for (i = 0; i < 2; i++) {
      var mx = bx - 16 + i * 22;
      g.fillStyle = "rgba(212,158,84,0.9)";
      g.fillRect(mx, ty - 15.5, 7.5, 12);
      g.strokeStyle = "rgba(160,112,52,0.8)"; g.lineWidth = 0.7;
      g.beginPath(); g.moveTo(mx + 2.4, ty - 14.5); g.lineTo(mx + 2.4, ty - 4.5); g.stroke();
      g.fillStyle = "rgba(240,236,222,0.85)";
      g.fillRect(mx - 0.8, ty - 19, 9.1, 3.6);
      g.strokeStyle = "rgba(212,158,84,0.9)"; g.lineWidth = 1.6;
      g.beginPath(); g.arc(mx + 9, ty - 9.5, 3, -Math.PI / 2, Math.PI / 2); g.stroke();
    }
    // the bench, set clear of the table so a visitor can sit
    var bnx = bx + (small ? 34 : 46), bnw = small ? 26 : 34;
    g.fillStyle = "#67503a";
    g.fillRect(bnx, gy - 11, bnw, 4);
    g.strokeStyle = "#523d29"; g.lineWidth = 2.4;
    g.beginPath();
    g.moveTo(bnx + 4, gy - 7); g.lineTo(bnx + 2, gy + 1);
    g.moveTo(bnx + bnw - 4, gy - 7); g.lineTo(bnx + bnw - 2, gy + 1);
    g.stroke();
    // string light wire: tree to the maypole (bulbs glow live at night)
    g.strokeStyle = "rgba(60,48,36,.6)"; g.lineWidth = 1;
    g.beginPath(); g.moveTo(bx - 2, gy - 84);
    g.quadraticCurveTo(w * 0.63, gy - 46, w * 0.87, gy - 102);
    g.stroke();

    /* ---- the U-Bahn entrance: the way down to the projects ---- */
    var ux = w * 0.66, uw2 = 60;
    // recess
    var ug = g.createLinearGradient(0, gy - 2, 0, gy + 20);
    ug.addColorStop(0, "#171008");
    ug.addColorStop(1, "#0d0905");
    g.fillStyle = ug;
    g.fillRect(ux, gy - 1, uw2, 19);
    // steps
    g.strokeStyle = "rgba(190,176,150,.30)"; g.lineWidth = 1.3;
    for (i = 1; i <= 4; i++) {
      g.beginPath(); g.moveTo(ux + 3, gy - 1 + i * 4.2); g.lineTo(ux + uw2 - 3, gy - 1 + i * 4.2); g.stroke();
    }
    // side walls + railing
    g.fillStyle = "#4a4038";
    g.fillRect(ux - 4, gy - 5, 4, 24);
    g.fillRect(ux + uw2, gy - 5, 4, 24);
    g.strokeStyle = "#5d5248"; g.lineWidth = 2.4;
    g.beginPath();
    g.moveTo(ux - 2, gy - 5); g.lineTo(ux - 2, gy - 18); g.lineTo(ux + 18, gy - 18);
    g.stroke();
    g.beginPath();
    g.moveTo(ux + uw2 + 2, gy - 5); g.lineTo(ux + uw2 + 2, gy - 18); g.lineTo(ux + uw2 - 20, gy - 18);
    g.stroke();
    // the U sign on its own post, left of the stairs, clear of them
    var upx = ux - 18;
    g.strokeStyle = "#3f3a34"; g.lineWidth = 3;
    g.beginPath(); g.moveTo(upx, gy); g.lineTo(upx, gy - 50); g.stroke();
    g.fillStyle = "#3a4c66";
    g.fillRect(upx - 10.5, gy - 71, 21, 21);
    g.strokeStyle = "rgba(230,232,236,.9)"; g.lineWidth = 3;
    g.beginPath();
    g.moveTo(upx - 4.4, gy - 66.5); g.lineTo(upx - 4.4, gy - 57.5);
    g.arc(upx, gy - 57.5, 4.4, Math.PI, 0, true);
    g.lineTo(upx + 4.4, gy - 66.5);
    g.stroke();

    /* ---- TUM: a proper stone facade between biergarten and U-Bahn ---- */
    var tux = w * 0.565, tuw = w * 0.11, tub = gy + 1, tuh = 56;
    g.fillStyle = "rgba(190,177,152,0.92)";
    g.fillRect(tux - tuw / 2, tub - tuh, tuw, tuh);
    g.strokeStyle = "rgba(96,84,66,0.55)"; g.lineWidth = 1;
    g.strokeRect(tux - tuw / 2, tub - tuh, tuw, tuh);
    // parapet and cornice line
    g.fillStyle = "rgba(172,158,134,0.95)";
    g.fillRect(tux - tuw / 2 - 2.6, tub - tuh - 4.2, tuw + 5.2, 4.2);
    g.strokeRect(tux - tuw / 2 - 2.6, tub - tuh - 4.2, tuw + 5.2, 4.2);
    g.beginPath(); g.moveTo(tux - tuw / 2, tub - tuh + 17); g.lineTo(tux + tuw / 2, tub - tuh + 17); g.stroke();
    // a row of tall windows across the upper floor
    g.fillStyle = "rgba(74,64,52,0.72)";
    for (i = 0; i < 7; i++) {
      var tuwx = tux - tuw / 2 + tuw * (0.075 + i * 0.13);
      g.fillRect(tuwx, tub - tuh + 21.5, 6, 18.5);
      g.strokeStyle = "rgba(214,202,178,0.5)"; g.lineWidth = 0.7;
      g.beginPath(); g.moveTo(tuwx + 3, tub - tuh + 21.5); g.lineTo(tuwx + 3, tub - tuh + 40); g.stroke();
    }
    // the columned entrance portal
    g.fillStyle = "rgba(54,46,38,0.9)";
    g.fillRect(tux - 10.5, tub - 22, 21, 22);
    g.fillStyle = "rgba(212,198,172,0.95)";
    for (i = 0; i < 4; i++) {
      g.fillRect(tux - 11 + i * 6.6, tub - 24.5, 2.6, 24.5);
    }
    g.fillStyle = "rgba(196,182,156,0.96)";
    g.beginPath(); g.moveTo(tux - 15, tub - 24.5); g.lineTo(tux, tub - 33); g.lineTo(tux + 15, tub - 24.5);
    g.closePath(); g.fill();
    g.strokeStyle = "rgba(96,84,66,0.55)"; g.lineWidth = 0.9;
    g.beginPath(); g.moveTo(tux - 15, tub - 24.5); g.lineTo(tux, tub - 33); g.lineTo(tux + 15, tub - 24.5);
    g.closePath(); g.stroke();
    // the dark plaque by the door, letters legible from the path
    g.fillStyle = "rgba(28,32,38,0.95)";
    g.fillRect(tux + 16, tub - 20, 28, 15);
    g.strokeStyle = "rgba(214,202,178,0.4)"; g.lineWidth = 0.7;
    g.strokeRect(tux + 16, tub - 20, 28, 15);
    g.font = "bold 12px Georgia";
    g.textAlign = "center";
    g.fillStyle = "rgba(234,238,242,0.95)";
    g.fillText("TUM", tux + 30, tub - 9);
    g.textAlign = "start";
    if (winter) {
      g.fillStyle = "rgba(238,240,238,0.8)";
      g.fillRect(tux - tuw / 2 - 2.6, tub - tuh - 7, tuw + 5.2, 2.8);
    }

    /* ---- maypole ---- */
    var mp = w * 0.87, ph = 110;
    g.strokeStyle = "rgba(232,226,210,0.8)"; g.lineWidth = 4.2;
    g.beginPath(); g.moveTo(mp, gy); g.lineTo(mp, gy - ph); g.stroke();
    g.strokeStyle = "rgba(106,118,132,0.8)"; g.lineWidth = 2.4;
    for (i = 0; i < 10; i++) {
      y = gy - 7 - i * 10.3;
      g.beginPath(); g.moveTo(mp - 2.2, y); g.lineTo(mp + 2.2, y - 5.2); g.stroke();
    }
    g.strokeStyle = "rgba(110,124,96,0.8)"; g.lineWidth = 2.6;
    g.beginPath(); g.arc(mp, gy - ph + 14, 7.2, 0, 6.284); g.stroke();
    g.fillStyle = "rgba(232,226,210,0.8)";
    g.beginPath(); g.arc(mp, gy - ph - 2.5, 2.4, 0, 6.284); g.fill();

    /* caption */
    g.font = "italic 22px Georgia";
    g.textAlign = "center";
    g.fillStyle = "rgba(242,238,226,0.5)";
    g.fillText("München", w * 0.2, gy + 40);
    g.textAlign = "start";
  }

  function buildWings() {
    wingSeasonKey = seasonCur;
    /* phones get wide wings: each city is a place you pan through, not a sliver */
    wingW = Math.round(small ? Math.min(W * 1.7, 640) : Math.min(W * 0.85, 980));
    wingL = document.createElement("canvas");
    wingR = document.createElement("canvas");
    [wingL, wingR].forEach(function (cv) { cv.width = wingW * DPR; cv.height = H * DPR; });
    var gl = wingL.getContext("2d"); gl.scale(DPR, DPR);
    var gr2 = wingR.getContext("2d"); gr2.scale(DPR, DPR);
    paintIstanbulWing(gl, wingW, H, H * 0.885, seasonCur, W, H);
    paintMunichWing(gr2, wingW, H, H * 0.885, seasonCur, W, H);
    // night editions: the same picture, seen later
    wingLN = document.createElement("canvas");
    wingRN = document.createElement("canvas");
    [[wingLN, wingL], [wingRN, wingR]].forEach(function (pair) {
      pair[0].width = wingW * DPR; pair[0].height = H * DPR;
      var ng = pair[0].getContext("2d");
      ng.drawImage(pair[1], 0, 0);
      ng.globalCompositeOperation = "source-atop";
      ng.fillStyle = "rgba(22,25,42,.30)";
      ng.fillRect(0, 0, wingW * DPR, H * DPR);
    });
  }

  /* the living layer over the baked wings: the ferry runs, the surfer surfs,
     the tea steams, the lights come on at dusk. Coordinates mirror the bakes. */
  function drawFerry(x, y, dir, night2, t) {
    ctx.save();
    ctx.translate(x, y);
    ctx.scale(1.2, 1.2);
    if (dir === -1) ctx.scale(-1, 1);
    ctx.fillStyle = "rgba(52,40,28,0.95)";
    ctx.beginPath(); ctx.moveTo(-35, -8); ctx.lineTo(35, -8); ctx.lineTo(30, 3);
    ctx.lineTo(-29, 3); ctx.closePath(); ctx.fill();
    ctx.fillStyle = "rgba(232,226,210,0.92)";
    ctx.fillRect(-28, -15, 56, 7);
    ctx.fillRect(-22, -21, 40, 6);
    ctx.fillStyle = night2 > 0.4 ? "rgba(240,196,110,.85)" : "rgba(58,48,38,0.8)";
    for (var i = 0; i < 9; i++) ctx.fillRect(-25 + i * 6, -13.5, 2.4, 3);
    for (var j = 0; j < 6; j++) ctx.fillRect(-19 + j * 6, -19.5, 2.4, 3);
    ctx.fillStyle = "rgba(120,84,60,0.95)";
    ctx.fillRect(8, -30, 4, 9);
    ctx.strokeStyle = "rgba(170,162,148,.4)";
    ctx.lineWidth = 1.4;
    for (var sm2 = 0; sm2 < 2; sm2++) {
      var st3 = (t * 0.5 + sm2 * 0.4) % 1;
      ctx.globalAlpha = 0.5 * (1 - st3);
      ctx.beginPath();
      ctx.arc(10 - st3 * 12, -33 - st3 * 12, 2.6 + st3 * 2.4, 0, 6.284);
      ctx.stroke();
    }
    ctx.globalAlpha = 1;
    if (night2 > 0.4) {                            // masthead light
      ctx.fillStyle = "rgba(240,220,160," + (0.8 * night2) + ")";
      ctx.beginPath(); ctx.arc(33, -10, 1.4, 0, 6.284); ctx.fill();
    }
    ctx.restore();
  }

  function drawGull(x, y, t, seed, sc) {
    // a proper gull: two arced wings meeting at a small grey body
    var fl = Math.sin(t * 7 + seed * 2.3) * 4.6 * sc;
    ctx.strokeStyle = "rgba(234,230,218,.85)";
    ctx.lineWidth = 1.7 * sc;
    ctx.lineCap = "round";
    ctx.beginPath();
    ctx.moveTo(x - 10 * sc, y - 1.5 * sc);
    ctx.quadraticCurveTo(x - 5 * sc, y - 5.5 * sc - fl, x - 1 * sc, y);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(x + 1 * sc, y);
    ctx.quadraticCurveTo(x + 5 * sc, y - 5.5 * sc - fl, x + 10 * sc, y - 1.5 * sc);
    ctx.stroke();
    ctx.fillStyle = "rgba(226,222,210,.8)";
    ctx.beginPath(); ctx.ellipse(x, y + 0.8 * sc, 2.1 * sc, 1.3 * sc, 0, 0, 6.284); ctx.fill();
  }

  function drawWingLife(t, night2) {
    var gy2 = H * 0.885, seaTop = gy2 + 4;

    /* ================= İSTANBUL (west wing) ================= */
    if (camXs < -wingW * 0.06) {
      var IW = function (u) { return -wingW + wingW * u; };   // local → world x

      // animated water glints
      ctx.strokeStyle = "rgba(226,222,204,.5)";
      ctx.lineWidth = 1;
      for (var gl2 = 0; gl2 < 7; gl2++) {
        var ph5 = (t * 0.35 + gl2 * 0.41) % 1;
        var ga2 = Math.sin(ph5 * Math.PI) * 0.35;
        if (ga2 < 0.03) continue;
        ctx.globalAlpha = ga2;
        var gx4 = IW(0.06 + (gl2 * 0.093) % 0.6);
        var gy4b = seaTop + 10 + (gl2 % 4) * 15;
        ctx.beginPath(); ctx.moveTo(gx4, gy4b); ctx.lineTo(gx4 + 14 + (gl2 % 3) * 6, gy4b); ctx.stroke();
      }
      ctx.globalAlpha = 1;

      // the ferry: a 48 second habit
      var fu = (t % 48) / 48, fx2, fdir = 1, moving = true;
      if (fu < 0.34) { fx2 = 0.02 + smooth(fu / 0.34) * 0.44; fdir = 1; }
      else if (fu < 0.56) { fx2 = 0.46; moving = false; fdir = 1; }
      else if (fu < 0.96) { fx2 = 0.46 - smooth((fu - 0.56) / 0.40) * 0.56; fdir = -1; }
      else { fx2 = -0.2; moving = false; }
      var ferryVisible = fx2 > -0.08;
      var fwx = IW(fx2);
      var fwy = seaTop - 4 + Math.sin(t * 1.3) * 1.2;
      if (ferryVisible) {
        drawFerry(fwx, fwy, fdir, night2, t);
        if (moving) {                                 // bow wave + escort gulls
          ctx.strokeStyle = "rgba(220,222,206,.4)";
          ctx.lineWidth = 1.2;
          ctx.beginPath();
          ctx.moveTo(fwx + fdir * 33, fwy + 4);
          ctx.quadraticCurveTo(fwx + fdir * 44, fwy + 6, fwx + fdir * 54, fwy + 5);
          ctx.stroke();
          for (var eg2 = 0; eg2 < 2; eg2++) {
            var egx = fwx - fdir * (30 + eg2 * 22);
            var egy = fwy - 34 - eg2 * 12 + Math.sin(t * 5 + eg2 * 2) * 4;
            drawGull(egx, egy, t, eg2 + 2, 0.8);
          }
        }
        EGG.ferryRect = { x: fwx - 48, y: fwy - 32, w: 96, h: 42 };
      } else EGG.ferryRect = null;

      // three gulls keep their own heights over the water
      drawGull(IW(0.16) + Math.sin(t * 0.23) * wingW * 0.05, gy2 - 170 + Math.sin(t * 0.9) * 9, t, 0, 1);
      drawGull(IW(0.34) + Math.sin(t * 0.19 + 2.1) * wingW * 0.07, gy2 - 118 + Math.sin(t * 1.1 + 1) * 7, t, 1, 1);
      drawGull(IW(0.52) + Math.sin(t * 0.26 + 4.2) * wingW * 0.04, gy2 - 208 + Math.sin(t * 0.8 + 3) * 10, t, 2, 1);

      // tea steam over the pier table
      var pL2 = 0.545, pR2 = 0.805;
      var teaX = IW(pL2 + (pR2 - pL2) * 0.30);
      for (var st4 = 0; st4 < 2; st4++) {
        var sph = (t * 0.5 + st4 * 0.5) % 1;
        ctx.strokeStyle = "rgba(235,232,222," + (0.4 * (1 - sph)) + ")";
        ctx.lineWidth = 1.1;
        ctx.beginPath();
        ctx.moveTo(teaX + Math.sin(sph * 7 + st4 * 3) * 2.4, gy2 - 46 - sph * 13);
        ctx.quadraticCurveTo(teaX + Math.sin(sph * 9) * 3.4, gy2 - 51 - sph * 13,
                             teaX + Math.sin(sph * 6 + 1) * 2.4, gy2 - 56 - sph * 13);
        ctx.stroke();
      }

      // the fishing rod, leaning on the far bollard, its line in the water
      var rodX = IW(pL2 + (pR2 - pL2) * 0.9) - 2;
      var bob = Math.sin(t * 1.7) * 1.4;
      ctx.strokeStyle = "#3a2b1a"; ctx.lineWidth = 1.8; ctx.lineCap = "round";
      ctx.beginPath(); ctx.moveTo(rodX, gy2 - 6);
      ctx.quadraticCurveTo(rodX - 20, gy2 - 30, rodX - 34, gy2 - 36 + bob * 0.4);
      ctx.stroke();
      ctx.strokeStyle = "rgba(220,214,198,.4)"; ctx.lineWidth = 0.7;
      ctx.beginPath(); ctx.moveTo(rodX - 34, gy2 - 36 + bob * 0.4);
      ctx.lineTo(rodX - 36, seaTop + 6 + bob); ctx.stroke();
      ctx.fillStyle = "rgba(200,90,40,.8)";
      ctx.beginPath(); ctx.arc(rodX - 36, seaTop + 6 + bob, 1.2, 0, 6.284); ctx.fill();

      // dusk: the city finds its lights
      if (night2 > 0.3) {
        var la = (night2 - 0.3) / 0.7;
        ctx.fillStyle = "rgba(240,206,130," + (0.7 * la) + ")";
        [[0.05, 6], [0.09, 9], [0.13, 12], [0.30, 8], [0.44, 16], [0.56, 10], [0.60, 6]].forEach(function (Lp) {
          ctx.fillRect(IW(Lp[0]), seaTop - 2 - Lp[1], 1.6, 1.6);
        });
        // Galata gallery light
        ctx.fillStyle = "rgba(240,206,130," + (0.8 * la) + ")";
        ctx.fillRect(IW(0.20) - 2.5, seaTop - 43, 5, 2);
        // Kiz Kulesi beacon: a slow pulse
        var bk = Math.max(0, Math.sin(t * 1.6));
        var kx = IW(0.42);
        var kg = ctx.createRadialGradient(kx, seaTop - 59, 0, kx, seaTop - 59, 20);
        kg.addColorStop(0, "rgba(240,210,140," + (0.55 * la * bk) + ")");
        kg.addColorStop(1, "rgba(240,210,140,0)");
        ctx.fillStyle = kg;
        ctx.beginPath(); ctx.arc(kx, seaTop - 59, 20, 0, 6.284); ctx.fill();
        // stars land on the water too
        for (var tw5 = 0; tw5 < 3; tw5++) {
          var twa = 0.3 + Math.sin(t * (1.1 + tw5 * 0.4) + tw5 * 2.6) * 0.3;
          ctx.fillStyle = "rgba(226,230,224," + (twa * la * 0.5) + ")";
          ctx.fillRect(IW(0.12 + tw5 * 0.17), seaTop + 14 + tw5 * 11, 2.2, 1);
        }
        // moonpath on the water: a soft feathered band
        var mpg = ctx.createLinearGradient(IW(0.30), 0, IW(0.56), 0);
        mpg.addColorStop(0, "rgba(226,222,200,0)");
        mpg.addColorStop(0.5, "rgba(226,222,200," + (0.09 * la) + ")");
        mpg.addColorStop(1, "rgba(226,222,200,0)");
        ctx.fillStyle = mpg;
        ctx.fillRect(IW(0.30), seaTop + 5, wingW * 0.26, 34);
      }
      EGG.pierSignRect = { x: IW(0.82) - 34, y: gy2 - 48, w: 66, h: 48 };
      EGG.iuRect = { x: IW(0.925) - wingW * 0.075, y: gy2 - 108, w: wingW * 0.15, h: 108 };
    } else { EGG.ferryRect = null; EGG.pierSignRect = null; EGG.iuRect = null; }

    /* ================= MÜNCHEN (east wing) ================= */
    if (camXs > wingW * 0.06) {
      var MW = function (u) { return W + wingW * u; };

      // Eisbach: water flows, one surfer refuses to leave
      var eL2 = MW(0.05), eR2 = MW(0.26), eY2 = gy2 + 3;
      ctx.strokeStyle = "rgba(210,222,214,.35)";
      ctx.lineWidth = 1;
      for (var fl3 = 0; fl3 < 5; fl3++) {
        var fph = (t * 0.9 + fl3 * 0.23) % 1;
        ctx.globalAlpha = Math.sin(fph * Math.PI) * 0.5;
        var fxx = eL2 + (eR2 - eL2) * fph;
        ctx.beginPath(); ctx.moveTo(fxx, eY2 + 3 + (fl3 % 3) * 3);
        ctx.lineTo(fxx + 10, eY2 + 3 + (fl3 % 3) * 3); ctx.stroke();
      }
      ctx.globalAlpha = 1;
      /* the standing wave, a proper curl, and the surfer who lives on it */
      var wvx = eL2 + (eR2 - eL2) * 0.30;
      var sbob = Math.sin(t * 4.2) * 1.6, slean = Math.sin(t * 2.6) * 0.09;
      // the curl: water climbing back on itself, upstream of the board
      var crl = Math.sin(t * 6) * 1.1;
      var wg5 = ctx.createLinearGradient(wvx - 16, eY2 - 8, wvx - 16, eY2 + 8);
      wg5.addColorStop(0, "rgba(150,176,168,.85)");
      wg5.addColorStop(1, "rgba(84,108,102,.9)");
      ctx.fillStyle = wg5;
      ctx.beginPath();
      ctx.moveTo(wvx - 26, eY2 + 8);
      ctx.quadraticCurveTo(wvx - 22, eY2 - 2 + crl * 0.4, wvx - 13, eY2 - 6 + crl * 0.6);
      ctx.quadraticCurveTo(wvx - 6, eY2 - 8.5 + crl, wvx - 2, eY2 - 5 + crl * 0.5);
      ctx.quadraticCurveTo(wvx + 3, eY2 - 1, wvx + 8, eY2 + 3);
      ctx.lineTo(wvx + 8, eY2 + 8);
      ctx.closePath(); ctx.fill();
      // foam crest riding the lip
      ctx.strokeStyle = "rgba(240,244,240,.85)";
      ctx.lineWidth = 2.2; ctx.lineCap = "round";
      ctx.beginPath();
      ctx.moveTo(wvx - 20, eY2 - 2 + crl * 0.4);
      ctx.quadraticCurveTo(wvx - 12, eY2 - 7 + crl * 0.7, wvx - 4, eY2 - 6 + crl * 0.6);
      ctx.stroke();
      ctx.fillStyle = "rgba(240,244,240,.65)";
      for (var fc = 0; fc < 4; fc++) {
        var fcp = (t * 2.6 + fc * 0.25) % 1;
        ctx.beginPath();
        ctx.arc(wvx - 5 - fcp * 17, eY2 - 6 + crl * 0.5 - Math.sin(fcp * Math.PI) * 3, 0.8 + fcp * 0.8, 0, 6.284);
        ctx.fill();
      }
      // the surfer, 1.6x, crouched low with both arms out
      ctx.save();
      ctx.translate(wvx + 5, eY2 - 4 + sbob * 0.5);
      ctx.rotate(slean - 0.05);
      ctx.fillStyle = "rgba(238,232,214,.95)";                    // board, nose lifted
      ctx.beginPath();
      ctx.moveTo(-14, 2.2);
      ctx.quadraticCurveTo(-4, 3.6, 5, 2.6);
      ctx.quadraticCurveTo(11, 1.6, 14, -3);                      // the nose climbs
      ctx.quadraticCurveTo(9.5, -0.4, 3, 0);
      ctx.quadraticCurveTo(-6, 0.6, -14, 2.2);
      ctx.closePath(); ctx.fill();
      ctx.strokeStyle = "rgba(120,104,80,.5)"; ctx.lineWidth = 0.8;
      ctx.beginPath(); ctx.moveTo(-11.5, 2); ctx.quadraticCurveTo(0, 2.4, 12, -2.2); ctx.stroke();
      // legs: wide stance, knees truly bent, weight low
      ctx.strokeStyle = "#2b2620"; ctx.lineWidth = 3; ctx.lineCap = "round";
      ctx.beginPath(); ctx.moveTo(-7, 1.2); ctx.lineTo(-5, -4.5); ctx.lineTo(-1.2, -7.2); ctx.stroke();  // back leg
      ctx.beginPath(); ctx.moveTo(4.5, 0.6); ctx.lineTo(4.2, -5); ctx.lineTo(-0.2, -7.4); ctx.stroke();  // front leg
      // shoes flat on the deck
      ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(-8.6, 1.4); ctx.lineTo(-5.2, 1.1); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(2.9, 0.9); ctx.lineTo(6.3, 0.5); ctx.stroke();
      // torso: folded forward over the front knee
      ctx.strokeStyle = "#2b2620"; ctx.lineWidth = 4.4;
      ctx.beginPath(); ctx.moveTo(-0.8, -7.2); ctx.quadraticCurveTo(0.6, -10.5, 2.6, -13); ctx.stroke();
      // both arms out for balance, palms open to the river
      ctx.strokeStyle = "#2b2620"; ctx.lineWidth = 2.2;
      ctx.beginPath(); ctx.moveTo(0.6, -11.5); ctx.lineTo(-5.5, -13.5 + sbob * 0.7); ctx.lineTo(-10.5, -12.8 + sbob); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(1.6, -12); ctx.lineTo(8, -14.5 - sbob * 0.7); ctx.lineTo(12.6, -13.8 - sbob); ctx.stroke();
      // head, watching the nose
      ctx.fillStyle = "#2b2620";
      ctx.beginPath(); ctx.arc(4.4, -15.8, 2.8, 0, 6.284); ctx.fill();
      ctx.restore();
      // spray kicked off the tail, drifting downstream
      ctx.fillStyle = "rgba(230,236,230,.55)";
      for (var sp5 = 0; sp5 < 5; sp5++) {
        var spp = (t * 2.2 + sp5 * 0.21) % 1;
        ctx.beginPath();
        ctx.arc(wvx - 10 - spp * 13, eY2 + 3 - Math.sin(spp * Math.PI) * 10, 1.1 + spp * 1.5, 0, 6.284);
        ctx.fill();
      }

      // Frauenkirche clocks keep the real hour
      var ck = new Date();
      var hAng = ((ck.getHours() % 12) + ck.getMinutes() / 60) / 12 * 6.284 - 1.5708;
      var mAng = ck.getMinutes() / 60 * 6.284 - 1.5708;
      [0, 1].forEach(function (twr) {
        var cxw = MW(0.70) + (twr === 0 ? -30 : 1) + 10.5;
        var cyw = gy2 - 105 + 7.5;
        ctx.strokeStyle = "rgba(60,46,32,.9)";
        ctx.lineWidth = 1.1;
        ctx.beginPath(); ctx.moveTo(cxw, cyw);
        ctx.lineTo(cxw + Math.cos(hAng) * 2.8, cyw + Math.sin(hAng) * 2.8); ctx.stroke();
        ctx.lineWidth = 0.8;
        ctx.beginPath(); ctx.moveTo(cxw, cyw);
        ctx.lineTo(cxw + Math.cos(mAng) * 4.1, cyw + Math.sin(mAng) * 4.1); ctx.stroke();
      });

      // night: string lights, the U sign hums, town windows
      if (night2 > 0.3) {
        var la2 = (night2 - 0.3) / 0.7;
        var p0x = MW(0.39) - 2, p0y = gy2 - 84;
        var p1x = MW(0.63), p1y = gy2 - 46;
        var p2x = MW(0.87), p2y = gy2 - 102;
        for (var bu = 1; bu < 9; bu++) {
          var bt4 = bu / 9;
          var bxq = (1 - bt4) * (1 - bt4) * p0x + 2 * (1 - bt4) * bt4 * p1x + bt4 * bt4 * p2x;
          var byq = (1 - bt4) * (1 - bt4) * p0y + 2 * (1 - bt4) * bt4 * p1y + bt4 * bt4 * p2y + 2;
          var tw3 = 0.7 + Math.sin(t * 2 + bu * 1.9) * 0.3;
          var bg3 = ctx.createRadialGradient(bxq, byq, 0, bxq, byq, 5);
          bg3.addColorStop(0, "rgba(244,206,120," + (0.75 * la2 * tw3) + ")");
          bg3.addColorStop(1, "rgba(244,206,120,0)");
          ctx.fillStyle = bg3;
          ctx.beginPath(); ctx.arc(bxq, byq, 5, 0, 6.284); ctx.fill();
          ctx.fillStyle = "rgba(248,222,150," + (0.9 * la2) + ")";
          ctx.beginPath(); ctx.arc(bxq, byq, 0.9, 0, 6.284); ctx.fill();
        }
        var upx2 = MW(0.66) - 18;
        var ug2 = ctx.createRadialGradient(upx2, gy2 - 60, 0, upx2, gy2 - 60, 17);
        ug2.addColorStop(0, "rgba(150,180,220," + (0.30 * la2) + ")");
        ug2.addColorStop(1, "rgba(150,180,220,0)");
        ctx.fillStyle = ug2;
        ctx.beginPath(); ctx.arc(upx2, gy2 - 60, 17, 0, 6.284); ctx.fill();
        ctx.fillStyle = "rgba(240,206,130," + (0.65 * la2) + ")";
        [[0.63, 10], [0.775, 12], [0.83, 8], [0.905, 13], [0.935, 7]].forEach(function (Wp) {
          ctx.fillRect(MW(Wp[0]), gy2 - Wp[1], 1.6, 1.6);
        });
      }
      EGG.ubahnRect = { x: MW(0.66) - 32, y: gy2 - 74, w: 170, h: 94 };
      EGG.kirkRect = { x: MW(0.70) - 34, y: gy2 - 145, w: 140, h: 70 };
      EGG.mugRect = { x: MW(0.39) - 20, y: gy2 - 42, w: 42, h: 42 };
      EGG.tumRect = { x: MW(0.565) - wingW * 0.055, y: gy2 - 62, w: wingW * 0.11 + 30, h: 62 };
    } else { EGG.ubahnRect = null; EGG.kirkRect = null; EGG.mugRect = null; EGG.tumRect = null; }

    /* -------- he follows you into the cities, when he is free -------- */
    var settledL = camXs < -wingW * 0.72, settledR = camXs > wingW * 0.72;
    if ((settledL || settledR) && (GUY.state === "wave" || GUY.state === "stand")) GUY.state = "walkout";
    var guyFree = GUY.state === "away" || GUY.state === "home";
    if (settledL && WGUY.side !== -1 && guyFree) { WGUY.side = -1; WGUY.t0 = t; WGUY.crumbT = t + 6; }
    else if (settledR && WGUY.side !== 1 && guyFree) { WGUY.side = 1; WGUY.t0 = t; }
    else if (!settledL && WGUY.side === -1 && Math.abs(camXs) < wingW * 0.4) WGUY.side = 0;
    else if (!settledR && WGUY.side === 1 && Math.abs(camXs) < wingW * 0.4) WGUY.side = 0;
    if (WGUY.side !== 0) {
      var wgT = Math.min(1, (t - WGUY.t0) / 5);
      if (GUY.state === "away") GUY.next = Math.max(GUY.next, t + 8);   // one Kerem at a time
      if (WGUY.side === -1 && camXs < -wingW * 0.2) {
        // to the pier, then he sits on the deck, feet over the edge
        var wgx = lerp(-24, -wingW + wingW * 0.58, smooth(wgT));
        if (wgT < 1) {
          drawGuy(wgx, gy2, t, "walk", GUY.outfit, null, -1);
        } else {
          drawGuy(-wingW + wingW * 0.58, gy2 - 11, t, "sit", GUY.outfit, null, -1);
          // a crumb for the gulls, every little while
          if (t > WGUY.crumbT) { WGUY.crumbT = t + 9 + (t % 5); WGUY.crumbAt = t; }
          if (WGUY.crumbAt && t - WGUY.crumbAt < 2.6) {
            var cph = (t - WGUY.crumbAt) / 2.6;
            if (cph < 0.45) {
              var cu2 = cph / 0.45;
              ctx.fillStyle = "rgba(226,208,172,.9)";
              ctx.beginPath();
              ctx.arc(-wingW + wingW * 0.58 - 14 - cu2 * 46,
                      gy2 - 22 - Math.sin(cu2 * Math.PI) * 26 + cu2 * 18, 1.3, 0, 6.284);
              ctx.fill();
            } else {
              // one gull commits to the dive
              var gu2 = (cph - 0.45) / 0.55;
              var gvx = -wingW + wingW * 0.58 - 60 + Math.sin(gu2 * Math.PI) * -30;
              var gvy = gy2 - 76 + smooth(gu2) * 64;
              drawGull(gvx, gvy, t * 1.6, 5, 0.9);
            }
          }
        }
      } else if (WGUY.side === 1 && camXs > wingW * 0.2) {
        // to the biergarten bench, where he sits properly, facing the table
        var wgSeatX = W + wingW * 0.39 + (small ? 47 : 63);
        var wgx2 = lerp(W + 24, wgSeatX, smooth(wgT));
        if (wgT < 1) drawGuy(wgx2, gy2, t, "walk", GUY.outfit, null, 1);
        else drawGuy(wgSeatX, gy2 - 11, t, "sit", GUY.outfit, null, -1);
      }
    }

    /* -------- the signposts, always legible, always on top -------- */
    function drawWorldSign(x2, label, arrowRight, night3) {
      ctx.save();
      ctx.translate(x2, gy2);
      ctx.strokeStyle = "#3f2f1d"; ctx.lineWidth = 4; ctx.lineCap = "butt";
      ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(0, -34); ctx.stroke();
      var d2 = arrowRight ? 1 : -1;
      ctx.fillStyle = "#54402a";
      ctx.beginPath();
      ctx.moveTo(-30 * d2, -46); ctx.lineTo(22 * d2, -46);
      ctx.lineTo(30 * d2, -39); ctx.lineTo(22 * d2, -32); ctx.lineTo(-30 * d2, -32);
      ctx.closePath(); ctx.fill();
      ctx.strokeStyle = "rgba(26,18,10,.6)"; ctx.lineWidth = 1.2; ctx.stroke();
      if (night3 > 0.35) {
        ctx.strokeStyle = "rgba(224,170,96," + (0.35 * night3) + ")";
        ctx.lineWidth = 0.8; ctx.stroke();
      }
      ctx.font = "italic 13px Georgia";
      ctx.textAlign = "center";
      ctx.fillStyle = "rgba(240,234,220,.92)";
      ctx.fillText(label, -3 * d2, -35.5);
      ctx.restore();
      ctx.textAlign = "start";
    }
    // a breath of soil tone across both ground junctions
    [[-26, 0], [W, 26]].forEach(function (sm3) {
      var sg4 = ctx.createLinearGradient(sm3[0], 0, sm3[0] + 26, 0);
      var aIn = sm3[1] === 0 ? 0.30 : 0;
      var aOut = sm3[1] === 0 ? 0 : 0.30;
      sg4.addColorStop(0, "rgba(34,25,16," + aIn + ")");
      sg4.addColorStop(1, "rgba(34,25,16," + aOut + ")");
      ctx.fillStyle = sg4;
      ctx.fillRect(sm3[0], gy2, 26, H - gy2);
    });
    if (camXs < -wingW * 0.06) drawWorldSign(-wingW + wingW * 0.82, "Profile", true, night2);
    if (camXs > wingW * 0.06) drawWorldSign(W + wingW * 0.66 + 60 + (small ? 16 : 44), "Projects", false, night2);

    /* -------- one-shot flourishes (clicks) -------- */
    if (WINGFX.gulls > 0 && t - WINGFX.gulls < 5) {
      var gt = t - WINGFX.gulls;
      ctx.strokeStyle = "rgba(234,230,218,.8)";
      ctx.lineWidth = 1.4;
      for (var gu = 0; gu < 4; gu++) {
        var gx3 = -wingW + wingW * 0.5 + Math.sin(gu * 2.4) * 40 - gt * (30 + gu * 14);
        var gy3 = gy2 - 46 - gu * 16 - gt * 16 + Math.sin(t * 6 + gu) * 5;
        var fl = Math.sin(t * 10 + gu * 2) * 3;
        ctx.beginPath(); ctx.moveTo(gx3 - 6, gy3);
        ctx.quadraticCurveTo(gx3 - 3, gy3 - 4 - fl, gx3, gy3);
        ctx.quadraticCurveTo(gx3 + 3, gy3 - 4 - fl, gx3 + 6, gy3); ctx.stroke();
      }
    }
    if (WINGFX.bell > 0 && t - WINGFX.bell < 2.4) {
      var bt3 = t - WINGFX.bell;
      ctx.fillStyle = "rgba(60,48,36," + (0.7 * (1 - bt3 / 2.4)) + ")";
      ctx.font = "13px Georgia";
      ctx.fillText("♪", W + wingW * 0.70 + 8, gy2 - 148 - bt3 * 18);
      ctx.fillText("♫", W + wingW * 0.70 - 12, gy2 - 136 - bt3 * 24);
    }
    if (WINGFX.foam > 0 && t - WINGFX.foam < 1.4) {
      var ft = t - WINGFX.foam;
      ctx.fillStyle = "rgba(240,236,222," + (0.8 * (1 - ft / 1.4)) + ")";
      for (var fo = 0; fo < 4; fo++) {
        ctx.beginPath();
        ctx.arc(W + wingW * 0.39 - 12 + fo * 8, gy2 - 40 - ft * 20 - fo * 3, 1.8 + ft * 1.3, 0, 6.284);
        ctx.fill();
      }
    }
  }

  /* --------------------------------- the sky room: balloon by day, stars by night */
  function drawSkyRoom(t, night, skyLift) {
    if (gSkyS < 0.02) { EGG.balloonRect = null; EGG.bannerRect = null; return; }
    // deepening zenith
    ctx.save();
    ctx.translate(0, -H * 0.62);
    // three cloud masses hold the room, each at its own depth and pace
    if (cloudSprite) {
      var CLD = [[7, 60, H * 0.13, 1.75, 0.85],
                 [12, 620, H * 0.335, 1.2, 0.95],
                 [17, 1180, H * 0.485, 0.85, 0.8]];
      var cldDim = night >= 0.55 ? 0.3 : 1;
      for (var cl2 = 0; cl2 < 3; cl2++) {
        var cw3 = 320 * CLD[cl2][3];
        var cx8 = ((t * CLD[cl2][0] + CLD[cl2][1]) % (W + cw3 + 240)) - cw3 - 120;
        ctx.globalAlpha = CLD[cl2][4] * cldDim * gSkyS;
        ctx.drawImage(cloudSprite, cx8, CLD[cl2][2], cw3, 110 * CLD[cl2][3]);
      }
      ctx.globalAlpha = 1;
    }
    // the hot air balloon, minding its own business
    if (night < 0.55) {
      BALLOON.boost = Math.max(0, BALLOON.boost - 0.004);
      var bx2 = ((t * 9 + W * 0.3) % (W + 500)) - 250;
      var by2 = H * 0.30 + Math.sin(t * 0.32) * 14 - BALLOON.boost * 150;
      // a second balloon, far off and higher, drifting the other way
      ctx.save();
      var bfx = W + 160 - ((t * 6.5 + W * 0.55) % (W + 460));
      var bfy = H * 0.115 + Math.sin(t * 0.27 + 2) * 9;
      ctx.translate(bfx, bfy);
      ctx.scale(0.55, 0.55);
      ctx.globalAlpha = 0.55;
      for (var gof = -2; gof <= 2; gof++) {
        ctx.fillStyle = (gof % 2 === 0) ? "rgba(160,74,44,.92)" : "rgba(230,216,190,.92)";
        ctx.beginPath();
        ctx.moveTo(0, 42);
        ctx.bezierCurveTo(gof * 9 - 4, 26, gof * 13 - 3, -8, gof * 5, -26);
        ctx.bezierCurveTo(gof * 5 + 4, -26, gof * 5 + 4, -26, gof * 5 + 1, -26);
        ctx.bezierCurveTo(gof * 13 + 5, -8, gof * 9 + 6, 26, 2, 42);
        ctx.closePath(); ctx.fill();
      }
      ctx.strokeStyle = "rgba(80,60,40,.8)";
      ctx.beginPath(); ctx.moveTo(-10, 40); ctx.lineTo(-6, 58); ctx.moveTo(10, 40); ctx.lineTo(6, 58); ctx.stroke();
      ctx.fillStyle = "#5d4630";
      ctx.fillRect(-8, 58, 16, 11);
      ctx.restore();
      ctx.save();
      ctx.translate(bx2, by2);
      ctx.scale(1.25, 1.25);
      // envelope: five gores, warm stripes
      for (var go = -2; go <= 2; go++) {
        ctx.fillStyle = (go % 2 === 0) ? "rgba(160,74,44,.92)" : "rgba(230,216,190,.92)";
        ctx.beginPath();
        ctx.moveTo(0, 42);
        ctx.bezierCurveTo(go * 9 - 4, 26, go * 13 - 3, -8, go * 5, -26);
        ctx.bezierCurveTo(go * 5 + 4, -26, go * 5 + 4, -26, go * 5 + 1, -26);
        ctx.bezierCurveTo(go * 13 + 5, -8, go * 9 + 6, 26, 2, 42);
        ctx.closePath(); ctx.fill();
      }
      ctx.strokeStyle = "rgba(60,40,26,.5)";
      ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(-14, 30); ctx.quadraticCurveTo(0, 36, 14, 30); ctx.stroke();
      // lines + basket
      ctx.strokeStyle = "rgba(80,60,40,.8)";
      ctx.beginPath(); ctx.moveTo(-10, 40); ctx.lineTo(-6, 58); ctx.moveTo(10, 40); ctx.lineTo(6, 58); ctx.stroke();
      ctx.fillStyle = "#5d4630";
      ctx.fillRect(-8, 58, 16, 11);
      ctx.strokeStyle = "rgba(30,20,12,.5)";
      ctx.strokeRect(-8, 58, 16, 11);
      // burner flame when boosted
      if (BALLOON.boost > 0.05) {
        ctx.fillStyle = "rgba(240,180,80," + (0.7 * Math.min(1, BALLOON.boost * 3)) + ")";
        ctx.beginPath(); ctx.ellipse(0, 52 - Math.sin(t * 30) * 2, 3, 6, 0, 0, 6.284); ctx.fill();
      }
      // the towed banner: a linen strip naming the notes
      var wv2 = Math.sin(t * 2.2) * 3;
      ctx.strokeStyle = "rgba(80,60,40,.7)";
      ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(-10, 46);
      ctx.quadraticCurveTo(-34, 42 + wv2 * 0.4, -52, 46 + wv2 * 0.6);
      ctx.stroke();
      ctx.fillStyle = "rgba(236,228,208,.94)";
      ctx.beginPath();
      ctx.moveTo(-52, 38 + wv2 * 0.6);
      ctx.quadraticCurveTo(-76, 36 + wv2, -100, 40 + wv2 * 1.4);
      ctx.lineTo(-100, 54 + wv2 * 1.4);
      ctx.quadraticCurveTo(-76, 50 + wv2, -52, 54 + wv2 * 0.6);
      ctx.closePath(); ctx.fill();
      ctx.strokeStyle = "rgba(60,48,36,.35)";
      ctx.stroke();
      ctx.fillStyle = "#4a3a28";
      ctx.font = "italic 12px Georgia";
      ctx.textAlign = "center";
      ctx.save();
      ctx.translate(-76, 49 + wv2);
      ctx.rotate(wv2 * 0.008);
      ctx.fillText("Notes", 0, 0);
      ctx.restore();
      ctx.textAlign = "start";
      ctx.restore();
      EGG.balloonRect = gSkyS > 0.35
        ? (small ? { x: bx2 - 46, y: by2 - 52 - H * 0.62, w: 92, h: 152 }
                 : { x: bx2 - 33, y: by2 - 38 - H * 0.62, w: 66, h: 130 }) : null;
      EGG.bannerRect = gSkyS > 0.35
        ? (small ? { x: bx2 - 136, y: by2 + 34 - H * 0.62, w: 86, h: 44 }
                 : { x: bx2 - 128, y: by2 + 44 - H * 0.62, w: 66, h: 28 }) : null;

      // a plane, high and unhurried, its contrail dissolving behind it
      var pu = (t % 55) / 55;
      if (pu < 0.24) {
        var pxp = -60 + (pu / 0.24) * (W + 120);
        var pyp = H * 0.09 - pu * 40;
        var ct2 = ctx.createLinearGradient(pxp - 190, pyp, pxp - 8, pyp);
        ct2.addColorStop(0, "rgba(240,240,236,0)");
        ct2.addColorStop(1, "rgba(240,240,236,.35)");
        ctx.strokeStyle = ct2;
        ctx.lineWidth = 2.2;
        ctx.beginPath(); ctx.moveTo(pxp - 190, pyp + 9); ctx.lineTo(pxp - 8, pyp + 1); ctx.stroke();
        ctx.fillStyle = "rgba(120,116,108,.8)";
        ctx.save();
        ctx.translate(pxp, pyp);
        ctx.rotate(-0.03);
        ctx.beginPath();
        ctx.moveTo(-7, 0); ctx.lineTo(6, 0); ctx.lineTo(8, -1.2); ctx.lineTo(6, -1.8); ctx.lineTo(-5, -1.4);
        ctx.closePath(); ctx.fill();
        ctx.beginPath(); ctx.moveTo(-1, -1); ctx.lineTo(-4.5, -5); ctx.lineTo(-2.6, -1); ctx.closePath(); ctx.fill();
        ctx.beginPath(); ctx.moveTo(-0.5, 0); ctx.lineTo(-3.5, 3.6); ctx.lineTo(-2, 0); ctx.closePath(); ctx.fill();
        ctx.restore();
      }

      // someone lost a kite; it is having a wonderful time
      var ku = (t % 38) / 38;
      if (ku < 0.30) {
        var kx2 = -80 + (ku / 0.30) * (W + 160);
        var ky2 = H * 0.22 + Math.sin(ku * 9) * 30;
        ctx.save();
        ctx.translate(kx2, ky2);
        ctx.rotate(0.5 + Math.sin(t * 1.8) * 0.18);
        ctx.fillStyle = "rgba(168,39,30,.85)";
        ctx.beginPath();
        ctx.moveTo(0, -11); ctx.lineTo(7.5, 0); ctx.lineTo(0, 12); ctx.lineTo(-7.5, 0);
        ctx.closePath(); ctx.fill();
        ctx.strokeStyle = "rgba(60,40,26,.5)"; ctx.lineWidth = 0.8;
        ctx.beginPath(); ctx.moveTo(0, -11); ctx.lineTo(0, 12); ctx.moveTo(-7.5, 0); ctx.lineTo(7.5, 0); ctx.stroke();
        // tail with three bows
        ctx.beginPath();
        ctx.moveTo(0, 12);
        ctx.quadraticCurveTo(-9, 21 + Math.sin(t * 4) * 3, -14, 32 + Math.sin(t * 3.1) * 4);
        ctx.stroke();
        for (var kb = 1; kb <= 3; kb++) {
          var kbu = kb / 3;
          ctx.fillStyle = kb % 2 ? "rgba(224,170,96,.85)" : "rgba(236,228,208,.85)";
          ctx.beginPath();
          ctx.arc(-kbu * 13 + Math.sin(t * 4 + kb) * 2, 12 + kbu * 19 + Math.sin(t * 3.1 + kb) * 3, 2, 0, 6.284);
          ctx.fill();
        }
        ctx.restore();
      }

      // five birds working a thermal, circling well inside the frame
      for (var tb = 0; tb < (small ? 3 : 5); tb++) {
        var ta2 = t * (0.5 + tb * 0.07) + tb * 2.1;
        var trr = 34 + tb * 10;
        var tbx = W * 0.70 + Math.cos(ta2) * trr;
        var tby = H * 0.33 + Math.sin(ta2) * trr * 0.42 - tb * 8;
        var tfl = Math.sin(t * 6 + tb * 2.4) * 2.4;
        ctx.strokeStyle = "rgba(70,60,48,.55)";
        ctx.lineWidth = 1.2;
        ctx.beginPath();
        ctx.moveTo(tbx - 5, tby);
        ctx.quadraticCurveTo(tbx - 2.5, tby - 3 - tfl, tbx, tby);
        ctx.quadraticCurveTo(tbx + 2.5, tby - 3 - tfl, tbx + 5, tby);
        ctx.stroke();
      }

      // seasonal migrations: a V of seven, high and silent
      var wAutM = sw(2), wSprM = sw(0);
      if (wAutM > 0.5 || wSprM > 0.5) {
        var gdir = wAutM > 0.5 ? -1 : 1;             // autumn goes one way, spring returns
        var gcy = (t % 50) / 50;
        if (gcy < 0.42) {
          var gp = gcy / 0.42;
          var gxc = gdir === -1 ? W * (1.10 - gp * 1.20) : W * (-0.10 + gp * 1.20);
          var gyc = H * 0.13 + Math.sin(gp * 3.1) * 14;
          ctx.strokeStyle = "rgba(70,60,48," + (0.5 * Math.max(wAutM, wSprM)) + ")";
          ctx.lineWidth = 1.1;
          for (var gs5 = 0; gs5 < 7; gs5++) {
            var grank = Math.ceil(gs5 / 2);
            var gside = gs5 === 0 ? 0 : (gs5 % 2 ? -1 : 1);
            var ggx = gxc - gdir * grank * 13;
            var ggy = gyc + gside * grank * 6.5;
            var gfl2 = Math.sin(t * 8 + gs5 * 1.7) * 2;
            ctx.beginPath();
            ctx.moveTo(ggx - 4, ggy - gfl2 * 0.5);
            ctx.quadraticCurveTo(ggx, ggy + 2, ggx + 4, ggy - gfl2 * 0.5);
            ctx.stroke();
          }
        }
      }

      // two swallows in summer, working fast low arcs
      if (sw(1) > 0.5) {
        ctx.strokeStyle = "rgba(50,44,38,.6)";
        ctx.lineWidth = 1.2;
        for (var sw5 = 0; sw5 < 2; sw5++) {
          var sph2 = t * (0.55 + sw5 * 0.13) + sw5 * 3.1;
          var sxx = W * 0.5 + Math.sin(sph2) * W * 0.34;
          var syy = H * 0.52 + Math.sin(sph2 * 2.2 + 1) * H * 0.10 + Math.cos(t * 3.1 + sw5) * 8;
          ctx.save();
          ctx.translate(sxx, syy);
          if (Math.cos(sph2) < 0) ctx.scale(-1, 1);
          var swf = Math.sin(t * 11 + sw5) * 1.8;
          ctx.beginPath();
          ctx.moveTo(-5, -1); ctx.quadraticCurveTo(-1.5, -4 - swf, 1.5, -0.5);
          ctx.quadraticCurveTo(3.5, -2.5 - swf, 5.5, 0);
          ctx.stroke();
          ctx.beginPath();
          ctx.moveTo(-5, -1); ctx.lineTo(-7.5, 0.8);
          ctx.moveTo(-5, -1); ctx.lineTo(-7.2, -2.2);
          ctx.stroke();
          ctx.restore();
        }
      }

      // dandelion seeds on the updraft, in the warm half of the year
      var warm2 = sw(0) + sw(1);
      if (warm2 > 0.3) {
        ctx.strokeStyle = "rgba(240,238,230," + (0.5 * Math.min(1, warm2)) + ")";
        ctx.lineWidth = 0.7;
        for (var dd2 = 0; dd2 < (small ? 3 : 5); dd2++) {
          var du = ((t * 0.022 + dd2 * 0.21) % 1);
          var dxp = W * (0.1 + dd2 * (small ? 0.3 : 0.18)) + Math.sin(t * 0.6 + dd2 * 2) * 40;
          var dyp = H * 0.85 - du * H * 0.8;
          ctx.save();
          ctx.translate(dxp, dyp);
          ctx.rotate(Math.sin(t * 0.8 + dd2) * 0.5);
          ctx.globalAlpha = Math.sin(du * Math.PI) * 0.7;
          for (var fz = 0; fz < 6; fz++) {
            var fza = fz / 6 * 6.284;
            ctx.beginPath(); ctx.moveTo(0, 2.4);
            ctx.lineTo(Math.cos(fza) * 3.4, 2.4 - 4 - Math.sin(fza) * 0.001 * 0 - 3 * Math.abs(Math.sin(fza / 2)));
            ctx.stroke();
          }
          ctx.beginPath(); ctx.moveTo(0, 2.4); ctx.lineTo(0, 5.4); ctx.stroke();
          ctx.restore();
          ctx.globalAlpha = 1;
        }
      }
    } else {
      EGG.balloonRect = null;
      EGG.bannerRect = null;
      // a second field of stars, dense enough to lean back into
      if (starField2) {
        ctx.globalAlpha = gSkyS * Math.min(1, night * 1.4);
        ctx.drawImage(starField2, 0, 0);
        ctx.globalAlpha = 1;
      }
      // the Milky Way keeps the room whenever night does
      if (mwCanvas) {
        ctx.globalAlpha = gSkyS * (0.34 + 0.26 * gNightIdle);
        ctx.drawImage(mwCanvas, 0, 0);
        ctx.globalAlpha = 1;
      }
      // a satellite, crossing without comment
      var su2 = (t % 90) / 90;
      if (su2 < 0.5) {
        var stx = W * (su2 / 0.5);
        var sty = H * 0.10 + Math.sin(su2 * 3) * 20 + (stx / W) * 26;
        var blink2 = ((t * 2) % 1) < 0.12 ? 1 : 0.35;
        ctx.fillStyle = "rgba(220,224,232," + (0.7 * blink2 * gSkyS) + ")";
        ctx.fillRect(stx, sty, 1.6, 1.6);
      }
      // the constellation: a tree of stars, only for the patient
      if (gNightIdle > 0.5) {
        var cal = gSkyS * gNightIdle * 0.5;
        var pts = [[0.5, 0.62], [0.5, 0.5], [0.42, 0.42], [0.58, 0.4], [0.36, 0.32], [0.48, 0.3], [0.62, 0.3], [0.3, 0.24], [0.44, 0.2], [0.56, 0.18], [0.68, 0.22]];
        var links = [[0, 1], [1, 2], [1, 3], [2, 4], [2, 5], [3, 6], [4, 7], [5, 8], [6, 9], [6, 10]];
        ctx.strokeStyle = "rgba(224,200,160," + (cal * 0.35) + ")";
        ctx.lineWidth = 0.7;
        links.forEach(function (L2) {
          ctx.beginPath();
          ctx.moveTo(W * pts[L2[0]][0], H * pts[L2[0]][1]);
          ctx.lineTo(W * pts[L2[1]][0], H * pts[L2[1]][1]);
          ctx.stroke();
        });
        pts.forEach(function (P2, pi2) {
          var tw2 = 0.6 + Math.sin(t * 2 + pi2 * 1.7) * 0.4;
          ctx.fillStyle = "rgba(238,228,205," + (cal * (0.5 + tw2 * 0.5)) + ")";
          ctx.beginPath(); ctx.arc(W * P2[0], H * P2[1], 1.1 + tw2 * 0.7, 0, 6.284); ctx.fill();
        });
      }
    }
    ctx.restore();
  }

  /* a phone draws at 1.25 device pixels per css pixel: sharp enough for the
     line work, cheap enough for the fill. A phone that still cannot carry it
     is allowed to come down to 1, once, and stay there. */
  var DPRCap = 1.25;
  function applyDPR() {
    DPR = Math.min(small ? DPRCap : 1.5, window.devicePixelRatio || 1);
    canvas.width = W * DPR; canvas.height = H * DPR;
    canvas.style.width = W + "px"; canvas.style.height = H + "px";
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  }

  function resize() {
    W = stage.clientWidth; H = stage.clientHeight;
    skyPx = Math.round(H * 0.65);
    small = W < 720;
    applyDPR();

    branches.length = 0; tips.length = 0;
    rnd = mulberry(20260820);
    var baseY = H * 0.92;
    var unit = Math.min(H, W * 1.1);
    grow(W * 0.5, baseY, -Math.PI / 2 + 0.03, unit * 0.155, unit * 0.030, 0, 0);
    // normalise: the recursion above works in pixels already via scale
    renderTrunk();
    buildAntPath();
    renderRoots();
    buildGrass();
    buildWings();
    buildLeaves();
    // the geometry moved under everyone's feet: perches and pans must follow
    bird.state = 0; bird.next = performance.now() / 1000 + 10;
    perchIdx = -1; perch = null;
    OWL.on = false; OWL.tipIdx = -1;
    SWING.ax = 0;
    camX = clamp(camX, -wingW, wingW);
    camXs = clamp(camXs, -wingW, wingW);
    draw(lastP, performance.now());
  }

  /* -------------------------------------------------------------- sky */
  // phases: 0 morning ivory · .5 golden dusk · 1 blue night
  function skyColors(p) {
    var a = smooth(p * 1.6), b = smooth((p - 0.55) * 2.2);
    function mix3(c1, c2, c3) {
      return [
        Math.round(lerp(lerp(c1[0], c2[0], a), c3[0], b)),
        Math.round(lerp(lerp(c1[1], c2[1], a), c3[1], b)),
        Math.round(lerp(lerp(c1[2], c2[2], a), c3[2], b))
      ];
    }
    return {
      top: mix3([236, 232, 222], [225, 188, 148], [24, 30, 44]),
      bot: mix3([214, 212, 200], [204, 148, 104], [38, 44, 58]),
      haze: mix3([200, 200, 190], [190, 140, 100], [30, 36, 50])
    };
  }
  var rgb = function (c, al) { return "rgba(" + c[0] + "," + c[1] + "," + c[2] + "," + (al == null ? 1 : al) + ")"; };
  /* each season owns its night */
  var NIGHTS = [
    { top: [38, 28, 52], bot: [54, 42, 66] },    // spring: violet
    { top: [22, 28, 46], bot: [36, 42, 62] },    // summer: deep blue
    { top: [30, 22, 34], bot: [46, 34, 44] },    // autumn: plum
    { top: [14, 20, 36], bot: [24, 32, 50] }     // winter: cold steel
  ];
  function nightMix(c, isTop) {
    if (gNightIdle < 0.01) return c;
    var acc = [0, 0, 0];
    for (var k = 0; k < 4; k++) {
      var wgt = sw(k), n = isTop ? NIGHTS[k].top : NIGHTS[k].bot;
      acc[0] += n[0] * wgt; acc[1] += n[1] * wgt; acc[2] += n[2] * wgt;
    }
    return [lerp(c[0], acc[0], gNightIdle * 0.92) | 0,
            lerp(c[1], acc[1], gNightIdle * 0.92) | 0,
            lerp(c[2], acc[2], gNightIdle * 0.92) | 0];
  }

  /* -------------------------------------------------------------- draw */
  var lastP = 0;
  var treeGrowT = 0;
  /* while a reseeded tree is still growing, everything that sits on a branch
     must ride the same scale-about-the-base transform the trunk uses */
  function growTipXY(px, py) {
    var s = treeGrowT ? 0.15 + 0.85 * smooth(Math.min(1, (performance.now() - treeGrowT) / 1800)) : 1;
    if (s >= 1) return { x: px, y: py };
    return { x: W / 2 + (px - W / 2) * s, y: H * 0.92 + (py - H * 0.92) * s };
  }

  function draw(p, now) {
    lastP = p;
    var t = now * 0.001;
    var wind = reduced ? 0 : Math.sin(t * 0.9) * 0.35 + Math.sin(t * 0.23) * 0.3;
    var gust = smooth((p - 0.10) / 0.30);           // wind rises as the film moves
    var descend = smooth((p - 0.66) / 0.30);        // the camera goes underground
    var sk = skyColors(p);
    var camY = ease(descend) * H * 1.12;    // how deep the camera has gone
    var night = Math.max(smooth((p - 0.52) / 0.3), gNightIdle * 0.9) * (1 - smooth((descend - 0.5) / 0.4));

    // sky
    // seasons tint the daylight, the idle night takes it over
    var tinted = { top: sk.top.slice(), bot: sk.bot.slice(), haze: sk.haze };
    var wSpr = sw(0), wWin = sw(3), wAut2 = sw(2);
    function tint(c, tc, a) { return [lerp(c[0], tc[0], a) | 0, lerp(c[1], tc[1], a) | 0, lerp(c[2], tc[2], a) | 0]; }
    if (wSpr > 0) { tinted.top = tint(tinted.top, [244, 216, 224], wSpr * 0.30); tinted.bot = tint(tinted.bot, [238, 206, 212], wSpr * 0.22); }
    if (wWin > 0) { tinted.top = tint(tinted.top, [204, 214, 226], wWin * 0.55); tinted.bot = tint(tinted.bot, [190, 200, 212], wWin * 0.45); }
    if (wAut2 > 0 && p < 0.3) { tinted.top = tint(tinted.top, [238, 202, 158], wAut2 * 0.30); tinted.bot = tint(tinted.bot, [228, 186, 140], wAut2 * 0.28); }
    tinted.top = nightMix(tinted.top, true);
    tinted.bot = nightMix(tinted.bot, false);
    var g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, rgb(tinted.top));
    g.addColorStop(1, rgb(tinted.bot));
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);

    parSm += (((pointer.x > 0 ? (pointer.x - W / 2) : 0)) - parSm) * 0.03;
    var parX = parSm;
    var hazeN = nightMix(sk.haze.slice(), false);
    var skyLift = gSkyS * H * 0.62;
    EGG.view = { x: camXs, y: skyLift };
    ctx.save();                                   // ── world: pans and lifts
    ctx.translate(-camXs, skyLift);
    ctx.save();
    ctx.translate(0, -camY);

    // the sun keeps its hours: east in the morning, west by evening.
    // it lives high in the sky room, and from the cover only its warmth shows
    var sunA = (1 - Math.min(1, night * 1.35)) * (1 - smooth(descend * 1.4));
    if (sunA > 0.02) {
      var sunX = W * (0.5 + SUN * 0.36);
      var sunY = -H * 0.30;
      var shg = ctx.createRadialGradient(sunX, sunY, 0, sunX, sunY, H * 0.34);
      shg.addColorStop(0, "rgba(242,212,150," + (0.42 * sunA) + ")");
      shg.addColorStop(0.4, "rgba(238,200,132," + (0.13 * sunA) + ")");
      shg.addColorStop(1, "rgba(238,200,132,0)");
      ctx.fillStyle = shg;
      ctx.fillRect(sunX - H * 0.34, sunY - H * 0.34, H * 0.68, H * 0.68);
      ctx.fillStyle = "rgba(240,206,138," + (0.5 * sunA) + ")";
      ctx.beginPath(); ctx.arc(sunX, sunY, 23, 0, 6.284); ctx.fill();
      ctx.fillStyle = "rgba(250,240,212," + (0.95 * sunA) + ")";
      ctx.beginPath(); ctx.arc(sunX, sunY, 17, 0, 6.284); ctx.fill();
      ctx.strokeStyle = "rgba(224,170,96," + (0.30 * sunA) + ")";
      ctx.lineWidth = 1;
      ctx.beginPath(); ctx.arc(sunX, sunY, 19.5, 0, 6.284); ctx.stroke();
      // three long rays, barely there, wheeling with the hour
      if (gSkyS > 0.05) {
        ctx.save();
        ctx.translate(sunX, sunY);
        ctx.rotate(now * 0.001 * 0.016);
        ctx.strokeStyle = "rgba(242,212,150," + (0.05 * sunA * gSkyS) + ")";
        ctx.lineCap = "round";
        for (var ry5 = 0; ry5 < 3; ry5++) {
          ctx.rotate(2.0944);
          ctx.lineWidth = 30;
          ctx.beginPath(); ctx.moveTo(46, 0); ctx.lineTo(H * 0.52, 0); ctx.stroke();
        }
        ctx.restore();
      }
    }

    // far hills: deepest plane moves most against the cursor
    ctx.save();
    ctx.translate(-parX * 0.010 + camXs * 0.62, 0);
    ctx.fillStyle = rgb(hazeN, 0.30);
    hill(H * 0.82, 26, 0.0009, 8);
    ctx.fillStyle = rgb(hazeN, 0.45);
    hill(H * 0.865, 16, 0.0014, 40);
    // depth haze: the far ground breathes
    var fog = ctx.createLinearGradient(0, H * 0.76, 0, H * 0.885);
    fog.addColorStop(0, rgb(hazeN, 0));
    fog.addColorStop(1, rgb(hazeN, 0.30));
    ctx.fillStyle = fog;
    ctx.fillRect(-wingW - 60, H * 0.76, W + wingW * 2 + 120, H * 0.13);
    ctx.restore();

    // a rainbow, if the rain has just moved on
    if (RAIN.on > 0.5) RAINBOW.armed = true;
    else if (RAINBOW.armed && RAIN.on < 0.25 && night < 0.4 && descend < 0.2) {
      RAINBOW.t0 = t; RAINBOW.armed = false;
    }
    var rbAge = t - RAINBOW.t0;
    if (rbAge > 0 && rbAge < 15 && descend < 0.3) {
      var rbA = Math.min(1, rbAge / 2.5) * (rbAge > 11 ? (15 - rbAge) / 4 : 1) * (1 - night);
      if (rbA > 0.02) {
        var RBC = [[196,120,116],[206,150,96],[206,184,100],[150,174,112],[112,158,166],[122,132,176],[148,120,168]];
        ctx.save();
        ctx.lineWidth = 5;
        for (var rb = 0; rb < 7; rb++) {
          ctx.strokeStyle = "rgba(" + RBC[rb][0] + "," + RBC[rb][1] + "," + RBC[rb][2] + "," + (0.11 * rbA) + ")";
          ctx.beginPath();
          ctx.arc(W * 0.6, H * 1.18, H * 0.78 + rb * 5, Math.PI * 1.08, Math.PI * 1.92);
          ctx.stroke();
        }
        ctx.restore();
      }
    }
    ctx.save();

    // ground: real soil from the first frame, so the descent has nowhere to jump
    ctx.drawImage(rootCanvas, 0, H * 0.885, W, H * 1.25);
    if (night > 0.03) {
      ctx.fillStyle = "rgba(22,25,42," + (0.26 * night) + ")";
      ctx.fillRect(0, H * 0.885, W, H * 1.25);
    }
    var gg = ctx.createLinearGradient(0, H * 0.875, 0, H * 0.9);
    gg.addColorStop(0, rgb(sk.bot, 0));
    gg.addColorStop(1, rgb([sk.bot[0] * 0.72 | 0, sk.bot[1] * 0.72 | 0, sk.bot[2] * 0.62 | 0], 0.55));
    ctx.fillStyle = gg;
    ctx.fillRect(0, H * 0.875, W, H * 0.9 - H * 0.875 + 2);

    // the tree's shadow follows the sun
    groundShadow(W / 2, 150, 0.30 * (1 - Math.max(night, gNightIdle) * 0.7));

    // trunk, with a whisper of sway (and, after a reseed, a visible growing)
    var growS = treeGrowT ? smooth(Math.min(1, (now - treeGrowT) / 1800)) : 1;
    ctx.save();
    ctx.translate(W / 2, H * 0.92);
    ctx.scale(0.15 + 0.85 * growS, 0.15 + 0.85 * growS);
    ctx.rotate(wind * 0.004 * (1 + gust));
    ctx.translate(-W / 2, -H * 0.92);
    ctx.drawImage(trunkCanvas, 0, 0, W, H);
    var wWinT = sw(3);
    if (wWinT > 0.4 && p < 0.55) {
      ctx.strokeStyle = "rgba(236,239,238," + (0.42 * wWinT) + ")";
      ctx.lineCap = "round";
      for (var sb = 0; sb < branches.length; sb++) {
        var B3 = branches[sb];
        if (B3.w < 2.4) continue;
        ctx.lineWidth = Math.max(0.8, B3.w * 0.26);
        ctx.beginPath();
        ctx.moveTo(B3.x1, B3.y1 - B3.w * 0.34 - 0.6);
        ctx.quadraticCurveTo(B3.cx, B3.cy - B3.w * 0.3 - 0.6, B3.x2, B3.y2 - B3.w * 0.3 - 0.6);
        ctx.stroke();
      }
    }
    ctx.restore();

    ctx.restore();
    ctx.globalAlpha = 1;

    // the canopy holds until the tree actually leaves the frame
    var treeOff = clamp((Math.abs(camXs) - W * 0.45) / (W * 0.35), 0, 1);
    gLeafFade = 1 - treeOff * 0.95;
    // canopy depth: baked occlusion layer, faded as the leaves go,
    // and tied to the leaves' own fades so it never hangs as smoke alone
    var canopyAlive = (1 - smooth((p - 0.14) / 0.5)) * gLeafFade * growS * growS * growS;
    if (canopyAlive > 0.02 && aoCanvas) {
      ctx.globalAlpha = canopyAlive;
      ctx.drawImage(aoCanvas, 0, 0, W, H);
      ctx.globalAlpha = 1;

    // leaves, back depth first
    ctx.save();
    if (growS < 1) {
      ctx.translate(W / 2, H * 0.92);
      ctx.scale(0.15 + 0.85 * growS, 0.15 + 0.85 * growS);
      ctx.translate(-W / 2, -H * 0.92);
      ctx.globalAlpha = growS;
    }
    var leafDim = Math.min(0.72, Math.max(
      Math.max(smooth((p - 0.52) / 0.3), gNightIdle * 0.9) * 0.6,
      smooth((descend - 0.15) / 0.45) * 0.72));
    for (var pass = 0; pass < 2; pass++) {
      for (var i = 0; i < N; i++) {
        var L = LEAVES[i];
        if ((pass === 0) !== (L.depth < 6)) continue;
        drawLeaf(L, p, t, wind, gust, pass, leafDim);
      }
    }

    ctx.restore();
    ctx.restore();

    // clouds, drifting through the day
    if (cloudSprite && night < 0.85) {
      var cAl = (1 - night) * (1 - smooth(descend * 1.4)) * 0.55;
      if (cAl > 0.02) {
        ctx.globalAlpha = cAl;
        var cSpan = W + wingW * 2 + 460;
        var c1x = ((t * 7) % cSpan) - wingW - 400;
        var c2x = ((t * 4.4 + W * 0.6) % cSpan) - wingW - 420;
        ctx.drawImage(cloudSprite, c1x, H * 0.055, 340, 112);
        ctx.drawImage(cloudSprite, c2x, H * 0.20, 250, 84);
        ctx.globalAlpha = 1;
      }
    }
    // now and then, a far flock crosses
    var flockT = (t % 47) / 47;
    if (flockT > 0.3 && flockT < 0.5 && night < 0.5 && descend < 0.3) {
      var fp2 = (flockT - 0.3) / 0.2;
      ctx.strokeStyle = "rgba(60,52,44," + (0.5 * (1 - night)) + ")";
      ctx.lineWidth = 1.1;
      for (var fb = 0; fb < 5; fb++) {
        var fx3 = W * (1.05 - fp2 * 1.15) + fb * 16 + (fb % 2) * 7;
        var fy3 = H * 0.14 + fb * 5 + Math.sin(t * 3 + fb) * 2;
        var flap = Math.sin(t * 9 + fb) * 2.6;
        ctx.beginPath();
        ctx.moveTo(fx3 - 4, fy3 - flap);
        ctx.quadraticCurveTo(fx3, fy3 + 1.6, fx3 + 4, fy3 - flap);
        ctx.stroke();
      }
    }

    // stars, arriving with the night: one baked field, faded in
    if (night > 0.01 && starField) {
      ctx.globalAlpha = night;
      ctx.drawImage(starField, 0, 0);
      ctx.globalAlpha = 1;
    }

    // foreground grass: a darker strip in front of the trunk line.
    // it belongs to the meadow, so it rides the camera down and is gone
    // before the eye could catch it detached from the ground line
    var fgVis = (1 - smooth(descend * 1.35)) * (1 - clamp(camY / (H * 0.28), 0, 1));
    if (fgVis > 0.02 && grassFrames.length) {
      ctx.save();
      ctx.translate(0, -camY);
      ctx.globalAlpha = fgVis * 0.9;
      ctx.filter = "brightness(0.75)";
      var gfF = grassFrames[(((now * 0.001) * 2) | 0) % 3];
      ctx.drawImage(gfF, 0, H * 0.893 - 25, W, 26 * 1.12);
      ctx.filter = "none";
      ctx.globalAlpha = 1;
      ctx.restore();
    }

    // the cities, either side of the meadow
    if (camXs * camXs > 1 && wingL) {
      var wingNight = Math.max(night, gNightIdle);
      ctx.drawImage(wingL, -wingW, 0, wingW, H);
      ctx.drawImage(wingR, W, 0, wingW, H);
      if (wingNight > 0.02 && wingLN) {
        ctx.globalAlpha = wingNight;
        ctx.drawImage(wingLN, -wingW, 0, wingW, H);
        ctx.drawImage(wingRN, W, 0, wingW, H);
        ctx.globalAlpha = 1;
      }
      drawWingLife(now * 0.001, wingNight);
      // beyond the cities, only haze
      var edgeL2 = ctx.createLinearGradient(-wingW + 150, 0, -wingW, 0);
      edgeL2.addColorStop(0, rgb(hazeN, 0));
      edgeL2.addColorStop(1, rgb(hazeN, 0.5));
      ctx.fillStyle = edgeL2;
      ctx.fillRect(-wingW, 0, 150, H);
      var edgeR2 = ctx.createLinearGradient(W + wingW - 150, 0, W + wingW, 0);
      edgeR2.addColorStop(0, rgb(hazeN, 0));
      edgeR2.addColorStop(1, rgb(hazeN, 0.5));
      ctx.fillStyle = edgeR2;
      ctx.fillRect(W + wingW - 150, 0, 150, H);
    } else {
      EGG.ferryRect = EGG.kirkRect = EGG.mugRect = null;
      EGG.pierSignRect = EGG.ubahnRect = null;
    }
    drawSkyRoom(now * 0.001, night, skyLift);

    drawCreatures(now * 0.001, descend, camY);
    drawArchive(now * 0.001, descend, camY);
    drawExtras(now * 0.001, p, descend, camY, night, gust, wind);

    // a landmark was asked about: its caption lingers three seconds
    if (CAPFX.until > t) {
      var cfLeft = CAPFX.until - t;
      var cfA = Math.min(1, cfLeft / 0.4) * Math.min(1, (3 - cfLeft) / 0.25 + 0.2);
      ctx.save();
      ctx.globalAlpha = Math.max(0, Math.min(1, cfA));
      ctx.font = "italic 12.5px Georgia";
      var cfLns = capWrap(CAPFX.text, W * 0.78);
      var cfLw = 0;
      for (var cf2 = 0; cf2 < cfLns.length; cf2++) {
        cfLw = Math.max(cfLw, ctx.measureText(cfLns[cf2]).width);
      }
      var cfw = cfLw + 18;
      var cfh = 8 + cfLns.length * 16;
      var cfx = clamp(CAPFX.x, camXs + cfw / 2 + 8, camXs + W - cfw / 2 - 8);
      var cfy = clamp(CAPFX.y - 16 - cfh, 12 - skyLift, H - cfh - 16 - skyLift);
      ctx.fillStyle = "rgba(20,14,8,.88)";
      ctx.strokeStyle = "rgba(224,170,96,.35)";
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.roundRect(cfx - cfw / 2, cfy, cfw, cfh, 4);
      ctx.fill(); ctx.stroke();
      ctx.fillStyle = "rgba(233,226,210,.92)";
      for (var cf3 = 0; cf3 < cfLns.length; cf3++) {
        ctx.fillText(cfLns[cf3], cfx - cfw / 2 + 9, cfy + 17 + cf3 * 16);
      }
      ctx.restore();
    }
    ctx.restore();                                // ── end of the world wrap

    // dusk vignette + grain
    var v = ctx.createRadialGradient(W / 2, H * 0.45, H * 0.3, W / 2, H * 0.5, H * 0.95);
    v.addColorStop(0, "rgba(0,0,0,0)");
    v.addColorStop(1, "rgba(10,10,16," + (0.12 + p * 0.25) + ")");
    ctx.fillStyle = v;
    ctx.fillRect(0, 0, W, H);
  }

  function hill(y, amp, freq, ph) {
    var x0 = -wingW - 60, x1 = W + wingW + 60;
    ctx.beginPath();
    ctx.moveTo(x0, H);
    for (var x = x0; x <= x1; x += 12) {
      ctx.lineTo(x, y + Math.sin(x * freq * 6.28 + ph) * amp * 0.4
                    + Math.sin(x * freq * 17 + ph * 1.7) * amp * 0.2);
    }
    ctx.lineTo(x1, H);
    ctx.closePath();
    ctx.fill();
  }



  function drawLeaf(L, p, t, wind, gust, front, dim) {
    // colour: green → its own autumn shade, each on its own schedule
    var turn = smooth((p - L.turn * 0.42) / 0.24);
    turn = Math.max(turn, sw(2) * 0.9);               // an autumn tree starts turned
    var gc = GREENS_RGB[L.gi], ac = AUTUMN_RGB[L.ai];
    var r = lerp(gc[0], ac[0], turn) | 0,
        gr = lerp(gc[1], ac[1], turn) | 0,
        b = lerp(gc[2], ac[2], turn) | 0;
    var spr = sw(0);
    if (spr > 0 && L.gi % 3 === 0) {                  // spring: a third of the canopy blossoms
      var bc2 = BLOSSOM_RGB[L.ai % BLOSSOM_RGB.length];
      r = lerp(r, bc2[0], spr) | 0; gr = lerp(gr, bc2[1], spr) | 0; b = lerp(b, bc2[2], spr) | 0;
    }
    var win = sw(3);
    var grounded = (p - L.detach) / L.dur >= 1;
    if (win > 0) {
      // on the branch, frost takes the colour; on the ground it only dusts
      var wtc = grounded ? [158, 146, 120] : WINTER_RGB;
      var wamt = win * (grounded ? 0.34 : 0.75);
      r = lerp(r, wtc[0], wamt) | 0;
      gr = lerp(gr, wtc[1], wamt) | 0;
      b = lerp(b, wtc[2], wamt) | 0;
    }
    if (EGG.blossom > 0) {                            // 3523: the tree remembers spring
      var bc = BLOSSOM_RGB[L.ai % BLOSSOM_RGB.length];
      r = lerp(r, bc[0], EGG.blossom) | 0;
      gr = lerp(gr, bc[1], EGG.blossom) | 0;
      b = lerp(b, bc[2], EGG.blossom) | 0;
    }

    var f = clamp((p - L.detach) / L.dur, 0, 1);   // fall phase 0..1
    var x, y, rot, alpha = 1;

    if (f <= 0) {
      // attached: sway with its branch
      var s = Math.sin(t * 1.7 + L.phase) * (1.5 + L.sway * 18) * (0.4 + gust) * (reduced ? 0 : 1);
      x = L.ax + s + wind * L.sway * 26 * gust;
      y = L.ay + Math.cos(t * 1.3 + L.phase) * 1.2;
      rot = L.tilt + s * 0.02;
    } else if (f < 1) {
      // falling: drift is deterministic in f, flutter layered on top
      var fe = ease(f);
      var dx = L.driftA * 90 * fe + Math.sin(f * 9 + L.driftB) * 22 * (1 - f * 0.4);
      x = lerp(L.ax, L.gx, fe * 0.55) + dx;
      y = lerp(L.ay, L.gy, f * f * (3 - 2 * f));
      rot = L.tilt + f * L.spin;
    } else {
      // grounded: it stays where it fell
      x = L.gx; y = L.gy; rot = L.tilt + L.spin;
    }

    var sz = L.size * (front ? 1 : 0.8);
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(rot);
    var winterKeep = 1;
    // winter hides most leaves on the branch AND on the way down: a leaf that
    // never showed must not pop into existence just because it let go
    if (f < 1 && win > 0.55 && (L.ai % 6) !== 0) {
      winterKeep = clamp(1 - (win - 0.55) / 0.25, 0, 1);
      if (winterKeep <= 0.02) { ctx.restore(); ctx.globalAlpha = 1; return; }
    }
    ctx.globalAlpha = alpha * (front ? 1 : 0.75) * gLeafFade * winterKeep;
    if (dim > 0.01) {
      var dk = 1 - dim * 0.62;
      r = (r * dk) | 0; gr = (gr * dk) | 0; b = (b * dk) | 0;
    }
    ctx.fillStyle = "rgb(" + r + "," + gr + "," + b + ")";
    // a leaf: two arcs meeting at a point
    ctx.beginPath();
    ctx.moveTo(0, -sz);
    ctx.quadraticCurveTo(sz * 0.7, -sz * 0.2, 0, sz);
    ctx.quadraticCurveTo(-sz * 0.7, -sz * 0.2, 0, -sz);
    ctx.fill();
    // midrib, only where it can be seen; on a phone leaf it never can
    if (front && sz > 5.6 && !small) {
      ctx.strokeStyle = "rgba(0,0,0,.18)";
      ctx.lineWidth = 0.6;
      ctx.beginPath(); ctx.moveTo(0, -sz * 0.8); ctx.lineTo(0, sz * 0.8); ctx.stroke();
    }
    ctx.restore();
    ctx.globalAlpha = 1;
  }

  /* ------------------------------------------- the underground is inhabited
     A column of ants follows one of the main roots, and every so often a
     mole surfaces near the doors, looks around, and thinks better of it.
     Time-based, world-space, and only drawn once the camera is down there. */
  var antPaths = [];          // [0] is the trunk gallery; the rest fork off it
  function buildAntPath() {
    antPaths.length = 0;
    var y0 = H * 0.885;
    // trunk gallery: in from the lower-left edge, working right and down
    var trunk = [];
    for (var i = 0; i <= 40; i++) {
      var u = i / 40;
      trunk.push({
        x: W * 0.03 + u * W * 0.31 + Math.sin(u * 4.2) * W * 0.03,
        y: y0 + H * 0.76 + Math.sin(u * 6.5 + 1.3) * H * 0.045 + u * H * 0.055
      });
    }
    antPaths.push(trunk);
    // side galleries: each forks from a point on the trunk and wanders off
    [[0.30, -0.085, 0.075], [0.55, 0.095, 0.115], [0.80, -0.075, 0.095]]
      .forEach(function (F, fi) {
        var start = trunk[(F[0] * 40) | 0];
        var br = [];
        for (var j = 0; j <= 22; j++) {
          var v = j / 22;
          br.push({
            x: start.x + v * W * F[2] + Math.sin(v * 5 + fi * 2.1) * W * 0.012,
            y: start.y + v * H * F[1] + Math.sin(v * 7 + fi) * H * 0.014
          });
        }
        antPaths.push(br);
      });
  }
  function drawCreatures(t, descend, camY) {
    if (reduced || descend < 0.12) return;
    var vis = smooth((descend - 0.12) / 0.3);
    ctx.save();
    ctx.translate(0, -camY);

    // ants: a working line, each with its own gait
    var antFrozen = antPause > 0 && t - antPause < 2.4;
    var LANE = [0, 0, 1, 0, 2, 0, 3];       // most traffic keeps to the trunk
    for (var a = 0; a < 16; a++) {
      var path = antPaths[LANE[a % LANE.length]] || antPaths[0];
      if (!path) break;
      var last2 = path.length - 1;
      var tA = antFrozen ? antPause : t;
      var u = ((tA * 0.014 * (1 + (a % 3) * 0.12) + a * 0.073) % 1.04) - 0.02;
      if (u < 0 || u > 1) continue;
      var idx = u * (last2 - 0.01);
      var i0 = idx | 0;
      var f = idx - i0;
      var P0 = path[i0], P1 = path[Math.min(last2, i0 + 1)];
      var ax = lerp(P0.x, P1.x, f), ay = lerp(P0.y, P1.y, f);
      ay += Math.sin((antFrozen ? tA : t) * 22 + a * 3) * 0.5;   // gait wobble
      var ang = Math.atan2(P1.y - P0.y, P1.x - P0.x);
      ctx.save();
      ctx.translate(ax, ay);
      ctx.rotate(ang);
      // legs first, then the body over them
      ctx.strokeStyle = "rgba(24,15,8," + (0.85 * vis) + ")";
      ctx.lineWidth = 0.7;
      var step = Math.sin(t * 26 + a * 2);
      for (var lg = -1; lg <= 1; lg++) {
        ctx.beginPath();
        ctx.moveTo(lg * 1.4, 0);
        ctx.lineTo(lg * 1.4 + step * 1.2, 3.1);
        ctx.moveTo(lg * 1.4, 0);
        ctx.lineTo(lg * 1.4 - step * 1.2, -3.1);
        ctx.stroke();
      }
      // every third ant carries a scrap of leaf home
      if (a % 3 === 0) {
        ctx.fillStyle = "rgba(95,138,78," + (0.85 * vis) + ")";
        ctx.beginPath(); ctx.ellipse(1.2, -2.8, 2.6, 1.5, 0.4, 0, 6.284); ctx.fill();
      }
      ctx.fillStyle = "rgba(26,16,8," + (0.95 * vis) + ")";
      ctx.beginPath(); ctx.ellipse(-2.4, 0, 2.2, 1.5, 0, 0, 6.284); ctx.fill();   // abdomen
      ctx.beginPath(); ctx.ellipse(0.4, 0, 1.4, 1.1, 0, 0, 6.284); ctx.fill();    // thorax
      ctx.beginPath(); ctx.arc(2.6, 0, 1.2, 0, 6.284); ctx.fill();                // head
      ctx.strokeStyle = "rgba(26,16,8," + (0.7 * vis) + ")";
      ctx.beginPath(); ctx.moveTo(3.4, -0.6); ctx.lineTo(4.6, -1.6); ctx.stroke(); // antennae
      ctx.beginPath(); ctx.moveTo(3.4, 0.6); ctx.lineTo(4.6, 1.6); ctx.stroke();
      // a faint highlight so they read against the dark
      ctx.fillStyle = "rgba(224,170,96," + (0.14 * vis) + ")";
      ctx.beginPath(); ctx.ellipse(-2.4, -0.7, 1.6, 0.5, 0, 0, 6.284); ctx.fill();
      ctx.restore();
    }

    /* the rabbit sleeps through everything, breathing slowly */
    var rbx = W * 0.06, rby = H * 0.885 + H * 1.25 * 0.175 + 3;
    var rCol = "rgba(122,100,78," + (0.95 * vis) + ")";
    ctx.save();
    ctx.translate(rbx, rby);
    var breathe = 1.02 + Math.sin(t * 0.9) * 0.02;
    ctx.scale(breathe, breathe);
    ctx.fillStyle = rCol;
    ctx.beginPath(); ctx.ellipse(0, 0, 12, 7.6, 0, 0, 6.284); ctx.fill();     // curled body
    ctx.beginPath(); ctx.arc(8, 1.8, 4.8, 0, 6.284); ctx.fill();              // tucked head
    ctx.strokeStyle = "rgba(60,46,32," + (0.5 * vis) + ")"; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.arc(-3, 0.5, 6.5, -0.6, 1.4); ctx.stroke();          // haunch line
    var etw = (t % 7) < 0.35 ? Math.sin(((t % 7) / 0.35) * Math.PI) * 0.35 : 0;
    ctx.save();                                                                // the long ear, twitching
    ctx.translate(5.5, -3);
    ctx.rotate(-2.05 + etw);
    ctx.fillStyle = rCol;
    ctx.beginPath(); ctx.ellipse(0, -6, 2.5, 6.8, 0, 0, 6.284); ctx.fill();
    ctx.fillStyle = "rgba(196,150,140," + (0.4 * vis) + ")";
    ctx.beginPath(); ctx.ellipse(0, -6, 1.1, 4.4, 0, 0, 6.284); ctx.fill();
    ctx.restore();
    ctx.strokeStyle = "rgba(20,14,8," + (0.8 * vis) + ")"; ctx.lineWidth = 0.8;
    ctx.beginPath(); ctx.arc(9.4, 1.2, 1.4, 0.4, 2.4); ctx.stroke();          // an eye, closed
    ctx.fillStyle = "rgba(214,202,184," + (0.75 * vis) + ")";
    ctx.beginPath(); ctx.arc(-11.4, -1.4, 2.3, 0, 6.284); ctx.fill();         // the tail puff
    ctx.restore();

    /* two earthworms inch along their tunnels, unhurried */
    for (var ww = 0; ww < 2; ww++) {
      var wpx = ww === 0 ? W * 0.30 : W * 0.68;
      var wpy = H * 0.885 + H * 1.25 * (ww === 0 ? 0.30 : 0.52);
      var headX = wpx + Math.sin(t * 0.09 + ww * 2.6) * 20;
      // the tunnel, barely worked
      ctx.strokeStyle = "rgba(96,74,48," + (0.16 * vis) + ")";
      ctx.lineWidth = 4.4; ctx.lineCap = "round";
      ctx.beginPath();
      ctx.moveTo(wpx - 34, wpy + Math.sin(t * 0 + ww) * 0);
      ctx.quadraticCurveTo(wpx, wpy + 2.5, wpx + 34, wpy - 1);
      ctx.stroke();
      // the worm: segments squeezing forward
      ctx.strokeStyle = "rgba(168,120,102," + (0.45 * vis) + ")";
      ctx.lineWidth = 2.2;
      ctx.beginPath();
      for (var sgw = 0; sgw <= 7; sgw++) {
        var su = sgw / 7;
        var squish = 1 + Math.sin(t * 2.2 + ww * 2 - su * 3.5) * 0.18;
        var wxs = headX - su * 13 * squish;
        var wys = wpy + Math.sin(su * 6 + t * 0.4 + ww) * 1.6;
        if (sgw === 0) ctx.moveTo(wxs, wys); else ctx.lineTo(wxs, wys);
      }
      ctx.stroke();
      // the saddle band
      ctx.strokeStyle = "rgba(196,150,132," + (0.4 * vis) + ")";
      ctx.lineWidth = 2.6;
      ctx.beginPath();
      ctx.moveTo(headX - 4.5, wpy + Math.sin(0.35 * 6 + t * 0.4 + ww) * 1.6 - 0.5);
      ctx.lineTo(headX - 6.5, wpy + Math.sin(0.5 * 6 + t * 0.4 + ww) * 1.6 + 0.5);
      ctx.stroke();
    }

    // the mole: a 24 s cycle. mound swells, snout appears, sniffs, withdraws
    var cyc = (t % 24) / 24;
    var mx = W * 0.78, my = H * 0.885 + H * 0.94;
    var up = 0;
    if (cyc > 0.30 && cyc < 0.42) up = smooth((cyc - 0.30) / 0.12);
    else if (cyc >= 0.42 && cyc < 0.62) up = 1;
    else if (cyc >= 0.62 && cyc < 0.72) up = 1 - smooth((cyc - 0.62) / 0.10);
    EGG.moleRect = up > 0.4 ? { x: mx - 22, y: my - 34 - camY, w: 44, h: 46 } : null;
    MOLEUP = up;
    if (up === 0) {
      // the settled mound stays while its critic reads below
      for (var md2 = 2; md2 >= 0; md2--) {
        ctx.fillStyle = "rgba(" + (40 + md2 * 8) + "," + (29 + md2 * 6) + "," + (16 + md2 * 4) + "," + (0.85 * vis) + ")";
        ctx.beginPath();
        ctx.ellipse(mx, my + 6 + md2 * 1.2, (24 - md2 * 4) * 0.7, (7 - md2 * 1.4) * 0.55, 0, Math.PI, 0);
        ctx.fill();
      }
    }
    if (up > 0) {
      var mound = smooth(Math.min(1, up * 1.4));
      // the mound: layered loose earth with speckle
      for (var md = 2; md >= 0; md--) {
        ctx.fillStyle = "rgba(" + (40 + md * 8) + "," + (29 + md * 6) + "," + (16 + md * 4) + "," + (0.9 * vis) + ")";

          ctx.save();
          ctx.translate(shx, shy + 0.5);
          ctx.fillStyle = "rgba(120,96,64,.8)";                       // pegs

    /* two butterflies in the warm half of the year, working the wildflowers */
    var wWarmB = sw(0) + sw(1);
    if (wWarmB > 0.15 && groundVis > 0.02 && night < 0.5) {
      var bAl = wWarmB * groundVis * (1 - night) * (1 - RAIN.on);

        for (var bf = 0; bf < 2; bf++) {

    }
    HOUSE.doorOpen += ((GUY.state === "enterHouse" || GUY.state === "exitHouse" ? 1 : 0) - HOUSE.doorOpen) * 0.12;
    ctx.restore();   // ── end of meadow ride, part one

      }

    } else if (sw(3) < 0.1) SNOWMAN.stage = 0;   // spring takes it, quietly
    EGG.snowRect = (sw(3) > 0.4 && SNOWMAN.stage === 0 && groundVis > 0.4)
      ? { x: W * 0.24 - 20, y: guyGround() - 16, w: 40, h: 18 } : null;

    ctx.globalAlpha = groundVis;

      ctx.strokeStyle = "#4a6a3a"; ctx.lineWidth = 1.4;
      ctx.beginPath(); ctx.moveTo(S.x, guyGround());
      ctx.quadraticCurveTo(S.x + 1, guyGround() - 7 * age, S.x, guyGround() - 13 * age); ctx.stroke();

    });

    /* the acorn a squirrel dropped */
    if (ACORN) {
      if (!ACORN.landed) {

    if (SQUIRREL.state === 1) {
      var sq = (t - SQUIRREL.t0) / 1.6;
      if (sq >= 1) {
        SQUIRREL.state = 0;
        if (!ACORN) ACORN = { x: W * 0.5 + 40 + (t % 1) * 60, y: H * 0.5, vy: 0, landed: false };
      } else {
        var sqy = lerp(guyGround() - 10, H * 0.47, smooth(sq));
        var sqx = W * 0.5 + Math.sin(sq * 9) * 6;      // spiralling up the bark
        ctx.save();
        ctx.translate(sqx, sqy);

        ctx.beginPath(); ctx.arc(2, -4, 2.4, 0, 6.284); ctx.fill();

    var owlNight = Math.max(night, gNightIdle);
    if (owlNight > 0.5 && p < 0.8 && !OWL.on && (t % 30) < 0.05) {

    if (OWL.on && OWL.tipIdx >= 0 && tips.length) {

    if (owlNight > 0.5 && t - STAR.t0 > 34 && ((t * 7) % 13) < 0.03) {

    if (stp > 0 && stp < 1) {

        var cfy = ((cf * 83.7 + t * (46 + cf % 7 * 16)) % (H * 0.8));

    /* the wooden swing on the lowest left branch: it waits, mostly */

    } else EGG.swingRect = null;

    /* the man: his life runs whether you watch or not; only the drawing fades */
    {
      var gy4 = guyGround();

      if (GUY.state !== "away" && GUY.state !== "home" && GUY.state !== "held" && GUY.state !== "falling")

      var wantsChange = GUY.outfit !== seasonCur;
      var rainingHere = RAIN.on > 0.3;

      if (rainingHere && !GUY.wet && GUY.state !== "enterHouse" && GUY.state !== "home") GUY.prop = "umbrella";
      if (RAIN.on < 0.1) GUY.wet = false;
      if (ECLIPSE > 0.1) GUY.prop = "lantern";
      if (BIRTHDAY) GUY.prop = GUY.prop || "party";

      if (GUY.state !== "away" && GUY.state !== "home" && GUY.state !== "held") {
        if (!GUY.stateT || GUY.lastState !== GUY.state) { GUY.stateT = t; GUY.lastState = GUY.state; }
        else if (t - GUY.stateT > 26) { GUY.state = "walkout"; GUY.stateT = t; }
      }
      var stillFor = (performance.now() - idleSince) / 1000;
      if (stillFor > 120 && gNightIdle < 0.4 &&
          (GUY.state === "wave" || GUY.state === "stand" || GUY.state === "walkout" || GUY.state === "walkin")) {

      var spd = 0.0165;
      if (!GUY.lastT) GUY.lastT = t;
      var dt2 = Math.min(0.05, t - GUY.lastT);
      GUY.lastT = t;
      spd = dt2;
      switch (GUY.state) {
        case "walkin":
          GUY.x += 42 * spd;
          if (GUY.x >= GUY.targetX) { GUY.state = "wave"; GUY.t0 = t; GUY.bubble = t + 2.8; GUY.line = pickContext(); }
          drawGuy(GUY.x, gy4, t, "walk", GUY.outfit, GUY.prop);

          if (BIKE.present && Math.abs(GUY.x - BIKE.x) < 6) {

        case "rideBack": {

          ctx.save();

          ctx.globalAlpha = 1;
          GUY.fvy += 2400 * dt2;
          GUY.fx += GUY.fvx * dt2;
          GUY.fvx *= (1 - 0.4 * dt2);
          GUY.fy += GUY.fvy * dt2;
          DRAG.rot += GUY.fvx * dt2 * 0.004;
          if (GUY.fx < 14) { GUY.fx = 14; GUY.fvx = Math.abs(GUY.fvx) * 0.5; }
          if (GUY.fx > W - 14) { GUY.fx = W - 14; GUY.fvx = -Math.abs(GUY.fvx) * 0.5; }
          var landY = gy4;
          if (GUY.fy >= landY) {
            GUY.fy = landY;
            if (Math.abs(GUY.fvy) > 520) {
              GUY.fvy = -Math.abs(GUY.fvy) * 0.38;          // a real bounce
              GUY.fvx *= 0.7;
              if (window.__thud) window.__thud();
            } else if (Math.abs(GUY.fvy) > 210) {
              GUY.state = "splat"; GUY.t0 = t; GUY.x = GUY.fx;
              if (window.__thud) window.__thud();

            } else {
              GUY.state = "stand"; GUY.t0 = t; GUY.x = GUY.fx;
            }

            var mR = EGG.moleRect;
            if (mR && GUY.fx > mR.x - 20 && GUY.fx < mR.x + mR.w + 20) {
              GUY.fvx = 260; GUY.state = "splat"; GUY.t0 = t; GUY.x = GUY.fx + 26;
            }
          }
          ctx.save();
          ctx.translate(GUY.fx, GUY.fy);

          ctx.translate(-GUY.fx, -GUY.fy);
          drawGuy(GUY.fx, GUY.fy, t, "held", GUY.outfit, null);
