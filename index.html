<style>
:root{
  --serif:"Fraunces",Georgia,serif;
  --sans:"Instrument Sans",-apple-system,"Segoe UI",sans-serif;
  --ink:#211d16;
  --paper:#eceade;
  --night:#e8e4da;
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{background:#16192a;color:var(--ink);font-family:var(--sans)}

/* ---------- the film ---------- */
#filmScroll{height:430vh;position:relative}
#stage{position:sticky;top:0;height:100vh;height:100svh;overflow:hidden}
#film{position:absolute;inset:0;display:block}

#theName{
  position:absolute;left:0;right:0;top:20%;text-align:center;
  font-family:var(--serif);font-weight:300;
  font-size:clamp(2.6rem,9vw,7.5rem);letter-spacing:.01em;line-height:1;
  color:var(--ink);white-space:nowrap;cursor:default;
  text-shadow:0 1px 0 rgba(255,255,255,.25);
  will-change:opacity,transform,filter;
}
#theName i{font-style:italic;font-weight:400}

#hint{
  position:absolute;left:50%;bottom:13vh;transform:translateX(-50%);
  font-family:var(--serif);font-style:italic;font-size:.9rem;letter-spacing:.06em;
  color:rgba(130,118,104,.9);
  transition:opacity .4s ease;
  animation:breathe 3s ease-in-out infinite;
}
#hint.off{animation:none;opacity:0}
@keyframes breathe{0%,100%{opacity:.4}50%{opacity:.9}}

/* ---------- the doors ---------- */
#portal{
  position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  gap:clamp(1rem,4vw,3.5rem);flex-wrap:wrap;padding:0 6vw;
  opacity:0;pointer-events:none;transition:opacity .8s ease;
}
#portal.live{opacity:1;pointer-events:auto}
.door{
  width:min(225px,21vw);min-width:170px;min-height:198px;
  display:flex;flex-direction:column;justify-content:center;
  text-decoration:none;text-align:center;
  padding:1.6rem 1.2rem;border-radius:3px;
  color:#e9e2d2;
  background:rgba(26,19,11,.46);
  border:1px solid rgba(224,170,96,.22);
  box-shadow:0 0 40px rgba(224,160,80,.05), inset 0 0 30px rgba(0,0,0,.3);
  backdrop-filter:blur(6px);
  transform:translateY(28px);opacity:0;
  transition:transform .8s cubic-bezier(.23,1,.32,1), opacity .8s ease,
             border-color .3s ease, box-shadow .3s ease, background .3s ease;
}
.door:hover{transform:translateY(-4px)!important}
#portal.live .door{transform:none;opacity:1}
#portal.live .door:nth-child(2){transition-delay:.12s}
#portal.live .door:nth-child(3){transition-delay:.24s}
.door:hover{border-color:rgba(224,170,96,.55);background:rgba(30,22,13,.6);box-shadow:0 0 60px rgba(224,160,80,.12), inset 0 0 30px rgba(0,0,0,.3)}
.door .k{
  display:block;font-family:var(--serif);font-style:italic;font-size:.85rem;letter-spacing:.04em;
  color:rgba(224,170,96,.75);margin-bottom:.6rem;
}
.door h2{
  font-family:var(--serif);font-weight:300;font-size:clamp(1.4rem,2.6vw,2rem);
  letter-spacing:.01em;
}
.door p{margin-top:.55rem;font-family:"Newsreader",Georgia,serif;font-style:italic;font-size:.92rem;line-height:1.5;color:rgba(233,226,210,.62)}

/* ---------- after the film ---------- */
footer{
  background:#12151f;color:rgba(232,228,218,.5);
  font-size:.72rem;letter-spacing:.06em;
  display:flex;justify-content:space-between;align-items:center;
  padding:1.1rem 6vw;
}
footer a{color:rgba(232,228,218,.75);text-decoration:none}
footer a:hover{color:#fff}
.langs{display:flex;gap:.6rem}
.langs button{background:none;border:0;cursor:pointer;font:inherit;color:rgba(232,228,218,.6);padding:.2em .1em}
.langs button:hover{color:#fff}
.langs button[aria-pressed="true"]{color:#fff;border-bottom:1px solid rgba(232,228,218,.5)}

@media (prefers-reduced-motion:reduce){
  #filmScroll{height:100vh}
  #hint{display:none}
}
@media (max-width:700px){
  #portal{align-content:center}
  .door{width:78vw;padding:1.4rem 1rem 1.2rem}
  #theName{top:34%}
}

#fadeout{position:fixed;inset:0;background:#17110a;opacity:0;pointer-events:none;transition:opacity .34s ease;z-index:90}
#fadeout.on{opacity:1}
@keyframes dawn{from{opacity:1}to{opacity:0}}
#dawn{position:fixed;inset:0;background:#17110a;pointer-events:none;z-index:92;animation:dawn .8s ease .1s forwards}
@media (prefers-reduced-motion:reduce){#dawn{display:none}}

.door:focus-visible,.langs button:focus-visible,#sndBtn:focus-visible{outline:2px solid #e0a050;outline-offset:3px}
#sndBtn{position:fixed;right:1.1rem;bottom:1.1rem;z-index:60;width:42px;height:42px;border-radius:50%;

#sndBtn:hover{border-color:rgba(224,170,96,.7);color:#f4e3c6}
#sndBtn svg{width:19px;height:19px}

<script>
/* ============================================================ THE TREE
   A scroll-scrubbed film, computed rather than filmed.

   Every leaf's flight is a pure function of scroll progress: leaf i detaches
   at its own threshold, follows a path seeded from its index, lands, and at
   the end glides to one of the three doors. Because nothing depends on wall
   time except a light idle sway, scrubbing backwards runs the film backwards:
   leaves rise from the ground and reattach. That reversibility is the
   whole trick, and it is why this is drawn live instead of played from
   frames: a frame sequence of this length would cost megabytes and still
   blur on a retina screen.

   Structure: trunk and branches are grown once with a seeded recursive
   generator and pre-rendered to an offscreen canvas per theme phase; leaves
   are particles drawn each frame; sky, haze, hills and grain are cheap
   gradients over the top. Reduced motion collapses the film to its final
   still with the doors open. */

(function () {
  "use strict";

  var canvas = document.getElementById("film");
  if (!canvas) return;
  var ctx = canvas.getContext("2d");
  var stage = document.getElementById("stage");
  var nameEl = document.getElementById("theName");
  var hintEl = document.getElementById("hint");
  var portal = document.getElementById("portal");
  var doors = portal ? [].slice.call(portal.querySelectorAll(".door")) : [];

  var reduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  var DPR = Math.min(1.75, window.devicePixelRatio || 1);

  /* eggs share this; the film reads it every frame */
  var EGG = window.__EGG = { blossom: 0, burst: null, moleRect: null, moleBurst: 0 };
  var _mon = new Date().getMonth();            // real season, real weather
  var SEASON = (_mon === 11 || _mon <= 1) ? "winter" : (_mon >= 2 && _mon <= 4) ? "spring" : "other";
  var _d = new Date();
  var FESTIVE = (_mon === 11 && _d.getDate() >= 26) || (_mon === 0 && _d.getDate() <= 6);
  var W = 0, H = 0, small = false;

  /* ------------------------------------------------ seeded randomness
     One seed, one tree. The same visitor sees the same tree twice. */
  function mulberry(seed) {
    return function () {
      seed |= 0; seed = (seed + 0x6D2B79F5) | 0;
      var t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  var rnd = mulberry(20260820);

  var lerp = function (a, b, t) { return a + (b - a) * t; };
  var clamp = function (v, a, b) { return v < a ? a : v > b ? b : v; };
  var smooth = function (t) { t = clamp(t, 0, 1); return t * t * (3 - 2 * t); };
  var ease = function (t) { return 1 - Math.pow(1 - clamp(t, 0, 1), 3); };

  /* ------------------------------------------------------- the skeleton */
  var branches = [];   // {x1,y1,x2,y2,w,depth,sway}
  var tips = [];       // leaf anchor points {x,y,depth,sway}

  function grow(x, y, angle, len, width, depth, swayAmp) {
    if (depth > 9 || len < 4.5) { tips.push({ x: x, y: y, d: depth, s: swayAmp }); return; }
    var segs = 4;
    var px = x, py = y, a = angle;
    for (var s = 0; s < segs; s++) {
      a += (rnd() - 0.5) * 0.22;                       // organic wobble
      a = lerp(a, -Math.PI / 2, 0.03);                 // faint phototropism
      var sl = len / segs;
      var nx = px + Math.cos(a) * sl;
      var ny = py + Math.sin(a) * sl;
      var bow = (rnd() - 0.5) * sl * 0.5;
      branches.push({ x1: px, y1: py, x2: nx, y2: ny,
        cx: (px + nx) / 2 - Math.sin(a) * bow, cy: (py + ny) / 2 + Math.cos(a) * bow,
        w: width * (1 - s / segs * 0.12), d: depth, s: swayAmp });
      px = nx; py = ny;
    }
    if (depth >= 2 && rnd() < 0.75) tips.push({ x: px, y: py, d: depth, s: swayAmp });
    if (depth >= 4) tips.push({ x: (x + px) / 2, y: (y + py) / 2, d: depth, s: swayAmp * 0.8 });
    var kids = depth < 3 ? 3 : 2;
    for (var k = 0; k < kids; k++) {
      var spread = lerp(0.35, 0.85, rnd());
      var na = a + (k - (kids - 1) / 2) * spread + (rnd() - 0.5) * 0.3;
      // droop: outer branches relax toward horizontal, like weight does
      na = lerp(na, na > -Math.PI / 2 ? -0.15 : -Math.PI + 0.15, depth * 0.02);
      grow(px, py, na, len * lerp(0.62, 0.74, rnd()), width * 0.66, depth + 1,
           swayAmp + len * 0.0022);
    }
  }

  /* ------------------------------------------------------------ leaves */
  var LEAVES = [];
  var aoBlobs = [];
  var N = 0;

  var GREENS = ["#5a7d4a", "#6b8f54", "#4c7040", "#7da05f", "#87a86a", "#5f8a4e"];
  var BLOSSOM = ["#e8b4c8", "#f2d2dd", "#f7e8ee", "#dfa0b8", "#f0c6d4", "#f5dde6", "#e5aabf"];
  var AUTUMN = ["#c8842e", "#b25b28", "#d99a3c", "#a34a22", "#c26a24", "#dca94e", "#8f3f1e"];

  function hex(h) {
    return [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
  }
  var GREENS_RGB = GREENS.map(hex), AUTUMN_RGB = AUTUMN.map(hex), BLOSSOM_RGB = BLOSSOM.map(hex);
  if (SEASON === "spring") GREENS_RGB = GREENS_RGB.map(function(c,i){
    var b = BLOSSOM_RGB[i % BLOSSOM_RGB.length];
    return i % 3 === 0 ? b : c;                       // a spring tree carries some blossom
  });

  function buildLeaves() {
    LEAVES.length = 0;
    N = small ? 1000 : 2300;
    for (var i = 0; i < N; i++) {
      var tip = tips[(rnd() * tips.length) | 0];
      var spread = lerp(10, 62, rnd());
      var la = rnd() * Math.PI * 2;
      var ax = tip.x + Math.cos(la) * spread;
      var ay = tip.y + Math.sin(la) * spread * 0.8 - 6;
      LEAVES.push({
        ax: ax, ay: ay,                              // attach point
        depth: tip.d, sway: tip.s,
        size: lerp(3.4, 7.2, rnd()) * (small ? 0.85 : 1),
        tilt: rnd() * Math.PI * 2,
        spin: (rnd() - 0.5) * 9,
        gi: (rnd() * GREENS_RGB.length) | 0,
        ai: (rnd() * AUTUMN_RGB.length) | 0,
        turn: 0.10 + rnd() * 0.5,                    // when this leaf turns colour
        detach: 0.14 + Math.pow(rnd(), 0.85) * 0.46,  // when it lets go (max .72)
        dur: 0.10 + rnd() * 0.08,                    // how much progress a fall takes
        driftA: (rnd() - 0.5) * 2,                   // horizontal drift direction
        driftB: rnd() * Math.PI * 2,                 // flutter phase
        door: (rnd() * 3) | 0,                       // which pile it joins
        gx: 0, gy: 0,                                // ground position, set on resize
        phase: rnd() * Math.PI * 2
      });
    }
    // ground positions: banked drifts, weighted under the tree
    LEAVES.forEach(function (L) {
      var bank = (rnd() - 0.5);
      L.gx = W * 0.5 + bank * W * 0.46 + (rnd() - 0.5) * 40;
      L.gy = H * 0.875 + Math.abs(bank) * H * 0.02 + rnd() * H * 0.06;
      // its place in the pile: a gaussian heap, not a strip
      var gsx = (rnd() + rnd() + rnd() - 1.5) / 1.5;
      L.px = gsx * 82;
      L.py = 10 - Math.abs((rnd() + rnd() - 1)) * 20 - (1 - Math.abs(gsx)) * 8;
    });
    aoBlobs.length = 0;
    for (var ab = 0; ab < 16; ab++) {
      var tp = tips[(rnd() * tips.length) | 0];
      aoBlobs.push({ x: tp.x, y: tp.y - 6, r: lerp(28, 56, rnd()) });
    }
  }

  /* -------------------------------------------------- trunk pre-render */
  var trunkCanvas = document.createElement("canvas");
  var rootCanvas = document.createElement("canvas");   // the underground
  var rootBranches = [];

  function growRoot(x, y, angle, len, width, depth) {
    if (depth > 8 || len < 4) return;
    var segs = 3, px = x, py = y, a = angle;
    for (var sg = 0; sg < segs; sg++) {
      a += (rnd() - 0.5) * 0.5;
      a = lerp(a, Math.PI / 2, 0.05);          // roots seek down, loosely
      var sl = len / segs;
      var nx = px + Math.cos(a) * sl;
      var ny = py + Math.sin(a) * sl;
      var bow = (rnd() - 0.5) * sl * 0.6;
      rootBranches.push({ x1: px, y1: py, x2: nx, y2: ny,
        cx: (px + nx) / 2 - Math.sin(a) * bow, cy: (py + ny) / 2 + Math.cos(a) * bow,
        w: width * (1 - sg / segs * 0.15) });
      px = nx; py = ny;
    }
    var kids = depth < 2 ? 3 : 2;
    for (var k = 0; k < kids; k++) {
      var na = a + (k - (kids - 1) / 2) * lerp(0.5, 1.1, rnd()) + (rnd() - 0.5) * 0.4;
      growRoot(px, py, na, len * lerp(0.6, 0.78, rnd()), width * 0.58, depth + 1);
    }
  }

  function renderRoots() {
    var RH = Math.round(H * 1.25);
    rootCanvas.width = W * DPR; rootCanvas.height = RH * DPR;
    var t = rootCanvas.getContext("2d");
    t.scale(DPR, DPR);
    // soil: warm dark, deepening
    var sg = t.createLinearGradient(0, 0, 0, RH);
    sg.addColorStop(0, "#2c2115");
    sg.addColorStop(0.5, "#221a10");
    sg.addColorStop(1, "#17110a");
    t.fillStyle = sg; t.fillRect(0, 0, W, RH);
    // strata: faint horizontal bands
    for (var b = 0; b < 5; b++) {
      t.fillStyle = "rgba(0,0,0," + (0.05 + rnd() * 0.05) + ")";
      var by = RH * (0.15 + b * 0.17) + rnd() * 20;
      t.fillRect(0, by, W, 1.5 + rnd() * 2);
    }
    // stones
    for (var st = 0; st < 46; st++) {
      var sx = rnd() * W, sy = rnd() * RH, sr = 2 + rnd() * 9;
      t.fillStyle = "rgba(" + (90 + rnd() * 40 | 0) + "," + (78 + rnd() * 30 | 0) + "," + (60 + rnd() * 22 | 0) + "," + (0.10 + rnd() * 0.14) + ")";
      t.beginPath(); t.ellipse(sx, sy, sr, sr * 0.7, rnd() * 3, 0, 6.284); t.fill();
    }
    // the root system
    rootBranches.length = 0;
    var unit = Math.min(H, W * 1.1);
    growRoot(W / 2 - unit * 0.02, -6, Math.PI / 2 - 0.55, unit * 0.19, unit * 0.030, 0);
    growRoot(W / 2 + unit * 0.02, -6, Math.PI / 2 + 0.55, unit * 0.19, unit * 0.030, 0);
    growRoot(W / 2, -6, Math.PI / 2 + (rnd() - 0.5) * 0.3, unit * 0.23, unit * 0.026, 0);
    rootBranches.forEach(function (r) {
      t.strokeStyle = "#100b06";
      t.lineCap = "round";
      t.lineWidth = r.w + 2.5;
      t.beginPath(); t.moveTo(r.x1, r.y1); t.quadraticCurveTo(r.cx, r.cy, r.x2, r.y2); t.stroke();
    });
    rootBranches.forEach(function (r) {
      t.strokeStyle = "#3d2d1b";
      t.lineCap = "round";
      t.lineWidth = r.w;
      t.beginPath(); t.moveTo(r.x1, r.y1); t.quadraticCurveTo(r.cx, r.cy, r.x2, r.y2); t.stroke();
      if (r.w > 3) {
        t.strokeStyle = "rgba(120,92,58,.35)";
        t.lineWidth = Math.max(1, r.w * 0.25);
        t.beginPath();
        t.moveTo(r.x1 - r.w * 0.22, r.y1 - 1);
        t.quadraticCurveTo(r.cx - r.w * 0.22, r.cy - 1, r.x2 - r.w * 0.22, r.y2 - 1);
        t.stroke();
      }
    });
    // root hairs
    t.strokeStyle = "rgba(70,52,32,.5)"; t.lineWidth = 0.8;
    rootBranches.forEach(function (r) {
      if (r.w > 2.5 || rnd() < 0.5) return;
      t.beginPath(); t.moveTo(r.x2, r.y2);
      t.lineTo(r.x2 + (rnd() - 0.5) * 22, r.y2 + rnd() * 16); t.stroke();
    });
    // buried glints: minerals catching what little light there is
    for (var gl = 0; gl < 26; gl++) {
      t.fillStyle = "rgba(224,160,80," + (0.05 + rnd() * 0.10) + ")";
      var gx2 = rnd() * W, gy2 = RH * 0.2 + rnd() * RH * 0.75;
      t.beginPath(); t.arc(gx2, gy2, 0.8 + rnd() * 1.6, 0, 6.284); t.fill();
    }
  }

  function renderTrunk() {
    trunkCanvas.width = W * DPR; trunkCanvas.height = H * DPR;
    var t = trunkCanvas.getContext("2d");
    t.scale(DPR, DPR);
    t.lineCap = "round";
    // dark silhouette first, then one warm rim light along the left edge
    // root flare: the trunk widens where it meets the ground
    var base = branches[0];
    if (base) {
      t.fillStyle = "#2b2118";
      t.beginPath();
      t.moveTo(base.x1 - base.w * 1.4, base.y1 + 2);
      t.quadraticCurveTo(base.x1 - base.w * 0.5, base.y1 - base.w * 1.6, base.x1 - base.w * 0.52, base.y1 - base.w * 2.4);
      t.lineTo(base.x1 + base.w * 0.52, base.y1 - base.w * 2.4);
      t.quadraticCurveTo(base.x1 + base.w * 0.5, base.y1 - base.w * 1.6, base.x1 + base.w * 1.4, base.y1 + 2);
      t.closePath(); t.fill();
    }
    branches.forEach(function (b) {
      t.strokeStyle = "#2b2118";
      t.lineWidth = b.w;
      t.beginPath(); t.moveTo(b.x1, b.y1);
      t.quadraticCurveTo(b.cx, b.cy, b.x2, b.y2); t.stroke();
    });
    // bark: a lit edge and a shadow edge, so limbs read as cylinders
    branches.forEach(function (b) {
      if (b.w < 3.5) return;
      t.strokeStyle = "rgba(146,112,78,.30)";
      t.lineWidth = Math.max(1.1, b.w * 0.24);
      t.beginPath();
      t.moveTo(b.x1 - b.w * 0.24, b.y1 - 1);
      t.quadraticCurveTo(b.cx - b.w * 0.24, b.cy - 1, b.x2 - b.w * 0.24, b.y2 - 1);
      t.stroke();
      t.strokeStyle = "rgba(12,8,5,.35)";
      t.lineWidth = Math.max(1, b.w * 0.18);
      t.beginPath();
      t.moveTo(b.x1 + b.w * 0.28, b.y1 + 1);
      t.quadraticCurveTo(b.cx + b.w * 0.28, b.cy + 1, b.x2 + b.w * 0.28, b.y2 + 1);
      t.stroke();
    });
  }

  /* ----------------------------------------------------------- resize */
  function resize() {
    W = stage.clientWidth; H = stage.clientHeight;
    small = W < 720;
    canvas.width = W * DPR; canvas.height = H * DPR;
    canvas.style.width = W + "px"; canvas.style.height = H + "px";
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);

    branches.length = 0; tips.length = 0;
    rnd = mulberry(20260820);
    var baseY = H * 0.92;
    var unit = Math.min(H, W * 1.1);
    grow(W * 0.5, baseY, -Math.PI / 2 + 0.03, unit * 0.155, unit * 0.030, 0, 0);
    // normalise: the recursion above works in pixels already via scale
    renderTrunk();
    renderRoots();
    buildAntPath();
    buildLeaves();
    draw(lastP, performance.now());
  }

  /* -------------------------------------------------------------- sky */
  // phases: 0 morning ivory · .5 golden dusk · 1 blue night
  function skyColors(p) {
    var a = smooth(p * 1.6), b = smooth((p - 0.55) * 2.2);
    function mix3(c1, c2, c3) {
      return [
        Math.round(lerp(lerp(c1[0], c2[0], a), c3[0], b)),
        Math.round(lerp(lerp(c1[1], c2[1], a), c3[1], b)),
        Math.round(lerp(lerp(c1[2], c2[2], a), c3[2], b))
      ];
    }
    return {
      top: mix3([236, 232, 222], [225, 188, 148], [24, 30, 44]),
      bot: mix3([214, 212, 200], [204, 148, 104], [38, 44, 58]),
      haze: mix3([200, 200, 190], [190, 140, 100], [30, 36, 50])
    };
  }
  var rgb = function (c, al) { return "rgba(" + c[0] + "," + c[1] + "," + c[2] + "," + (al == null ? 1 : al) + ")"; };

  /* -------------------------------------------------------------- draw */
  var lastP = 0;

  function draw(p, now) {
    lastP = p;
    var t = now * 0.001;
    var wind = reduced ? 0 : Math.sin(t * 0.9) * 0.35 + Math.sin(t * 0.23) * 0.3;
    var gust = smooth((p - 0.10) / 0.30);           // wind rises as the film moves
    var descend = smooth((p - 0.66) / 0.30);        // the camera goes underground
    var sk = skyColors(p);
    var camY = ease(descend) * H * 1.12;    // how deep the camera has gone

    // sky
    var g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, rgb(sk.top));
    g.addColorStop(1, rgb(sk.bot));
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);

    ctx.save();
    ctx.translate(0, -camY);

    // far hills, two parallax planes
    ctx.fillStyle = rgb(sk.haze, 0.30);
    hill(H * 0.82, 26, 0.0009, 8);
    ctx.fillStyle = rgb(sk.haze, 0.45);
    hill(H * 0.865, 16, 0.0014, 40);

    // ground: real soil from the first frame, so the descent has nowhere to jump
    ctx.drawImage(rootCanvas, 0, H * 0.885, W, H * 1.25);
    var gg = ctx.createLinearGradient(0, H * 0.875, 0, H * 0.9);
    gg.addColorStop(0, rgb(sk.bot, 0));
    gg.addColorStop(1, rgb([sk.bot[0] * 0.72 | 0, sk.bot[1] * 0.72 | 0, sk.bot[2] * 0.62 | 0], 0.55));
    ctx.fillStyle = gg;
    ctx.fillRect(0, H * 0.875, W, H * 0.9 - H * 0.875 + 2);

    // contact shadow under the trunk
    ctx.save();
    ctx.translate(W / 2, H * 0.918);
    ctx.scale(1, 0.22);
    var sh = ctx.createRadialGradient(0, 0, 0, 0, 0, 130);
    sh.addColorStop(0, "rgba(20,14,8,.30)");
    sh.addColorStop(1, "rgba(20,14,8,0)");
    ctx.fillStyle = sh;
    ctx.beginPath(); ctx.arc(0, 0, 130, 0, 6.284); ctx.fill();
    ctx.restore();

    // trunk, with a whisper of sway
    ctx.save();
    ctx.translate(W / 2, H * 0.92);
    ctx.rotate(wind * 0.004 * (1 + gust));
    ctx.translate(-W / 2, -H * 0.92);
    ctx.drawImage(trunkCanvas, 0, 0, W, H);
    ctx.restore();

    // canopy depth: soft occlusion blobs behind the back leaves, fading as leaves go
    var canopyAlive = 1 - smooth((p - 0.14) / 0.5);
    if (canopyAlive > 0.02) {
      ctx.save();
      for (var ao = 0; ao < aoBlobs.length; ao++) {
        var B = aoBlobs[ao];
        var g2 = ctx.createRadialGradient(B.x, B.y, 0, B.x, B.y, B.r);
        g2.addColorStop(0, "rgba(26,36,20," + (0.10 * canopyAlive) + ")");
        g2.addColorStop(1, "rgba(26,36,20,0)");
        ctx.fillStyle = g2;
        ctx.beginPath(); ctx.arc(B.x, B.y, B.r, 0, 6.284); ctx.fill();
      }
      ctx.restore();
    }

    // leaves, back depth first
    for (var pass = 0; pass < 2; pass++) {
      for (var i = 0; i < N; i++) {
        var L = LEAVES[i];
        if ((pass === 0) !== (L.depth < 6)) continue;
        drawLeaf(L, p, t, wind, gust, pass);
      }
    }

    ctx.restore();

    // stars, arriving with the night
    var night = smooth((p - 0.52) / 0.3) * (1 - smooth((descend - 0.5) / 0.4));
    if (night > 0) {
      var sr = mulberry(77);
      ctx.fillStyle = "rgba(232,236,246," + (0.75 * night) + ")";
      for (var st = 0; st < 90; st++) {
        var sx = sr() * W, sy = sr() * H * 0.55, ss = sr();
        if (ss > 0.86) { ctx.fillRect(sx, sy, 1.6, 1.6); }
        else if (ss > 0.45) { ctx.globalAlpha = night * 0.5; ctx.fillRect(sx, sy, 1, 1); ctx.globalAlpha = 1; }
      }
    }

    drawCreatures(now * 0.001, descend, camY);
    drawExtras(now * 0.001, p, descend, camY, night);

    // dusk vignette + grain
    var v = ctx.createRadialGradient(W / 2, H * 0.45, H * 0.3, W / 2, H * 0.5, H * 0.95);
    v.addColorStop(0, "rgba(0,0,0,0)");
    v.addColorStop(1, "rgba(10,10,16," + (0.12 + p * 0.25) + ")");
    ctx.fillStyle = v;
    ctx.fillRect(0, 0, W, H);
  }

  function hill(y, amp, freq, ph) {
    ctx.beginPath();
    ctx.moveTo(0, H);
    for (var x = 0; x <= W; x += 12) {
      ctx.lineTo(x, y + Math.sin(x * freq * 6.28 + ph) * amp * 0.4
                    + Math.sin(x * freq * 17 + ph * 1.7) * amp * 0.2);
    }
    ctx.lineTo(W, H);
    ctx.closePath();
    ctx.fill();
  }



  function drawLeaf(L, p, t, wind, gust, front) {
    // colour: green → its own autumn shade, each on its own schedule
    var turn = smooth((p - L.turn * 0.42) / 0.24);
    var gc = GREENS_RGB[L.gi], ac = AUTUMN_RGB[L.ai];
    var r = lerp(gc[0], ac[0], turn) | 0,
        gr = lerp(gc[1], ac[1], turn) | 0,
        b = lerp(gc[2], ac[2], turn) | 0;
    if (EGG.blossom > 0) {                            // 3523: the tree remembers spring
      var bc = BLOSSOM_RGB[L.ai % BLOSSOM_RGB.length];
      r = lerp(r, bc[0], EGG.blossom) | 0;
      gr = lerp(gr, bc[1], EGG.blossom) | 0;
      b = lerp(b, bc[2], EGG.blossom) | 0;
    }

    var f = clamp((p - L.detach) / L.dur, 0, 1);   // fall phase 0..1
    var x, y, rot, alpha = 1;

    if (f <= 0) {
      // attached: sway with its branch
      var s = Math.sin(t * 1.7 + L.phase) * (1.5 + L.sway * 18) * (0.4 + gust) * (reduced ? 0 : 1);
      x = L.ax + s + wind * L.sway * 26 * gust;
      y = L.ay + Math.cos(t * 1.3 + L.phase) * 1.2;
      rot = L.tilt + s * 0.02;
    } else if (f < 1) {
      // falling: drift is deterministic in f, flutter layered on top
      var fe = ease(f);
      var dx = L.driftA * 90 * fe + Math.sin(f * 9 + L.driftB) * 22 * (1 - f * 0.4);
      x = lerp(L.ax, L.gx, fe * 0.55) + dx;
      y = lerp(L.ay, L.gy, f * f * (3 - 2 * f));
      rot = L.tilt + f * L.spin;
    } else {
      // grounded: it stays where it fell
      x = L.gx; y = L.gy; rot = L.tilt + L.spin;
    }

    var sz = L.size * (front ? 1 : 0.8);
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(rot);
    ctx.globalAlpha = alpha * (front ? 1 : 0.75);
    ctx.fillStyle = "rgb(" + r + "," + gr + "," + b + ")";
    // a leaf: two arcs meeting at a point
    ctx.beginPath();
    ctx.moveTo(0, -sz);
    ctx.quadraticCurveTo(sz * 0.7, -sz * 0.2, 0, sz);
    ctx.quadraticCurveTo(-sz * 0.7, -sz * 0.2, 0, -sz);
    ctx.fill();
    // midrib
    if (sz > 4.5) {
      ctx.strokeStyle = "rgba(0,0,0,.18)";
      ctx.lineWidth = 0.6;
      ctx.beginPath(); ctx.moveTo(0, -sz * 0.8); ctx.lineTo(0, sz * 0.8); ctx.stroke();
    }
    ctx.restore();
    ctx.globalAlpha = 1;
  }

  /* ------------------------------------------- the underground is inhabited
     A column of ants follows one of the main roots, and every so often a
     mole surfaces near the doors, looks around, and thinks better of it.
     Time-based, world-space, and only drawn once the camera is down there. */
  var antPath = [];
  function buildAntPath() {
    antPath.length = 0;
    // a gentle S across the soil, roughly following root territory
    var y0 = H * 0.885;
    for (var i = 0; i <= 60; i++) {
      var u = i / 60;
      antPath.push({
        x: W * 0.18 + u * W * 0.64 + Math.sin(u * 5.2) * W * 0.05,
        y: y0 + H * 0.62 + Math.sin(u * 8.5 + 1.3) * H * 0.035
      });
    }
  }
  function drawCreatures(t, descend, camY) {
    if (reduced || descend < 0.12) return;
    var vis = smooth((descend - 0.12) / 0.3);
    ctx.save();
    ctx.translate(0, -camY);

    // ants: a working line, each with its own gait
    ctx.fillStyle = "rgba(16,10,6," + (0.9 * vis) + ")";
    for (var a = 0; a < 14; a++) {
      var u = ((t * 0.014 + a * 0.073) % 1.04) - 0.02;
      if (u < 0 || u > 1) continue;
      var idx = u * 59;
      var i0 = idx | 0;
      var f = idx - i0;
      var P0 = antPath[i0], P1 = antPath[Math.min(59, i0 + 1)];
      var ax = lerp(P0.x, P1.x, f), ay = lerp(P0.y, P1.y, f);
      ay += Math.sin(t * 22 + a * 3) * 0.5;               // gait wobble
      var ang = Math.atan2(P1.y - P0.y, P1.x - P0.x);
      ctx.save();
      ctx.translate(ax, ay);
      ctx.rotate(ang);
      ctx.beginPath(); ctx.ellipse(-1.6, 0, 1.5, 1.0, 0, 0, 6.284); ctx.fill();   // abdomen
      ctx.beginPath(); ctx.ellipse(0.2, 0, 1.0, 0.8, 0, 0, 6.284); ctx.fill();    // thorax
      ctx.beginPath(); ctx.arc(1.7, 0, 0.8, 0, 6.284); ctx.fill();                // head
      ctx.restore();
    }

    // the mole: a 24 s cycle. mound swells, snout appears, sniffs, withdraws
    var cyc = (t % 24) / 24;
    var mx = W * 0.78, my = H * 0.885 + H * 0.94;
    var up = 0;
    if (cyc > 0.30 && cyc < 0.42) up = smooth((cyc - 0.30) / 0.12);
    else if (cyc >= 0.42 && cyc < 0.62) up = 1;
    else if (cyc >= 0.62 && cyc < 0.72) up = 1 - smooth((cyc - 0.62) / 0.10);
    EGG.moleRect = up > 0.4 ? { x: mx - 20, y: my - 30 - camY + 0, w: 40, h: 44, camY: camY } : null;
    if (EGG.moleBurst > 0) EGG.moleBurst -= 0.02;
    if (up > 0) {
      var mound = smooth(Math.min(1, up * 1.4));
      ctx.fillStyle = "rgba(46,32,18," + (0.9 * vis) + ")";     // loose earth
      ctx.beginPath();
      ctx.ellipse(mx, my + 4, 34 * mound, 10 * mound, 0, Math.PI, 0);
      ctx.fill();
      var rise = up * 22;
      ctx.save();
      ctx.translate(mx, my + 6 - rise);
      var sniff = up === 1 ? Math.sin(t * 7) * 2 : 0;
      ctx.rotate(sniff * 0.03);
      ctx.fillStyle = "rgba(38,28,20," + vis + ")";              // velvet back
      ctx.beginPath(); ctx.ellipse(0, 6, 15, 13, 0, 0, 6.284); ctx.fill();
      ctx.fillStyle = "rgba(52,38,26," + vis + ")";              // head
      ctx.beginPath(); ctx.ellipse(0, -4, 9, 8, 0, 0, 6.284); ctx.fill();
      ctx.fillStyle = "rgba(196,148,120," + vis + ")";           // the snout
      ctx.beginPath(); ctx.ellipse(0, -10 + sniff * 0.4, 3.2, 2.6, 0, 0, 6.284); ctx.fill();
      ctx.fillStyle = "rgba(10,7,4," + vis + ")";
      ctx.beginPath(); ctx.arc(-3.4, -6.5, 0.7, 0, 6.284); ctx.fill();
      ctx.beginPath(); ctx.arc(3.4, -6.5, 0.7, 0, 6.284); ctx.fill();
      // digging paws, only while rising
      if (up < 1) {
        ctx.fillStyle = "rgba(196,148,120," + (vis * 0.9) + ")";
        ctx.beginPath(); ctx.ellipse(-11, 2, 3.4, 2.2, -0.5, 0, 6.284); ctx.fill();
        ctx.beginPath(); ctx.ellipse(11, 2, 3.4, 2.2, 0.5, 0, 6.284); ctx.fill();
      }
      ctx.restore();
      // flying dirt at emergence
      if (up > 0.1 && up < 0.9) {
        ctx.fillStyle = "rgba(46,32,18," + (0.5 * vis) + ")";
        for (var dd = 0; dd < 5; dd++) {
          var da = dd * 1.3 + t * 3;
          ctx.beginPath();
          ctx.arc(mx + Math.cos(da) * (20 + up * 16), my - up * 26 + Math.sin(da * 1.7) * 8, 1.4, 0, 6.284);
          ctx.fill();
        }
      }
    }
    ctx.restore();
  }

  /* ---------------------------------------------- eggs drawn by the film */
  var flies = [];             // fireflies
  var idleSince = performance.now();
  var pointer = { x: -100, y: -100 };
  window.addEventListener("mousemove", function(e){ pointer.x = e.clientX; pointer.y = e.clientY; idleSince = performance.now(); }, { passive:true });
  window.addEventListener("scroll", function(){ idleSince = performance.now(); flies.length = 0; }, { passive:true });

  var bird = { state: 0, t0: 0, next: 18 };   // 0 away, 1 flying in, 2 perched, 3 leaving
  var perch = null;

  function drawExtras(t, p, descend, camY, night) {
    if (reduced) return;

    /* snow, in real winter, while the tree still stands */
    if (SEASON === "winter" && p < 0.5) {
      ctx.fillStyle = "rgba(245,245,250," + (0.5 * (1 - p * 2)) + ")";
      for (var sn = 0; sn < 40; sn++) {
        var sx = ((sn * 127.3 + t * (12 + sn % 5 * 4)) % (W + 20)) - 10;
        var sy = ((sn * 61.7 + t * (26 + sn % 7 * 6)) % (H + 20)) - 10;
        ctx.beginPath(); ctx.arc(sx, sy, sn % 3 ? 1.1 : 1.7, 0, 6.284); ctx.fill();
      }
    }

    /* festive lights on the branch tips, at night, in the last week of the year */
    if (FESTIVE && night > 0.2) {
      for (var li = 0; li < tips.length; li += 9) {
        var tp = tips[li];
        var tw = 0.5 + 0.5 * Math.sin(t * 2.2 + li);
        var col = li % 27 === 0 ? "224,120,80" : li % 18 === 0 ? "224,180,80" : "180,200,120";
        ctx.fillStyle = "rgba(" + col + "," + (night * tw * 0.9) + ")";
        ctx.beginPath(); ctx.arc(tp.x, tp.y + 2, 1.6, 0, 6.284); ctx.fill();
      }
    }

    /* the bird: arrives now and then while the canopy is full */
    if (p < 0.18) {
      if (bird.state === 0 && t > bird.next) {
        bird.state = 1; bird.t0 = t;
        perch = tips[(tips.length * 0.3 | 0)];
      }
      if (bird.state === 1 && perch) {
        var bt = (t - bird.t0) / 3.2;
        if (bt >= 1) { bird.state = 2; bird.t0 = t; }
        var bx = lerp(-40, perch.x, smooth(bt));
        var by = lerp(H * 0.25, perch.y - 6, smooth(bt)) - Math.sin(bt * 3.14) * 60;
        drawBird(bx, by, t, true);
      } else if (bird.state === 2 && perch) {
        var hop = Math.abs(Math.sin(t * 3)) * 1.5;
        drawBird(perch.x, perch.y - 6 - hop, t, false);
        if (t - bird.t0 > 4.5) { bird.state = 3; bird.t0 = t; }
      } else if (bird.state === 3 && perch) {
        var lt = (t - bird.t0) / 2.6;
        if (lt >= 1) { bird.state = 0; bird.next = t + 34 + (t % 17); }
        drawBird(lerp(perch.x, W + 50, smooth(lt)),
                 lerp(perch.y - 6, H * 0.12, smooth(lt)) - Math.sin(lt * 3.14) * 40, t, true);
      }
    } else if (bird.state !== 0) { bird.state = 0; bird.next = t + 20; }

    /* fireflies: ten still seconds in the dusk, and they come to the cursor */
    var nightish = p > 0.45 && p < 0.92 && descend < 0.6;
    if (nightish && performance.now() - idleSince > 10000) {
      if (flies.length === 0) {
        for (var fl = 0; fl < 12; fl++) {
          flies.push({ x: Math.random() * W, y: Math.random() * H * 0.7,
                       vx: 0, vy: 0, ph: Math.random() * 6.28 });
        }
      }
      flies.forEach(function (F) {
        var tx = pointer.x > 0 ? pointer.x : W / 2;
        var ty = pointer.y > 0 ? pointer.y : H * 0.4;
        F.vx += ((tx - F.x) * 0.0004 + Math.sin(t * 1.3 + F.ph) * 0.02);
        F.vy += ((ty - F.y) * 0.0004 + Math.cos(t * 1.1 + F.ph) * 0.02);
        F.vx *= 0.96; F.vy *= 0.96;
        F.x += F.vx; F.y += F.vy;
        var glow = 0.35 + 0.65 * Math.abs(Math.sin(t * 1.7 + F.ph));
        var g3 = ctx.createRadialGradient(F.x, F.y, 0, F.x, F.y, 9);
        g3.addColorStop(0, "rgba(226,210,120," + 0.85 * glow + ")");
        g3.addColorStop(1, "rgba(226,210,120,0)");
        ctx.fillStyle = g3;
        ctx.beginPath(); ctx.arc(F.x, F.y, 9, 0, 6.284); ctx.fill();
      });
    } else if (flies.length && !nightish) flies.length = 0;

    /* the K burst, when the name has been clicked five times */
    if (EGG.burst) {
      var B = EGG.burst, bp = (t - B.t0) / 2.6;
      if (bp >= 1) { EGG.burst = null; }
      else {
        B.pts.forEach(function (P, i) {
          var e2 = smooth(Math.min(1, bp * 2.2 - P.d * 0.4));
          var fade = bp > 0.75 ? (1 - bp) / 0.25 : 1;
          var px2 = lerp(P.sx, P.tx, e2), py2 = lerp(P.sy, P.ty, e2);
          ctx.fillStyle = "rgba(" + P.c + "," + (0.9 * fade) + ")";
          ctx.save(); ctx.translate(px2, py2); ctx.rotate(bp * P.r);
          ctx.beginPath(); ctx.moveTo(0, -4); ctx.quadraticCurveTo(2.8, -0.8, 0, 4);
          ctx.quadraticCurveTo(-2.8, -0.8, 0, -4); ctx.fill(); ctx.restore();
        });
      }
    }

    /* petals while the 3523 spring holds */
    if (EGG.blossom > 0.05) {
      ctx.fillStyle = "rgba(242,210,221," + (0.8 * EGG.blossom) + ")";
      for (var pt2 = 0; pt2 < 26; pt2++) {
        var pxx = ((pt2 * 193.7 + t * (18 + pt2 % 5 * 6)) % (W + 30)) - 15;
        var pyy = ((pt2 * 97.3 + t * (34 + pt2 % 7 * 8)) % (H + 30)) - 15;
        ctx.save(); ctx.translate(pxx, pyy); ctx.rotate(t * 2 + pt2);
        ctx.beginPath(); ctx.ellipse(0, 0, 2.6, 1.6, 0, 0, 6.284); ctx.fill(); ctx.restore();
      }
    }
  }

  function drawBird(x, y, t, flying) {
    ctx.save();
    ctx.translate(x, y);
    ctx.fillStyle = "#2a2019";
    ctx.beginPath(); ctx.ellipse(0, 0, 7, 4.5, -0.15, 0, 6.284); ctx.fill();   // body
    ctx.beginPath(); ctx.arc(6, -3, 3, 0, 6.284); ctx.fill();                  // head
    ctx.fillStyle = "#c98a3c";
    ctx.beginPath(); ctx.moveTo(8.6, -3.4); ctx.lineTo(12, -2.6); ctx.lineTo(8.6, -1.8); ctx.fill();  // beak
    ctx.fillStyle = "#2a2019";
    ctx.beginPath(); ctx.moveTo(-6, -1); ctx.lineTo(-13, 1.5); ctx.lineTo(-6, 2.4); ctx.fill();       // tail
    if (flying) {
      var w2 = Math.sin(t * 18) * 8;
      ctx.beginPath(); ctx.moveTo(-1, -1);
      ctx.quadraticCurveTo(-3, -8 - w2, -10, -6 - w2);
      ctx.quadraticCurveTo(-4, -1, -1, 0); ctx.fill();
    } else {
      ctx.beginPath(); ctx.ellipse(-1, -0.5, 4.5, 2.6, -0.3, 0, 6.284); ctx.fill();
    }
    ctx.restore();
  }

  /* ------------------------------------------------------ scroll wiring */
  var film = document.getElementById("filmScroll");
  var progress = 0;

  function readScroll() {
    var r = film.getBoundingClientRect();
    var span = r.height - window.innerHeight;
    progress = span > 0 ? clamp(-r.top / span, 0, 1) : 1;
  }

  function ui(p) {
    if (nameEl) {
      var fade = smooth((p - 0.07) / 0.18);
      nameEl.style.opacity = 1 - fade;
      nameEl.style.transform = "translateY(" + (-fade * 40) + "px)";
      nameEl.style.filter = "blur(" + fade * 6 + "px)";
    }
    if (hintEl) hintEl.classList.toggle("off", p > 0.03);
    if (portal) {
      var on = p > 0.87;
      portal.classList.toggle("live", on);
    }
    document.documentElement.style.setProperty("--filmp", p.toFixed(3));
  }

  var raf = null;
  var shown = 0;   // the displayed progress eases toward the scroll target
  function loop(now) {
    shown += (progress - shown) * 0.16;
    if (Math.abs(progress - shown) < 0.0004) shown = progress;
    draw(shown, now);
    ui(shown);
    raf = requestAnimationFrame(loop);
  }

  if (reduced) {
    // the final still, doors open, no film
    resize();
    readScroll();
    draw(1, 0); ui(1);
    if (portal) portal.classList.add("live");
    window.addEventListener("resize", function () { resize(); draw(1, 0); });
  } else {
    window.addEventListener("scroll", readScroll, { passive: true });
    window.addEventListener("resize", resize);
    resize();
    readScroll();
    raf = requestAnimationFrame(loop);
    // spare the battery when the film is off-screen
    new IntersectionObserver(function (es) {
      if (es[0].isIntersecting) { if (!raf) raf = requestAnimationFrame(loop); }
      else if (raf) { cancelAnimationFrame(raf); raf = null; }
    }).observe(stage);
  }
})();

/* sound: wind, leaves and night crickets, synthesised, off until asked */
(function(){
  var btn = document.getElementById("sndBtn");
  if (!btn) return;
  var on = false, actx = null, wind = null, windGain = null, cricketTimer = null;

  function makeNoise(ac) {
    var len = ac.sampleRate * 2;
    var buf = ac.createBuffer(1, len, ac.sampleRate);
    var d = buf.getChannelData(0);
    var last = 0;
    for (var i = 0; i < len; i++) {                 // brown-ish noise = wind
      last = (last + (Math.random() * 2 - 1) * 0.03) * 0.985;
      d[i] = last * 4;
    }
    var src = ac.createBufferSource();
    src.buffer = buf; src.loop = true;
    return src;
  }
  function chirp(ac, when) {
    var o = ac.createOscillator(), g = ac.createGain();
    o.type = "sine"; o.frequency.value = 4200 + Math.random() * 600;
    g.gain.setValueAtTime(0, when);
    for (var k = 0; k < 4; k++) {
      g.gain.setValueAtTime(0.012, when + k * 0.055);
      g.gain.setValueAtTime(0, when + k * 0.055 + 0.03);
    }
    o.connect(g); g.connect(ac.destination);
    o.start(when); o.stop(when + 0.4);
  }
  function start() {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    actx.resume();
    var lp = actx.createBiquadFilter();
    lp.type = "lowpass"; lp.frequency.value = 420; lp.Q.value = 0.4;
    windGain = actx.createGain(); windGain.gain.value = 0.05;
    wind = makeNoise(actx);
    wind.connect(lp); lp.connect(windGain); windGain.connect(actx.destination);
    wind.start();
    // wind follows the film; crickets only at dusk
    cricketTimer = setInterval(function(){
      if (!actx) return;
      var p = parseFloat(getComputedStyle(document.documentElement).getPropertyValue("--filmp")) || 0;
      if (windGain) windGain.gain.value = 0.03 + p * 0.06 * (p < 0.7 ? 1 : (1 - p) * 3);
      if (p > 0.45 && p < 0.9 && Math.random() < 0.5) chirp(actx, actx.currentTime + Math.random() * 1.5);
    }, 1800);
  }
  function stop() {
    if (cricketTimer) clearInterval(cricketTimer);
    if (wind) { try { wind.stop(); } catch(e){} wind = null; }
    if (actx) actx.suspend();
  }
  function paint() {
    document.getElementById("sndOff").style.display = on ? "none" : "";
    document.getElementById("sndOn").style.display = on ? "" : "none";
    btn.setAttribute("aria-pressed", on ? "true" : "false");
  }
  btn.addEventListener("click", function(){
    on = !on;
    if (on) start(); else stop();
    paint();
    try { localStorage.setItem("snd", on ? "1" : "0"); } catch(e){}
  });
})();
