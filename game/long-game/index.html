}

function freeResolve(yourMove) {
  var entry = G.freeEntry;
  var b = bookOf("Neighbour");
  var theirMove = DISPOSITIONS[entry.disp].move(b.you, b.them, b.theirPays, G.pay);
  var r = playRound(yourMove, theirMove, G.noise, rnd, G.pay);
  b.you.push(r.a); b.them.push(r.b);
  b.yourPays.push(r.aPay); b.theirPays.push(r.bPay);
  b.youTot += r.aPay; b.themTot += r.bPay;
  G.you += r.aPay; G.them += r.bPay;
  G.seasonInCh++;
  LOG.push({ chapter: 0, season: G.seasonInCh - 1, who: "Neighbour", disp: entry.disp,
             youIntended: r.aIntent, themIntended: r.bIntent, you: r.a, them: r.b,
             youLost: r.aLost, themLost: r.bLost, youPay: r.aPay, themPay: r.bPay });
  G.last = { r: r, name: "The neighbour" };
  scene.exchange = { you: r.aIntent, them: r.bIntent, youLost: r.aLost, themLost: r.bLost, u: 0 };
  advanceWorld();
  var carriesOn = rnd() < (G.freeCfg.w / 100);
  G.freeOver = !carriesOn;
  if (!nb.hidden) renderNotebook();
  view("freePlay");
}

VIEWS.freePlay = function () {
  var c = G.freeCfg;
  var d = DISPOSITIONS[c.disp];
  setTop("Free play", SEASON_NAMES[world.season] + ", season " + (G.seasonInCh + 1));
  if (G.last) {
    kick("Season " + G.seasonInCh + " closed");
    head(outcomeLine(G.last.r));
    para(resultWords(G.last.r, "The neighbour"), "say");
  } else {
    kick("Free play");
    head("Season one");
    para("The neighbour is at the fence. You have set the numbers yourself and you know who is standing there.");
  }
  if (G.freeOver) {
    para("The seasons stopped. Nobody announced it and nobody planned for it, which is the only reason the whole run was worth playing honestly.");
    para("You finished on " + G.you + " baskets over " + G.seasonInCh + " seasons, and the neighbour on " + G.them + ". Both sharing every season would have given each of you " + (G.pay.R * G.seasonInCh) + ".");
    var rr = actions();
    btn(rr, "Set it up again", "again", function () { G.last = null; G.freeOver = false; view("freeSetup"); }, "big");
    btn(rr, "Back to the ending", null, function () { G.last = null; G.freeOver = false; view("ending"); }, "quiet");
    say("The seasons stopped after " + G.seasonInCh + ". You finished on " + G.you + " baskets.");

  }
  var r = actions();
  btn(r, "Share the harvest", "press s", function () { freeResolve("C"); }, "big share");
  btn(r, "Keep the harvest", "press k", function () { freeResolve("D"); }, "big keep");
  tallyLine("Your cellar", "The neighbour");
  var note = para("Across the fence: " + d.name.toLowerCase() + ", known in the books as " + d.formal + ". " + d.tell +
    " Sacks lost on the road: " + c.noise + " in a hundred. The seasons carry on with a chance of " + c.w + " in a hundred.");
  note.style.fontSize = ".85rem";
  var r2 = actions();
  btn(r2, "Change the numbers", null, function () { G.last = null; view("freeSetup"); }, "quiet");
  say(SEASON_NAMES[world.season] + ", season " + (G.seasonInCh + 1) + ". Share the harvest or keep the harvest. You have " + G.you + " baskets.");
};

/* ============================================================
   12. keyboard, resize, boot
   ============================================================ */

document.addEventListener("keydown", function (e) {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  var tag = (e.target && e.target.tagName) || "";
  if (tag === "INPUT" || tag === "SELECT" || tag === "TEXTAREA") return;
  var k = e.key.toLowerCase();
  if (k === "n" && !nbBtn.hidden) { e.preventDefault(); showNotebook(nb.hidden); return; }
  if (G.view === "ask") {
    if (k === "s") { e.preventDefault(); G.acted = true; resolve("C"); }
    else if (k === "k") { e.preventDefault(); G.acted = true; resolve("D"); }
  } else if (G.view === "freePlay" && !G.freeOver) {
    if (k === "s") { e.preventDefault(); G.acted = true; freeResolve("C"); }
    else if (k === "k") { e.preventDefault(); G.acted = true; freeResolve("D"); }
  }
});

$("menuBtn").addEventListener("click", function () {
  stopTimer(); G.running = false; G.acted = true; G.last = null; G.freeOver = false;
  view("title");
});

var rsz;
window.addEventListener("resize", function () {
  clearTimeout(rsz);
  rsz = setTimeout(resize, 120);
}, { passive: true });

/* a hook for testing and for anyone who wants to check the arithmetic */
window.__LG = {
  state: G, log: LOG, disp: DISPOSITIONS, payoff: payoff, playRound: playRound,
  match: match, dilemmaCheck: dilemmaCheck,
  view: function () { return G.view; },

    for (var i = 0; i < bs.length; i++) {
      if (bs[i].textContent.toLowerCase().indexOf(label.toLowerCase()) === 0) { bs[i].click(); return true; }
    }
    return false;
  },
  buttons: function () {
    return Array.prototype.map.call(panel.querySelectorAll("button"), function (b) { return b.textContent; });
  },
  goto: function (n) { G.acted = true; startChapter(n); view("chapterIntro"); },
  years: function () { return G.years; },
  reduced: reduced
};

resize();
view("title");
requestAnimationFrame(frame);

})();

  var base = {}, baseA = {};
  var SEL  = ".bar [data-i], .site-foot [data-i], .k-crown-no[data-i]";
  var SELA = ".bar [data-ia], .site-foot [data-ia]";
  function apply(l){
    if(!D[l]) l = "en";
    var d = D[l] || {};
    document.querySelectorAll(SEL).forEach(function(el){
      var k = el.getAttribute("data-i");
      if(!(k in base)) base[k] = el.innerHTML;
      el.innerHTML = (l === "en" || d[k] === undefined) ? base[k] : d[k];
    });
    document.querySelectorAll(SELA).forEach(function(el){
      var k = el.getAttribute("data-ia");
      if(!(k in baseA)) baseA[k] = el.getAttribute("aria-label") || "";
      el.setAttribute("aria-label", (l === "en" || d[k] === undefined) ? baseA[k] : d[k]);
    });
    document.documentElement.setAttribute("lang", l);
    document.querySelectorAll(".langs button").forEach(function(b){
      b.setAttribute("aria-pressed", b.getAttribute("data-lang") === l ? "true" : "false");
    });
    try { localStorage.setItem(KEY, l); } catch (e) {}
    window.__lang = l;
  }
  document.querySelectorAll(".langs button").forEach(function(b){
    b.addEventListener("click", function(){ apply(b.getAttribute("data-lang")); });
  });
  window.__chrome = apply;
  apply(lang);
})();

</script>
