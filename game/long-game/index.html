  treeCanvas = document.createElement("canvas");
  treeCanvas.width = treeW; treeCanvas.height = treeH;
  var g = treeCanvas.getContext("2d");
  treeTips = [];
  var baseX = treeW * 0.5, baseY = treeH;

  function limb(x, y, ang, len, wid, depth) {
    if (depth > 7 || len < 5 || wid < 0.6) { treeTips.push({ x: x, y: y, s: depth / 7 }); return; }
    var a = ang + (rnd() - 0.5) * 0.34;
    var nx = x + Math.cos(a) * len, ny = y + Math.sin(a) * len;
    var bow = (rnd() - 0.5) * len * 0.3;
    g.strokeStyle = "rgb(" + Math.round(lerp(58, 118, depth / 7)) + "," +
                    Math.round(lerp(44, 96, depth / 7)) + "," +
                    Math.round(lerp(30, 70, depth / 7)) + ")";
    g.lineWidth = wid; g.lineCap = "round";
    g.beginPath();
    g.moveTo(x, y);
    g.quadraticCurveTo((x + nx) / 2 - Math.sin(a) * bow, (y + ny) / 2 + Math.cos(a) * bow, nx, ny);
    g.stroke();
    var kids = depth < 2 ? 3 : 2;
    for (var k = 0; k < kids; k++) {
      var na = a + (k - (kids - 1) / 2) * lerp(0.42, 0.86, rnd()) + (rnd() - 0.5) * 0.22;
      limb(nx, ny, na, len * lerp(0.66, 0.82, rnd()), wid * 0.62, depth + 1);
    }
  }
  limb(baseX, baseY, -Math.PI / 2, treeH * 0.25, small ? 10 : 14, 0);

  leaves = [];
  var n = small ? 320 : 620;
  for (var i = 0; i < n; i++) {
    var tip = treeTips[(rnd() * treeTips.length) | 0];
    var ang = rnd() * 6.283, spread = lerp(4, 30, rnd());
    leaves.push({
      x: tip.x + Math.cos(ang) * spread,
      y: tip.y + Math.sin(ang) * spread * 0.82 - 4,
      sz: lerp(2.6, 5.4, rnd()) * (small ? 0.85 : 1),
      gi: (rnd() * GREENS.length) | 0,
      ai: (rnd() * AUTUMN.length) | 0,
      bi: (rnd() * BLOSSOM.length) | 0,
      sway: rnd(), ph: rnd() * 6.283, tilt: rnd() * 6.283,
      keep: rnd()
    });
  }
}

function buildGrass() {
  grassKey = world.prev * 100 + world.season * 10 + Math.round(world.mix * 2);
  grassW = Math.max(360, Math.ceil(W));
  grassFrames = [];
  var win = sw(3), aut = sw(2), spr = sw(0);
  for (var f = 0; f < 3; f++) {
    var c = document.createElement("canvas");
    c.width = grassW; c.height = 24;
    var g = c.getContext("2d");
    g.lineCap = "round";
    var rnd = mulberry(9182 + f * 0);
    var tufts = Math.round(grassW / 9);
    for (var i = 0; i < tufts; i++) {
      var gx = rnd() * grassW, ph = rnd() * 6.283;
      var blades = 3 + (rnd() * 3 | 0);
      for (var b = 0; b < blades; b++) {
        var bx = gx + (rnd() - 0.5) * 6;
        var hgt = 5 + rnd() * 10;
        var lean = Math.sin(f / 3 * 6.283 + ph + b * 0.9) * (1.8 + hgt * 0.15);
        var u = rnd();
        var r = Math.round(lerp(lerp(74, 148, u * 0.5), 170, aut * 0.55 + win * 0.72));
        var gg = Math.round(lerp(lerp(106, 138, u), 152, win * 0.75));
        var bb = Math.round(lerp(lerp(52, 70, u * 0.4), 132, win * 0.85));
        g.strokeStyle = "rgba(" + r + "," + gg + "," + bb + ",.86)";
        g.lineWidth = 1.25 - hgt * 0.028;
        g.beginPath();
        g.moveTo(bx, 23);
        g.bezierCurveTo(bx + lean * 0.15, 23 - hgt * 0.45,
                        bx + lean * 0.6, 23 - hgt * 0.85,
                        bx + lean + (rnd() - 0.5) * 3, 23 - hgt);
        g.stroke();
      }
      if (rnd() < 0.09 * Math.max(0, 1 - win * 1.4) * (1 - aut * 0.5)) {
        var fx = gx + 2, fy = 23 - 8 - rnd() * 4;
        g.strokeStyle = "rgba(88,118,60,.8)"; g.lineWidth = 0.9;
        g.beginPath(); g.moveTo(fx, 23); g.lineTo(fx, fy + 2); g.stroke();
        g.fillStyle = rnd() < 0.5 ? "rgba(246,242,230,.95)" : "rgba(232,196,90,.95)";
        for (var pe = 0; pe < 5; pe++) {
          var pa = pe * 1.257 + f;
          g.beginPath();
          g.ellipse(fx + Math.cos(pa) * 2, fy + Math.sin(pa) * 2, 1.4, 0.85, pa, 0, 6.283);
          g.fill();
        }
        g.fillStyle = spr > 0.4 ? "rgba(240,170,60,.9)" : "rgba(120,90,40,.9)";
        g.beginPath(); g.arc(fx, fy, 1.1, 0, 6.283); g.fill();
      }
    }
    grassFrames.push(c);
  }
}

function buildFarVillage() {
  var rnd = mulberry(4711);
  farVillage = [];
  for (var i = 0; i < 6; i++) {
    farVillage.push({ u: 0.05 + i * 0.165 + (rnd() - 0.5) * 0.05, w: 16 + rnd() * 14, h: 12 + rnd() * 12, lit: rnd() });
  }
}

function resize() {
  DPR = Math.min(2, window.devicePixelRatio || 1);
  W = window.innerWidth; H = window.innerHeight;
  small = W < 700;
  cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
  cv.style.width = W + "px"; cv.style.height = H + "px";
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  layout();
  buildTree(); buildGrass(); buildFarVillage();
  draw(world.t);
}

function layout() {
  var panel = $("panel");
  var top = panel ? panel.getBoundingClientRect().top : H * 0.7;
  GY = clamp(top - 10, H * 0.34, H * 0.84);
  CX = W * 0.5;
  DX = small ? Math.min(66, W * 0.19) : Math.min(140, W * 0.15);
}

/* ---- ground shadow, the way the portfolio does it ---- */
function groundShadow(x, w, a) {
  ctx.save();
  ctx.translate(x, GY + 1);
  ctx.scale(1, 0.2);
  var g = ctx.createRadialGradient(0, 0, 0, 0, 0, w);
  g.addColorStop(0, "rgba(20,14,8," + a + ")");
  g.addColorStop(1, "rgba(20,14,8,0)");
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.arc(0, 0, w, 0, 6.283); ctx.fill();
  ctx.restore();
}

/* ---- the sky, the light and the weather ---- */

function skyPair() {
  var d = world.dayT;
  var day = seasonBlend(SKY_DAY, "top"), dayB = seasonBlend(SKY_DAY, "bot");
  var dusk = seasonBlend(SKY_DUSK, "top"), duskB = seasonBlend(SKY_DUSK, "bot");
  var night = seasonBlend(SKY_NIGHT, "top"), nightB = seasonBlend(SKY_NIGHT, "bot");
  var top, bot;
  if (d < 0.6) { var u = smooth(d / 0.6); top = mix(day, dusk, u); bot = mix(dayB, duskB, u); }
  else { var v = smooth((d - 0.6) / 0.4); top = mix(dusk, night, v); bot = mix(duskB, nightB, v); }
  return { top: top, bot: bot, night: clamp((d - 0.55) / 0.35, 0, 1) };
}

function drawSky(t) {
  var sk = skyPair();
  var g = ctx.createLinearGradient(0, 0, 0, GY + 40);
  g.addColorStop(0, rgb(sk.top));
  g.addColorStop(1, rgb(sk.bot));
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);

  /* stars, once it is dark enough */
  if (sk.night > 0.08) {
    var rnd = mulberry(3311);
    ctx.save();
    for (var i = 0; i < (small ? 46 : 90); i++) {
      var sx = rnd() * W, sy = rnd() * GY * 0.72;
      var tw = 0.45 + Math.sin(t * (0.8 + rnd() * 1.6) + i) * 0.35;
      ctx.fillStyle = "rgba(236,232,216," + (sk.night * tw * 0.8) + ")";
      ctx.fillRect(sx, sy, 1.5, 1.5);
    }
    ctx.restore();
  }

  /* the sun goes down as the chapter goes on, and the moon comes up */
  var sunU = world.dayT;
  var arcX = W * (0.24 + sunU * 0.6);
  var arcY = GY * (0.62 - Math.sin((1 - Math.abs(sunU - 0.35) / 0.85)) * 0.28);
  arcY = GY * (0.26 + Math.pow(clamp((sunU - 0.1) / 0.8, 0, 1), 1.7) * 0.56);
  var sunA = 1 - clamp((sunU - 0.55) / 0.28, 0, 1);
  if (sunA > 0.02) {
    var warm = mix([250, 240, 212], [244, 168, 96], smooth(clamp((sunU - 0.25) / 0.4, 0, 1)));
    var hg = ctx.createRadialGradient(arcX, arcY, 0, arcX, arcY, GY * 0.5);
    hg.addColorStop(0, rgb(warm, 0.3 * sunA));
    hg.addColorStop(1, rgb(warm, 0));
    ctx.fillStyle = hg;
    ctx.fillRect(arcX - GY * 0.5, arcY - GY * 0.5, GY, GY);
    ctx.fillStyle = rgb(warm, 0.95 * sunA);
    ctx.beginPath(); ctx.arc(arcX, arcY, small ? 13 : 17, 0, 6.283); ctx.fill();
  }
  if (sk.night > 0.2) {
    var mx = W * 0.78, my = GY * 0.2;
    ctx.fillStyle = "rgba(238,236,222," + (0.9 * sk.night) + ")";
    ctx.beginPath(); ctx.arc(mx, my, small ? 11 : 14, 0, 6.283); ctx.fill();
    ctx.fillStyle = rgb(sk.top, 0.85 * sk.night);
    ctx.beginPath(); ctx.arc(mx + 5, my - 4, small ? 10 : 13, 0, 6.283); ctx.fill();
  }

  /* birds working a thermal, quiet and far off */
  if (sk.night < 0.6 && sw(3) < 0.7) {
    var bn = small ? 3 : 5;
    ctx.strokeStyle = "rgba(70,60,48," + (0.45 * (1 - sk.night)) + ")";
    ctx.lineWidth = 1.2;
    for (var bi = 0; bi < bn; bi++) {
      var ba = t * (0.16 + bi * 0.03) + bi * 2.1;
      var brr = (small ? 26 : 44) + bi * (small ? 7 : 11);
      var bx2 = W * 0.68 + Math.cos(ba) * brr;
      var by2 = GY * 0.34 + Math.sin(ba) * brr * 0.4 - bi * 7;
      var bf = reduced ? 1.4 : Math.sin(t * 5 + bi * 2.4) * 2.2;
      ctx.beginPath();
      ctx.moveTo(bx2 - 5, by2);
      ctx.quadraticCurveTo(bx2 - 2.5, by2 - 3 - bf, bx2, by2);
      ctx.quadraticCurveTo(bx2 + 2.5, by2 - 3 - bf, bx2 + 5, by2);
      ctx.stroke();
    }
  }

  /* three cloud masses, slow */
  var cloudA = 0.5 * (1 - sk.night * 0.7);
  if (cloudA > 0.02) {
    var cl = [[0.09, 0.16, 1.15, 13], [0.42, 0.10, 0.85, 9], [0.72, 0.22, 1.0, 17]];
    for (var c = 0; c < 3; c++) {
      var cx = ((t * cl[c][3] * 0.35 + cl[c][0] * (W + 400)) % (W + 400)) - 200;
      var cy = GY * cl[c][1];
      var s = cl[c][2] * (small ? 0.7 : 1);
      ctx.fillStyle = "rgba(248,245,236," + (cloudA * 0.62) + ")";
      for (var p = 0; p < 5; p++) {
        ctx.beginPath();
        ctx.ellipse(cx + p * 26 * s, cy + Math.sin(p * 1.7) * 5 * s,
                    (26 - Math.abs(p - 2) * 6) * s, (13 - Math.abs(p - 2) * 2.4) * s, 0, 0, 6.283);
        ctx.fill();
      }
    }
  }
}

function hill(y, amp, freq, ph, col) {
  ctx.fillStyle = col;
  ctx.beginPath();
  ctx.moveTo(-20, H);
  for (var x = -20; x <= W + 20; x += 10) {
    ctx.lineTo(x, y + Math.sin(x * freq * 6.28 + ph) * amp * 0.4 + Math.sin(x * freq * 17 + ph * 1.7) * amp * 0.2);
  }
  ctx.lineTo(W + 20, H);
  ctx.closePath(); ctx.fill();
}

function drawLand(t) {
  var sk = skyPair();
  var hz = seasonBlend(HAZE);
  hz = mix(hz, [40, 44, 58], sk.night * 0.75);

  hill(GY - (small ? 42 : 66), small ? 16 : 26, 0.0011, 8, rgb(hz, 0.34));

  /* the rest of the village, far off, its windows lighting at dusk */
  for (var i = 0; i < farVillage.length; i++) {
    var v = farVillage[i];
    var vx = v.u * W, vy = GY - (small ? 18 : 27), vw = v.w * (small ? 0.4 : 0.58), vh = v.h * (small ? 0.4 : 0.58);
    ctx.fillStyle = rgb(mix(hz, [52, 42, 30], 0.82), 0.9);
    ctx.fillRect(vx, vy - vh, vw, vh);
    ctx.beginPath();
    ctx.moveTo(vx - 3, vy - vh); ctx.lineTo(vx + vw / 2, vy - vh - vh * 0.5); ctx.lineTo(vx + vw + 3, vy - vh);
    ctx.closePath(); ctx.fill();
    if (sk.night > 0.25 && v.lit > 0.3) {
      ctx.fillStyle = "rgba(240,196,110," + (0.75 * sk.night) + ")";
      ctx.fillRect(vx + vw * 0.35, vy - vh * 0.6, 2.2, 2.2);
    }
  }
  hill(GY - (small ? 16 : 26), small ? 10 : 15, 0.0017, 40, rgb(hz, 0.62));

  /* haze over the far ground */
  var fog = ctx.createLinearGradient(0, GY - (small ? 60 : 92), 0, GY);
  fog.addColorStop(0, rgb(hz, 0));
  fog.addColorStop(1, rgb(hz, 0.3));
  ctx.fillStyle = fog;
  ctx.fillRect(0, GY - (small ? 60 : 92), W, small ? 60 : 92);

  /* soil */
  var soil = ctx.createLinearGradient(0, GY, 0, H);
  var s0 = mix([64, 52, 36], [26, 24, 38], sk.night * 0.7);
  var s1 = mix([44, 33, 21], [16, 16, 28], sk.night * 0.7);
  soil.addColorStop(0, rgb(s0));
  soil.addColorStop(1, rgb(s1));
  ctx.fillStyle = soil;
  ctx.fillRect(0, GY, W, H - GY);

  /* grass along the line of the ground */
  if (grassKey !== (world.prev * 100 + world.season * 10 + Math.round(world.mix * 2)) || grassW < W) buildGrass();
  var ph = reduced ? 0 : (Math.sin(t * 0.9) * 0.5 + 0.5);
  var f0 = Math.floor(ph * 3) % 3, f1 = (f0 + 1) % 3, u = (ph * 3) % 1;
  ctx.save();
  ctx.globalAlpha = 1;
  ctx.drawImage(grassFrames[f0], 0, GY - 22, grassW, 24);
  ctx.globalAlpha = u;
  ctx.drawImage(grassFrames[f1], 0, GY - 22, grassW, 24);
  ctx.globalAlpha = 1;
  if (sk.night > 0.03) {
    ctx.fillStyle = "rgba(22,25,42," + (0.4 * sk.night) + ")";
    ctx.fillRect(0, GY - 22, W, H - GY + 22);
  }
  ctx.restore();
}

/* ---- the house: timber walls, a terracotta roof, a window that lights ---- */

function drawHouse(t) {
  var sk = skyPair();
  var s = small ? 0.76 : 1.05;
  var hx = small ? W * 0.17 : W * 0.145, hy = GY;
  ctx.save();
  ctx.translate(hx, hy);
  ctx.scale(s, s);

  var lit = Math.max(sk.night, sw(3) * 0.22);

  /* smoke from the chimney in the cold half of the year and after dark */
  if (sw(3) > 0.35 || sw(2) > 0.5 || sk.night > 0.25) {
    for (var m = 0; m < 3; m++) {
      var st = ((reduced ? 0.4 : t * 0.22) + m * 0.33) % 1;
      ctx.fillStyle = "rgba(200,195,185," + (0.2 * (1 - st)) + ")";
      ctx.beginPath();
      ctx.arc(28 + Math.sin(st * 5 + m) * 6, -102 - st * 34, 4 + st * 7, 0, 6.283);
      ctx.fill();
    }
  }

  groundShadow(0, 60, 0.3 * (1 - sk.night * 0.5));

  /* stone foundation */
  ctx.fillStyle = "#4a4038";
  ctx.fillRect(-48, -7, 96, 7);
  ctx.fillStyle = "rgba(120,110,96,.5)";
  for (var f = 0; f < 6; f++) {
    ctx.beginPath(); ctx.ellipse(-40 + f * 16, -3.5, 6.5, 2.6, 0, 0, 6.283); ctx.fill();
  }

  /* walls */
  var wg = ctx.createLinearGradient(0, -72, 0, -7);
  wg.addColorStop(0, "#67503a");
  wg.addColorStop(1, "#523d29");
  ctx.fillStyle = wg;
  ctx.fillRect(-46, -72, 92, 65);
  for (var pl = 1; pl < 6; pl++) {
    var py = -72 + pl * 11;
    ctx.strokeStyle = "rgba(30,20,12,.35)"; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(-46, py); ctx.lineTo(46, py); ctx.stroke();
    ctx.strokeStyle = "rgba(180,150,110,.14)";
    ctx.beginPath(); ctx.moveTo(-46, py + 1); ctx.lineTo(46, py + 1); ctx.stroke();
  }
  ctx.fillStyle = "#4a3826";
  ctx.fillRect(-48, -73, 4, 66);
  ctx.fillRect(44, -73, 4, 66);
  var es = ctx.createLinearGradient(0, -72, 0, -58);
  es.addColorStop(0, "rgba(15,10,6,.45)");
  es.addColorStop(1, "rgba(15,10,6,0)");
  ctx.fillStyle = es;
  ctx.fillRect(-46, -72, 92, 14);

  /* roof: shingled courses of terracotta, snowed over in winter */
  ctx.save();
  ctx.beginPath();
  ctx.moveTo(-58, -68); ctx.lineTo(0, -112); ctx.lineTo(58, -68);
  ctx.closePath();
  var rg = ctx.createLinearGradient(0, -112, 0, -68);
  rg.addColorStop(0, "#8a4a2c");
  rg.addColorStop(1, "#66311c");
  ctx.fillStyle = rg;
  ctx.fill();
  ctx.clip();
  for (var row = 0; row < 6; row++) {
    var ry = -70 - row * 7.5, off = row % 2 ? 4 : 0;
    ctx.fillStyle = row % 2 ? "rgba(196,110,66,.2)" : "rgba(96,42,22,.24)";
    ctx.beginPath();
    for (var s2 = -8; s2 <= 8; s2++) ctx.arc(s2 * 8 + off, ry, 4.4, Math.PI, 0, true);
    ctx.lineTo(66, ry + 7.5); ctx.lineTo(-66, ry + 7.5);
    ctx.closePath(); ctx.fill();
    ctx.strokeStyle = "rgba(30,12,6,.42)"; ctx.lineWidth = 1;
    ctx.beginPath();
    for (var s3 = -8; s3 <= 8; s3++) ctx.arc(s3 * 8 + off, ry, 4.4, Math.PI, 0, true);
    ctx.stroke();
  }
  var snow = sw(3);
  if (snow > 0.05) {
    ctx.globalAlpha = snow;
    var sg = ctx.createLinearGradient(0, -112, 0, -70);
    sg.addColorStop(0, "rgba(236,238,236,.96)");
    sg.addColorStop(1, "rgba(236,238,236,.34)");
    ctx.fillStyle = sg;
    ctx.beginPath();
    ctx.moveTo(-58, -68); ctx.lineTo(0, -112); ctx.lineTo(58, -68); ctx.closePath(); ctx.fill();
    ctx.globalAlpha = 1;
  }
  ctx.restore();
  ctx.strokeStyle = snow > 0.5 ? "#d8dcd8" : "#3a1e10";
  ctx.lineWidth = 3; ctx.lineCap = "round";
  ctx.beginPath(); ctx.moveTo(-58, -70); ctx.lineTo(0, -113); ctx.lineTo(58, -70); ctx.stroke();

  /* chimney */
  ctx.fillStyle = "#4a3826"; ctx.fillRect(22, -104, 12, 26);
  ctx.fillStyle = "#33261a"; ctx.fillRect(20, -107, 16, 4);

  /* doorway */
  ctx.fillStyle = sk.night > 0.25 ? "rgba(46,30,14,.98)" : "rgba(16,11,7,.96)";
  ctx.fillRect(-16, -44, 22, 44);
  ctx.strokeStyle = "#3a2b1c"; ctx.lineWidth = 2.4;
  ctx.strokeRect(-17, -45, 24, 45);
  var dg = ctx.createLinearGradient(-16, 0, 6, 0);
  dg.addColorStop(0, "#46331f"); dg.addColorStop(1, "#33241a");
  ctx.fillStyle = dg; ctx.fillRect(-16, -44, 22, 44);
  ctx.strokeStyle = "rgba(18,12,7,.6)"; ctx.lineWidth = 1.4;
  ctx.strokeRect(-12.5, -40, 15, 16);
  ctx.strokeRect(-12.5, -20, 15, 16);
  ctx.fillStyle = "#c9a05a";
  ctx.beginPath(); ctx.arc(2.4, -21, 1.6, 0, 6.283); ctx.fill();
  ctx.fillStyle = "#4a3826"; ctx.fillRect(-20, -1.5, 30, 3.5);

  /* the window, lit at dusk */
  ctx.fillStyle = "#3a2b1c"; ctx.fillRect(14, -62, 21, 21);
  if (lit > 0.22) {
    var g2 = ctx.createRadialGradient(24.5, -51.5, 1, 24.5, -51.5, 12);
    g2.addColorStop(0, "rgba(244,196,110," + (0.72 + lit * 0.22) + ")");
    g2.addColorStop(1, "rgba(180,120,50," + (0.5 * lit) + ")");
    ctx.fillStyle = g2;
  } else ctx.fillStyle = "rgba(52,46,38,.95)";
  ctx.fillRect(16, -60, 17, 17);
  if (lit <= 0.22) {
    ctx.strokeStyle = "rgba(235,230,215,.35)"; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(18, -46); ctx.lineTo(30, -58); ctx.stroke();
  }
  ctx.strokeStyle = "#2c2014"; ctx.lineWidth = 1.6;
  ctx.strokeRect(16, -60, 17, 17);
  ctx.beginPath(); ctx.moveTo(16, -51.5); ctx.lineTo(33, -51.5);
  ctx.moveTo(24.5, -60); ctx.lineTo(24.5, -43); ctx.stroke();
  ctx.fillStyle = "#2c2014"; ctx.fillRect(14.5, -43, 20, 2.4);

  if (lit > 0.35) {
    var lg = ctx.createRadialGradient(24.5, -51.5, 2, 24.5, -51.5, 46);
    lg.addColorStop(0, "rgba(232,176,84," + (0.24 * lit) + ")");
    lg.addColorStop(1, "rgba(232,176,84,0)");
    ctx.fillStyle = lg;
    ctx.beginPath(); ctx.arc(24.5, -51.5, 46, 0, 6.283); ctx.fill();
  }
  ctx.restore();
}

/* ---- the tree ---- */

function drawTree(t) {
  if (!treeCanvas) return;
  var sk = skyPair();
  var s = small ? 0.74 : 0.98;
  var tx = small ? W * 0.82 : W * 0.83, ty = GY;
  ctx.save();
  ctx.translate(tx, ty);
  ctx.scale(s, s);
  groundShadow(0, treeW * 0.24, 0.26 * (1 - sk.night * 0.5));
  ctx.drawImage(treeCanvas, -treeW / 2, -treeH);
  var gust = reduced ? 0 : (0.5 + Math.sin(t * 0.5) * 0.5);
  var win = sw(3), aut = sw(2), spr = sw(0);
  for (var i = 0; i < leaves.length; i++) {
    var L = leaves[i];
    if (win > 0.5 && L.keep > 1 - (win - 0.5) * 1.6) continue;
    var col = GREENS[L.gi];
    if (aut > 0) col = mix(col, AUTUMN[L.ai], aut * 0.92);
    if (spr > 0 && L.gi % 3 === 0) col = mix(col, BLOSSOM[L.bi], spr * 0.9);
    if (win > 0) col = mix(col, FROST[0], win * 0.7);
    if (sk.night > 0) col = mix(col, [30, 34, 46], sk.night * 0.62);
    var sway = reduced ? 0 : Math.sin(t * 1.6 + L.ph) * (1.2 + L.sway * 5) * (0.4 + gust * 0.6);
    ctx.save();
    ctx.translate(-treeW / 2 + L.x + sway, -treeH + L.y);
    ctx.rotate(L.tilt + sway * 0.03);
    ctx.fillStyle = rgb(col);
    ctx.beginPath();
    ctx.moveTo(0, -L.sz);
    ctx.quadraticCurveTo(L.sz * 0.7, -L.sz * 0.2, 0, L.sz);
    ctx.quadraticCurveTo(-L.sz * 0.7, -L.sz * 0.2, 0, -L.sz);
    ctx.fill();
    ctx.restore();
  }
  ctx.restore();
}

/* ---- the fence, running away from the eye, and its gate post ---- */

function drawFence(t) {
  var sk = skyPair();
  var n = 6;
  var bx = CX, by = GY + (small ? 22 : 34);
  var tx = CX + (small ? 16 : 26), ty = GY - (small ? 34 : 54);
  var pts = [];
  for (var i = 0; i < n; i++) {
    var u = i / (n - 1);
    pts.push({ x: lerp(bx, tx, u), y: lerp(by, ty, u), h: lerp(small ? 34 : 52, small ? 13 : 20, u), w: lerp(4.4, 1.8, u) });
  }
  var dark = sk.night;
  var post = mix([103, 80, 58], [34, 32, 44], dark * 0.7);
  var rail = mix([120, 96, 68], [40, 38, 50], dark * 0.7);
  /* three rails, each one a tapering plank rather than a line */
  var levels = [0.74, 0.5, 0.26];
  for (var r = 0; r < levels.length; r++) {
    ctx.fillStyle = rgb(rail, 0.95);
    ctx.beginPath();
    for (var j = 0; j < n; j++) {
      var p = pts[j], th = lerp(4.2, 1.6, j / (n - 1));
      var yy = p.y - p.h * levels[r];
      if (j === 0) ctx.moveTo(p.x, yy - th / 2); else ctx.lineTo(p.x, yy - th / 2);
    }
    for (var j2 = n - 1; j2 >= 0; j2--) {
      var p2 = pts[j2], th2 = lerp(4.2, 1.6, j2 / (n - 1));
      ctx.lineTo(p2.x, p2.y - p2.h * levels[r] + th2 / 2);
    }
    ctx.closePath(); ctx.fill();
  }
  for (var k = 0; k < n; k++) {
    var q = pts[k];
    ctx.fillStyle = rgb(post, 0.98);
    ctx.fillRect(q.x - q.w / 2, q.y - q.h, q.w, q.h);
    ctx.fillStyle = "rgba(20,14,8,.32)";
    ctx.fillRect(q.x - q.w / 2, q.y - q.h, q.w * 0.34, q.h);
    /* a shaved top, so a post looks split rather than sawn */
    ctx.fillStyle = rgb(mix(post, [180, 156, 120], 0.35), 0.95);
    ctx.fillRect(q.x - q.w / 2, q.y - q.h, q.w, 1.4);
  }
  return pts[0];
}

/* ---- the reputation lantern on the near post ---- */

function drawLantern(t, rep) {
  var post = { x: CX, y: GY + (small ? 22 : 34), h: small ? 34 : 52 };
  var lx = post.x, ly = post.y - post.h - 6;
  var flame = clamp(rep, 0, 1);
  var s = small ? 0.8 : 1;
  ctx.save();
  ctx.translate(lx, ly);
  ctx.scale(s, s);
  ctx.strokeStyle = "#3a2b1c"; ctx.lineWidth = 1.6;
  ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(0, -6); ctx.stroke();
  ctx.fillStyle = "#33261a";
  ctx.fillRect(-6, -20, 12, 14);
  ctx.fillStyle = "rgba(232,226,210,.28)";
  ctx.fillRect(-4.4, -18.4, 8.8, 10.8);
  if (flame > 0.02) {
    var fl = 2 + flame * 6, fw = 1.4 + flame * 2.6;
    var wob = reduced ? 0 : Math.sin(t * 7) * 0.5;
    var g = ctx.createRadialGradient(0, -12, 0, 0, -12, 22 * flame + 6);
    g.addColorStop(0, "rgba(232,176,84," + (0.45 * flame) + ")");
    g.addColorStop(1, "rgba(232,176,84,0)");
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(0, -12, 22 * flame + 6, 0, 6.283); ctx.fill();
    ctx.fillStyle = "#e8b054";
    ctx.beginPath();
    ctx.moveTo(0, -9);
    ctx.quadraticCurveTo(fw + wob, -11, 0, -9 - fl);
    ctx.quadraticCurveTo(-fw + wob, -11, 0, -9);
    ctx.fill();
  }
  ctx.fillStyle = "#241a10";
  ctx.fillRect(-7, -22, 14, 3);
  ctx.restore();
}

/* ---- the people ---- */

var HAIRS = ["curly", "braid", "cap", "crop", "bun", "hat"];

function drawFigure(x, y, t, o) {
  var s = (o.scale || 1) * (small ? 1.6 : 2.05);
  ctx.save();
  ctx.translate(x, y);
  ctx.scale(s, s);
  if (o.face === -1) ctx.scale(-1, 1);

  var sk = skyPair();
  var dim = sk.night * 0.55;
  function dk(hex) {
    var c = [parseInt(hex.slice(1, 3), 16), parseInt(hex.slice(3, 5), 16), parseInt(hex.slice(5, 7), 16)];
    return rgb(mix(c, [30, 32, 44], dim));
  }
  var coat = dk(o.coat || "#27423a");
  var trouser = dk("#2c2622");
  var skin = dk(o.skin || "#c99a72");
  var hair = dk(o.hair || "#241a12");
  var armCol = o.sleeves === false ? skin : coat;

  var walking = o.pose === "walk";
  var step = walking ? Math.sin(t * 8) : 0;
  var bounce = walking ? Math.abs(Math.cos(t * 8)) * 1.2 : 0;
  ctx.translate(0, -bounce);

  /* legs */
  ctx.strokeStyle = trouser; ctx.lineWidth = 3; ctx.lineCap = "round";
  ctx.beginPath(); ctx.moveTo(0, -20); ctx.lineTo(-2 + step * 3.4, -10 + Math.abs(step)); ctx.lineTo(-2 + step * 4.4, 0); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(0, -20); ctx.lineTo(2 - step * 3.4, -10 + Math.abs(step)); ctx.lineTo(2 - step * 4.4, 0); ctx.stroke();
  ctx.strokeStyle = dk("#17110c"); ctx.lineWidth = 2.2;
  ctx.beginPath(); ctx.moveTo(-2 + step * 4.4, 0); ctx.lineTo(1.2 + step * 4.4, 0); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(2 - step * 4.4, 0); ctx.lineTo(5.2 - step * 4.4, 0); ctx.stroke();

  /* torso */
  ctx.strokeStyle = coat; ctx.lineWidth = o.stout ? 6.2 : 5;
  ctx.beginPath(); ctx.moveTo(0, -20); ctx.lineTo(0, -31); ctx.stroke();

  /* arms */
  ctx.strokeStyle = armCol; ctx.lineWidth = 2.6;
  if (o.pose === "offer") {
    var reach = o.reach == null ? 1 : o.reach;
    ctx.beginPath(); ctx.moveTo(0, -29); ctx.lineTo(-3, -24); ctx.lineTo(-3.5, -19); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(0, -28); ctx.lineTo(6 + reach * 4, -25); ctx.lineTo(10 + reach * 7, -22); ctx.stroke();
  } else if (o.pose === "withhold") {
    ctx.beginPath(); ctx.moveTo(0, -28); ctx.lineTo(-5, -24); ctx.lineTo(-2, -20); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(0, -28); ctx.lineTo(5, -24); ctx.lineTo(2, -20); ctx.stroke();
  } else if (o.pose === "wave") {
    var wa = reduced ? 0.2 : Math.sin(t * 7) * 0.5;
    ctx.beginPath(); ctx.moveTo(0, -29); ctx.lineTo(-4, -24); ctx.lineTo(-5, -20); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(0, -29); ctx.lineTo(6, -33); ctx.lineTo(9 + wa * 2, -39 + Math.abs(wa)); ctx.stroke();
    ctx.fillStyle = skin;
    ctx.beginPath(); ctx.arc(9.6 + wa * 2, -40 + Math.abs(wa), 1.7, 0, 6.283); ctx.fill();
  } else {
    var swing = step * 2.4;
    ctx.beginPath(); ctx.moveTo(0, -29); ctx.lineTo(-2 - swing, -24); ctx.lineTo(-2.5 - swing, -19); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(0, -29); ctx.lineTo(2 + swing, -24); ctx.lineTo(2.5 + swing, -19); ctx.stroke();
  }

  /* the scarf of the cold season */
  if (o.scarf) {
    ctx.strokeStyle = dk(o.scarf); ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(-3.4, -30.5); ctx.lineTo(3.4, -30.5); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(2.4, -30); ctx.lineTo(3.4, -24); ctx.stroke();
  }

  /* head and the hair that names them */
  ctx.save();
  ctx.translate(0, -36);
  ctx.fillStyle = skin;
  ctx.beginPath(); ctx.arc(0, 0, 4.6, 0, 6.283); ctx.fill();
  ctx.fillStyle = hair;
  var hs = o.hairStyle || "curly";
  if (hs === "curly") {
    for (var c = 0; c < 7; c++) {
      var ca = -3.0 + c * 0.44;
      ctx.beginPath(); ctx.arc(Math.cos(ca) * 4.4, -0.8 + Math.sin(ca) * 4.4, 2.2, 0, 6.283); ctx.fill();
    }
  } else if (hs === "braid") {
    ctx.beginPath(); ctx.arc(0, -0.8, 5, Math.PI, 0); ctx.fill();
    ctx.fillRect(-5, -1.2, 10, 1.6);
    ctx.strokeStyle = hair; ctx.lineWidth = 2.2; ctx.lineCap = "round";
    var bw = reduced ? 0 : Math.sin(t * 1.4) * 1.2;
    ctx.beginPath(); ctx.moveTo(-4.4, -0.4); ctx.quadraticCurveTo(-7 + bw, 4, -5.4 + bw, 9); ctx.stroke();
  } else if (hs === "crop") {
    ctx.beginPath(); ctx.arc(0, -1, 4.9, Math.PI * 1.02, -0.02); ctx.fill();
    ctx.fillRect(-4.8, -1.4, 9.6, 1.4);
  } else if (hs === "bun") {
    ctx.beginPath(); ctx.arc(0, -1, 5, Math.PI, 0); ctx.fill();
    ctx.fillRect(-5, -1.4, 10, 1.5);
    ctx.beginPath(); ctx.arc(-5.4, -3.4, 2.6, 0, 6.283); ctx.fill();
  } else if (hs === "cap") {
    ctx.beginPath(); ctx.arc(0, -0.6, 5.1, Math.PI, 0); ctx.fill();
    ctx.fillStyle = dk(o.capCol || "#5b7d8a");
    ctx.beginPath(); ctx.arc(0, -1.2, 5.2, Math.PI, 0); ctx.fill();
    ctx.fillRect(-7.4, -1.6, 9, 1.5);
  } else if (hs === "hat") {
    ctx.beginPath(); ctx.arc(0, -0.6, 4.9, Math.PI, 0); ctx.fill();
    ctx.fillStyle = dk(o.capCol || "#6b5334");
    ctx.fillRect(-8, -4.6, 16, 1.8);
    ctx.fillRect(-4.2, -10, 8.4, 5.6);
  }
  ctx.strokeStyle = "rgba(60,34,20,.8)"; ctx.lineWidth = 0.7;
  ctx.beginPath(); ctx.arc(0.6, 1, 1.8, 0.3, 2.0); ctx.stroke();
  ctx.restore();

  /* a stick, a dog, a basket at the hip: whatever tells them apart */
  if (o.prop === "stick") {
    ctx.strokeStyle = dk("#6b5334"); ctx.lineWidth = 1.6;
    ctx.beginPath(); ctx.moveTo(-3, -19); ctx.lineTo(-6, 1); ctx.stroke();
  } else if (o.prop === "dog") {
    ctx.save();
    ctx.translate(-13, 0);
    ctx.fillStyle = dk("#5a4a34");
    ctx.beginPath(); ctx.ellipse(0, -5, 5.4, 3.2, 0, 0, 6.283); ctx.fill();
    ctx.beginPath(); ctx.arc(5, -8.4, 2.8, 0, 6.283); ctx.fill();
    ctx.strokeStyle = dk("#5a4a34"); ctx.lineWidth = 1.6; ctx.lineCap = "round";
    ctx.beginPath(); ctx.moveTo(-3, -3); ctx.lineTo(-3.4, 0); ctx.moveTo(3, -3); ctx.lineTo(3.4, 0); ctx.stroke();
    var tw = reduced ? 0 : Math.sin(t * 6) * 2.4;
    ctx.beginPath(); ctx.moveTo(-5, -6); ctx.lineTo(-8, -9 + tw); ctx.stroke();
    ctx.restore();
  }
  ctx.restore();
}

/* ---- a basket of grain ---- */

function drawBasket(x, y, sc, full, spill) {
  var sk = skyPair();
  var dim = sk.night * 0.5;
  ctx.save();
  ctx.translate(x, y);
  ctx.scale(sc, sc);
  if (full) {
    ctx.fillStyle = rgb(mix([224, 176, 84], [40, 40, 56], dim));
    ctx.beginPath(); ctx.ellipse(0, -7, 8.4, 3.6, 0, 0, 6.283); ctx.fill();
    ctx.fillStyle = rgb(mix([236, 196, 112], [46, 46, 62], dim));
    ctx.beginPath(); ctx.ellipse(-2, -8.2, 4.2, 2, 0, 0, 6.283); ctx.fill();
  }
  ctx.fillStyle = rgb(mix([138, 98, 54], [34, 34, 48], dim));
  ctx.beginPath();
  ctx.moveTo(-9.5, -7); ctx.lineTo(9.5, -7); ctx.lineTo(6.5, 3); ctx.lineTo(-6.5, 3);
  ctx.closePath(); ctx.fill();
  ctx.strokeStyle = "rgba(40,26,12,.5)"; ctx.lineWidth = 0.9;
  for (var i = 1; i < 3; i++) {
    var yy = -7 + i * 3.2, sh = 9.5 - i * 1;
    ctx.beginPath(); ctx.moveTo(-sh, yy); ctx.lineTo(sh, yy); ctx.stroke();
  }
  ctx.strokeStyle = rgb(mix([104, 74, 40], [30, 30, 44], dim)); ctx.lineWidth = 1.4;
  ctx.beginPath(); ctx.arc(0, -7, 7, Math.PI, 0); ctx.stroke();
  if (spill) {
    ctx.fillStyle = rgb(mix([224, 176, 84], [40, 40, 56], dim), 0.9);
    for (var s = 0; s < 7; s++) {
      ctx.beginPath();
      ctx.arc(-14 + s * 4.6 + (s % 3) * 1.4, 3 + (s % 2) * 1.6, 1.2, 0, 6.283);
      ctx.fill();
    }
  }
  ctx.restore();
}

/* ---- weather particles: petals, leaves, snow ---- */

var motes = [];
function stepMotes(t, dt) {
  var win = sw(3), spr = sw(0), aut = sw(2);
  var want = reduced ? 0 : Math.round(win * (small ? 30 : 60) + spr * (small ? 12 : 22) + aut * (small ? 14 : 26));
  while (motes.length < want) {
    motes.push({ x: Math.random() * W, y: Math.random() * GY, vx: (Math.random() - 0.5) * 12,
                 vy: 12 + Math.random() * 26, r: 1 + Math.random() * 2.2, ph: Math.random() * 6.28 });
  }
  while (motes.length > want) motes.pop();
  for (var i = 0; i < motes.length; i++) {
    var m = motes[i];
    m.y += m.vy * dt;
    m.x += (m.vx + Math.sin(t * 1.4 + m.ph) * 14) * dt;
    if (m.y > GY - 2) { m.y = -6; m.x = Math.random() * W; }
    if (m.x < -10) m.x = W + 8; else if (m.x > W + 10) m.x = -8;
  }
}
function drawMotes() {
  var win = sw(3), spr = sw(0), aut = sw(2);
  var col = win > Math.max(spr, aut) ? [236, 240, 240] : spr > aut ? [238, 196, 214] : [196, 120, 52];
  var sk = skyPair();
  ctx.fillStyle = rgb(mix(col, [60, 62, 80], sk.night * 0.5), 0.7);
  for (var i = 0; i < motes.length; i++) {
    var m = motes[i];
    ctx.beginPath(); ctx.arc(m.x, m.y, m.r, 0, 6.283); ctx.fill();
  }
}

/* ---- the scene: who is standing where, and what is in the air ---- */

var scene = {
  mode: "title",
  you: null, them: null,
  enter: 1,
  exchange: null,
  rep: 0.5, lantern: false,
  pop: null
};

var COATS = ["#5b7d8a", "#c9c2ab", "#27423a", "#3a2f2a"];
function playerFigure() {
  var seasonIdx = world.season;
  return {
    coat: COATS[seasonIdx], hairStyle: "curly", hair: "#241a12", skin: "#c99a72",
    sleeves: seasonIdx !== 1, scarf: seasonIdx === 3 ? "#a8271e" : null
  };
}

function drawScene(t) {
  var px = CX - DX, nx = CX + DX;
  var sk = skyPair();

  if (scene.mode === "village" && scene.pop) {
    drawPopulation(t);
    return;
  }

  if (scene.mode === "title") {
    groundShadow(px, 16, 0.26 * (1 - sk.night * 0.5));
    drawFigure(px, GY, t, Object.assign(playerFigure(), { face: 1, pose: "wave" }));
    return;
  }

  /* you, on the near side */
  groundShadow(px, 16, 0.26 * (1 - sk.night * 0.5));
  var yourPose = "stand";
  var ex = scene.exchange;
  if (ex) yourPose = ex.you === "C" ? "offer" : "withhold";
  drawFigure(px, GY, t, Object.assign(playerFigure(), {
    face: 1, pose: yourPose, reach: ex ? smooth(clamp(ex.u * 2, 0, 1)) : 0
  }));

  /* them, on the far side, walking up if they have just arrived */
  if (scene.them) {
    var enter = scene.enter;
    var atx = lerp(W + 40, nx, smooth(enter));
    groundShadow(atx, 16, 0.26 * (1 - sk.night * 0.5) * enter);
    var pose = enter < 0.99 ? "walk" : "stand";
    if (enter > 0.99 && ex) pose = ex.them === "C" ? "offer" : "withhold";
    drawFigure(atx, GY, t, Object.assign({}, scene.them.fig, {
      face: -1, pose: pose, reach: ex ? smooth(clamp(ex.u * 2, 0, 1)) : 0
    }));
  }

  /* the baskets, and what happens to them */
  var bs = small ? 0.9 : 1.15;
  if (ex) {
    var u = ex.u;
    var lift = small ? 30 : 44;
    /* your basket */
    if (ex.you === "C") {
      var a = clamp((u - 0.12) / 0.62, 0, 1);
      var stop = ex.youLost ? 0.52 : 1;
      var aa = Math.min(a, stop);
      var bx = lerp(px + 14, nx - 14, aa);
      var by = GY - 12 - Math.sin(aa * Math.PI) * lift;
      if (ex.youLost && a >= stop) {
        by = GY - 2;
        drawBasket(bx, by, bs, false, true);
      } else drawBasket(bx, by, bs, true, false);
    } else if (u > 0.05) {
      drawBasket(px + 16, GY - 4, bs, true, false);
    }
    /* their basket */
    if (ex.them === "C") {
      var b = clamp((u - 0.12) / 0.62, 0, 1);
      var stop2 = ex.themLost ? 0.52 : 1;
      var bb = Math.min(b, stop2);
      var cx2 = lerp(nx - 14, px + 14, bb);
      var cy = GY - 12 - Math.sin(bb * Math.PI) * lift * 0.86;
      if (ex.themLost && b >= stop2) {
        cy = GY - 2;
        drawBasket(cx2, cy, bs, false, true);
      } else drawBasket(cx2, cy, bs, true, false);
    } else if (u > 0.05 && scene.them) {
      drawBasket(nx - 16, GY - 4, bs, true, false);
    }
  }
}

/* ---- chapter five: the village drawn as a population ---- */

function drawPopulation(t) {
  var pop = scene.pop;
  if (!pop) return;
  var total = 0, i;
  for (i = 0; i < pop.length; i++) total += pop[i].n;
  if (total <= 0) return;
  var cols = small ? 6 : 10;
  var rows = Math.ceil(total / cols);
  var padX = W * (small ? 0.09 : 0.11);
  var spanX = W - padX * 2;
  var stepX = spanX / (cols - 1 || 1);
  var sep = small ? 17 : 24;
  var order = [];
  for (i = 0; i < pop.length; i++) {
    for (var j = 0; j < pop[i].n; j++) order.push(pop[i]);
  }
  /* the back of the village is painted first, so the front row stands in
     front of it rather than behind it */
  var seq = [];
  for (i = 0; i < order.length; i++) seq.push(i);
  seq.sort(function (p1, p2) { return Math.floor(p2 / cols) - Math.floor(p1 / cols); });
  for (var q = 0; q < seq.length; q++) {
    i = seq[q];
    var r = Math.floor(i / cols), c = i % cols;
    var jitter = ((i * 37) % 9) - 4;
    var x = padX + c * stepX + jitter + (r % 2 ? stepX * 0.42 : 0);
    var y = GY - 4 - r * sep;
    var sc = (small ? 0.42 : 0.5) * (1 - r * 0.08);
    /* a small house for each household, and the household beside its door */
    var u = sc * 2, hx2 = x - 16 * u;
    ctx.save();
    groundShadow(hx2, 15 * u, 0.2);
    ctx.fillStyle = "rgba(103,80,58,.92)";
    ctx.fillRect(hx2 - 12 * u, y - 20 * u, 24 * u, 20 * u);
    ctx.fillStyle = "rgba(35,25,16,.4)";
    ctx.fillRect(hx2 - 12 * u, y - 20 * u, 24 * u, 3 * u);
    ctx.fillStyle = "rgba(138,74,44,.95)";
    ctx.beginPath();
    ctx.moveTo(hx2 - 15 * u, y - 19 * u);
    ctx.lineTo(hx2, y - 30 * u);
    ctx.lineTo(hx2 + 15 * u, y - 19 * u);
    ctx.closePath(); ctx.fill();
    ctx.strokeStyle = "rgba(58,30,16,.7)"; ctx.lineWidth = Math.max(0.6, 1.1 * u);
    ctx.stroke();
    ctx.fillStyle = "rgba(30,20,12,.85)";
    ctx.fillRect(hx2 - 3.5 * u, y - 11 * u, 7 * u, 11 * u);
    ctx.restore();
    drawFigure(x, y, t + i * 0.4, {
      scale: sc, face: 1, pose: "stand",
      coat: order[i].color, hairStyle: order[i].hairStyle || "crop", hair: "#241a12"
    });
  }
}

/* ---- the whole frame ---- */

function draw(t) {
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  drawSky(t);
  drawLand(t);
  if (scene.mode !== "village") {
    drawHouse(t);
    drawTree(t);
    drawFence(t);
    if (scene.lantern) drawLantern(t, scene.rep);
  }
  drawScene(t);
  drawMotes();
  /* the same quiet vignette the portfolio uses */
  var v = ctx.createRadialGradient(W / 2, GY * 0.55, GY * 0.4, W / 2, GY * 0.6, Math.max(W, H) * 0.8);
  v.addColorStop(0, "rgba(0,0,0,0)");
  v.addColorStop(1, "rgba(10,10,16,.26)");
  ctx.fillStyle = v;
  ctx.fillRect(0, 0, W, H);
}

var lastT = 0;
function frame(now) {
  var tt = now / 1000;
  var dt = Math.min(0.05, tt - lastT || 0.016);
  lastT = tt;
  if (!reduced) world.t = tt;
  /* seasons crossfade, the light walks forward */
  if (world.mix < 1) world.mix = Math.min(1, world.mix + dt * (reduced ? 4 : 0.9));
  world.dayT += (world.day - world.dayT) * (reduced ? 1 : Math.min(1, dt * 1.6));
  if (scene.enter < 1) scene.enter = Math.min(1, scene.enter + dt * (FAST ? 6 : 1.2));
  if (scene.exchange && scene.exchange.u < 1) {
    scene.exchange.u = Math.min(1, scene.exchange.u + dt * (FAST || reduced ? 4 : 0.75));
  }
  stepMotes(world.t, dt);
  draw(world.t);
  requestAnimationFrame(frame);
}

   6. the seasons
   ============================================================ */

function advanceWorld() {
  world.prev = world.season;
  /* chapter three is one winter from end to end, so only the light moves */
  world.season = G.chapter === 3 ? 3 : (world.season + 1) % 4;
  world.mix = world.season === world.prev ? 1 : 0;
  var frac = G.totalSeasons ? G.seasonInCh / G.totalSeasons : 0;
  world.day = clamp(0.1 + frac * 0.82, 0, 0.96);
}

function currentEnc() { return G.enc[G.encI] || null; }

function neighbourMove(entry) {
  var b = bookOf(entry.name);
  var d;
  if (entry.disp === "arrival") {
    G.arrivalDisp = G.arrivalDisp || {};
    /* a new arrival fixes an opening the moment word of you reaches them,
       and answers what you actually do from then on */
    if (!G.arrivalDisp[entry.name]) G.arrivalDisp[entry.name] = reputationOpener(G.rep);
    d = G.arrivalDisp[entry.name];
  } else {
    d = DISPOSITIONS[entry.disp];
  }
  return d.move(b.you, b.them, b.theirPays, G.pay);
}

function resolve(yourMove) {
  var entry = currentEnc();
  if (!entry) return;
  var b = bookOf(entry.name);
  var theirMove = neighbourMove(entry);

  var r = playRound(yourMove, theirMove, G.noise, rnd, G.pay);
  /* the hard winter carries one loss that is certain, so that the lesson
     of the chapter does not depend on a coin */
  if (G.forceLoss === G.seasonInCh) {
    if (yourMove === "C" && !r.aLost) { r.a = "D"; r.aLost = true; }
    else if (theirMove === "C" && !r.bLost) { r.b = "D"; r.bLost = true; }
    r.aPay = payoff(r.a, r.b, G.pay);
    r.bPay = payoff(r.b, r.a, G.pay);
  }

  b.you.push(r.a); b.them.push(r.b); b.meant.push(r.bIntent);
  b.yourPays.push(r.aPay); b.theirPays.push(r.bPay);
  b.youTot += r.aPay; b.themTot += r.bPay;
  if (r.aLost) b.lostYours++;
  if (r.bLost) b.lostTheirs++;
  G.you += r.aPay; G.them += r.bPay;

  /* What the village believes: earned slowly, lost quickly.
     The gully winter is left out of it, because every household in the
     village had the same road that year and everybody knows it. */
  if (G.chapter !== 3) {
    if (r.a === "C") G.rep = clamp(G.rep + 0.07 * (1 - G.rep), 0, 1);
    else G.rep = clamp(G.rep - 0.2, 0, 1);
  }
  scene.rep = G.rep;

  LOG.push({
    chapter: G.chapter, season: G.seasonInCh, who: entry.name,
    disp: entry.disp, youIntended: r.aIntent, themIntended: r.bIntent,
    you: r.a, them: r.b, youLost: r.aLost, themLost: r.bLost,
    youPay: r.aPay, themPay: r.bPay
  });

  G.last = { r: r, name: entry.name };
  scene.exchange = { you: r.a === "C" || r.aLost ? "C" : "D", them: r.b === "C" || r.bLost ? "C" : "D",
                     youLost: r.aLost, themLost: r.bLost, u: 0 };
  G.seasonInCh++;
  G.encI++;
  advanceWorld();
  if (!nb.hidden) renderNotebook();
  save();
  view("result");
}

/* the words for one season, in baskets rather than numbers */
function resultWords(r, name) {
  var out = [];
  var yourGift = r.aIntent === "C", theirGift = r.bIntent === "C";
  if (yourGift && r.aLost) out.push(T("lg-rw-youlost", "Your sack never made it across. It is still in your barn, and your barn is fuller than you meant it to be."));
  else if (yourGift) out.push(T("lg-rw-yougave", "You put your sack over the fence."));
  else out.push(T("lg-rw-youkept", "You kept your sack on your own step."));
  if (theirGift && r.bLost) out.push(T("lg-rw-themlost", "A sack was meant to come the other way and never arrived."));
  else if (theirGift) out.push(T("lg-rw-themgave", "{n} handed a sack across at the same moment.", {n: name}));
  else out.push(T("lg-rw-themkept", "{n} kept the sack on the far step.", {n: name}));
  return out.join(" ");
}

function outcomeLine(r) {
  var y = r.aPay, t = r.bPay;
  var tail = T("lg-o-tail", " " + y + " basket" + (y === 1 ? "" : "s") + " to you, " + t + " to them.",
               {yb: baskW(y), t: t});

  if (r.aLost || r.bLost) {
    if (r.aLost && r.bLost) return o("lg-o-both", "The road took both sacks.");
    if (r.aLost) return o("lg-o-you", "The road made a keeper of you without asking.");
    return o("lg-o-them", "Nothing came across, and nobody decided that.");
  }
  if (r.a === "C" && r.b === "C") return o("lg-o-cc", "Both cellars hold.");
  if (r.a === "D" && r.b === "C") return o("lg-o-dc", "You did best out of the season.");
  if (r.a === "C" && r.b === "D") return o("lg-o-cd", "You did worst out of the season.");
  return o("lg-o-dd", "Neither cellar fills.");
}

var WINTER_SEED = 19;

var CHAPTERS = [
  { n: 1, title: "The first neighbour" },

function encFrom(list) {
  return list.map(function (k) {
    var p = PEOPLE[k];
    return { key: k, name: p.name, disp: p.disp };
  });
}

function startChapter(n) {
  $("menuBtn").hidden = false;
  G.chapter = n;
  G.furthest = Math.max(G.furthest, n);
  G.seasonInCh = 0; G.encI = 0; G.you = 0; G.them = 0;
  G.noise = 0; G.forceLoss = -1; G.quiz = null; G.last = null;
  G.pay = { T: 5, R: 3, P: 1, S: 0 };
  rnd = mulberry(G.seed + n * 977);
  scene.mode = "fence"; scene.pop = null; scene.exchange = null;
  scene.lantern = n >= 4; scene.rep = G.rep;
  world.day = 0.1; world.dayT = 0.1;
  world.prev = world.season = (n - 1) % 4; world.mix = 1;
  nbBtn.hidden = n < 2 || n === 5;
  if (nbBtn.hidden) showNotebook(false);

  if (n === 1) {
    G.book = {};
    G.enc = encFrom(["mira", "mira", "mira", "mira", "mira", "mira"]);
  } else if (n === 2) {
    G.enc = encFrom(["deniz", "bruno", "halil", "ana",
                     "deniz", "bruno", "halil", "ana",
                     "deniz", "bruno", "halil", "ana"]);
  } else if (n === 3) {
    G.run3 = 1;
    G.book.Halil = { you: [], them: [], meant: [], yourPays: [], theirPays: [], youTot: 0, themTot: 0, lostYours: 0, lostTheirs: 0 };
    G.noise = 0.2; G.forceLoss = 2;
    rnd = mulberry(WINTER_SEED);
    G.enc = encFrom(["halil", "halil", "halil", "halil", "halil", "halil", "halil", "halil"]);
    world.prev = world.season = 3; world.mix = 1;
  } else if (n === 4) {
    G.arrivalDisp = {};
    G.enc = encFrom(["tomas", "tomas", "tomas", "leyla", "leyla", "leyla", "emre", "emre", "emre"]);
  } else if (n === 5) {
    scene.mode = "village";
    buildYears();
  }
  G.totalSeasons = G.enc.length;
  scene.them = null; scene.enter = 0;
  save();
}

function beginSeason() {
  var e = currentEnc();
  scene.exchange = null;
  if (e) {
    var prev = scene.them && scene.them.key;
    scene.them = { key: e.key, fig: PEOPLE[e.key].fig, name: e.name };
    scene.enter = prev === e.key ? 1 : (FAST || reduced ? 1 : 0);
  }
  view("ask");
}

/* Coming back to a saved game. Everything is restored except the run of
   luck inside chapter three, which has to be the same run of luck for
   both winters, so that chapter resumes at the top of its current winter. */
function resume(s) {
  G.acted = true;
  var n = s.chapter || 1;
  G.rep = s.rep != null ? s.rep : 0.5;
  G.furthest = Math.max(s.furthest || 1, n);
  startChapter(n);
  if (s.book) G.book = s.book;
  scene.rep = G.rep;
  if (n === 5) {
    applyYear(s.yearI || 0);
    view(s.yearI ? "years" : "chapterIntro");
    return;
  }
  if (n === 3) {
    if (s.run3 === 2) {
      G.run3 = 2;
      G.book.Ana = { you: [], them: [], meant: [], yourPays: [], theirPays: [], youTot: 0, themTot: 0, lostYours: 0, lostTheirs: 0 };
      G.run3a = s.run3a || null;
      G.enc = encFrom(["ana", "ana", "ana", "ana", "ana", "ana", "ana", "ana"]);
      G.totalSeasons = 8;
    } else {
      G.book.Halil = { you: [], them: [], meant: [], yourPays: [], theirPays: [], youTot: 0, themTot: 0, lostYours: 0, lostTheirs: 0 };
    }
    G.you = 0; G.them = 0; G.seasonInCh = 0; G.encI = 0;
    rnd = mulberry(WINTER_SEED);
    beginSeason();
    return;
  }
  G.encI = clamp(s.encI || 0, 0, G.enc.length);
  G.seasonInCh = clamp(s.seasonInCh || 0, 0, G.enc.length);
  G.you = s.you || 0; G.them = s.them || 0;
  world.season = s.season != null ? s.season : world.season;
  world.prev = world.season; world.mix = 1;
  world.day = s.day != null ? s.day : 0.1; world.dayT = world.day;
  if (G.encI >= G.enc.length) { view(n === 2 ? "quiz" : "chapterEnd"); return; }
  beginSeason();
}

   The noise stream and the certain loss are the ones the chapter used. */
function pairWinter(id) {
  var r = mulberry(WINTER_SEED);
  var A = DISPOSITIONS[id], B = DISPOSITIONS[id];
  var oA = [], oB = [], sA = 0, sB = 0, feud = 0, alt = 0;
  for (var i = 0; i < 8; i++) {
    var mA = A.move(oB, oA, [], G.pay), mB = B.move(oA, oB, [], G.pay);
    var res = playRound(mA, mB, 0.2, r, G.pay);
    if (i === 2) {
      if (mA === "C" && !res.aLost) { res.a = "D"; res.aLost = true; }
      else if (mB === "C" && !res.bLost) { res.b = "D"; res.bLost = true; }
      res.aPay = payoff(res.a, res.b, G.pay);
      res.bPay = payoff(res.b, res.a, G.pay);
    }
    oA.push(res.a); oB.push(res.b);
    sA += res.aPay; sB += res.bPay;
    if (res.a === "D" && res.b === "D") feud++;
    if (res.a !== res.b) alt++;
  }
  return { a: sA, b: sB, feud: feud, alt: alt, both: sA + sB };
}

/* ============================================================
   9. chapter five: the years
   Round robin between types, then proportional reproduction.
   This is the ecological run Axelrod used, with the population
   share of a disposition set by how well it fed itself.
   ============================================================ */

var EVO_TYPES = ["giver", "taker", "mirror", "grudge", "forgiver"];
var EVO_N = 30;
var EVO_W = 0.967;                       /* the chance the seasons continue */
var EVO_L = Math.max(1, Math.round(1 / (1 - EVO_W)));
var EVO_YEARS = 40;

function evoMatrix() {
  var A = [];
  for (var i = 0; i < EVO_TYPES.length; i++) {
    A.push([]);
    for (var j = 0; j < EVO_TYPES.length; j++) {
      var r = match(DISPOSITIONS[EVO_TYPES[i]], DISPOSITIONS[EVO_TYPES[j]], EVO_L, 0, function () { return 0.5; }, PAY);
      A[i].push(r.a);
    }
  }
  return A;
}

function buildYears() {
  var A = evoMatrix();
  var counts = [15, 6, 4, 3, 2];
  var p = counts.map(function (c) { return c / EVO_N; });
  G.years = [p.slice()];
  G.fitLog = [];
  for (var y = 0; y < EVO_YEARS; y++) {
    var fit = [], i, j;
    for (i = 0; i < p.length; i++) {
      var f = 0;
      for (j = 0; j < p.length; j++) {
        var others = (p[j] * EVO_N - (i === j ? 1 : 0)) / (EVO_N - 1);
        if (others < 0) others = 0;
        f += others * A[i][j];
      }
      fit.push(f);
    }
    G.fitLog.push(fit.slice());
    var tot = 0;
    for (i = 0; i < p.length; i++) tot += p[i] * fit[i];
    var np = [];
    for (i = 0; i < p.length; i++) np.push(tot > 0 ? p[i] * fit[i] / tot : p[i]);
    var s = 0;
    for (i = 0; i < np.length; i++) { if (np[i] < 0.005) np[i] = 0; s += np[i]; }
    for (i = 0; i < np.length; i++) np[i] = s > 0 ? np[i] / s : 0;
    p = np;
    G.years.push(p.slice());
  }
  G.yearI = 0;
  G.evoA = A;
  applyYear(0);
}

function countsFor(p) {
  var c = p.map(function (v) { return Math.round(v * EVO_N); });
  var s = c.reduce(function (a, b) { return a + b; }, 0);
  while (s !== EVO_N) {
    var idx = 0, best = -1;
    for (var i = 0; i < c.length; i++) {
      var err = Math.abs(p[i] * EVO_N - (c[i] + (s < EVO_N ? 1 : -1)));
      if (p[i] === 0 && s < EVO_N) continue;
      if (c[i] === 0 && s > EVO_N) continue;
      if (best < 0 || err < best) { best = err; idx = i; }
    }
    c[idx] += s < EVO_N ? 1 : -1;
    s = c.reduce(function (a, b) { return a + b; }, 0);
  }
  return c;
}

function freeResolve(yourMove) {
  var entry = G.freeEntry;
  var b = bookOf("Neighbour");
  var theirMove = DISPOSITIONS[entry.disp].move(b.you, b.them, b.theirPays, G.pay);
  var r = playRound(yourMove, theirMove, G.noise, rnd, G.pay);
  b.you.push(r.a); b.them.push(r.b);
  b.yourPays.push(r.aPay); b.theirPays.push(r.bPay);
  b.youTot += r.aPay; b.themTot += r.bPay;
  G.you += r.aPay; G.them += r.bPay;
  G.seasonInCh++;
  LOG.push({ chapter: 0, season: G.seasonInCh - 1, who: "Neighbour", disp: entry.disp,
             youIntended: r.aIntent, themIntended: r.bIntent, you: r.a, them: r.b,
             youLost: r.aLost, themLost: r.bLost, youPay: r.aPay, themPay: r.bPay });

  scene.exchange = { you: r.aIntent, them: r.bIntent, youLost: r.aLost, themLost: r.bLost, u: 0 };
