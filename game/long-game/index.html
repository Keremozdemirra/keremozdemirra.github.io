<style>
/* ============================================================
   The Long Game
   It shares none of the paper kit: the whole point of it is that
   it looks like the painted world at keremozdemir.de rather than
   like the instruments.  _tools/build.sh gives it the site's top
   bar and the site's footer and touches nothing else, so the
   village below them is exactly as it was.
   One file. One canvas. No framework, no library, no network
   call once the fonts have arrived. The world is painted with
   canvas primitives in the same hand as keremozdemir.de. The
   interface on top of it is ordinary HTML so that every choice
   is a real button with a real focus ring and a real name.
   ============================================================ */

:root{
  --soil:#2c2115; --timber:#67503a; --terracotta:#8a4a2c;
  --accent:#e0a050; --ink:#2b2620; --paper:#f2efe6; --verdigris:#5e7a6a;
  --ink-soft:#4b443b; --dim:#6f6558; --faint:#8d8375;
  --rule:rgba(103,80,58,.32); --rule-firm:rgba(103,80,58,.55);
  --display:"Fraunces","Iowan Old Style",Georgia,serif;
  --serif:"Newsreader",Georgia,"Times New Roman",serif;
  --mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --card:rgba(242,239,230,.955);
  --card-sunk:rgba(232,227,214,.9);
}

*{box-sizing:border-box}
html,body{margin:0;padding:0;overflow-x:hidden;max-width:100%}
html{-webkit-text-size-adjust:100%}
body{
  font-family:var(--serif); color:var(--ink); background:#c8c4b6;
  min-height:100dvh; overscroll-behavior-y:none;
}
canvas#world{
  position:fixed; inset:0; width:100%; height:100%; display:block; z-index:0;
}

.vh{position:absolute;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;
    clip:rect(0 0 0 0);clip-path:inset(50%);white-space:nowrap;border:0}

.skip{position:absolute;left:-9999px;top:0;z-index:60;background:var(--paper);
  color:var(--ink);padding:.6rem .9rem;font-family:var(--mono);font-size:.72rem;
  border:1px solid var(--rule-firm)}
.skip:focus{left:.6rem;top:.6rem}

/* ---------- the frame that holds the world and the interface ---------- */

#shell{
  position:relative; z-index:2; min-height:100dvh;
  display:flex; flex-direction:column; justify-content:space-between;
  padding:clamp(.6rem,2vw,1.1rem);
  padding-bottom:calc(clamp(.6rem,2vw,1.1rem) + env(safe-area-inset-bottom,0px));
  gap:.7rem;
}

/* ---------- the strip along the top: where and when you are ---------- */

#topbar{
  display:flex; flex-wrap:wrap; align-items:baseline; gap:.4rem .9rem;
  background:var(--card); border:1px solid var(--rule-firm);
  padding:.5rem .8rem; max-width:64rem; width:100%; margin:0 auto; flex:none;
  box-shadow:0 1px 0 rgba(44,33,21,.14);
}
#topbar .ch{font-family:var(--display);font-weight:400;font-size:.98rem;
  letter-spacing:-.01em;margin:0}
#topbar .meta{font-family:var(--mono);font-size:.63rem;letter-spacing:.12em;
  text-transform:uppercase;color:var(--dim);margin:0}
#topbar .spacer{flex:1 1 auto}
#topbar button{flex:none}

/* ---------- the card at the bottom: everything you read and press ---------- */

#panel{
  background:var(--card); border:1px solid var(--rule-firm);
  padding:clamp(.85rem,2.4vw,1.25rem);
  max-width:64rem; width:100%; margin:0 auto; flex:none;
  box-shadow:0 2px 0 rgba(44,33,21,.16);
  max-height:74dvh; overflow-y:auto; overscroll-behavior:contain;
}
/* a page of reading is set narrower, so the world is still there beside it */
#panel.read{max-width:49rem}
@media (max-width:900px){ #panel.read{max-width:64rem} }
#panel h2{font-family:var(--display);font-weight:400;font-size:clamp(1.18rem,3.4vw,1.5rem);
  letter-spacing:-.02em;margin:0 0 .45rem;line-height:1.2}
#panel h3{font-family:var(--display);font-weight:400;font-size:1.02rem;margin:1.1rem 0 .35rem}
#panel p{margin:0 0 .6rem;font-size:clamp(.95rem,2.6vw,1.02rem);line-height:1.62;
  max-width:60ch;color:var(--ink-soft)}
#panel p.say{color:var(--ink);font-style:italic}
#panel p.tight{margin-bottom:.35rem}
#panel ul{margin:0 0 .7rem;padding-left:1.1rem;max-width:60ch}
#panel li{font-size:.95rem;line-height:1.6;margin-bottom:.3rem;color:var(--ink-soft)}
#panel a{color:var(--terracotta);text-underline-offset:.2em}
#panel a:hover{color:var(--accent)}

.kicker{font-family:var(--mono);font-size:.63rem;letter-spacing:.14em;
  text-transform:uppercase;color:var(--faint);margin:0 0 .3rem}

/* ---------- buttons ---------- */

.row{display:flex;flex-wrap:wrap;gap:.55rem;margin-top:.75rem;align-items:stretch}
button{
  font-family:var(--serif); font-size:1rem; color:var(--ink);
  background:rgba(253,252,248,.96); border:1px solid var(--rule-firm);
  padding:.6rem 1rem; cursor:pointer; line-height:1.3;
  transition:background-color .13s ease,border-color .13s ease,transform .08s ease;
  min-height:2.75rem;
}
button:hover{background:#fffdf7;border-color:var(--terracotta)}
button:active{transform:translateY(1px)}
button:focus-visible{outline:2px solid var(--terracotta);outline-offset:2px}
button[disabled]{opacity:.45;cursor:default}
button .k{display:block;font-family:var(--mono);font-size:.6rem;letter-spacing:.13em;
  text-transform:uppercase;color:var(--faint);margin-top:.18rem}
button.big{font-family:var(--display);font-size:1.06rem;padding:.7rem 1.25rem;flex:1 1 11rem}
button.share{border-color:rgba(94,122,106,.75);background:rgba(232,238,231,.96)}
button.share:hover{background:#e9f0e7;border-color:var(--verdigris)}
button.keep{border-color:rgba(138,74,44,.7);background:rgba(244,232,224,.96)}
button.keep:hover{background:#f7e9e0;border-color:var(--terracotta)}
button.quiet{font-family:var(--mono);font-size:.65rem;letter-spacing:.12em;
  text-transform:uppercase;padding:.42rem .7rem;min-height:2.1rem;color:var(--dim);
  background:transparent;border-color:var(--rule)}
button.quiet:hover{color:var(--ink);background:rgba(253,252,248,.8)}

/* ---------- the tally: baskets, counted ---------- */

.tally{display:flex;flex-wrap:wrap;gap:.35rem 1.4rem;font-family:var(--mono);
  font-size:.72rem;letter-spacing:.04em;color:var(--dim);
  border-top:1px solid var(--rule);padding-top:.55rem;margin-top:.75rem}
.tally b{color:var(--ink);font-weight:500;font-variant-numeric:tabular-nums}

/* ---------- the payoff table, when it is finally shown ---------- */

.tblwrap{overflow-x:auto;margin:.4rem 0 .9rem;max-width:100%}
table.pay{border-collapse:collapse;font-family:var(--mono);font-size:.76rem;min-width:20rem}
table.pay th,table.pay td{border:1px solid var(--rule-firm);padding:.42rem .6rem;text-align:center}
table.pay th{font-size:.6rem;letter-spacing:.1em;text-transform:uppercase;
  color:var(--dim);font-weight:500;background:var(--card-sunk)}
table.pay td{background:rgba(253,252,248,.8);min-width:7rem}
table.pay td b{color:var(--terracotta);font-weight:500;font-size:.95rem}
table.pay td span{color:var(--dim)}

/* ---------- the notebook ---------- */

#nbwrap{max-width:64rem;width:100%;margin:0 auto;flex:none;display:flex;justify-content:flex-end}
#notebook{max-width:31rem;width:100%;
  background:var(--card);border:1px solid var(--rule-firm);
  border-left:3px solid var(--terracotta);
  padding:.7rem .9rem;margin-top:.5rem;
  box-shadow:0 2px 0 rgba(44,33,21,.16);
  max-height:36dvh;overflow-y:auto;
}
#notebook table{border-collapse:collapse;width:100%;font-size:.85rem}
#notebook th,#notebook td{text-align:left;padding:.3rem .5rem;border-bottom:1px solid var(--rule)}
#notebook th{font-family:var(--mono);font-size:.58rem;letter-spacing:.11em;
  text-transform:uppercase;color:var(--faint);font-weight:500}
#notebook td.nm{font-family:var(--display);white-space:nowrap}
#notebook td.gl{font-family:var(--mono);font-size:.95rem;letter-spacing:.14em;color:var(--ink);
  word-break:break-all}
#notebook td.ct{font-family:var(--mono);font-size:.68rem;color:var(--dim);white-space:nowrap;
  font-variant-numeric:tabular-nums}
#notebook .hint{font-family:var(--mono);font-size:.6rem;color:var(--faint);
  letter-spacing:.06em;margin:.5rem 0 0}

/* ---------- free play form ---------- */

.fields{display:grid;gap:.6rem .9rem;grid-template-columns:repeat(auto-fit,minmax(8.5rem,1fr));
  max-width:46rem;margin:.5rem 0 .3rem}
.fields label{display:block;font-family:var(--mono);font-size:.6rem;letter-spacing:.1em;
  text-transform:uppercase;color:var(--dim);margin-bottom:.2rem}
.fields input,.fields select{
  width:100%;font-family:var(--mono);font-size:.85rem;padding:.4rem .5rem;
  background:rgba(253,252,248,.96);border:1px solid var(--rule-firm);color:var(--ink)}
.fields input:focus-visible,.fields select:focus-visible{
  outline:2px solid var(--terracotta);outline-offset:1px}
.warnline{font-family:var(--mono);font-size:.68rem;line-height:1.6;color:var(--terracotta);
  max-width:52rem;margin:.35rem 0 0}
.warnline.ok{color:var(--verdigris)}

/* ---------- the strategy roll ---------- */

.roll{display:grid;gap:.5rem;max-width:52rem;margin:.3rem 0 .8rem}
.roll div{display:grid;grid-template-columns:auto 1fr;gap:.2rem .7rem;align-items:baseline}
.roll .who{font-family:var(--display);font-size:1rem;white-space:nowrap}
.roll .was{font-family:var(--mono);font-size:.68rem;letter-spacing:.06em;color:var(--dim);
  grid-column:1 / -1}
.swatch{display:inline-block;width:.7rem;height:.7rem;flex:none;vertical-align:baseline;
  border:1px solid rgba(43,38,32,.35)}

/* ---------- the village census, chapter five ---------- */

.census{display:grid;gap:.3rem;max-width:34rem;margin:.3rem 0 .6rem;
  font-family:var(--mono);font-size:.72rem}
.census .r{display:grid;grid-template-columns:.7rem 8.5rem 1fr auto;gap:.5rem;align-items:center}
.census .bar{height:.6rem;background:rgba(103,80,58,.16);position:relative}
.census .bar i{position:absolute;inset:0 auto 0 0;display:block}
.census .n{font-variant-numeric:tabular-nums;color:var(--ink);min-width:3.2rem;text-align:right}

@media (max-width:640px){
  #panel{max-height:62dvh}
  #notebook{max-width:none;max-height:26dvh;padding:.5rem .6rem}
  #notebook th,#notebook td{padding:.22rem .32rem}
  #notebook td.gl{font-size:.78rem;letter-spacing:.08em}
  #notebook table{font-size:.78rem}
  #topbar{padding:.45rem .6rem;gap:.3rem .6rem}
  #topbar .ch{font-size:.92rem}
  button.big{flex:1 1 100%}
  .tally{gap:.25rem .9rem;font-size:.68rem}
  .census .r{grid-template-columns:.7rem 6.6rem 1fr auto}
}
@media (prefers-reduced-motion:reduce){
  button:active{transform:none}
  button{transition:none}
}

/* ---------- the site's clothes, worn by an instrument ---------- */
.bar,footer.site-foot,.leaf-mark{
  --serif:"Fraunces",Georgia,serif;
  --sans:"Instrument Sans",-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --paper:#f2efe6;
  --fg:#221e17;
  --dim:#6f6759;
  --line:#d8d2c2;
  --accent:#8a5a24;
  --ease:cubic-bezier(.23,1,.32,1);
}
.bar,footer.site-foot{color:var(--fg)}
footer.site-foot{background:var(--paper)}
.bar .wrap,footer.site-foot .wrap{max-width:calc(64rem + 2 * clamp(.6rem,2vw,1.1rem));
  padding-inline:clamp(.6rem,2vw,1.1rem)}
/* the village is a fixed canvas lying under the whole document, so
   the bar and the footer have to be lifted over it; and the game's
   own overflow rule stops a sticky bar from sticking, so it stands
   still at the top of the page instead of following the scroll */
.bar{position:relative;z-index:3}
footer.site-foot{position:relative;z-index:3}

.wrap{max-width:1060px;margin:0 auto;padding:0 clamp(1.2rem,5vw,3rem)}

/* ---------- top bar ---------- */
.bar{position:sticky;top:0;z-index:30;font-family:var(--sans);background:color-mix(in srgb,var(--paper) 86%,transparent);
  backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.bar .wrap{display:flex;align-items:center;justify-content:space-between;height:58px}
.bar .home{font-family:var(--serif);font-weight:400;font-size:1.05rem;text-decoration:none;letter-spacing:.01em;
  border-bottom:0;color:var(--fg)}
.bar nav{display:flex;gap:clamp(.9rem,2.5vw,1.8rem);align-items:center}
.bar nav a{font-size:.86rem;letter-spacing:.02em;text-decoration:none;color:var(--dim);font-weight:500;
  padding:.3rem 0;border-bottom:1px solid transparent;transition:color .18s var(--ease),border-color .18s var(--ease)}
.bar nav a:hover{color:var(--fg)}
.bar nav a[aria-current]{color:var(--fg);border-bottom-color:var(--accent)}
.langs{display:flex;gap:.1rem;margin-left:.6rem}
.langs button{font-family:var(--mono);font-size:.64rem;letter-spacing:.05em;padding:.3em .45em;
  border:0;background:none;color:var(--dim);cursor:pointer;border-radius:2px}
.langs button:hover{color:var(--fg)}
.langs button[aria-pressed="true"]{color:var(--accent);text-decoration:underline;text-underline-offset:3px}

/* ---------- footer ---------- */
footer{border-top:1px solid var(--line);margin-top:clamp(2rem,6vh,4rem);
  background:none;font-family:var(--sans);line-height:1.6}
footer .wrap{display:flex;justify-content:space-between;align-items:center;padding-top:1.1rem;padding-bottom:1.4rem;
  font-size:.74rem;color:var(--dim)}
footer a{text-decoration:none;color:var(--dim);border-bottom:0}
footer a:hover{color:var(--fg)}

/* ---------- a leaf, falling once ---------- */
.leaf-mark{position:fixed;top:-30px;pointer-events:none;z-index:5;opacity:.85}
@media (prefers-reduced-motion:reduce){.leaf-mark{display:none}}

/* ---------- the bar and the footer, narrowed ---------- */
@media (max-width:640px){
  /* the bar gives the pages a line of their own instead of crowding them */
  .bar .wrap{flex-wrap:wrap;height:auto;column-gap:.7rem;row-gap:.1rem;
    padding-top:.5rem;padding-bottom:.15rem}
  .bar .home{white-space:nowrap;font-size:1rem}
  .bar nav{order:3;flex:1 0 100%;margin-top:.05rem;flex-wrap:wrap;
    gap:clamp(.5rem,2.4vw,1rem);row-gap:.1rem}
  .bar nav a{font-size:.8rem;padding:.55rem 0}
  /* the three languages take the right end of the name's own line: a third
     row of bar would eat a fifth of the screen */
  .bar .wrap{position:relative}
  .langs{position:absolute;top:.1rem;right:clamp(1.2rem,5vw,3rem);margin:0;gap:.15rem}
  .langs button{font-size:.7rem;padding:.2em .4em}
  footer .wrap{gap:1rem;flex-wrap:wrap;padding-bottom:calc(1.4rem + env(safe-area-inset-bottom,0px))}
}

/* six nav items on a narrow phone: the row is allowed to take a second
   line rather than push the page sideways, and the words are set a little
   tighter so that on most phones it does not have to */
@media (max-width:430px){
  .bar nav{gap:.34rem .55rem}
  .bar nav a{font-size:.76rem;letter-spacing:.01em}
}

/* a finger, not a cursor: every control a thumb has to find is at least a
   thumb wide, in either orientation */
@media (pointer:coarse){
  .bar .home{display:inline-flex;align-items:center;min-height:44px}
  .bar nav a{min-height:44px;min-width:44px;display:inline-flex;align-items:center;
    justify-content:center;padding:.3rem .3rem}
  .langs{gap:.05rem}
  .langs button{min-width:44px;min-height:44px;padding:.3em .35em;
    display:inline-flex;align-items:center;justify-content:center}
  footer .wrap a{min-width:44px;min-height:44px;display:inline-flex;
    align-items:center;justify-content:flex-end}
}


/* ---------- the crown, on a page whose interior is its own ---------- */
.k-crown-no{
  display:flex;align-items:center;gap:.55rem;margin-bottom:.85rem;
  font-family:"Fraunces",Georgia,serif;font-style:italic;font-size:1rem;
  color:var(--accent);
}
.k-crown-no svg{flex:none}
.k-lede h1{margin-top:0}


</style>

<script>
(function () {
"use strict";

/* ============================================================
   0. small helpers
   ============================================================ */

var reduced = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
var FAST = false;
try { FAST = new URLSearchParams(location.search).get("fast") === "1"; } catch (e) {}

function $(id) { return document.getElementById(id); }
function el(tag, cls, txt) {
  var n = document.createElement(tag);
  if (cls) n.className = cls;
  if (txt != null) n.textContent = txt;
  return n;
}
function clamp(v, a, b) { return v < a ? a : v > b ? b : v; }
function lerp(a, b, u) { return a + (b - a) * u; }
function smooth(u) { u = clamp(u, 0, 1); return u * u * (3 - 2 * u); }
function rgb(c, a) { return "rgba(" + (c[0] | 0) + "," + (c[1] | 0) + "," + (c[2] | 0) + "," + (a == null ? 1 : a) + ")"; }
function mix(a, b, u) { return [lerp(a[0], b[0], u), lerp(a[1], b[1], u), lerp(a[2], b[2], u)]; }

/* a small deterministic generator, so that the same winter can be
   handed to two different neighbours and be the same winter */
function mulberry(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    var t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

/* ============================================================
   1. the game itself
   Four numbers and five dispositions. Everything below this
   comment is ordinary game theory and nothing else.
   ============================================================ */

/* baskets of grain. T beats R beats P beats S, and two rewards beat
   one temptation plus one sucker, which is what makes it a dilemma */
var PAY = { T: 5, R: 3, P: 1, S: 0 };

function payoff(mine, theirs, p) {
  p = p || PAY;
  if (mine === "C") return theirs === "C" ? p.R : p.S;
  return theirs === "C" ? p.T : p.P;
}

/* Is this still a dilemma at these numbers */
function dilemmaCheck(p) {
  var order = p.T > p.R && p.R > p.P && p.P > p.S;
  var pair = 2 * p.R > p.T + p.S;
  return { order: order, pair: pair, ok: order && pair };
}

/* Each disposition sees only what arrived, never what was meant.
   opp  : the moves the other side was seen to make, oldest first
   own  : this side's own moves, oldest first
   pays : this side's own payoff after each of its own moves      */
var DISPOSITIONS = {
  giver: {
    id: "giver", name: "Always shares", formal: "always cooperate",
    tell: "Shares every season, whatever was done to her.",
    color: "#5e7a6a",
    move: function () { return "C"; }
  },
  taker: {
    id: "taker", name: "Always keeps", formal: "always defect",
    tell: "Keeps every season, whatever was done for him.",
    color: "#8a4a2c",
    move: function () { return "D"; }
  },
  mirror: {
    id: "mirror", name: "Mirrors you", formal: "tit for tat",
    tell: "Shares in the first season, then does whatever you did last season.",
    color: "#e0a050",
    move: function (opp) { return opp.length === 0 ? "C" : opp[opp.length - 1]; }
  },
  grudge: {
    id: "grudge", name: "Never forgets", formal: "grudger",
    tell: "Shares until you keep once. After that he keeps for ever.",
    color: "#67503a",
    move: function (opp) { return opp.indexOf("D") >= 0 ? "D" : "C"; }
  },
  forgiver: {
    id: "forgiver", name: "Lets one pass", formal: "tit for two tats",
    tell: "Shares unless you kept in both of the last two seasons.",
    color: "#40566e",
    move: function (opp) {
      var n = opp.length;
      return (n >= 2 && opp[n - 1] === "D" && opp[n - 2] === "D") ? "D" : "C";
    }
  },
  pavlov: {
    id: "pavlov", name: "Stays if it worked", formal: "win stay, lose shift",
    tell: "Shares first. Then repeats her last move if it fed her well, and switches if it did not.",
    color: "#6b4a72",
    move: function (opp, own, pays, p) {
      if (own.length === 0) return "C";
      var last = own[own.length - 1];
      var got = pays[pays.length - 1];
      var good = got >= (p || PAY).R;
      return good ? last : (last === "C" ? "D" : "C");
    }
  }
};
var DISP_ORDER = ["giver", "taker", "mirror", "grudge", "forgiver", "pavlov"];

/* A neighbour who opens on what the village believes about you and
   then mirrors. This is a piece of the story rather than a strategy
   from the literature, and the ending says so. */
function reputationOpener(rep) {
  return {
    id: "arrival", name: "New in the village", formal: "opens on your reputation, then mirrors",
    color: "#7a6a2f",
    move: function (opp) {
      if (opp.length === 0) return rep >= 0.5 ? "C" : "D";
      return opp[opp.length - 1];
    }
  };
}

/* one season between two sides. Noise is a gift lost on the road:
   a share can arrive as a keep, and neither side is told why. */
function playRound(a, b, noise, rnd, p) {
  var ae = a, be = b;
  if (a === "C" && noise > 0 && rnd() < noise) ae = "D";
  if (b === "C" && noise > 0 && rnd() < noise) be = "D";
  return {
    aIntent: a, bIntent: b, a: ae, b: be,
    aLost: a === "C" && ae === "D", bLost: b === "C" && be === "D",
    aPay: payoff(ae, be, p), bPay: payoff(be, ae, p)
  };
}

/* a whole match between two dispositions, used by the years */
function match(dA, dB, rounds, noise, rnd, p) {
  var oA = [], oB = [], pA = [], pB = [], sA = 0, sB = 0;
  for (var i = 0; i < rounds; i++) {
    var mA = dA.move(oB, oA, pA, p);
    var mB = dB.move(oA, oB, pB, p);
    var r = playRound(mA, mB, noise, rnd, p);
    oA.push(r.a); oB.push(r.b);
    pA.push(r.aPay); pB.push(r.bPay);
    sA += r.aPay; sB += r.bPay;
  }
  return { a: sA / rounds, b: sB / rounds };
}

/* ============================================================
   2. the world
   Sky, hills, soil, grass, a house with a lit window, a tree,
   a fence, and the people either side of it. Everything is
   drawn, nothing is loaded.
   ============================================================ */

var cv = $("world"), ctx = cv.getContext("2d");
var W = 0, H = 0, DPR = 1, small = false;
var GY = 0, CX = 0, DX = 0;

var SEASON_NAMES = ["Spring", "Summer", "Autumn", "Winter"];

/* the daylight of a season, top and bottom of the sky */
var SKY_DAY = [
  { top: [178, 200, 214], bot: [238, 226, 206] },   /* spring */
  { top: [162, 192, 214], bot: [240, 230, 198] },   /* summer */
  { top: [196, 196, 188], bot: [242, 210, 158] },   /* autumn */
  { top: [186, 200, 214], bot: [224, 226, 224] }    /* winter */
];
var SKY_DUSK = [
  { top: [116, 96, 118], bot: [222, 158, 116] },
  { top: [104, 106, 130], bot: [230, 168, 112] },
  { top: [104, 84, 92], bot: [212, 140, 88] },
  { top: [92, 100, 122], bot: [186, 158, 146] }
];
var SKY_NIGHT = [
  { top: [38, 28, 52], bot: [54, 42, 66] },
  { top: [22, 28, 46], bot: [36, 42, 62] },
  { top: [30, 22, 34], bot: [46, 34, 44] },
  { top: [14, 20, 36], bot: [24, 32, 50] }
];
var HAZE = [[200, 198, 190], [196, 200, 194], [198, 176, 146], [196, 200, 204]];

var GREENS = [[90, 125, 74], [107, 143, 84], [76, 112, 64], [125, 160, 95], [135, 168, 106]];
var AUTUMN = [[200, 132, 46], [178, 91, 40], [217, 154, 60], [163, 74, 34], [194, 106, 36]];
var BLOSSOM = [[232, 180, 200], [242, 210, 221], [223, 160, 184], [240, 198, 212]];
var FROST = [[200, 204, 196]];

/* the world remembers which season it is in and crossfades to the next */
var world = {
  season: 1, prev: 1, mix: 1,      /* season crossfade */
  day: 0.15,                        /* 0 morning, 0.55 afternoon, 1 night */
  dayT: 0.15,
  t: 0,
  windGust: 0.4
};
function sw(k) {
  return (k === world.prev ? (1 - world.mix) : 0) + (k === world.season ? world.mix : 0);
}
function seasonBlend(table, key) {
  var acc = [0, 0, 0];
  for (var k = 0; k < 4; k++) {
    var w = sw(k), c = key ? table[k][key] : table[k];
    acc[0] += c[0] * w; acc[1] += c[1] * w; acc[2] += c[2] * w;
  }
  return acc;
}

/* ---- seeded furniture: one tree, one grass field, one far village ---- */

var treeCanvas = null, treeTips = [], leaves = [], treeW = 0, treeH = 0;
var grassFrames = [], grassKey = -1, grassW = 0;
var farVillage = [];

function buildTree() {
  var rnd = mulberry(20260821);
  treeW = small ? 360 : 560;
  treeH = small ? 210 : 320;
  treeCanvas = document.createElement("canvas");
  treeCanvas.width = treeW; treeCanvas.height = treeH;
  var g = treeCanvas.getContext("2d");
  treeTips = [];
  var baseX = treeW * 0.5, baseY = treeH;

  function limb(x, y, ang, len, wid, depth) {
    if (depth > 7 || len < 5 || wid < 0.6) { treeTips.push({ x: x, y: y, s: depth / 7 }); return; }
    var a = ang + (rnd() - 0.5) * 0.34;
    var nx = x + Math.cos(a) * len, ny = y + Math.sin(a) * len;
    var bow = (rnd() - 0.5) * len * 0.3;
    g.strokeStyle = "rgb(" + Math.round(lerp(58, 118, depth / 7)) + "," +
                    Math.round(lerp(44, 96, depth / 7)) + "," +
                    Math.round(lerp(30, 70, depth / 7)) + ")";
    g.lineWidth = wid; g.lineCap = "round";
    g.beginPath();
    g.moveTo(x, y);
    g.quadraticCurveTo((x + nx) / 2 - Math.sin(a) * bow, (y + ny) / 2 + Math.cos(a) * bow, nx, ny);
    g.stroke();
    var kids = depth < 2 ? 3 : 2;
    for (var k = 0; k < kids; k++) {
      var na = a + (k - (kids - 1) / 2) * lerp(0.42, 0.86, rnd()) + (rnd() - 0.5) * 0.22;
      limb(nx, ny, na, len * lerp(0.66, 0.82, rnd()), wid * 0.62, depth + 1);
    }
  }
  limb(baseX, baseY, -Math.PI / 2, treeH * 0.25, small ? 10 : 14, 0);

  leaves = [];
  var n = small ? 320 : 620;
  for (var i = 0; i < n; i++) {
    var tip = treeTips[(rnd() * treeTips.length) | 0];
    var ang = rnd() * 6.283, spread = lerp(4, 30, rnd());
    leaves.push({
      x: tip.x + Math.cos(ang) * spread,
      y: tip.y + Math.sin(ang) * spread * 0.82 - 4,
      sz: lerp(2.6, 5.4, rnd()) * (small ? 0.85 : 1),
      gi: (rnd() * GREENS.length) | 0,
      ai: (rnd() * AUTUMN.length) | 0,
      bi: (rnd() * BLOSSOM.length) | 0,
      sway: rnd(), ph: rnd() * 6.283, tilt: rnd() * 6.283,
      keep: rnd()
    });
  }
}

function buildGrass() {
  grassKey = world.prev * 100 + world.season * 10 + Math.round(world.mix * 2);
  grassW = Math.max(360, Math.ceil(W));
  grassFrames = [];
  var win = sw(3), aut = sw(2), spr = sw(0);
  for (var f = 0; f < 3; f++) {
    var c = document.createElement("canvas");
    c.width = grassW; c.height = 24;
    var g = c.getContext("2d");
    g.lineCap = "round";
    var rnd = mulberry(9182 + f * 0);
    var tufts = Math.round(grassW / 9);
    for (var i = 0; i < tufts; i++) {
      var gx = rnd() * grassW, ph = rnd() * 6.283;
      var blades = 3 + (rnd() * 3 | 0);
      for (var b = 0; b < blades; b++) {
        var bx = gx + (rnd() - 0.5) * 6;
        var hgt = 5 + rnd() * 10;
        var lean = Math.sin(f / 3 * 6.283 + ph + b * 0.9) * (1.8 + hgt * 0.15);
        var u = rnd();
        var r = Math.round(lerp(lerp(74, 148, u * 0.5), 170, aut * 0.55 + win * 0.72));
        var gg = Math.round(lerp(lerp(106, 138, u), 152, win * 0.75));
        var bb = Math.round(lerp(lerp(52, 70, u * 0.4), 132, win * 0.85));
        g.strokeStyle = "rgba(" + r + "," + gg + "," + bb + ",.86)";
        g.lineWidth = 1.25 - hgt * 0.028;
        g.beginPath();
        g.moveTo(bx, 23);
        g.bezierCurveTo(bx + lean * 0.15, 23 - hgt * 0.45,
                        bx + lean * 0.6, 23 - hgt * 0.85,
                        bx + lean + (rnd() - 0.5) * 3, 23 - hgt);
        g.stroke();
      }
      if (rnd() < 0.09 * Math.max(0, 1 - win * 1.4) * (1 - aut * 0.5)) {
        var fx = gx + 2, fy = 23 - 8 - rnd() * 4;
        g.strokeStyle = "rgba(88,118,60,.8)"; g.lineWidth = 0.9;
        g.beginPath(); g.moveTo(fx, 23); g.lineTo(fx, fy + 2); g.stroke();
        g.fillStyle = rnd() < 0.5 ? "rgba(246,242,230,.95)" : "rgba(232,196,90,.95)";
        for (var pe = 0; pe < 5; pe++) {
          var pa = pe * 1.257 + f;
          g.beginPath();
          g.ellipse(fx + Math.cos(pa) * 2, fy + Math.sin(pa) * 2, 1.4, 0.85, pa, 0, 6.283);
          g.fill();
        }
        g.fillStyle = spr > 0.4 ? "rgba(240,170,60,.9)" : "rgba(120,90,40,.9)";
        g.beginPath(); g.arc(fx, fy, 1.1, 0, 6.283); g.fill();
      }
    }
    grassFrames.push(c);
  }
}

function buildFarVillage() {
  var rnd = mulberry(4711);
  farVillage = [];
  for (var i = 0; i < 6; i++) {
    farVillage.push({ u: 0.05 + i * 0.165 + (rnd() - 0.5) * 0.05, w: 16 + rnd() * 14, h: 12 + rnd() * 12, lit: rnd() });
  }
}

function resize() {
  DPR = Math.min(2, window.devicePixelRatio || 1);
  W = window.innerWidth; H = window.innerHeight;
  small = W < 700;
  cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
  cv.style.width = W + "px"; cv.style.height = H + "px";
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  layout();
  buildTree(); buildGrass(); buildFarVillage();
  draw(world.t);
}

function layout() {
  var panel = $("panel");
  var top = panel ? panel.getBoundingClientRect().top : H * 0.7;
  GY = clamp(top - 10, H * 0.34, H * 0.84);
  CX = W * 0.5;
  DX = small ? Math.min(66, W * 0.19) : Math.min(140, W * 0.15);
}

/* ---- ground shadow, the way the portfolio does it ---- */
function groundShadow(x, w, a) {
  ctx.save();
  ctx.translate(x, GY + 1);
  ctx.scale(1, 0.2);
  var g = ctx.createRadialGradient(0, 0, 0, 0, 0, w);
  g.addColorStop(0, "rgba(20,14,8," + a + ")");
  g.addColorStop(1, "rgba(20,14,8,0)");
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.arc(0, 0, w, 0, 6.283); ctx.fill();
  ctx.restore();
}

/* ---- the sky, the light and the weather ---- */

function skyPair() {
  var d = world.dayT;
  var day = seasonBlend(SKY_DAY, "top"), dayB = seasonBlend(SKY_DAY, "bot");
  var dusk = seasonBlend(SKY_DUSK, "top"), duskB = seasonBlend(SKY_DUSK, "bot");
  var night = seasonBlend(SKY_NIGHT, "top"), nightB = seasonBlend(SKY_NIGHT, "bot");
  var top, bot;
  if (d < 0.6) { var u = smooth(d / 0.6); top = mix(day, dusk, u); bot = mix(dayB, duskB, u); }
  else { var v = smooth((d - 0.6) / 0.4); top = mix(dusk, night, v); bot = mix(duskB, nightB, v); }
  return { top: top, bot: bot, night: clamp((d - 0.55) / 0.35, 0, 1) };
}

function drawSky(t) {
  var sk = skyPair();
  var g = ctx.createLinearGradient(0, 0, 0, GY + 40);
  g.addColorStop(0, rgb(sk.top));
  g.addColorStop(1, rgb(sk.bot));
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);

  /* stars, once it is dark enough */
  if (sk.night > 0.08) {
    var rnd = mulberry(3311);
    ctx.save();
    for (var i = 0; i < (small ? 46 : 90); i++) {
      var sx = rnd() * W, sy = rnd() * GY * 0.72;
      var tw = 0.45 + Math.sin(t * (0.8 + rnd() * 1.6) + i) * 0.35;
      ctx.fillStyle = "rgba(236,232,216," + (sk.night * tw * 0.8) + ")";
      ctx.fillRect(sx, sy, 1.5, 1.5);
    }
    ctx.restore();
  }

  /* the sun goes down as the chapter goes on, and the moon comes up */
  var sunU = world.dayT;
  var arcX = W * (0.24 + sunU * 0.6);
  var arcY = GY * (0.62 - Math.sin((1 - Math.abs(sunU - 0.35) / 0.85)) * 0.28);
  arcY = GY * (0.26 + Math.pow(clamp((sunU - 0.1) / 0.8, 0, 1), 1.7) * 0.56);
  var sunA = 1 - clamp((sunU - 0.55) / 0.28, 0, 1);
  if (sunA > 0.02) {
    var warm = mix([250, 240, 212], [244, 168, 96], smooth(clamp((sunU - 0.25) / 0.4, 0, 1)));
    var hg = ctx.createRadialGradient(arcX, arcY, 0, arcX, arcY, GY * 0.5);
    hg.addColorStop(0, rgb(warm, 0.3 * sunA));
    hg.addColorStop(1, rgb(warm, 0));
    ctx.fillStyle = hg;
    ctx.fillRect(arcX - GY * 0.5, arcY - GY * 0.5, GY, GY);
    ctx.fillStyle = rgb(warm, 0.95 * sunA);
    ctx.beginPath(); ctx.arc(arcX, arcY, small ? 13 : 17, 0, 6.283); ctx.fill();
  }
  if (sk.night > 0.2) {
    var mx = W * 0.78, my = GY * 0.2;
    ctx.fillStyle = "rgba(238,236,222," + (0.9 * sk.night) + ")";
    ctx.beginPath(); ctx.arc(mx, my, small ? 11 : 14, 0, 6.283); ctx.fill();
    ctx.fillStyle = rgb(sk.top, 0.85 * sk.night);
    ctx.beginPath(); ctx.arc(mx + 5, my - 4, small ? 10 : 13, 0, 6.283); ctx.fill();
  }

  /* birds working a thermal, quiet and far off */
  if (sk.night < 0.6 && sw(3) < 0.7) {
    var bn = small ? 3 : 5;
    ctx.strokeStyle = "rgba(70,60,48," + (0.45 * (1 - sk.night)) + ")";
    ctx.lineWidth = 1.2;
    for (var bi = 0; bi < bn; bi++) {
      var ba = t * (0.16 + bi * 0.03) + bi * 2.1;
      var brr = (small ? 26 : 44) + bi * (small ? 7 : 11);
      var bx2 = W * 0.68 + Math.cos(ba) * brr;
      var by2 = GY * 0.34 + Math.sin(ba) * brr * 0.4 - bi * 7;
      var bf = reduced ? 1.4 : Math.sin(t * 5 + bi * 2.4) * 2.2;
      ctx.beginPath();
      ctx.moveTo(bx2 - 5, by2);
      ctx.quadraticCurveTo(bx2 - 2.5, by2 - 3 - bf, bx2, by2);
      ctx.quadraticCurveTo(bx2 + 2.5, by2 - 3 - bf, bx2 + 5, by2);
      ctx.stroke();
    }
  }

  /* three cloud masses, slow */
  var cloudA = 0.5 * (1 - sk.night * 0.7);
  if (cloudA > 0.02) {
    var cl = [[0.09, 0.16, 1.15, 13], [0.42, 0.10, 0.85, 9], [0.72, 0.22, 1.0, 17]];
    for (var c = 0; c < 3; c++) {
      var cx = ((t * cl[c][3] * 0.35 + cl[c][0] * (W + 400)) % (W + 400)) - 200;
      var cy = GY * cl[c][1];
      var s = cl[c][2] * (small ? 0.7 : 1);
      ctx.fillStyle = "rgba(248,245,236," + (cloudA * 0.62) + ")";
      for (var p = 0; p < 5; p++) {
        ctx.beginPath();
        ctx.ellipse(cx + p * 26 * s, cy + Math.sin(p * 1.7) * 5 * s,
                    (26 - Math.abs(p - 2) * 6) * s, (13 - Math.abs(p - 2) * 2.4) * s, 0, 0, 6.283);
        ctx.fill();
      }
    }
  }
}

function hill(y, amp, freq, ph, col) {
  ctx.fillStyle = col;
  ctx.beginPath();
  ctx.moveTo(-20, H);
  for (var x = -20; x <= W + 20; x += 10) {
    ctx.lineTo(x, y + Math.sin(x * freq * 6.28 + ph) * amp * 0.4 + Math.sin(x * freq * 17 + ph * 1.7) * amp * 0.2);
  }
  ctx.lineTo(W + 20, H);
  ctx.closePath(); ctx.fill();
}

function drawLand(t) {
  var sk = skyPair();
  var hz = seasonBlend(HAZE);
  hz = mix(hz, [40, 44, 58], sk.night * 0.75);

  hill(GY - (small ? 42 : 66), small ? 16 : 26, 0.0011, 8, rgb(hz, 0.34));

  /* the rest of the village, far off, its windows lighting at dusk */
  for (var i = 0; i < farVillage.length; i++) {
    var v = farVillage[i];
    var vx = v.u * W, vy = GY - (small ? 18 : 27), vw = v.w * (small ? 0.4 : 0.58), vh = v.h * (small ? 0.4 : 0.58);
    ctx.fillStyle = rgb(mix(hz, [52, 42, 30], 0.82), 0.9);
    ctx.fillRect(vx, vy - vh, vw, vh);
    ctx.beginPath();
    ctx.moveTo(vx - 3, vy - vh); ctx.lineTo(vx + vw / 2, vy - vh - vh * 0.5); ctx.lineTo(vx + vw + 3, vy - vh);
    ctx.closePath(); ctx.fill();
    if (sk.night > 0.25 && v.lit > 0.3) {
      ctx.fillStyle = "rgba(240,196,110," + (0.75 * sk.night) + ")";
      ctx.fillRect(vx + vw * 0.35, vy - vh * 0.6, 2.2, 2.2);
    }
  }
  hill(GY - (small ? 16 : 26), small ? 10 : 15, 0.0017, 40, rgb(hz, 0.62));

  /* haze over the far ground */
  var fog = ctx.createLinearGradient(0, GY - (small ? 60 : 92), 0, GY);
  fog.addColorStop(0, rgb(hz, 0));
  fog.addColorStop(1, rgb(hz, 0.3));
  ctx.fillStyle = fog;
  ctx.fillRect(0, GY - (small ? 60 : 92), W, small ? 60 : 92);

  /* soil */
  var soil = ctx.createLinearGradient(0, GY, 0, H);
  var s0 = mix([64, 52, 36], [26, 24, 38], sk.night * 0.7);
  var s1 = mix([44, 33, 21], [16, 16, 28], sk.night * 0.7);
  soil.addColorStop(0, rgb(s0));
  soil.addColorStop(1, rgb(s1));
  ctx.fillStyle = soil;
  ctx.fillRect(0, GY, W, H - GY);

  /* grass along the line of the ground */
  if (grassKey !== (world.prev * 100 + world.season * 10 + Math.round(world.mix * 2)) || grassW < W) buildGrass();
  var ph = reduced ? 0 : (Math.sin(t * 0.9) * 0.5 + 0.5);
  var f0 = Math.floor(ph * 3) % 3, f1 = (f0 + 1) % 3, u = (ph * 3) % 1;
  ctx.save();
  ctx.globalAlpha = 1;
  ctx.drawImage(grassFrames[f0], 0, GY - 22, grassW, 24);
  ctx.globalAlpha = u;
  ctx.drawImage(grassFrames[f1], 0, GY - 22, grassW, 24);
  ctx.globalAlpha = 1;
  if (sk.night > 0.03) {
    ctx.fillStyle = "rgba(22,25,42," + (0.4 * sk.night) + ")";
    ctx.fillRect(0, GY - 22, W, H - GY + 22);
  }
  ctx.restore();
}

/* ---- the house: timber walls, a terracotta roof, a window that lights ---- */

function drawHouse(t) {
  var sk = skyPair();
  var s = small ? 0.76 : 1.05;
  var hx = small ? W * 0.17 : W * 0.145, hy = GY;
  ctx.save();
  ctx.translate(hx, hy);
  ctx.scale(s, s);

  var lit = Math.max(sk.night, sw(3) * 0.22);

  /* smoke from the chimney in the cold half of the year and after dark */
  if (sw(3) > 0.35 || sw(2) > 0.5 || sk.night > 0.25) {
    for (var m = 0; m < 3; m++) {
      var st = ((reduced ? 0.4 : t * 0.22) + m * 0.33) % 1;
      ctx.fillStyle = "rgba(200,195,185," + (0.2 * (1 - st)) + ")";
      ctx.beginPath();
      ctx.arc(28 + Math.sin(st * 5 + m) * 6, -102 - st * 34, 4 + st * 7, 0, 6.283);
      ctx.fill();
    }
  }

  groundShadow(0, 60, 0.3 * (1 - sk.night * 0.5));

  /* stone foundation */
  ctx.fillStyle = "#4a4038";
  ctx.fillRect(-48, -7, 96, 7);
  ctx.fillStyle = "rgba(120,110,96,.5)";
  for (var f = 0; f < 6; f++) {
    ctx.beginPath(); ctx.ellipse(-40 + f * 16, -3.5, 6.5, 2.6, 0, 0, 6.283); ctx.fill();
  }

  /* walls */
  var wg = ctx.createLinearGradient(0, -72, 0, -7);
  wg.addColorStop(0, "#67503a");
  wg.addColorStop(1, "#523d29");
  ctx.fillStyle = wg;
  ctx.fillRect(-46, -72, 92, 65);
  for (var pl = 1; pl < 6; pl++) {
    var py = -72 + pl * 11;
    ctx.strokeStyle = "rgba(30,20,12,.35)"; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(-46, py); ctx.lineTo(46, py); ctx.stroke();
    ctx.strokeStyle = "rgba(180,150,110,.14)";
    ctx.beginPath(); ctx.moveTo(-46, py + 1); ctx.lineTo(46, py + 1); ctx.stroke();
  }
  ctx.fillStyle = "#4a3826";
  ctx.fillRect(-48, -73, 4, 66);
  ctx.fillRect(44, -73, 4, 66);

  /* roof: shingled courses of terracotta, snowed over in winter */
  ctx.save();
  ctx.beginPath();

  ctx.closePath();
  var rg = ctx.createLinearGradient(0, -112, 0, -68);
  rg.addColorStop(0, "#8a4a2c");

    ctx.beginPath();

    ctx.lineTo(66, ry + 7.5); ctx.lineTo(-66, ry + 7.5);
    ctx.closePath(); ctx.fill();
    ctx.strokeStyle = "rgba(30,12,6,.42)"; ctx.lineWidth = 1;
    ctx.beginPath();
    for (var s3 = -8; s3 <= 8; s3++) ctx.arc(s3 * 8 + off, ry, 4.4, Math.PI, 0, true);
    ctx.stroke();
  }
  var snow = sw(3);
  if (snow > 0.05) {
    ctx.globalAlpha = snow;
    var sg = ctx.createLinearGradient(0, -112, 0, -70);
    sg.addColorStop(0, "rgba(236,238,236,.96)");
    sg.addColorStop(1, "rgba(236,238,236,.34)");
    ctx.fillStyle = sg;
    ctx.beginPath();
    ctx.moveTo(-58, -68); ctx.lineTo(0, -112); ctx.lineTo(58, -68); ctx.closePath(); ctx.fill();
    ctx.globalAlpha = 1;
  }
  ctx.restore();
  ctx.strokeStyle = snow > 0.5 ? "#d8dcd8" : "#3a1e10";
  ctx.lineWidth = 3; ctx.lineCap = "round";
  ctx.beginPath(); ctx.moveTo(-58, -70); ctx.lineTo(0, -113); ctx.lineTo(58, -70); ctx.stroke();

  /* chimney */
  ctx.fillStyle = "#4a3826"; ctx.fillRect(22, -104, 12, 26);
  ctx.fillStyle = "#33261a"; ctx.fillRect(20, -107, 16, 4);

  /* doorway */
  ctx.fillStyle = sk.night > 0.25 ? "rgba(46,30,14,.98)" : "rgba(16,11,7,.96)";
  ctx.fillRect(-16, -44, 22, 44);
  ctx.strokeStyle = "#3a2b1c"; ctx.lineWidth = 2.4;
  ctx.strokeRect(-17, -45, 24, 45);
  var dg = ctx.createLinearGradient(-16, 0, 6, 0);
  dg.addColorStop(0, "#46331f"); dg.addColorStop(1, "#33241a");
  ctx.fillStyle = dg; ctx.fillRect(-16, -44, 22, 44);
  ctx.strokeStyle = "rgba(18,12,7,.6)"; ctx.lineWidth = 1.4;
  ctx.strokeRect(-12.5, -40, 15, 16);
  ctx.strokeRect(-12.5, -20, 15, 16);
  ctx.fillStyle = "#c9a05a";
  ctx.beginPath(); ctx.arc(2.4, -21, 1.6, 0, 6.283); ctx.fill();
  ctx.fillStyle = "#4a3826"; ctx.fillRect(-20, -1.5, 30, 3.5);

  /* the window, lit at dusk */
  ctx.fillStyle = "#3a2b1c"; ctx.fillRect(14, -62, 21, 21);
  if (lit > 0.22) {
    var g2 = ctx.createRadialGradient(24.5, -51.5, 1, 24.5, -51.5, 12);
    g2.addColorStop(0, "rgba(244,196,110," + (0.72 + lit * 0.22) + ")");
    g2.addColorStop(1, "rgba(180,120,50," + (0.5 * lit) + ")");
    ctx.fillStyle = g2;
  } else ctx.fillStyle = "rgba(52,46,38,.95)";
  ctx.fillRect(16, -60, 17, 17);
  if (lit <= 0.22) {
    ctx.strokeStyle = "rgba(235,230,215,.35)"; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(18, -46); ctx.lineTo(30, -58); ctx.stroke();
  }
  ctx.strokeStyle = "#2c2014"; ctx.lineWidth = 1.6;
  ctx.strokeRect(16, -60, 17, 17);
  ctx.beginPath(); ctx.moveTo(16, -51.5); ctx.lineTo(33, -51.5);
  ctx.moveTo(24.5, -60); ctx.lineTo(24.5, -43); ctx.stroke();
  ctx.fillStyle = "#2c2014"; ctx.fillRect(14.5, -43, 20, 2.4);

  if (lit > 0.35) {
    var lg = ctx.createRadialGradient(24.5, -51.5, 2, 24.5, -51.5, 46);
    lg.addColorStop(0, "rgba(232,176,84," + (0.24 * lit) + ")");
    lg.addColorStop(1, "rgba(232,176,84,0)");
    ctx.fillStyle = lg;
    ctx.beginPath(); ctx.arc(24.5, -51.5, 46, 0, 6.283); ctx.fill();
  }
  ctx.restore();
}

/* ---- the tree ---- */

function drawTree(t) {
  if (!treeCanvas) return;
  var sk = skyPair();
  var s = small ? 0.74 : 0.98;
  var tx = small ? W * 0.82 : W * 0.83, ty = GY;
  ctx.save();
  ctx.translate(tx, ty);
  ctx.scale(s, s);
  groundShadow(0, treeW * 0.24, 0.26 * (1 - sk.night * 0.5));
  ctx.drawImage(treeCanvas, -treeW / 2, -treeH);
  var gust = reduced ? 0 : (0.5 + Math.sin(t * 0.5) * 0.5);
  var win = sw(3), aut = sw(2), spr = sw(0);
  for (var i = 0; i < leaves.length; i++) {
    var L = leaves[i];
    if (win > 0.5 && L.keep > 1 - (win - 0.5) * 1.6) continue;
    var col = GREENS[L.gi];
    if (aut > 0) col = mix(col, AUTUMN[L.ai], aut * 0.92);
    if (spr > 0 && L.gi % 3 === 0) col = mix(col, BLOSSOM[L.bi], spr * 0.9);
    if (win > 0) col = mix(col, FROST[0], win * 0.7);
    if (sk.night > 0) col = mix(col, [30, 34, 46], sk.night * 0.62);
    var sway = reduced ? 0 : Math.sin(t * 1.6 + L.ph) * (1.2 + L.sway * 5) * (0.4 + gust * 0.6);
    ctx.save();
    ctx.translate(-treeW / 2 + L.x + sway, -treeH + L.y);
    ctx.rotate(L.tilt + sway * 0.03);
    ctx.fillStyle = rgb(col);
    ctx.beginPath();
    ctx.moveTo(0, -L.sz);
    ctx.quadraticCurveTo(L.sz * 0.7, -L.sz * 0.2, 0, L.sz);
    ctx.quadraticCurveTo(-L.sz * 0.7, -L.sz * 0.2, 0, -L.sz);
    ctx.fill();
    ctx.restore();
  }
  ctx.restore();
}

/* ---- the fence, running away from the eye, and its gate post ---- */

function drawFence(t) {
  var sk = skyPair();
  var n = 6;
  var bx = CX, by = GY + (small ? 22 : 34);
  var tx = CX + (small ? 16 : 26), ty = GY - (small ? 34 : 54);
  var pts = [];
  for (var i = 0; i < n; i++) {
    var u = i / (n - 1);
    pts.push({ x: lerp(bx, tx, u), y: lerp(by, ty, u), h: lerp(small ? 34 : 52, small ? 13 : 20, u), w: lerp(4.4, 1.8, u) });
  }
  var dark = sk.night;
  var post = mix([103, 80, 58], [34, 32, 44], dark * 0.7);
  var rail = mix([120, 96, 68], [40, 38, 50], dark * 0.7);
  /* three rails, each one a tapering plank rather than a line */
  var levels = [0.74, 0.5, 0.26];
  for (var r = 0; r < levels.length; r++) {
    ctx.fillStyle = rgb(rail, 0.95);
    ctx.beginPath();
    for (var j = 0; j < n; j++) {
      var p = pts[j], th = lerp(4.2, 1.6, j / (n - 1));
      var yy = p.y - p.h * levels[r];
      if (j === 0) ctx.moveTo(p.x, yy - th / 2); else ctx.lineTo(p.x, yy - th / 2);
    }
    for (var j2 = n - 1; j2 >= 0; j2--) {
      var p2 = pts[j2], th2 = lerp(4.2, 1.6, j2 / (n - 1));
      ctx.lineTo(p2.x, p2.y - p2.h * levels[r] + th2 / 2);
    }
    ctx.closePath(); ctx.fill();
  }
  for (var k = 0; k < n; k++) {
    var q = pts[k];
    ctx.fillStyle = rgb(post, 0.98);
    ctx.fillRect(q.x - q.w / 2, q.y - q.h, q.w, q.h);
    ctx.fillStyle = "rgba(20,14,8,.32)";
    ctx.fillRect(q.x - q.w / 2, q.y - q.h, q.w * 0.34, q.h);
    /* a shaved top, so a post looks split rather than sawn */
    ctx.fillStyle = rgb(mix(post, [180, 156, 120], 0.35), 0.95);
    ctx.fillRect(q.x - q.w / 2, q.y - q.h, q.w, 1.4);
  }
  return pts[0];
}

/* ---- the reputation lantern on the near post ---- */

function drawLantern(t, rep) {
  var post = { x: CX, y: GY + (small ? 22 : 34), h: small ? 34 : 52 };
  var lx = post.x, ly = post.y - post.h - 6;
  var flame = clamp(rep, 0, 1);
  var s = small ? 0.8 : 1;
  ctx.save();
  ctx.translate(lx, ly);
  ctx.scale(s, s);
  ctx.strokeStyle = "#3a2b1c"; ctx.lineWidth = 1.6;
  ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(0, -6); ctx.stroke();
  ctx.fillStyle = "#33261a";
  ctx.fillRect(-6, -20, 12, 14);
  ctx.fillStyle = "rgba(232,226,210,.28)";
  ctx.fillRect(-4.4, -18.4, 8.8, 10.8);
  if (flame > 0.02) {
    var fl = 2 + flame * 6, fw = 1.4 + flame * 2.6;
    var wob = reduced ? 0 : Math.sin(t * 7) * 0.5;
    var g = ctx.createRadialGradient(0, -12, 0, 0, -12, 22 * flame + 6);
    g.addColorStop(0, "rgba(232,176,84," + (0.45 * flame) + ")");
    g.addColorStop(1, "rgba(232,176,84,0)");
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(0, -12, 22 * flame + 6, 0, 6.283); ctx.fill();
    ctx.fillStyle = "#e8b054";
    ctx.beginPath();
    ctx.moveTo(0, -9);
    ctx.quadraticCurveTo(fw + wob, -11, 0, -9 - fl);
    ctx.quadraticCurveTo(-fw + wob, -11, 0, -9);
    ctx.fill();
  }
  ctx.fillStyle = "#241a10";
  ctx.fillRect(-7, -22, 14, 3);
  ctx.restore();
}

/* ---- the people ---- */

var HAIRS = ["curly", "braid", "cap", "crop", "bun", "hat"];

function drawFigure(x, y, t, o) {
  var s = (o.scale || 1) * (small ? 1.6 : 2.05);
  ctx.save();
  ctx.translate(x, y);
  ctx.scale(s, s);
  if (o.face === -1) ctx.scale(-1, 1);

  var sk = skyPair();
  var dim = sk.night * 0.55;
  function dk(hex) {
    var c = [parseInt(hex.slice(1, 3), 16), parseInt(hex.slice(3, 5), 16), parseInt(hex.slice(5, 7), 16)];
    return rgb(mix(c, [30, 32, 44], dim));
  }
  var coat = dk(o.coat || "#27423a");
  var trouser = dk("#2c2622");
  var skin = dk(o.skin || "#c99a72");
  var hair = dk(o.hair || "#241a12");
  var armCol = o.sleeves === false ? skin : coat;

  var walking = o.pose === "walk";
  var step = walking ? Math.sin(t * 8) : 0;
  var bounce = walking ? Math.abs(Math.cos(t * 8)) * 1.2 : 0;
  ctx.translate(0, -bounce);

  /* legs */
  ctx.strokeStyle = trouser; ctx.lineWidth = 3; ctx.lineCap = "round";
  ctx.beginPath(); ctx.moveTo(0, -20); ctx.lineTo(-2 + step * 3.4, -10 + Math.abs(step)); ctx.lineTo(-2 + step * 4.4, 0); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(0, -20); ctx.lineTo(2 - step * 3.4, -10 + Math.abs(step)); ctx.lineTo(2 - step * 4.4, 0); ctx.stroke();
  ctx.strokeStyle = dk("#17110c"); ctx.lineWidth = 2.2;
  ctx.beginPath(); ctx.moveTo(-2 + step * 4.4, 0); ctx.lineTo(1.2 + step * 4.4, 0); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(2 - step * 4.4, 0); ctx.lineTo(5.2 - step * 4.4, 0); ctx.stroke();

  /* torso */
  ctx.strokeStyle = coat; ctx.lineWidth = o.stout ? 6.2 : 5;
  ctx.beginPath(); ctx.moveTo(0, -20); ctx.lineTo(0, -31); ctx.stroke();

  /* arms */
  ctx.strokeStyle = armCol; ctx.lineWidth = 2.6;
  if (o.pose === "offer") {
    var reach = o.reach == null ? 1 : o.reach;
    ctx.beginPath(); ctx.moveTo(0, -29); ctx.lineTo(-3, -24); ctx.lineTo(-3.5, -19); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(0, -28); ctx.lineTo(6 + reach * 4, -25); ctx.lineTo(10 + reach * 7, -22); ctx.stroke();
  } else if (o.pose === "withhold") {
    ctx.beginPath(); ctx.moveTo(0, -28); ctx.lineTo(-5, -24); ctx.lineTo(-2, -20); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(0, -28); ctx.lineTo(5, -24); ctx.lineTo(2, -20); ctx.stroke();
  } else if (o.pose === "wave") {
    var wa = reduced ? 0.2 : Math.sin(t * 7) * 0.5;
    ctx.beginPath(); ctx.moveTo(0, -29); ctx.lineTo(-4, -24); ctx.lineTo(-5, -20); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(0, -29); ctx.lineTo(6, -33); ctx.lineTo(9 + wa * 2, -39 + Math.abs(wa)); ctx.stroke();
    ctx.fillStyle = skin;
    ctx.beginPath(); ctx.arc(9.6 + wa * 2, -40 + Math.abs(wa), 1.7, 0, 6.283); ctx.fill();
  } else {
    var swing = step * 2.4;
    ctx.beginPath(); ctx.moveTo(0, -29); ctx.lineTo(-2 - swing, -24); ctx.lineTo(-2.5 - swing, -19); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(0, -29); ctx.lineTo(2 + swing, -24); ctx.lineTo(2.5 + swing, -19); ctx.stroke();
  }

  /* the scarf of the cold season */
  if (o.scarf) {
    ctx.strokeStyle = dk(o.scarf); ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(-3.4, -30.5); ctx.lineTo(3.4, -30.5); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(2.4, -30); ctx.lineTo(3.4, -24); ctx.stroke();
  }

  /* head and the hair that names them */
  ctx.save();
  ctx.translate(0, -36);
  ctx.fillStyle = skin;
  ctx.beginPath(); ctx.arc(0, 0, 4.6, 0, 6.283); ctx.fill();
  ctx.fillStyle = hair;
  var hs = o.hairStyle || "curly";
  if (hs === "curly") {
    for (var c = 0; c < 7; c++) {
      var ca = -3.0 + c * 0.44;
      ctx.beginPath(); ctx.arc(Math.cos(ca) * 4.4, -0.8 + Math.sin(ca) * 4.4, 2.2, 0, 6.283); ctx.fill();
    }
  } else if (hs === "braid") {
    ctx.beginPath(); ctx.arc(0, -0.8, 5, Math.PI, 0); ctx.fill();
    ctx.fillRect(-5, -1.2, 10, 1.6);
    ctx.strokeStyle = hair; ctx.lineWidth = 2.2; ctx.lineCap = "round";
    var bw = reduced ? 0 : Math.sin(t * 1.4) * 1.2;
    ctx.beginPath(); ctx.moveTo(-4.4, -0.4); ctx.quadraticCurveTo(-7 + bw, 4, -5.4 + bw, 9); ctx.stroke();
  } else if (hs === "crop") {
    ctx.beginPath(); ctx.arc(0, -1, 4.9, Math.PI * 1.02, -0.02); ctx.fill();
    ctx.fillRect(-4.8, -1.4, 9.6, 1.4);
  } else if (hs === "bun") {
    ctx.beginPath(); ctx.arc(0, -1, 5, Math.PI, 0); ctx.fill();
    ctx.fillRect(-5, -1.4, 10, 1.5);
    ctx.beginPath(); ctx.arc(-5.4, -3.4, 2.6, 0, 6.283); ctx.fill();
  } else if (hs === "cap") {
    ctx.beginPath(); ctx.arc(0, -0.6, 5.1, Math.PI, 0); ctx.fill();
    ctx.fillStyle = dk(o.capCol || "#5b7d8a");
    ctx.beginPath(); ctx.arc(0, -1.2, 5.2, Math.PI, 0); ctx.fill();
    ctx.fillRect(-7.4, -1.6, 9, 1.5);
  } else if (hs === "hat") {
    ctx.beginPath(); ctx.arc(0, -0.6, 4.9, Math.PI, 0); ctx.fill();
    ctx.fillStyle = dk(o.capCol || "#6b5334");
    ctx.fillRect(-8, -4.6, 16, 1.8);
    ctx.fillRect(-4.2, -10, 8.4, 5.6);
  }
  ctx.strokeStyle = "rgba(60,34,20,.8)"; ctx.lineWidth = 0.7;
  ctx.beginPath(); ctx.arc(0.6, 1, 1.8, 0.3, 2.0); ctx.stroke();
  ctx.restore();

  /* a stick, a dog, a basket at the hip: whatever tells them apart */
  if (o.prop === "stick") {
    ctx.strokeStyle = dk("#6b5334"); ctx.lineWidth = 1.6;
    ctx.beginPath(); ctx.moveTo(-3, -19); ctx.lineTo(-6, 1); ctx.stroke();
  } else if (o.prop === "dog") {
    ctx.save();
    ctx.translate(-13, 0);
    ctx.fillStyle = dk("#5a4a34");
    ctx.beginPath(); ctx.ellipse(0, -5, 5.4, 3.2, 0, 0, 6.283); ctx.fill();
    ctx.beginPath(); ctx.arc(5, -8.4, 2.8, 0, 6.283); ctx.fill();
    ctx.strokeStyle = dk("#5a4a34"); ctx.lineWidth = 1.6; ctx.lineCap = "round";
    ctx.beginPath(); ctx.moveTo(-3, -3); ctx.lineTo(-3.4, 0); ctx.moveTo(3, -3); ctx.lineTo(3.4, 0); ctx.stroke();
    var tw = reduced ? 0 : Math.sin(t * 6) * 2.4;
    ctx.beginPath(); ctx.moveTo(-5, -6); ctx.lineTo(-8, -9 + tw); ctx.stroke();
    ctx.restore();
  }
  ctx.restore();
}

/* ---- a basket of grain ---- */

function drawBasket(x, y, sc, full, spill) {
  var sk = skyPair();
  var dim = sk.night * 0.5;
  ctx.save();
  ctx.translate(x, y);
  ctx.scale(sc, sc);
  if (full) {
    ctx.fillStyle = rgb(mix([224, 176, 84], [40, 40, 56], dim));
    ctx.beginPath(); ctx.ellipse(0, -7, 8.4, 3.6, 0, 0, 6.283); ctx.fill();
    ctx.fillStyle = rgb(mix([236, 196, 112], [46, 46, 62], dim));
    ctx.beginPath(); ctx.ellipse(-2, -8.2, 4.2, 2, 0, 0, 6.283); ctx.fill();
  }
  ctx.fillStyle = rgb(mix([138, 98, 54], [34, 34, 48], dim));
  ctx.beginPath();
  ctx.moveTo(-9.5, -7); ctx.lineTo(9.5, -7); ctx.lineTo(6.5, 3); ctx.lineTo(-6.5, 3);
  ctx.closePath(); ctx.fill();
  ctx.strokeStyle = "rgba(40,26,12,.5)"; ctx.lineWidth = 0.9;
  for (var i = 1; i < 3; i++) {
    var yy = -7 + i * 3.2, sh = 9.5 - i * 1;
    ctx.beginPath(); ctx.moveTo(-sh, yy); ctx.lineTo(sh, yy); ctx.stroke();
  }
  ctx.strokeStyle = rgb(mix([104, 74, 40], [30, 30, 44], dim)); ctx.lineWidth = 1.4;
  ctx.beginPath(); ctx.arc(0, -7, 7, Math.PI, 0); ctx.stroke();
  if (spill) {
    ctx.fillStyle = rgb(mix([224, 176, 84], [40, 40, 56], dim), 0.9);
    for (var s = 0; s < 7; s++) {
      ctx.beginPath();
      ctx.arc(-14 + s * 4.6 + (s % 3) * 1.4, 3 + (s % 2) * 1.6, 1.2, 0, 6.283);
      ctx.fill();
    }
  }
  ctx.restore();
}

/* ---- weather particles: petals, leaves, snow ---- */

var motes = [];
function stepMotes(t, dt) {
  var win = sw(3), spr = sw(0), aut = sw(2);
  var want = reduced ? 0 : Math.round(win * (small ? 30 : 60) + spr * (small ? 12 : 22) + aut * (small ? 14 : 26));
  while (motes.length < want) {
    motes.push({ x: Math.random() * W, y: Math.random() * GY, vx: (Math.random() - 0.5) * 12,
                 vy: 12 + Math.random() * 26, r: 1 + Math.random() * 2.2, ph: Math.random() * 6.28 });
  }
  while (motes.length > want) motes.pop();
  for (var i = 0; i < motes.length; i++) {
    var m = motes[i];
    m.y += m.vy * dt;
    m.x += (m.vx + Math.sin(t * 1.4 + m.ph) * 14) * dt;
    if (m.y > GY - 2) { m.y = -6; m.x = Math.random() * W; }
    if (m.x < -10) m.x = W + 8; else if (m.x > W + 10) m.x = -8;
  }
}
function drawMotes() {
  var win = sw(3), spr = sw(0), aut = sw(2);
  var col = win > Math.max(spr, aut) ? [236, 240, 240] : spr > aut ? [238, 196, 214] : [196, 120, 52];
  var sk = skyPair();
  ctx.fillStyle = rgb(mix(col, [60, 62, 80], sk.night * 0.5), 0.7);
  for (var i = 0; i < motes.length; i++) {
    var m = motes[i];
    ctx.beginPath(); ctx.arc(m.x, m.y, m.r, 0, 6.283); ctx.fill();
  }
}

/* ---- the scene: who is standing where, and what is in the air ---- */

var scene = {
  mode: "title",
  you: null, them: null,
  enter: 1,
  exchange: null,
  rep: 0.5, lantern: false,
  pop: null
};

var COATS = ["#5b7d8a", "#c9c2ab", "#27423a", "#3a2f2a"];
function playerFigure() {
  var seasonIdx = world.season;
  return {
    coat: COATS[seasonIdx], hairStyle: "curly", hair: "#241a12", skin: "#c99a72",
    sleeves: seasonIdx !== 1, scarf: seasonIdx === 3 ? "#a8271e" : null
  };
}

function drawScene(t) {
  var px = CX - DX, nx = CX + DX;
  var sk = skyPair();

  if (scene.mode === "village" && scene.pop) {
    drawPopulation(t);
    return;
  }

  if (scene.mode === "title") {
    groundShadow(px, 16, 0.26 * (1 - sk.night * 0.5));
    drawFigure(px, GY, t, Object.assign(playerFigure(), { face: 1, pose: "wave" }));
    return;
  }

  /* you, on the near side */
  groundShadow(px, 16, 0.26 * (1 - sk.night * 0.5));
  var yourPose = "stand";
  var ex = scene.exchange;
  if (ex) yourPose = ex.you === "C" ? "offer" : "withhold";
  drawFigure(px, GY, t, Object.assign(playerFigure(), {
    face: 1, pose: yourPose, reach: ex ? smooth(clamp(ex.u * 2, 0, 1)) : 0
  }));

  /* them, on the far side, walking up if they have just arrived */
  if (scene.them) {
    var enter = scene.enter;
    var atx = lerp(W + 40, nx, smooth(enter));
    groundShadow(atx, 16, 0.26 * (1 - sk.night * 0.5) * enter);
    var pose = enter < 0.99 ? "walk" : "stand";
    if (enter > 0.99 && ex) pose = ex.them === "C" ? "offer" : "withhold";
    drawFigure(atx, GY, t, Object.assign({}, scene.them.fig, {
      face: -1, pose: pose, reach: ex ? smooth(clamp(ex.u * 2, 0, 1)) : 0
    }));
  }

  /* the baskets, and what happens to them */
  var bs = small ? 0.9 : 1.15;
  if (ex) {
    var u = ex.u;
    var lift = small ? 30 : 44;
    /* your basket */
    if (ex.you === "C") {
      var a = clamp((u - 0.12) / 0.62, 0, 1);
      var stop = ex.youLost ? 0.52 : 1;
      var aa = Math.min(a, stop);
      var bx = lerp(px + 14, nx - 14, aa);
      var by = GY - 12 - Math.sin(aa * Math.PI) * lift;
      if (ex.youLost && a >= stop) {
        by = GY - 2;
        drawBasket(bx, by, bs, false, true);
      } else drawBasket(bx, by, bs, true, false);
    } else if (u > 0.05) {
      drawBasket(px + 16, GY - 4, bs, true, false);
    }
    /* their basket */
    if (ex.them === "C") {
      var b = clamp((u - 0.12) / 0.62, 0, 1);
      var stop2 = ex.themLost ? 0.52 : 1;
      var bb = Math.min(b, stop2);
      var cx2 = lerp(nx - 14, px + 14, bb);
      var cy = GY - 12 - Math.sin(bb * Math.PI) * lift * 0.86;
      if (ex.themLost && b >= stop2) {
        cy = GY - 2;
        drawBasket(cx2, cy, bs, false, true);
      } else drawBasket(cx2, cy, bs, true, false);
    } else if (u > 0.05 && scene.them) {
      drawBasket(nx - 16, GY - 4, bs, true, false);
    }
  }
}

/* ---- chapter five: the village drawn as a population ---- */

function drawPopulation(t) {
  var pop = scene.pop;
  if (!pop) return;
  var total = 0, i;
  for (i = 0; i < pop.length; i++) total += pop[i].n;
  if (total <= 0) return;
  var cols = small ? 6 : 10;
  var rows = Math.ceil(total / cols);
  var padX = W * (small ? 0.09 : 0.11);
  var spanX = W - padX * 2;
  var stepX = spanX / (cols - 1 || 1);
  var sep = small ? 17 : 24;
  var order = [];
  for (i = 0; i < pop.length; i++) {
    for (var j = 0; j < pop[i].n; j++) order.push(pop[i]);
  }
  /* the back of the village is painted first, so the front row stands in
     front of it rather than behind it */
  var seq = [];
  for (i = 0; i < order.length; i++) seq.push(i);
  seq.sort(function (p1, p2) { return Math.floor(p2 / cols) - Math.floor(p1 / cols); });
  for (var q = 0; q < seq.length; q++) {
    i = seq[q];
    var r = Math.floor(i / cols), c = i % cols;
    var jitter = ((i * 37) % 9) - 4;
    var x = padX + c * stepX + jitter + (r % 2 ? stepX * 0.42 : 0);
    var y = GY - 4 - r * sep;
    var sc = (small ? 0.42 : 0.5) * (1 - r * 0.08);
    /* a small house for each household, and the household beside its door */
    var u = sc * 2, hx2 = x - 16 * u;
    ctx.save();
    groundShadow(hx2, 15 * u, 0.2);
    ctx.fillStyle = "rgba(103,80,58,.92)";
    ctx.fillRect(hx2 - 12 * u, y - 20 * u, 24 * u, 20 * u);
    ctx.fillStyle = "rgba(35,25,16,.4)";
    ctx.fillRect(hx2 - 12 * u, y - 20 * u, 24 * u, 3 * u);
    ctx.fillStyle = "rgba(138,74,44,.95)";
    ctx.beginPath();
    ctx.moveTo(hx2 - 15 * u, y - 19 * u);
    ctx.lineTo(hx2, y - 30 * u);
    ctx.lineTo(hx2 + 15 * u, y - 19 * u);
    ctx.closePath(); ctx.fill();
    ctx.strokeStyle = "rgba(58,30,16,.7)"; ctx.lineWidth = Math.max(0.6, 1.1 * u);
    ctx.stroke();
    ctx.fillStyle = "rgba(30,20,12,.85)";
    ctx.fillRect(hx2 - 3.5 * u, y - 11 * u, 7 * u, 11 * u);
    ctx.restore();
    drawFigure(x, y, t + i * 0.4, {
      scale: sc, face: 1, pose: "stand",
      coat: order[i].color, hairStyle: order[i].hairStyle || "crop", hair: "#241a12"
    });
  }
}

/* ---- the whole frame ---- */

function draw(t) {
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  drawSky(t);
  drawLand(t);
  if (scene.mode !== "village") {
    drawHouse(t);
    drawTree(t);
    drawFence(t);
    if (scene.lantern) drawLantern(t, scene.rep);
  }
  drawScene(t);
  drawMotes();
  /* the same quiet vignette the portfolio uses */
  var v = ctx.createRadialGradient(W / 2, GY * 0.55, GY * 0.4, W / 2, GY * 0.6, Math.max(W, H) * 0.8);
  v.addColorStop(0, "rgba(0,0,0,0)");
  v.addColorStop(1, "rgba(10,10,16,.26)");
  ctx.fillStyle = v;
  ctx.fillRect(0, 0, W, H);
}

var lastT = 0;
function frame(now) {
  var tt = now / 1000;
  var dt = Math.min(0.05, tt - lastT || 0.016);
  lastT = tt;
  if (!reduced) world.t = tt;
  /* seasons crossfade, the light walks forward */
  if (world.mix < 1) world.mix = Math.min(1, world.mix + dt * (reduced ? 4 : 0.9));
  world.dayT += (world.day - world.dayT) * (reduced ? 1 : Math.min(1, dt * 1.6));
  if (scene.enter < 1) scene.enter = Math.min(1, scene.enter + dt * (FAST ? 6 : 1.2));
  if (scene.exchange && scene.exchange.u < 1) {
    scene.exchange.u = Math.min(1, scene.exchange.u + dt * (FAST || reduced ? 4 : 0.75));
  }
  stepMotes(world.t, dt);
  draw(world.t);
  requestAnimationFrame(frame);
}

/* ============================================================
   6. the seasons
   ============================================================ */

function advanceWorld() {
  world.prev = world.season;
  /* chapter three is one winter from end to end, so only the light moves */
  world.season = G.chapter === 3 ? 3 : (world.season + 1) % 4;
  world.mix = world.season === world.prev ? 1 : 0;
  var frac = G.totalSeasons ? G.seasonInCh / G.totalSeasons : 0;
  world.day = clamp(0.1 + frac * 0.82, 0, 0.96);
}

function currentEnc() { return G.enc[G.encI] || null; }

function neighbourMove(entry) {
  var b = bookOf(entry.name);
  var d;
  if (entry.disp === "arrival") {
    G.arrivalDisp = G.arrivalDisp || {};
    /* a new arrival fixes an opening the moment word of you reaches them,
       and answers what you actually do from then on */
    if (!G.arrivalDisp[entry.name]) G.arrivalDisp[entry.name] = reputationOpener(G.rep);
    d = G.arrivalDisp[entry.name];
  } else {
    d = DISPOSITIONS[entry.disp];
  }
  return d.move(b.you, b.them, b.theirPays, G.pay);
}

function resolve(yourMove) {
  var entry = currentEnc();
  if (!entry) return;
  var b = bookOf(entry.name);
  var theirMove = neighbourMove(entry);

  var r = playRound(yourMove, theirMove, G.noise, rnd, G.pay);
  /* the hard winter carries one loss that is certain, so that the lesson
     of the chapter does not depend on a coin */
  if (G.forceLoss === G.seasonInCh) {
    if (yourMove === "C" && !r.aLost) { r.a = "D"; r.aLost = true; }
    else if (theirMove === "C" && !r.bLost) { r.b = "D"; r.bLost = true; }
    r.aPay = payoff(r.a, r.b, G.pay);
    r.bPay = payoff(r.b, r.a, G.pay);
  }

  b.you.push(r.a); b.them.push(r.b); b.meant.push(r.bIntent);
  b.yourPays.push(r.aPay); b.theirPays.push(r.bPay);
  b.youTot += r.aPay; b.themTot += r.bPay;
  if (r.aLost) b.lostYours++;
  if (r.bLost) b.lostTheirs++;
  G.you += r.aPay; G.them += r.bPay;

  /* What the village believes: earned slowly, lost quickly.
     The gully winter is left out of it, because every household in the
     village had the same road that year and everybody knows it. */
  if (G.chapter !== 3) {
    if (r.a === "C") G.rep = clamp(G.rep + 0.07 * (1 - G.rep), 0, 1);
    else G.rep = clamp(G.rep - 0.2, 0, 1);
  }
  scene.rep = G.rep;

  LOG.push({
    chapter: G.chapter, season: G.seasonInCh, who: entry.name,
    disp: entry.disp, youIntended: r.aIntent, themIntended: r.bIntent,
    you: r.a, them: r.b, youLost: r.aLost, themLost: r.bLost,
    youPay: r.aPay, themPay: r.bPay
  });

  G.last = { r: r, name: entry.name };
  scene.exchange = { you: r.a === "C" || r.aLost ? "C" : "D", them: r.b === "C" || r.bLost ? "C" : "D",
                     youLost: r.aLost, themLost: r.bLost, u: 0 };
  G.seasonInCh++;
  G.encI++;
  advanceWorld();
  if (!nb.hidden) renderNotebook();
  save();
  view("result");
}

/* the words for one season, in baskets rather than numbers */
function resultWords(r, name) {
  var out = [];
  var yourGift = r.aIntent === "C", theirGift = r.bIntent === "C";
  if (yourGift && r.aLost) out.push("Your sack never made it across. It is still in your barn, and your barn is fuller than you meant it to be.");
  else if (yourGift) out.push("You put your sack over the fence.");
  else out.push("You kept your sack on your own step.");
  if (theirGift && r.bLost) out.push("A sack was meant to come the other way and never arrived.");
  else if (theirGift) out.push(name + " handed a sack across at the same moment.");
  else out.push(name + " kept the sack on the far step.");
  return out.join(" ");
}

function outcomeLine(r) {
  var y = r.aPay, t = r.bPay;
  var tail = " " + y + " basket" + (y === 1 ? "" : "s") + " to you, " + t + " to them.";
  if (r.aLost || r.bLost) {
    if (r.aLost && r.bLost) return "The road took both sacks." + tail;
    if (r.aLost) return "The road made a keeper of you without asking." + tail;
    return "Nothing came across, and nobody decided that." + tail;
  }
  if (r.a === "C" && r.b === "C") return "Both cellars hold." + tail;
  if (r.a === "D" && r.b === "C") return "You did best out of the season." + tail;
  if (r.a === "C" && r.b === "D") return "You did worst out of the season." + tail;
  return "Neither cellar fills." + tail;
}

function startChapter(n) {
  $("menuBtn").hidden = false;

  G.seasonInCh = 0; G.encI = 0; G.you = 0; G.them = 0;
  G.noise = 0; G.forceLoss = -1; G.quiz = null; G.last = null;
  G.pay = { T: 5, R: 3, P: 1, S: 0 };
  rnd = mulberry(G.seed + n * 977);
  scene.mode = "fence"; scene.pop = null; scene.exchange = null;
  scene.lantern = n >= 4; scene.rep = G.rep;
  world.day = 0.1; world.dayT = 0.1;
  world.prev = world.season = (n - 1) % 4; world.mix = 1;
  nbBtn.hidden = n < 2 || n === 5;
  if (nbBtn.hidden) showNotebook(false);

  if (n === 1) {
    G.book = {};
    G.enc = encFrom(["mira", "mira", "mira", "mira", "mira", "mira"]);
  } else if (n === 2) {
    G.enc = encFrom(["deniz", "bruno", "halil", "ana",
                     "deniz", "bruno", "halil", "ana",
                     "deniz", "bruno", "halil", "ana"]);
  } else if (n === 3) {
    G.run3 = 1;
    G.book.Halil = { you: [], them: [], meant: [], yourPays: [], theirPays: [], youTot: 0, themTot: 0, lostYours: 0, lostTheirs: 0 };
    G.noise = 0.2; G.forceLoss = 2;
    rnd = mulberry(WINTER_SEED);
    G.enc = encFrom(["halil", "halil", "halil", "halil", "halil", "halil", "halil", "halil"]);
    world.prev = world.season = 3; world.mix = 1;
  } else if (n === 4) {
    G.arrivalDisp = {};
    G.enc = encFrom(["tomas", "tomas", "tomas", "leyla", "leyla", "leyla", "emre", "emre", "emre"]);
  } else if (n === 5) {
    scene.mode = "village";
    buildYears();
  }
  G.totalSeasons = G.enc.length;
  scene.them = null; scene.enter = 0;
  save();
}

function beginSeason() {
  var e = currentEnc();
  scene.exchange = null;
  if (e) {
    var prev = scene.them && scene.them.key;
    scene.them = { key: e.key, fig: PEOPLE[e.key].fig, name: e.name };
    scene.enter = prev === e.key ? 1 : (FAST || reduced ? 1 : 0);
  }
  view("ask");
}

/* Coming back to a saved game. Everything is restored except the run of
   luck inside chapter three, which has to be the same run of luck for
   both winters, so that chapter resumes at the top of its current winter. */
function resume(s) {
  G.acted = true;
  var n = s.chapter || 1;
  G.rep = s.rep != null ? s.rep : 0.5;
  G.furthest = Math.max(s.furthest || 1, n);
  startChapter(n);
  if (s.book) G.book = s.book;

  if (n === 5) {
    applyYear(s.yearI || 0);

  if (n === 3) {

    } else {
      G.book.Halil = { you: [], them: [], meant: [], yourPays: [], theirPays: [], youTot: 0, themTot: 0, lostYours: 0, lostTheirs: 0 };
    }
    G.you = 0; G.them = 0; G.seasonInCh = 0; G.encI = 0;
    rnd = mulberry(WINTER_SEED);
    beginSeason();
    return;
  }
  G.encI = clamp(s.encI || 0, 0, G.enc.length);
  G.seasonInCh = clamp(s.seasonInCh || 0, 0, G.enc.length);
  G.you = s.you || 0; G.them = s.them || 0;

  beginSeason();
}

/* the same eight seasons played by two mirrors, one of them where you stood.
   The noise stream and the certain loss are the ones the chapter used. */
function pairWinter(id) {
  var r = mulberry(WINTER_SEED);
  var A = DISPOSITIONS[id], B = DISPOSITIONS[id];
  var oA = [], oB = [], sA = 0, sB = 0, feud = 0, alt = 0;
  for (var i = 0; i < 8; i++) {
    var mA = A.move(oB, oA, [], G.pay), mB = B.move(oA, oB, [], G.pay);
    var res = playRound(mA, mB, 0.2, r, G.pay);
    if (i === 2) {
      if (mA === "C" && !res.aLost) { res.a = "D"; res.aLost = true; }
      else if (mB === "C" && !res.bLost) { res.b = "D"; res.bLost = true; }
      res.aPay = payoff(res.a, res.b, G.pay);
      res.bPay = payoff(res.b, res.a, G.pay);
    }
    oA.push(res.a); oB.push(res.b);
    sA += res.aPay; sB += res.bPay;
    if (res.a === "D" && res.b === "D") feud++;
    if (res.a !== res.b) alt++;
  }
  return { a: sA, b: sB, feud: feud, alt: alt, both: sA + sB };
}

/* ============================================================
   9. chapter five: the years
   Round robin between types, then proportional reproduction.
   This is the ecological run Axelrod used, with the population
   share of a disposition set by how well it fed itself.

var EVO_TYPES = ["giver", "taker", "mirror", "grudge", "forgiver"];
var EVO_N = 30;
var EVO_W = 0.967;                       /* the chance the seasons continue */
var EVO_L = Math.max(1, Math.round(1 / (1 - EVO_W)));
var EVO_YEARS = 40;

function evoMatrix() {
  var A = [];
  for (var i = 0; i < EVO_TYPES.length; i++) {
    A.push([]);
    for (var j = 0; j < EVO_TYPES.length; j++) {
      var r = match(DISPOSITIONS[EVO_TYPES[i]], DISPOSITIONS[EVO_TYPES[j]], EVO_L, 0, function () { return 0.5; }, PAY);
      A[i].push(r.a);
    }
  }
  return A;
}

function buildYears() {
  var A = evoMatrix();
  var counts = [15, 6, 4, 3, 2];
  var p = counts.map(function (c) { return c / EVO_N; });
  G.years = [p.slice()];
  G.fitLog = [];
  for (var y = 0; y < EVO_YEARS; y++) {
    var fit = [], i, j;
    for (i = 0; i < p.length; i++) {
      var f = 0;
      for (j = 0; j < p.length; j++) {
        var others = (p[j] * EVO_N - (i === j ? 1 : 0)) / (EVO_N - 1);
        if (others < 0) others = 0;
        f += others * A[i][j];
      }
      fit.push(f);
    }
    G.fitLog.push(fit.slice());
    var tot = 0;
    for (i = 0; i < p.length; i++) tot += p[i] * fit[i];
    var np = [];
    for (i = 0; i < p.length; i++) np.push(tot > 0 ? p[i] * fit[i] / tot : p[i]);
    var s = 0;
    for (i = 0; i < np.length; i++) { if (np[i] < 0.005) np[i] = 0; s += np[i]; }
    for (i = 0; i < np.length; i++) np[i] = s > 0 ? np[i] / s : 0;
    p = np;
    G.years.push(p.slice());
  }
  G.yearI = 0;
  G.evoA = A;
  applyYear(0);
}

function countsFor(p) {
  var c = p.map(function (v) { return Math.round(v * EVO_N); });
  var s = c.reduce(function (a, b) { return a + b; }, 0);
  while (s !== EVO_N) {
    var idx = 0, best = -1;
    for (var i = 0; i < c.length; i++) {
      var err = Math.abs(p[i] * EVO_N - (c[i] + (s < EVO_N ? 1 : -1)));
      if (p[i] === 0 && s < EVO_N) continue;
      if (c[i] === 0 && s > EVO_N) continue;
      if (best < 0 || err < best) { best = err; idx = i; }
    }
    c[idx] += s < EVO_N ? 1 : -1;
    s = c.reduce(function (a, b) { return a + b; }, 0);
  }
  return c;
}

var EVO_HAIR = ["bun", "hat", "braid", "crop", "curly"];

function applyYear(i) {
  G.yearI = clamp(i, 0, G.years.length - 1);
  var p = G.years[G.yearI];
  var c = countsFor(p);
  scene.mode = "village";
  scene.pop = EVO_TYPES.map(function (k, idx) {
    return { key: k, n: c[idx], color: DISPOSITIONS[k].color, hairStyle: EVO_HAIR[idx] };
  }).filter(function (r) { return r.n > 0; });
  world.season = Math.floor(G.yearI / 4) % 4;
  world.prev = world.season; world.mix = 1;
  world.day = 0.18 + (G.yearI / EVO_YEARS) * 0.5;
}

function censusBlock() {
  var p = G.years[G.yearI], c = countsFor(p);
  var box = el("div", "census");
  EVO_TYPES.forEach(function (k, i) {
    var d = DISPOSITIONS[k];
    var row = el("div", "r");

    row.appendChild(sw2);
    row.appendChild(el("span", null, d.name));
    var bar = el("span", "bar");
    var fill = el("i");
    fill.style.width = (p[i] * 100).toFixed(1) + "%";
    fill.style.background = d.color;
    bar.appendChild(fill);
    row.appendChild(bar);
    row.appendChild(el("span", "n", c[i] + " of " + EVO_N));
    box.appendChild(row);
  });
  panel.appendChild(box);
  return c;
}

VIEWS.years = function () {
  setTop("Chapter 5. The years", "year " + G.yearI + " of " + EVO_YEARS);

  var title = G.yearI === 0 ? "Thirty households"
    : takerShare === 0 ? "There is nobody left who keeps whatever happens"

    : takerShare < peak * 0.5 && peak > 0.25 ? "The keepers are running out of people to take from"

  } else {

};

var timer = null;
function stopTimer() { if (timer) { clearTimeout(timer); timer = null; } }
function tickYears() {
  stopTimer();
  if (!G.running) return;
  timer = setTimeout(function () {
    if (!G.running) return;
    if (G.yearI >= G.years.length - 1) { G.running = false; view("years"); return; }
    applyYear(G.yearI + 1);
    view("years");
    if (G.running) tickYears();
  }, reduced ? 260 : 460);
}

function endFive() {
  var first = G.years[0], last = G.years[G.years.length - 1];
  var peak = 0, peakYear = 0, giverMin = 1;
  for (var i = 0; i < G.years.length; i++) {
    if (G.years[i][1] > peak) { peak = G.years[i][1]; peakYear = i; }
    if (G.years[i][0] < giverMin) giverMin = G.years[i][0];
  }
  kick("Chapter five closes");
  head("What survives is not what wins the next season");
  para("The households that keep whatever happens started as a fifth of the village. By year " + peakYear +
       " they were " + Math.round(peak * 100) + " of every hundred households, because a village full of people who share whatever happens is the easiest place in the world to be a keeper.");
  para("And that is exactly what finished them. Every year they took, there were fewer households left to take from. The ones who share unconditionally went first, and once they were gone the keepers were dealing mostly with each other and with households that answer back, and a keeper dealing with a keeper gets one basket a season. By year " + (G.years.length - 1) + " they were " + Math.round(last[1] * 100) + " of every hundred.");
  para("The households that share whatever happens are worth watching too. They fall to " + Math.round(giverMin * 100) +
       " in every hundred while the keepers are eating, and then, once the keepers are gone, they stop being punished for anything and hold at " +
       Math.round(last[0] * 100) + ". They are not doing well because they are good. They are doing well because there is no longer anybody to take from them, and their being there is exactly the crack a keeper would come back through.");
  para("Nothing in this village was choosing. Nobody learned, nobody changed their mind, nobody was punished for anything. Households that fed themselves well had more children, and that alone moved the ground under everyone.");
  para("The thing worth taking away is the difference between two questions. Which move wins this season is one question, and keeping wins it every time. Which way of going about the harvest is still here in forty years is a different question, and it has a different answer.");
  para("Read the numbers narrowly. This result is a fact about this village: these five dispositions, these starting proportions, these four payoffs and about thirty seasons a pairing. Change the mixture and you change the outcome. Put no mirrors and no grudges in the village at all and the keepers never fall. Shorten the seasons so that each pairing meets twice and the keepers win outright. There is no law here that cooperation wins. There is only a mechanism, and mechanisms have conditions.");
}

VIEWS.freeSetup = function () {
  stopTimer(); G.running = false;
  $("menuBtn").hidden = false;
  scene.mode = "fence"; scene.pop = null; scene.them = null; scene.exchange = null;
  scene.lantern = false;
  setTop("Free play", "your numbers, your neighbour");
  kick("Free play");
  head("Set the village yourself");
  para("Four numbers, a chance the sack is lost on the road, a chance the seasons carry on, and the person across the fence. Nothing is hidden and the game will tell you when your numbers have stopped being a dilemma.");
  var f = el("div", "fields");
  function field(id, label, val, min, max, step) {
    var w = el("div");
    var l = el("label", null, label); l.setAttribute("for", id);
    var inp = el("input"); inp.type = "number"; inp.id = id; inp.value = val;
    inp.min = min; inp.max = max; inp.step = step || 1;
    w.appendChild(l); w.appendChild(inp); f.appendChild(w);
    return inp;
  }
  var cfg = G.freeCfg || { T: 5, R: 3, P: 1, S: 0, noise: 0, w: 90, disp: "mirror", seasons: 20 };
  field("f-T", "you keep, they share", cfg.T, -20, 40);
  field("f-R", "both share", cfg.R, -20, 40);
  field("f-P", "both keep", cfg.P, -20, 40);
  field("f-S", "you share they keep", cfg.S, -20, 40);
  field("f-n", "sacks lost, per hundred", cfg.noise, 0, 60);
  field("f-w", "seasons carry on, per hundred", cfg.w, 0, 100);
  var w2 = el("div");
  var l2 = el("label", null, "across the fence"); l2.setAttribute("for", "f-d");
  var sel = el("select"); sel.id = "f-d";
  DISP_ORDER.forEach(function (k) {
    var o = el("option", null, DISPOSITIONS[k].name + ", " + DISPOSITIONS[k].formal);
    o.value = k;
    if (k === cfg.disp) o.selected = true;
    sel.appendChild(o);
  });
  w2.appendChild(l2); w2.appendChild(sel);
  f.appendChild(w2);
  panel.appendChild(f);
  var warn = el("p", "warnline"); warn.id = "f-warn";
  panel.appendChild(warn);

  function check() {
    var p = { T: +$("f-T").value, R: +$("f-R").value, P: +$("f-P").value, S: +$("f-S").value };
    var d = dilemmaCheck(p);
    if (d.ok) {
      warn.className = "warnline ok";
      warn.textContent = "These four numbers are a dilemma. Keeping beats sharing whatever the other does, and both sharing beats taking turns to rob each other.";
    } else {
      warn.className = "warnline";
      var msgs = [];
      if (!d.order) msgs.push("Keeping no longer beats sharing whatever the other side does, so there is nothing to be trapped by.");
      if (!d.pair) msgs.push("Two shared seasons are now worth less than robbing each other in turn, so a pair does best by alternating rather than by sharing.");
      warn.textContent = "This is no longer a prisoner's dilemma. " + msgs.join(" ") + " It is still playable, and it is still a game, but it is a different one.";
    }
  }
  ["f-T", "f-R", "f-P", "f-S"].forEach(function (id) {
    $(id).addEventListener("input", check);
  });
  check();

  var r = actions();
  btn(r, "Go to the fence", "start", function () {
    G.freeCfg = {
      T: +$("f-T").value, R: +$("f-R").value, P: +$("f-P").value, S: +$("f-S").value,
      noise: clamp(+$("f-n").value, 0, 60), w: clamp(+$("f-w").value, 0, 100),
      disp: $("f-d").value
    };
    startFree();
  }, "big");
  btn(r, "Back to the ending", null, function () { view("ending"); }, "quiet");
  say("Free play. Set the four payoffs, the chance a sack is lost, the chance the seasons carry on, and who is across the fence.");
};

function startFree() {
  var c = G.freeCfg;
  G.chapter = 0;
  G.pay = { T: c.T, R: c.R, P: c.P, S: c.S };
  G.noise = c.noise / 100;
  G.forceLoss = -1;
  G.you = 0; G.them = 0; G.seasonInCh = 0; G.encI = 0; G.totalSeasons = 0;
  G.book = {}; G.book.Neighbour = { you: [], them: [], meant: [], yourPays: [], theirPays: [], youTot: 0, themTot: 0, lostYours: 0, lostTheirs: 0 };
  rnd = mulberry((Date.now() % 100000) | 0);
  scene.mode = "fence"; scene.lantern = false; scene.exchange = null;
  scene.them = { key: "free", fig: { coat: "#5f6b4a", hairStyle: "cap", capCol: "#6b5334", hair: "#241a12", skin: "#c08a5e" }, name: "Neighbour" };

  G.freeEntry = { key: "free", name: "Neighbour", disp: c.disp };
  G.enc = [];
  world.day = 0.2; world.season = 0; world.prev = 0; world.mix = 1;
  nbBtn.hidden = false;
