<style>
/* ============================================================
   The Long Game
   It shares none of the paper kit: the whole point of it is that
   it looks like the painted world at keremozdemir.de rather than
   like the instruments.  _tools/build.sh gives it the site's top
   bar and the site's footer and touches nothing else, so the
   village below them is exactly as it was.
   One file. One canvas. No framework, no library, no network
   call once the fonts have arrived. The world is painted with
   canvas primitives in the same hand as keremozdemir.de. The
   interface on top of it is ordinary HTML so that every choice
   is a real button with a real focus ring and a real name.
   ============================================================ */

:root{
  --soil:#2c2115; --timber:#67503a; --terracotta:#8a4a2c;
  --accent:#e0a050; --ink:#2b2620; --paper:#f2efe6; --verdigris:#5e7a6a;
  --ink-soft:#4b443b; --dim:#6f6558; --faint:#6f6759;
  --rule:rgba(103,80,58,.32); --rule-firm:rgba(103,80,58,.55);
  --display:"Fraunces","Iowan Old Style",Georgia,serif;
  --serif:"Newsreader",Georgia,"Times New Roman",serif;
  --mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --card:rgba(242,239,230,.955);
  --card-sunk:rgba(232,227,214,.9);
}

*{box-sizing:border-box}
html,body{margin:0;padding:0;overflow-x:hidden;max-width:100%}
html{-webkit-text-size-adjust:100%}
body{
  font-family:var(--serif); color:var(--ink); background:#c8c4b6;
  min-height:100dvh; overscroll-behavior-y:none;
}
canvas#world{
  position:fixed; inset:0; width:100%; height:100%; display:block; z-index:0;
}

.vh{position:absolute;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;
    clip:rect(0 0 0 0);clip-path:inset(50%);white-space:nowrap;border:0}

.skip{position:absolute;left:-9999px;top:0;z-index:60;background:var(--paper);
  color:var(--ink);padding:.6rem .9rem;font-family:var(--mono);font-size:.72rem;
  border:1px solid var(--rule-firm)}
.skip:focus{left:.6rem;top:.6rem}

/* ---------- the frame that holds the world and the interface ---------- */

#shell{
  position:relative; z-index:2; min-height:100dvh;
  display:flex; flex-direction:column; justify-content:space-between;
  padding:clamp(.6rem,2vw,1.1rem);
  padding-bottom:calc(clamp(.6rem,2vw,1.1rem) + env(safe-area-inset-bottom,0px));
  gap:.7rem;
}

/* ---------- the strip along the top: where and when you are ---------- */

#topbar{
  display:flex; flex-wrap:wrap; align-items:baseline; gap:.4rem .9rem;
  background:var(--card); border:1px solid var(--rule-firm);
  padding:.5rem .8rem; max-width:64rem; width:100%; margin:0 auto; flex:none;
  box-shadow:0 1px 0 rgba(44,33,21,.14);
}
#topbar .ch{font-family:var(--display);font-weight:400;font-size:.98rem;
  letter-spacing:-.01em;margin:0}
#topbar .meta{font-family:var(--mono);font-size:.63rem;letter-spacing:.12em;
  text-transform:uppercase;color:var(--dim);margin:0}
#topbar .spacer{flex:1 1 auto}
#topbar button{flex:none}

/* ---------- the card at the bottom: everything you read and press ---------- */

#panel{
  background:var(--card); border:1px solid var(--rule-firm);
  padding:clamp(.85rem,2.4vw,1.25rem);
  max-width:64rem; width:100%; margin:0 auto; flex:none;
  box-shadow:0 2px 0 rgba(44,33,21,.16);
  max-height:74dvh; overflow-y:auto; overscroll-behavior:contain;
}
/* a page of reading is set narrower, so the world is still there beside it */
#panel.read{max-width:49rem}
@media (max-width:900px){ #panel.read{max-width:64rem} }
#panel h2{font-family:var(--display);font-weight:400;font-size:clamp(1.18rem,3.4vw,1.5rem);
  letter-spacing:-.02em;margin:0 0 .45rem;line-height:1.2}
#panel h3{font-family:var(--display);font-weight:400;font-size:1.02rem;margin:1.1rem 0 .35rem}
#panel p{margin:0 0 .6rem;font-size:clamp(.95rem,2.6vw,1.02rem);line-height:1.62;
  max-width:60ch;color:var(--ink-soft)}
#panel p.say{color:var(--ink);font-style:italic}
#panel p.tight{margin-bottom:.35rem}
#panel ul{margin:0 0 .7rem;padding-left:1.1rem;max-width:60ch}
#panel li{font-size:.95rem;line-height:1.6;margin-bottom:.3rem;color:var(--ink-soft)}
#panel a{color:var(--terracotta);text-underline-offset:.2em}
#panel a:hover{color:var(--accent)}

.kicker{font-family:var(--mono);font-size:.63rem;letter-spacing:.14em;
  text-transform:uppercase;color:var(--faint);margin:0 0 .3rem}

/* ---------- buttons ---------- */

.row{display:flex;flex-wrap:wrap;gap:.55rem;margin-top:.75rem;align-items:stretch}
button{
  font-family:var(--serif); font-size:1rem; color:var(--ink);
  background:rgba(253,252,248,.96); border:1px solid var(--rule-firm);
  padding:.6rem 1rem; cursor:pointer; line-height:1.3;
  transition:background-color .13s ease,border-color .13s ease,transform .08s ease;
  min-height:2.75rem;
}
button:hover{background:#fffdf7;border-color:var(--terracotta)}
button:active{transform:translateY(1px)}
button:focus-visible{outline:2px solid var(--terracotta);outline-offset:2px}
button[disabled]{opacity:.45;cursor:default}
button .k{display:block;font-family:var(--mono);font-size:.6rem;letter-spacing:.13em;
  text-transform:uppercase;color:var(--faint);margin-top:.18rem}
button.big{font-family:var(--display);font-size:1.06rem;padding:.7rem 1.25rem;flex:1 1 11rem}
button.share{border-color:rgba(94,122,106,.75);background:rgba(232,238,231,.96)}
button.share:hover{background:#e9f0e7;border-color:var(--verdigris)}
button.keep{border-color:rgba(138,74,44,.7);background:rgba(244,232,224,.96)}
button.keep:hover{background:#f7e9e0;border-color:var(--terracotta)}
button.quiet{font-family:var(--mono);font-size:.65rem;letter-spacing:.12em;
  text-transform:uppercase;padding:.42rem .7rem;min-height:2.1rem;color:var(--dim);
  background:transparent;border-color:var(--rule)}
button.quiet:hover{color:var(--ink);background:rgba(253,252,248,.8)}

/* ---------- the tally: baskets, counted ---------- */

.tally{display:flex;flex-wrap:wrap;gap:.35rem 1.4rem;font-family:var(--mono);
  font-size:.72rem;letter-spacing:.04em;color:var(--dim);
  border-top:1px solid var(--rule);padding-top:.55rem;margin-top:.75rem}
.tally b{color:var(--ink);font-weight:500;font-variant-numeric:tabular-nums}

/* ---------- the payoff table, when it is finally shown ---------- */

.tblwrap{overflow-x:auto;margin:.4rem 0 .9rem;max-width:100%}
table.pay{border-collapse:collapse;font-family:var(--mono);font-size:.76rem;min-width:20rem}
table.pay th,table.pay td{border:1px solid var(--rule-firm);padding:.42rem .6rem;text-align:center}
table.pay th{font-size:.6rem;letter-spacing:.1em;text-transform:uppercase;
  color:var(--dim);font-weight:500;background:var(--card-sunk)}
table.pay td{background:rgba(253,252,248,.8);min-width:7rem}
table.pay td b{color:var(--terracotta);font-weight:500;font-size:.95rem}
table.pay td span{color:var(--dim)}

/* ---------- the notebook ---------- */

#nbwrap{max-width:64rem;width:100%;margin:0 auto;flex:none;display:flex;justify-content:flex-end}
#notebook{max-width:31rem;width:100%;
  background:var(--card);border:1px solid var(--rule-firm);
  border-left:3px solid var(--terracotta);
  padding:.7rem .9rem;margin-top:.5rem;
  box-shadow:0 2px 0 rgba(44,33,21,.16);
  max-height:36dvh;overflow-y:auto;
}
#notebook table{border-collapse:collapse;width:100%;font-size:.85rem}
#notebook th,#notebook td{text-align:left;padding:.3rem .5rem;border-bottom:1px solid var(--rule)}
#notebook th{font-family:var(--mono);font-size:.58rem;letter-spacing:.11em;
  text-transform:uppercase;color:var(--faint);font-weight:500}
#notebook td.nm{font-family:var(--display);white-space:nowrap}
#notebook td.gl{font-family:var(--mono);font-size:.95rem;letter-spacing:.14em;color:var(--ink);
  word-break:break-all}
#notebook td.ct{font-family:var(--mono);font-size:.68rem;color:var(--dim);white-space:nowrap;
  font-variant-numeric:tabular-nums}
#notebook .hint{font-family:var(--mono);font-size:.6rem;color:var(--faint);
  letter-spacing:.06em;margin:.5rem 0 0}

/* ---------- free play form ---------- */

.fields{display:grid;gap:.6rem .9rem;grid-template-columns:repeat(auto-fit,minmax(8.5rem,1fr));
  max-width:46rem;margin:.5rem 0 .3rem}
.fields label{display:block;font-family:var(--mono);font-size:.6rem;letter-spacing:.1em;
  text-transform:uppercase;color:var(--dim);margin-bottom:.2rem}
.fields input,.fields select{
  width:100%;font-family:var(--mono);font-size:.85rem;padding:.4rem .5rem;
  background:rgba(253,252,248,.96);border:1px solid var(--rule-firm);color:var(--ink)}
.fields input:focus-visible,.fields select:focus-visible{
  outline:2px solid var(--terracotta);outline-offset:1px}
.warnline{font-family:var(--mono);font-size:.68rem;line-height:1.6;color:var(--terracotta);
  max-width:52rem;margin:.35rem 0 0}
.warnline.ok{color:var(--verdigris)}

/* ---------- the strategy roll ---------- */

.roll{display:grid;gap:.5rem;max-width:52rem;margin:.3rem 0 .8rem}
.roll div{display:grid;grid-template-columns:auto 1fr;gap:.2rem .7rem;align-items:baseline}
.roll .who{font-family:var(--display);font-size:1rem;white-space:nowrap}
.roll .was{font-family:var(--mono);font-size:.68rem;letter-spacing:.06em;color:var(--dim);
  grid-column:1 / -1}
.swatch{display:inline-block;width:.7rem;height:.7rem;flex:none;vertical-align:baseline;
  border:1px solid rgba(43,38,32,.35)}

/* ---------- the village census, chapter five ---------- */

.census{display:grid;gap:.3rem;max-width:34rem;margin:.3rem 0 .6rem;
  font-family:var(--mono);font-size:.72rem}
.census .r{display:grid;grid-template-columns:.7rem 8.5rem 1fr auto;gap:.5rem;align-items:center}
.census .bar{height:.6rem;background:rgba(103,80,58,.16);position:relative}
.census .bar i{position:absolute;inset:0 auto 0 0;display:block}
.census .n{font-variant-numeric:tabular-nums;color:var(--ink);min-width:3.2rem;text-align:right}

@media (max-width:640px){
  #panel{max-height:62dvh}
  #notebook{max-width:none;max-height:26dvh;padding:.5rem .6rem}
  #notebook th,#notebook td{padding:.22rem .32rem}
  #notebook td.gl{font-size:.78rem;letter-spacing:.08em}
  #notebook table{font-size:.78rem}
  #topbar{padding:.45rem .6rem;gap:.3rem .6rem}
  #topbar .ch{font-size:.92rem}
  button.big{flex:1 1 100%}
  .tally{gap:.25rem .9rem;font-size:.68rem}
  .census .r{grid-template-columns:.7rem 6.6rem 1fr auto}
}
@media (prefers-reduced-motion:reduce){
  button:active{transform:none}
  button{transition:none}
}

/* ---------- the site's clothes, worn by an instrument ---------- */
.bar,footer.site-foot,.leaf-mark{
  --serif:"Fraunces",Georgia,serif;
  --sans:"Instrument Sans",-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --paper:#f2efe6;
  --fg:#221e17;
  --dim:#6f6759;
  --line:#d8d2c2;
  --accent:#8a5a24;
  --ease:cubic-bezier(.23,1,.32,1);
}
.bar,footer.site-foot{color:var(--fg)}
footer.site-foot{background:var(--paper)}
.bar .wrap,footer.site-foot .wrap{max-width:calc(64rem + 2 * clamp(.6rem,2vw,1.1rem));
  padding-inline:clamp(.6rem,2vw,1.1rem)}
/* the village is a fixed canvas lying under the whole document, so
   the bar and the footer have to be lifted over it; and the game's
   own overflow rule stops a sticky bar from sticking, so it stands
   still at the top of the page instead of following the scroll */
.bar{position:relative;z-index:3}
footer.site-foot{position:relative;z-index:3}

.wrap{max-width:1180px;margin:0 auto;padding:0 clamp(1.2rem,5vw,3rem)}

/* ---------- top bar ---------- */
.bar{position:sticky;top:0;z-index:30;font-family:var(--sans);background:color-mix(in srgb,var(--paper) 86%,transparent);
  backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.bar .wrap{display:flex;align-items:center;justify-content:space-between;height:58px}
.bar .home{font-family:var(--serif);font-weight:400;font-size:1.05rem;text-decoration:none;letter-spacing:.01em;
  border-bottom:0;color:var(--fg)}
.bar nav{display:flex;gap:clamp(.55rem,1.5vw,1.1rem);align-items:center;flex-wrap:wrap;
  justify-content:flex-end;row-gap:.15rem}
.bar nav a{font-size:.82rem;letter-spacing:.015em;white-space:nowrap;text-decoration:none;color:var(--dim);font-weight:500;
  padding:.3rem 0;border-bottom:1px solid transparent;transition:color .18s var(--ease),border-color .18s var(--ease)}
.bar nav a:hover{color:var(--fg)}
.bar nav a[aria-current]{color:var(--fg);border-bottom-color:var(--accent)}
.langs{display:flex;gap:.1rem;margin-left:.6rem}
.langs button{font-family:var(--mono);font-size:.64rem;letter-spacing:.05em;padding:.3em .45em;
  border:0;background:none;color:var(--dim);cursor:pointer;border-radius:2px}
.langs button:hover{color:var(--fg)}
.langs button[aria-pressed="true"]{color:var(--accent);text-decoration:underline;text-underline-offset:3px}

/* ---------- footer ---------- */
footer{border-top:1px solid var(--line);margin-top:clamp(2rem,6vh,4rem);
  background:none;font-family:var(--sans);line-height:1.6}
footer .foot-links{display:flex;gap:clamp(.9rem,2.4vw,1.6rem);align-items:center;flex-wrap:wrap}
footer .wrap{display:flex;justify-content:space-between;align-items:center;padding-top:1.1rem;padding-bottom:1.4rem;
  font-size:.74rem;color:var(--dim)}
footer a{text-decoration:none;color:var(--dim);border-bottom:0}
footer a:hover{color:var(--fg)}

/* ---------- a leaf, falling once ---------- */
.leaf-mark{position:fixed;top:-30px;pointer-events:none;z-index:5;opacity:.45}
@media (prefers-reduced-motion:reduce){.leaf-mark{display:none}}

/* ---------- the bar and the footer, narrowed ---------- */
@media (max-width:640px){
  /* the bar gives the pages a line of their own instead of crowding them */
  .bar .wrap{flex-wrap:wrap;height:auto;column-gap:.7rem;row-gap:.1rem;
    padding-top:.5rem;padding-bottom:.15rem}
  .bar .home{white-space:nowrap;font-size:1rem}
  .bar nav{order:3;flex:1 0 100%;margin-top:.05rem;flex-wrap:nowrap;
    justify-content:flex-start;gap:clamp(.7rem,3.4vw,1.2rem);
    overflow-x:auto;overscroll-behavior-x:contain;-webkit-overflow-scrolling:touch;
    scrollbar-width:none;
    /* the last name fades rather than being cut, which is what says there
       is more of it to the right */
    -webkit-mask-image:linear-gradient(90deg,#000 calc(100% - 2.2rem),transparent);
    mask-image:linear-gradient(90deg,#000 calc(100% - 2.2rem),transparent);
    padding-right:2.2rem}
  .bar nav::-webkit-scrollbar{display:none}
  .bar nav a{font-size:.8rem;padding:.55rem 0;flex:0 0 auto}
  /* the name of the page you are on is brought into view on load, so a
     reader arriving deep in the site is not looking at a row that starts
     somewhere else */
  .bar nav a[aria-current]{scroll-margin-inline:1.5rem}
  /* the three languages take the right end of the name's own line: a third
     row of bar would eat a fifth of the screen */
  .bar .wrap{position:relative}
  .langs{position:absolute;top:.1rem;right:clamp(1.2rem,5vw,3rem);margin:0;gap:.15rem}
  .langs button{font-size:.7rem;padding:.2em .4em}
  footer .wrap{gap:1rem;flex-wrap:wrap;padding-bottom:calc(1.4rem + env(safe-area-inset-bottom,0px))}
}

/* eight nav names on a narrow phone: the row takes a second and a third
   line rather than push the page sideways, and the words are set tighter
   so that most phones only need two */
@media (max-width:430px){
  .bar nav{gap:.3rem .5rem}
  .bar nav a{font-size:.74rem;letter-spacing:.005em;padding:.42rem 0}
}

/* a finger, not a cursor: every control a thumb has to find is at least a
   thumb wide, in either orientation */
@media (pointer:coarse){
  .bar .home{display:inline-flex;align-items:center;min-height:44px}
  .bar nav a{min-height:44px;min-width:44px;display:inline-flex;align-items:center;
    justify-content:center;padding:.3rem .3rem}
  .langs{gap:.05rem}
  .langs button{min-width:44px;min-height:44px;padding:.3em .35em;
    display:inline-flex;align-items:center;justify-content:center}
  footer .wrap a{min-width:44px;min-height:44px;display:inline-flex;
    align-items:center;justify-content:flex-end}
}

/* the same thumb, on the page itself */
@media (pointer:coarse){
  .cv-btn{min-height:44px;padding:.8rem 1.25rem}
  .copy,.share-link{min-height:44px;min-width:44px;
    display:inline-flex;align-items:center;justify-content:center}
  .socials a{min-height:44px;display:inline-flex;align-items:center}
  .mail-line a.addr{display:inline-flex;align-items:center;min-height:44px}
  .note-read{min-height:44px;min-width:44px;display:inline-flex;align-items:center;justify-content:center}
  .feature .go{min-height:44px;display:inline-flex;align-items:center}
  .gcard .go{min-height:44px;display:inline-flex;align-items:center}
  .go-block{min-height:44px;display:inline-flex;align-items:center}
  .k-btn,.k-skip,.skip{min-height:44px;display:inline-flex;align-items:center}
  input[type=range]{height:44px}
  select{min-height:44px}
  /* a link sitting inside a sentence: the line opens up so the link can be
     a thumb tall without the paragraph closing over it */
  .quiet-line{line-height:2.1}
  .quiet-line a{display:inline-block;padding:.78rem 0;line-height:1.25}
  .note-item h2 a{display:inline-block;padding:.5rem 0;border-bottom:0;
    text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:5px}
  .note-item h2 a:hover{text-decoration-color:var(--accent)}
  /* fields and their kin: 16px so the phone does not zoom, 44 so it can be hit */
  body input[type="text"],body input[type="email"],body input[type="number"],
  body select,body textarea{font-size:16px;min-height:44px}
  body .frow textarea{min-height:8rem}
  /* a 4px tall slider is not a control: the whole strip takes the touch */
  input[type="range"]{height:44px;margin:0;padding:0}
  /* and a sixteen pixel box is not one either */
  input[type="checkbox"],input[type="radio"]{width:22px;height:22px}
  input[type="checkbox"]+label,input[type="radio"]+label{
    display:inline-flex;align-items:center;min-height:44px}
  .demo-src a{display:inline-flex;align-items:center;min-height:44px}
}

/* ---------- the crown, on a page whose interior is its own ---------- */
.k-crown-no{
  display:flex;align-items:center;gap:.55rem;margin-bottom:.85rem;
  font-family:"Fraunces",Georgia,serif;font-style:italic;font-size:1rem;
  color:var(--accent);
}
.k-crown-no svg{flex:none}
.k-lede h1{margin-top:0}


</style>

(function () {

}
function clamp(v, a, b) { return v < a ? a : v > b ? b : v; }
function lerp(a, b, u) { return a + (b - a) * u; }
function smooth(u) { u = clamp(u, 0, 1); return u * u * (3 - 2 * u); }
function rgb(c, a) { return "rgba(" + (c[0] | 0) + "," + (c[1] | 0) + "," + (c[2] | 0) + "," + (a == null ? 1 : a) + ")"; }
function mix(a, b, u) { return [lerp(a[0], b[0], u), lerp(a[1], b[1], u), lerp(a[2], b[2], u)]; }

/* a small deterministic generator, so that the same winter can be
   handed to two different neighbours and be the same winter */
function mulberry(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    var t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

/* ============================================================
   1. the game itself
   Four numbers and five dispositions. Everything below this
   comment is ordinary game theory and nothing else.
   ============================================================ */

/* baskets of grain. T beats R beats P beats S, and two rewards beat
   one temptation plus one sucker, which is what makes it a dilemma */
var PAY = { T: 5, R: 3, P: 1, S: 0 };

function payoff(mine, theirs, p) {
  p = p || PAY;
  if (mine === "C") return theirs === "C" ? p.R : p.S;
  return theirs === "C" ? p.T : p.P;
}

/* Is this still a dilemma at these numbers */
function dilemmaCheck(p) {
  var order = p.T > p.R && p.R > p.P && p.P > p.S;
  var pair = 2 * p.R > p.T + p.S;
  return { order: order, pair: pair, ok: order && pair };
}

/* Each disposition sees only what arrived, never what was meant.
   opp  : the moves the other side was seen to make, oldest first
   own  : this side's own moves, oldest first

/* ---- the page's own three languages ---- */
window.PAGE_I18N = {"tr": {"pg-desc": "Oyun teorisi üzerine küçük bir oyun. Her mevsim bir komşu çite geliyor ve sen hasadı paylaşmayı ya da kendine saklamayı seçiyorsun. Beş bölüm, yinelenen mahkûm ikilemini anlatarak değil oynatarak öğretiyor.", "lg-h1": "Uzun Oyun", "lg-skip": "Seçimlere atla", "lg-restart": "Baştan başla", "lg-nb-btn": "Defter", "lg-name": "Uzun Oyun", "lg-when-title": "bir köy, bir çit ve her mevsim bir karar", "lg-when-arg": "savın kendisi, açıkça", "lg-when-begins": "{s}, yıl başlıyor", "lg-when-winter": "zorlu kış, {b} mevsimden {a}.", "lg-when-season": "{s}, {b} mevsimden {a}.", "lg-when-over-w": "zorlu kış, mevsim {a} / {b}", "lg-when-over-s": "{s} bitti, mevsim {a} / {b}", "lg-when-closes": "bölüm kapanıyor", "lg-when-quiz": "on iki mevsim bitti", "lg-when-mid": "ilk kış bitti", "lg-when-years": "{b} yıldan {a}. yıl", "lg-when-free": "kendi sayıların, kendi komşun", "lg-when-freeseason": "{s}, mevsim {n}", "lg-ch": "Bölüm {n}. {t}", "lg-ch1": "İlk komşu", "lg-ch2": "Köy", "lg-ch3": "Zorlu kış", "lg-ch4": "Hakkında söyledikleri", "lg-ch5": "Yıllar", "lg-sea-0": "İlkbahar", "lg-sea-1": "Yaz", "lg-sea-2": "Sonbahar", "lg-sea-3": "Kış", "lg-t-p1": "Hasat kaldırıldı. Bir haneye yetenden çok, iki hanenin istediğinden az. Her mevsimin sonunda bir komşu çite geliyor ve çuvalının çitin üzerinden mi aşacağına yoksa basamağında mı kalacağına sen karar veriyorsun. O da aynı anda senin hakkında aynı karara varıyor ve ikiniz de önce konuşmuyorsunuz.", "lg-t-p2": "Beş bölüm. Hiçbir şey, sen oynamadan önce açıklanmıyor.", "lg-b-resume": "{n}. bölümden devam et", "lg-b-begin": "İlk mevsimden başla", "lg-b-free": "Serbest oyun", "lg-t-note": "Her şey bu sayfanın içinde oluyor. Burada yaptığın hiçbir şey bir yere gönderilmiyor. İlerlemen bu tarayıcıda tutuluyor, başka hiçbir yerde değil.", "lg-s-title": "Uzun Oyun. Bir hasadı bir komşuyla mevsim mevsim paylaşmak üzerine bir oyun.", "lg-i1-kick": "Birinci bölüm", "lg-i1-b1": "Mira çitin öbür yanındaki şeridi işliyor. Önümüzdeki altı mevsimin her birinin sonunda gelecek.", "lg-i1-b2": "Her mevsim bir kez seçiyorsun. Hasadı paylaşırsan çuval çitin üzerinden aşıyor. Tutarsan basamağında kalıyor. O da aynı anda seçiyor ve onun ne seçtiğini ancak kendi seçimine bağlandıktan sonra öğreniyorsun.", "lg-i1-b3": "Kimse sana doğru cevabı söylemeyecek. Altı mevsimi oyna ve ne çıkardığına bak.", "lg-i2-kick": "İkinci bölüm", "lg-i2-b1": "Haber yayılıyor. Artık çite sırayla dört hane geliyor: Deniz, Bruno, Halil ve Ana. Her birinin bu işi bir yapma biçimi var ve hiçbiri ne olduğunu söylemeyecek.", "lg-i2-b2": "Her biriyle üçer kez, sırayla karşılaşacaksın. Deniz'e ne yaptığını Bruno bilmiyor ve her biri yalnızca ona ne yaptığına cevap veriyor.", "lg-i2-b3": "Köşede bir defter var. Her birinin ne yaptığını yazıyor. Kullan; çünkü bölümün sonunda kimin kim olduğu sana sorulacak.", "lg-i3-kick": "Üçüncü bölüm", "lg-i3-b1": "İki şerit arasındaki kış yolu bir dere yatağı boyunca gidiyor ve bu yıl yatak azgın. Öbür tarafa gönderilen çuval her zaman yerine varmıyor. Tahıl çıktığı ambarda kalıyor; yani yol, sana sormadan seni tutan biri yapıyor ve çitin karşısındaki hane yalnızca hiçbir şeyin gelmediğini görüyor.", "lg-i3-b2": "Çitin karşısında yine Halil var, bunun sekiz mevsimi boyunca. Geçen bölümdeki adamın aynısı ve tam olarak daha önce yaptığını yapacak.", "lg-i3-b3": "Kaybolan bir çuvalın bir mevsime, sonra da ondan sonraki mevsime ne yaptığını izle.", "lg-i4-kick": "Dördüncü bölüm", "lg-i4-b1": "Köyün kıyısındaki boş şeritleri üç hane aldı. Hiçbiri seninle tanışmadı. Hepsi seni duydu.", "lg-i4-b2": "Çitin yanındaki direkte bir fener var. Köyün senin hakkında inandığı şey o ve bir skor tabelası değil: alevi yükseltmek çok mevsim paylaşmak istiyor, düşürmekse tek bir tutulan çuval.", "lg-i4-b3": "Önce Tomas geliyor, sonra Leyla, sonra Emre. Her biri duyduklarıyla açılıyor, sonra gerçekte ne yaptığına cevap veriyor.", "lg-i5-kick": "Beşinci bölüm", "lg-i5-b1": "Çuvalı bırak. Bu bölüm oynanmıyor, izleniyor.", "lg-i5-b2": "Otuz hane, hasada dair beş yapma biçimi ve kırk yıl. Her yıl her hane, diğer her haneyle uzun bir mevsim dizisi boyunca iş görüyor ve kendini en iyi doyuran hanelerin, doyuramayanlardan daha çok çocuğu oluyor. Köy hiçbir şey seçmiyor. Yalnızca yiyor.", "lg-i5-b3": "Yamacın hangi şeridinin büyüdüğünü, hangisinin boşaldığını izle.", "lg-go-first": "İlk mevsim", "lg-go-winter": "İlk kış mevsimi", "lg-go-tomas": "Tomas'la tanış", "lg-go-year": "İlk yıl", "lg-a-kick-w": "Kış, {b} mevsimden {a}.", "lg-a-kick-s": "{s} {a} / {b}", "lg-a-h": "{n} çitte", "lg-a-gully": "Dere yatağı akıyor. Öbür tarafa gönderilen bir çuval her zaman yerine varmıyor ve tahıl başladığı yerde kalıyor. Çitin öte yanından bu, tıpatıp bir karar gibi görünüyor.", "lg-a-first4": "{n} seninle daha önce karşılaşmadı. {n} bu ilk mevsimde ne yapıyorsa köyün senin hakkında söylediklerinden yapıyor. Dere yatağı kışı buna sayılmıyor; çünkü o yıl her hanenin yolu aynıydı ve bunu herkes biliyor.", "lg-a-sack": "Çuvalın basamakta. {n} tarafında da bir tane var. Bir kez seç, sonra başını kaldır.", "lg-b-share": "Hasadı paylaş", "lg-b-keep": "Hasadı tut", "lg-cellar": "Kilerin", "lg-others": "Diğerleri", "lg-s-ask": "{s}, {b} mevsimden {a}. {n} çitte. Hasadı paylaş ya da hasadı tut. {y} sepetin var.", "lg-r-kick": "Mevsim kapanıyor", "lg-r-accident": "İkiniz de bir kazayı bir karardan ayıramazsınız. Eline yalnızca gelen geçer.", "lg-r-lantern": "Direkteki fener {w}.", "lg-rep-well": "harıl harıl yanıyor", "lg-rep-low": "kısık ama düzenli", "lg-rep-nearly": "sönmek üzere", "lg-rep-out": "sönmüş", "lg-b-winterend": "Kış bitiyor", "lg-b-chend": "Bölüm bitiyor", "lg-b-nextseason": "Sonraki mevsim", "lg-s-result": "{o} {r} Şu an {y} sepetin var.", "lg-bask1": "{n} sepet", "lg-baskN": "{n} sepet", "lg-o-tail": " Sana {yb}, ona {t}.", "lg-o-both": "Yol iki çuvalı da aldı.{tail}", "lg-o-you": "Yol, sana sormadan seni tutan biri yaptı.{tail}", "lg-o-them": "Karşıdan bir şey gelmedi ve buna kimse karar vermedi.{tail}", "lg-o-cc": "İki kiler de doluyor.{tail}", "lg-o-dc": "Mevsimden en iyi sen çıktın.{tail}", "lg-o-cd": "Mevsimden en kötü sen çıktın.{tail}", "lg-o-dd": "İki kiler de dolmuyor.{tail}", "lg-rw-youlost": "Çuvalın karşıya hiç varamadı. Hâlâ ambarında ve ambarın istediğinden daha dolu.", "lg-rw-yougave": "Çuvalını çitin üzerinden aşırdın.", "lg-rw-youkept": "Çuvalını kendi basamağında tuttun.", "lg-rw-themlost": "Öbür yönden bir çuval gelecekti ve hiç varmadı.", "lg-rw-themgave": "{n} aynı anda karşıya bir çuval uzattı.", "lg-rw-themkept": "{n} çuvalı karşı basamakta tuttu.", "lg-pt-cap": "Her seçim çifti için sana ve ona düşen sepetler", "lg-pt-theyshare": "o paylaşırsa", "lg-pt-theykeep": "o tutarsa", "lg-pt-youshare": "sen paylaşırsan", "lg-pt-youkeep": "sen tutarsan", "lg-pt-toyou": " sana", "lg-pt-tothem": "{n} ona", "lg-q-kick": "Cevaplardan önce", "lg-q-h": "Kim kimdir söyle", "lg-q-p1": "Her biriyle üç kez karşılaştın ve defter kaydı tuttu. Aşağıda hasada dair dört yapma biçimi var. Her ismin karşısına birini koy. Doğru bilmene bağlı hiçbir şey yok; cevaplar her hâlükârda birazdan geliyor.", "lg-q-choose": "seç", "lg-b-check": "Defteri onlarla karşılaştır", "lg-b-skipq": "Atla ve cevapları gör", "lg-s-quiz": "Kim kimdir söyle. Her komşu için bir açılır liste.", "lg-m-kick": "Dere yatağının yaptığı", "lg-m-h": "Kimsenin seçmediği bir kan davası", "lg-m-p1": "Halil tam olarak eline ulaşana cevap verir. Başka türlüsünü yapamaz; çünkü onun için hiç gelmemiş bir çuvalla hiç gönderilmemiş bir çuval aynı şeydir. Böylece kötü bir yol parçası tutulan bir mevsime dönüşür, tutulan mevsim bir cevaba, cevap da başka bir cevaba.", "lg-m-p2": "Sekiz mevsim; sana {y}, Halil'e {t} sepet. {lost}Halil sekizin {p} tanesinde tutmayı kendisi istedi ve bunların her biri, zaten olmuş bir şeye cevaptı.", "lg-m-lost1": "Yol, göndermek istediğin çuvallardan {n} tanesini alıkoydu. ", "lg-m-lost0": "Yol, göndermek istediğin hiçbir şeyi alıkoymadı. ", "lg-m-p3": "Ona aynı biçimde cevap verirsen daha da kötü. Çitin iki yanına, ikisi de tam olarak Halil'in yaptığını yapan iki hane koy ve onları aynı kayıplarla aynı yollardan bu aynı kışa gönder. Sadece paylaşarak alacakları {r8} yerine {a} ve {b} sepetle bitiriyorlar; sekiz mevsimin {f} tanesini iki kiler de kapalı geçiriyor, {alt} tanesinde de sırayla birbirlerini soyuyorlar, önce bir yönde sonra öbüründe. Kaza sönmüyor. Mevsimler sürdükçe aralarında gidip geliyor.", "lg-m-p4": "Tek bir boş mevsimi geçiveren iki hane aynı kıştan aralarında {fb} sepetle çıkıyor. İki ayna {mb} yapabildi. Sekiz paylaşılan mevsim {r16} ederdi.", "lg-m-p5": "Şimdi aynı kış yeniden. Aynı dere yatağı, aynı mevsimlerde aynı kayıplar. Halil yokken şeridi Ana alıyor ve Ana, Halil değil.", "lg-b-withana": "Aynı kış, Ana ile", "lg-s-mid": "İlk kış bitti. Sana {y}, Halil'e {t} sepet.", "lg-b-ch-n": "Bölüm {n}. {t}", "lg-b-endof": "Sonu", "lg-roll-known": "defterlerde bilinen adıyla {f}", "lg-roll-right": ". Doğru bildin.", "lg-roll-as": ". Sen {g} demiştin.", "lg-roll-un": "cevapsız", "lg-e1-kick": "Birinci bölüm kapanıyor", "lg-e1-h": "Üzerinde oynadığın masa", "lg-e1-p1": "Altı mevsim; kilerinde {y}, Mira'nınkinde {t} sepet. İşte o mevsimlerin her birinin arkasındaki dört sayı. Senden, bulamayacağın anlamda saklanmadılar. Yalnızca hiç yazılmadılar.", "lg-e1-p2": "Üst satırı alt satıra karşı oku. Mira ne yaparsa yapsın tutmak senin için daha iyi: o paylaşırken beş üçü geçer, o tutarken bir hiçi geçer. Senin sütununa bakınca aynısı onun için de doğru. Böylece ikisi de akıllıca olanı yapan iki insan, sol üst köşede üçer sepet öylece dururken, sağ alt köşede birer sepetle bitirir.", "lg-e1-p3": "Bu biçimin bir adı var. Mahkûm ikilemi; ve akıllıca olanı yapmanın herkesi daha kötü duruma düşürdüğü en küçük durum. Bir kez oynandığında tartışılacak bir şey yok. Tutmak düpedüz daha iyi.", "lg-e1-h2": "Mira ne yapıyordu", "lg-e1-p4": "İlk mevsimde paylaştı. Ondan sonra, bir önceki mevsimde sen ona ne yaptıysan sana tam olarak onu yaptı. Hepsi bu. Adı kısasa kısas ve bu konuyu ünlü yapan turnuvalara girmiş en kısa programdı.", "lg-e1-p5": "Kısasa kısasın neyi yapamadığını söylemekte yarar var. Çitin karşısındakini asla yenmez. Yenemez: yalnızca kendisine verileni geri verir; en iyi ihtimalle seninle berabere kalır, en kötü ihtimalle ikinci gelir. Yaptığı şey, paylaşmayı senin için yapmaya değer kılmaktır ve bunu yalnızca mevsimler gelmeye devam ettiği için yapabilir. Hangi mevsimin son olduğunu bilseydin onda tutardın. Bunu bilerek, ondan öncekinde de tutardın. O çözülme, son mevsimin asla ilan edilmemesinin bütün sebebidir.", "lg-e1-t1": "Altı mevsimin ", "lg-e1-t1b": " sepet", "lg-e1-t2": "Mira ", "lg-e1-t2b": " sepet", "lg-e1-t3": "Her mevsim ikiniz de paylaşsaydınız her birinize ", "lg-e1-t3b": " düşerdi", "lg-s-e1": "Birinci bölüm kapanıyor. Kazanç tablosu artık görünür. Mira kısasa kısas oynuyordu.", "lg-e2-kick": "İkinci bölüm kapanıyor", "lg-e2-h": "Hasada dair dört yapma biçimi", "lg-e2-p1": "On iki mevsim ve {y} sepet. Çitin karşısında kimler vardı, işte.", "lg-e2-placed": "Dördün {n} tanesini doğru yerleştirdin.", "lg-e2-p2": "Dördüne birden karşı doğru olan bir hamle yok. Sen ne yaparsan yap paylaşan Deniz'e karşı tutmak düpedüz daha iyidir ve sana hiçbir zaman faturası kesilmeyecek bir şeye mal olur. Sen ne yaparsan yap tutan Bruno'ya karşı paylaşmak düpedüz daha kötüdür ve onu düzeltecek sabır yoktur. Halil ve Ana'ya karşı yaptığın sana geri gelir; yani paylaşmak kazandırır, tutmaksa henüz varmadığın bir mevsimden borç alınmıştır.", "lg-e2-p3": "Bölümün amacı bu. En iyi oynama biçimi yok. Yalnızca gerçekten orada duran kişiye karşı en iyi oynama biçimi var ve onun kim olduğunu bilmenin tek yolu, onu izlemiş olmak. Defter, yöntemin ta kendisiydi.", "lg-e2-p4": "Öğrenmenin sana neye mal olduğunu da fark etmekte yarar var. Tutarak sınadığın her komşuya, kendin hakkında da bir şey öğrettin.", "lg-s-e2": "İkinci bölüm kapanıyor. Deniz hep paylaşır, Bruno hep tutar, Halil seni yansıtır, Ana bir tutulan mevsimi geçer.", "lg-e3-kick": "Üçüncü bölüm kapanıyor", "lg-e3-h": "Hata düzeltme olarak bağışlama", "lg-e3-p1": "Aynı sekiz mevsim, aynı dere yatağı, aynı yollarda kaybolan aynı çuvallar. Halil'le {a} sepette bitirdin. Ana'yla {b} sepette.", "lg-e3-p2": "Halil eline ulaşana cevap verir. Hiçbir şey ulaşmadığında, sonraki mevsim tutar. Karşısındaki hane de aynı biçimde cevap veriyorsa o tutulan mevsim de cevaplanır, cevap da cevaplanır ve tek bir kaza, bitmeyen bir kaza dizisine dönüşür; çünkü bitirmek, tutulan bir mevsime paylaşıp karşılığında hiçbir şey almamak demektir.", "lg-e3-p3": "Ana yalnızca bir örüntüye cevap verir. Bir boş mevsim bir mevsimdir, bir mesaj değil. Üst üste iki tanesi bir mesajdır. Böylece bir kaza ondan iz bırakmadan geçer ve ikiniz, hiçbiriniz barışmaya karar vermiş olmadan paylaşmaya geri dönersiniz.", "lg-e3-p4": "Bu, daha iyi kalpli olmanın daha iyi olduğu iddiası değil. Ana soyulabilir: sonsuza kadar her ikinci mevsimde tutan biri ondan sonsuza kadar alır ve o paylaşmaya devam eder. Bölümün gösterdiği daha dar ve daha kullanışlı. Gördüğün şey karşındakinin yaptığının tam kendisi değilken, tek bir gözleme cevap veren bir kural gürültüye niyetmiş gibi cevap verir. Kuralda biraz pay bırakmak yumuşaklık değildir. Bir kuralın, net göremediği bir dünyada hayatta kalma biçimidir.", "lg-s-e3": "Üçüncü bölüm kapanıyor. Halil'le {a} sepette bitirdin, Ana'yla {b} sepette.", "lg-e4-kick": "Dördüncü bölüm kapanıyor", "lg-e4-h": "Bir geçmiş bir stratejidir", "lg-e4-p1": "Seninle hiç tanışmamış üç insanla dokuz mevsim ve {y} sepet. Direkteki fener {f} bitirdi.", "lg-f-burning": "yanarak", "lg-f-low": "kısık", "lg-f-nearly": "sönmek üzere", "lg-f-out": "sönmüş", "lg-e4-p2": "Üçü de kafanın içini göremezdi. Görebildikleri, konuşmakta olan bir köydü. Tomas onunla açıldı, Leyla da, Emre de; ve ilk mevsimden sonra her biri yalnızca gerçekte yaptığına cevap verdi.", "lg-e4-p3": "Fener, bir itibarın hareket ettiği gibi hareket etsin diye kuruldu. Paylaşmak onu birazcık yükseltir ve dolması çok mevsim ister. Tek bir tutulan çuval bir anda beşte birini götürür. Bu bakışımsızlık ahlaki bir yargı değil, kanıt üzerine aritmetiktir: yüz cömert mevsim, ucuzken cömert olan biriyle tutarlıdır; oysa tek bir alınmış çuval yalnızca alan biriyle tutarlıdır.", "lg-e4-p4": "İşe yarayan kısım şu. İnsanların konuştuğu kadar küçük bir köyde geçmişin, oyununun bir kaydı değildir. Oyununun bir parçasıdır. Daha ikiniz de hiçbir şey yapmamışken, bir sonraki yabancının neyle açılacağına o karar verir.", "lg-e4-p5": "Ne kadar ileri götürdüğüne dikkat et. Bu bölümde köy senin hakkında her zaman doğruyu söyledi ve her zaman kendisiyle aynı fikirdeydi. Gerçek itibarlar eksiklidir, bayattır ve farklı insanlar için farklı değerdedir; bunların hiçbiri burada modellenmedi.", "lg-s-e4": "Dördüncü bölüm kapanıyor. {y} sepetle bitirdin ve fener {f}.", "lg-y-h0": "Otuz hane", "lg-y-hnone": "Ne olursa olsun tutan kimse kalmadı", "lg-y-hwell": "Tutanların işi çok iyi gidiyor", "lg-y-hrun": "Tutanların alacağı insan tükeniyor", "lg-y-hfeed": "Köy kendini doyuruyor", "lg-y-p0": "On beş hane ne olursa olsun paylaşıyor. Altısı ne olursa olsun tutuyor. Dördü yansıtıyor, üçü tutulan bir çuvalı asla unutmuyor ve ikisi tek bir tanesini geçiyor. Her hane her yıl, diğer her haneyle yaklaşık otuz mevsim iş görüyor.", "lg-y-p1": "Geçen yıl kendini daha iyi doyuran haneler bu yıl köyün daha büyük kısmını tutuyor. Kimse yapma biçimini değiştirmedi. Oranlar altlarında değişti.", "lg-b-oneyear": "Bir yıl", "lg-b-run": "Yılları akıt", "lg-b-hold": "Yılları durdur", "lg-b-what": "Ne oldu", "lg-b-skip40": "Kırkıncı yıla atla", "lg-cofn": "{c} / {n}", "lg-s-years": "Yıl {y}. Otuz haneden {list}.", "lg-e5-kick": "Beşinci bölüm kapanıyor", "lg-e5-h": "Hayatta kalan, bir sonraki mevsimi kazanan değildir", "lg-e5-p1": "Ne olursa olsun tutan haneler köyün beşte biri olarak başladı. {py}. yıla geldiklerinde her yüz haneden {pk} tanesiydiler; çünkü ne olursa olsun paylaşan insanlarla dolu bir köy, dünyada tutan biri olmak için en kolay yerdir.", "lg-e5-p2": "Ve onları bitiren tam olarak bu oldu. Aldıkları her yıl, alacak daha az hane kaldı. Koşulsuz paylaşanlar önce gitti; onlar gidince tutanlar çoğunlukla birbirleriyle ve karşılık veren hanelerle iş görür oldu ve tutanla iş gören bir tutan, mevsim başına bir sepet alır. {ly}. yıla gelindiğinde her yüzden {lk} taneydiler.", "lg-e5-p3": "Ne olursa olsun paylaşan haneler de izlemeye değer. Tutanlar yerken her yüzde {gm} taneye düşüyorlar; sonra tutanlar gidince hiçbir şey için cezalandırılmaz oluyor ve {g} seviyesinde tutunuyorlar. İyi durumdalar ama iyi oldukları için değil. İyi durumdalar çünkü artık onlardan alacak kimse yok; ve orada olmaları, bir tutanın geri döneceği çatlağın ta kendisi.", "lg-e5-p4": "Bu köyde hiçbir şey seçim yapmıyordu. Kimse öğrenmedi, kimse fikrini değiştirmedi, kimse hiçbir şey için cezalandırılmadı. Kendini iyi doyuran hanelerin daha çok çocuğu oldu ve tek başına bu, herkesin altındaki zemini oynattı.", "lg-e5-p5": "Götürülmeye değer şey iki soru arasındaki fark. Bu mevsimi hangi hamle kazanır bir soru ve onu her seferinde tutmak kazanır. Hasada dair hangi yapma biçimi kırk yıl sonra hâlâ burada, o başka bir soru ve cevabı başka.", "lg-e5-p6": "Sayıları dar oku. Bu sonuç bu köy hakkında bir olgu: bu beş yapma biçimi, bu başlangıç oranları, bu dört kazanç ve eşleşme başına yaklaşık otuz mevsim. Karışımı değiştir, sonucu değiştirirsin. Köye hiç yansıtan ve hiç kin tutan koyma, tutanlar hiç düşmez. Mevsimleri her eşleşme iki kez görüşecek kadar kısalt, tutanlar açık farkla kazanır. Burada işbirliği kazanır diye bir yasa yok. Yalnızca bir mekanizma var ve mekanizmaların koşulları olur.", "lg-en-h1": "Beş bölüm ne içindi", "lg-en-p1": "İki insanın her biri alarak daha iyi edebilir ve ikisi de aldığında ikisi de daha kötü eder. Tuzağın tamamı bu ve kimsenin karakterinde değil, sayıların içinde. Bir kez oynandığında almak düpedüz doğrudur ve hakkında söylenecek başka bir şey yoktur.", "lg-en-p2": "Cevabı değiştiren her şey aynı kaynaktan geliyor: mevsimler gelmeye devam ediyor ve hangisinin son olduğunu iki taraf da bilmiyor. Şimdi yaptığını, sonra başına gelen bir şey hâline getiren bu. İyi niyet değil, güven değil. İçinde gelecek olan aritmetik.", "lg-en-p3": "Bundan dört şey çıktı ve her biri bir bölümdü.", "lg-en-l1": "Aynıyla cevap vermek kadar kısa bir kural, paylaşmayı senin için değerli kılmaya yeter; ve çitin karşısındakini bir kez olsun yenmez. Yalnızca onun çıkarına olanı değiştirir.", "lg-en-l2": "En iyi oynama biçimi yok. Gerçekten orada duran haneye karşı en iyi oynama biçimi var; izlemenin yöntem, defterin araç olmasının sebebi bu.", "lg-en-l3": "Eline ulaşan her zaman gönderilen değilken, her tek gözleme cevap veren bir kural bir kazaya karar muamelesi yapar. Kuraldaki pay, hata düzeltmedir.", "lg-en-l4": "Konuşacak kadar küçük bir köyde geçmişin, bir yabancının neyle açılacağına karar verir. Daha hiçbir şey oynamadan oyununun parçasıdır.", "lg-en-h2": "Bunun göstermediği", "lg-en-m1": "İşbirliği her zaman kazanmaz. Neyin hayatta kaldığı, nüfustaki yapma biçimlerinin karışımına ve mevsimlerin sürme olasılığına bağlıdır. İçinde karşılık veren kimsenin olmadığı bir köy, almanın kazandığı ve kazanmaya devam ettiği bir köydür.", "lg-en-m2": "Bilinen bir son mevsim her şeyi çözer. Hanginizin son mevsim olduğunu ikiniz de biliyorsanız onda almak doğrudur, dolayısıyla ondan öncekinde de, ta ilk mevsime kadar.", "lg-en-m3": "Ünlü turnuva sonuçları, yarışmaya giren programlar hakkında olgulardır, yasa değil. En büyük yeniden çözümlemenin yazarları, kısasa kısasın bu kadar iyi gitmesinin kısmen, birlikte havuzlandığı zayıf girdilerden olduğunu savunuyor.", "lg-en-m4": "Buradaki her şey, sepetler için soyut bir oyun oynayan programlar. Gerçek ikilemlerdeki insanlar bu modelin içermediği şeyler yapar ve bu sayfadaki hiçbir şey herhangi bir insanın ne yapacağına dair kanıt değildir.", "lg-en-m5": "Dördüncü bölümdeki itibar bir hikâye aracı. Köy senin hakkında her zaman doğruyu söylüyor ve her zaman kendisiyle aynı fikirde; itibarlar böyle çalışmaz.", "lg-en-h3": "Aynı sav, yazıya dökülmüş", "lg-en-essay1": "Bunun kazançları düzenlenebilir, tam bir turnuva, evrimsel bir koşu ve adıyla tarihiyle her kaynağın verildiği daha uzun bir hâli var: ", "lg-en-essay-a": "İşbirliğinin evrimi", "lg-en-essay2": ", bu sitedeki Explorable Economics'in parçası. Hissetmek yerine aritmetiği denetlemek istiyorsan onu oku.", "lg-en-h5": "Bunlar nereden geliyor", "lg-src1": "Turnuva.", "lg-src2": "Kazananların çoğaldığı ekolojik koşu.", "lg-src-tail": "25 Ağustos 2026'da okundu.", "lg-en-h4": "Diğer oyunlar", "lg-en-fam1": "Bu bir ailenin üyesi. Aynı çit, oyun teorisinin dört sayıyla yazabildiği durumlardan yalnızca biri: tehlikenin açgözlülük değil şüphe olduğu bir av var, kötü muamele görmektense hiçliği yeğleyen bir yabancı, kullanılmaktan ölen bir mera, herkesin herkes hakkında tahmin ettiği bir sayı ve kimsenin öngörülebilir olmayı göze alamadığı bir yazı tura. Hepsi burada: ", "lg-en-fam-a": "oyunlar", "lg-b-freeplay": "Serbest oyun", "lg-b-again1": "İlk mevsimden yeniden oyna", "lg-s-end": "Son. Sav açıkça söylendi; göstermedikleriyle ve yazılı denemenin bağlantısıyla birlikte.", "lg-fs-kick": "Serbest oyun", "lg-fs-h": "Köyü kendin kur", "lg-fs-p1": "Dört sayı, çuvalın yolda kaybolma olasılığı, mevsimlerin sürme olasılığı ve çitin karşısındaki kişi. Hiçbir şey saklı değil ve sayıların ikilem olmaktan çıktığında oyun sana söyleyecek.", "lg-fs-T": "sen tutarsın, o paylaşır", "lg-fs-R": "ikiniz de paylaşırsınız", "lg-fs-P": "ikiniz de tutarsınız", "lg-fs-S": "sen paylaşırsın, o tutar", "lg-fs-n": "kaybolan çuval, yüzde", "lg-fs-w": "mevsimlerin sürmesi, yüzde", "lg-fs-d": "çitin karşısında", "lg-fs-ok": "Bu dört sayı bir ikilem. Karşıdaki ne yaparsa yapsın tutmak paylaşmayı geçiyor ve ikinizin de paylaşması sırayla birbirinizi soymanızı geçiyor.", "lg-fs-no": "Bu artık bir mahkûm ikilemi değil. {m} Yine oynanabilir ve yine bir oyun, ama başka bir oyun.", "lg-fs-no1": "Karşı taraf ne yaparsa yapsın tutmak artık paylaşmayı geçmiyor, yani tuzağa düşürecek bir şey yok.", "lg-fs-no2": "İki paylaşılan mevsim artık sırayla birbirini soymaktan daha az ediyor; yani bir çift, paylaşmak yerine nöbetleşe alarak daha iyi eder.", "lg-b-tofence": "Çite git", "lg-b-backend": "Sona dön", "lg-s-fs": "Serbest oyun. Dört kazancı, çuvalın kaybolma olasılığını, mevsimlerin sürme olasılığını ve çitin karşısındakini ayarla.", "lg-fp-closed": "Mevsim {n} kapandı", "lg-fp-s1": "Birinci mevsim", "lg-fp-p1": "Komşu çitte. Sayıları kendin kurdun ve orada kimin durduğunu biliyorsun.", "lg-fp-over1": "Mevsimler durdu. Kimse ilan etmedi ve kimse buna göre plan yapmadı; bütün koşunun dürüstçe oynamaya değmesinin tek sebebi de buydu.", "lg-fp-over2": "{s} mevsimde {y} sepetle bitirdin, komşu {t} ile. Her mevsim ikinizin de paylaşması her birinize {r} verirdi.", "lg-b-setup": "Yeniden kur", "lg-b-change": "Sayıları değiştir", "lg-s-fpover": "Mevsimler {s} mevsimden sonra durdu. {y} sepetle bitirdin.", "lg-fp-note": "Çitin karşısında: {n}; defterlerde bilinen adıyla {f}. {t} Yolda kaybolan çuval: yüzde {no}. Mevsimler yüzde {w} olasılıkla sürüyor.", "lg-nb": "Komşu", "lg-thenb": "Komşu", "lg-s-fp": "{s}, mevsim {n}. Hasadı paylaş ya da hasadı tut. {y} sepetin var.", "lg-nb-empty": "Henüz bir şey yazılmadı.", "lg-nb-cap": "Her komşunun ne yaptığı, en eski mevsim önce", "lg-nb-h1": "Komşu", "lg-nb-h2": "Ne yaptı", "lg-nb-h3": "Paylaştı", "lg-nb-h4": "Senin sepetlerin", "lg-nb-shared": "paylaştı", "lg-nb-kept": "tuttu", "lg-nb-hint": "Dolu daire paylaştığı bir mevsim. Boş daire tuttuğu bir mevsim.", "lg-d-giver-n": "Hep paylaşır", "lg-d-taker-n": "Hep tutar", "lg-d-mirror-n": "Seni yansıtır", "lg-d-grudge-n": "Hiç unutmaz", "lg-d-forgiver-n": "Bir keresini geçer", "lg-d-pavlov-n": "İşe yaradıysa kalır", "lg-d-giver-t": "Ona ne yapılırsa yapılsın her mevsim paylaşır.", "lg-d-taker-t": "Onun için ne yapılırsa yapılsın her mevsim tutar.", "lg-d-mirror-t": "İlk mevsimde paylaşır, sonra geçen mevsim ne yaptıysan onu yapar.", "lg-d-grudge-t": "Sen bir kez tutana kadar paylaşır. Ondan sonra sonsuza kadar tutar.", "lg-d-forgiver-t": "Son iki mevsimin ikisinde de tutmadıysan paylaşır.", "lg-d-pavlov-t": "Önce paylaşır. Sonra son hamlesi onu iyi doyurduysa tekrarlar, doyurmadıysa değiştirir.", "lg-k-return": "enter", "lg-k-start": "başla", "lg-k-begin": "başla", "lg-k-go": "devam", "lg-k-again": "tekrar", "lg-k-s": "s tuşu", "lg-k-k": "k tuşu", "lg-k-answer": "cevapla", "lg-k-step": "adım", "lg-k-run": "akıt", "lg-k-own": "kendin kur", "lg-tally-bask": " sepet", "lg-en-kick": "Sonu", "pg-title": "Uzun Oyun"}, "de": {"pg-desc": "Ein kleines Spiel über Spieltheorie. Jede Jahreszeit kommt eine Nachbarin an den Zaun, und Sie entscheiden, ob Sie die Ernte teilen oder behalten. Fünf Kapitel lehren das wiederholte Gefangenendilemma, indem es gespielt und nicht erklärt wird.", "lg-h1": "Das lange Spiel", "lg-skip": "Zu den Entscheidungen springen", "lg-restart": "Von vorn beginnen", "lg-nb-btn": "Notizbuch", "lg-name": "Das lange Spiel", "lg-when-title": "ein Dorf, ein Zaun und jede Saison eine Entscheidung", "lg-when-arg": "das Argument, schlicht gesagt", "lg-when-begins": "{s}, das Jahr beginnt", "lg-when-winter": "der harte Winter, Saison {a} von {b}", "lg-when-season": "{s}, Saison {a} von {b}", "lg-when-over-w": "der harte Winter, Saison {a} von {b}", "lg-when-over-s": "{s} ist vorbei, Saison {a} von {b}", "lg-when-closes": "das Kapitel schließt", "lg-when-quiz": "zwölf Saisons vorbei", "lg-when-mid": "der erste Winter ist vorbei", "lg-when-years": "Jahr {a} von {b}", "lg-when-free": "Ihre Zahlen, Ihr Nachbar", "lg-when-freeseason": "{s}, Saison {n}", "lg-ch": "Kapitel {n}. {t}", "lg-ch1": "Der erste Nachbar", "lg-ch2": "Das Dorf", "lg-ch3": "Der harte Winter", "lg-ch4": "Was man über Sie sagt", "lg-ch5": "Die Jahre", "lg-sea-0": "Frühling", "lg-sea-1": "Sommer", "lg-sea-2": "Herbst", "lg-sea-3": "Winter", "lg-t-p1": "Die Ernte ist eingebracht. Sie ist mehr, als ein Haushalt braucht, und weniger, als zwei Haushalte wollen. Am Ende jeder Saison kommt ein Nachbar an den Zaun, und Sie entscheiden, ob Ihr Sack hinübergeht oder auf Ihrer Stufe bleibt. Er entscheidet im selben Moment dasselbe über Sie, und keiner von Ihnen spricht zuerst.", "lg-t-p2": "Fünf Kapitel. Nichts wird erklärt, bevor Sie es gespielt haben.", "lg-b-resume": "Weiter ab Kapitel {n}", "lg-b-begin": "Mit der ersten Saison beginnen", "lg-b-free": "Freies Spiel", "lg-t-note": "Alles geschieht auf dieser Seite. Nichts, was Sie hier tun, wird irgendwohin gesendet. Ihr Fortschritt liegt in diesem Browser und nirgendwo sonst.", "lg-s-title": "Das lange Spiel. Ein Spiel darüber, eine Ernte mit einem Nachbarn zu teilen, Saison für Saison.", "lg-i1-kick": "Kapitel eins", "lg-i1-b1": "Mira bewirtschaftet den Streifen auf der anderen Seite des Zauns. Sie wird am Ende jeder der nächsten sechs Saisons kommen.", "lg-i1-b2": "Jede Saison wählen Sie einmal. Teilen Sie die Ernte, geht der Sack über den Zaun. Behalten Sie sie, bleibt er auf Ihrer Stufe. Sie wählt im selben Moment, und was sie gewählt hat, erfahren Sie erst, wenn Sie sich festgelegt haben.", "lg-i1-b3": "Niemand sagt Ihnen die richtige Antwort. Spielen Sie die sechs Saisons und sehen Sie, was Sie daraus machen.", "lg-i2-kick": "Kapitel zwei", "lg-i2-b1": "Es spricht sich herum. Vier Haushalte kommen jetzt der Reihe nach an den Zaun: Deniz, Bruno, Halil und Ana. Jeder hat seine Art, das hier anzugehen, und keiner verrät sie.", "lg-i2-b2": "Sie treffen jeden dreimal, im Wechsel. Was Sie Deniz angetan haben, weiß Bruno nicht, und jeder antwortet nur auf das, was Sie ihm getan haben.", "lg-i2-b3": "In der Ecke liegt ein Notizbuch. Es schreibt auf, was jeder getan hat. Nutzen Sie es, denn am Ende des Kapitels werden Sie gefragt, wer wer ist.", "lg-i3-kick": "Kapitel drei", "lg-i3-b1": "Der Winterweg zwischen den beiden Streifen läuft an einer Rinne entlang, und dieses Jahr ist die Rinne schlimm. Ein Sack für die andere Seite kommt nicht immer an. Das Korn bleibt in der Scheune, aus der es kam; der Weg macht Sie also ungefragt zu einem, der behält, und der Haushalt jenseits des Zauns sieht nur, dass nichts kam.", "lg-i3-b2": "Halil ist wieder jenseits des Zauns, acht Saisons lang. Er ist derselbe Mann wie im letzten Kapitel und wird genau tun, was er zuvor tat.", "lg-i3-b3": "Sehen Sie, was ein verlorener Sack mit einer Saison macht, und dann mit der Saison danach.", "lg-i4-kick": "Kapitel vier", "lg-i4-b1": "Drei Haushalte haben die leeren Streifen am Rand des Dorfes übernommen. Keiner von ihnen ist Ihnen begegnet. Alle haben von Ihnen gehört.", "lg-i4-b2": "Am Pfosten neben dem Zaun hängt eine Laterne. Sie ist, was das Dorf über Sie glaubt, und sie ist keine Anzeigetafel: Es braucht viele Saisons des Teilens, um die Flamme zu heben, und einen behaltenen Sack, um sie fallen zu lassen.", "lg-i4-b3": "Tomas kommt zuerst, dann Leyla, dann Emre. Jeder eröffnet mit dem, was er gehört hat, und antwortet dann auf das, was Sie tatsächlich tun.", "lg-i5-kick": "Kapitel fünf", "lg-i5-b1": "Legen Sie den Sack ab. Dieses Kapitel wird nicht gespielt, es wird angesehen.", "lg-i5-b2": "Dreißig Haushalte, fünf Arten, mit der Ernte umzugehen, und vierzig Jahre. Jedes Jahr hat jeder Haushalt mit jedem anderen eine lange Folge von Saisons zu tun, und die Haushalte, die sich am besten ernährt haben, haben mehr Kinder als die anderen. Das Dorf wählt nichts. Es isst nur.", "lg-i5-b3": "Sehen Sie zu, welcher Streifen des Hangs wächst und welcher sich leert.", "lg-go-first": "Die erste Saison", "lg-go-winter": "Die erste Wintersaison", "lg-go-tomas": "Tomas begegnen", "lg-go-year": "Das erste Jahr", "lg-a-kick-w": "Winter, Saison {a} von {b}", "lg-a-kick-s": "{s} {a} von {b}", "lg-a-h": "{n} steht am Zaun", "lg-a-gully": "Die Rinne führt Wasser. Ein Sack für die andere Seite kommt nicht immer an, und das Korn bleibt, wo es begann. Von der anderen Seite des Zauns sieht das genau wie eine Entscheidung aus.", "lg-a-first4": "{n} ist Ihnen nie begegnet. Was {n} in dieser ersten Saison tut, kommt von dem, was das Dorf über Sie gesagt hat. Der Rinnenwinter zählt darin nicht, denn jeder Haushalt hatte in dem Jahr denselben Weg, und das weiß jeder.", "lg-a-sack": "Ihr Sack liegt auf der Stufe. {n} hat einen auf der anderen Seite. Wählen Sie einmal, und dann blicken Sie auf.", "lg-b-share": "Die Ernte teilen", "lg-b-keep": "Die Ernte behalten", "lg-cellar": "Ihr Keller", "lg-others": "Die anderen", "lg-s-ask": "{s}, Saison {a} von {b}. {n} steht am Zaun. Teilen Sie die Ernte oder behalten Sie sie. Sie haben {y} Körbe.", "lg-r-kick": "Die Saison schließt", "lg-r-accident": "Keiner von Ihnen kann einen Unfall von einer Entscheidung unterscheiden. Alles, was ankommt, ist, was ankommt.", "lg-r-lantern": "Die Laterne am Pfosten ist {w}.", "lg-rep-well": "hell am Brennen", "lg-rep-low": "niedrig, aber stetig", "lg-rep-nearly": "fast erloschen", "lg-rep-out": "erloschen", "lg-b-winterend": "Der Winter endet", "lg-b-chend": "Das Kapitel endet", "lg-b-nextseason": "Die nächste Saison", "lg-s-result": "{o} {r} Sie haben jetzt {y} Körbe.", "lg-bask1": "{n} Korb", "lg-baskN": "{n} Körbe", "lg-o-tail": " {yb} für Sie, {t} drüben.", "lg-o-both": "Der Weg nahm beide Säcke.{tail}", "lg-o-you": "Der Weg machte Sie ungefragt zu einem, der behält.{tail}", "lg-o-them": "Nichts kam herüber, und niemand hat das entschieden.{tail}", "lg-o-cc": "Beide Keller halten.{tail}", "lg-o-dc": "Sie kamen am besten aus der Saison.{tail}", "lg-o-cd": "Sie kamen am schlechtesten aus der Saison.{tail}", "lg-o-dd": "Kein Keller füllt sich.{tail}", "lg-rw-youlost": "Ihr Sack kam nie hinüber. Er liegt noch in Ihrer Scheune, und Ihre Scheune ist voller, als Sie wollten.", "lg-rw-yougave": "Sie hoben Ihren Sack über den Zaun.", "lg-rw-youkept": "Sie behielten Ihren Sack auf der eigenen Stufe.", "lg-rw-themlost": "Ein Sack sollte den anderen Weg kommen und kam nie an.", "lg-rw-themgave": "{n} reichte im selben Moment einen Sack herüber.", "lg-rw-themkept": "{n} behielt den Sack auf der anderen Stufe.", "lg-pt-cap": "Körbe für Sie und für die andere Seite, je Paar von Entscheidungen", "lg-pt-theyshare": "er teilt", "lg-pt-theykeep": "er behält", "lg-pt-youshare": "Sie teilen", "lg-pt-youkeep": "Sie behalten", "lg-pt-toyou": " für Sie", "lg-pt-tothem": "{n} drüben", "lg-q-kick": "Vor den Antworten", "lg-q-h": "Sagen Sie, wer wer ist", "lg-q-p1": "Sie haben jeden dreimal getroffen, und das Notizbuch hat mitgeschrieben. Unten stehen vier Arten, mit einer Ernte umzugehen. Setzen Sie eine gegen jeden Namen. Nichts hängt davon ab, richtig zu liegen, und die Antworten kommen ohnehin als Nächstes.", "lg-q-choose": "wählen", "lg-b-check": "Das Notizbuch gegen sie prüfen", "lg-b-skipq": "Überspringen und die Antworten sehen", "lg-s-quiz": "Sagen Sie, wer wer ist. Vier Auswahllisten, eine je Nachbar.", "lg-m-kick": "Was die Rinne tat", "lg-m-h": "Eine Fehde, die niemand gewählt hat", "lg-m-p1": "Halil antwortet genau auf das, was ankam. Etwas anderes kann er nicht, denn für ihn sind ein Sack, der nie kam, und ein Sack, der nie geschickt wurde, dasselbe. So wird ein schlechtes Stück Weg zu einer behaltenen Saison, die behaltene Saison zu einer Antwort und die Antwort zu einer weiteren Antwort.", "lg-m-p2": "Acht Saisons, {y} Körbe für Sie und {t} für Halil. {lost}Halil wollte in {p} der acht behalten, und jede davon war eine Antwort auf etwas, das schon geschehen war.", "lg-m-lost1": "Der Weg hielt {n} der Säcke zurück, die Sie schicken wollten. ", "lg-m-lost0": "Der Weg hielt nichts zurück, was Sie schicken wollten. ", "lg-m-p3": "Es wird schlimmer, wenn Sie ihm in gleicher Münze antworten. Setzen Sie zwei Haushalte einander gegenüber, die beide genau tun, was Halil tut, und schicken Sie sie mit denselben Verlusten auf denselben Wegen durch denselben Winter. Sie enden bei {a} und {b} Körben gegen die {r8}, die jeder durch bloßes Teilen gehabt hätte, und sie verbringen {f} der acht Saisons mit beiden Kellern zu und {alt} weitere damit, einander abwechselnd zu berauben, erst in die eine, dann in die andere Richtung. Der Unfall verblasst nicht. Er wird zwischen ihnen hin und her gereicht, solange die Saisons dauern.", "lg-m-p4": "Zwei Haushalte, die beide eine einzige leere Saison durchgehen lassen, kommen mit {fb} Körben zusammen durch denselben Winter. Die zwei Spiegel schafften {mb}. Acht geteilte Saisons wären {r16} gewesen.", "lg-m-p5": "Jetzt derselbe Winter noch einmal. Dieselbe Rinne, dieselben Verluste in denselben Saisons. Ana übernimmt den Streifen, während Halil fort ist, und Ana ist nicht Halil.", "lg-b-withana": "Derselbe Winter, mit Ana", "lg-s-mid": "Der erste Winter ist vorbei. {y} Körbe für Sie und {t} für Halil.", "lg-b-ch-n": "Kapitel {n}. {t}", "lg-b-endof": "Das Ende", "lg-roll-known": "in den Büchern bekannt als {f}", "lg-roll-right": ". Sie lagen richtig.", "lg-roll-as": ". Sie hatten {g}.", "lg-roll-un": "unbeantwortet", "lg-e1-kick": "Kapitel eins schließt", "lg-e1-h": "Der Tisch, an dem Sie gespielt haben", "lg-e1-p1": "Sechs Saisons, {y} Körbe in Ihrem Keller und {t} in Miras. Hier sind die vier Zahlen, die hinter jeder dieser Saisons standen. Sie waren nie in dem Sinn vor Ihnen verborgen, dass Sie sie nicht hätten herleiten können. Sie waren nur nie aufgeschrieben.", "lg-e1-p2": "Lesen Sie die obere Zeile gegen die untere. Was auch immer Mira tut, Sie stehen mit Behalten besser da: Fünf schlägt drei, wenn sie teilt, eins schlägt nichts, wenn sie behält. Dasselbe gilt für sie, mit Blick auf Ihre Spalte. So enden zwei Menschen, die beide das Vernünftige tun, in der rechten unteren Ecke mit je einem Korb, während in der linken oberen die ganze Zeit je drei lagen.", "lg-e1-p3": "Diese Form hat einen Namen. Es ist das Gefangenendilemma, die kleinste Lage, in der das Vernünftige alle schlechter stellt. Einmal gespielt, gibt es nichts zu diskutieren. Behalten ist schlicht besser.", "lg-e1-h2": "Was Mira getan hat", "lg-e1-p4": "Sie teilte in der ersten Saison. Danach tat sie Ihnen genau das, was Sie ihr in der Saison davor getan hatten. Das ist alles. Es heißt Wie du mir, so ich dir, und es war das kürzeste Programm in den Turnieren, die dieses Thema berühmt machten.", "lg-e1-p5": "Es lohnt sich zu sagen, was dieses Programm nicht kann. Es schlägt den Menschen jenseits des Zauns nie. Es kann nicht: Es gibt nur zurück, was ihm gegeben wurde; bestenfalls spielt es unentschieden, schlimmstenfalls wird es Zweiter. Was es tut, ist, das Teilen zu Ihrer besseren Wahl zu machen, und das gelingt ihm nur, weil die Saisons weiter kommen. Wüssten Sie, welche Saison die letzte ist, würden Sie in ihr behalten. Das wissend, auch in der davor. Dieses Aufribbeln ist der ganze Grund, warum die letzte Saison nie angekündigt wird.", "lg-e1-t1": "Ihre sechs Saisons ", "lg-e1-t1b": " Körbe", "lg-e1-t2": "Mira ", "lg-e1-t2b": " Körbe", "lg-e1-t3": "Hätten beide jede Saison geteilt, gäbe das ", "lg-e1-t3b": " für jeden", "lg-s-e1": "Kapitel eins schließt. Die Auszahlungstabelle ist jetzt sichtbar. Mira spielte Wie du mir, so ich dir.", "lg-e2-kick": "Kapitel zwei schließt", "lg-e2-h": "Vier Arten, mit einer Ernte umzugehen", "lg-e2-p1": "Zwölf Saisons und {y} Körbe. Hier ist, wer jenseits des Zauns stand.", "lg-e2-placed": "Sie haben {n} der vier richtig gesetzt.", "lg-e2-p2": "Es gibt keinen Zug, der gegen alle vier richtig ist. Gegen Deniz, die teilt, was auch immer Sie tun, ist Behalten schlicht besser und kostet Sie nichts, was Ihnen je in Rechnung gestellt wird. Gegen Bruno, der behält, was auch immer Sie tun, ist Teilen schlicht schlechter, und keine Geduld wird ihn richten. Gegen Halil und Ana kommt zurück, was Sie tun; Teilen zahlt sich also aus, und Behalten ist von einer Saison geborgt, die Sie noch nicht erreicht haben.", "lg-e2-p3": "Das ist der Punkt des Kapitels. Es gibt keine beste Art zu spielen. Es gibt nur die beste Art gegen den Menschen, der tatsächlich dort steht, und wer das ist, weiß nur, wer ihn beobachtet hat. Das Notizbuch war die ganze Methode.", "lg-e2-p4": "Es lohnt sich auch zu bemerken, was das Herausfinden Sie gekostet hat. Jedem Nachbarn, den Sie durch Behalten prüften, haben Sie zugleich etwas über sich beigebracht.", "lg-s-e2": "Kapitel zwei schließt. Deniz teilt immer, Bruno behält immer, Halil spiegelt Sie, Ana lässt eine behaltene Saison durchgehen.", "lg-e3-kick": "Kapitel drei schließt", "lg-e3-h": "Vergebung als Fehlerkorrektur", "lg-e3-p1": "Dieselben acht Saisons, dieselbe Rinne, dieselben Säcke auf denselben Wegen verloren. Mit Halil endeten Sie bei {a} Körben. Mit Ana bei {b}.", "lg-e3-p2": "Halil antwortet auf das, was ankam. Wenn nichts ankam, behält er die nächste Saison. Antwortet der Haushalt gegenüber ebenso, wird auch diese behaltene Saison beantwortet, und die Antwort wird beantwortet, und ein Unfall wird zu einer Reihe von Unfällen, die nicht endet, denn sie zu beenden hieße, der zu sein, der in eine behaltene Saison hinein teilt und nichts dafür bekommt.", "lg-e3-p3": "Ana antwortet nur auf ein Muster. Eine leere Saison ist eine Saison, keine Botschaft. Zwei hintereinander sind eine Botschaft. So geht ein Unfall durch sie hindurch, ohne eine Spur zu lassen, und Sie beide kehren zum Teilen zurück, ohne dass je einer von Ihnen beschlossen hätte, Frieden zu schließen.", "lg-e3-p4": "Das ist keine Behauptung, dass netter besser sei. Ana kann beraubt werden: Wer für immer jede zweite Saison behält, nimmt für immer von ihr, und sie teilt weiter hinein. Was das Kapitel zeigt, ist enger und nützlicher. Wenn das, was Sie sehen, nicht genau das ist, was der andere getan hat, beantwortet eine Regel, die auf jede einzelne Beobachtung antwortet, Rauschen, als wäre es Absicht. Etwas Spiel in der Regel ist keine Weichheit. Es ist, wie eine Regel eine Welt überlebt, die sie nicht klar sehen kann.", "lg-s-e3": "Kapitel drei schließt. Mit Halil endeten Sie bei {a} Körben, mit Ana bei {b}.", "lg-e4-kick": "Kapitel vier schließt", "lg-e4-h": "Eine Geschichte ist eine Strategie", "lg-e4-p1": "Neun Saisons mit drei Menschen, die Sie nie getroffen hatten, und {y} Körbe. Die Laterne am Pfosten endete {f}.", "lg-f-burning": "brennend", "lg-f-low": "niedrig", "lg-f-nearly": "fast erloschen", "lg-f-out": "erloschen", "lg-e4-p2": "Keiner der drei konnte in Ihren Kopf sehen. Was sie sehen konnten, war ein Dorf, das geredet hatte. Tomas eröffnete darauf, Leyla auch, Emre auch, und nach der ersten Saison antwortete jeder einfach auf das, was Sie tatsächlich taten.", "lg-e4-p3": "Die Laterne wurde gebaut, um sich zu bewegen, wie ein Ruf sich bewegt. Teilen hebt sie ein wenig, und es braucht viele Saisons, sie zu füllen. Ein behaltener Sack nimmt ein Fünftel auf einmal. Diese Asymmetrie ist kein moralisches Urteil, sie ist Arithmetik über Belege: Hundert großzügige Saisons sind vereinbar mit jemandem, der großzügig ist, wenn es billig ist, während ein genommener Sack nur mit jemandem vereinbar ist, der nimmt.", "lg-e4-p4": "Der nützliche Teil ist dieser. In einem Dorf, das klein genug ist zu reden, ist Ihre Vergangenheit keine Aufzeichnung Ihres Spiels. Sie ist Teil Ihres Spiels. Sie entscheidet, womit der nächste Fremde eröffnet, bevor einer von Ihnen irgendetwas getan hat.", "lg-e4-p5": "Tragen Sie es nicht zu weit. In diesem Kapitel sagte das Dorf immer die Wahrheit über Sie und war sich immer einig. Echte Rufe sind lückenhaft, veraltet und für verschiedene Menschen verschieden viel wert, und nichts davon ist hier modelliert.", "lg-s-e4": "Kapitel vier schließt. Sie endeten bei {y} Körben, und die Laterne ist {f}.", "lg-y-h0": "Dreißig Haushalte", "lg-y-hnone": "Es ist niemand mehr da, der behält, was auch geschieht", "lg-y-hwell": "Den Behaltern geht es sehr gut", "lg-y-hrun": "Den Behaltern gehen die Menschen aus, von denen sie nehmen", "lg-y-hfeed": "Das Dorf ernährt sich", "lg-y-p0": "Fünfzehn Haushalte teilen, was auch geschieht. Sechs behalten, was auch geschieht. Vier spiegeln, drei vergessen einen behaltenen Sack nie, und zwei lassen einen einzigen durchgehen. Jeder Haushalt hat mit jedem anderen etwa dreißig Saisons im Jahr zu tun.", "lg-y-p1": "Haushalte, die sich letztes Jahr besser ernährt haben, halten dieses Jahr mehr vom Dorf. Niemand hat seine Art geändert. Die Verhältnisse haben sich unter ihnen verschoben.", "lg-b-oneyear": "Ein Jahr", "lg-b-run": "Die Jahre laufen lassen", "lg-b-hold": "Die Jahre anhalten", "lg-b-what": "Was geschehen ist", "lg-b-skip40": "Zum vierzigsten Jahr springen", "lg-cofn": "{c} von {n}", "lg-s-years": "Jahr {y}. Von dreißig Haushalten: {list}.", "lg-e5-kick": "Kapitel fünf schließt", "lg-e5-h": "Was überlebt, ist nicht, was die nächste Saison gewinnt", "lg-e5-p1": "Die Haushalte, die behalten, was auch geschieht, begannen als ein Fünftel des Dorfes. Im Jahr {py} waren sie {pk} von hundert Haushalten, denn ein Dorf voller Menschen, die teilen, was auch geschieht, ist der leichteste Ort der Welt, um einer zu sein, der behält.", "lg-e5-p2": "Und genau das erledigte sie. Mit jedem Jahr, in dem sie nahmen, blieben weniger Haushalte, von denen zu nehmen war. Die bedingungslos Teilenden gingen zuerst, und als sie fort waren, hatten die Behalter es vor allem miteinander und mit Haushalten zu tun, die zurückantworten, und ein Behalter mit einem Behalter bekommt einen Korb je Saison. Im Jahr {ly} waren sie {lk} von hundert.", "lg-e5-p3": "Die Haushalte, die teilen, was auch geschieht, sind ebenfalls sehenswert. Sie fallen auf {gm} von hundert, während die Behalter essen, und dann, als die Behalter fort sind, werden sie für nichts mehr bestraft und halten sich bei {g}. Es geht ihnen nicht gut, weil sie gut sind. Es geht ihnen gut, weil niemand mehr da ist, der von ihnen nimmt, und ihr Dasein ist genau der Riss, durch den ein Behalter zurückkäme.", "lg-e5-p4": "Nichts in diesem Dorf wählte. Niemand lernte, niemand änderte seine Meinung, niemand wurde für irgendetwas bestraft. Haushalte, die sich gut ernährten, hatten mehr Kinder, und das allein verschob den Boden unter allen.", "lg-e5-p5": "Mitzunehmen ist der Unterschied zwischen zwei Fragen. Welcher Zug diese Saison gewinnt, ist eine Frage, und Behalten gewinnt sie jedes Mal. Welche Art, mit der Ernte umzugehen, in vierzig Jahren noch da ist, ist eine andere Frage, und sie hat eine andere Antwort.", "lg-e5-p6": "Lesen Sie die Zahlen eng. Dieses Ergebnis ist eine Tatsache über dieses Dorf: diese fünf Arten, diese Anfangsverhältnisse, diese vier Auszahlungen und etwa dreißig Saisons je Paarung. Ändern Sie die Mischung, ändern Sie das Ergebnis. Setzen Sie gar keine Spiegler und keine Nachtragenden ins Dorf, und die Behalter fallen nie. Verkürzen Sie die Saisons, sodass jede Paarung sich zweimal trifft, und die Behalter gewinnen glatt. Es gibt hier kein Gesetz, dass Kooperation gewinnt. Es gibt nur einen Mechanismus, und Mechanismen haben Bedingungen.", "lg-en-h1": "Wofür die fünf Kapitel da waren", "lg-en-p1": "Zwei Menschen können sich einzeln durchs Nehmen besserstellen, und beide stehen schlechter da, wenn beide nehmen. Das ist die ganze Falle, und sie steckt in den Zahlen, nicht in irgendjemandes Charakter. Einmal gespielt, ist Nehmen schlicht richtig, und mehr ist dazu nicht zu sagen.", "lg-en-p2": "Alles, was die Antwort ändert, kommt aus derselben Quelle: Die Saisons kommen weiter, und keine Seite weiß, welche die letzte ist. Das macht das, was Sie jetzt tun, zu etwas, das Ihnen später geschieht. Es ist kein Wohlwollen und kein Vertrauen. Es ist Arithmetik mit einer Zukunft darin.", "lg-en-p3": "Vier Dinge folgten daraus, und jedes war ein Kapitel.", "lg-en-l1": "Eine Regel, so kurz wie in gleicher Münze zu antworten, reicht, um Teilen lohnend zu machen, und sie schlägt den Menschen jenseits des Zauns kein einziges Mal. Sie ändert nur, was in seinem Interesse liegt.", "lg-en-l2": "Es gibt keine beste Art zu spielen. Es gibt eine beste Art gegen den Haushalt, der tatsächlich dort steht; darum ist Beobachten die Methode und war das Notizbuch das Werkzeug.", "lg-en-l3": "Wenn das, was ankommt, nicht immer das ist, was gesendet wurde, behandelt eine Regel, die jede einzelne Beobachtung beantwortet, einen Unfall wie eine Entscheidung. Spiel in der Regel ist Fehlerkorrektur.", "lg-en-l4": "In einem Dorf, das klein genug ist zu reden, entscheidet Ihre Geschichte, womit ein Fremder eröffnet. Sie ist Teil Ihres Spiels, bevor Sie gespielt haben.", "lg-en-h2": "Was das nicht zeigt", "lg-en-m1": "Kooperation gewinnt nicht immer. Was überlebt, hängt von der Mischung der Arten in der Population ab und davon, wie wahrscheinlich die Saisons weitergehen. Ein Dorf, in dem niemand zurückantwortet, ist ein Dorf, in dem Nehmen gewinnt und weiter gewinnt.", "lg-en-m2": "Eine bekannte letzte Saison ribbelt das Ganze auf. Wissen beide, welche Saison die letzte ist, ist Nehmen in ihr richtig, und darum auch in der davor, und so weiter zurück bis zur ersten.", "lg-en-m3": "Die berühmten Turnierergebnisse sind Tatsachen über die eingereichten Programme, keine Gesetze. Die Autoren der größten Neuauswertung argumentieren, dass Wie du mir, so ich dir teils deshalb so gut abschnitt, weil es mit schwachen Einreichungen gepoolt war.", "lg-en-m4": "Alles hier sind Programme, die ein abstraktes Spiel um Körbe spielen. Menschen in echten Dilemmata tun Dinge, die dieses Modell nicht enthält, und nichts auf dieser Seite ist ein Beleg dafür, was irgendein Mensch tun wird.", "lg-en-m5": "Der Ruf in Kapitel vier ist ein Erzählmittel. Das Dorf sagt immer die Wahrheit über Sie und ist sich immer einig; so funktionieren Rufe nicht.", "lg-en-h3": "Dasselbe Argument, ausgeschrieben", "lg-en-essay1": "Es gibt eine längere Fassung davon mit editierbaren Auszahlungen, einem vollen Turnier, einem evolutionären Lauf und jeder Quelle mit Namen und Datum: ", "lg-en-essay-a": "Die Evolution der Kooperation", "lg-en-essay2": ", Teil von Explorable Economics auf dieser Website. Lesen Sie die, wenn Sie die Arithmetik prüfen wollen, statt sie zu fühlen.", "lg-en-h5": "Woher das kommt", "lg-src1": "Das Turnier.", "lg-src2": "Der ökologische Lauf, in dem sich die Gewinner vermehren.", "lg-src-tail": "Gelesen am 25. August 2026.", "lg-en-h4": "Die anderen Spiele", "lg-en-fam1": "Dies ist eines aus einer Familie. Derselbe Zaun ist nur eine der Lagen, die die Spieltheorie in vier Zahlen aufschreiben kann: Es gibt eine Jagd, in der die Gefahr nicht Gier ist, sondern Zweifel, eine Fremde, die lieber nichts hat, als schlecht behandelt zu werden, eine Weide, die am Gebrauch stirbt, eine Zahl, die alle über alle raten, und eine Münze, bei der niemand sich Vorhersagbarkeit leisten kann. Sie sind alle hier: ", "lg-en-fam-a": "die Spiele", "lg-b-freeplay": "Freies Spiel", "lg-b-again1": "Von der ersten Saison an noch einmal spielen", "lg-s-end": "Das Ende. Das Argument steht schlicht da, mit dem, was es nicht zeigt, und dem Link zum geschriebenen Essay.", "lg-fs-kick": "Freies Spiel", "lg-fs-h": "Stellen Sie das Dorf selbst ein", "lg-fs-p1": "Vier Zahlen, eine Chance, dass der Sack auf dem Weg verloren geht, eine Chance, dass die Saisons weitergehen, und der Mensch jenseits des Zauns. Nichts ist verborgen, und das Spiel sagt Ihnen, wenn Ihre Zahlen aufgehört haben, ein Dilemma zu sein.", "lg-fs-T": "Sie behalten, er teilt", "lg-fs-R": "beide teilen", "lg-fs-P": "beide behalten", "lg-fs-S": "Sie teilen, er behält", "lg-fs-n": "verlorene Säcke, je hundert", "lg-fs-w": "Saisons gehen weiter, je hundert", "lg-fs-d": "jenseits des Zauns", "lg-fs-ok": "Diese vier Zahlen sind ein Dilemma. Behalten schlägt Teilen, was auch immer der andere tut, und beide teilen schlägt einander abwechselnd zu berauben.", "lg-fs-no": "Das ist kein Gefangenendilemma mehr. {m} Es ist noch spielbar und noch ein Spiel, aber ein anderes.", "lg-fs-no1": "Behalten schlägt Teilen nicht mehr, was auch immer die andere Seite tut; es gibt also nichts, wovon man gefangen wäre.", "lg-fs-no2": "Zwei geteilte Saisons sind jetzt weniger wert, als einander abwechselnd zu berauben; ein Paar fährt also mit Abwechseln besser als mit Teilen.", "lg-b-tofence": "Zum Zaun gehen", "lg-b-backend": "Zurück zum Ende", "lg-s-fs": "Freies Spiel. Stellen Sie die vier Auszahlungen, die Verlustchance, die Fortsetzungschance und das Gegenüber ein.", "lg-fp-closed": "Saison {n} geschlossen", "lg-fp-s1": "Saison eins", "lg-fp-p1": "Der Nachbar steht am Zaun. Sie haben die Zahlen selbst eingestellt und wissen, wer dort steht.", "lg-fp-over1": "Die Saisons hörten auf. Niemand kündigte es an und niemand plante damit, und das war der einzige Grund, warum der ganze Lauf ehrlich zu spielen sich lohnte.", "lg-fp-over2": "Sie endeten bei {y} Körben über {s} Saisons, der Nachbar bei {t}. Hätten beide jede Saison geteilt, hätte jeder {r} bekommen.", "lg-b-setup": "Noch einmal einstellen", "lg-b-change": "Die Zahlen ändern", "lg-s-fpover": "Die Saisons hörten nach {s} auf. Sie endeten bei {y} Körben.", "lg-fp-note": "Jenseits des Zauns: {n}; in den Büchern bekannt als {f}. {t} Verlorene Säcke: {no} je hundert. Die Saisons gehen mit einer Chance von {w} je hundert weiter.", "lg-nb": "Nachbar", "lg-thenb": "Der Nachbar", "lg-s-fp": "{s}, Saison {n}. Teilen Sie die Ernte oder behalten Sie sie. Sie haben {y} Körbe.", "lg-nb-empty": "Noch nichts aufgeschrieben.", "lg-nb-cap": "Was jeder Nachbar getan hat, älteste Saison zuerst", "lg-nb-h1": "Nachbar", "lg-nb-h2": "Was er tat", "lg-nb-h3": "Geteilt", "lg-nb-h4": "Ihre Körbe", "lg-nb-shared": "geteilt", "lg-nb-kept": "behalten", "lg-nb-hint": "Ein voller Kreis ist eine Saison, in der geteilt wurde. Ein leerer Kreis eine, in der behalten wurde.", "lg-d-giver-n": "Teilt immer", "lg-d-taker-n": "Behält immer", "lg-d-mirror-n": "Spiegelt Sie", "lg-d-grudge-n": "Vergisst nie", "lg-d-forgiver-n": "Lässt eine durchgehen", "lg-d-pavlov-n": "Bleibt, wenn es klappt", "lg-d-giver-t": "Teilt jede Saison, was auch immer man ihr antut.", "lg-d-taker-t": "Behält jede Saison, was auch immer man für ihn tut.", "lg-d-mirror-t": "Teilt in der ersten Saison und tut dann, was Sie in der letzten getan haben.", "lg-d-grudge-t": "Teilt, bis Sie einmal behalten. Danach behält er für immer.", "lg-d-forgiver-t": "Teilt, außer Sie haben in beiden letzten Saisons behalten.", "lg-d-pavlov-t": "Teilt zuerst. Wiederholt dann ihren letzten Zug, wenn er sie gut ernährt hat, und wechselt, wenn nicht.", "lg-k-return": "Enter", "lg-k-start": "Start", "lg-k-begin": "Start", "lg-k-go": "weiter", "lg-k-again": "erneut", "lg-k-s": "Taste s", "lg-k-k": "Taste k", "lg-k-answer": "antworten", "lg-k-step": "Schritt", "lg-k-run": "laufen", "lg-k-own": "selbst einstellen", "lg-tally-bask": " Körbe", "lg-en-kick": "Das Ende", "pg-title": "Das lange Spiel"}};

var DISPOSITIONS = {
  giver: {
    id: "giver", name: "Always shares", formal: "always cooperate",

  },

  },
  mirror: {
    id: "mirror", name: "Mirrors you", formal: "tit for tat",
    tell: "Shares in the first season, then does whatever you did last season.",
    color: "#e0a050",
    move: function (opp) { return opp.length === 0 ? "C" : opp[opp.length - 1]; }
  },
  grudge: {
    id: "grudge", name: "Never forgets", formal: "grudger",
    tell: "Shares until you keep once. After that he keeps for ever.",
    color: "#67503a",
    move: function (opp) { return opp.indexOf("D") >= 0 ? "D" : "C"; }
  },
  forgiver: {
    id: "forgiver", name: "Lets one pass", formal: "tit for two tats",
    tell: "Shares unless you kept in both of the last two seasons.",
    color: "#40566e",
    move: function (opp) {
      var n = opp.length;
      return (n >= 2 && opp[n - 1] === "D" && opp[n - 2] === "D") ? "D" : "C";
    }
  },
  pavlov: {
    id: "pavlov", name: "Stays if it worked", formal: "win stay, lose shift",
    tell: "Shares first. Then repeats her last move if it fed her well, and switches if it did not.",
    color: "#6b4a72",
    move: function (opp, own, pays, p) {
      if (own.length === 0) return "C";
      var last = own[own.length - 1];
      var got = pays[pays.length - 1];
      var good = got >= (p || PAY).R;
      return good ? last : (last === "C" ? "D" : "C");
    }
  }
};
var DISP_ORDER = ["giver", "taker", "mirror", "grudge", "forgiver", "pavlov"];

/* A neighbour who opens on what the village believes about you and
   then mirrors. This is a piece of the story rather than a strategy
   from the literature, and the ending says so. */
function reputationOpener(rep) {
  return {
    id: "arrival", name: "New in the village", formal: "opens on your reputation, then mirrors",
    color: "#7a6a2f",
    move: function (opp) {
      if (opp.length === 0) return rep >= 0.5 ? "C" : "D";
      return opp[opp.length - 1];
    }
  };
}

/* one season between two sides. Noise is a gift lost on the road:
   a share can arrive as a keep, and neither side is told why. */
function playRound(a, b, noise, rnd, p) {
  var ae = a, be = b;
  if (a === "C" && noise > 0 && rnd() < noise) ae = "D";
  if (b === "C" && noise > 0 && rnd() < noise) be = "D";
  return {
    aIntent: a, bIntent: b, a: ae, b: be,
    aLost: a === "C" && ae === "D", bLost: b === "C" && be === "D",
    aPay: payoff(ae, be, p), bPay: payoff(be, ae, p)
  };
}

/* a whole match between two dispositions, used by the years */
function match(dA, dB, rounds, noise, rnd, p) {
  var oA = [], oB = [], pA = [], pB = [], sA = 0, sB = 0;
  for (var i = 0; i < rounds; i++) {
    var mA = dA.move(oB, oA, pA, p);
    var mB = dB.move(oA, oB, pB, p);
    var r = playRound(mA, mB, noise, rnd, p);
    oA.push(r.a); oB.push(r.b);
    pA.push(r.aPay); pB.push(r.bPay);
    sA += r.aPay; sB += r.bPay;
  }
  return { a: sA / rounds, b: sB / rounds };
}

}
