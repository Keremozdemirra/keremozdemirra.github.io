<style>
/* ============================================================
   The painted world, shared by the games under game/
   The Long Game was written before this file existed and keeps
   its own copy of these rules inside its own source; every game
   built after it takes them from here, so that five pages stay
   one world instead of five.
   ============================================================ */

:root{
  --soil:#2c2115; --timber:#67503a; --terracotta:#8a4a2c;
  --accent:#e0a050; --ink:#2b2620; --paper:#f2efe6; --verdigris:#5e7a6a;
  --ink-soft:#4b443b; --dim:#6f6558; --faint:#6f6759;
  --rule:rgba(103,80,58,.32); --rule-firm:rgba(103,80,58,.55);
  --display:"Fraunces","Iowan Old Style",Georgia,serif;
  --serif:"Newsreader",Georgia,"Times New Roman",serif;
  --mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --card:rgba(242,239,230,.955);
  --card-sunk:rgba(232,227,214,.9);
}

*{box-sizing:border-box}
html,body{margin:0;padding:0;overflow-x:hidden;max-width:100%}
html{-webkit-text-size-adjust:100%}
body{
  font-family:var(--serif); color:var(--ink); background:#c8c4b6;
  min-height:calc(100dvh - var(--barh, 0px)); overscroll-behavior-y:none;
}
canvas#world{
  position:fixed; inset:0; width:100%; height:100%; display:block; z-index:0;
}

.vh{position:absolute;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;
    clip:rect(0 0 0 0);clip-path:inset(50%);white-space:nowrap;border:0}

.skip{position:absolute;left:-9999px;top:0;z-index:60;background:var(--paper);
  color:var(--ink);padding:.6rem .9rem;font-family:var(--mono);font-size:.72rem;
  border:1px solid var(--rule-firm)}
.skip:focus{left:.6rem;top:.6rem}

#shell{
  /* the viewport, less whatever the site bar above it is taking. Asking for
     the whole of it put the start button below the fold on a laptop. */
  position:relative; z-index:2; min-height:calc(100dvh - var(--barh, 0px));
  display:flex; flex-direction:column; justify-content:space-between;
  padding:clamp(.6rem,2vw,1.1rem);
  padding-bottom:calc(clamp(.6rem,2vw,1.1rem) + env(safe-area-inset-bottom,0px));
  gap:.7rem;
}

#topbar{
  display:flex; flex-wrap:wrap; align-items:baseline; gap:.4rem .9rem;
  background:var(--card); border:1px solid var(--rule-firm);
  padding:.5rem .8rem; max-width:64rem; width:100%; margin:0 auto; flex:none;
  box-shadow:0 1px 0 rgba(44,33,21,.14);
}
#topbar .ch{font-family:var(--display);font-weight:400;font-size:.98rem;
  letter-spacing:-.01em;margin:0}
#topbar .meta{font-family:var(--mono);font-size:.63rem;letter-spacing:.12em;
  text-transform:uppercase;color:var(--dim);margin:0}
#topbar .spacer{flex:1 1 auto}
#topbar button{flex:none}

#panel{
  background:var(--card); border:1px solid var(--rule-firm);
  padding:clamp(.85rem,2.4vw,1.25rem);
  max-width:64rem; width:100%; margin:0 auto; flex:none;
  box-shadow:0 2px 0 rgba(44,33,21,.16);
  max-height:74dvh; overflow-y:auto; overscroll-behavior:contain;
}
#panel.read{max-width:49rem}
@media (max-width:900px){ #panel.read{max-width:64rem} }
#panel h2{font-family:var(--display);font-weight:400;font-size:clamp(1.18rem,3.4vw,1.5rem);
  letter-spacing:-.02em;margin:0 0 .45rem;line-height:1.2}
#panel h3{font-family:var(--display);font-weight:400;font-size:1.02rem;margin:1.1rem 0 .35rem}
#panel p{margin:0 0 .6rem;font-size:clamp(.95rem,2.6vw,1.02rem);line-height:1.62;
  max-width:60ch;color:var(--ink-soft)}
#panel p.say{color:var(--ink);font-style:italic}
#panel p.tight{margin-bottom:.35rem}
#panel ul{margin:0 0 .7rem;padding-left:1.1rem;max-width:60ch}
#panel li{font-size:.95rem;line-height:1.6;margin-bottom:.3rem;color:var(--ink-soft)}
#panel a{color:var(--terracotta);text-underline-offset:.2em}
#panel a:hover{color:var(--accent)}

.kicker{font-family:var(--mono);font-size:.63rem;letter-spacing:.14em;
  text-transform:uppercase;color:var(--faint);margin:0 0 .3rem}

.row{display:flex;flex-wrap:wrap;gap:.55rem;margin-top:.75rem;align-items:stretch}
button{
  font-family:var(--serif); font-size:1rem; color:var(--ink);
  background:rgba(253,252,248,.96); border:1px solid var(--rule-firm);
  padding:.6rem 1rem; cursor:pointer; line-height:1.3;
  transition:background-color .13s ease,border-color .13s ease,transform .08s ease;
  min-height:2.75rem;
}
button:hover{background:#fffdf7;border-color:var(--terracotta)}
button:active{transform:translateY(1px)}
button:focus-visible{outline:2px solid var(--terracotta);outline-offset:2px}
button[disabled]{opacity:.45;cursor:default}
button .k{display:block;font-family:var(--mono);font-size:.6rem;letter-spacing:.13em;
  text-transform:uppercase;color:var(--faint);margin-top:.18rem}
button.big{font-family:var(--display);font-size:1.06rem;padding:.7rem 1.25rem;flex:1 1 11rem}
button.share{border-color:rgba(94,122,106,.75);background:rgba(232,238,231,.96)}
button.share:hover{background:#e9f0e7;border-color:var(--verdigris)}
button.keep{border-color:rgba(138,74,44,.7);background:rgba(244,232,224,.96)}
button.keep:hover{background:#f7e9e0;border-color:var(--terracotta)}
button.quiet{font-family:var(--mono);font-size:.65rem;letter-spacing:.12em;
  text-transform:uppercase;padding:.42rem .7rem;min-height:2.1rem;color:var(--dim);
  background:transparent;border-color:var(--rule)}
button.quiet:hover{color:var(--ink);background:rgba(253,252,248,.8)}

.tally{display:flex;flex-wrap:wrap;gap:.35rem 1.4rem;font-family:var(--mono);
  font-size:.72rem;letter-spacing:.04em;color:var(--dim);
  border-top:1px solid var(--rule);padding-top:.55rem;margin-top:.75rem}
.tally b{color:var(--ink);font-weight:500;font-variant-numeric:tabular-nums}

.tblwrap{overflow-x:auto;margin:.4rem 0 .9rem;max-width:100%}
table.pay{border-collapse:collapse;font-family:var(--mono);font-size:.76rem;min-width:20rem}
table.pay th,table.pay td{border:1px solid var(--rule-firm);padding:.42rem .6rem;text-align:center}
table.pay th{font-size:.6rem;letter-spacing:.1em;text-transform:uppercase;
  color:var(--dim);font-weight:500;background:var(--card-sunk)}
table.pay td{background:rgba(253,252,248,.8);min-width:7rem}
table.pay td b{color:var(--terracotta);font-weight:500;font-size:.95rem}
table.pay td span{color:var(--dim)}
table.pay td.win{background:rgba(232,238,231,.9)}

/* ---------- a measured quantity, drawn as a strip ---------- */
.meter{display:grid;grid-template-columns:9.5rem 1fr auto;gap:.6rem;align-items:center;
  font-family:var(--mono);font-size:.7rem;color:var(--dim);margin:.3rem 0}
.meter .bar{height:.7rem;background:rgba(103,80,58,.16);position:relative}
.meter .bar i{position:absolute;inset:0 auto 0 0;display:block;background:var(--terracotta)}
.meter .bar i.good{background:var(--verdigris)}
.meter .n{font-variant-numeric:tabular-nums;color:var(--ink);min-width:3.4rem;text-align:right}
@media (max-width:640px){.meter{grid-template-columns:7.2rem 1fr auto;font-size:.66rem}}

/* ---------- a run of past rounds, as glyphs ---------- */
.glyphs{font-family:var(--mono);font-size:.95rem;letter-spacing:.16em;color:var(--ink);
  word-break:break-all;margin:.2rem 0 .5rem;max-width:60ch}
.glyphs .lose{color:var(--terracotta)}
.glyphs .win{color:var(--verdigris)}

/* ---------- fields ---------- */
.fields{display:grid;gap:.6rem .9rem;grid-template-columns:repeat(auto-fit,minmax(8.5rem,1fr));
  max-width:46rem;margin:.5rem 0 .3rem}
.fields label{display:block;font-family:var(--mono);font-size:.6rem;letter-spacing:.1em;
  text-transform:uppercase;color:var(--dim);margin-bottom:.2rem}
.fields input,.fields select{
  width:100%;font-family:var(--mono);font-size:.85rem;padding:.4rem .5rem;
  background:rgba(253,252,248,.96);border:1px solid var(--rule-firm);color:var(--ink)}
.fields input:focus-visible,.fields select:focus-visible{
  outline:2px solid var(--terracotta);outline-offset:1px}
input[type="range"]{width:100%;max-width:22rem;accent-color:#8a4a2c}
.bignum{font-family:var(--display);font-size:clamp(2rem,9vw,3rem);color:var(--ink);
  line-height:1;margin:.2rem 0 .3rem;font-variant-numeric:tabular-nums}

/* ---------- the source lines at the foot of a game ---------- */
.sources{border-top:1px solid var(--rule);margin-top:1rem;padding-top:.6rem}
.sources li{font-family:var(--mono);font-size:.68rem;line-height:1.65;color:var(--dim);
  margin-bottom:.45rem;word-break:break-word}
.sources li b{color:var(--ink);font-weight:500}
.sources a{color:var(--terracotta);word-break:break-all}

@media (max-width:640px){
  #panel{max-height:62dvh}
  #topbar{padding:.45rem .6rem;gap:.3rem .6rem}
  #topbar .ch{font-size:.92rem}
  button.big{flex:1 1 100%}
  .tally{gap:.25rem .9rem;font-size:.68rem}
}
@media (prefers-reduced-motion:reduce){
  button:active{transform:none}
  button{transition:none}
}

/* ---------- the lamplit table's own few rules ---------- */
button.hd{border-color:rgba(94,122,106,.75);background:rgba(232,238,231,.96);flex:1 1 10rem}
button.hd:hover{background:#e9f0e7;border-color:var(--verdigris)}
button.tl{border-color:rgba(138,74,44,.7);background:rgba(244,232,224,.96);flex:1 1 10rem}
button.tl:hover{background:#f7e9e0;border-color:var(--terracotta)}
.run{font-family:var(--mono);font-size:.8rem;letter-spacing:.1em;line-height:1.9;
  color:var(--dim);margin:.3rem 0 .5rem;max-width:56ch;word-break:break-all}
.run b{color:var(--verdigris);font-weight:500}
.run i{color:var(--terracotta);font-style:normal}
.score{display:flex;gap:1.6rem;flex-wrap:wrap;font-family:var(--mono);font-size:.72rem;
  color:var(--dim);border-top:1px solid var(--rule);padding-top:.55rem;margin-top:.7rem}
.score b{color:var(--ink);font-weight:500;font-variant-numeric:tabular-nums}

/* ---------- the site's clothes, worn by an instrument ---------- */
.bar,footer.site-foot,.leaf-mark{
  --serif:"Fraunces",Georgia,serif;
  --sans:"Instrument Sans",-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --paper:#f2efe6;
  --fg:#221e17;
  --dim:#6f6759;
  --line:#d8d2c2;
  --accent:#8a5a24;
  --ease:cubic-bezier(.23,1,.32,1);
}
.bar,footer.site-foot{color:var(--fg)}
footer.site-foot{background:var(--paper)}
.bar .wrap,footer.site-foot .wrap{max-width:calc(64rem + 2 * clamp(.6rem,2vw,1.1rem));
  padding-inline:clamp(.6rem,2vw,1.1rem)}
/* the village is a fixed canvas lying under the whole document, so
   the bar and the footer have to be lifted over it; and the game's
   own overflow rule stops a sticky bar from sticking, so it stands
   still at the top of the page instead of following the scroll */
.bar{position:relative;z-index:3}
footer.site-foot{position:relative;z-index:3}

.wrap{max-width:1180px;margin:0 auto;padding:0 clamp(1.2rem,5vw,3rem)}

/* ---------- top bar ---------- */
.bar{position:sticky;top:0;z-index:30;font-family:var(--sans);background:color-mix(in srgb,var(--paper) 86%,transparent);
  backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.bar .wrap{display:flex;align-items:center;justify-content:space-between;height:58px}
.bar .home{font-family:var(--serif);font-weight:400;font-size:1.05rem;text-decoration:none;letter-spacing:.01em;
  border-bottom:0;color:var(--fg)}
.bar nav{display:flex;gap:clamp(.55rem,1.5vw,1.1rem);align-items:center;flex-wrap:wrap;
  justify-content:flex-end;row-gap:.15rem}
.bar nav a{font-size:.82rem;letter-spacing:.015em;white-space:nowrap;text-decoration:none;color:var(--dim);font-weight:500;
  padding:.3rem 0;border-bottom:1px solid transparent;transition:color .18s var(--ease),border-color .18s var(--ease)}
.bar nav a:hover{color:var(--fg)}
.bar nav a[aria-current]{color:var(--fg);border-bottom-color:var(--accent)}
.langs{display:flex;gap:.1rem;margin-left:.6rem}
.langs button{font-family:var(--mono);font-size:.64rem;letter-spacing:.05em;padding:.3em .45em;
  border:0;background:none;color:var(--dim);cursor:pointer;border-radius:2px}
.langs button:hover{color:var(--fg)}
.langs button[aria-pressed="true"]{color:var(--accent);text-decoration:underline;text-underline-offset:3px}

/* ---------- footer ---------- */
footer{border-top:1px solid var(--line);margin-top:clamp(2rem,6vh,4rem);
  background:none;font-family:var(--sans);line-height:1.6}
footer .foot-links{display:flex;gap:clamp(.9rem,2.4vw,1.6rem);align-items:center;flex-wrap:wrap}
footer .wrap{display:flex;justify-content:space-between;align-items:center;padding-top:1.1rem;padding-bottom:1.4rem;
  font-size:.74rem;color:var(--dim)}
footer a{text-decoration:none;color:var(--dim);border-bottom:0}
footer a:hover{color:var(--fg)}

/* ---------- a leaf, falling once ---------- */
.leaf-mark{position:fixed;top:-30px;pointer-events:none;z-index:5;opacity:.45}
@media (prefers-reduced-motion:reduce){.leaf-mark{display:none}}

/* ---------- the bar and the footer, narrowed ---------- */
@media (max-width:640px){
  /* the bar gives the pages a line of their own instead of crowding them */
  .bar .wrap{flex-wrap:wrap;height:auto;column-gap:.7rem;row-gap:.1rem;
    padding-top:.5rem;padding-bottom:.15rem}
  .bar .home{white-space:nowrap;font-size:1rem}
  .bar nav{order:3;flex:1 0 100%;margin-top:.05rem;flex-wrap:nowrap;
    justify-content:flex-start;gap:clamp(.7rem,3.4vw,1.2rem);
    overflow-x:auto;overscroll-behavior-x:contain;-webkit-overflow-scrolling:touch;
    scrollbar-width:none;
    /* the last name fades rather than being cut, which is what says there
       is more of it to the right */
    -webkit-mask-image:linear-gradient(90deg,#000 calc(100% - 2.2rem),transparent);
    mask-image:linear-gradient(90deg,#000 calc(100% - 2.2rem),transparent);
    padding-right:2.2rem}
  .bar nav::-webkit-scrollbar{display:none}
  .bar nav a{font-size:.8rem;padding:.55rem 0;flex:0 0 auto}
  /* the name of the page you are on is brought into view on load, so a
     reader arriving deep in the site is not looking at a row that starts
     somewhere else */
  .bar nav a[aria-current]{scroll-margin-inline:1.5rem}
  /* the three languages take the right end of the name's own line: a third
     row of bar would eat a fifth of the screen */
  .bar .wrap{position:relative}
  .langs{position:absolute;top:.1rem;right:clamp(1.2rem,5vw,3rem);margin:0;gap:.15rem}
  .langs button{font-size:.7rem;padding:.2em .4em}
  footer .wrap{gap:1rem;flex-wrap:wrap;padding-bottom:calc(1.4rem + env(safe-area-inset-bottom,0px))}
}

/* eight nav names on a narrow phone: the row takes a second and a third
   line rather than push the page sideways, and the words are set tighter
   so that most phones only need two */
@media (max-width:430px){
  .bar nav{gap:.3rem .5rem}
  .bar nav a{font-size:.74rem;letter-spacing:.005em;padding:.42rem 0}
}

/* a finger, not a cursor: every control a thumb has to find is at least a
   thumb wide, in either orientation */
@media (pointer:coarse){
  .bar .home{display:inline-flex;align-items:center;min-height:44px}
  .bar nav a{min-height:44px;min-width:44px;display:inline-flex;align-items:center;
    justify-content:center;padding:.3rem .3rem}
  .langs{gap:.05rem}
  .langs button{min-width:44px;min-height:44px;padding:.3em .35em;
    display:inline-flex;align-items:center;justify-content:center}
  footer .wrap a{min-width:44px;min-height:44px;display:inline-flex;
    align-items:center;justify-content:flex-end}
}

/* the same thumb, on the page itself */
@media (pointer:coarse){
  .cv-btn{min-height:44px;padding:.8rem 1.25rem}
  .copy,.share-link{min-height:44px;min-width:44px;
    display:inline-flex;align-items:center;justify-content:center}
  .socials a{min-height:44px;display:inline-flex;align-items:center}
  .mail-line a.addr{display:inline-flex;align-items:center;min-height:44px}
  .note-read{min-height:44px;min-width:44px;display:inline-flex;align-items:center;justify-content:center}
  .feature .go{min-height:44px;display:inline-flex;align-items:center}
  .gcard .go{min-height:44px;display:inline-flex;align-items:center}
  .go-block{min-height:44px;display:inline-flex;align-items:center}
  .k-btn,.k-skip,.skip{min-height:44px;display:inline-flex;align-items:center}
  input[type=range]{height:44px}
  select{min-height:44px}
  /* a link sitting inside a sentence: the line opens up so the link can be
     a thumb tall without the paragraph closing over it */
  .quiet-line{line-height:2.1}
  .quiet-line a{display:inline-block;padding:.78rem 0;line-height:1.25}
  .note-item h2 a{display:inline-block;padding:.5rem 0;border-bottom:0;
    text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:5px}
  .note-item h2 a:hover{text-decoration-color:var(--accent)}
  /* fields and their kin: 16px so the phone does not zoom, 44 so it can be hit */
  body input[type="text"],body input[type="email"],body input[type="number"],
  body select,body textarea{font-size:16px;min-height:44px}
  body .frow textarea{min-height:8rem}
  /* a 4px tall slider is not a control: the whole strip takes the touch */
  input[type="range"]{height:44px;margin:0;padding:0}
  /* and a sixteen pixel box is not one either */
  input[type="checkbox"],input[type="radio"]{width:22px;height:22px}
  input[type="checkbox"]+label,input[type="radio"]+label{
    display:inline-flex;align-items:center;min-height:44px}
  .demo-src a{display:inline-flex;align-items:center;min-height:44px}
}

/* ---------- the crown, on a page whose interior is its own ---------- */
.k-crown-no{
  display:flex;align-items:center;gap:.55rem;margin-bottom:.85rem;
  font-family:"Fraunces",Georgia,serif;font-style:italic;font-size:1rem;
  color:var(--accent);
}
.k-crown-no svg{flex:none}
.k-lede h1{margin-top:0}


</style>

<p class="vh" id="live" role="status" aria-live="polite" aria-atomic="true"></p>

<script>
/* ============================================================
   The painted world, shared by the games under game/
   ------------------------------------------------------------
   Sky, hills, soil, grass, a house with a lit window, a tree, a
   fence, the people and the things they carry. Everything is
   drawn with canvas primitives. Nothing is loaded, no library is
   used, and once the fonts have arrived no game on this site
   makes a network call.

   The Long Game was written before this file and carries its own
   copy of the same painting inside its own source. Every game
   built after it takes the world from here, and adds only the
   creatures its own subject needs.

   window.KW is the whole surface:
     KW.M            live metrics {W,H,GY,CX,DX,small}
     KW.ctx          the 2d context, after KW.start()
     KW.world        {season, prev, mix, day, dayT, t}
     KW.season(i)    move the year on, with a crossfade
     KW.daylight(v)  0 morning, .55 afternoon, 1 night
     KW.sky()        the current sky pair and how dark it is
     KW.land(t)      sky, hills, the far village, soil and grass
     KW.house(t) .tree(t) .fence(t)
     KW.figure(x,y,t,opts) .basket(x,y,sc,full,spill)
     KW.shadow(x,w,a) .slate(x,y,txt,sc) .coin(x,y,r,a)
     KW.ui           panel helpers
     KW.store(key)   save, load, wipe
     KW.keys(fn)     a keyboard handler that leaves fields alone
     KW.lift(px)     lift the ground line, to leave a band of soil
     KW.start(opts)  {draw:function(t){}, resize:function(){}, lift:px}
   ============================================================ */

window.KW = (function () {
"use strict";

var reduced = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
var FAST = false;
try { FAST = new URLSearchParams(location.search).get("fast") === "1"; } catch (e) {}

function $(id) { return document.getElementById(id); }
function el(tag, cls, txt) {
  var n = document.createElement(tag);
  if (cls) n.className = cls;
  if (txt != null) n.textContent = txt;
  return n;
}
function clamp(v, a, b) { return v < a ? a : v > b ? b : v; }
function lerp(a, b, u) { return a + (b - a) * u; }
function smooth(u) { u = clamp(u, 0, 1); return u * u * (3 - 2 * u); }
function rgb(c, a) { return "rgba(" + (c[0] | 0) + "," + (c[1] | 0) + "," + (c[2] | 0) + "," + (a == null ? 1 : a) + ")"; }
function mix(a, b, u) { return [lerp(a[0], b[0], u), lerp(a[1], b[1], u), lerp(a[2], b[2], u)]; }

/* a small deterministic generator, so that the same year can be
   handed to two different villages and be the same year */
function mulberry(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    var t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

/* ---------- the year ---------- */

var SEASON_NAMES = ["Spring", "Summer", "Autumn", "Winter"];

var SKY_DAY = [
  { top: [178, 200, 214], bot: [238, 226, 206] },
  { top: [162, 192, 214], bot: [240, 230, 198] },
  { top: [196, 196, 188], bot: [242, 210, 158] },
  { top: [186, 200, 214], bot: [224, 226, 224] }
];
var SKY_DUSK = [
  { top: [116, 96, 118], bot: [222, 158, 116] },
  { top: [104, 106, 130], bot: [230, 168, 112] },
  { top: [104, 84, 92], bot: [212, 140, 88] },
  { top: [92, 100, 122], bot: [186, 158, 146] }
];
var SKY_NIGHT = [
  { top: [38, 28, 52], bot: [54, 42, 66] },
  { top: [22, 28, 46], bot: [36, 42, 62] },
  { top: [30, 22, 34], bot: [46, 34, 44] },
  { top: [14, 20, 36], bot: [24, 32, 50] }
];
var HAZE = [[200, 198, 190], [196, 200, 194], [198, 176, 146], [196, 200, 204]];

var GREENS = [[90, 125, 74], [107, 143, 84], [76, 112, 64], [125, 160, 95], [135, 168, 106]];
var AUTUMN = [[200, 132, 46], [178, 91, 40], [217, 154, 60], [163, 74, 34], [194, 106, 36]];
var BLOSSOM = [[232, 180, 200], [242, 210, 221], [223, 160, 184], [240, 198, 212]];
var FROST = [[200, 204, 196]];

var world = { season: 1, prev: 1, mix: 1, day: 0.2, dayT: 0.2, t: 0 };

function sw(k) {
  return (k === world.prev ? (1 - world.mix) : 0) + (k === world.season ? world.mix : 0);
}
function seasonBlend(table, key) {
  var acc = [0, 0, 0];
  for (var k = 0; k < 4; k++) {
    var w = sw(k), c = key ? table[k][key] : table[k];
    acc[0] += c[0] * w; acc[1] += c[1] * w; acc[2] += c[2] * w;
  }
  return acc;
}

/* ---------- the canvas and its measures ---------- */

var M = { W: 0, H: 0, GY: 0, CX: 0, DX: 0, small: false, DPR: 1 };
var cv = null, ctx = null;
var anchorSel = "#panel";
var groundLift = 0;   /* how far above the panel the ground line sits */
var onResize = null, drawGame = null;
var greenLoss = 0;   /* a commons can bleach its own grass: 0 lush, 1 bare */
var showVillage = true;  /* the far houses on the ridge, off where they crowd */

/* ---- seeded furniture ---- */

var treeCanvas = null, treeTips = [], leaves = [], treeW = 0, treeH = 0;
var grassFrames = [], grassKey = -1, grassW = 0, grassLoss = -1;
var farVillage = [];

function buildTree() {
  var rnd = mulberry(20260821);
  treeW = M.small ? 360 : 560;
  treeH = M.small ? 210 : 320;
  treeCanvas = document.createElement("canvas");
  treeCanvas.width = treeW; treeCanvas.height = treeH;
  var g = treeCanvas.getContext("2d");
  treeTips = [];
  var baseX = treeW * 0.5, baseY = treeH;

  function limb(x, y, ang, len, wid, depth) {
    if (depth > 7 || len < 5 || wid < 0.6) { treeTips.push({ x: x, y: y, s: depth / 7 }); return; }
    var a = ang + (rnd() - 0.5) * 0.34;
    var nx = x + Math.cos(a) * len, ny = y + Math.sin(a) * len;
    var bow = (rnd() - 0.5) * len * 0.3;
    g.strokeStyle = "rgb(" + Math.round(lerp(58, 118, depth / 7)) + "," +
                    Math.round(lerp(44, 96, depth / 7)) + "," +
                    Math.round(lerp(30, 70, depth / 7)) + ")";
    g.lineWidth = wid; g.lineCap = "round";
    g.beginPath();
    g.moveTo(x, y);
    g.quadraticCurveTo((x + nx) / 2 - Math.sin(a) * bow, (y + ny) / 2 + Math.cos(a) * bow, nx, ny);
    g.stroke();
    var kids = depth < 2 ? 3 : 2;
    for (var k = 0; k < kids; k++) {
      var na = a + (k - (kids - 1) / 2) * lerp(0.42, 0.86, rnd()) + (rnd() - 0.5) * 0.22;
      limb(nx, ny, na, len * lerp(0.66, 0.82, rnd()), wid * 0.62, depth + 1);
    }
  }
  limb(baseX, baseY, -Math.PI / 2, treeH * 0.25, M.small ? 10 : 14, 0);

  leaves = [];
  var n = M.small ? 320 : 620;
  for (var i = 0; i < n; i++) {
    var tip = treeTips[(rnd() * treeTips.length) | 0];
    var ang = rnd() * 6.283, spread = lerp(4, 30, rnd());
    leaves.push({
      x: tip.x + Math.cos(ang) * spread,
      y: tip.y + Math.sin(ang) * spread * 0.82 - 4,
      sz: lerp(2.6, 5.4, rnd()) * (M.small ? 0.85 : 1),
      gi: (rnd() * GREENS.length) | 0,
      ai: (rnd() * AUTUMN.length) | 0,
      bi: (rnd() * BLOSSOM.length) | 0,
      sway: rnd(), ph: rnd() * 6.283, tilt: rnd() * 6.283,
      keep: rnd()
    });
  }
}

function buildGrass() {
  grassKey = world.prev * 100 + world.season * 10 + Math.round(world.mix * 2);
  grassLoss = Math.round(greenLoss * 4) / 4;
  grassW = Math.max(360, Math.ceil(M.W));
  grassFrames = [];
  var win = sw(3), aut = sw(2), spr = sw(0);
  var bare = grassLoss;
  for (var f = 0; f < 3; f++) {
    var c = document.createElement("canvas");
    c.width = grassW; c.height = 24;
    var g = c.getContext("2d");
    g.lineCap = "round";
    var rnd = mulberry(9182 + f * 0);
    var tufts = Math.round(grassW / 9 * (1 - bare * 0.62));
    for (var i = 0; i < tufts; i++) {
      var gx = rnd() * grassW, ph = rnd() * 6.283;
      var blades = 3 + (rnd() * 3 | 0);
      for (var b = 0; b < blades; b++) {
        var bx = gx + (rnd() - 0.5) * 6;
        var hgt = (5 + rnd() * 10) * (1 - bare * 0.5);
        var lean = Math.sin(f / 3 * 6.283 + ph + b * 0.9) * (1.8 + hgt * 0.15);
        var u = rnd();
        var r = Math.round(lerp(lerp(74, 148, u * 0.5), 170, aut * 0.55 + win * 0.72 + bare * 0.5));
        var gg = Math.round(lerp(lerp(106, 138, u), 152, win * 0.75) * (1 - bare * 0.28));
        var bb = Math.round(lerp(lerp(52, 70, u * 0.4), 132, win * 0.85));
        g.strokeStyle = "rgba(" + r + "," + gg + "," + bb + ",.86)";
        g.lineWidth = 1.25 - hgt * 0.028;
        g.beginPath();
        g.moveTo(bx, 23);
        g.bezierCurveTo(bx + lean * 0.15, 23 - hgt * 0.45,
                        bx + lean * 0.6, 23 - hgt * 0.85,
                        bx + lean + (rnd() - 0.5) * 3, 23 - hgt);
        g.stroke();
      }
      if (rnd() < 0.09 * Math.max(0, 1 - win * 1.4) * (1 - aut * 0.5) * (1 - bare)) {
        var fx = gx + 2, fy = 23 - 8 - rnd() * 4;
        g.strokeStyle = "rgba(88,118,60,.8)"; g.lineWidth = 0.9;
        g.beginPath(); g.moveTo(fx, 23); g.lineTo(fx, fy + 2); g.stroke();
        g.fillStyle = rnd() < 0.5 ? "rgba(246,242,230,.95)" : "rgba(232,196,90,.95)";
        for (var pe = 0; pe < 5; pe++) {
          var pa = pe * 1.257 + f;
          g.beginPath();
          g.ellipse(fx + Math.cos(pa) * 2, fy + Math.sin(pa) * 2, 1.4, 0.85, pa, 0, 6.283);
          g.fill();
        }
        g.fillStyle = spr > 0.4 ? "rgba(240,170,60,.9)" : "rgba(120,90,40,.9)";
        g.beginPath(); g.arc(fx, fy, 1.1, 0, 6.283); g.fill();
      }
    }
    grassFrames.push(c);
  }
}

function buildFarVillage() {
  var rnd = mulberry(4711);
  farVillage = [];
  for (var i = 0; i < 6; i++) {
    farVillage.push({ u: 0.05 + i * 0.165 + (rnd() - 0.5) * 0.05, w: 16 + rnd() * 14, h: 12 + rnd() * 12, lit: rnd() });
  }
}

function layout() {
  var a = document.querySelector(anchorSel);
  var top = a ? a.getBoundingClientRect().top : M.H * 0.7;
  M.GY = clamp(top - 10 - groundLift, M.H * 0.34, M.H * 0.84);
  M.CX = M.W * 0.5;
  M.DX = M.small ? Math.min(66, M.W * 0.19) : Math.min(140, M.W * 0.15);
}

function resize() {
  M.DPR = Math.min(2, window.devicePixelRatio || 1);
  M.W = window.innerWidth; M.H = window.innerHeight;
  M.small = M.W < 700;
  cv.width = Math.round(M.W * M.DPR); cv.height = Math.round(M.H * M.DPR);
  cv.style.width = M.W + "px"; cv.style.height = M.H + "px";
  ctx.setTransform(M.DPR, 0, 0, M.DPR, 0, 0);
  layout();
  buildTree(); buildGrass(); buildFarVillage();
  if (onResize) onResize();
  frameOnce();
}

/* ---------- painting ---------- */

function shadow(x, w, a) {
  ctx.save();
  ctx.translate(x, M.GY + 1);
  ctx.scale(1, 0.2);
  var g = ctx.createRadialGradient(0, 0, 0, 0, 0, w);
  g.addColorStop(0, "rgba(20,14,8," + a + ")");
  g.addColorStop(1, "rgba(20,14,8,0)");
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.arc(0, 0, w, 0, 6.283); ctx.fill();
  ctx.restore();
}

function skyPair() {
  var d = world.dayT;
  var day = seasonBlend(SKY_DAY, "top"), dayB = seasonBlend(SKY_DAY, "bot");
  var dusk = seasonBlend(SKY_DUSK, "top"), duskB = seasonBlend(SKY_DUSK, "bot");
  var night = seasonBlend(SKY_NIGHT, "top"), nightB = seasonBlend(SKY_NIGHT, "bot");
  var top, bot;
  if (d < 0.6) { var u = smooth(d / 0.6); top = mix(day, dusk, u); bot = mix(dayB, duskB, u); }
  else { var v = smooth((d - 0.6) / 0.4); top = mix(dusk, night, v); bot = mix(duskB, nightB, v); }
  return { top: top, bot: bot, night: clamp((d - 0.55) / 0.35, 0, 1) };
}

function drawSky(t) {
  var W = M.W, H = M.H, GY = M.GY, small = M.small;
  var sk = skyPair();
  var g = ctx.createLinearGradient(0, 0, 0, GY + 40);
  g.addColorStop(0, rgb(sk.top));
  g.addColorStop(1, rgb(sk.bot));
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);

  if (sk.night > 0.08) {
    var rnd = mulberry(3311);
    ctx.save();
    for (var i = 0; i < (small ? 46 : 90); i++) {
      var sx = rnd() * W, sy = rnd() * GY * 0.72;
      var tw = 0.45 + Math.sin(t * (0.8 + rnd() * 1.6) + i) * 0.35;
      ctx.fillStyle = "rgba(236,232,216," + (sk.night * tw * 0.8) + ")";
      ctx.fillRect(sx, sy, 1.5, 1.5);
    }
    ctx.restore();
  }

  var sunU = world.dayT;
  var arcX = W * (0.24 + sunU * 0.6);
  var arcY = GY * (0.26 + Math.pow(clamp((sunU - 0.1) / 0.8, 0, 1), 1.7) * 0.56);
  var sunA = 1 - clamp((sunU - 0.55) / 0.28, 0, 1);
  if (sunA > 0.02) {
    var warm = mix([250, 240, 212], [244, 168, 96], smooth(clamp((sunU - 0.25) / 0.4, 0, 1)));
    var hg = ctx.createRadialGradient(arcX, arcY, 0, arcX, arcY, GY * 0.5);
    hg.addColorStop(0, rgb(warm, 0.3 * sunA));
    hg.addColorStop(1, rgb(warm, 0));
    ctx.fillStyle = hg;
    ctx.fillRect(arcX - GY * 0.5, arcY - GY * 0.5, GY, GY);
    ctx.fillStyle = rgb(warm, 0.95 * sunA);
    ctx.beginPath(); ctx.arc(arcX, arcY, small ? 13 : 17, 0, 6.283); ctx.fill();
  }
  if (sk.night > 0.2) {
    var mx = W * 0.78, my = GY * 0.2;
    ctx.fillStyle = "rgba(238,236,222," + (0.9 * sk.night) + ")";
    ctx.beginPath(); ctx.arc(mx, my, small ? 11 : 14, 0, 6.283); ctx.fill();
    ctx.fillStyle = rgb(sk.top, 0.85 * sk.night);
    ctx.beginPath(); ctx.arc(mx + 5, my - 4, small ? 10 : 13, 0, 6.283); ctx.fill();
  }

  if (sk.night < 0.6 && sw(3) < 0.7) {
    var bn = small ? 3 : 5;
    ctx.strokeStyle = "rgba(70,60,48," + (0.45 * (1 - sk.night)) + ")";
    ctx.lineWidth = 1.2;
    for (var bi = 0; bi < bn; bi++) {
      var ba = t * (0.16 + bi * 0.03) + bi * 2.1;
      var brr = (small ? 26 : 44) + bi * (small ? 7 : 11);
      var bx2 = W * 0.68 + Math.cos(ba) * brr;
      var by2 = GY * 0.34 + Math.sin(ba) * brr * 0.4 - bi * 7;
      var bf = reduced ? 1.4 : Math.sin(t * 5 + bi * 2.4) * 2.2;
      ctx.beginPath();
      ctx.moveTo(bx2 - 5, by2);
      ctx.quadraticCurveTo(bx2 - 2.5, by2 - 3 - bf, bx2, by2);
      ctx.quadraticCurveTo(bx2 + 2.5, by2 - 3 - bf, bx2 + 5, by2);
      ctx.stroke();
    }
  }

  var cloudA = 0.5 * (1 - sk.night * 0.7);
  if (cloudA > 0.02) {
    var cl = [[0.09, 0.16, 1.15, 13], [0.42, 0.10, 0.85, 9], [0.72, 0.22, 1.0, 17]];
    for (var c = 0; c < 3; c++) {
      var cx = ((t * cl[c][3] * 0.35 + cl[c][0] * (W + 400)) % (W + 400)) - 200;
      var cy = GY * cl[c][1];
      var s = cl[c][2] * (small ? 0.7 : 1);
      ctx.fillStyle = "rgba(248,245,236," + (cloudA * 0.62) + ")";
      for (var p = 0; p < 5; p++) {
        ctx.beginPath();
        ctx.ellipse(cx + p * 26 * s, cy + Math.sin(p * 1.7) * 5 * s,
                    (26 - Math.abs(p - 2) * 6) * s, (13 - Math.abs(p - 2) * 2.4) * s, 0, 0, 6.283);
        ctx.fill();
      }
    }
  }
}

function hill(y, amp, freq, ph, col) {
  ctx.fillStyle = col;
  ctx.beginPath();
  ctx.moveTo(-20, M.H);
  for (var x = -20; x <= M.W + 20; x += 10) {
    ctx.lineTo(x, y + Math.sin(x * freq * 6.28 + ph) * amp * 0.4 + Math.sin(x * freq * 17 + ph * 1.7) * amp * 0.2);
  }
  ctx.lineTo(M.W + 20, M.H);
  ctx.closePath(); ctx.fill();
}

function drawLand(t, opts) {
  opts = opts || {};
  var W = M.W, H = M.H, GY = M.GY, small = M.small;
  var sk = skyPair();
  var hz = seasonBlend(HAZE);
  hz = mix(hz, [40, 44, 58], sk.night * 0.75);

  hill(GY - (small ? 42 : 66), small ? 16 : 26, 0.0011, 8, rgb(hz, 0.34));

  if (opts.village !== false && showVillage) {
    for (var i = 0; i < farVillage.length; i++) {
      var v = farVillage[i];
      var vx = v.u * W, vy = GY - (small ? 18 : 27), vw = v.w * (small ? 0.4 : 0.58), vh = v.h * (small ? 0.4 : 0.58);
      ctx.fillStyle = rgb(mix(hz, [52, 42, 30], 0.82), 0.9);
      ctx.fillRect(vx, vy - vh, vw, vh);
      ctx.beginPath();
      ctx.moveTo(vx - 3, vy - vh); ctx.lineTo(vx + vw / 2, vy - vh - vh * 0.5); ctx.lineTo(vx + vw + 3, vy - vh);
      ctx.closePath(); ctx.fill();
      if (sk.night > 0.25 && v.lit > 0.3) {
        ctx.fillStyle = "rgba(240,196,110," + (0.75 * sk.night) + ")";
        ctx.fillRect(vx + vw * 0.35, vy - vh * 0.6, 2.2, 2.2);
      }
    }
  }
  hill(GY - (small ? 16 : 26), small ? 10 : 15, 0.0017, 40, rgb(hz, 0.62));

  var fog = ctx.createLinearGradient(0, GY - (small ? 60 : 92), 0, GY);
  fog.addColorStop(0, rgb(hz, 0));
  fog.addColorStop(1, rgb(hz, 0.3));
  ctx.fillStyle = fog;
  ctx.fillRect(0, GY - (small ? 60 : 92), W, small ? 60 : 92);

  var soil = ctx.createLinearGradient(0, GY, 0, H);
  var s0 = mix([64, 52, 36], [26, 24, 38], sk.night * 0.7);
  var s1 = mix([44, 33, 21], [16, 16, 28], sk.night * 0.7);
  soil.addColorStop(0, rgb(s0));
  soil.addColorStop(1, rgb(s1));
  ctx.fillStyle = soil;
  ctx.fillRect(0, GY, W, H - GY);

  var want = world.prev * 100 + world.season * 10 + Math.round(world.mix * 2);
  if (grassKey !== want || grassW < W || grassLoss !== Math.round(greenLoss * 4) / 4) buildGrass();
  var ph = reduced ? 0 : (Math.sin(t * 0.9) * 0.5 + 0.5);
  var f0 = Math.floor(ph * 3) % 3, f1 = (f0 + 1) % 3, u = (ph * 3) % 1;
  ctx.save();
  ctx.globalAlpha = 1;
  ctx.drawImage(grassFrames[f0], 0, GY - 22, grassW, 24);
  ctx.globalAlpha = u;
  ctx.drawImage(grassFrames[f1], 0, GY - 22, grassW, 24);
  ctx.globalAlpha = 1;
  if (sk.night > 0.03) {
    ctx.fillStyle = "rgba(22,25,42," + (0.4 * sk.night) + ")";
    ctx.fillRect(0, GY - 22, W, H - GY + 22);
  }
  ctx.restore();
}

function drawHouse(t, ux) {
  var W = M.W, GY = M.GY, small = M.small;
  var sk = skyPair();
  var s = small ? 0.76 : 1.05;
  var hx = ux == null ? (small ? W * 0.17 : W * 0.145) : ux, hy = GY;
  ctx.save();
  ctx.translate(hx, hy);
  ctx.scale(s, s);

  var lit = Math.max(sk.night, sw(3) * 0.22);

  if (sw(3) > 0.35 || sw(2) > 0.5 || sk.night > 0.25) {
    for (var m = 0; m < 3; m++) {
      var st = ((reduced ? 0.4 : t * 0.22) + m * 0.33) % 1;
      ctx.fillStyle = "rgba(200,195,185," + (0.2 * (1 - st)) + ")";
      ctx.beginPath();
      ctx.arc(28 + Math.sin(st * 5 + m) * 6, -102 - st * 34, 4 + st * 7, 0, 6.283);
      ctx.fill();
    }
  }

  shadow(0, 60, 0.3 * (1 - sk.night * 0.5));

  ctx.fillStyle = "#4a4038";
  ctx.fillRect(-48, -7, 96, 7);
  ctx.fillStyle = "rgba(120,110,96,.5)";
  for (var f = 0; f < 6; f++) {
    ctx.beginPath(); ctx.ellipse(-40 + f * 16, -3.5, 6.5, 2.6, 0, 0, 6.283); ctx.fill();
  }

  var wg = ctx.createLinearGradient(0, -72, 0, -7);
  wg.addColorStop(0, "#67503a");
  wg.addColorStop(1, "#523d29");
  ctx.fillStyle = wg;
  ctx.fillRect(-46, -72, 92, 65);
  for (var pl = 1; pl < 6; pl++) {
    var py = -72 + pl * 11;

function drawTree(t, ux, scale) {
  if (!treeCanvas) return;
  var W = M.W, GY = M.GY, small = M.small;
  var sk = skyPair();
  var s = (small ? 0.74 : 0.98) * (scale || 1);
  var tx = ux == null ? (small ? W * 0.82 : W * 0.83) : ux, ty = GY;
  ctx.save();
  ctx.translate(tx, ty);
  ctx.scale(s, s);
  shadow(0, treeW * 0.24, 0.26 * (1 - sk.night * 0.5));
  ctx.drawImage(treeCanvas, -treeW / 2, -treeH);
  var gust = reduced ? 0 : (0.5 + Math.sin(t * 0.5) * 0.5);
  var win = sw(3), aut = sw(2), spr = sw(0);
  for (var i = 0; i < leaves.length; i++) {
    var L = leaves[i];
    if (win > 0.5 && L.keep > 1 - (win - 0.5) * 1.6) continue;
    var col = GREENS[L.gi];
    if (aut > 0) col = mix(col, AUTUMN[L.ai], aut * 0.92);
    if (spr > 0 && L.gi % 3 === 0) col = mix(col, BLOSSOM[L.bi], spr * 0.9);
    if (win > 0) col = mix(col, FROST[0], win * 0.7);
    if (sk.night > 0) col = mix(col, [30, 34, 46], sk.night * 0.62);
    var sway = reduced ? 0 : Math.sin(t * 1.6 + L.ph) * (1.2 + L.sway * 5) * (0.4 + gust * 0.6);
    ctx.save();
    ctx.translate(-treeW / 2 + L.x + sway, -treeH + L.y);
    ctx.rotate(L.tilt + sway * 0.03);
    ctx.fillStyle = rgb(col);
    ctx.beginPath();
    ctx.moveTo(0, -L.sz);
    ctx.quadraticCurveTo(L.sz * 0.7, -L.sz * 0.2, 0, L.sz);
    ctx.quadraticCurveTo(-L.sz * 0.7, -L.sz * 0.2, 0, -L.sz);
    ctx.fill();
    ctx.restore();
  }
  ctx.restore();
}

function drawFence(t, ux) {
  var GY = M.GY, small = M.small;
  var sk = skyPair();
  var n = 6;
  var cx = ux == null ? M.CX : ux;
  var bx = cx, by = GY + (small ? 22 : 34);
  var tx = cx + (small ? 16 : 26), ty = GY - (small ? 34 : 54);
  var pts = [];
  for (var i = 0; i < n; i++) {
    var u = i / (n - 1);
    pts.push({ x: lerp(bx, tx, u), y: lerp(by, ty, u), h: lerp(small ? 34 : 52, small ? 13 : 20, u), w: lerp(4.4, 1.8, u) });
  }
  var dark = sk.night;
  var post = mix([103, 80, 58], [34, 32, 44], dark * 0.7);
  var rail = mix([120, 96, 68], [40, 38, 50], dark * 0.7);
  var levels = [0.74, 0.5, 0.26];
  for (var r = 0; r < levels.length; r++) {
    ctx.fillStyle = rgb(rail, 0.95);
    ctx.beginPath();
    for (var j = 0; j < n; j++) {
      var p = pts[j], th = lerp(4.2, 1.6, j / (n - 1));
      var yy = p.y - p.h * levels[r];
      if (j === 0) ctx.moveTo(p.x, yy - th / 2); else ctx.lineTo(p.x, yy - th / 2);
    }
    for (var j2 = n - 1; j2 >= 0; j2--) {
      var p2 = pts[j2], th2 = lerp(4.2, 1.6, j2 / (n - 1));
      ctx.lineTo(p2.x, p2.y - p2.h * levels[r] + th2 / 2);
    }
    ctx.closePath(); ctx.fill();
  }
  for (var k = 0; k < n; k++) {
    var q = pts[k];
    ctx.fillStyle = rgb(post, 0.98);
    ctx.fillRect(q.x - q.w / 2, q.y - q.h, q.w, q.h);
    ctx.fillStyle = "rgba(20,14,8,.32)";
    ctx.fillRect(q.x - q.w / 2, q.y - q.h, q.w * 0.34, q.h);
    ctx.fillStyle = rgb(mix(post, [180, 156, 120], 0.35), 0.95);
    ctx.fillRect(q.x - q.w / 2, q.y - q.h, q.w, 1.4);
  }
  return pts[0];
}

/* ---------- the people ---------- */

function drawFigure(x, y, t, o) {
  var s = (o.scale || 1) * (M.small ? 1.6 : 2.05);

  ctx.scale(s, s);

  ctx.strokeStyle = dk("#17110c"); ctx.lineWidth = 2.2;
  ctx.beginPath(); ctx.moveTo(-2 + step * 4.4, 0); ctx.lineTo(1.2 + step * 4.4, 0); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(2 - step * 4.4, 0); ctx.lineTo(5.2 - step * 4.4, 0); ctx.stroke();

  ctx.strokeStyle = coat; ctx.lineWidth = o.stout ? 6.2 : 5;

  } else if (o.pose === "withhold") {

    ctx.beginPath(); ctx.moveTo(0, -28); ctx.lineTo(5, -24); ctx.lineTo(2, -20); ctx.stroke();

    ctx.beginPath(); ctx.moveTo(0, -29); ctx.lineTo(-4, -24); ctx.lineTo(-5, -20); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(0, -29); ctx.lineTo(6, -33); ctx.lineTo(9 + wa * 2, -39 + Math.abs(wa)); ctx.stroke();
    ctx.fillStyle = skin;
    ctx.beginPath(); ctx.arc(9.6 + wa * 2, -40 + Math.abs(wa), 1.7, 0, 6.283); ctx.fill();
  } else if (o.pose === "hold") {

    ctx.beginPath(); ctx.moveTo(0, -29); ctx.lineTo(4, -27); ctx.lineTo(6, -31); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(0, -28); ctx.lineTo(-4, -26); ctx.lineTo(-6, -30); ctx.stroke();

    ctx.beginPath(); ctx.moveTo(0, -27); ctx.lineTo(3, -23); ctx.lineTo(6, -24); ctx.stroke();
  } else if (o.pose === "sit") {
    ctx.beginPath(); ctx.moveTo(0, -29); ctx.lineTo(5, -26); ctx.lineTo(8, -24); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(0, -28); ctx.lineTo(-4, -25); ctx.lineTo(-2, -22); ctx.stroke();

    var swing = step * 2.4;
    ctx.beginPath(); ctx.moveTo(0, -29); ctx.lineTo(-2 - swing, -24); ctx.lineTo(-2.5 - swing, -19); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(0, -29); ctx.lineTo(2 + swing, -24); ctx.lineTo(2.5 + swing, -19); ctx.stroke();

    ctx.strokeStyle = hair; ctx.lineWidth = 2.2; ctx.lineCap = "round";

    ctx.beginPath(); ctx.moveTo(-4.4, -0.4); ctx.quadraticCurveTo(-7 + bw, 4, -5.4 + bw, 9); ctx.stroke();
  } else if (hs === "crop") {

  } else if (hs === "cap") {
    ctx.beginPath(); ctx.arc(0, -0.6, 5.1, Math.PI, 0); ctx.fill();
    ctx.fillStyle = dk(o.capCol || "#5b7d8a");
    ctx.beginPath(); ctx.arc(0, -1.2, 5.2, Math.PI, 0); ctx.fill();
    ctx.fillRect(-7.4, -1.6, 9, 1.5);
  } else if (hs === "hat") {
    ctx.beginPath(); ctx.arc(0, -0.6, 4.9, Math.PI, 0); ctx.fill();
    ctx.fillStyle = dk(o.capCol || "#6b5334");
    ctx.fillRect(-8, -4.6, 16, 1.8);
    ctx.fillRect(-4.2, -10, 8.4, 5.6);

  ctx.beginPath(); ctx.arc(0.6, 1, 1.8, 0.3, 2.0); ctx.stroke();
  ctx.restore();

  if (o.prop === "stick") {

  } else if (o.prop === "spear") {
    ctx.strokeStyle = dk("#6b5334"); ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(9, -30); ctx.lineTo(11, 1); ctx.stroke();
    ctx.fillStyle = dk("#6f6759");
    ctx.beginPath(); ctx.moveTo(9, -30); ctx.lineTo(11.4, -36); ctx.lineTo(11.6, -29.6); ctx.closePath(); ctx.fill();
  } else if (o.prop === "dog") {
    ctx.save();
    ctx.translate(-13, 0);
    ctx.fillStyle = dk("#5a4a34");
    ctx.beginPath(); ctx.ellipse(0, -5, 5.4, 3.2, 0, 0, 6.283); ctx.fill();
    ctx.beginPath(); ctx.arc(5, -8.4, 2.8, 0, 6.283); ctx.fill();
    ctx.strokeStyle = dk("#5a4a34"); ctx.lineWidth = 1.6; ctx.lineCap = "round";
    ctx.beginPath(); ctx.moveTo(-3, -3); ctx.lineTo(-3.4, 0); ctx.moveTo(3, -3); ctx.lineTo(3.4, 0); ctx.stroke();
    var tw = reduced ? 0 : Math.sin(t * 6) * 2.4;
    ctx.beginPath(); ctx.moveTo(-5, -6); ctx.lineTo(-8, -9 + tw); ctx.stroke();

}

/* ---------- weather ---------- */

var motes = [];
function stepMotes(t, dt) {
  var win = sw(3), spr = sw(0), aut = sw(2);
  var want = reduced ? 0 : Math.round(win * (M.small ? 30 : 60) + spr * (M.small ? 12 : 22) + aut * (M.small ? 14 : 26));
  while (motes.length < want) {
    motes.push({ x: Math.random() * M.W, y: Math.random() * M.GY, vx: (Math.random() - 0.5) * 12,
                 vy: 12 + Math.random() * 26, r: 1 + Math.random() * 2.2, ph: Math.random() * 6.28 });
  }
  while (motes.length > want) motes.pop();
  for (var i = 0; i < motes.length; i++) {
    var m = motes[i];
    m.y += m.vy * dt;
    m.x += (m.vx + Math.sin(t * 1.4 + m.ph) * 14) * dt;
    if (m.y > M.GY - 2) { m.y = -6; m.x = Math.random() * M.W; }
    if (m.x < -10) m.x = M.W + 8; else if (m.x > M.W + 10) m.x = -8;
  }
}
function drawMotes() {
  var win = sw(3), spr = sw(0), aut = sw(2);
  var col = win > Math.max(spr, aut) ? [236, 240, 240] : spr > aut ? [238, 196, 214] : [196, 120, 52];
  var sk = skyPair();
  ctx.fillStyle = rgb(mix(col, [60, 62, 80], sk.night * 0.5), 0.7);
  for (var i = 0; i < motes.length; i++) {
    var m = motes[i];
    ctx.beginPath(); ctx.arc(m.x, m.y, m.r, 0, 6.283); ctx.fill();
  }
}

/* ---------- the loop ---------- */

var lastT = 0;
function paint(t) {
  ctx.setTransform(M.DPR, 0, 0, M.DPR, 0, 0);
  drawSky(t);
  drawLand(t);
  if (drawGame) drawGame(t);
  drawMotes();
  var v = ctx.createRadialGradient(M.W / 2, M.GY * 0.55, M.GY * 0.4, M.W / 2, M.GY * 0.6, Math.max(M.W, M.H) * 0.8);
  v.addColorStop(0, "rgba(0,0,0,0)");
  v.addColorStop(1, "rgba(10,10,16,.26)");
  ctx.fillStyle = v;
  ctx.fillRect(0, 0, M.W, M.H);
}
function frameOnce() { paint(world.t); }
function frame(now) {
  var tt = now / 1000;
  var dt = Math.min(0.05, tt - lastT || 0.016);
  lastT = tt;
  if (!reduced) world.t = tt;
  if (world.mix < 1) world.mix = Math.min(1, world.mix + dt * (reduced ? 4 : 0.9));
  world.dayT += (world.day - world.dayT) * (reduced ? 1 : Math.min(1, dt * 1.6));
  stepMotes(world.t, dt);
  paint(world.t);
  requestAnimationFrame(frame);
}

/* ---------- the interface, in ordinary HTML ---------- */

var ui = {
  panel: null, live: null,
  say: function (msg) { if (ui.live) ui.live.textContent = msg; },
  top: function (title, when) {

  sub: function (txt) { var h = el("h3", null, txt); ui.panel.appendChild(h); return h; },
  kick: function (txt) { var k = el("p", "kicker", txt); ui.panel.appendChild(k); return k; },
  list: function (items, cls) {
    var u = el("ul", cls || null);
    items.forEach(function (s) { u.appendChild(el("li", null, s)); });
    ui.panel.appendChild(u);
    return u;
  },
  actions: function () { var r = el("div", "row"); ui.panel.appendChild(r); return r; },
  btn: function (row, label, key, fn, cls) {
    var b = el("button", cls || null);
    b.appendChild(document.createTextNode(label));

  },
  meter: function (label, u, value, good) {

    d.appendChild(bar);
    d.appendChild(el("span", "n", value));
    ui.panel.appendChild(d);
    return d;
  },
  glyphs: function (parts) {
    var d = el("p", "glyphs");
    parts.forEach(function (p) {
      var s = el("span", p.cls || null, p.txt);

    });
    ui.panel.appendChild(d);
    return d;
  },
  sources: function (items) {
    var u = el("ul", "sources");
    items.forEach(function (it) {
      var li = el("li");
      li.appendChild(el("b", null, it.what));
      li.appendChild(document.createTextNode(" " + it.cite + " "));
      var a = el("a", null, it.url);
      a.href = it.url; a.rel = "noopener noreferrer";
      li.appendChild(a);
      if (it.tail) li.appendChild(document.createTextNode(" " + it.tail));
      u.appendChild(li);
    });
    ui.panel.appendChild(u);
    return u;
  },
  acted: false,
  reading: {},
  focusFirst: function (viewName) {
    ui.panel.scrollTop = 0;
    if (!ui.acted) return;
    if (ui.reading[viewName]) { ui.panel.focus({ preventScroll: true }); return; }
    var b = ui.panel.querySelector("button:not([disabled])");
    if (b) b.focus({ preventScroll: true });
  }
};

function store(key) {
  return {
    save: function (o) { try { localStorage.setItem(key, JSON.stringify(o)); } catch (e) {} },
    load: function () {
      try {
        var raw = localStorage.getItem(key);
        return raw ? JSON.parse(raw) : null;
      } catch (e) { return null; }
    },
    wipe: function () { try { localStorage.removeItem(key); } catch (e) {} }
  };
}

function keys(fn) {
  document.addEventListener("keydown", function (e) {
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    var tag = (e.target && e.target.tagName) || "";
    if (tag === "INPUT" || tag === "SELECT" || tag === "TEXTAREA") return;
    fn(String(e.key || "").toLowerCase(), e);
  });
}

function start(opts) {
  opts = opts || {};
  cv = $("world"); ctx = cv.getContext("2d");

  drawGame = opts.draw || null;
  onResize = opts.resize || null;

     panel it writes is what the ground line is measured against */
  if (opts.ready) opts.ready();
  resize();
  requestAnimationFrame(frame);
}

var api = {

  M: M, ctx: null, world: world, SEASONS: SEASON_NAMES,

  layout: layout,
  ui: ui, store: store, keys: keys, start: start
};
return api;
})();

  var s = window.__t ? window.__t(k, en) : en;

function letter(m) { return T(m === "H" ? "mp-l-h" : "mp-l-t", m); }

var ui = KW.ui, ctx = null;
var store = KW.store("kw.pennies.v1");

/* ============================================================
   1. the game itself
   She wins when the two coins agree, you win when they differ.
   There is no pair of fixed choices that either of you would
   stay with, which is what having no equilibrium in pure
   strategies means. The only stable way to play is a coin.
   ============================================================ */

function matched(mine, theirs) { return mine === theirs; }

/* ---- the reader of hands ----
   She keeps a small book: what you did after each pair of calls,
   what you did after each single call, and what you do in general.
   She uses the most specific thing she has enough of. */

function newBook() {
  return { two: {}, one: {}, all: { H: 0, T: 0 }, seen: 0 };
}

function bump(book, ctxKey, move) {
  if (ctxKey.two) {
    if (!book.two[ctxKey.two]) book.two[ctxKey.two] = { H: 0, T: 0 };
    book.two[ctxKey.two][move]++;
  }
  if (ctxKey.one) {
    if (!book.one[ctxKey.one]) book.one[ctxKey.one] = { H: 0, T: 0 };
    book.one[ctxKey.one][move]++;
  }
  book.all[move]++;
  book.seen++;
}

function contextOf(hist) {
  var n = hist.length;
  return {
    two: n >= 2 ? hist[n - 2] + hist[n - 1] : null,
    one: n >= 1 ? hist[n - 1] : null
  };
}

/* the strongest thing she has, or nothing at all */
function predict(book, hist, coin) {
  var c = contextOf(hist), t;
  if (c.two && (t = book.two[c.two]) && (t.H + t.T) >= 2 && t.H !== t.T) {
    return { call: t.H > t.T ? "H" : "T", from: "two" };
  }
  if (c.one && (t = book.one[c.one]) && (t.H + t.T) >= 3 && t.H !== t.T) {
    return { call: t.H > t.T ? "H" : "T", from: "one" };
  }
  if (book.seen >= 6 && book.all.H !== book.all.T) {
    return { call: book.all.H > book.all.T ? "H" : "T", from: "all" };
  }
  return { call: coin() < 0.5 ? "H" : "T", from: "coin" };
}

/* ---- what a run of calls looks like from the outside ---- */

function switchRate(hist) {
  if (hist.length < 2) return 0.5;
  var sw = 0;
  for (var i = 1; i < hist.length; i++) if (hist[i] !== hist[i - 1]) sw++;
  return sw / (hist.length - 1);
}
function longestRun(hist) {
  var best = 0, cur = 0, prev = null;
  for (var i = 0; i < hist.length; i++) {
    cur = hist[i] === prev ? cur + 1 : 1;
    prev = hist[i];
    if (cur > best) best = cur;
  }
  return best;
}

/* ============================================================
   2. state
   ============================================================ */

var BLOCK = 12, BLOCKS = 3, COINROUNDS = 16;

var G = {
  view: "title", block: 1, round: 0, total: 0,
  you: 0, her: 0,
  hist: [], herHist: [], results: [], guessedRight: 0,
  book: newBook(), last: null, coinMode: false, coinRound: 0,
  coinRight: 0, coinYou: 0, coinHer: 0
};

var rnd = KW.mulberry(31337);
var scene = { t0: -99, mine: null, hers: null, show: false, spin: false };

function ease() { return KW.reduced ? 1 : clamp((KW.world.t - scene.t0) / 0.9, 0, 1); }

function save() {
  store.save({ view: G.view, block: G.block, round: G.round, total: G.total,
               you: G.you, her: G.her, hist: G.hist, herHist: G.herHist,
               results: G.results, guessedRight: G.guessedRight, book: G.book });
}

/* ============================================================
   3. the table by the lamp
   ============================================================ */

function drawTable(cx, gy, s) {
  var sk = KW.sky();
  var w = s * 78, h = s * 24;
  ctx.save();
  ctx.translate(cx, gy);
  KW.shadow(0, w * 0.62, 0.28 * (1 - sk.night * 0.4));
  var top = KW.mix([124, 98, 66], [56, 48, 46], sk.night * 0.6);
  var leg = KW.mix([92, 72, 48], [40, 36, 38], sk.night * 0.6);
  ctx.fillStyle = KW.rgb(leg);
  ctx.fillRect(-w / 2 + s * 6, -h, s * 5, h);
  ctx.fillRect(w / 2 - s * 11, -h, s * 5, h);
  ctx.fillStyle = KW.rgb(top);
  ctx.fillRect(-w / 2, -h - s * 6, w, s * 6);
  ctx.fillStyle = "rgba(24,16,8,.3)";
  ctx.fillRect(-w / 2, -h - s * 1.5, w, s * 1.5);
  ctx.restore();
  return { y: gy - h - s * 6, w: w };
}

/* the lamp that makes this a night game */
function drawLamp(x, y, s, t) {
  ctx.save();
  ctx.translate(x, y);
  ctx.scale(s, s);
  var flick = KW.reduced ? 1 : 0.88 + Math.sin(t * 7.3) * 0.12;
  var g = ctx.createRadialGradient(0, -18, 2, 0, -18, 120);
  g.addColorStop(0, "rgba(232,176,84," + (0.3 * flick) + ")");
  g.addColorStop(1, "rgba(232,176,84,0)");
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.arc(0, -18, 120, 0, 6.283); ctx.fill();
  ctx.fillStyle = "#33261a";
  ctx.fillRect(-5, -26, 10, 4);
  ctx.fillRect(-2, -22, 4, 22);
  ctx.fillStyle = "rgba(232,226,210,.3)";
  ctx.fillRect(-6, -20, 12, 14);
  ctx.fillStyle = "#e8b054";
  ctx.beginPath();
  ctx.moveTo(0, -8);
  ctx.quadraticCurveTo(3 * flick, -11, 0, -8 - 7 * flick);
  ctx.quadraticCurveTo(-3 * flick, -11, 0, -8);
  ctx.fill();
  ctx.restore();
}

function drawWorld(t) {
  var M = KW.M;
  KW.house(t, M.small ? M.W * 0.1 : M.W * 0.09);
  var s = M.small ? 0.9 : 1.35;
  var tbl = drawTable(M.CX, M.GY, s);
  drawLamp(M.CX + (M.small ? 30 : 46), tbl.y, s, t);

  var px = M.CX - M.DX, nx = M.CX + M.DX;
  var u = ease();

  KW.shadow(px, 16, 0.24);
  KW.figure(px, M.GY, t, {
    coat: "#8a4a2c", hairStyle: "curly", hair: "#241a12", skin: "#c99a72",
    face: 1, pose: scene.show ? "hold" : "stand"
  });
  KW.shadow(nx, 16, 0.24);
  KW.figure(nx, M.GY, t, {
    coat: "#7a6a8a", hairStyle: "braid", hair: "#3a2a18", skin: "#c99a72",
    face: -1, pose: scene.show ? "hold" : "stand"
  });

  /* the two coins on the table, hers turning over as she uncovers it */
  if (scene.show) {
    var spin = scene.spin && !KW.reduced ? (1 - u) * 22 : 0;
    KW.coin(M.CX - tbl.w * 0.22, tbl.y - s * 6, s * 7, spin);
    KW.coin(M.CX + tbl.w * 0.16, tbl.y - s * 6, s * 7, spin * 1.3);
    ctx.font = "600 " + Math.round(s * 11) + "px 'IBM Plex Mono', monospace";
    ctx.textAlign = "center"; ctx.textBaseline = "middle";
    if (u > 0.75) {
      ctx.fillStyle = "rgba(44,33,21,.8)";
      ctx.fillText(scene.mine ? letter(scene.mine) : "", M.CX - tbl.w * 0.22, tbl.y - s * 6);
      ctx.fillText(scene.hers ? letter(scene.hers) : "", M.CX + tbl.w * 0.16, tbl.y - s * 6);
    }
  }

  /* the last dozen rounds, chalked along the back edge of the table */
  var recent = G.results.slice(-12);
  if (recent.length) {
    var x0 = M.CX - tbl.w * 0.44, step = (tbl.w * 0.88) / 12;
    for (var i = 0; i < recent.length; i++) {
      ctx.fillStyle = recent[i] ? "rgba(150,190,160,.9)" : "rgba(208,132,90,.9)";
      ctx.fillRect(x0 + i * step, tbl.y - s * 4.6, Math.max(2, step * 0.55), 2.4);
    }
  }
}

function runLine() {
  var n = Math.min(16, G.results.length);

  var d = el("p", "run");
  d.appendChild(document.createTextNode(T("mp-run", "The last {n}: ", {n: n})));
  var start = G.results.length - n;
  for (var i = start; i < G.results.length; i++) {
    var mark = el(G.results[i] ? "b" : "i", null, letter(G.hist[i]) + (G.results[i] ? "+" : "-") + " ");
    d.appendChild(mark);
  }
  ui.panel.appendChild(d);
}

  ui.para(T("mp-t-p1", "Mira puts a coin on the table under her hand. You put one under yours. You both uncover at the same moment. If the two coins agree she takes yours, and if they differ you take hers. That is the whole game and there is nothing else in it."));

function reset() {
  G.block = 1; G.round = 0; G.total = 0; G.you = 0; G.her = 0;
  G.hist = []; G.herHist = []; G.results = []; G.guessedRight = 0;
  G.book = newBook(); G.coinMode = false; G.coinRound = 0;
  G.coinRight = 0; G.coinYou = 0; G.coinHer = 0;
  rnd = KW.mulberry(31337);
}

function resume(s) {
  ui.acted = true;
  G.block = s.block || 1; G.round = s.round || 0; G.total = s.total || 0;
  G.you = s.you || 0; G.her = s.her || 0;
  G.hist = s.hist || []; G.herHist = s.herHist || [];
  G.results = s.results || []; G.guessedRight = s.guessedRight || 0;
  G.book = s.book && s.book.all ? s.book : newBook();
  KW.$("menuBtn").hidden = false;
  view(G.total >= BLOCK * BLOCKS ? "coinIntro" : "call");
}

VIEWS.call = function () {
  scene.show = false;
  KW.daylight(0.82 + (G.total / (BLOCK * BLOCKS)) * 0.12);
  ui.top(T("mp-name", "Matching Pennies"), T("mp-when-round", "round {a} of {b}", {a: G.total + 1, b: BLOCK * BLOCKS}));
  ui.kick(T("mp-kick-round", "Round {a}, block {b} of {c}", {a: G.total + 1, b: G.block, c: BLOCKS}));
  ui.head(T("mp-h-call", "Heads or tails"));
  if (G.total === 0) {
    ui.para(T("mp-c-p0", "She wins if the coins agree. You win if they differ. Neither of you can see the other's hand, and neither of you goes first."));
  } else {
    ui.para(G.last && G.last.won
      ? T("mp-c-won", "You took the last one. She has not said anything about it.")
      : T("mp-c-lost", "She took the last one. She is watching your hand rather than your face."));
  }
  var r = ui.actions();
  ui.btn(r, T("mp-b-heads", "Heads"), T("mp-k-h", "press h"), function () { call("H"); }, "big hd");
  ui.btn(r, T("mp-b-tails", "Tails"), T("mp-k-t", "press t"), function () { call("T"); }, "big tl");
  runLine();
  scoreLine();
  ui.say(T("mp-s-call", "Round {n}. Heads or tails.", {n: G.total + 1}));
};

function call(mine) {
  var guess = predict(G.book, G.hist, rnd);
  var hers = guess.call;                 /* she plays what she thinks you will */
  var she = matched(mine, hers);
  if (she) { G.her++; } else { G.you++; }
  if (guess.call === mine) G.guessedRight++;

  bump(G.book, contextOf(G.hist), mine);
  G.hist.push(mine);
  G.herHist.push(hers);
  G.results.push(!she);
  G.last = { mine: mine, hers: hers, won: !she, from: guess.from };
  G.total++; G.round++;

  scene.mine = mine; scene.hers = hers; scene.show = true; scene.spin = true;
  scene.t0 = KW.world.t;
  save();
  view("show");
}

VIEWS.show = function () {
  var r = G.last;
  ui.top(T("mp-name", "Matching Pennies"), T("mp-when-round", "round {a} of {b}", {a: G.total, b: BLOCK * BLOCKS}));
  ui.kick(r.won ? T("mp-kick-yours", "Yours") : T("mp-kick-hers", "Hers"));
  ui.head(r.won ? T("mp-h-differ", "The coins differ") : T("mp-h-agree", "The coins agree"));

  }

         {r: r.won ? T("mp-s-differ", "The coins differ. You take the coin.") : T("mp-s-agree", "The coins agree. She takes the coin."),
          y: G.you, h: G.her}));

function word(m) { return m === "H" ? T("mp-w-h", "heads") : T("mp-w-t", "tails"); }

/* ---- the count between blocks: your own predictability, measured ---- */

VIEWS.blockEnd = function () {
  scene.show = false;
  var acc = G.total ? G.guessedRight / G.total : 0;
  var sr = switchRate(G.hist);
  var lr = longestRun(G.hist);
  ui.top(T("mp-name", "Matching Pennies"), T("mp-when-count", "the count after block {n}", {n: G.block}));
  ui.kick(T("mp-be-kick", "After {n} rounds", {n: G.total}));
  ui.head(G.you > G.her ? T("mp-be-ahead", "You are ahead") : G.you === G.her ? T("mp-be-level", "Level") : T("mp-be-behind", "You are behind"));
  ui.para(T("mp-be-p1", "You have {y} and she has {h}. A coin would give you about {c} each.",
          {y: G.you, h: G.her, c: Math.round(G.total / 2)}));

  ui.meter(T("mp-m-acc", "How often she called it right"), acc, T("mp-of100", "{x} of 100", {x: Math.round(acc * 100)}), acc < 0.55);
  ui.meter(T("mp-m-sw", "How often you changed your call"), sr, T("mp-of100", "{x} of 100", {x: Math.round(sr * 100)}), Math.abs(sr - 0.5) < 0.12);
  ui.meter(T("mp-m-run", "Your longest run of one call"), clamp(lr / 8, 0, 1), String(lr), true);

  if (G.block === 1) {
    ui.para(T("mp-be-b1a", "She keeps a book. What you did after each pair of calls, what you did after each single call, and what you do in general. When one of those is lopsided enough to bet on, she bets on it."));
    ui.para(T("mp-be-b1b", "A coin changes its call about 50 times in 100. People usually change more often than that, because a run of four heads feels wrong even though a coin produces one all the time."));
  } else if (G.block === 2) {
    ui.para(T("mp-be-b2", "The number to watch is the first one. If she is calling it right much more than 50 in 100, something in your hand is readable, and it is almost certainly not a thing you know you are doing."));
  } else {
    ui.para(T("mp-be-b3", "Whatever that first number came out at, it was measured on you, not assumed about you."));
  }

  var r = ui.actions();
  if (G.block >= BLOCKS) {
    ui.btn(r, T("mp-b-coin", "Let a coin play instead"), T("mp-k-go", "go on"), function () { view("coinIntro"); }, "big");
  } else {
    ui.btn(r, T("mp-b-block", "Block {n}", {n: G.block + 1}), T("mp-k-go", "go on"), function () {
      G.block++; G.round = 0; view("call");
    }, "big");
  }
  ui.say(T("mp-s-be", "She called it right {a} times in 100. You changed your call {b} times in 100.",
         {a: Math.round(acc * 100), b: Math.round(sr * 100)}));
};

/* ---- the coin plays your hand ---- */

VIEWS.coinIntro = function () {
  scene.show = false;
  ui.top(T("mp-name", "Matching Pennies"), T("mp-when-coin", "the coin takes over"));
  ui.kick(T("mp-ci-kick", "The last part"));
  ui.head(T("mp-ci-h", "Now let a coin call it"));
  ui.para(T("mp-ci-p1", "The same table and the same reader, except that your call now comes from an actual random source in your own browser rather than from you. Sixteen rounds. She keeps reading, and her book keeps filling."));
  ui.para(T("mp-ci-p2", "Watch the first number."));
  var r = ui.actions();
  ui.btn(r, T("mp-b-run16", "Run the sixteen"), T("mp-k-go", "go on"), function () { runCoin(); }, "big");
  ui.say(T("mp-s-ci", "Sixteen rounds played by a coin instead of by you."));
};

function runCoin() {
  var book = newBook(), hist = [], right = 0, mine, hers, i;
  var you = 0, her = 0;
  var coin = function () { return Math.random(); };
  for (i = 0; i < COINROUNDS; i++) {
    var guess = predict(book, hist, coin);
    mine = Math.random() < 0.5 ? "H" : "T";
    hers = guess.call;
    if (guess.call === mine) right++;
    if (matched(mine, hers)) her++; else you++;
    bump(book, contextOf(hist), mine);
    hist.push(mine);
  }
  G.coinRight = right; G.coinYou = you; G.coinHer = her; G.coinHist = hist;
  view("coinResult");
}

VIEWS.coinResult = function () {
  var acc = G.coinRight / COINROUNDS;
  var youAcc = G.total ? G.guessedRight / G.total : 0;
  ui.top(T("mp-name", "Matching Pennies"), T("mp-when-coindid", "what the coin did"));
  ui.kick(T("mp-cr-kick", "The coin's sixteen"));
  ui.head(T("mp-cr-h", "She read the coin {r} times out of {n}", {r: G.coinRight, n: COINROUNDS}));
  ui.para(T("mp-cr-p1", "The coin won {y} and lost {h}. Her book filled up exactly as before and found nothing in it to use, because there was nothing in it. A source with no habits cannot be exploited, and that is the whole of the good news.", {y: G.coinYou, h: G.coinHer}));
  ui.meter(T("mp-m-coin", "She read the coin"), acc, T("mp-of100", "{x} of 100", {x: Math.round(acc * 100)}), acc < 0.6);
  ui.meter(T("mp-m-you2", "She read you"), youAcc, T("mp-of100", "{x} of 100", {x: Math.round(youAcc * 100)}), youAcc < 0.55);
  ui.para(T("mp-cr-p2", "Sixteen rounds is a small number and this one run proves nothing on its own. Run it again and it will land somewhere else near the middle."));
  var r = ui.actions();
  ui.btn(r, T("mp-b-again16", "Run another sixteen"), T("mp-k-again", "again"), function () { runCoin(); }, "quiet");
  ui.btn(r, T("mp-b-about", "What this was about"), T("mp-k-go", "go on"), function () { view("ending"); }, "big");
  ui.say(T("mp-s-cr", "She read the coin {r} times out of {n}.", {r: G.coinRight, n: COINROUNDS}));
};

/* ============================================================
   5. the ending
   ============================================================ */

VIEWS.ending = function () {
  scene.show = false;
  KW.daylight(0.94);
  var acc = G.total ? G.guessedRight / G.total : 0;
  var sr = switchRate(G.hist);
  ui.top(T("mp-name", "Matching Pennies"), T("mp-when-arg", "the argument, plainly"));
  ui.kick(T("mp-e-kick", "The end of it"));
  ui.head(T("mp-e-h", "Sometimes the correct move is to have no reasons"));

  ui.para(T("mp-e-p1", "There is no pair of fixed calls that both of you would stay with. If you always call heads she calls heads and takes everything. If you always alternate she learns the alternation and takes everything. Every rule you could write down is a rule she can read, and the moment she reads it the rule is worse than useless."));
  ui.para(T("mp-e-p2", "What is left is the mixture: heads half the time, tails half the time, and no pattern connecting one round to the next. Against that she can do nothing at all, and against anything else she can do something. That is what a mixed strategy is, and this kind of game is why the idea had to be invented."));
  ui.para(T("mp-e-p3", "It is also the one strategy people cannot carry out. Over your {n} rounds she called it right {a} times in 100 and you changed your call {b} times in 100, against the 50 a coin would give.",
          {n: G.total, a: Math.round(acc * 100), b: Math.round(sr * 100)}));

  ui.sub(T("mp-e-sub1", "What is known about people doing this"));
  ui.para(T("mp-e-p4", "The usual finding is not that people are lazy about it. It is that they alternate too much. Long runs of the same call feel wrong, so they get avoided, and avoiding them is itself a pattern."));
  ui.para(T("mp-e-p5", "Walker and Wooders looked at the serve directions of professional tennis players in classic matches, a real game with the same structure as this one and with a great deal at stake. The proportions were close to what the theory says. The sequences were not: the players switch their serves from left to right and vice versa somewhat too often to be consistent with random play."));
  ui.para(T("mp-e-p6", "A laboratory study using a complexity measure found the same bias, an underrepresentation of long runs, and something more cheerful with it: in a competitive game setting people can reach levels of randomness that are statistically indistinguishable from a computer generator, though the ability does not follow them out of the game."));

  ui.sub(T("mp-e-sub2", "What this does not show"));
  ui.list([
    T("mp-e-l1", "Mira is a small counting rule over pairs of your last calls. A better reader would find patterns she cannot, and a person across a real table would read your face as well as your hand."),
    T("mp-e-l2", "Her book is never cleared, so early rounds keep influencing her long after you have changed how you play. That makes her slow rather than clever."),
    T("mp-e-l3", "The measurements on this page are taken over a few dozen rounds. That is far too short to say anything about you as a person, and a run of bad luck looks exactly like a habit."),

  ]);

  ui.sub(T("mp-e-src", "Sources"));
  ui.sources([
    { what: T("mp-src1", "Mixed strategies in a real conflict."),
      cite: "Mark Walker and John Wooders, Minimax Play at Wimbledon, American Economic Review 91(5), December 2001, pages 1521 to 1538. Author's copy of the paper.",
      url: "https://www.johnwooders.com/papers/Wimbledon.pdf",
      tail: T("mp-src-tail", "Read 2026 08 21.") },
    { what: T("mp-src2", "How well people generate random sequences."),
      cite: "Alice Wong, Gabriel Merholz and Uri Maoz, Characterizing human random sequence generation in competitive and non competitive environments using Lempel Ziv complexity, Scientific Reports 11, article 20662, 2021.",
      url: "https://www.nature.com/articles/s41598-021-99967-6",
      tail: T("mp-src-tail", "Read 2026 08 21.") },
    { what: T("mp-src3", "Equilibrium in mixed strategies."),
      cite: "John F. Nash, Equilibrium Points in n Person Games, Proceedings of the National Academy of Sciences 36(1), 1950, pages 48 and 49.",
      url: "https://pmc.ncbi.nlm.nih.gov/articles/PMC1063129/",
      tail: T("mp-src-tail", "Read 2026 08 21.") }
  ]);

  var p = el("p");
  p.appendChild(document.createTextNode(T("mp-fam", "The rest of the family, including one where both of you can win at the same time: ")));
  var a = el("a", null, T("mp-fam-a", "all of the games are here"));
  a.href = "../../game.html";
  p.appendChild(a);
  p.appendChild(document.createTextNode("."));
  ui.panel.appendChild(p);

  var r = ui.actions();
  ui.btn(r, T("mp-b-sitagain", "Sit down again"), T("mp-k-again", "again"), function () {
    store.wipe(); reset(); view("call");
  }, "big");
  ui.say(T("mp-s-end", "The ending. The only unexploitable way to play is a genuine coin, and people are not one."));
};

KW.keys(function (k) {

    l = String(l).toLowerCase();
    if (l.indexOf("de") === 0) return "de";
    if (l.indexOf("tr") === 0) return "tr";
    return "en";
  }
  try { lang = localStorage.getItem(KEY) || preferred(); } catch (e) { lang = preferred(); }
  var base = {}, baseA = {}, baseT = {}, baseP = {}, titleBase = null;
  /* One dictionary per language, rebuilt on every pass, so a page that
     declares its own words later is still heard. */
  function dict(l){
    var out = {}, src = [window.CHROME_I18N, window.PAGE_I18N], i, k;
    for (i = 0; i < src.length; i++){
      if (src[i] && src[i][l]) for (k in src[i][l]) out[k] = src[i][l][k];
    }
    return out;
  }
  /* Three languages exist and nothing else is one. Asking the dictionary
     whether it has a key called l was the test, and CHROME_I18N["constructor"]
     is truthy, so a value planted in localStorage became window.__lang and
     every number on the instrument threw. The generated pages were fixed and
     these twenty were not; they are the same rule. */
  var descBase = null;
  function known(l){ return l === "en" || l === "tr" || l === "de"; }
  function swap(sel, store, read, write){
    document.querySelectorAll("[" + sel + "]").forEach(function(el){
      var k = el.getAttribute(sel), id = sel + "|" + k;
      if (!(id in store)) store[id] = read(el);
      write(el, store[id], k);
    });
  }
  function apply(l){
    if (!known(l)) l = "en";
    var d = dict(l), en = (l === "en");
    swap("data-i", base,
         function(el){ return el.innerHTML; },
         function(el, b, k){ el.innerHTML = (en || d[k] === undefined) ? b : d[k]; });
    swap("data-ia", baseA,
         function(el){ return el.getAttribute("aria-label") || ""; },
         function(el, b, k){ el.setAttribute("aria-label", (en || d[k] === undefined) ? b : d[k]); });
    swap("data-it", baseT,
         function(el){ return el.getAttribute("title") || ""; },
         function(el, b, k){ el.setAttribute("title", (en || d[k] === undefined) ? b : d[k]); });
    swap("data-ip", baseP,
         function(el){ return el.getAttribute("placeholder") || ""; },
         function(el, b, k){ el.setAttribute("placeholder", (en || d[k] === undefined) ? b : d[k]); });
    document.documentElement.setAttribute("lang", l);
    /* The description is invisible on the page and is exactly what a search
       result and a link preview show, so it follows the language too. */
    if (descBase === null) {
      var dm0 = document.querySelector('meta[name="description"]');
      descBase = dm0 ? dm0.getAttribute("content") : "";
    }
    var wantD = (!en && d["pg-desc"] !== undefined) ? d["pg-desc"] : descBase;
    var dm1 = document.querySelector('meta[name="description"]');
    if (dm1) dm1.setAttribute("content", wantD);
    var om1 = document.querySelector('meta[property="og:description"]');
    if (om1) om1.setAttribute("content", wantD);
    /* The tab is part of the page. A page may name its own title through
       pg-title; otherwise, where the title opens with the page's own heading,
       that part follows the language. */
    if (titleBase === null) titleBase = document.title;
    if (!en && d["pg-title"] !== undefined) {
      document.title = d["pg-title"];
    } else if (en) {
      document.title = titleBase;
    } else {
      var h1 = document.querySelector("h1[data-i]");
      if (h1) {
        var h1en = base["data-i|" + h1.getAttribute("data-i")];
        if (h1en) {
          var plain = String(h1en).replace(/<[^>]+>/g, "").trim();
          if (plain && titleBase.indexOf(plain) === 0) {
            document.title = h1.textContent.trim() + titleBase.slice(plain.length);
          }
        }
      }
    }
    document.querySelectorAll(".langs button").forEach(function(b){
      b.setAttribute("aria-pressed", b.getAttribute("data-lang") === l ? "true" : "false");
    });
    var ot1 = document.querySelector('meta[property="og:title"]');
    if (ot1) ot1.setAttribute("content", document.title);
    try { localStorage.setItem(KEY, l); } catch (e) {}
    window.__lang = l;
    /* One lookup for a string a script draws itself rather than one the
       browser is holding in an element. */
    window.__t = function(k, fallback){
      if (l === "en") return fallback;
      return d[k] === undefined ? fallback : d[k];
    };
    try { document.dispatchEvent(new CustomEvent("langchange", { detail: l })); } catch (e) {}
  }
  document.querySelectorAll(".langs button").forEach(function(b){
    b.addEventListener("click", function(){ apply(b.getAttribute("data-lang")); });
  });
  window.__chrome = apply;
  window.__lang = lang;
  window.__t = function(k, fallback){ return fallback; };
  window.__relang = function(){ apply(window.__lang || "en"); };
  apply(lang);
  /* A page that wants a whole viewport of height has to know how much of it
     the bar has already taken, or it overhangs the fold by exactly that much
     and clips whatever sits at its bottom. */
  function barHeight(){
    var b = document.querySelector(".bar");
    document.documentElement.style.setProperty("--barh", (b ? b.offsetHeight : 0) + "px");
  }
  barHeight();
  addEventListener("resize", barHeight);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(barHeight);
  /* the nav is one scrolling line on a phone, so the page you are on can
     start off past its right edge. Bring it into view without moving the
     page. The generated pages do the same. */
  try {
    var cur = document.querySelector(".bar nav a[aria-current]");
    if (cur && cur.parentNode.scrollWidth > cur.parentNode.clientWidth) {
      cur.parentNode.scrollLeft = Math.max(0, cur.offsetLeft - 24);
    }
  } catch(e){}
})();

</script>
