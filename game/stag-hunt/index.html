VIEWS.chapterEnd = function () {
  var ch = CHAPTERS[G.chapter - 1];
  var name = PEOPLE[G.who].name;
  ui.top(chLine(G.chapter), T("sh-when-what", "what that was"));
  ui.kick(T("sh-ce-kick", "End of chapter {n}", {n: G.chapter}));

  if (G.chapter === 1) {
    ui.head(T("sh-ce1-h", "Nobody was greedy"));
    ui.para(T("sh-ce1-p1", "Read the four numbers again. There is no cell in which betraying the other one pays. If you are sure they are waiting on the ridge, your best move is to wait as well, because five beats two. If you are sure they have gone down for a hare, your best move is the hare too, because two beats nothing."));
    ui.para(T("sh-ce1-p2", "That is the difference between this and the usual dilemma. Both of you waiting is stable, and both of you in the grass is also stable. Two answers, both of them correct, and nothing in the numbers decides which one you live in."));
    ui.para(T("sh-ce1-p3", "What decides it is what each of you expects. Tarik came up the ridge for the first time expecting very little of you, so he took hares, and every hare he took made you less willing to wait, and every morning you spent in the grass made him more certain he had been right."));
    payTable();
    ui.para(T("sh-ce1-p4", "From here on you can see what he thinks. It was always there, and this is the number that was moving."));
    G.showConf = true;
    ui.meter(T("sh-m-expectnow", "What {n} expects of you now", {n: name}), G.conf, T("sh-of100", "{x} of 100", {x: Math.round(G.conf * 100)}), G.conf >= 0.5);
  } else if (G.chapter === 2) {
    ui.head(T("sh-ce2-h", "The same hunt, a different opening"));
    ui.para(T("sh-ce2-p1", "Roza is the same rule Tarik is. The stag is worth the same five, the hare the same two. The only thing that changed between the two chapters is the number she started with, and it decided almost everything that happened after it."));
    ui.para(T("sh-ce2-p2", "This is why the safe answer is so hard to get out of. If nobody expects anybody, everybody takes the hare, and everybody taking the hare is exactly the evidence that nobody should have expected anybody."));
    ui.meter(T("sh-m-expectnow", "What {n} expects of you now", {n: "Roza"}), G.conf, T("sh-of100", "{x} of 100", {x: Math.round(G.conf * 100)}), G.conf >= 0.5);
  } else {
    ui.head(T("sh-ce3-h", "A morning that was nobody's decision"));
    ui.para(T("sh-ce3-p1", "On the morning of the high river nothing was chosen. If you read that morning as evidence about Tarik you learned something false, and if you acted on it afterwards you made it true."));
    ui.para(T("sh-ce3-p2", "The hare is the safe move in the exact sense that matters: it pays two whatever the other one does, while waiting pays five or nothing depending on somebody else. When you are unsure, safety is worth something, and the more unsure you are the more it is worth. That is how a village that could eat well ends up eating a little."));
  }

  var r = ui.actions();
  if (G.chapter < CHAPTERS.length) {
    ui.btn(r, T("sh-b-ch2", "Chapter {n}. {t}", {n: G.chapter + 1, t: chTitle(G.chapter + 1)}), T("sh-k-go", "go on"), function () {
      startChapter(G.chapter + 1);
    }, "big");
  } else {
    ui.btn(r, T("sh-b-endof", "The end of it"), T("sh-k-go", "go on"), function () { view("ending"); }, "big");
  }
  ui.say(T("sh-s-chend", "End of chapter {n}.", {n: G.chapter}));
};

VIEWS.ending = function () {
  scene.you = null; scene.themMove = null; scene.both = false; scene.stag = 1;
  KW.season(0, true); KW.daylight(0.5);
  ui.top(T("sh-name", "The Stag Hunt"), T("sh-when-arg", "the argument, plainly"));
  ui.kick(T("sh-e-kick", "The end of it"));
  ui.head(T("sh-e-h", "What the three chapters were for"));
  ui.para(T("sh-e-p1", "This game has two equilibria. Both hunters waiting is one, and both hunters in the grass is the other, and in each of them neither person can do better by changing what they do alone. One of them feeds you five and the other feeds you two, and the arithmetic has nothing to say about which one you end up in."));
  ui.para(T("sh-e-p2", "What picks between them is belief. Not preference, not character, not greed. The hare is safe because it pays the same whatever happens on the ridge, and safety is worth more the less certain you are of the other person. So doubt is self confirming: it makes the hare correct, taking the hare teaches the other one to doubt you, and their doubt makes the hare correct for them."));
  ui.list([
    T("sh-e-l1", "The trap here is not that anybody wants to take advantage of anybody. Nothing was gained in this game by letting somebody down, and the game never gave you the chance to."),
    T("sh-e-l2", "One morning that was nobody's fault can move a village from the good equilibrium to the safe one, and there is no way to tell the difference from the ridge."),

  ui.para(T("sh-e-rous", "Rousseau wrote the situation down in 1754, before there was a word for it. Every hunter understood he had to hold his post if the deer was to be taken, and yet:"));
  var q = el("p", "say");
  q.appendChild(document.createTextNode(T("sh-e-q1", "„If a deer was to be taken, every one saw that, in order to succeed, he must abide faithfully by his post: but if a hare happened to come within the reach of any one of them, it is not to be doubted that he pursued it without scruple, and, having seized his prey, cared very little, if by so doing he caused his companions to miss theirs.“")));

    T("sh-e-m4", "The two equilibria here are ranked cleanly, five against two. Where the safe outcome is nearly as good as the risky one, the pull toward safety is far stronger than anything you felt in these three chapters."),

  ui.sources([

      tail: T("sh-src-tail", "Read 2026 08 21.") },
    { what: T("sh-src2", "Equilibrium point."),
      cite: "John F. Nash, Equilibrium Points in n Person Games, Proceedings of the National Academy of Sciences 36(1), 1950, pages 48 and 49.",
      url: "https://pmc.ncbi.nlm.nih.gov/articles/PMC1063129/",
