    if (ui.reading[viewName]) { ui.panel.focus({ preventScroll: true }); return; }
    var b = ui.panel.querySelector("button:not([disabled])");
    if (b) b.focus({ preventScroll: true });
  }
};

function store(key) {
  return {
    save: function (o) { try { localStorage.setItem(key, JSON.stringify(o)); } catch (e) {} },
    load: function () {
      try {
        var raw = localStorage.getItem(key);
        return raw ? JSON.parse(raw) : null;
      } catch (e) { return null; }
    },
    wipe: function () { try { localStorage.removeItem(key); } catch (e) {} }
  };
}

function keys(fn) {
  document.addEventListener("keydown", function (e) {
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    var tag = (e.target && e.target.tagName) || "";
    if (tag === "INPUT" || tag === "SELECT" || tag === "TEXTAREA") return;
    fn(String(e.key || "").toLowerCase(), e);
  });
}

function start(opts) {
  opts = opts || {};
  cv = $("world"); ctx = cv.getContext("2d");
  api.ctx = ctx;
  ui.panel = $("panel"); ui.live = $("live");
  anchorSel = opts.anchor || "#panel";
  groundLift = opts.lift || 0;
  drawGame = opts.draw || null;
  onResize = opts.resize || null;
  var rsz;
  window.addEventListener("resize", function () {
    clearTimeout(rsz);
    rsz = setTimeout(resize, 120);
  }, { passive: true });
  /* the game gets its first screen before the first paint, so that the
     panel it writes is what the ground line is measured against */
  if (opts.ready) opts.ready();
  resize();
  requestAnimationFrame(frame);
}

var api = {
  reduced: reduced, FAST: FAST,
  $: $, el: el, clamp: clamp, lerp: lerp, smooth: smooth, rgb: rgb, mix: mix, mulberry: mulberry,
  M: M, ctx: null, world: world, SEASONS: SEASON_NAMES,
  sw: sw, sky: skyPair, shadow: shadow,
  land: drawLand, house: drawHouse, tree: drawTree, fence: drawFence,
  figure: drawFigure, basket: drawBasket, coin: drawCoin, slate: drawSlate,
  hill: hill,
  season: function (i, immediate) {
    world.prev = world.season;
    world.season = ((i % 4) + 4) % 4;
    world.mix = (immediate || world.season === world.prev) ? 1 : 0;
  },
  daylight: function (v, immediate) {
    world.day = clamp(v, 0, 1);
    if (immediate) world.dayT = world.day;
  },
  green: function (v) { greenLoss = clamp(v, 0, 1); },
  villages: function (v) { showVillage = !!v; },
  lift: function (v) { groundLift = v || 0; layout(); },
  layout: layout,
  ui: ui, store: store, keys: keys, start: start
};
return api;
})();
</script>

<script>
(function () {
"use strict";

var el = KW.el, clamp = KW.clamp, lerp = KW.lerp, smooth = KW.smooth;
var ui = KW.ui, ctx = null;
var store = KW.store("kw.staghunt.v1");

/* ============================================================
   1. the game itself
   Four numbers. Two of the cells are equilibria, which is the
   whole difference between this and the prisoner's dilemma.
   ============================================================ */

var PAY = { both: 5, hare: 2, alone: 0 };

function payoff(mine, theirs) {
  if (mine === "S") return theirs === "S" ? PAY.both : PAY.alone;
  return PAY.hare;
}

/* the partner is a rule and nothing more: they go for the stag when
   they expect you to be there, and their expectation is history */
function partnerGoes(conf, thr) { return conf >= thr; }

function updateConf(conf, yourMove, theirMove) {
  if (yourMove === "S") {
    conf = conf + 0.17 * (1 - conf);
    if (theirMove === "S") conf = conf + 0.11 * (1 - conf);
  } else {
    conf = conf - 0.34;
  }
  return clamp(conf, 0, 1);
}

/* ============================================================
   2. the people
   ============================================================ */

var PEOPLE = {
  tarik: { name: "Tarik", conf0: 0.28, thr: 0.5,
           fig: { coat: "#5e7a6a", hairStyle: "cap", capCol: "#4d5a3a", hair: "#2a1c10", prop: "spear" } },
  roza:  { name: "Roza", conf0: 0.82, thr: 0.5,
           fig: { coat: "#7a6a8a", hairStyle: "braid", hair: "#3a2a18", skin: "#c99a72", prop: "spear" } }
};

var CHAPTERS = [
  { n: 1, who: "tarik", rounds: 8, fog: -1, title: "The first hunt" },
  { n: 2, who: "roza",  rounds: 6, fog: -1, title: "Word travels" },
  { n: 3, who: "tarik", rounds: 6, fog: 1,  title: "The morning of the high river" }
];

/* ============================================================
   3. state
   ============================================================ */

var G = {
  view: "title", chapter: 1, furthest: 1,
  round: 0, you: 0, them: 0,
  conf: 0.28, who: "tarik",
  stagRuns: 0, hareRuns: 0,
  showConf: false,
  last: null, log: []
};

var scene = { mode: "ridge", t0: -99, you: null, them: null, stag: 1, absent: false, both: false };

/* how far the morning has got, from the moment the choice was made */
function ease() {
  if (KW.reduced) return 1;
  return clamp((KW.world.t - scene.t0) / 0.8, 0, 1);
}

function save() {
  store.save({
    view: G.view, chapter: G.chapter, furthest: G.furthest, round: G.round,
    you: G.you, them: G.them, conf: G.conf, who: G.who, showConf: G.showConf
  });
}

/* ============================================================
   4. the ridge
   ============================================================ */

var pines = [];
function buildPines() {
  var rnd = KW.mulberry(5150), M = KW.M;
  pines = [];
  var n = M.small ? 9 : 15;
  for (var i = 0; i < n; i++) {
    pines.push({ u: (i + 0.5) / n + (rnd() - 0.5) * 0.03, h: 26 + rnd() * 26, w: 10 + rnd() * 7, tone: rnd() });
  }
}

function drawPines(t) {
  var M = KW.M, sk = KW.sky();
  var base = KW.mix([56, 74, 58], [26, 30, 44], sk.night * 0.8);
  for (var i = 0; i < pines.length; i++) {
    var p = pines[i];
    var x = p.u * M.W, y = M.GY - (M.small ? 20 : 30);
    var h = p.h * (M.small ? 0.7 : 1), w = p.w * (M.small ? 0.72 : 1);
    var col = KW.mix(base, [96, 112, 84], p.tone * 0.4);
    ctx.fillStyle = KW.rgb(col, 0.92);
    ctx.beginPath();
    ctx.moveTo(x, y - h);
    ctx.lineTo(x + w / 2, y);
    ctx.lineTo(x - w / 2, y);
    ctx.closePath(); ctx.fill();
    ctx.beginPath();
    ctx.moveTo(x, y - h * 1.16);
    ctx.lineTo(x + w * 0.36, y - h * 0.5);
    ctx.lineTo(x - w * 0.36, y - h * 0.5);
    ctx.closePath(); ctx.fill();
  }
}

/* the stag, standing on the far ridge, seen against the light */
function drawStag(x, y, s, a, t) {
  var sk = KW.sky();
  ctx.save();
  ctx.globalAlpha = a;
  ctx.translate(x, y);
  ctx.scale(s, s);
  var col = KW.rgb(KW.mix([62, 46, 32], [26, 28, 40], sk.night * 0.7), 0.95);
  KW.shadow(0, 22 * s, 0.18 * a);
  ctx.strokeStyle = col; ctx.lineWidth = 3.4; ctx.lineCap = "round";
  /* body */
  ctx.beginPath();
  ctx.moveTo(-13, -18); ctx.quadraticCurveTo(0, -22, 13, -18);
  ctx.stroke();
  ctx.fillStyle = col;
  ctx.beginPath();
  ctx.ellipse(0, -17, 13, 6.4, 0, 0, 6.283);
  ctx.fill();
  /* legs */
  ctx.lineWidth = 2.2;
  var sway = KW.reduced ? 0 : Math.sin(t * 1.2) * 0.6;
  [-9, -4.5, 5, 10].forEach(function (lx, i) {
    ctx.beginPath();
    ctx.moveTo(lx, -13);
    ctx.lineTo(lx + (i % 2 ? sway : -sway), 0);
    ctx.stroke();
  });
  /* neck and head */
  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.moveTo(11, -20); ctx.quadraticCurveTo(16, -28, 17, -33);
  ctx.stroke();
  ctx.fillStyle = col;
  ctx.beginPath(); ctx.ellipse(18.4, -34.5, 4.4, 2.5, -0.5, 0, 6.283); ctx.fill();
  /* antlers */
  ctx.lineWidth = 1.6;
  [1, -1].forEach(function (d) {
    ctx.beginPath();
    ctx.moveTo(16.5, -36);
    ctx.quadraticCurveTo(16 + d * 2, -44, 19 + d * 3.4, -47);
    ctx.moveTo(17, -41); ctx.lineTo(13 + d * 1.5, -45);
    ctx.moveTo(18, -44); ctx.lineTo(22 + d, -47.5);
    ctx.stroke();
  });
  ctx.restore();
}

/* a hare, low in the grass */
function drawHare(x, y, s, t, hop) {
  var sk = KW.sky();
  ctx.save();
  ctx.translate(x, y - (hop ? Math.abs(Math.sin(t * 5)) * 6 : 0));
  ctx.scale(s, s);
  var col = KW.rgb(KW.mix([146, 122, 92], [40, 42, 54], sk.night * 0.7), 0.95);
  ctx.fillStyle = col;
  ctx.beginPath(); ctx.ellipse(0, -4, 6.2, 3.6, -0.1, 0, 6.283); ctx.fill();
  ctx.beginPath(); ctx.arc(5.4, -7.4, 2.6, 0, 6.283); ctx.fill();
  ctx.strokeStyle = col; ctx.lineWidth = 1.5; ctx.lineCap = "round";
  ctx.beginPath(); ctx.moveTo(5.6, -9.4); ctx.lineTo(4.4, -15); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(6.6, -9.4); ctx.lineTo(7.4, -15); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(-4, -1.6); ctx.lineTo(-4, 0); ctx.moveTo(2, -1.6); ctx.lineTo(2, 0); ctx.stroke();
  ctx.beginPath(); ctx.arc(-6.6, -5.4, 1.8, 0, 6.283); ctx.fill();
  ctx.restore();
}

function drawWorld(t) {
  var M = KW.M;
  drawPines(t);
  KW.tree(t, M.small ? M.W * 0.9 : M.W * 0.88, 0.8);

  /* the stag on the ridge, while it is still there */
  if (scene.stag > 0.02) {
    drawStag(M.W * (M.small ? 0.80 : 0.68), M.GY - (M.small ? 30 : 38),
             M.small ? 0.8 : 1.05, scene.stag * 0.95, t);
  }

  var px = M.CX - M.DX, nx = M.CX + M.DX;
  var ex = ease();

  /* you */
  KW.shadow(px, 16, 0.26);
  KW.figure(px, M.GY, t, {
    coat: "#40566e", hairStyle: "curly", hair: "#241a12", skin: "#c99a72",
    prop: "spear", face: 1, pose: scene.you === "S" ? "aim" : scene.you === "H" ? "hold" : "stand"
  });
  if (scene.you === "H" && ex > 0.3) drawHare(px + (M.small ? 20 : 26), M.GY, M.small ? 0.9 : 1.1, t, false);

  /* them, unless the river kept them at home */
  if (scene.them && !scene.absent) {
    KW.shadow(nx, 16, 0.26);
    KW.figure(nx, M.GY, t, Object.assign({}, PEOPLE[scene.them].fig, {
      face: -1, pose: scene.themMove === "S" ? "aim" : scene.themMove === "H" ? "hold" : "stand"
    }));
    if (scene.themMove === "H" && ex > 0.3) drawHare(nx - (M.small ? 20 : 26), M.GY, M.small ? 0.9 : 1.1, t, false);
  }

  /* both went up the hill: the baskets come back full */
  if (scene.both && ex > 0.4) {
    KW.basket(px + (M.small ? 16 : 22), M.GY - 2, M.small ? 1 : 1.2, true, false);
    KW.basket(nx - (M.small ? 16 : 22), M.GY - 2, M.small ? 1 : 1.2, true, false);
  }

  /* hares in the grass, always there, always small */
  if (scene.mode === "ridge" && !scene.you) {
    drawHare(M.W * 0.3, M.GY - 3, M.small ? 0.7 : 0.85, t, !KW.reduced);
    drawHare(M.W * 0.42, M.GY - 1, M.small ? 0.6 : 0.75, t + 1.7, !KW.reduced);
  }
}

/* ============================================================
   5. views
   ============================================================ */

var VIEWS = {};
ui.reading = { title: 1, intro: 1, chapterEnd: 1, ending: 1 };

function view(name) {
  G.view = name;
  ui.clear();
  ui.panel.className = ui.reading[name] ? "read" : "";
  VIEWS[name]();
  KW.layout();
  ui.focusFirst(name);
  save();
}

function tally() {
  var d = el("div", "tally");
  var a = el("span"); a.appendChild(document.createTextNode("What you have eaten this chapter "));
  a.appendChild(el("b", null, String(G.you)));
  var b = el("span"); b.appendChild(document.createTextNode(PEOPLE[G.who].name + " "));
  b.appendChild(el("b", null, String(G.them)));
  d.appendChild(a); d.appendChild(b);
  ui.panel.appendChild(d);
}

VIEWS.title = function () {
  scene.mode = "ridge"; scene.you = null; scene.them = null; scene.themMove = null;
  scene.both = false; scene.absent = false; scene.stag = 1; scene.t0 = -99;
  KW.season(0, true); KW.daylight(0.12, true);
  KW.$("menuBtn").hidden = true;
  ui.top("The Stag Hunt", "a ridge above the village, before dawn");
  ui.head("The Stag Hunt");
  ui.para("A stag is worth five days of eating and cannot be taken by one person. A hare is worth two days and can. If you both climb the ridge and wait, the stag is yours and you both eat well. If one of you leaves the ridge for a hare while the other is still waiting, the hare is taken and the person still waiting goes home with nothing.");
  ui.para("Nobody here wants to cheat anybody. Every season you decide only one thing: whether you believe the other one will be there.");
  var r = ui.actions();
  var s = store.load();
  if (s && (s.furthest > 1 || s.round > 0)) {
    ui.btn(r, "Go on from chapter " + s.chapter, "return", function () { resume(s); }, "big");
  }
  ui.btn(r, "Climb the ridge", "start", function () {
    ui.acted = true;
    G.chapter = 1; G.furthest = 1; G.showConf = false;
    startChapter(1);
  }, "big");
  ui.say("The Stag Hunt. Two hunters, one stag, and hares in the grass.");
};

function resume(s) {
  ui.acted = true;
  G.chapter = s.chapter || 1; G.furthest = s.furthest || 1;
  G.round = s.round || 0; G.you = s.you || 0; G.them = s.them || 0;
  G.conf = s.conf == null ? 0.28 : s.conf;
  G.who = s.who || "tarik"; G.showConf = !!s.showConf;
  var ch = CHAPTERS[G.chapter - 1];
  KW.$("menuBtn").hidden = false;
  KW.season((G.chapter - 1 + G.round) % 4, true);
  KW.daylight(0.12 + (G.round / ch.rounds) * 0.7, true);
  scene.them = G.who;
  if (G.round >= ch.rounds) view("chapterEnd"); else view("ask");
}

function startChapter(n) {
  var ch = CHAPTERS[n - 1];
  G.chapter = n;
  G.furthest = Math.max(G.furthest, n);
  G.round = 0; G.you = 0; G.them = 0;
  G.who = ch.who;
  G.conf = PEOPLE[ch.who].conf0;
  G.last = null;
  scene.them = ch.who; scene.absent = false; scene.both = false;
  scene.you = null; scene.themMove = null; scene.stag = 1;
  KW.$("menuBtn").hidden = false;
  KW.season((n - 1) % 4, true);
  KW.daylight(0.12, true);
  view("intro");
}

var INTRO = {
  1: {
    kick: "Chapter one",
    head: "The first hunt",
    body: [
      "Tarik hunts the same ridge you do. You have never worked together. Neither of you has any idea what the other will do before dawn, and there is no way to agree on it beforehand, because the two of you set out from opposite ends of the village.",
      "Eight mornings. Each one you choose the stag or the hare, and so does he."
    ],
    go: "The first morning"
  },
  2: {
    kick: "Chapter two",
    head: "Word travels",
    body: [
      "Roza has heard how the season went. She has not hunted with you before, but she knows what Tarik knows, and she comes up the ridge already expecting to find you there.",
      "Nothing about the stag has changed. Nothing about the hare has changed. Only what she expects."
    ],
    go: "The first morning"
  },
  3: {
    kick: "Chapter three",
    head: "The morning of the high river",
    body: [
      "Tarik again, and this time both of you know how this works. But the river between his house and the ridge rises in the spring, and on some mornings it cannot be crossed at all.",
      "Nobody will have decided anything on a morning like that. It will look exactly like being let down."
    ],
    go: "The first morning"
  }
};

VIEWS.intro = function () {
  var I = INTRO[G.chapter], ch = CHAPTERS[G.chapter - 1];
  ui.top("Chapter " + G.chapter + ". " + ch.title, PEOPLE[G.who].name + " hunts with you");
  ui.kick(I.kick);
  ui.head(I.head);
  I.body.forEach(function (b) { ui.para(b); });
  if (G.chapter === 1) {
    ui.para("The stag is five, the hare is two, and waiting alone is nothing at all.");
  }
  var r = ui.actions();
  ui.btn(r, I.go, "begin", function () { beginRound(); }, "big");
  ui.say(I.head + ". " + I.body[0]);
};

function beginRound() {
  scene.you = null; scene.themMove = null; scene.both = false; scene.absent = false;
  scene.stag = 1; scene.t0 = KW.world.t;
  view("ask");
}

VIEWS.ask = function () {
  var ch = CHAPTERS[G.chapter - 1];
  var name = PEOPLE[G.who].name;
  KW.season((G.chapter - 1 + G.round) % 4, G.round === 0);
  KW.daylight(0.12 + (G.round / ch.rounds) * 0.7);
  ui.top("Chapter " + G.chapter + ". " + ch.title,
         KW.SEASONS[KW.world.season] + ", morning " + (G.round + 1) + " of " + ch.rounds);
  ui.kick("Morning " + (G.round + 1));
  ui.head("The ridge, or the grass");
  if (G.chapter === 3 && G.round === ch.fog) {
    ui.para("The river is loud from here. You cannot see whether anyone crossed it.");
  } else if (G.round === 0) {
    ui.para(name + " set out at the same hour you did, from the other side of the village. Neither of you can see the other yet.");
  } else {
    ui.para(G.last && G.last.them === "S"
      ? name + " was on the ridge yesterday."
      : name + " was not on the ridge yesterday.");
  }
  var r = ui.actions();
  ui.btn(r, "Wait on the ridge for the stag", "press s", function () { resolve("S"); }, "big stag");
  ui.btn(r, "Go down for a hare", "press h", function () { resolve("H"); }, "big hare");
  if (G.showConf) {
    ui.meter("What " + name + " expects", G.conf, Math.round(G.conf * 100) + " of 100", G.conf >= PEOPLE[G.who].thr);
  }
  tally();
  ui.say(KW.SEASONS[KW.world.season] + ", morning " + (G.round + 1) + ". Wait on the ridge or go down for a hare.");
};

function resolve(mine) {
  var ch = CHAPTERS[G.chapter - 1];
  var p = PEOPLE[G.who];
  var absent = (G.chapter === 3 && G.round === ch.fog);
  var theirs = absent ? "A" : (partnerGoes(G.conf, p.thr) ? "S" : "H");

  var mineP, theirsP;
  if (absent) {
    /* nobody chose anything: he could not get across */
    mineP = mine === "S" ? PAY.alone : PAY.hare;
    theirsP = 0;
  } else {
    mineP = payoff(mine, theirs);
    theirsP = payoff(theirs, mine);
  }
  G.you += mineP; G.them += theirsP;

  if (!absent) G.conf = updateConf(G.conf, mine, theirs);
  if (mine === "S") G.stagRuns++; else G.hareRuns++;

  G.last = { you: mine, them: theirs, youPay: mineP, themPay: theirsP, absent: absent, conf: G.conf };
  G.log.push({ chapter: G.chapter, round: G.round, you: mine, them: theirs,
               youPay: mineP, themPay: theirsP, absent: absent, conf: G.conf });

  scene.you = mine; scene.themMove = absent ? null : theirs; scene.absent = absent;
  scene.both = (!absent && mine === "S" && theirs === "S");
  scene.stag = scene.both ? 0 : 1;
  scene.t0 = KW.world.t;

  G.round++;
  save();
  view("result");
}

function resultWords(r, name) {
  if (r.absent) {
    if (r.you === "S") return "You waited until the sun was well up. Nobody came. Later you found out the river was over the stones and " + name + " never left his own side of it.";
    return "You took a hare. Later you found out the river was over the stones and " + name + " never left his own side of it, so there was nobody on the ridge to wait for anyway.";
  }
  if (r.you === "S" && r.them === "S") return "You were both on the ridge, and between the two of you the stag came down. Five days of eating each, and neither of you had to say a word about it beforehand.";
  if (r.you === "S" && r.them === "H") return "You waited. " + name + " went down into the grass, and you watched him carry a hare home while the stag stayed exactly where it was.";
  if (r.you === "H" && r.them === "S") return "You took your hare early. " + name + " was still on the ridge at noon with nothing, and he saw you come back up the path with something in your hands.";
  return "You both went down for hares. Two days of eating each, and the stag on the ridge was never in any danger from either of you.";
}

VIEWS.result = function () {
  var ch = CHAPTERS[G.chapter - 1];
  var name = PEOPLE[G.who].name;
  var r = G.last;
  ui.top("Chapter " + G.chapter + ". " + ch.title, KW.SEASONS[KW.world.season] + ", the day after");
  ui.kick("Morning " + G.round);
  ui.head(r.absent ? "Nobody was there" :
          (r.you === "S" && r.them === "S") ? "The stag" :
          (r.you === "H" && r.them === "H") ? "Two hares" : "One of you waited");
  ui.para(resultWords(r, name), "say");
  ui.para("You ate for " + r.youPay + (r.youPay === 1 ? " day" : " days") + ". " +
          (r.absent ? name + " ate whatever was on his own side of the river."
                    : name + " ate for " + r.themPay + (r.themPay === 1 ? " day" : " days") + "."));
  if (G.showConf) {
    ui.meter("What " + name + " expects", G.conf, Math.round(G.conf * 100) + " of 100", G.conf >= PEOPLE[G.who].thr);
  }
  tally();
  var row = ui.actions();
  if (G.round >= ch.rounds) {
    ui.btn(row, "The chapter ends", "go on", function () { view("chapterEnd"); }, "big");
  } else {
    ui.btn(row, "The next morning", "go on", function () { beginRound(); }, "big");
  }
  ui.say(resultWords(r, name));
};

/* ---- what each chapter was for ---- */

VIEWS.chapterEnd = function () {
  var ch = CHAPTERS[G.chapter - 1];
  var name = PEOPLE[G.who].name;
  ui.top("Chapter " + G.chapter + ". " + ch.title, "what that was");
  ui.kick("End of chapter " + G.chapter);

  if (G.chapter === 1) {
    ui.head("Nobody was greedy");
    ui.para("Read the four numbers again. There is no cell in which betraying the other one pays. If you are sure they are waiting on the ridge, your best move is to wait as well, because five beats two. If you are sure they have gone down for a hare, your best move is the hare too, because two beats nothing.");
    ui.para("That is the difference between this and the usual dilemma. Both of you waiting is stable, and both of you in the grass is also stable. Two answers, both of them correct, and nothing in the numbers decides which one you live in.");
    ui.para("What decides it is what each of you expects. Tarik came up the ridge for the first time expecting very little of you, so he took hares, and every hare he took made you less willing to wait, and every morning you spent in the grass made him more certain he had been right.");
    payTable();
    ui.para("From here on you can see what he thinks. It was always there, and this is the number that was moving.");
    G.showConf = true;
    ui.meter("What " + name + " expects of you now", G.conf, Math.round(G.conf * 100) + " of 100", G.conf >= 0.5);
  } else if (G.chapter === 2) {
    ui.head("The same hunt, a different opening");
    ui.para("Roza is the same rule Tarik is. The stag is worth the same five, the hare the same two. The only thing that changed between the two chapters is the number she started with, and it decided almost everything that happened after it.");
    ui.para("This is why the safe answer is so hard to get out of. If nobody expects anybody, everybody takes the hare, and everybody taking the hare is exactly the evidence that nobody should have expected anybody.");
    ui.meter("What Roza expects of you now", G.conf, Math.round(G.conf * 100) + " of 100", G.conf >= 0.5);
  } else {
    ui.head("A morning that was nobody's decision");
    ui.para("On the morning of the high river nothing was chosen. If you read that morning as evidence about Tarik you learned something false, and if you acted on it afterwards you made it true.");
    ui.para("The hare is the safe move in the exact sense that matters: it pays two whatever the other one does, while waiting pays five or nothing depending on somebody else. When you are unsure, safety is worth something, and the more unsure you are the more it is worth. That is how a village that could eat well ends up eating a little.");
  }

  var r = ui.actions();
  if (G.chapter < CHAPTERS.length) {
    ui.btn(r, "Chapter " + (G.chapter + 1) + ". " + CHAPTERS[G.chapter].title, "go on", function () {
      startChapter(G.chapter + 1);
    }, "big");
  } else {
    ui.btn(r, "The end of it", "go on", function () { view("ending"); }, "big");
  }
  ui.say("End of chapter " + G.chapter + ".");
};

function payTable() {
  var w = el("div", "tblwrap");
  var t = el("table", "pay");
  var cap = el("caption", "vh", "What each pair of choices is worth, in days of eating, yours first");
  t.appendChild(cap);
  var head = el("tr");
  head.appendChild(el("th", null, ""));
  head.appendChild(el("th", null, "they wait"));
  head.appendChild(el("th", null, "they take a hare"));
  t.appendChild(head);
  [["you wait", [PAY.both, PAY.both], [PAY.alone, PAY.hare]],
   ["you take a hare", [PAY.hare, PAY.alone], [PAY.hare, PAY.hare]]].forEach(function (row) {
    var tr = el("tr");
    tr.appendChild(el("th", null, row[0]));
    [row[1], row[2]].forEach(function (c) {
      var td = el("td", (c[0] === c[1] && (c[0] === PAY.both || c[0] === PAY.hare)) ? "win" : null);
      td.appendChild(el("b", null, String(c[0])));
      td.appendChild(document.createTextNode(" "));
      td.appendChild(el("span", null, String(c[1])));
      tr.appendChild(td);
    });
    t.appendChild(tr);
  });
  w.appendChild(t);
  ui.panel.appendChild(w);
  var p = el("p", "kicker", "The two shaded cells are the ones neither hunter can improve on alone");
  ui.panel.appendChild(p);
}

/* ============================================================
   6. the ending
   ============================================================ */

VIEWS.ending = function () {
  scene.you = null; scene.themMove = null; scene.both = false; scene.stag = 1;
  KW.season(0, true); KW.daylight(0.5);
  ui.top("The Stag Hunt", "the argument, plainly");
  ui.kick("The end of it");
  ui.head("What the three chapters were for");
  ui.para("This game has two equilibria. Both hunters waiting is one, and both hunters in the grass is the other, and in each of them neither person can do better by changing what they do alone. One of them feeds you five and the other feeds you two, and the arithmetic has nothing to say about which one you end up in.");
  ui.para("What picks between them is belief. Not preference, not character, not greed. The hare is safe because it pays the same whatever happens on the ridge, and safety is worth more the less certain you are of the other person. So doubt is self confirming: it makes the hare correct, taking the hare teaches the other one to doubt you, and their doubt makes the hare correct for them.");
  ui.list([
    "The trap here is not that anybody wants to take advantage of anybody. Nothing was gained in this game by letting somebody down, and the game never gave you the chance to.",
    "One morning that was nobody's fault can move a village from the good equilibrium to the safe one, and there is no way to tell the difference from the ridge.",
    "The whole thing is easy to fix from the outside and very hard to fix from the inside. A word before dawn does what the seasons could not."
  ]);

  ui.sub("Where it comes from");
  ui.para("Rousseau wrote the situation down in 1754, before there was a word for it. Every hunter understood he had to hold his post if the deer was to be taken, and yet:");
  var q = el("p", "say");
  q.appendChild(document.createTextNode("“If a deer was to be taken, every one saw that, in order to succeed, he must abide faithfully by his post: but if a hare happened to come within the reach of any one of them, it is not to be doubted that he pursued it without scruple, and, having seized his prey, cared very little, if by so doing he caused his companions to miss theirs.”"));
  ui.panel.appendChild(q);
  ui.para("The word equilibrium in the sense used here is Nash's, from a paper of two pages published in 1950.");

  ui.sub("What this does not show");
  ui.list([
    "Your partner is a rule, not a person. Their confidence moves by fixed amounts and their choice is a threshold on it. A real hunting partner has moods, other partners, and their own reading of you that this model does not contain.",
    "Nothing here is evidence about how people actually behave in coordination problems. It is a painted example of an argument, not an experiment, and no number on this page was measured.",
    "Real hunts allow talking, and talking is most of the answer. This game forbids it in order to show what happens without it, which makes it a picture of the hardest case rather than the usual one.",
    "The two equilibria here are ranked cleanly, five against two. Where the safe outcome is nearly as good as the risky one, the pull toward safety is far stronger than anything you felt in these three chapters.",
    "Whether real populations settle in the payoff dominant or the risk dominant equilibrium is an open empirical question, and this game takes no position on it."
  ]);

  ui.sub("Sources");
  ui.sources([
    { what: "The hunt itself.",
      cite: "Jean Jacques Rousseau, A Discourse on the Origin of Inequality (1754), second part.",
      url: "https://www.marxists.org/reference/subject/economics/rousseau/inequality/ch02.htm",
      tail: "Read 2026 08 21." },
    { what: "Equilibrium point.",
      cite: "John F. Nash, Equilibrium Points in n Person Games, Proceedings of the National Academy of Sciences 36(1), 1950, pages 48 and 49.",
      url: "https://pmc.ncbi.nlm.nih.gov/articles/PMC1063129/",
      tail: "Read 2026 08 21." }
  ]);

  var p = el("p");
  p.appendChild(document.createTextNode("The other games, and the same subject written out with the numbers exposed: "));
  var a = el("a", null, "all of them are here");
  a.href = "../../game.html";
  p.appendChild(a);
  p.appendChild(document.createTextNode("."));
  ui.panel.appendChild(p);

  var r = ui.actions();
  ui.btn(r, "Hunt it again from the first morning", "again", function () {
    store.wipe();
    G.furthest = 1; G.showConf = false; G.log = [];
    startChapter(1);
  }, "big");
  ui.say("The ending. Two equilibria, and belief decides which one you live in.");
};

/* ============================================================
   7. keyboard, boot, and a hook for testing
   ============================================================ */

KW.keys(function (k) {
  if (G.view === "ask") {
    if (k === "s") { ui.acted = true; resolve("S"); }
    else if (k === "h") { ui.acted = true; resolve("H"); }
  }
});

KW.$("menuBtn").addEventListener("click", function () {
  ui.acted = true; G.last = null; view("title");
});

window.__G = {
  state: G, log: G.log, payoff: payoff, updateConf: updateConf,
  view: function () { return G.view; },
  choose: function (m) {
    ui.acted = true;
    if (G.view === "ask") resolve(m === "stag" ? "S" : "H");
  },
  conf: function () { return G.conf; },
  press: function (label) {
    var bs = ui.panel.querySelectorAll("button");
    for (var i = 0; i < bs.length; i++) {
      if (bs[i].textContent.toLowerCase().indexOf(label.toLowerCase()) === 0) { bs[i].click(); return true; }
    }
    return false;
  },
  buttons: function () {
    return Array.prototype.map.call(ui.panel.querySelectorAll("button"), function (b) { return b.textContent; });
  }
};

KW.start({
  draw: drawWorld,
  resize: buildPines,
  ready: function () { ctx = KW.ctx; buildPines(); view("title"); }
});

})();
</script>

<script>
window.CHROME_I18N = {"tr": {"nav-p": "Profil", "nav-j": "Projeler", "nav-n": "Notlar", "nav-c": "İletişim", "nav-t": "Araçlar", "nav-g": "Oyun Teorisi", "a-site": "Site", "a-lang": "Dil"}, "de": {"nav-p": "Profil", "nav-j": "Projekte", "nav-n": "Notizen", "nav-c": "Kontakt", "nav-t": "Werkzeuge", "nav-g": "Spieltheorie", "a-site": "Website", "a-lang": "Sprache"}};

(function(){
  "use strict";
  var KEY = "lang", lang = "en";
  try { lang = localStorage.getItem(KEY) || "en"; } catch (e) {}
  var D = window.CHROME_I18N || {};
  var base = {}, baseA = {};
  var SEL  = ".bar [data-i], .site-foot [data-i], .k-crown-no[data-i]";
  var SELA = ".bar [data-ia], .site-foot [data-ia]";
  function apply(l){
    if(!D[l]) l = "en";
    var d = D[l] || {};
    document.querySelectorAll(SEL).forEach(function(el){
      var k = el.getAttribute("data-i");
      if(!(k in base)) base[k] = el.innerHTML;
      el.innerHTML = (l === "en" || d[k] === undefined) ? base[k] : d[k];
    });
    document.querySelectorAll(SELA).forEach(function(el){
      var k = el.getAttribute("data-ia");
      if(!(k in baseA)) baseA[k] = el.getAttribute("aria-label") || "";
      el.setAttribute("aria-label", (l === "en" || d[k] === undefined) ? baseA[k] : d[k]);
    });
    document.documentElement.setAttribute("lang", l);
    document.querySelectorAll(".langs button").forEach(function(b){
      b.setAttribute("aria-pressed", b.getAttribute("data-lang") === l ? "true" : "false");
    });
    try { localStorage.setItem(KEY, l); } catch (e) {}
    window.__lang = l;
  }
  document.querySelectorAll(".langs button").forEach(function(b){
    b.addEventListener("click", function(){ apply(b.getAttribute("data-lang")); });
  });
  window.__chrome = apply;
  apply(lang);
})();

</script>
