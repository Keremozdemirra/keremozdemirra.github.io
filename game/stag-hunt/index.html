<style>
/* ============================================================
   The painted world, shared by the games under game/
   The Long Game was written before this file existed and keeps
   its own copy of these rules inside its own source; every game
   built after it takes them from here, so that five pages stay
   one world instead of five.
   ============================================================ */

:root{
  --soil:#2c2115; --timber:#67503a; --terracotta:#8a4a2c;
  --accent:#e0a050; --ink:#2b2620; --paper:#f2efe6; --verdigris:#5e7a6a;
  --ink-soft:#4b443b; --dim:#6f6558; --faint:#6f6759;
  --rule:rgba(103,80,58,.32); --rule-firm:rgba(103,80,58,.55);
  --display:"Fraunces","Iowan Old Style",Georgia,serif;
  --serif:"Newsreader",Georgia,"Times New Roman",serif;
  --mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --card:rgba(242,239,230,.955);
  --card-sunk:rgba(232,227,214,.9);
}

*{box-sizing:border-box}
html,body{margin:0;padding:0;overflow-x:hidden;max-width:100%}
html{-webkit-text-size-adjust:100%}
body{
  font-family:var(--serif); color:var(--ink); background:#c8c4b6;
  min-height:calc(100dvh - var(--barh, 0px)); overscroll-behavior-y:none;
}
canvas#world{
  position:fixed; inset:0; width:100%; height:100%; display:block; z-index:0;
}

.vh{position:absolute;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;
    clip:rect(0 0 0 0);clip-path:inset(50%);white-space:nowrap;border:0}

.skip{position:absolute;left:-9999px;top:0;z-index:60;background:var(--paper);
  color:var(--ink);padding:.6rem .9rem;font-family:var(--mono);font-size:.72rem;
  border:1px solid var(--rule-firm)}
.skip:focus{left:.6rem;top:.6rem}

#shell{
  /* the viewport, less whatever the site bar above it is taking. Asking for
     the whole of it put the start button below the fold on a laptop. */
  position:relative; z-index:2; min-height:calc(100dvh - var(--barh, 0px));
  display:flex; flex-direction:column; justify-content:space-between;
  padding:clamp(.6rem,2vw,1.1rem);
  padding-bottom:calc(clamp(.6rem,2vw,1.1rem) + env(safe-area-inset-bottom,0px));
  gap:.7rem;
}

#topbar{
  display:flex; flex-wrap:wrap; align-items:baseline; gap:.4rem .9rem;
  background:var(--card); border:1px solid var(--rule-firm);
  padding:.5rem .8rem; max-width:64rem; width:100%; margin:0 auto; flex:none;
  box-shadow:0 1px 0 rgba(44,33,21,.14);
}
#topbar .ch{font-family:var(--display);font-weight:400;font-size:.98rem;
  letter-spacing:-.01em;margin:0}
#topbar .meta{font-family:var(--mono);font-size:.63rem;letter-spacing:.12em;
  text-transform:uppercase;color:var(--dim);margin:0}
#topbar .spacer{flex:1 1 auto}
#topbar button{flex:none}

#panel{
  background:var(--card); border:1px solid var(--rule-firm);
  padding:clamp(.85rem,2.4vw,1.25rem);
  max-width:64rem; width:100%; margin:0 auto; flex:none;
  box-shadow:0 2px 0 rgba(44,33,21,.16);
  max-height:74dvh; overflow-y:auto; overscroll-behavior:contain;
}
#panel.read{max-width:49rem}
@media (max-width:900px){ #panel.read{max-width:64rem} }
#panel h2{font-family:var(--display);font-weight:400;font-size:clamp(1.18rem,3.4vw,1.5rem);
  letter-spacing:-.02em;margin:0 0 .45rem;line-height:1.2}
#panel h3{font-family:var(--display);font-weight:400;font-size:1.02rem;margin:1.1rem 0 .35rem}
#panel p{margin:0 0 .6rem;font-size:clamp(.95rem,2.6vw,1.02rem);line-height:1.62;
  max-width:60ch;color:var(--ink-soft)}
#panel p.say{color:var(--ink);font-style:italic}
#panel p.tight{margin-bottom:.35rem}
#panel ul{margin:0 0 .7rem;padding-left:1.1rem;max-width:60ch}
#panel li{font-size:.95rem;line-height:1.6;margin-bottom:.3rem;color:var(--ink-soft)}
#panel a{color:var(--terracotta);text-underline-offset:.2em}
#panel a:hover{color:var(--accent)}

.kicker{font-family:var(--mono);font-size:.63rem;letter-spacing:.14em;
  text-transform:uppercase;color:var(--faint);margin:0 0 .3rem}

.row{display:flex;flex-wrap:wrap;gap:.55rem;margin-top:.75rem;align-items:stretch}
button{
  font-family:var(--serif); font-size:1rem; color:var(--ink);
  background:rgba(253,252,248,.96); border:1px solid var(--rule-firm);
  padding:.6rem 1rem; cursor:pointer; line-height:1.3;
  transition:background-color .13s ease,border-color .13s ease,transform .08s ease;
  min-height:2.75rem;
}
button:hover{background:#fffdf7;border-color:var(--terracotta)}
button:active{transform:translateY(1px)}
button:focus-visible{outline:2px solid var(--terracotta);outline-offset:2px}
button[disabled]{opacity:.45;cursor:default}
button .k{display:block;font-family:var(--mono);font-size:.6rem;letter-spacing:.13em;
  text-transform:uppercase;color:var(--faint);margin-top:.18rem}
button.big{font-family:var(--display);font-size:1.06rem;padding:.7rem 1.25rem;flex:1 1 11rem}
button.share{border-color:rgba(94,122,106,.75);background:rgba(232,238,231,.96)}
button.share:hover{background:#e9f0e7;border-color:var(--verdigris)}
button.keep{border-color:rgba(138,74,44,.7);background:rgba(244,232,224,.96)}
button.keep:hover{background:#f7e9e0;border-color:var(--terracotta)}
button.quiet{font-family:var(--mono);font-size:.65rem;letter-spacing:.12em;
  text-transform:uppercase;padding:.42rem .7rem;min-height:2.1rem;color:var(--dim);
  background:transparent;border-color:var(--rule)}
button.quiet:hover{color:var(--ink);background:rgba(253,252,248,.8)}

.tally{display:flex;flex-wrap:wrap;gap:.35rem 1.4rem;font-family:var(--mono);
  font-size:.72rem;letter-spacing:.04em;color:var(--dim);
  border-top:1px solid var(--rule);padding-top:.55rem;margin-top:.75rem}
.tally b{color:var(--ink);font-weight:500;font-variant-numeric:tabular-nums}

.tblwrap{overflow-x:auto;margin:.4rem 0 .9rem;max-width:100%}
table.pay{border-collapse:collapse;font-family:var(--mono);font-size:.76rem;min-width:20rem}
table.pay th,table.pay td{border:1px solid var(--rule-firm);padding:.42rem .6rem;text-align:center}
table.pay th{font-size:.6rem;letter-spacing:.1em;text-transform:uppercase;
  color:var(--dim);font-weight:500;background:var(--card-sunk)}
table.pay td{background:rgba(253,252,248,.8);min-width:7rem}
table.pay td b{color:var(--terracotta);font-weight:500;font-size:.95rem}
table.pay td span{color:var(--dim)}
table.pay td.win{background:rgba(232,238,231,.9)}

/* ---------- a measured quantity, drawn as a strip ---------- */
.meter{display:grid;grid-template-columns:9.5rem 1fr auto;gap:.6rem;align-items:center;
  font-family:var(--mono);font-size:.7rem;color:var(--dim);margin:.3rem 0}
.meter .bar{height:.7rem;background:rgba(103,80,58,.16);position:relative}
.meter .bar i{position:absolute;inset:0 auto 0 0;display:block;background:var(--terracotta)}
.meter .bar i.good{background:var(--verdigris)}
.meter .n{font-variant-numeric:tabular-nums;color:var(--ink);min-width:3.4rem;text-align:right}
@media (max-width:640px){.meter{grid-template-columns:7.2rem 1fr auto;font-size:.66rem}}

/* ---------- a run of past rounds, as glyphs ---------- */
.glyphs{font-family:var(--mono);font-size:.95rem;letter-spacing:.16em;color:var(--ink);
  word-break:break-all;margin:.2rem 0 .5rem;max-width:60ch}
.glyphs .lose{color:var(--terracotta)}
.glyphs .win{color:var(--verdigris)}

/* ---------- fields ---------- */
.fields{display:grid;gap:.6rem .9rem;grid-template-columns:repeat(auto-fit,minmax(8.5rem,1fr));
  max-width:46rem;margin:.5rem 0 .3rem}
.fields label{display:block;font-family:var(--mono);font-size:.6rem;letter-spacing:.1em;
  text-transform:uppercase;color:var(--dim);margin-bottom:.2rem}
.fields input,.fields select{
  width:100%;font-family:var(--mono);font-size:.85rem;padding:.4rem .5rem;
  background:rgba(253,252,248,.96);border:1px solid var(--rule-firm);color:var(--ink)}
.fields input:focus-visible,.fields select:focus-visible{
  outline:2px solid var(--terracotta);outline-offset:1px}
input[type="range"]{width:100%;max-width:22rem;accent-color:#8a4a2c}
.bignum{font-family:var(--display);font-size:clamp(2rem,9vw,3rem);color:var(--ink);
  line-height:1;margin:.2rem 0 .3rem;font-variant-numeric:tabular-nums}

/* ---------- the source lines at the foot of a game ---------- */
.sources{border-top:1px solid var(--rule);margin-top:1rem;padding-top:.6rem}
.sources li{font-family:var(--mono);font-size:.68rem;line-height:1.65;color:var(--dim);
  margin-bottom:.45rem;word-break:break-word}
.sources li b{color:var(--ink);font-weight:500}
.sources a{color:var(--terracotta);word-break:break-all}

@media (max-width:640px){
  #panel{max-height:62dvh}
  #topbar{padding:.45rem .6rem;gap:.3rem .6rem}
  #topbar .ch{font-size:.92rem}
  button.big{flex:1 1 100%}
  .tally{gap:.25rem .9rem;font-size:.68rem}
}
@media (prefers-reduced-motion:reduce){
  button:active{transform:none}
  button{transition:none}
}

/* ---------- the hunt's own few rules ---------- */
button.stag{border-color:rgba(94,122,106,.75);background:rgba(232,238,231,.96)}
button.stag:hover{background:#e9f0e7;border-color:var(--verdigris)}
button.hare{border-color:rgba(138,74,44,.7);background:rgba(244,232,224,.96)}
button.hare:hover{background:#f7e9e0;border-color:var(--terracotta)}

/* ---------- the site's clothes, worn by an instrument ---------- */
.bar,footer.site-foot,.leaf-mark{
  --serif:"Fraunces",Georgia,serif;
  --sans:"Instrument Sans",-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --paper:#f2efe6;
  --fg:#221e17;
  --dim:#6f6759;
  --line:#d8d2c2;
  --accent:#8a5a24;
  --ease:cubic-bezier(.23,1,.32,1);
}
.bar,footer.site-foot{color:var(--fg)}
footer.site-foot{background:var(--paper)}
.bar .wrap,footer.site-foot .wrap{max-width:calc(64rem + 2 * clamp(.6rem,2vw,1.1rem));
  padding-inline:clamp(.6rem,2vw,1.1rem)}
/* the village is a fixed canvas lying under the whole document, so
   the bar and the footer have to be lifted over it; and the game's
   own overflow rule stops a sticky bar from sticking, so it stands
   still at the top of the page instead of following the scroll */
.bar{position:relative;z-index:3}
footer.site-foot{position:relative;z-index:3}

.wrap{max-width:1180px;margin:0 auto;padding:0 clamp(1.2rem,5vw,3rem)}

/* ---------- top bar ---------- */
.bar{position:sticky;top:0;z-index:30;font-family:var(--sans);background:color-mix(in srgb,var(--paper) 86%,transparent);
  backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.bar .wrap{display:flex;align-items:center;justify-content:space-between;height:58px}
.bar .home{font-family:var(--serif);font-weight:400;font-size:1.05rem;text-decoration:none;letter-spacing:.01em;
  border-bottom:0;color:var(--fg)}
.bar nav{display:flex;gap:clamp(.55rem,1.5vw,1.1rem);align-items:center;flex-wrap:wrap;
  justify-content:flex-end;row-gap:.15rem}
.bar nav a{font-size:.82rem;letter-spacing:.015em;white-space:nowrap;text-decoration:none;color:var(--dim);font-weight:500;
  padding:.3rem 0;border-bottom:1px solid transparent;transition:color .18s var(--ease),border-color .18s var(--ease)}
.bar nav a:hover{color:var(--fg)}
.bar nav a[aria-current]{color:var(--fg);border-bottom-color:var(--accent)}
.langs{display:flex;gap:.1rem;margin-left:.6rem}
.langs button{font-family:var(--mono);font-size:.64rem;letter-spacing:.05em;padding:.3em .45em;
  border:0;background:none;color:var(--dim);cursor:pointer;border-radius:2px}
.langs button:hover{color:var(--fg)}
.langs button[aria-pressed="true"]{color:var(--accent);text-decoration:underline;text-underline-offset:3px}

/* ---------- footer ---------- */
footer{border-top:1px solid var(--line);margin-top:clamp(2rem,6vh,4rem);
  background:none;font-family:var(--sans);line-height:1.6}
footer .foot-links{display:flex;gap:clamp(.9rem,2.4vw,1.6rem);align-items:center;flex-wrap:wrap}
footer .wrap{display:flex;justify-content:space-between;align-items:center;padding-top:1.1rem;padding-bottom:1.4rem;
  font-size:.74rem;color:var(--dim)}
footer a{text-decoration:none;color:var(--dim);border-bottom:0}
footer a:hover{color:var(--fg)}

/* ---------- a leaf, falling once ---------- */
.leaf-mark{position:fixed;top:-30px;pointer-events:none;z-index:5;opacity:.45}
@media (prefers-reduced-motion:reduce){.leaf-mark{display:none}}

/* ---------- the bar and the footer, narrowed ---------- */
@media (max-width:640px){
  /* the bar gives the pages a line of their own instead of crowding them */
  .bar .wrap{flex-wrap:wrap;height:auto;column-gap:.7rem;row-gap:.1rem;
    padding-top:.5rem;padding-bottom:.15rem}
  .bar .home{white-space:nowrap;font-size:1rem}
  .bar nav{order:3;flex:1 0 100%;margin-top:.05rem;flex-wrap:nowrap;
    justify-content:flex-start;gap:clamp(.7rem,3.4vw,1.2rem);
    overflow-x:auto;overscroll-behavior-x:contain;-webkit-overflow-scrolling:touch;
    scrollbar-width:none;
    /* the last name fades rather than being cut, which is what says there
       is more of it to the right */
    -webkit-mask-image:linear-gradient(90deg,#000 calc(100% - 2.2rem),transparent);
    mask-image:linear-gradient(90deg,#000 calc(100% - 2.2rem),transparent);
    padding-right:2.2rem}
  .bar nav::-webkit-scrollbar{display:none}
  .bar nav a{font-size:.8rem;padding:.55rem 0;flex:0 0 auto}
  /* the name of the page you are on is brought into view on load, so a
     reader arriving deep in the site is not looking at a row that starts
     somewhere else */
  .bar nav a[aria-current]{scroll-margin-inline:1.5rem}
  /* the three languages take the right end of the name's own line: a third
     row of bar would eat a fifth of the screen */
  .bar .wrap{position:relative}
  .langs{position:absolute;top:.1rem;right:clamp(1.2rem,5vw,3rem);margin:0;gap:.15rem}
  .langs button{font-size:.7rem;padding:.2em .4em}
  footer .wrap{gap:1rem;flex-wrap:wrap;padding-bottom:calc(1.4rem + env(safe-area-inset-bottom,0px))}
}

/* eight nav names on a narrow phone: the row takes a second and a third
   line rather than push the page sideways, and the words are set tighter
   so that most phones only need two */
@media (max-width:430px){
  .bar nav{gap:.3rem .5rem}
  .bar nav a{font-size:.74rem;letter-spacing:.005em;padding:.42rem 0}
}

/* a finger, not a cursor: every control a thumb has to find is at least a
   thumb wide, in either orientation */
@media (pointer:coarse){
  .bar .home{display:inline-flex;align-items:center;min-height:44px}
  .bar nav a{min-height:44px;min-width:44px;display:inline-flex;align-items:center;
    justify-content:center;padding:.3rem .3rem}
  .langs{gap:.05rem}
  .langs button{min-width:44px;min-height:44px;padding:.3em .35em;
    display:inline-flex;align-items:center;justify-content:center}
  footer .wrap a{min-width:44px;min-height:44px;display:inline-flex;
    align-items:center;justify-content:flex-end}
}

/* the same thumb, on the page itself */
@media (pointer:coarse){
  .cv-btn{min-height:44px;padding:.8rem 1.25rem}
  .copy,.share-link{min-height:44px;min-width:44px;
    display:inline-flex;align-items:center;justify-content:center}
  .socials a{min-height:44px;display:inline-flex;align-items:center}
  .mail-line a.addr{display:inline-flex;align-items:center;min-height:44px}
  .note-read{min-height:44px;min-width:44px;display:inline-flex;align-items:center;justify-content:center}
  .feature .go{min-height:44px;display:inline-flex;align-items:center}
  .gcard .go{min-height:44px;display:inline-flex;align-items:center}
  .go-block{min-height:44px;display:inline-flex;align-items:center}
  .k-btn,.k-skip,.skip{min-height:44px;display:inline-flex;align-items:center}
  input[type=range]{height:44px}
  select{min-height:44px}
  /* a link sitting inside a sentence: the line opens up so the link can be
     a thumb tall without the paragraph closing over it */
  .quiet-line{line-height:2.1}
  .quiet-line a{display:inline-block;padding:.78rem 0;line-height:1.25}
  .note-item h2 a{display:inline-block;padding:.5rem 0;border-bottom:0;
    text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:5px}
  .note-item h2 a:hover{text-decoration-color:var(--accent)}
  /* fields and their kin: 16px so the phone does not zoom, 44 so it can be hit */
  body input[type="text"],body input[type="email"],body input[type="number"],
  body select,body textarea{font-size:16px;min-height:44px}
  body .frow textarea{min-height:8rem}
  /* a 4px tall slider is not a control: the whole strip takes the touch */
  input[type="range"]{height:44px;margin:0;padding:0}
  /* and a sixteen pixel box is not one either */
  input[type="checkbox"],input[type="radio"]{width:22px;height:22px}
  input[type="checkbox"]+label,input[type="radio"]+label{
    display:inline-flex;align-items:center;min-height:44px}
  .demo-src a{display:inline-flex;align-items:center;min-height:44px}
}

/* ---------- the crown, on a page whose interior is its own ---------- */
.k-crown-no{
  display:flex;align-items:center;gap:.55rem;margin-bottom:.85rem;
  font-family:"Fraunces",Georgia,serif;font-style:italic;font-size:1rem;
  color:var(--accent);
}
.k-crown-no svg{flex:none}
.k-lede h1{margin-top:0}


</style>

<script>
/* ============================================================
   The painted world, shared by the games under game/
   ------------------------------------------------------------
   Sky, hills, soil, grass, a house with a lit window, a tree, a
   fence, the people and the things they carry. Everything is
   drawn with canvas primitives. Nothing is loaded, no library is
   used, and once the fonts have arrived no game on this site
   makes a network call.

   The Long Game was written before this file and carries its own
   copy of the same painting inside its own source. Every game
   built after it takes the world from here, and adds only the
   creatures its own subject needs.

   window.KW is the whole surface:
     KW.M            live metrics {W,H,GY,CX,DX,small}
     KW.ctx          the 2d context, after KW.start()
     KW.world        {season, prev, mix, day, dayT, t}
     KW.season(i)    move the year on, with a crossfade
     KW.daylight(v)  0 morning, .55 afternoon, 1 night
     KW.sky()        the current sky pair and how dark it is
     KW.land(t)      sky, hills, the far village, soil and grass
     KW.house(t) .tree(t) .fence(t)
     KW.figure(x,y,t,opts) .basket(x,y,sc,full,spill)
     KW.shadow(x,w,a) .slate(x,y,txt,sc) .coin(x,y,r,a)
     KW.ui           panel helpers
     KW.store(key)   save, load, wipe
     KW.keys(fn)     a keyboard handler that leaves fields alone
     KW.lift(px)     lift the ground line, to leave a band of soil
     KW.start(opts)  {draw:function(t){}, resize:function(){}, lift:px}
   ============================================================ */

window.KW = (function () {
"use strict";

var reduced = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
var FAST = false;
try { FAST = new URLSearchParams(location.search).get("fast") === "1"; } catch (e) {}

function $(id) { return document.getElementById(id); }
function el(tag, cls, txt) {
  var n = document.createElement(tag);
  if (cls) n.className = cls;
  if (txt != null) n.textContent = txt;
  return n;
}
function clamp(v, a, b) { return v < a ? a : v > b ? b : v; }
function lerp(a, b, u) { return a + (b - a) * u; }
function smooth(u) { u = clamp(u, 0, 1); return u * u * (3 - 2 * u); }
function rgb(c, a) { return "rgba(" + (c[0] | 0) + "," + (c[1] | 0) + "," + (c[2] | 0) + "," + (a == null ? 1 : a) + ")"; }
function mix(a, b, u) { return [lerp(a[0], b[0], u), lerp(a[1], b[1], u), lerp(a[2], b[2], u)]; }

/* a small deterministic generator, so that the same year can be
   handed to two different villages and be the same year */
function mulberry(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    var t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

/* ---------- the year ---------- */

var SEASON_NAMES = ["Spring", "Summer", "Autumn", "Winter"];

var SKY_DAY = [
  { top: [178, 200, 214], bot: [238, 226, 206] },
  { top: [162, 192, 214], bot: [240, 230, 198] },
  { top: [196, 196, 188], bot: [242, 210, 158] },
  { top: [186, 200, 214], bot: [224, 226, 224] }
];
var SKY_DUSK = [
  { top: [116, 96, 118], bot: [222, 158, 116] },
  { top: [104, 106, 130], bot: [230, 168, 112] },
  { top: [104, 84, 92], bot: [212, 140, 88] },
  { top: [92, 100, 122], bot: [186, 158, 146] }
];
var SKY_NIGHT = [
  { top: [38, 28, 52], bot: [54, 42, 66] },
  { top: [22, 28, 46], bot: [36, 42, 62] },
  { top: [30, 22, 34], bot: [46, 34, 44] },
  { top: [14, 20, 36], bot: [24, 32, 50] }
];
var HAZE = [[200, 198, 190], [196, 200, 194], [198, 176, 146], [196, 200, 204]];

var GREENS = [[90, 125, 74], [107, 143, 84], [76, 112, 64], [125, 160, 95], [135, 168, 106]];
var AUTUMN = [[200, 132, 46], [178, 91, 40], [217, 154, 60], [163, 74, 34], [194, 106, 36]];
var BLOSSOM = [[232, 180, 200], [242, 210, 221], [223, 160, 184], [240, 198, 212]];
var FROST = [[200, 204, 196]];

var world = { season: 1, prev: 1, mix: 1, day: 0.2, dayT: 0.2, t: 0 };

function sw(k) {
  return (k === world.prev ? (1 - world.mix) : 0) + (k === world.season ? world.mix : 0);
}
function seasonBlend(table, key) {
  var acc = [0, 0, 0];
  for (var k = 0; k < 4; k++) {
    var w = sw(k), c = key ? table[k][key] : table[k];
    acc[0] += c[0] * w; acc[1] += c[1] * w; acc[2] += c[2] * w;
  }
  return acc;
}

/* ---------- the canvas and its measures ---------- */

var M = { W: 0, H: 0, GY: 0, CX: 0, DX: 0, small: false, DPR: 1 };
var cv = null, ctx = null;
var anchorSel = "#panel";
var groundLift = 0;   /* how far above the panel the ground line sits */
var onResize = null, drawGame = null;
var greenLoss = 0;   /* a commons can bleach its own grass: 0 lush, 1 bare */
var showVillage = true;  /* the far houses on the ridge, off where they crowd */

/* ---- seeded furniture ---- */

var treeCanvas = null, treeTips = [], leaves = [], treeW = 0, treeH = 0;
var grassFrames = [], grassKey = -1, grassW = 0, grassLoss = -1;
var farVillage = [];

function buildTree() {
  var rnd = mulberry(20260821);
  treeW = M.small ? 360 : 560;
  treeH = M.small ? 210 : 320;
  treeCanvas = document.createElement("canvas");
  treeCanvas.width = treeW; treeCanvas.height = treeH;
  var g = treeCanvas.getContext("2d");
  treeTips = [];
  var baseX = treeW * 0.5, baseY = treeH;

  function limb(x, y, ang, len, wid, depth) {
    if (depth > 7 || len < 5 || wid < 0.6) { treeTips.push({ x: x, y: y, s: depth / 7 }); return; }
    var a = ang + (rnd() - 0.5) * 0.34;
    var nx = x + Math.cos(a) * len, ny = y + Math.sin(a) * len;
    var bow = (rnd() - 0.5) * len * 0.3;
    g.strokeStyle = "rgb(" + Math.round(lerp(58, 118, depth / 7)) + "," +
                    Math.round(lerp(44, 96, depth / 7)) + "," +
                    Math.round(lerp(30, 70, depth / 7)) + ")";
    g.lineWidth = wid; g.lineCap = "round";
    g.beginPath();
    g.moveTo(x, y);
    g.quadraticCurveTo((x + nx) / 2 - Math.sin(a) * bow, (y + ny) / 2 + Math.cos(a) * bow, nx, ny);
    g.stroke();
    var kids = depth < 2 ? 3 : 2;
    for (var k = 0; k < kids; k++) {
      var na = a + (k - (kids - 1) / 2) * lerp(0.42, 0.86, rnd()) + (rnd() - 0.5) * 0.22;
      limb(nx, ny, na, len * lerp(0.66, 0.82, rnd()), wid * 0.62, depth + 1);
    }
  }
  limb(baseX, baseY, -Math.PI / 2, treeH * 0.25, M.small ? 10 : 14, 0);

  leaves = [];
  var n = M.small ? 320 : 620;
  for (var i = 0; i < n; i++) {
    var tip = treeTips[(rnd() * treeTips.length) | 0];
    var ang = rnd() * 6.283, spread = lerp(4, 30, rnd());
    leaves.push({
      x: tip.x + Math.cos(ang) * spread,
      y: tip.y + Math.sin(ang) * spread * 0.82 - 4,
      sz: lerp(2.6, 5.4, rnd()) * (M.small ? 0.85 : 1),
      gi: (rnd() * GREENS.length) | 0,
      ai: (rnd() * AUTUMN.length) | 0,
      bi: (rnd() * BLOSSOM.length) | 0,
      sway: rnd(), ph: rnd() * 6.283, tilt: rnd() * 6.283,
      keep: rnd()
    });
  }
}

function buildGrass() {
  grassKey = world.prev * 100 + world.season * 10 + Math.round(world.mix * 2);
  grassLoss = Math.round(greenLoss * 4) / 4;
  grassW = Math.max(360, Math.ceil(M.W));
  grassFrames = [];
  var win = sw(3), aut = sw(2), spr = sw(0);
  var bare = grassLoss;
  for (var f = 0; f < 3; f++) {
    var c = document.createElement("canvas");
    c.width = grassW; c.height = 24;
    var g = c.getContext("2d");
    g.lineCap = "round";
    var rnd = mulberry(9182 + f * 0);
    var tufts = Math.round(grassW / 9 * (1 - bare * 0.62));
    for (var i = 0; i < tufts; i++) {
      var gx = rnd() * grassW, ph = rnd() * 6.283;
      var blades = 3 + (rnd() * 3 | 0);
      for (var b = 0; b < blades; b++) {
        var bx = gx + (rnd() - 0.5) * 6;
        var hgt = (5 + rnd() * 10) * (1 - bare * 0.5);
        var lean = Math.sin(f / 3 * 6.283 + ph + b * 0.9) * (1.8 + hgt * 0.15);
        var u = rnd();
        var r = Math.round(lerp(lerp(74, 148, u * 0.5), 170, aut * 0.55 + win * 0.72 + bare * 0.5));
        var gg = Math.round(lerp(lerp(106, 138, u), 152, win * 0.75) * (1 - bare * 0.28));
        var bb = Math.round(lerp(lerp(52, 70, u * 0.4), 132, win * 0.85));
        g.strokeStyle = "rgba(" + r + "," + gg + "," + bb + ",.86)";
        g.lineWidth = 1.25 - hgt * 0.028;
        g.beginPath();
        g.moveTo(bx, 23);
        g.bezierCurveTo(bx + lean * 0.15, 23 - hgt * 0.45,
                        bx + lean * 0.6, 23 - hgt * 0.85,
                        bx + lean + (rnd() - 0.5) * 3, 23 - hgt);
        g.stroke();
      }
      if (rnd() < 0.09 * Math.max(0, 1 - win * 1.4) * (1 - aut * 0.5) * (1 - bare)) {
        var fx = gx + 2, fy = 23 - 8 - rnd() * 4;
        g.strokeStyle = "rgba(88,118,60,.8)"; g.lineWidth = 0.9;
        g.beginPath(); g.moveTo(fx, 23); g.lineTo(fx, fy + 2); g.stroke();
        g.fillStyle = rnd() < 0.5 ? "rgba(246,242,230,.95)" : "rgba(232,196,90,.95)";
        for (var pe = 0; pe < 5; pe++) {
          var pa = pe * 1.257 + f;
          g.beginPath();
          g.ellipse(fx + Math.cos(pa) * 2, fy + Math.sin(pa) * 2, 1.4, 0.85, pa, 0, 6.283);
          g.fill();
        }
        g.fillStyle = spr > 0.4 ? "rgba(240,170,60,.9)" : "rgba(120,90,40,.9)";
        g.beginPath(); g.arc(fx, fy, 1.1, 0, 6.283); g.fill();
      }
    }
    grassFrames.push(c);
  }
}

function buildFarVillage() {
  var rnd = mulberry(4711);
  farVillage = [];
  for (var i = 0; i < 6; i++) {
    farVillage.push({ u: 0.05 + i * 0.165 + (rnd() - 0.5) * 0.05, w: 16 + rnd() * 14, h: 12 + rnd() * 12, lit: rnd() });
  }
}

function layout() {
  var a = document.querySelector(anchorSel);
  var top = a ? a.getBoundingClientRect().top : M.H * 0.7;
  M.GY = clamp(top - 10 - groundLift, M.H * 0.34, M.H * 0.84);
  M.CX = M.W * 0.5;
  M.DX = M.small ? Math.min(66, M.W * 0.19) : Math.min(140, M.W * 0.15);
}

function resize() {
  M.DPR = Math.min(2, window.devicePixelRatio || 1);
  M.W = window.innerWidth; M.H = window.innerHeight;
  M.small = M.W < 700;
  cv.width = Math.round(M.W * M.DPR); cv.height = Math.round(M.H * M.DPR);
  cv.style.width = M.W + "px"; cv.style.height = M.H + "px";
  ctx.setTransform(M.DPR, 0, 0, M.DPR, 0, 0);
  layout();
  buildTree(); buildGrass(); buildFarVillage();
  if (onResize) onResize();
  frameOnce();
}

/* ---------- painting ---------- */

function shadow(x, w, a) {
  ctx.save();
  ctx.translate(x, M.GY + 1);
  ctx.scale(1, 0.2);
  var g = ctx.createRadialGradient(0, 0, 0, 0, 0, w);
  g.addColorStop(0, "rgba(20,14,8," + a + ")");
  g.addColorStop(1, "rgba(20,14,8,0)");
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.arc(0, 0, w, 0, 6.283); ctx.fill();
  ctx.restore();
}

function skyPair() {
  var d = world.dayT;
  var day = seasonBlend(SKY_DAY, "top"), dayB = seasonBlend(SKY_DAY, "bot");
  var dusk = seasonBlend(SKY_DUSK, "top"), duskB = seasonBlend(SKY_DUSK, "bot");
  var night = seasonBlend(SKY_NIGHT, "top"), nightB = seasonBlend(SKY_NIGHT, "bot");
  var top, bot;
  if (d < 0.6) { var u = smooth(d / 0.6); top = mix(day, dusk, u); bot = mix(dayB, duskB, u); }
  else { var v = smooth((d - 0.6) / 0.4); top = mix(dusk, night, v); bot = mix(duskB, nightB, v); }
  return { top: top, bot: bot, night: clamp((d - 0.55) / 0.35, 0, 1) };
}

function drawSky(t) {
  var W = M.W, H = M.H, GY = M.GY, small = M.small;
  var sk = skyPair();
  var g = ctx.createLinearGradient(0, 0, 0, GY + 40);
  g.addColorStop(0, rgb(sk.top));
  g.addColorStop(1, rgb(sk.bot));
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);

  if (sk.night > 0.08) {
    var rnd = mulberry(3311);
    ctx.save();
    for (var i = 0; i < (small ? 46 : 90); i++) {
      var sx = rnd() * W, sy = rnd() * GY * 0.72;
      var tw = 0.45 + Math.sin(t * (0.8 + rnd() * 1.6) + i) * 0.35;
      ctx.fillStyle = "rgba(236,232,216," + (sk.night * tw * 0.8) + ")";
      ctx.fillRect(sx, sy, 1.5, 1.5);
    }
    ctx.restore();
  }

  var sunU = world.dayT;
  var arcX = W * (0.24 + sunU * 0.6);
  var arcY = GY * (0.26 + Math.pow(clamp((sunU - 0.1) / 0.8, 0, 1), 1.7) * 0.56);
  var sunA = 1 - clamp((sunU - 0.55) / 0.28, 0, 1);
  if (sunA > 0.02) {
    var warm = mix([250, 240, 212], [244, 168, 96], smooth(clamp((sunU - 0.25) / 0.4, 0, 1)));
    var hg = ctx.createRadialGradient(arcX, arcY, 0, arcX, arcY, GY * 0.5);
    hg.addColorStop(0, rgb(warm, 0.3 * sunA));
    hg.addColorStop(1, rgb(warm, 0));
    ctx.fillStyle = hg;
    ctx.fillRect(arcX - GY * 0.5, arcY - GY * 0.5, GY, GY);
    ctx.fillStyle = rgb(warm, 0.95 * sunA);
    ctx.beginPath(); ctx.arc(arcX, arcY, small ? 13 : 17, 0, 6.283); ctx.fill();
  }
  if (sk.night > 0.2) {
    var mx = W * 0.78, my = GY * 0.2;
    ctx.fillStyle = "rgba(238,236,222," + (0.9 * sk.night) + ")";
    ctx.beginPath(); ctx.arc(mx, my, small ? 11 : 14, 0, 6.283); ctx.fill();
    ctx.fillStyle = rgb(sk.top, 0.85 * sk.night);
    ctx.beginPath(); ctx.arc(mx + 5, my - 4, small ? 10 : 13, 0, 6.283); ctx.fill();
  }

  if (sk.night < 0.6 && sw(3) < 0.7) {
    var bn = small ? 3 : 5;
    ctx.strokeStyle = "rgba(70,60,48," + (0.45 * (1 - sk.night)) + ")";
    ctx.lineWidth = 1.2;
    for (var bi = 0; bi < bn; bi++) {
      var ba = t * (0.16 + bi * 0.03) + bi * 2.1;
      var brr = (small ? 26 : 44) + bi * (small ? 7 : 11);
      var bx2 = W * 0.68 + Math.cos(ba) * brr;
      var by2 = GY * 0.34 + Math.sin(ba) * brr * 0.4 - bi * 7;
      var bf = reduced ? 1.4 : Math.sin(t * 5 + bi * 2.4) * 2.2;
      ctx.beginPath();
      ctx.moveTo(bx2 - 5, by2);
      ctx.quadraticCurveTo(bx2 - 2.5, by2 - 3 - bf, bx2, by2);
      ctx.quadraticCurveTo(bx2 + 2.5, by2 - 3 - bf, bx2 + 5, by2);
      ctx.stroke();
    }
  }

  var cloudA = 0.5 * (1 - sk.night * 0.7);
  if (cloudA > 0.02) {
    var cl = [[0.09, 0.16, 1.15, 13], [0.42, 0.10, 0.85, 9], [0.72, 0.22, 1.0, 17]];
    for (var c = 0; c < 3; c++) {
      var cx = ((t * cl[c][3] * 0.35 + cl[c][0] * (W + 400)) % (W + 400)) - 200;
      var cy = GY * cl[c][1];
      var s = cl[c][2] * (small ? 0.7 : 1);
      ctx.fillStyle = "rgba(248,245,236," + (cloudA * 0.62) + ")";
      for (var p = 0; p < 5; p++) {
        ctx.beginPath();
        ctx.ellipse(cx + p * 26 * s, cy + Math.sin(p * 1.7) * 5 * s,
                    (26 - Math.abs(p - 2) * 6) * s, (13 - Math.abs(p - 2) * 2.4) * s, 0, 0, 6.283);
        ctx.fill();
      }
    }
  }
}

function hill(y, amp, freq, ph, col) {
  ctx.fillStyle = col;
  ctx.beginPath();
  ctx.moveTo(-20, M.H);
  for (var x = -20; x <= M.W + 20; x += 10) {
    ctx.lineTo(x, y + Math.sin(x * freq * 6.28 + ph) * amp * 0.4 + Math.sin(x * freq * 17 + ph * 1.7) * amp * 0.2);
  }
  ctx.lineTo(M.W + 20, M.H);
  ctx.closePath(); ctx.fill();
}

function drawLand(t, opts) {
  opts = opts || {};
  var W = M.W, H = M.H, GY = M.GY, small = M.small;
  var sk = skyPair();
  var hz = seasonBlend(HAZE);
  hz = mix(hz, [40, 44, 58], sk.night * 0.75);

  hill(GY - (small ? 42 : 66), small ? 16 : 26, 0.0011, 8, rgb(hz, 0.34));

  if (opts.village !== false && showVillage) {
    for (var i = 0; i < farVillage.length; i++) {
      var v = farVillage[i];
      var vx = v.u * W, vy = GY - (small ? 18 : 27), vw = v.w * (small ? 0.4 : 0.58), vh = v.h * (small ? 0.4 : 0.58);
      ctx.fillStyle = rgb(mix(hz, [52, 42, 30], 0.82), 0.9);
      ctx.fillRect(vx, vy - vh, vw, vh);
      ctx.beginPath();
      ctx.moveTo(vx - 3, vy - vh); ctx.lineTo(vx + vw / 2, vy - vh - vh * 0.5); ctx.lineTo(vx + vw + 3, vy - vh);
      ctx.closePath(); ctx.fill();
      if (sk.night > 0.25 && v.lit > 0.3) {
        ctx.fillStyle = "rgba(240,196,110," + (0.75 * sk.night) + ")";
        ctx.fillRect(vx + vw * 0.35, vy - vh * 0.6, 2.2, 2.2);
      }
    }
  }
  hill(GY - (small ? 16 : 26), small ? 10 : 15, 0.0017, 40, rgb(hz, 0.62));

  var fog = ctx.createLinearGradient(0, GY - (small ? 60 : 92), 0, GY);
  fog.addColorStop(0, rgb(hz, 0));
  fog.addColorStop(1, rgb(hz, 0.3));
  ctx.fillStyle = fog;
  ctx.fillRect(0, GY - (small ? 60 : 92), W, small ? 60 : 92);

  var soil = ctx.createLinearGradient(0, GY, 0, H);
  var s0 = mix([64, 52, 36], [26, 24, 38], sk.night * 0.7);
  var s1 = mix([44, 33, 21], [16, 16, 28], sk.night * 0.7);
  soil.addColorStop(0, rgb(s0));
  soil.addColorStop(1, rgb(s1));
  ctx.fillStyle = soil;
  ctx.fillRect(0, GY, W, H - GY);

  var want = world.prev * 100 + world.season * 10 + Math.round(world.mix * 2);
  if (grassKey !== want || grassW < W || grassLoss !== Math.round(greenLoss * 4) / 4) buildGrass();
  var ph = reduced ? 0 : (Math.sin(t * 0.9) * 0.5 + 0.5);
  var f0 = Math.floor(ph * 3) % 3, f1 = (f0 + 1) % 3, u = (ph * 3) % 1;
  ctx.save();
  ctx.globalAlpha = 1;
  ctx.drawImage(grassFrames[f0], 0, GY - 22, grassW, 24);
  ctx.globalAlpha = u;
  ctx.drawImage(grassFrames[f1], 0, GY - 22, grassW, 24);
  ctx.globalAlpha = 1;
  if (sk.night > 0.03) {
    ctx.fillStyle = "rgba(22,25,42," + (0.4 * sk.night) + ")";
    ctx.fillRect(0, GY - 22, W, H - GY + 22);
  }
  ctx.restore();
}

function drawHouse(t, ux) {
  var W = M.W, GY = M.GY, small = M.small;
  var sk = skyPair();
  var s = small ? 0.76 : 1.05;
  var hx = ux == null ? (small ? W * 0.17 : W * 0.145) : ux, hy = GY;
  ctx.save();
  ctx.translate(hx, hy);
  ctx.scale(s, s);

  var lit = Math.max(sk.night, sw(3) * 0.22);

  if (sw(3) > 0.35 || sw(2) > 0.5 || sk.night > 0.25) {
    for (var m = 0; m < 3; m++) {
      var st = ((reduced ? 0.4 : t * 0.22) + m * 0.33) % 1;
      ctx.fillStyle = "rgba(200,195,185," + (0.2 * (1 - st)) + ")";
      ctx.beginPath();
      ctx.arc(28 + Math.sin(st * 5 + m) * 6, -102 - st * 34, 4 + st * 7, 0, 6.283);
      ctx.fill();
    }
  }

  shadow(0, 60, 0.3 * (1 - sk.night * 0.5));

  ctx.fillStyle = "#4a4038";
  ctx.fillRect(-48, -7, 96, 7);
  ctx.fillStyle = "rgba(120,110,96,.5)";
  for (var f = 0; f < 6; f++) {
    ctx.beginPath(); ctx.ellipse(-40 + f * 16, -3.5, 6.5, 2.6, 0, 0, 6.283); ctx.fill();
  }

  var wg = ctx.createLinearGradient(0, -72, 0, -7);
  wg.addColorStop(0, "#67503a");
  wg.addColorStop(1, "#523d29");
  ctx.fillStyle = wg;
  ctx.fillRect(-46, -72, 92, 65);
  for (var pl = 1; pl < 6; pl++) {
    var py = -72 + pl * 11;
    ctx.strokeStyle = "rgba(30,20,12,.35)"; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(-46, py); ctx.lineTo(46, py); ctx.stroke();
    ctx.strokeStyle = "rgba(180,150,110,.14)";
    ctx.beginPath(); ctx.moveTo(-46, py + 1); ctx.lineTo(46, py + 1); ctx.stroke();
  }
  ctx.fillStyle = "#4a3826";
  ctx.fillRect(-48, -73, 4, 66);
  ctx.fillRect(44, -73, 4, 66);

function drawTree(t, ux, scale) {
  if (!treeCanvas) return;
  var W = M.W, GY = M.GY, small = M.small;
  var sk = skyPair();
  var s = (small ? 0.74 : 0.98) * (scale || 1);
  var tx = ux == null ? (small ? W * 0.82 : W * 0.83) : ux, ty = GY;
  ctx.save();
  ctx.translate(tx, ty);
  ctx.scale(s, s);
  shadow(0, treeW * 0.24, 0.26 * (1 - sk.night * 0.5));
  ctx.drawImage(treeCanvas, -treeW / 2, -treeH);
  var gust = reduced ? 0 : (0.5 + Math.sin(t * 0.5) * 0.5);
  var win = sw(3), aut = sw(2), spr = sw(0);
  for (var i = 0; i < leaves.length; i++) {
    var L = leaves[i];
    if (win > 0.5 && L.keep > 1 - (win - 0.5) * 1.6) continue;
    var col = GREENS[L.gi];
    if (aut > 0) col = mix(col, AUTUMN[L.ai], aut * 0.92);
    if (spr > 0 && L.gi % 3 === 0) col = mix(col, BLOSSOM[L.bi], spr * 0.9);
    if (win > 0) col = mix(col, FROST[0], win * 0.7);
    if (sk.night > 0) col = mix(col, [30, 34, 46], sk.night * 0.62);
    var sway = reduced ? 0 : Math.sin(t * 1.6 + L.ph) * (1.2 + L.sway * 5) * (0.4 + gust * 0.6);
    ctx.save();
    ctx.translate(-treeW / 2 + L.x + sway, -treeH + L.y);
    ctx.rotate(L.tilt + sway * 0.03);
    ctx.fillStyle = rgb(col);
    ctx.beginPath();
    ctx.moveTo(0, -L.sz);
    ctx.quadraticCurveTo(L.sz * 0.7, -L.sz * 0.2, 0, L.sz);
    ctx.quadraticCurveTo(-L.sz * 0.7, -L.sz * 0.2, 0, -L.sz);
    ctx.fill();
    ctx.restore();
  }
  ctx.restore();
}

function drawFence(t, ux) {
  var GY = M.GY, small = M.small;
  var sk = skyPair();
  var n = 6;
  var cx = ux == null ? M.CX : ux;
  var bx = cx, by = GY + (small ? 22 : 34);
  var tx = cx + (small ? 16 : 26), ty = GY - (small ? 34 : 54);
  var pts = [];
  for (var i = 0; i < n; i++) {
    var u = i / (n - 1);
    pts.push({ x: lerp(bx, tx, u), y: lerp(by, ty, u), h: lerp(small ? 34 : 52, small ? 13 : 20, u), w: lerp(4.4, 1.8, u) });
  }
  var dark = sk.night;
  var post = mix([103, 80, 58], [34, 32, 44], dark * 0.7);
  var rail = mix([120, 96, 68], [40, 38, 50], dark * 0.7);
  var levels = [0.74, 0.5, 0.26];
  for (var r = 0; r < levels.length; r++) {
    ctx.fillStyle = rgb(rail, 0.95);
    ctx.beginPath();
    for (var j = 0; j < n; j++) {
      var p = pts[j], th = lerp(4.2, 1.6, j / (n - 1));
      var yy = p.y - p.h * levels[r];
      if (j === 0) ctx.moveTo(p.x, yy - th / 2); else ctx.lineTo(p.x, yy - th / 2);
    }
    for (var j2 = n - 1; j2 >= 0; j2--) {
      var p2 = pts[j2], th2 = lerp(4.2, 1.6, j2 / (n - 1));
      ctx.lineTo(p2.x, p2.y - p2.h * levels[r] + th2 / 2);
    }
    ctx.closePath(); ctx.fill();
  }
  for (var k = 0; k < n; k++) {
    var q = pts[k];
    ctx.fillStyle = rgb(post, 0.98);
    ctx.fillRect(q.x - q.w / 2, q.y - q.h, q.w, q.h);
    ctx.fillStyle = "rgba(20,14,8,.32)";
    ctx.fillRect(q.x - q.w / 2, q.y - q.h, q.w * 0.34, q.h);
    ctx.fillStyle = rgb(mix(post, [180, 156, 120], 0.35), 0.95);
    ctx.fillRect(q.x - q.w / 2, q.y - q.h, q.w, 1.4);
  }
  return pts[0];
}

/* ---------- the people ---------- */

function drawFigure(x, y, t, o) {
  var s = (o.scale || 1) * (M.small ? 1.6 : 2.05);
  ctx.save();
  ctx.translate(x, y);
  ctx.scale(s, s);
  if (o.face === -1) ctx.scale(-1, 1);

  var sk = skyPair();
  var dim = sk.night * 0.55;
  function dk(hex) {
    var c = [parseInt(hex.slice(1, 3), 16), parseInt(hex.slice(3, 5), 16), parseInt(hex.slice(5, 7), 16)];
    return rgb(mix(c, [30, 32, 44], dim));
  }

  ctx.strokeStyle = trouser; ctx.lineWidth = 3; ctx.lineCap = "round";
  ctx.beginPath(); ctx.moveTo(0, -20); ctx.lineTo(-2 + step * 3.4, -10 + Math.abs(step)); ctx.lineTo(-2 + step * 4.4, 0); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(0, -20); ctx.lineTo(2 - step * 3.4, -10 + Math.abs(step)); ctx.lineTo(2 - step * 4.4, 0); ctx.stroke();
  ctx.strokeStyle = dk("#17110c"); ctx.lineWidth = 2.2;
  ctx.beginPath(); ctx.moveTo(-2 + step * 4.4, 0); ctx.lineTo(1.2 + step * 4.4, 0); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(2 - step * 4.4, 0); ctx.lineTo(5.2 - step * 4.4, 0); ctx.stroke();

  ctx.strokeStyle = coat; ctx.lineWidth = o.stout ? 6.2 : 5;
  ctx.beginPath(); ctx.moveTo(0, -20); ctx.lineTo(0, -31); ctx.stroke();

  ctx.strokeStyle = armCol; ctx.lineWidth = 2.6;
  if (o.pose === "offer") {
    var reach = o.reach == null ? 1 : o.reach;
    ctx.beginPath(); ctx.moveTo(0, -29); ctx.lineTo(-3, -24); ctx.lineTo(-3.5, -19); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(0, -28); ctx.lineTo(6 + reach * 4, -25); ctx.lineTo(10 + reach * 7, -22); ctx.stroke();
  } else if (o.pose === "withhold") {
    ctx.beginPath(); ctx.moveTo(0, -28); ctx.lineTo(-5, -24); ctx.lineTo(-2, -20); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(0, -28); ctx.lineTo(5, -24); ctx.lineTo(2, -20); ctx.stroke();
  } else if (o.pose === "wave") {
    var wa = reduced ? 0.2 : Math.sin(t * 7) * 0.5;
    ctx.beginPath(); ctx.moveTo(0, -29); ctx.lineTo(-4, -24); ctx.lineTo(-5, -20); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(0, -29); ctx.lineTo(6, -33); ctx.lineTo(9 + wa * 2, -39 + Math.abs(wa)); ctx.stroke();
    ctx.fillStyle = skin;
    ctx.beginPath(); ctx.arc(9.6 + wa * 2, -40 + Math.abs(wa), 1.7, 0, 6.283); ctx.fill();
  } else if (o.pose === "hold") {
    /* both hands out in front, holding something up */
    ctx.beginPath(); ctx.moveTo(0, -29); ctx.lineTo(4, -27); ctx.lineTo(6, -31); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(0, -28); ctx.lineTo(-4, -26); ctx.lineTo(-6, -30); ctx.stroke();
  } else if (o.pose === "aim") {
    /* a spear held level, the far arm forward */
    ctx.beginPath(); ctx.moveTo(0, -29); ctx.lineTo(5, -27); ctx.lineTo(9, -26); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(0, -27); ctx.lineTo(3, -23); ctx.lineTo(6, -24); ctx.stroke();
  } else if (o.pose === "sit") {
    ctx.beginPath(); ctx.moveTo(0, -29); ctx.lineTo(5, -26); ctx.lineTo(8, -24); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(0, -28); ctx.lineTo(-4, -25); ctx.lineTo(-2, -22); ctx.stroke();
  } else {
    var swing = step * 2.4;
    ctx.beginPath(); ctx.moveTo(0, -29); ctx.lineTo(-2 - swing, -24); ctx.lineTo(-2.5 - swing, -19); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(0, -29); ctx.lineTo(2 + swing, -24); ctx.lineTo(2.5 + swing, -19); ctx.stroke();
  }

  if (o.scarf) {
    ctx.strokeStyle = dk(o.scarf); ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(-3.4, -30.5); ctx.lineTo(3.4, -30.5); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(2.4, -30); ctx.lineTo(3.4, -24); ctx.stroke();
  }

  ctx.save();
  ctx.translate(0, -36);
  ctx.fillStyle = skin;
  ctx.beginPath(); ctx.arc(0, 0, 4.6, 0, 6.283); ctx.fill();

    ctx.fillRect(-5, -1.2, 10, 1.6);
    ctx.strokeStyle = hair; ctx.lineWidth = 2.2; ctx.lineCap = "round";
    var bw = reduced ? 0 : Math.sin(t * 1.4) * 1.2;
    ctx.beginPath(); ctx.moveTo(-4.4, -0.4); ctx.quadraticCurveTo(-7 + bw, 4, -5.4 + bw, 9); ctx.stroke();
  } else if (hs === "crop") {
    ctx.beginPath(); ctx.arc(0, -1, 4.9, Math.PI * 1.02, -0.02); ctx.fill();
    ctx.fillRect(-4.8, -1.4, 9.6, 1.4);

    ctx.beginPath(); ctx.arc(0, -1, 5, Math.PI, 0); ctx.fill();
    ctx.fillRect(-5, -1.4, 10, 1.5);

  } else if (hs === "cap") {
    ctx.beginPath(); ctx.arc(0, -0.6, 5.1, Math.PI, 0); ctx.fill();
    ctx.fillStyle = dk(o.capCol || "#5b7d8a");
    ctx.beginPath(); ctx.arc(0, -1.2, 5.2, Math.PI, 0); ctx.fill();
    ctx.fillRect(-7.4, -1.6, 9, 1.5);
  } else if (hs === "hat") {
    ctx.beginPath(); ctx.arc(0, -0.6, 4.9, Math.PI, 0); ctx.fill();
    ctx.fillStyle = dk(o.capCol || "#6b5334");
    ctx.fillRect(-8, -4.6, 16, 1.8);
    ctx.fillRect(-4.2, -10, 8.4, 5.6);
  }
  ctx.strokeStyle = "rgba(60,34,20,.8)"; ctx.lineWidth = 0.7;
  ctx.beginPath(); ctx.arc(0.6, 1, 1.8, 0.3, 2.0); ctx.stroke();
  ctx.restore();

  if (o.prop === "stick") {
    ctx.strokeStyle = dk("#6b5334"); ctx.lineWidth = 1.6;
    ctx.beginPath(); ctx.moveTo(-3, -19); ctx.lineTo(-6, 1); ctx.stroke();
  } else if (o.prop === "spear") {
    ctx.strokeStyle = dk("#6b5334"); ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(9, -30); ctx.lineTo(11, 1); ctx.stroke();
    ctx.fillStyle = dk("#6f6759");
    ctx.beginPath(); ctx.moveTo(9, -30); ctx.lineTo(11.4, -36); ctx.lineTo(11.6, -29.6); ctx.closePath(); ctx.fill();
  } else if (o.prop === "dog") {
    ctx.save();
    ctx.translate(-13, 0);
    ctx.fillStyle = dk("#5a4a34");
    ctx.beginPath(); ctx.ellipse(0, -5, 5.4, 3.2, 0, 0, 6.283); ctx.fill();
    ctx.beginPath(); ctx.arc(5, -8.4, 2.8, 0, 6.283); ctx.fill();
    ctx.strokeStyle = dk("#5a4a34"); ctx.lineWidth = 1.6; ctx.lineCap = "round";
    ctx.beginPath(); ctx.moveTo(-3, -3); ctx.lineTo(-3.4, 0); ctx.moveTo(3, -3); ctx.lineTo(3.4, 0); ctx.stroke();
    var tw = reduced ? 0 : Math.sin(t * 6) * 2.4;
    ctx.beginPath(); ctx.moveTo(-5, -6); ctx.lineTo(-8, -9 + tw); ctx.stroke();
    ctx.restore();

  ctx.restore();
}

/* ---------- weather ---------- */

var motes = [];
function stepMotes(t, dt) {
  var win = sw(3), spr = sw(0), aut = sw(2);
  var want = reduced ? 0 : Math.round(win * (M.small ? 30 : 60) + spr * (M.small ? 12 : 22) + aut * (M.small ? 14 : 26));
  while (motes.length < want) {
    motes.push({ x: Math.random() * M.W, y: Math.random() * M.GY, vx: (Math.random() - 0.5) * 12,
                 vy: 12 + Math.random() * 26, r: 1 + Math.random() * 2.2, ph: Math.random() * 6.28 });
  }
  while (motes.length > want) motes.pop();
  for (var i = 0; i < motes.length; i++) {
    var m = motes[i];
    m.y += m.vy * dt;
    m.x += (m.vx + Math.sin(t * 1.4 + m.ph) * 14) * dt;
    if (m.y > M.GY - 2) { m.y = -6; m.x = Math.random() * M.W; }
    if (m.x < -10) m.x = M.W + 8; else if (m.x > M.W + 10) m.x = -8;
  }
}
function drawMotes() {
  var win = sw(3), spr = sw(0), aut = sw(2);
  var col = win > Math.max(spr, aut) ? [236, 240, 240] : spr > aut ? [238, 196, 214] : [196, 120, 52];
  var sk = skyPair();
  ctx.fillStyle = rgb(mix(col, [60, 62, 80], sk.night * 0.5), 0.7);
  for (var i = 0; i < motes.length; i++) {
    var m = motes[i];
    ctx.beginPath(); ctx.arc(m.x, m.y, m.r, 0, 6.283); ctx.fill();
  }
}

/* ---------- the loop ---------- */

var lastT = 0;
function paint(t) {
  ctx.setTransform(M.DPR, 0, 0, M.DPR, 0, 0);
  drawSky(t);
  drawLand(t);
  if (drawGame) drawGame(t);
  drawMotes();
  var v = ctx.createRadialGradient(M.W / 2, M.GY * 0.55, M.GY * 0.4, M.W / 2, M.GY * 0.6, Math.max(M.W, M.H) * 0.8);
  v.addColorStop(0, "rgba(0,0,0,0)");
  v.addColorStop(1, "rgba(10,10,16,.26)");
  ctx.fillStyle = v;
  ctx.fillRect(0, 0, M.W, M.H);
}
function frameOnce() { paint(world.t); }
function frame(now) {
  var tt = now / 1000;
  var dt = Math.min(0.05, tt - lastT || 0.016);
  lastT = tt;
  if (!reduced) world.t = tt;
  if (world.mix < 1) world.mix = Math.min(1, world.mix + dt * (reduced ? 4 : 0.9));
  world.dayT += (world.day - world.dayT) * (reduced ? 1 : Math.min(1, dt * 1.6));
  stepMotes(world.t, dt);
  paint(world.t);
  requestAnimationFrame(frame);
}

/* ---------- the interface, in ordinary HTML ---------- */

var ui = {
  panel: null, live: null,

  acted: false,
  reading: {},

    var b = ui.panel.querySelector("button:not([disabled])");

};

function store(key) {
  return {
    save: function (o) { try { localStorage.setItem(key, JSON.stringify(o)); } catch (e) {} },
    load: function () {
      try {
        var raw = localStorage.getItem(key);
        return raw ? JSON.parse(raw) : null;
      } catch (e) { return null; }
    },
    wipe: function () { try { localStorage.removeItem(key); } catch (e) {} }
  };
}

function keys(fn) {
  document.addEventListener("keydown", function (e) {
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    var tag = (e.target && e.target.tagName) || "";
    if (tag === "INPUT" || tag === "SELECT" || tag === "TEXTAREA") return;

  });

function start(opts) {

var api = {

};
return api;
})();

window.PAGE_I18N = {"tr": {"pg-desc": "Açgözlülükten çok güven üzerine bir oyun. İki avcı birlikte bir geyik alıp doyabilir ya da tek başına bir tavşan alıp az yiyebilir. Köyün iyi sonuçta mı yoksa güvenli olanda mı yaşayacağına, her avcının ötekinin ne yapacağına dair inancı karar veriyor.", "sh-h1": "Geyik Avı", "sh-skip": "Seçimlere atla", "sh-restart": "Baştan başla", "sh-name": "Geyik Avı", "sh-when-ridge": "köyün üstünde bir sırt, şafaktan önce", "sh-when-arg": "savın kendisi, açıkça", "sh-when-what": "bunun ne olduğu", "sh-when-hunts": "{n} seninle avlanıyor", "sh-when-morn": "{s}, sabah {a} / {b}", "sh-when-after": "{s}, ertesi gün", "sh-ch": "Bölüm {n}. {t}", "sh-ch1": "İlk av", "sh-ch2": "Haber yayılır", "sh-ch3": "Nehrin kabardığı sabah", "sh-sea-0": "İlkbahar", "sh-sea-1": "Yaz", "sh-sea-2": "Sonbahar", "sh-sea-3": "Kış", "sh-t-p1": "Bir geyik beş günlük yemek eder ve tek kişiyle alınamaz. Bir tavşan iki günlük eder ve alınır. İkiniz de sırta çıkıp beklerseniz geyik sizindir, ikiniz de iyi yersiniz. Biriniz diğeri hâlâ beklerken tavşan için sırttan inerse tavşan alınır ve beklemeye devam eden eve eli boş döner.", "sh-t-p2": "Burada kimse kimseyi kandırmak istemiyor. Her mevsim tek bir şeye karar veriyorsun: diğerinin orada olacağına inanıp inanmadığına.", "sh-b-resume": "{n}. bölümden devam et", "sh-b-climb": "Sırta çık", "sh-s-title": "Geyik Avı. İki avcı, bir geyik ve otların içinde tavşanlar.", "sh-tally-you": "Bu bölümde yediğin ", "sh-i1-kick": "Birinci bölüm", "sh-i1-head": "İlk av", "sh-i1-b1": "Tarik seninle aynı sırtta avlanıyor. Daha önce hiç birlikte çalışmadınız. Şafaktan önce diğerinin ne yapacağı hakkında ikinizin de hiçbir fikri yok ve bunu önceden kararlaştırmanın bir yolu da yok, çünkü köyün iki ucundan yola çıkıyorsunuz.", "sh-i1-b2": "Sekiz sabah. Her birinde sen geyiği ya da tavşanı seçiyorsun, o da öyle.", "sh-i2-kick": "İkinci bölüm", "sh-i2-head": "Haber yayılır", "sh-i2-b1": "Roza mevsimin nasıl geçtiğini duymuş. Seninle daha önce olduğunda hâlâ sırttaydı ve eli boştu; senin patikadan elinde bir şeyle çıktığını gördü.", "sh-rw-hh": "İkiniz de tavşan için indiniz. Adam başı iki günlük yemek; sırttaki geyikse ikinizden de hiçbir zaman tehlikede olmadı.", "sh-r-youate": "Sen {d} yedin. {r}", "sh-r-day1": "bir gün", "sh-r-days": "{p} gün", "sh-r-theyate": "{n} {d} yedi.", "sh-r-riverate": "{n} nehrin kendi yakasında ne varsa onu yedi.", "sh-b-chend": "Bölüm bitiyor", "sh-b-nextmorn": "Ertesi sabah", "sh-ce-kick": "Bölüm {n} sonu", "sh-ce1-h": "Kimse açgözlü değildi", "sh-ce1-p1": "Dört sayıyı yeniden oku. Diğerini yüzüstü bırakmanın kazandırdığı tek bir hücre yok. Onun sırtta beklediğinden eminsen senin en iyi hamlen de beklemek, çünkü beş ikiyi geçer. Tavşana indiğinden eminsen senin en iyi hamlen de tavşan, çünkü iki hiçlikten iyidir.", "sh-ce1-p2": "Bunu bildik ikilemden ayıran da bu. İkinizin de beklemesi kararlı bir durum; ikinizin de otlarda olması da kararlı. İki cevap, ikisi de doğru ve hangisinde yaşayacağınıza sayıların içinde karar veren hiçbir şey yok.", "sh-ce1-p3": "Karar veren, her birinizin beklentisi. Tarik sırta ilk kez senden çok az şey bekleyerek çıktı; o yüzden tavşan aldı ve aldığı her tavşan seni beklemeye daha az istekli yaptı; otlarda geçirdiğin her sabah da onu haklı çıktığına daha çok inandırdı.", "sh-ce1-p4": "Bundan sonra onun ne düşündüğünü görebileceksin. Hep oradaydı; kımıldayan sayı buydu.", "sh-m-expectnow": "{n} şu an senden ne bekliyor", "sh-ce2-h": "Aynı av, farklı bir açılış", "sh-ce2-p1": "Roza, Tarik'le aynı kuralın kendisi. Geyik aynı beşi, tavşan aynı ikiyi ediyor. İki bölüm arasında değişen tek şey onun başladığı sayıydı ve sonrasında olan hemen her şeye o karar verdi.", "sh-ce2-p2": "Güvenli cevaptan çıkmanın bu kadar zor olmasının sebebi de bu. Kimse kimseden bir şey beklemiyorsa herkes tavşanı alır ve herkesin tavşanı alması, tam da kimsenin kimseden bir şey beklememesi gerektiğinin kanıtıdır.", "sh-ce3-h": "Kimsenin kararı olmayan bir sabah", "sh-ce3-p1": "Nehrin kabardığı sabah hiçbir şey seçilmedi. O sabahı Tarik hakkında kanıt olarak okuduysan yanlış bir şey öğrendin; sonrasında ona göre davrandıysan onu doğru yaptın.", "sh-ce3-p2": "Tavşan, önemli olan tam anlamıyla güvenli hamle: diğeri ne yaparsa yapsın iki öder; beklemekse başkasına bağlı olarak beş ya da hiç. Emin olmadığında güvenlik bir şeye değer ve ne kadar az eminsen o kadar çok değer. İyi yiyebilecek bir köyün az yemeye razı oluşu böyle olur.", "sh-b-ch2": "Bölüm {n}. {t}", "sh-b-endof": "Sonu", "sh-s-chend": "Bölüm {n} sonu.", "sh-pt-cap": "Her seçim çiftinin kaç günlük yemeğe denk geldiği, önce seninki", "sh-pt-theywait": "o bekler", "sh-pt-theyhare": "o tavşana gider", "sh-pt-youwait": "sen beklersen", "sh-pt-youhare": "sen tavşana gidersen", "sh-pt-note": "Gölgeli iki hücre, iki avcıdan hiçbirinin tek başına iyileştiremeyeceği hücreler", "sh-e-kick": "Sonu", "sh-e-h": "Üç bölüm ne içindi", "sh-e-p1": "Bu oyunun iki dengesi var. İki avcının da beklemesi biri, ikisinin de otlarda olması diğeri; ikisinde de hiç kimse tek başına yaptığını değiştirerek daha iyi edemez. Biri seni beş doyuruyor, diğeri iki ve hangisinde biteceğin konusunda aritmetiğin söyleyecek hiçbir sözü yok.", "sh-e-p2": "Aralarında seçim yapan şey inanç. Tercih değil, karakter değil, açgözlülük değil. Tavşan güvenli, çünkü sırtta ne olursa olsun aynı şeyi ödüyor; ve diğerinden ne kadar az eminsen güvenlik o kadar değerli. Şüphe böylece kendini doğruluyor: tavşanı doğru yapıyor, tavşanı almak diğerine senden şüphe etmeyi öğretiyor, onun şüphesi de tavşanı onun için doğru yapıyor.", "sh-e-l1": "Buradaki tuzak, kimsenin kimseden faydalanmak istemesi değil. Bu oyunda birini yüzüstü bırakarak kazanılan hiçbir şey olmadı; oyun sana o fırsatı hiç vermedi.", "sh-e-l2": "Kimsenin suçu olmayan tek bir sabah, bir köyü iyi dengeden güvenli olana taşıyabilir ve sırttan bakınca ikisinin farkını anlamanın yolu yoktur.", "sh-e-l3": "Bütün mesele dışarıdan bakınca kolay, içeriden bakınca çok zor. Şafaktan önce edilecek tek söz, mevsimlerin yapamadığını yapar.", "sh-e-sub1": "Nereden geliyor", "sh-e-rous": "Rousseau bu durumu 1754'te, daha adı bile yokken yazdı. Her avcı, geyik alınacaksa yerinde durması gerektiğini anlıyordu; yine de:", "sh-e-q1": "“Bir geyik alınacaksa herkes başarmak için yerine sadakatle bağlı kalması gerektiğini görüyordu; ama içlerinden birinin menziline bir tavşan girecek olsa hiç kuşku yok ki tereddütsüz peşine düşer ve avını yakaladıktan sonra, bu yüzden arkadaşlarının kendi avlarını kaçırmasına yol açmışsa buna pek de aldırmazdı.”", "sh-e-nash": "Buradaki anlamıyla denge sözcüğü Nash'in; 1950'de yayımlanan iki sayfalık bir makaleden.", "sh-e-sub2": "Bunun göstermediği", "sh-e-m1": "Ortağın bir kural, bir insan değil. Güveni sabit adımlarla oynuyor ve seçimi o güvenin üzerinde bir eşik. Gerçek bir av ortağının ruh hâlleri, başka ortakları ve seni kendi okuyuşu vardır; bu model bunları içermiyor.", "sh-e-m2": "Burada hiçbir şey, insanların eşgüdüm sorunlarında gerçekte nasıl davrandığına dair kanıt değil. Bu bir savın boyanmış örneği, bir deney değil; bu sayfadaki hiçbir sayı ölçülmedi.", "sh-e-m3": "Gerçek avlar konuşmaya izin verir ve konuşma cevabın büyük kısmıdır. Bu oyun, onsuz ne olduğunu göstermek için konuşmayı yasaklıyor; bu da onu olağan durumun değil en zor durumun resmi yapıyor.", "sh-e-m4": "Buradaki iki denge temiz biçimde sıralı, beşe karşı iki. Güvenli sonucun riskli olana neredeyse denk olduğu yerlerde güvenliğe çekilme, bu üç bölümde hissettiğin her şeyden çok daha güçlüdür.", "sh-e-m5": "Gerçek toplulukların kazanç baskın dengeye mi yoksa risk baskın dengeye mi oturduğu açık bir görgül sorudur ve bu oyun bu konuda taraf tutmuyor.", "sh-e-src": "Kaynaklar", "sh-src1": "Avın kendisi.", "sh-src2": "Denge noktası.", "sh-src-tail": "Okundu: 2026 08 21.", "sh-fam": "Diğer oyunlar ve aynı konunun sayıları açıkta yazılmış hâli: ", "sh-fam-a": "hepsi burada", "sh-b-again": "İlk sabahtan yeniden avlan", "sh-s-end": "Son. İki denge var ve hangisinde yaşayacağına inanç karar veriyor.", "sh-k-return": "enter", "sh-k-start": "başla", "sh-k-begin": "başla", "sh-k-go": "devam", "sh-k-again": "tekrar", "sh-k-s": "s tuşu", "sh-k-h": "h tuşu", "pg-title": "Geyik Avı"}, "de": {"pg-desc": "Ein Spiel über Vertrauen statt über Gier. Zwei Jäger können gemeinsam einen Hirsch erlegen und gut essen oder allein einen Hasen und wenig. Ob das Dorf im guten oder im sicheren Ergebnis lebt, entscheidet, was jeder vom anderen erwartet.", "sh-h1": "Die Hirschjagd", "sh-skip": "Zu den Entscheidungen springen", "sh-restart": "Von vorn beginnen", "sh-name": "Die Hirschjagd", "sh-when-ridge": "ein Grat über dem Dorf, vor der Dämmerung", "sh-when-arg": "das Argument, schlicht gesagt", "sh-when-what": "was das war", "sh-when-hunts": "{n} jagt mit Ihnen", "sh-when-morn": "{s}, Morgen {a} von {b}", "sh-when-after": "{s}, der Tag danach", "sh-ch": "Kapitel {n}. {t}", "sh-ch1": "Die erste Jagd", "sh-ch2": "Es spricht sich herum", "sh-ch3": "Der Morgen des hohen Flusses", "sh-sea-0": "Frühling", "sh-sea-1": "Sommer", "sh-sea-2": "Herbst", "sh-sea-3": "Winter", "sh-t-p1": "Ein Hirsch ist fünf Tage Essen wert und lässt sich nicht von einem allein erlegen. Ein Hase ist zwei Tage wert, und das geht allein. Steigen Sie beide auf den Grat und warten, gehört der Hirsch Ihnen, und beide essen gut. Verlässt einer den Grat für einen Hasen, während der andere noch wartet, ist der Hase genommen, und wer noch wartet, geht mit nichts nach Hause.", "sh-t-p2": "Niemand hier will irgendwen betrügen. Jede Saison entscheiden Sie nur eines: ob Sie glauben, dass der andere da sein wird.", "sh-b-resume": "Weiter ab Kapitel {n}", "sh-b-climb": "Auf den Grat steigen", "sh-s-title": "Die Hirschjagd. Zwei Jäger, ein Hirsch, und Hasen im Gras.", "sh-tally-you": "Was Sie in diesem Kapitel gegessen haben ", "sh-i1-kick": "Kapitel eins", "sh-i1-head": "Die erste Jagd", "sh-i1-b1": "Tarik jagt auf demselben Grat wie Sie. Sie haben nie zusammengearbeitet. Keiner von Ihnen hat vor der Dämmerung eine Ahnung, was der andere tun wird, und abzusprechen ist es nicht, denn Sie brechen an entgegengesetzten Enden des Dorfes auf.", "sh-i1-b2": "Acht Morgen. An jedem wählen Sie den Hirsch oder den Hasen, und er auch.", "sh-i2-kick": "Kapitel zwei", "sh-i2-head": "Es spricht sich herum", "sh-i2-b1": "Roza hat gehört, wie die Saison gelaufen ist. Sie hat noch nie mit Ihnen gejagt, aber sie weiß, was Tarik weiß, und sie steigt den Grat hinauf und erwartet schon, Sie dort zu finden.", "sh-i2-b2": "Am Hirsch hat sich nichts geändert. Am Hasen hat sich nichts geändert. Nur, was sie erwartet.", "sh-i3-kick": "Kapitel drei", "sh-i3-head": "Der Morgen des hohen Flusses", "sh-i3-b1": "Wieder Tarik, und diesmal wissen Sie beide, wie das hier funktioniert. Aber der Fluss zwischen seinem Haus und dem Grat steigt im Frühjahr, und an manchen Morgen ist er gar nicht zu überqueren.", "sh-i3-b2": "An so einem Morgen wird niemand irgendetwas entschieden haben. Aussehen wird es genau wie im Stich gelassen zu werden.", "sh-i-five": "Der Hirsch ist fünf, der Hase zwei, und allein zu warten ist gar nichts.", "sh-b-firstmorn": "Der erste Morgen", "sh-a-kick": "Morgen {n}", "sh-a-h": "Der Grat oder das Gras", "sh-a-fog": "Der Fluss ist von hier aus laut. Sie können nicht sehen, ob jemand hinübergekommen ist.", "sh-a-first": "{n} ist zur selben Stunde aufgebrochen wie Sie, vom anderen Ende des Dorfes. Noch sieht keiner von Ihnen den anderen.", "sh-a-was": "{n} war gestern auf dem Grat.", "sh-a-wasnt": "{n} war gestern nicht auf dem Grat.", "sh-b-stag": "Auf dem Grat auf den Hirsch warten", "sh-b-hare": "Für einen Hasen hinuntergehen", "sh-m-expect": "Was {n} erwartet", "sh-of100": "{x} von 100", "sh-s-ask": "{s}, Morgen {n}. Auf dem Grat warten oder für einen Hasen hinuntergehen.", "sh-r-nobody": "Niemand war da", "sh-r-stag": "Der Hirsch", "sh-r-twohares": "Zwei Hasen", "sh-r-onewaited": "Einer von Ihnen wartete", "sh-rw-absS": "Sie warteten, bis die Sonne hoch stand. Niemand kam. Später erfuhren Sie, dass der Fluss über die Steine ging und {n} seine Seite nie verlassen hat.", "sh-rw-absH": "Sie nahmen einen Hasen. Später erfuhren Sie, dass der Fluss über die Steine ging und {n} seine Seite nie verlassen hat; auf dem Grat gab es also ohnehin niemanden, auf den zu warten war.", "sh-rw-ss": "Sie waren beide auf dem Grat, und zwischen Ihnen beiden kam der Hirsch herunter. Fünf Tage Essen für jeden, und keiner von Ihnen musste vorher ein Wort darüber verlieren.", "sh-rw-sh": "Sie warteten. {n} ging hinunter ins Gras, und Sie sahen zu, wie er einen Hasen nach Hause trug, während der Hirsch genau dort blieb, wo er war.", "sh-rw-hs": "Sie nahmen Ihren Hasen früh. {n} stand am Mittag noch mit nichts auf dem Grat, und er sah Sie mit etwas in den Händen den Pfad heraufkommen.", "sh-rw-hh": "Sie gingen beide für Hasen hinunter. Zwei Tage Essen für jeden, und der Hirsch auf dem Grat war vor Ihnen beiden nie in Gefahr.", "sh-r-youate": "Sie aßen {d}. {r}", "sh-r-day1": "einen Tag", "sh-r-days": "{p} Tage", "sh-r-theyate": "{n} aß {d}.", "sh-r-riverate": "{n} aß, was auf seiner Seite des Flusses zu finden war.", "sh-b-chend": "Das Kapitel endet", "sh-b-nextmorn": "Der nächste Morgen", "sh-ce-kick": "Ende von Kapitel {n}", "sh-ce1-h": "Niemand war gierig", "sh-ce1-p1": "Lesen Sie die vier Zahlen noch einmal. Es gibt keine Zelle, in der es sich auszahlt, den anderen im Stich zu lassen. Sind Sie sicher, dass er auf dem Grat wartet, ist Ihr bester Zug ebenfalls zu warten, denn fünf schlägt zwei. Sind Sie sicher, dass er zum Hasen gegangen ist, ist Ihr bester Zug auch der Hase, denn zwei schlägt nichts.", "sh-ce1-p2": "Das ist der Unterschied zum üblichen Dilemma. Dass Sie beide warten, ist stabil, und dass Sie beide im Gras sind, ist auch stabil. Zwei Antworten, beide richtig, und nichts in den Zahlen entscheidet, in welcher Sie leben.", "sh-ce1-p3": "Was es entscheidet, ist, was jeder von Ihnen erwartet. Tarik kam zum ersten Mal den Grat herauf und erwartete sehr wenig von Ihnen, also nahm er Hasen, und jeder Hase machte Sie weniger bereit zu warten, und jeder Morgen, den Sie im Gras verbrachten, machte ihn sicherer, dass er recht gehabt hatte.", "sh-ce1-p4": "Von hier an können Sie sehen, was er denkt. Es war immer da; das ist die Zahl, die sich bewegt hat.", "sh-m-expectnow": "Was {n} jetzt von Ihnen erwartet", "sh-ce2-h": "Dieselbe Jagd, eine andere Eröffnung", "sh-ce2-p1": "Roza ist dieselbe Regel wie Tarik. Der Hirsch ist dieselben fünf wert, der Hase dieselben zwei. Das Einzige, was sich zwischen den beiden Kapiteln geändert hat, ist die Zahl, mit der sie begann, und sie entschied fast alles, was danach geschah.", "sh-ce2-p2": "Darum ist die sichere Antwort so schwer wieder loszuwerden. Erwartet niemand irgendwen, nimmt jeder den Hasen, und dass jeder den Hasen nimmt, ist genau der Beleg dafür, dass niemand irgendwen hätte erwarten sollen.", "sh-ce3-h": "Ein Morgen, der niemandes Entscheidung war", "sh-ce3-p1": "Am Morgen des hohen Flusses wurde nichts gewählt. Wer diesen Morgen als Beleg über Tarik las, hat etwas Falsches gelernt; wer danach handelte, hat es wahr gemacht.", "sh-ce3-p2": "Der Hase ist der sichere Zug in genau dem Sinn, auf den es ankommt: Er zahlt zwei, was auch immer der andere tut, während Warten fünf oder nichts zahlt, je nach jemand anderem. Wenn Sie unsicher sind, ist Sicherheit etwas wert, und je unsicherer Sie sind, desto mehr. So kommt es, dass ein Dorf, das gut essen könnte, wenig isst.", "sh-b-ch2": "Kapitel {n}. {t}", "sh-b-endof": "Das Ende", "sh-s-chend": "Ende von Kapitel {n}.", "sh-pt-cap": "Was jedes Paar von Entscheidungen wert ist, in Tagen Essen, Ihres zuerst", "sh-pt-theywait": "er wartet", "sh-pt-theyhare": "er nimmt einen Hasen", "sh-pt-youwait": "Sie warten", "sh-pt-youhare": "Sie nehmen einen Hasen", "sh-pt-note": "Die zwei schattierten Zellen sind die, die kein Jäger allein verbessern kann", "sh-e-kick": "Das Ende", "sh-e-h": "Wofür die drei Kapitel da waren", "sh-e-p1": "Dieses Spiel hat zwei Gleichgewichte. Dass beide Jäger warten, ist eines, dass beide im Gras sind, das andere, und in beiden kann sich niemand verbessern, indem er allein etwas ändert. Das eine gibt Ihnen fünf zu essen, das andere zwei, und die Arithmetik hat nichts dazu zu sagen, in welchem Sie landen.", "sh-e-p2": "Was zwischen ihnen wählt, ist Glaube. Nicht Vorliebe, nicht Charakter, nicht Gier. Der Hase ist sicher, weil er dasselbe zahlt, was auch immer auf dem Grat geschieht, und Sicherheit ist umso mehr wert, je weniger sicher Sie sich des anderen sind. So bestätigt sich der Zweifel selbst: Er macht den Hasen richtig, den Hasen zu nehmen lehrt den anderen, an Ihnen zu zweifeln, und sein Zweifel macht den Hasen für ihn richtig.", "sh-e-l1": "Die Falle hier ist nicht, dass irgendwer irgendwen ausnutzen will. In diesem Spiel wurde nichts dadurch gewonnen, jemanden im Stich zu lassen, und das Spiel gab Ihnen nie die Gelegenheit dazu.", "sh-e-l2": "Ein einziger Morgen, an dem niemand schuld war, kann ein Dorf vom guten Gleichgewicht ins sichere bewegen, und vom Grat aus gibt es keine Möglichkeit, den Unterschied zu erkennen.", "sh-e-l3": "Das Ganze ist von außen leicht zu beheben und von innen sehr schwer. Ein Wort vor der Dämmerung leistet, was die Jahreszeiten nicht konnten.", "sh-e-sub1": "Woher es kommt", "sh-e-rous": "Rousseau schrieb die Lage 1754 nieder, bevor es ein Wort dafür gab. Jeder Jäger verstand, dass er auf seinem Posten bleiben musste, wenn der Hirsch genommen werden sollte, und doch:", "sh-e-q1": "„Sollte ein Hirsch erlegt werden, sah jeder ein, dass er dazu treu auf seinem Posten bleiben musste; aber kam ein Hase in die Reichweite eines von ihnen, so ist nicht zu bezweifeln, dass er ihm ohne Bedenken nachjagte und, seine Beute gefasst, sich wenig darum kümmerte, ob er damit seine Gefährten um die ihre brachte.“", "sh-e-nash": "Das Wort Gleichgewicht im hier gebrauchten Sinn ist Nashs, aus einem zwei Seiten langen Aufsatz von 1950.", "sh-e-sub2": "Was das nicht zeigt", "sh-e-m1": "Ihr Partner ist eine Regel, kein Mensch. Sein Vertrauen bewegt sich in festen Schritten, und seine Wahl ist eine Schwelle darauf. Ein echter Jagdpartner hat Stimmungen, andere Partner und seine eigene Lesart von Ihnen, die dieses Modell nicht enthält.", "sh-e-m2": "Nichts hier ist ein Beleg dafür, wie Menschen sich in Koordinationsproblemen tatsächlich verhalten. Es ist das gemalte Beispiel eines Arguments, kein Experiment, und keine Zahl auf dieser Seite wurde gemessen.", "sh-e-m3": "Echte Jagden erlauben das Reden, und Reden ist der größte Teil der Antwort. Dieses Spiel verbietet es, um zu zeigen, was ohne es geschieht; das macht es zum Bild des härtesten Falls, nicht des üblichen.", "sh-e-m4": "Die zwei Gleichgewichte hier sind sauber geordnet, fünf gegen zwei. Wo das sichere Ergebnis fast so gut ist wie das riskante, ist der Zug zur Sicherheit weit stärker als alles, was Sie in diesen drei Kapiteln gespürt haben.", "sh-e-m5": "Ob echte Populationen sich im auszahlungsdominanten oder im risikodominanten Gleichgewicht einfinden, ist eine offene empirische Frage, und dieses Spiel bezieht dazu keine Stellung.", "sh-e-src": "Quellen", "sh-src1": "Die Jagd selbst.", "sh-src2": "Der Gleichgewichtspunkt.", "sh-src-tail": "Gelesen: 2026 08 21.", "sh-fam": "Die anderen Spiele, und dasselbe Thema mit offengelegten Zahlen ausgeschrieben: ", "sh-fam-a": "alle sind hier", "sh-b-again": "Vom ersten Morgen an noch einmal jagen", "sh-s-end": "Das Ende. Zwei Gleichgewichte, und der Glaube entscheidet, in welchem Sie leben.", "sh-k-return": "Enter", "sh-k-start": "Start", "sh-k-begin": "Start", "sh-k-go": "weiter", "sh-k-again": "erneut", "sh-k-s": "Taste s", "sh-k-h": "Taste h", "pg-title": "Die Hirschjagd"}};
function T(k, en, v) {
  var s = window.__t ? window.__t(k, en) : en;
  if (v) for (var n in v) s = s.split("{" + n + "}").join(String(v[n]));
  return s;
}
function seasonName() { var i = KW.world.season; return T("sh-sea-" + i, KW.SEASONS[i]); }
function chTitle(n) { return T("sh-ch" + n, CHAPTERS[n - 1].title); }
function chLine(n) { return T("sh-ch", "Chapter {n}. {t}", {n: n, t: chTitle(n)}); }
function days(p) { return p === 1 ? T("sh-r-day1", "1 day") : T("sh-r-days", "{p} days", {p: p}); }

var ui = KW.ui, ctx = null;
var store = KW.store("kw.staghunt.v1");

/* ============================================================
   1. the game itself
   Four numbers. Two of the cells are equilibria, which is the
   whole difference between this and the prisoner's dilemma.
   ============================================================ */

var PAY = { both: 5, hare: 2, alone: 0 };

function payoff(mine, theirs) {
  if (mine === "S") return theirs === "S" ? PAY.both : PAY.alone;
  return PAY.hare;
}

/* the partner is a rule and nothing more: they go for the stag when
   they expect you to be there, and their expectation is history */
function partnerGoes(conf, thr) { return conf >= thr; }

function updateConf(conf, yourMove, theirMove) {
  if (yourMove === "S") {
    conf = conf + 0.17 * (1 - conf);
    if (theirMove === "S") conf = conf + 0.11 * (1 - conf);
  } else {
    conf = conf - 0.34;
  }
  return clamp(conf, 0, 1);
}

/* ============================================================
   2. the people
   ============================================================ */

var PEOPLE = {
  tarik: { name: "Tarik", conf0: 0.28, thr: 0.5,
           fig: { coat: "#5e7a6a", hairStyle: "cap", capCol: "#4d5a3a", hair: "#2a1c10", prop: "spear" } },
  roza:  { name: "Roza", conf0: 0.82, thr: 0.5,
           fig: { coat: "#7a6a8a", hairStyle: "braid", hair: "#3a2a18", skin: "#c99a72", prop: "spear" } }
};

var CHAPTERS = [
  { n: 1, who: "tarik", rounds: 8, fog: -1, title: "The first hunt" },
  { n: 2, who: "roza",  rounds: 6, fog: -1, title: "Word travels" },
  { n: 3, who: "tarik", rounds: 6, fog: 1,  title: "The morning of the high river" }
];

/* ============================================================
   3. state
   ============================================================ */

var G = {
  view: "title", chapter: 1, furthest: 1,
  round: 0, you: 0, them: 0,
  conf: 0.28, who: "tarik",
  stagRuns: 0, hareRuns: 0,
  showConf: false,
  last: null, log: []
};

var scene = { mode: "ridge", t0: -99, you: null, them: null, stag: 1, absent: false, both: false };

/* how far the morning has got, from the moment the choice was made */
function ease() {
  if (KW.reduced) return 1;
  return clamp((KW.world.t - scene.t0) / 0.8, 0, 1);
}

function save() {
  store.save({
    view: G.view, chapter: G.chapter, furthest: G.furthest, round: G.round,
    you: G.you, them: G.them, conf: G.conf, who: G.who, showConf: G.showConf
  });
}

/* ============================================================
   4. the ridge
   ============================================================ */

var pines = [];
function buildPines() {
  var rnd = KW.mulberry(5150), M = KW.M;
  pines = [];
  var n = M.small ? 9 : 15;
  for (var i = 0; i < n; i++) {
    pines.push({ u: (i + 0.5) / n + (rnd() - 0.5) * 0.03, h: 26 + rnd() * 26, w: 10 + rnd() * 7, tone: rnd() });
  }
}

function drawPines(t) {
  var M = KW.M, sk = KW.sky();
  var base = KW.mix([56, 74, 58], [26, 30, 44], sk.night * 0.8);
  for (var i = 0; i < pines.length; i++) {
    var p = pines[i];
    var x = p.u * M.W, y = M.GY - (M.small ? 20 : 30);
    var h = p.h * (M.small ? 0.7 : 1), w = p.w * (M.small ? 0.72 : 1);
    var col = KW.mix(base, [96, 112, 84], p.tone * 0.4);
    ctx.fillStyle = KW.rgb(col, 0.92);
    ctx.beginPath();
    ctx.moveTo(x, y - h);
    ctx.lineTo(x + w / 2, y);
    ctx.lineTo(x - w / 2, y);
    ctx.closePath(); ctx.fill();
    ctx.beginPath();
    ctx.moveTo(x, y - h * 1.16);
    ctx.lineTo(x + w * 0.36, y - h * 0.5);
    ctx.lineTo(x - w * 0.36, y - h * 0.5);
    ctx.closePath(); ctx.fill();
  }
}

/* the stag, standing on the far ridge, seen against the light */
function drawStag(x, y, s, a, t) {
  var sk = KW.sky();
  ctx.save();
  ctx.globalAlpha = a;
  ctx.translate(x, y);
  ctx.scale(s, s);
  var col = KW.rgb(KW.mix([62, 46, 32], [26, 28, 40], sk.night * 0.7), 0.95);
  KW.shadow(0, 22 * s, 0.18 * a);
  ctx.strokeStyle = col; ctx.lineWidth = 3.4; ctx.lineCap = "round";
  /* body */
  ctx.beginPath();
  ctx.moveTo(-13, -18); ctx.quadraticCurveTo(0, -22, 13, -18);
  ctx.stroke();
  ctx.fillStyle = col;
  ctx.beginPath();
  ctx.ellipse(0, -17, 13, 6.4, 0, 0, 6.283);
  ctx.fill();
  /* legs */
  ctx.lineWidth = 2.2;
  var sway = KW.reduced ? 0 : Math.sin(t * 1.2) * 0.6;
  [-9, -4.5, 5, 10].forEach(function (lx, i) {
    ctx.beginPath();
    ctx.moveTo(lx, -13);
    ctx.lineTo(lx + (i % 2 ? sway : -sway), 0);
    ctx.stroke();
  });
  /* neck and head */
  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.moveTo(11, -20); ctx.quadraticCurveTo(16, -28, 17, -33);
  ctx.stroke();
  ctx.fillStyle = col;
  ctx.beginPath(); ctx.ellipse(18.4, -34.5, 4.4, 2.5, -0.5, 0, 6.283); ctx.fill();
  /* antlers */
  ctx.lineWidth = 1.6;
  [1, -1].forEach(function (d) {
    ctx.beginPath();
    ctx.moveTo(16.5, -36);
    ctx.quadraticCurveTo(16 + d * 2, -44, 19 + d * 3.4, -47);
    ctx.moveTo(17, -41); ctx.lineTo(13 + d * 1.5, -45);
    ctx.moveTo(18, -44); ctx.lineTo(22 + d, -47.5);
    ctx.stroke();
  });
  ctx.restore();
}

/* a hare, low in the grass */
function drawHare(x, y, s, t, hop) {
  var sk = KW.sky();
  ctx.save();
  ctx.translate(x, y - (hop ? Math.abs(Math.sin(t * 5)) * 6 : 0));
  ctx.scale(s, s);
  var col = KW.rgb(KW.mix([146, 122, 92], [40, 42, 54], sk.night * 0.7), 0.95);
  ctx.fillStyle = col;
  ctx.beginPath(); ctx.ellipse(0, -4, 6.2, 3.6, -0.1, 0, 6.283); ctx.fill();
  ctx.beginPath(); ctx.arc(5.4, -7.4, 2.6, 0, 6.283); ctx.fill();
  ctx.strokeStyle = col; ctx.lineWidth = 1.5; ctx.lineCap = "round";
  ctx.beginPath(); ctx.moveTo(5.6, -9.4); ctx.lineTo(4.4, -15); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(6.6, -9.4); ctx.lineTo(7.4, -15); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(-4, -1.6); ctx.lineTo(-4, 0); ctx.moveTo(2, -1.6); ctx.lineTo(2, 0); ctx.stroke();
  ctx.beginPath(); ctx.arc(-6.6, -5.4, 1.8, 0, 6.283); ctx.fill();
  ctx.restore();
}

function drawWorld(t) {
  var M = KW.M;
  drawPines(t);
  KW.tree(t, M.small ? M.W * 0.9 : M.W * 0.88, 0.8);

  /* the stag on the ridge, while it is still there */
  if (scene.stag > 0.02) {
    drawStag(M.W * (M.small ? 0.80 : 0.68), M.GY - (M.small ? 30 : 38),
             M.small ? 0.8 : 1.05, scene.stag * 0.95, t);
  }

  var px = M.CX - M.DX, nx = M.CX + M.DX;
  var ex = ease();

  /* you */
  KW.shadow(px, 16, 0.26);
  KW.figure(px, M.GY, t, {
    coat: "#40566e", hairStyle: "curly", hair: "#241a12", skin: "#c99a72",
    prop: "spear", face: 1, pose: scene.you === "S" ? "aim" : scene.you === "H" ? "hold" : "stand"
  });
  if (scene.you === "H" && ex > 0.3) drawHare(px + (M.small ? 20 : 26), M.GY, M.small ? 0.9 : 1.1, t, false);

  /* them, unless the river kept them at home */
  if (scene.them && !scene.absent) {
    KW.shadow(nx, 16, 0.26);
    KW.figure(nx, M.GY, t, Object.assign({}, PEOPLE[scene.them].fig, {
      face: -1, pose: scene.themMove === "S" ? "aim" : scene.themMove === "H" ? "hold" : "stand"
    }));
    if (scene.themMove === "H" && ex > 0.3) drawHare(nx - (M.small ? 20 : 26), M.GY, M.small ? 0.9 : 1.1, t, false);
  }

  /* both went up the hill: the baskets come back full */
  if (scene.both && ex > 0.4) {
    KW.basket(px + (M.small ? 16 : 22), M.GY - 2, M.small ? 1 : 1.2, true, false);
    KW.basket(nx - (M.small ? 16 : 22), M.GY - 2, M.small ? 1 : 1.2, true, false);
  }

  /* hares in the grass, always there, always small */
  if (scene.mode === "ridge" && !scene.you) {
    drawHare(M.W * 0.3, M.GY - 3, M.small ? 0.7 : 0.85, t, !KW.reduced);
    drawHare(M.W * 0.42, M.GY - 1, M.small ? 0.6 : 0.75, t + 1.7, !KW.reduced);
  }
}

function resume(s) {
  ui.acted = true;
  G.chapter = s.chapter || 1; G.furthest = s.furthest || 1;
  G.round = s.round || 0; G.you = s.you || 0; G.them = s.them || 0;
  G.conf = s.conf == null ? 0.28 : s.conf;
  G.who = s.who || "tarik"; G.showConf = !!s.showConf;
  var ch = CHAPTERS[G.chapter - 1];
  KW.$("menuBtn").hidden = false;
  KW.season((G.chapter - 1 + G.round) % 4, true);
  KW.daylight(0.12 + (G.round / ch.rounds) * 0.7, true);
  scene.them = G.who;
  if (G.round >= ch.rounds) view("chapterEnd"); else view("ask");
}

function startChapter(n) {
  var ch = CHAPTERS[n - 1];
  G.chapter = n;
  G.furthest = Math.max(G.furthest, n);
  G.round = 0; G.you = 0; G.them = 0;
  G.who = ch.who;
  G.conf = PEOPLE[ch.who].conf0;
  G.last = null;
  scene.them = ch.who; scene.absent = false; scene.both = false;
  scene.you = null; scene.themMove = null; scene.stag = 1;
  KW.$("menuBtn").hidden = false;
  KW.season((n - 1) % 4, true);
  KW.daylight(0.12, true);

}

VIEWS.ask = function () {
  var ch = CHAPTERS[G.chapter - 1];

  }

function resolve(mine) {
  var ch = CHAPTERS[G.chapter - 1];
  var p = PEOPLE[G.who];
  var absent = (G.chapter === 3 && G.round === ch.fog);
  var theirs = absent ? "A" : (partnerGoes(G.conf, p.thr) ? "S" : "H");

  var mineP, theirsP;
  if (absent) {
    /* nobody chose anything: he could not get across */
    mineP = mine === "S" ? PAY.alone : PAY.hare;
    theirsP = 0;
  } else {
    mineP = payoff(mine, theirs);
    theirsP = payoff(theirs, mine);
  }
  G.you += mineP; G.them += theirsP;

  if (!absent) G.conf = updateConf(G.conf, mine, theirs);
  if (mine === "S") G.stagRuns++; else G.hareRuns++;

  G.last = { you: mine, them: theirs, youPay: mineP, themPay: theirsP, absent: absent, conf: G.conf };
  G.log.push({ chapter: G.chapter, round: G.round, you: mine, them: theirs,
               youPay: mineP, themPay: theirsP, absent: absent, conf: G.conf });

  scene.you = mine; scene.themMove = absent ? null : theirs; scene.absent = absent;
  scene.both = (!absent && mine === "S" && theirs === "S");
  scene.stag = scene.both ? 0 : 1;
  scene.t0 = KW.world.t;

  G.round++;
  save();
  view("result");
}

function resultWords(r, name) {
  if (r.absent) {
    if (r.you === "S") return T("sh-rw-absS", "You waited until the sun was well up. Nobody came. Later you found out the river was over the stones and {n} never left his own side of it.", {n: name});
    return T("sh-rw-absH", "You took a hare. Later you found out the river was over the stones and {n} never left his own side of it, so there was nobody on the ridge to wait for anyway.", {n: name});
  }
  if (r.you === "S" && r.them === "S") return T("sh-rw-ss", "You were both on the ridge, and between the two of you the stag came down. Five days of eating each, and neither of you had to say a word about it beforehand.");
  if (r.you === "S" && r.them === "H") return T("sh-rw-sh", "You waited. {n} went down into the grass, and you watched him carry a hare home while the stag stayed exactly where it was.", {n: name});
  if (r.you === "H" && r.them === "S") return T("sh-rw-hs", "You took your hare early. {n} was still on the ridge at noon with nothing, and he saw you come back up the path with something in your hands.", {n: name});
  return T("sh-rw-hh", "You both went down for hares. Two days of eating each, and the stag on the ridge was never in any danger from either of you.");
}
