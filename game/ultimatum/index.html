 Sagen Sie ja, gehört es Ihnen. Sagen Sie nein, nimmt die Kiste alle zehn zurück.", "ul-a-keep": "der andere behält", "ul-a-get": "Sie bekommen", "ul-b-take": "Annehmen", "ul-b-refuse": "Ablehnen", "ul-s-a": "{w} bietet Ihnen {g} von zehn. Nehmen Sie an oder lehnen Sie ab.", "ul-ar-h-y": "Sie nahmen es", "ul-ar-h-n": "Sie schickten es zurück", "ul-ar-p-y": "Sie nahmen {c}, und {w} behielt {k}. Niemand verlor ein Wort darüber.", "ul-ar-p-n": "Sie sagten nein. Die zehn Münzen gingen zurück in die Kiste. {w} ging mit nichts, Sie auch, und es kostete Sie {c}, das zu tun.", "ul-b-did": "Was Sie getan haben", "ul-b-nextoff": "Das nächste Angebot", "ul-s-ar-y": "Angenommen.", "ul-s-ar-n": "Abgelehnt. Niemand nimmt etwas.", "ul-coin1": "{n} Münze", "ul-coinN": "{n} Münzen", "ul-off1": "{n} Angebot", "ul-offN": "{n} Angebote", "ul-mi-kick": "Was Sie getan haben", "ul-mi-h": "Ihre Seite des Tisches, aufgeschrieben", "ul-mi-p1": "Als der Teilende boten Sie {list}. Das ist im Schnitt {a} von zehn Münzen, also {p} von hundert.", "ul-m-you": "Was Sie boten", "ul-m-selfish": "Was ein rein eigennütziger Spieler bietet", "ul-of100": "{x} von 100", "ul-mi-none": "Als der Antwortende nahmen Sie jedes Angebot an, auch das kleinste auf dem Tisch. Genau das sagt das eigennützige Modell voraus, und an einem echten Tisch ist es seltener, als das Modell erwartet.", "ul-mi-ref1": "Als der Antwortende lehnten Sie {c} ab. Das Größte, das Sie ausschlugen, waren {mx}{minpart}", "ul-mi-min": "; das Kleinste, das Sie annahmen, war {mn}.", "ul-mi-dot": ".", "ul-mi-ref2": "{mx0} auszuschlagen kostete Sie {mxc} aus dem eigenen Beutel. Bezahlt wurden Sie dafür nicht, und niemand sah es. Sie taten es wegen der anderen Zahl.", "ul-mi-sub": "Was das eigennützige Modell sagt", "ul-mi-p3": "Rechnen Sie es von hinten. Wer antwortet, vergleicht etwas mit nichts, also nimmt er alles über null. Wer teilt, weiß das, also bietet er den kleinstmöglichen Betrag und behält neun. Das ist die einzige Teilung, die die Rückwärtsinduktion übersteht, und sie ist, was die Theorie eines Spielers vorhersagt, der nichts außer Münzen schätzt.", "ul-mi-p4": "Fast niemand spielt so, sehr wahrscheinlich auch Sie nicht.", "ul-b-real": "Was an echten Tischen wirklich geschieht", "ul-s-mi": "Ihr durchschnittliches Angebot war {p} von hundert, gegen die eigennützige Vorhersage von zehn.", "ul-e-kick": "Das Ende", "ul-e-h": "Fairness ist keine Weichheit", "ul-e-p1": "Dieses Spiel läuft seit über vierzig Jahren in Laboren, in vielen Ländern und um Einsätze von Kleingeld bis zu mehreren Monatslöhnen. Eine Metaanalyse von 37 Arbeiten mit 75 einzelnen Ergebnissen fand, dass die teilende Person im Durchschnitt 40 von 100 bietet und dass etwa 16 von 100 Angeboten abgelehnt werden. Der gebotene Anteil sinkt etwas, wenn der Topf größer ist, und die Chance einer Ablehnung sinkt, je höher das Angebot ist.", "ul-e-p2": "Beide Hälften davon zählen. Die Angebote sind nirgendwo in der Nähe des kleinstmöglichen Betrags, und die Ablehnungen sind echt: Menschen bezahlen aus eigenem Geld für das Recht, zu einer Teilung nein zu sagen, die sie für eine Beleidigung halten.", "ul-e-p3": "Der Grund für die hohen Angebote ist nicht unbedingt Güte. Wer eine Ablehnung erwartet und Münzen will, bietet mehr; großzügiges und berechnendes Verhalten sehen auf der teilenden Seite des Tisches von außen gleich aus. Was sich so nicht erklären lässt, sind die Ablehnungen, denn da bleibt nichts zu berechnen: Es ist der letzte Zug des Spiels, und ablehnen ist in Münzen strikt schlechter.", "ul-e-sub1": "Warum das kein kleiner Punkt ist", "ul-e-l1": "Jeder Handel außerhalb des Labors hat eine Schwelle wie die, die Sie gerade gezeigt haben. Lohnverhandlungen, eine Scheidung, ein Lieferant, der den Vertrag neu verhandelt: Was eine Seite akzeptiert, ist nicht einfach das Beste, was sie bekommen kann.", "ul-e-l2": "Ein Modell, das annimmt, Menschen nähmen jeden positiven Betrag, sagt die falsche Teilung voraus und ist überrascht von Abbrüchen, die für jeden im Raum völlig vorhersehbar waren.", "ul-e-l3": "Die Schwelle ist auch keine feste menschliche Konstante. Sie bewegt sich mit der Größe des Topfes, mit dem, was die Leute über seine Herkunft wissen, und damit, woher die Spieler kommen.", "ul-e-sub2": "Was das nicht zeigt", "ul-e-m1": "Die Fremden hier sind je eine verborgene Zahl, vom Autor gewählt, um die Spanne abzudecken. Sie sind keine Messungen von irgendwem und wurden aus keiner veröffentlichten Verteilung gezogen.", "ul-e-m2": "Ihre eigene Schwelle wurde aus sechs Antworten abgelesen. Sechs sind viel zu wenige, um einen Menschen zu messen, und die Angebote, die Sie sahen, wurden gewählt, um die Kante zu finden, nicht zufällig gezogen.", "ul-e-m3": "Die Münzen sind kein Geld. Um nichts zu spielen ist nicht dasselbe wie um einen Wochenlohn, und die veröffentlichte Literatur findet, dass Einsätze das Verhalten ändern, wenn auch weniger, als die meisten erwarten.", "ul-e-m4": "Eine Runde mit einem Fremden, den Sie nie wiedersehen, ist der reine Fall. Das meiste echte Verhandeln ist wiederholt und öffentlich; dort hat das Ablehnen einen weiteren Zweck, den dieses Spiel mit Absicht entfernt.", "ul-e-m5": "Der Durchschnitt von 40 je 100 ist ein Durchschnitt über Länder und Designs. Er ist keine Vorhersage über den nächsten Menschen, mit dem Sie verhandeln.", "ul-e-src": "Quellen", "ul-src1": "Die experimentelle Bilanz.", "ul-src2": "Das erste Experiment.", "ul-src3": "Gleichgewicht und Rückwärtsinduktion.", "ul-src-tail": "Gelesen: 2026 08 21.", "ul-fam": "Der Rest der Familie, darunter eines über eine Weide und eines über eine Münze: ", "ul-fam-a": "alle Spiele sind hier", "ul-b-again": "Setzen Sie sich wieder", "ul-s-end": "Das Ende. Im Durchschnitt bieten Menschen vierzig von hundert, und etwa sechzehn von hundert Angeboten werden abgelehnt.", "ul-k-return": "Enter", "ul-k-start": "Start", "ul-k-go": "weiter", "ul-k-again": "erneut", "ul-k-enter": "Enter", "ul-k-y": "Taste y", "ul-k-n": "Taste n", "pg-title": "Das Ultimatum"}};
function T(k, en, v) {
  var s = window.__t ? window.__t(k, en) : en;
  if (v) for (var n in v) s = s.split("{" + n + "}").join(String(v[n]));
  return s;
}
var NAME_KEY = { "the carter": "ul-n-0", "the wool seller": "ul-n-1",
                 "the salt boy": "ul-n-2", "the weigher": "ul-n-3", "a stranger": "ul-n-4" };
function pName(en) { return T(NAME_KEY[en] || "", en); }
function coinsW(n) { return n === 1 ? T("ul-coin1", "{n} coin", {n: n}) : T("ul-coinN", "{n} coins", {n: n}); }
function offersW(n) { return n === 1 ? T("ul-off1", "{n} offer", {n: n}) : T("ul-offN", "{n} offers", {n: n}); }

var ui = KW.ui, ctx = null;
var store = KW.store("kw.ultimatum.v1");

/* ============================================================
   1. the game itself
   Ten coins. One of you says how they are split, the other says
   yes or no, and no is worth nothing to either of you.
   ============================================================ */

var POT = 10;

/* Every stranger has one number: the smallest share they will take.
   A player who wanted coins and nothing else would have a one here. */
var STRANGERS = [
  { name: "the carter",      mao: 1, note: "in from the next valley, in a hurry",
    fig: { coat: "#6b5334", hairStyle: "hat", capCol: "#4a3826", hair: "#3a2a18", stout: true } },
  { name: "the wool seller", mao: 3, note: "she has been at this stall since morning",
    fig: { coat: "#7a6a8a", hairStyle: "braid", hair: "#3a2a18", skin: "#c99a72" } },
  { name: "the salt boy",    mao: 4, note: "young, and watching what you do with your hands",
    fig: { coat: "#4a6b6b", hairStyle: "curly", hair: "#1f1710", skin: "#bd8f66" } },
  { name: "the weigher",     mao: 5, note: "she keeps the scales for the market",
    fig: { coat: "#40566e", hairStyle: "bun", hair: "#241a12", skin: "#d0a37c" } },
  { name: "a stranger",      mao: 2, note: "nobody here knows him",
    fig: { coat: "#5e7a6a", hairStyle: "cap", capCol: "#4d5a3a", hair: "#2a1c10" } }
];

/* The offers you are handed in the second half, and who hands them over.
   They are spread across the range on purpose: what the game wants is
   the point at which you start saying no. */
var INCOMING = [
  { from: "the wool seller", give: 5, fig: 1 },
  { from: "the carter",      give: 2, fig: 0 },
  { from: "the weigher",     give: 4, fig: 3 },
  { from: "a stranger",      give: 1, fig: 4 },
  { from: "the salt boy",    give: 3, fig: 2 },
  { from: "the carter",      give: 0, fig: 0 }
];

/* ============================================================
   2. state
   ============================================================ */

var G = {
  view: "title", part: 1, round: 0, coins: 0,
  offer: 5,
  given: [],        /* what you offered, and whether it was taken */
  taken: [],        /* what you were offered, and whether you took it */
  last: null
};

var widgets = null;   /* the three nodes the slider writes into */
var scene = { mode: "table", t0: -99, them: 0, mine: 5, theirs: 5, shown: false, refused: false, absent: true };

function ease() { return KW.reduced ? 1 : clamp((KW.world.t - scene.t0) / 0.8, 0, 1); }

function save() {
  store.save({ view: G.view, part: G.part, round: G.round, coins: G.coins,
               given: G.given, taken: G.taken });
}

/* ============================================================
   3. the market table
   ============================================================ */

function drawTable(cx, gy, s) {
  var sk = KW.sky();
  var w = s * 92, h = s * 26;
  ctx.save();
  ctx.translate(cx, gy);
  KW.shadow(0, w * 0.6, 0.26 * (1 - sk.night * 0.5));
  var top = KW.mix([124, 98, 66], [42, 40, 52], sk.night * 0.7);
  var leg = KW.mix([92, 72, 48], [34, 34, 46], sk.night * 0.7);
  ctx.fillStyle = KW.rgb(leg);
  ctx.fillRect(-w / 2 + s * 6, -h, s * 5, h);
  ctx.fillRect(w / 2 - s * 11, -h, s * 5, h);
  ctx.fillStyle = KW.rgb(top);
  ctx.fillRect(-w / 2, -h - s * 6, w, s * 6);
  ctx.fillStyle = "rgba(24,16,8,.28)";
  ctx.fillRect(-w / 2, -h - s * 1.6, w, s * 1.6);
  ctx.strokeStyle = "rgba(240,220,180,.14)"; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(-w / 2, -h - s * 5); ctx.lineTo(w / 2, -h - s * 5); ctx.stroke();
  ctx.restore();
  return { y: gy - h - s * 6, w: w };
}

function drawStack(x, y, n, s, fall) {
  for (var i = 0; i < n; i++) {
    var row = i % 5, col = (i / 5) | 0;
    var cx = x + col * s * 11 - (n > 5 ? s * 5 : 0);
    var cy = y - s * 3.4 - row * s * 3.4 + (fall ? fall * fall * 90 : 0);
    KW.coin(cx, cy, s * 3.4, null);
  }
}

function drawWorld(t) {
  var M = KW.M;
  KW.house(t, M.small ? M.W * 0.12 : M.W * 0.1);
  KW.tree(t, M.small ? M.W * 0.92 : M.W * 0.9, 0.86);

  var u = ease();
  var px = M.CX - M.DX, nx = M.CX + M.DX;
  var s = M.small ? 0.9 : 1.35;
  var tbl = drawTable(M.CX, M.GY, s);

  KW.shadow(px, 16, 0.24);
  KW.figure(px, M.GY, t, {
    coat: "#8a4a2c", hairStyle: "curly", hair: "#241a12", skin: "#c99a72",
    face: 1, pose: scene.shown ? "offer" : "stand", reach: u
  });

  if (!scene.absent) {
    var st = STRANGERS[scene.them] || STRANGERS[0];
    KW.shadow(nx, 16, 0.24);
    KW.figure(nx, M.GY, t, Object.assign({}, st.fig, {
      face: -1, pose: scene.refused && u > 0.4 ? "withhold" : scene.shown ? "offer" : "stand", reach: u
    }));
  }

  if (scene.shown) {
    var fall = scene.refused ? clamp((u - 0.45) / 0.55, 0, 1) : 0;
    drawStack(M.CX - tbl.w * 0.28, tbl.y, scene.mine, s, fall);
    drawStack(M.CX + tbl.w * 0.2, tbl.y, scene.theirs, s, fall);
  }
}

/* ============================================================
   4. views
   ============================================================ */

var VIEWS = {};
ui.reading = { title: 1, partTwo: 1, mirror: 1, ending: 1 };

function view(name) {
  G.view = name;
  ui.clear();
  ui.panel.className = ui.reading[name] ? "read" : "";
  VIEWS[name]();
  KW.layout();
  ui.focusFirst(name);
  save();
}

function purse() {
  var d = el("div", "tally");
  var a = el("span");
  a.appendChild(document.createTextNode(T("ul-purse-a", "Your purse ")));
  a.appendChild(el("b", null, String(G.coins)));
  a.appendChild(document.createTextNode(T("ul-purse-b", " coins")));
  d.appendChild(a);
  ui.panel.appendChild(d);
}

VIEWS.title = function () {
  scene.shown = false; scene.absent = true; scene.refused = false;
  KW.season(1, true); KW.daylight(0.18, true);
  KW.$("menuBtn").hidden = true;
  ui.top(T("ul-name", "The Ultimatum"), T("ul-when-market", "market day, one table, ten coins"));
  ui.head(T("ul-name", "The Ultimatum"));
  ui.para(T("ul-t-p1", "Ten coins are put on the table between you and someone you have never met and will not meet again. You say how they are to be divided. They say yes or no. If they say yes it is divided the way you said. If they say no, the coins go back in the box and neither of you takes anything home."));
  ui.para(T("ul-t-p2", "Five strangers, then the table turns around and you are the one answering. Nothing is explained until you have done both."));
  var r = ui.actions();
  var s = store.load();
  if (s && (s.round > 0 || s.part > 1)) {
    ui.btn(r, T("ul-b-resume", "Go on from where you stopped"), T("ul-k-return", "return"), function () { resume(s); }, "big");
  }
  ui.btn(r, T("ul-b-sit", "Sit down at the table"), T("ul-k-start", "start"), function () {
    ui.acted = true;
    G.part = 1; G.round = 0; G.coins = 0; G.given = []; G.taken = [];
    KW.$("menuBtn").hidden = false;
    beginOffer();
  }, "big");
  ui.say(T("ul-s-title", "The Ultimatum. Ten coins, one offer, and a stranger who can refuse it."));
};

function resume(s) {
  ui.acted = true;
  G.part = s.part || 1; G.round = s.round || 0; G.coins = s.coins || 0;
  G.given = s.given || []; G.taken = s.taken || [];
  KW.$("menuBtn").hidden = false;
  if (G.part === 1) {
    if (G.round >= STRANGERS.length) view("partTwo"); else beginOffer();
  } else {
    if (G.round >= INCOMING.length) view("mirror"); else beginAnswer();
  }
}

/* ---- part one: you are the one who splits ---- */

function beginOffer() {
  scene.them = G.round; scene.absent = false; scene.shown = false; scene.refused = false;
  scene.t0 = KW.world.t;
  KW.season(1 + (G.round % 2), G.round === 0);
  KW.daylight(0.15 + (G.round / STRANGERS.length) * 0.4);
  view("offer");
}

VIEWS.offer = function () {
  var st = STRANGERS[G.round];
  ui.top(T("ul-top-split", "You split"), T("ul-when-str", "stranger {a} of {b}", {a: G.round + 1, b: STRANGERS.length}));
  ui.kick(T("ul-o-kick", "Your offer"));
  ui.head(T("ul-o-h", "Ten coins, and {n}", {n: pName(st.name)}));
  ui.para(T("ul-o-p1", "{note}. They have not said a word to you and they will not be at this market again. They can see the ten coins as clearly as you can.", {note: T("ul-note-" + G.round, st.note.charAt(0).toUpperCase() + st.note.slice(1))}));

  var wrap = el("div", "split");
  var mine = el("div"), theirs = el("div", "them");
  mine.appendChild(el("b", null, String(POT - G.offer)));
  mine.appendChild(document.createTextNode(T("ul-o-keep", "you keep")));
  theirs.appendChild(el("b", null, String(G.offer)));
  theirs.appendChild(document.createTextNode(T("ul-o-get", "they get")));
  wrap.appendChild(mine); wrap.appendChild(theirs);
  ui.panel.appendChild(wrap);

  var box = el("div", "slider");
  var lab = el("label", "vh", T("ul-o-aria", "How many of the ten coins you offer"));
  lab.setAttribute("for", "off");
  var inp = el("input");
  inp.type = "range"; inp.id = "off"; inp.min = 0; inp.max = POT; inp.step = 1;
  inp.value = String(G.offer);
  inp.setAttribute("aria-label", T("ul-o-aria", "How many of the ten coins you offer"));
  inp.addEventListener("input", function () {
    setOffer(parseInt(inp.value, 10) || 0);
  });
  inp.addEventListener("keydown", function (e) {
    if (e.key === "Enter") { e.preventDefault(); ui.acted = true; propose(G.offer); }
  });
  widgets = { inp: inp, mine: mine, theirs: theirs };
  box.appendChild(lab); box.appendChild(inp);
  ui.panel.appendChild(box);

  scene.mine = POT - G.offer; scene.theirs = G.offer;

  var r = ui.actions();
  ui.btn(r, T("ul-b-put", "Put the offer on the table"), T("ul-k-enter", "press enter"), function () { propose(G.offer); }, "big yes");
  var r2 = ui.actions();
  ui.btn(r2, T("ul-b-less", "One less"), null, function () { setOffer(G.offer - 1); }, "quiet");
  ui.btn(r2, T("ul-b-more", "One more"), null, function () { setOffer(G.offer + 1); }, "quiet");
  purse();
  setTimeout(function () { if (ui.acted && G.view === "offer") inp.focus({ preventScroll: true }); }, 0);
  ui.say(T("ul-s-offer", "Stranger {n}, {w}. Choose how many of the ten coins to offer, then put the offer on the table.", {n: G.round + 1, w: pName(st.name)}));
};

function setOffer(v) {
  G.offer = clamp(v, 0, POT);
  scene.mine = POT - G.offer; scene.theirs = G.offer;
  if (widgets && G.view === "offer") {
    widgets.inp.value = String(G.offer);
    widgets.mine.firstChild.textContent = String(POT - G.offer);
    widgets.theirs.firstChild.textContent = String(G.offer);
  }
}

function propose(n) {
  widgets = null;
  var st = STRANGERS[G.round];
  var taken = n >= st.mao;
  G.coins += taken ? (POT - n) : 0;
  G.given.push({ who: st.name, offered: n, taken: taken, mao: st.mao });
  G.last = { who: st.name, offered: n, taken: taken, mine: POT - n };
  scene.shown = true; scene.refused = !taken;
  scene.mine = POT - n; scene.theirs = n;
  scene.t0 = KW.world.t;
  G.round++;
  save();
  view("offerResult");
}

VIEWS.offerResult = function () {
  var r = G.last;
  ui.top(T("ul-top-split", "You split"), T("ul-when-str", "stranger {a} of {b}", {a: G.round, b: STRANGERS.length}));
  ui.kick(r.taken ? T("ul-or-kick-y", "Taken") : T("ul-or-kick-n", "Refused"));
  ui.head(r.taken ? T("ul-or-h-y", "They took it") : T("ul-or-h-n", "They would rather have nothing"));
  if (r.taken) {
    ui.para(T("ul-or-p-y", "You offered {o}. {w} looked at the table, took the {o} and went, and you put {m} in your purse.",
            {o: r.offered, w: cap(pName(r.who)), m: r.mine}), "say");
  } else {
    ui.para(T("ul-or-p-n", "You offered {o}. {w} looked at the table, said no, and the coins went back in the box. Neither of you took anything home, and they knew that when they said it.", {o: r.offered, w: cap(pName(r.who))}), "say");
  }
  purse();
  var row = ui.actions();
  if (G.round >= STRANGERS.length) {
    ui.btn(row, T("ul-b-turns", "The table turns around"), T("ul-k-go", "go on"), function () { view("partTwo"); }, "big");
  } else {
    ui.btn(row, T("ul-b-nextstr", "The next stranger"), T("ul-k-go", "go on"), function () { beginOffer(); }, "big");
  }
  ui.say(r.taken ? T("ul-s-or-y", "Taken. You keep {m}.", {m: r.mine}) : T("ul-s-or-n", "Refused. Nobody takes anything."));
};

function cap(s) { return s.charAt(0).toUpperCase() + s.slice(1); }

/* ---- part two: you are the one who answers ---- */

VIEWS.partTwo = function () {
  scene.shown = false; scene.absent = true; scene.refused = false;
  ui.top(T("ul-top-turn", "The table turns"), T("ul-when-turn", "now you are the one answering"));
  ui.kick(T("ul-p2-kick", "Part two"));
  ui.head(T("ul-p2-h", "Now somebody else holds the coins"));
  ui.para(T("ul-p2-p1", "Six more strangers, and this time the ten coins are on their side of the table. They say how it is split and you say yes or no. No is worth nothing to either of you, exactly as before."));
  ui.para(T("ul-p2-p2", "Nothing is being measured about them. What the game is watching is you."));
  var r = ui.actions();
  ui.btn(r, T("ul-b-first", "The first offer"), T("ul-k-go", "go on"), function () {
    G.part = 2; G.round = 0;
    beginAnswer();
  }, "big");
  ui.say(T("ul-s-p2", "Part two. Now you are the one answering."));
};

function beginAnswer() {
  var inc = INCOMING[G.round];
  scene.them = inc.fig; scene.absent = false; scene.shown = true; scene.refused = false;
  scene.mine = inc.give; scene.theirs = POT - inc.give;
  scene.t0 = KW.world.t;
  KW.season(2 + (G.round % 2), G.round === 0);
  KW.daylight(0.4 + (G.round / INCOMING.length) * 0.4);
  view("answer");
}

VIEWS.answer = function () {
  var inc = INCOMING[G.round];
  ui.top(T("ul-top-ans", "You answer"), T("ul-when-off", "offer {a} of {b}", {a: G.round + 1, b: INCOMING.length}));
  ui.kick(T("ul-a-kick", "Their offer"));
  ui.head(T("ul-a-h", "{w} offers you {g}", {w: cap(pName(inc.from)), g: inc.give}));
  ui.para(T("ul-a-p", "Ten coins. They keep {k} and push {c} across the table to you. Say yes and it is yours. Say no and the box takes all ten back.",
          {k: POT - inc.give, c: coinsW(inc.give)}));

  var wrap = el("div", "split");
  var theirs = el("div"), mine = el("div", "them");
  theirs.appendChild(el("b", null, String(POT - inc.give)));
  theirs.appendChild(document.createTextNode(T("ul-a-keep", "they keep")));
  mine.appendChild(el("b", null, String(inc.give)));
  mine.appendChild(document.createTextNode(T("ul-a-get", "you get")));
  wrap.appendChild(theirs); wrap.appendChild(mine);
  ui.panel.appendChild(wrap);

  var r = ui.actions();
  ui.btn(r, T("ul-b-take", "Take it"), T("ul-k-y", "press y"), function () { answer(true); }, "big yes");
  ui.btn(r, T("ul-b-refuse", "Refuse it"), T("ul-k-n", "press n"), function () { answer(false); }, "big no");
  purse();
  ui.say(T("ul-s-a", "{w} offers you {g} of ten. Take it or refuse it.", {w: cap(pName(inc.from)), g: inc.give}));
};

function answer(yes) {
  var inc = INCOMING[G.round];
  if (yes) G.coins += inc.give;
  G.taken.push({ from: inc.from, give: inc.give, took: yes });
  G.last = { from: inc.from, give: inc.give, took: yes };
  scene.refused = !yes; scene.t0 = KW.world.t;
  G.round++;
  save();
  view("answerResult");
}

VIEWS.answerResult = function () {
  var r = G.last;
  ui.top(T("ul-top-ans", "You answer"), T("ul-when-off", "offer {a} of {b}", {a: G.round, b: INCOMING.length}));
  ui.kick(r.took ? T("ul-or-kick-y", "Taken") : T("ul-or-kick-n", "Refused"));
  ui.head(r.took ? T("ul-ar-h-y", "You took it") : T("ul-ar-h-n", "You sent it back"));
  ui.para(r.took
    ? T("ul-ar-p-y", "You took the {c} and {w} kept {k}. Nobody said anything about it.",
        {c: coinsW(r.give), w: pName(r.from), k: POT - r.give})
    : T("ul-ar-p-n", "You said no. The ten coins went back in the box. {w} walked away with nothing, and so did you, and it cost you {c} to do it.",
        {w: cap(pName(r.from)), c: coinsW(r.give)}), "say");
  purse();
  var row = ui.actions();
  if (G.round >= INCOMING.length) {
    ui.btn(row, T("ul-b-did", "What you did"), T("ul-k-go", "go on"), function () { view("mirror"); }, "big");
  } else {
    ui.btn(row, T("ul-b-nextoff", "The next offer"), T("ul-k-go", "go on"), function () { beginAnswer(); }, "big");
  }
  ui.say(r.took ? T("ul-s-ar-y", "Taken.") : T("ul-s-ar-n", "Refused. Nobody takes anything."));
};

/* ---- the mirror: your own threshold, beside the model's ---- */

function thresholdWords() {
  var refused = G.taken.filter(function (x) { return !x.took; });
  var accepted = G.taken.filter(function (x) { return x.took; });
  var maxRefused = refused.length ? Math.max.apply(null, refused.map(function (x) { return x.give; })) : -1;
  var minAccepted = accepted.length ? Math.min.apply(null, accepted.map(function (x) { return x.give; })) : -1;
  return { maxRefused: maxRefused, minAccepted: minAccepted,
           refusedCount: refused.length, acceptedCount: accepted.length };
}

VIEWS.mirror = function () {
  scene.shown = false; scene.absent = true;
  KW.daylight(0.62);
  var th = thresholdWords();
  var offers = G.given.map(function (x) { return x.offered; });
  var avg = offers.length ? offers.reduce(function (a, b) { return a + b; }, 0) / offers.length : 0;

  ui.top(T("ul-name", "The Ultimatum"), T("ul-when-nums", "your own numbers"));
  ui.kick(T("ul-mi-kick", "What you did"));
  ui.head(T("ul-mi-h", "Your side of the table, written down"));

  ui.para(T("ul-mi-p1", "As the one who split, you offered {list}. That is an average of {a} coins out of ten, which is {p} of every hundred.",
          {list: offers.join(", "), a: Math.round(avg * 10) / 10, p: Math.round(avg * 10)}));

  ui.meter(T("ul-m-you", "What you offered"), avg / POT, T("ul-of100", "{x} of 100", {x: Math.round(avg * 10)}), avg / POT >= 0.3);
  ui.meter(T("ul-m-selfish", "What a purely self interested player offers"), 0.1, T("ul-of100", "{x} of 100", {x: 10}), false);

  if (th.refusedCount === 0) {
    ui.para(T("ul-mi-none", "As the one answering, you took every offer, including the smallest one on the table. That is exactly what the self interested model predicts, and it is rarer at a real table than the model expects."));
  } else {
    ui.para(T("ul-mi-ref1", "As the one answering, you refused {c}. The largest thing you turned down was {mx}{minpart}",
            {c: offersW(th.refusedCount), mx: coinsW(th.maxRefused),
             minpart: th.minAccepted >= 0 ? T("ul-mi-min", ", and the smallest thing you accepted was {mn}.", {mn: th.minAccepted}) : T("ul-mi-dot", ".")}));
    ui.para(T("ul-mi-ref2", "Turning down {mx0} cost you {mxc} out of your own purse. You were not paid for it and nobody saw you do it. You did it because of what the other number was.",
            {mx0: th.maxRefused, mxc: coinsW(th.maxRefused)}));
  }

  ui.sub(T("ul-mi-sub", "What the self interested model says"));
  ui.para(T("ul-mi-p3", "Work it backwards. The person answering compares something with nothing, so they take anything above zero. The person splitting knows that, so they offer the smallest amount there is and keep nine. That is the only division that survives backward induction, and it is what the theory of a player who values nothing but coins predicts."));
  ui.para(T("ul-mi-p4", "Almost nobody plays that way, including, most likely, you."));

  var r = ui.actions();
  ui.btn(r, T("ul-b-real", "What actually happens at real tables"), T("ul-k-go", "go on"), function () { view("ending"); }, "big");
  ui.say(T("ul-s-mi", "Your average offer was {p} of a hundred, against the self interested prediction of ten.", {p: Math.round(avg * 10)}));
};

/* ============================================================
   5. the ending
   ============================================================ */

VIEWS.ending = function () {
  KW.season(2, true); KW.daylight(0.66);
  ui.top(T("ul-name", "The Ultimatum"), T("ul-when-arg", "the argument, plainly"));
  ui.kick(T("ul-e-kick", "The end of it"));
  ui.head(T("ul-e-h", "Fairness is not softness"));

  ui.para(T("ul-e-p1", "This game has been run in laboratories for more than forty years, in many countries and for stakes from small change to several months of wages. A meta analysis of 37 papers, holding 75 separate results, found that on average the person splitting offers 40 of every 100, and that about 16 of every 100 offers are refused. The share offered falls somewhat when the pot is larger, and the chance of refusal falls as the offer rises."));
  ui.para(T("ul-e-p2", "Both halves of that matter. The offers are nowhere near the smallest possible amount, and the refusals are real: people pay, out of their own money, for the right to say no to a division they consider an insult."));
  ui.para(T("ul-e-p3", "The reason the offers are high is not necessarily kindness. Someone who expects to be refused and wants coins will offer more, so generous behaviour and calculating behaviour look identical from the outside on the splitting side of the table. The refusals are what cannot be explained that way, because there is nothing left to calculate: it is the last move of the game and refusing is strictly worse in coins."));

  ui.sub(T("ul-e-sub1", "Why this is not a small point"));
  ui.list([
    T("ul-e-l1", "Every bargain outside a laboratory has a threshold like the one you just showed. Wage talks, a divorce, a supplier renegotiating a contract: what one side will accept is not simply the best they can get."),
    T("ul-e-l2", "A model that assumes people take any positive amount will predict the wrong split, and will be surprised by walkouts that were entirely predictable to anybody in the room."),
    T("ul-e-l3", "The threshold is not a fixed human constant either. It moves with the size of the pot, with what people know about how the pot arose, and with where the players are from.")
  ]);

  ui.sub(T("ul-e-sub2", "What this does not show"));
  ui.list([
    T("ul-e-m1", "The strangers here are one hidden number each, chosen by the author to spread across the range. They are not measurements of anybody and they were not drawn from any published distribution."),
    T("ul-e-m2", "Your own threshold was read off six answers. Six is far too few to measure a person, and the offers you saw were picked to find the edge rather than sampled at random."),
    T("ul-e-m3", "The coins are not money. Playing for nothing is not the same as playing for a week of wages, and the published work finds that stakes change behaviour, though less than most people expect."),
    T("ul-e-m4", "One round with a stranger you never meet again is the pure case. Most real bargaining is repeated and public, where refusing has a further purpose this game removes on purpose."),
    T("ul-e-m5", "The average offer of 40 of every 100 is an average across countries and designs. It is not a prediction about the next person you bargain with.")
  ]);

  ui.sub(T("ul-e-src", "Sources"));
  ui.sources([
    { what: T("ul-src1", "The experimental record."),
      cite: "Hessel Oosterbeek, Randolph Sloof and Gijs van de Kuilen, Cultural Differences in Ultimatum Game Experiments: Evidence from a Meta Analysis, Experimental Economics 7(2), 2004, pages 171 to 188. Working paper text.",
      url: "https://econwpa.ub.uni-muenchen.de/econ-wp/exp/papers/0401/0401003.pdf",
      tail: T("ul-src-tail", "Read 2026 08 21.") },
    { what: T("ul-src2", "The first experiment."),
      cite: "Werner Güth, Rolf Schmittberger and Bernd Schwarze, An experimental analysis of ultimatum bargaining, Journal of Economic Behavior and Organization 3(4), 1982, pages 367 to 388.",
      url: "https://econpapers.repec.org/RePEc:eee:jeborg:v:3:y:1982:i:4:p:367-388",
      tail: T("ul-src-tail", "Read 2026 08 21.") },
    { what: T("ul-src3", "Equilibrium and backward induction."),
      cite: "John F. Nash, Equilibrium Points in n Person Games, Proceedings of the National Academy of Sciences 36(1), 1950, pages 48 and 49.",
      url: "https://pmc.ncbi.nlm.nih.gov/articles/PMC1063129/",
      tail: T("ul-src-tail", "Read 2026 08 21.") }
  ]);

  var p = el("p");
  p.appendChild(document.createTextNode(T("ul-fam", "The rest of the family, including one about a pasture and one about a coin: ")));
  var a = el("a", null, T("ul-fam-a", "all of the games are here"));
  a.href = "../../game.html";
  p.appendChild(a);
  p.appendChild(document.createTextNode("."));
  ui.panel.appendChild(p);

  var r = ui.actions();
  ui.btn(r, T("ul-b-again", "Sit down again"), T("ul-k-again", "again"), function () {
    store.wipe();
    G.part = 1; G.round = 0; G.coins = 0; G.given = []; G.taken = []; G.offer = 5;
    beginOffer();
  }, "big");
  ui.say(T("ul-s-end", "The ending. On average people offer forty of every hundred, and about sixteen of every hundred offers are refused."));
};

/* ============================================================
   6. keyboard, boot, and a hook for testing
   ============================================================ */

KW.keys(function (k, e) {
  if (G.view === "offer") {
    if (k === "enter") { e.preventDefault(); ui.acted = true; propose(G.offer); }
    else if (k === "arrowleft") { setOffer(G.offer - 1); }
    else if (k === "arrowright") { setOffer(G.offer + 1); }
  } else if (G.view === "answer") {
    if (k === "y") { ui.acted = true; answer(true); }
    else if (k === "n") { ui.acted = true; answer(false); }
  }
});

KW.$("menuBtn").addEventListener("click", function () {
  ui.acted = true; G.last = null; view("title");
});

window.__G = {
  state: G, pot: POT, strangers: STRANGERS, incoming: INCOMING,
  view: function () { return G.view; },
  offer: function (n) { ui.acted = true; if (G.view === "offer") propose(clamp(n, 0, POT)); },
  answer: function (yes) { ui.acted = true; if (G.view === "answer") answer(!!yes); },
  coins: function () { return G.coins; },
  press: function (label) {
    var bs = ui.panel.querySelectorAll("button");
    for (var i = 0; i < bs.length; i++) {
      if (bs[i].textContent.toLowerCase().indexOf(label.toLowerCase()) === 0) { bs[i].click(); return true; }
    }
    return false;
  },
  buttons: function () {
    return Array.prototype.map.call(ui.panel.querySelectorAll("button"), function (b) { return b.textContent; });
  }
};

document.addEventListener("langchange", function () {
  if (ctx) view(G.view);
});

KW.start({
  draw: drawWorld,
  ready: function () { ctx = KW.ctx; view("title"); }
});

})();
</script>

(function(){

  var KEY = "lang", lang = "en";

    var l = (navigator.languages && navigator.languages[0]) || navigator.language || "";
    l = String(l).toLowerCase();
    if (l.indexOf("de") === 0) return "de";
    if (l.indexOf("tr") === 0) return "tr";

     declares its own words later is still heard. */

      if (src[i] && src[i][l]) for (k in src[i][l]) out[k] = src[i][l][k];
    }

  }
  function known(l){
